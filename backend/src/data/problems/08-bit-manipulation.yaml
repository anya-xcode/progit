  - slug: single-number-iii
    title: "Single Number III"
    difficulty: Medium
    topic: "Bit Manipulation"
    subtopic: "Interview Problems"
    tags: ["bit-manipulation", "array"]
    sourceUrl: "https://leetcode.com/problems/single-number-iii/"
    statement: |
      In the integer array `nums`, exactly two distinct values occur **once**, and
      every other value occurs **exactly twice**. Find the two values that occur once.

      Try to use linear time and only constant extra memory.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the two values that appear once, in **ascending** order, separated by a
      space.
    constraints:
      - "2 <= n <= 2 * 10^4"
      - "-10^9 <= nums[i] <= 10^9"
      - "Exactly two values appear once; all others appear exactly twice."
    examples:
      - input: |
          6
          4 9 4 -3 7 7
        output: |
          -3 9
        explanation: "4 and 7 each appear twice; -3 and 9 appear once and are printed smallest first."
      - input: |
          2
          8 5
        output: |
          5 8
        explanation: "Both values appear once."
    hints:
      - "A hash map of counts solves it in O(n) space. Can XOR do better?"
      - "XOR of the whole array cancels the paired values and leaves a ^ b, where a and b are the answers. Since a != b, this is non-zero."
      - "Pick any set bit of a ^ b (for example the lowest, x & -x). a and b differ there, so splitting the array by that bit puts them in different groups; XOR each group separately."
    explanation: |
      **Sorting - O(n log n) time, O(1) extra space.** Sort, then walk in steps: a value
      not equal to its neighbour is a single.

      **Frequency map - O(n) time, O(n) space.** Count occurrences and report the two
      values with count 1.

      **XOR partitioning - O(n) time, O(1) space.** XOR all elements to get
      `x = a ^ b`. Isolate one bit where `a` and `b` differ with `mask = x & -x`. Every
      pair lands wholly in one of the two groups `num & mask != 0` and
      `num & mask == 0`, so XOR-ing each group cancels the pairs and leaves `a` in one
      group and `b` in the other. Order the two results before printing. (Python's
      arbitrary-precision integers make `x & -x` work for negative values too; in
      fixed-width languages beware of the minimum integer.)
    starterCode:
      python: |
        import sys
        from typing import List


        def single_number(nums: List[int]) -> List[int]:
            # Return the two values that appear exactly once, in ascending order.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            a, b = single_number(nums)
            print(a, b)


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def single_number(nums: List[int]) -> List[int]:
            combined = 0
            for value in nums:
                combined ^= value
            mask = combined & -combined
            first = 0
            second = 0
            for value in nums:
                if value & mask:
                    first ^= value
                else:
                    second ^= value
            return sorted([first, second])


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            a, b = single_number(nums)
            print(a, b)


        if __name__ == "__main__":
            main()
