      python: |
        import sys
        from typing import List, Tuple


        def count_primes_in_ranges(queries: List[Tuple[int, int]]) -> List[int]:
            limit = max(r for _, r in queries)
            sieve = bytearray([1]) * (limit + 1)
            sieve[0] = 0
            if limit >= 1:
                sieve[1] = 0
            p = 2
            while p * p <= limit:
                if sieve[p]:
                    step = len(range(p * p, limit + 1, p))
                    sieve[p * p::p] = bytearray(step)
                p += 1

            prefix = [0] * (limit + 1)
            running = 0
            for value in range(limit + 1):
                running += sieve[value]
                prefix[value] = running

            answers = []
            for left, right in queries:
                answers.append(prefix[right] - prefix[left - 1])
            return answers


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            q = int(data[0])
            queries = []
            for i in range(q):
                queries.append((int(data[1 + 2 * i]), int(data[2 + 2 * i])))
            answers = count_primes_in_ranges(queries)
            sys.stdout.write("\n".join(str(value) for value in answers) + "\n")


        if __name__ == "__main__":
            main()
