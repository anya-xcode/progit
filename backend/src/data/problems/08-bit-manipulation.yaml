  - sheetId: prob-8-3-4-prime-factorisation-of-a-
    slug: prime-factorisation-of-a-number
    title: "Prime factorisation of a Number"
    difficulty: Hard
    topic: "Math"
    subtopic: "Advanced Maths"
    tags: ["math", "sieve", "primes", "number-theory"]
    sourceUrl: "https://www.naukri.com/code360/problems/prime-factorisation-of-a-number"
    statement: |
      Every integer greater than `1` can be written as a product of primes in exactly
      one way, apart from the order of the factors. For each query, print that
      factorisation: the prime factors of `n` **with their multiplicities**, in
      non-decreasing order.

      So `12` becomes `2 2 3` (because `12 = 2 * 2 * 3`) and `97` becomes `97`.

      `1` is the empty product, so its answer is an empty line.

      There can be up to a thousand queries, so a fresh `O(sqrt(n))` factorisation each
      time is wasteful - precompute once and answer each query in `O(log n)`.
    inputFormat: |
      - Line 1: an integer `q`, the number of queries.
      - Next `q` lines: one integer `n` each.
    outputFormat: |
      Print `q` lines. Line `i` holds the prime factors of the `i`-th `n` repeated
      according to their multiplicity, in non-decreasing order, separated by single
      spaces. Print an empty line when `n = 1`.
    constraints:
      - "1 <= q <= 1000"
      - "1 <= n <= 10^6"
    examples:
      - input: |
          3
          12
          97
          1
        output: |
          2 2 3
          97

        explanation: "12 = 2 * 2 * 3, so the 2 is printed twice. 97 is prime. 1 is the empty product, so the third line is empty."
      - input: |
          2
          1000000
          360
        output: |
          2 2 2 2 2 2 5 5 5 5 5 5
          2 2 2 3 3 5
        explanation: "1000000 = 10^6 = 2^6 * 5^6, so six 2s followed by six 5s. 360 = 2^3 * 3^2 * 5."
    hints:
      - "For a single number, dividing out 2, then 3, then 4, ... up to sqrt(n) works and costs O(sqrt(n)). With 1000 queries that is a thousand times 1000 steps - acceptable, but there is something much better."
      - "Precompute, for every value up to 10^6, its smallest prime factor. Start from an array spf[i] = i, then for each prime p mark spf[m] = p for every multiple m of p that has not been marked yet."
      - "With that table, factorising n is a loop: append spf[n], divide n by spf[n], repeat until n is 1. Each division at least halves n, so it takes at most log2(n) steps - about 20."
    explanation: |
      **Trial division per query - O(q * sqrt(N)) time, O(1) extra space.** For each
      `n`, divide out `2`, then `3`, then `4`, ... while `d * d <= n`, appending `d`
      each time it divides; whatever is left above `1` is a final prime factor. For
      `N = 10^6` that is `1000` steps per query, so `10^6` steps overall - fine here,
      and the right choice when `n` can be as large as `10^12`.

      **Smallest-prime-factor sieve - O(N log log N) precomputation, then O(log n) per
      query.**

      1. Fill `spf[i] = i` for all `i <= N`.
      2. For `p` from `2` while `p * p <= N`: if `spf[p] == p` then `p` is prime, so for
         every multiple `m = p*p, p*p+p, ...` set `spf[m] = p` **only if** `spf[m]` is
         still `m`. The guard keeps the *smallest* prime factor, since primes are
         processed in increasing order.
      3. To factorise `n`: while `n > 1`, output `spf[n]` and replace `n` by
         `n / spf[n]`.

      Because `spf[n]` is the smallest prime factor, the factors come out in
      non-decreasing order automatically, with no sorting. Every step divides `n` by at
      least `2`, so a query takes at most `log2(10^6) < 20` iterations - the answer is
      also at most 20 numbers long.

      **Cost and trade-off.** The sieve touches about `N log log N` entries (a few
      million operations) and stores an array of `N + 1` integers. That is a clear win
      once `q` reaches the hundreds, and a waste for a single query - the usual
      precompute-versus-query trade-off.

      **Related.** Replacing the list of factors by `(prime, exponent)` pairs gives the
      canonical form `n = p1^e1 * p2^e2 * ...`, from which the number of divisors
      `(e1+1)(e2+1)...` and the sum of divisors follow immediately.
