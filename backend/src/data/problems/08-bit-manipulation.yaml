    referenceSolution:
      python: |
        import sys
        from typing import List


        def divisors(n: int) -> List[int]:
            small: List[int] = []
            large: List[int] = []
            d = 1
            while d * d <= n:
                if n % d == 0:
                    small.append(d)
                    if d != n // d:
                        large.append(n // d)
                d += 1
            large.reverse()
            return small + large


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            q = int(data[0])
            out = []
            for i in range(1, q + 1):
                out.append(" ".join(str(d) for d in divisors(int(data[i]))))
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
