    referenceSolution:
      python: |
        import sys
        from typing import List


        def power_set(s: str) -> List[str]:
            letters = sorted(s)
            n = len(letters)
            subsets = []
            for mask in range(1 << n):
                chosen = []
                for i in range(n):
                    if mask >> i & 1:
                        chosen.append(letters[i])
                subsets.append("".join(chosen))
            subsets.sort()
            return subsets


        # --- Input/output handling ---
        def main():
            s = sys.stdin.read().split()[0]
            subsets = power_set(s)
            out = [str(len(subsets))]
            out.extend(subsets)
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
