  - sheetId: prob-8-3-2-divisors-of-a-number
    slug: divisors-of-a-number
    title: "Divisors of a Number"
    difficulty: Easy
    topic: "Math"
    subtopic: "Advanced Maths"
    tags: ["math", "number-theory"]
    sourceUrl: "https://www.naukri.com/code360/problems/divisors-of-a-number"
    statement: |
      A **divisor** of `n` is a positive integer `d` such that `n` divided by `d`
      leaves no remainder. Every `n >= 1` has at least the divisors `1` and `n` (which
      coincide when `n = 1`).

      For each query, print all divisors of `n` in **increasing** order.

      Answer the `q` queries in the order they are given.
    inputFormat: |
      - Line 1: an integer `q`, the number of queries.
      - Next `q` lines: one integer `n` each.
    outputFormat: |
      Print `q` lines. Line `i` holds every divisor of the `i`-th `n` in increasing
      order, separated by single spaces.
    constraints:
      - "1 <= q <= 20"
      - "1 <= n <= 10^9"
    examples:
      - input: |
          3
          36
          13
          1
        output: |
          1 2 3 4 6 9 12 18 36
          1 13
          1
        explanation: "36 is divisible by 1, 2, 3, 4, 6, 9, 12, 18 and 36. 13 is prime, so only 1 and 13 divide it. 1 has the single divisor 1."
      - input: |
          2
          100
          49
        output: |
          1 2 4 5 10 20 25 50 100
          1 7 49
        explanation: "The divisors of 100 are 1, 2, 4, 5, 10, 20, 25, 50, 100 - note that 10 is counted once even though 100 = 10 * 10. For 49 they are 1, 7 and 49."
    hints:
      - "Divisors come in pairs: if d divides n then so does n / d. One member of the pair is always <= sqrt(n)."
      - "So loop d from 1 while d * d <= n. Whenever d divides n, you have found both d and n / d - collect the small ones in one list and the large ones in another."
      - "Be careful with a perfect square: when d * d == n the two members of the pair are the same number, so record it only once. Reversing the list of large divisors and appending it to the small ones gives the full sorted answer without a sort."
    explanation: |
      **Check every candidate - O(n) time.** Loop `d` from `1` to `n` and keep those
      that divide. Correct, already sorted, but `10^9` iterations per query is far too
      slow.

      **Pair up around the square root - O(sqrt(n)) time, O(number of divisors)
      space.** If `d` divides `n`, then `n / d` divides `n` too, and exactly one of the
      pair is at most `sqrt(n)`. So loop `d` from `1` while `d * d <= n`; whenever
      `n % d == 0`, push `d` onto a "small" list and `n / d` onto a "large" list,
      skipping the second push when `d == n / d` (a perfect square, where the pair
      collapses to one value).

      The small list is produced in increasing order and the large list in decreasing
      order, so reversing the large list and concatenating gives the full sorted answer
      with **no sorting step** - just `O(k)` work for `k` divisors.

      The loop runs fewer than `31623` times for `n <= 10^9`, so 20 queries cost well
      under a millisecond each.

      **How many divisors are there?** If `n = p1^e1 * p2^e2 * ...`, the number of
      divisors is `(e1 + 1)(e2 + 1)...`, because each prime's exponent is chosen
      independently. That is at most 1344 for `n <= 10^9`, so the output stays small.

      **Alternative: build them from the factorisation - O(sqrt(n) + k) time.**
      Factorise `n` by trial division, then generate every product of prime powers and
      sort. Same asymptotics, more code, but it is the right approach when you also
      need the divisors of many numbers at once (a sieve that records the smallest
      prime factor makes each factorisation `O(log n)`).
