  - slug: check-if-ith-bit-is-set
    title: "Check if the i-th Bit is Set"
    difficulty: Easy
    topic: "Bit Manipulation"
    subtopic: "Learn Bit Manipulation"
    tags: ["bit-manipulation"]
    sourceUrl: ""
    statement: |
      Given a non-negative integer `n` and an index `i`, determine whether bit `i`
      of `n` is `1` in its binary representation.

      Bits are numbered from the least significant end starting at `0`: bit `0` is
      the ones place, bit `1` the twos place, bit `2` the fours place, and so on.
    inputFormat: |
      - Line 1: two integers `n` and `i`.
    outputFormat: |
      Print `true` if bit `i` of `n` is set, otherwise `false`.
    constraints:
      - "0 <= n <= 10^9"
      - "0 <= i <= 30"
    examples:
      - input: |
          13 2
        output: |
          true
        explanation: "13 in binary is 1101. Reading from the right, bit 0 = 1, bit 1 = 0, bit 2 = 1."
      - input: |
          13 1
        output: |
          false
        explanation: "Bit 1 of 1101 is 0."
    hints:
      - "You could convert n to a binary string, but a single bitwise operation is enough."
      - "`1 << i` is a number whose only set bit is bit i."
      - "Alternatively, shift n right by i positions and look at the lowest bit."
    explanation: |
      **Binary string - O(log n) time, O(log n) space.** Convert `n` to binary (or
      repeatedly divide by 2, `i` times) and inspect the digit for position `i`.

      **Left-shift mask - O(1) time, O(1) space.** `n & (1 << i)` is non-zero exactly
      when bit `i` of `n` is set.

      **Right shift - O(1) time, O(1) space.** `(n >> i) & 1` moves bit `i` into the
      ones place and isolates it. Both bitwise forms are standard and equally fast.
    starterCode:
      python: |
        import sys


        def is_bit_set(n: int, i: int) -> bool:
            # Return True if bit i (0 = least significant) of n is 1.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, i = int(data[0]), int(data[1])
            print("true" if is_bit_set(n, i) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def is_bit_set(n: int, i: int) -> bool:
            return (n & (1 << i)) != 0


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, i = int(data[0]), int(data[1])
            print("true" if is_bit_set(n, i) else "false")


        if __name__ == "__main__":
            main()
