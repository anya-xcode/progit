  - slug: minimum-bit-flips-to-convert-number
    title: "Minimum Bit Flips to Convert Number"
    difficulty: Easy
    topic: "Bit Manipulation"
    subtopic: "Interview Problems"
    tags: ["bit-manipulation"]
    sourceUrl: "https://leetcode.com/problems/minimum-bit-flips-to-convert-number/"
    statement: |
      You are given two non-negative integers `start` and `goal`. In one operation you
      may pick any single bit of `start` (including leading zeros, as if the number
      were written with as many bits as you like) and flip it from `0` to `1` or from
      `1` to `0`.

      Return the minimum number of operations needed to turn `start` into `goal`.
    inputFormat: |
      - Line 1: two integers `start` and `goal`.
    outputFormat: |
      Print a single integer: the minimum number of bit flips.
    constraints:
      - "0 <= start, goal <= 10^9"
    examples:
      - input: |
          10 7
        output: |
          3
        explanation: "10 = 1010 and 7 = 0111. They differ in bits 3, 2 and 0, so three flips are needed."
      - input: |
          9 9
        output: |
          0
        explanation: "The numbers are already equal."
    hints:
      - "Each bit position where the two numbers differ needs exactly one flip, and positions where they agree need none."
      - "Which bitwise operator produces 1 exactly where two bits differ?"
      - "Count the set bits of `start ^ goal`. The trick `x &= x - 1` removes one set bit per iteration."
    explanation: |
      **Compare bit by bit - O(log max) time, O(1) space.** While either number is
      non-zero, compare their lowest bits (`& 1`), count a difference, and shift both
      right.

      **XOR and count - O(k) time, O(1) space.** `start ^ goal` has a 1 exactly at the
      positions that must be flipped. Count its set bits with Brian Kernighan's loop
      `x &= x - 1`, which runs once per set bit `k` (at most about 30 here).
    starterCode:
      python: |
        import sys


        def min_bit_flips(start: int, goal: int) -> int:
            # Return how many bit positions differ between start and goal.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            print(min_bit_flips(int(data[0]), int(data[1])))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def min_bit_flips(start: int, goal: int) -> int:
            diff = start ^ goal
            count = 0
            while diff:
                diff &= diff - 1
                count += 1
            return count


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            print(min_bit_flips(int(data[0]), int(data[1])))


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          10 7
        expectedOutput: |
          3
        hidden: false
      - input: |
          9 9
        expectedOutput: |
          0
        hidden: false
      - input: |
          0 0
        expectedOutput: |
          0
        hidden: true
      - input: |
          0 1
        expectedOutput: |
          1
        hidden: true
      - input: |
          0 1000000000
        expectedOutput: |
          13
        hidden: true
