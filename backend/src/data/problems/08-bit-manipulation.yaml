    referenceSolution:
      python: |
        import sys
        from typing import List


        def power_fraction(x: int, n: int) -> List[int]:
            def power(base: int, exponent: int) -> int:
                if exponent == 0:
                    return 1
                half = power(base, exponent // 2)
                result = half * half
                if exponent % 2 == 1:
                    result *= base
                return result

            if n >= 0:
                return [power(x, n), 1]
            value = power(x, -n)
            if value < 0:
                return [-1, -value]
            return [1, value]


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            x, n = int(data[0]), int(data[1])
            p, q = power_fraction(x, n)
            print("%d/%d" % (p, q))


        if __name__ == "__main__":
            main()
