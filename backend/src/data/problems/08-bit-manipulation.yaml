  - sheetId: prob-8-3-3-count-primes-in-range-l-t
    slug: count-primes-in-range-l-to-r
    title: "Count primes in range L to R"
    difficulty: Hard
    topic: "Math"
    subtopic: "Advanced Maths"
    tags: ["math", "sieve", "primes", "prefix-sum"]
    sourceUrl: "https://leetcode.com/problems/count-primes/"
    statement: |
      A **prime** is an integer greater than `1` whose only positive divisors are `1`
      and itself. `1` is not prime and `2` is the smallest prime.

      Given `q` ranges, count for each one how many primes `p` satisfy
      `L <= p <= R` (both ends included).

      The ranges are independent and may overlap in any way.
    inputFormat: |
      - Line 1: an integer `q`, the number of ranges.
      - Next `q` lines: two integers `L` and `R`.
    outputFormat: |
      Print `q` lines, each the number of primes in the corresponding range.
    constraints:
      - "1 <= q <= 500"
      - "1 <= L <= R <= 10^6"
    examples:
      - input: |
          3
          1 10
          10 20
          1 1
        output: |
          4
          4
          0
        explanation: "Between 1 and 10 the primes are 2, 3, 5 and 7. Between 10 and 20 they are 11, 13, 17 and 19. The range 1..1 contains no prime, since 1 is not one."
      - input: |
          2
          2 2
          14 16
        output: |
          1
          0
        explanation: "2 is prime, so the first range holds exactly one. 14, 15 and 16 are all composite, so the second holds none."
    hints:
      - "Testing each number of each range for primality separately repeats an enormous amount of work when the ranges are large or overlap."
      - "Mark the composites once with a sieve of Eratosthenes up to the largest R: for every prime p, cross out 2p, 3p, ... You can start crossing out at p*p, because every smaller multiple already has a smaller prime factor."
      - "After sieving, build a prefix count: primes_up_to[i] = primes_up_to[i-1] + (1 if i is prime else 0). Each query is then primes_up_to[R] - primes_up_to[L-1], answered in O(1)."
    explanation: |
      **Trial division per query - O(sum of range lengths * sqrt(R)) time.** Testing
      every number of every range costs about `31623 * 10^6` operations in the worst
      case. Hopeless.

      **Sieve of Eratosthenes + prefix sums - O(R log log R + q) time, O(R) space.**
      Two phases:

      1. **Sieve.** Allocate a boolean array up to `R_max = max(R)`, mark `0` and `1`
         as non-prime, and for each `p` with `p * p <= R_max` that is still marked
         prime, cross out `p*p, p*p+p, p*p+2p, ...`. Starting at `p*p` is safe because
         any smaller multiple `k*p` with `k < p` was already removed when its own
         smallest prime factor was processed. The total number of crossings is
         `R * (1/2 + 1/3 + 1/5 + ...) = O(R log log R)` - close to linear.
      2. **Prefix counts.** `primes_up_to[i] = primes_up_to[i-1] + is_prime[i]`. Then
         each query is a single subtraction, `primes_up_to[R] - primes_up_to[L-1]`,
         which is why 500 queries cost nothing once the table exists.

      For `R_max = 10^6` the sieve does a few million operations - well inside the time
      limit - and the two arrays take a few megabytes. Using a `bytearray` and Python's
      slice assignment (`sieve[p*p::p] = bytearray(len(...))`) pushes the crossing-out
      into C and makes it very fast.

      **Why the prefix array and not a list of primes?** With a sorted list of primes
      you could answer each query with two binary searches in `O(log n)`, which is also
      fine. The prefix array trades `O(R)` memory for `O(1)` per query and is simpler
      to get right at the boundaries - just remember that `L - 1` can be `0`.

      **If R were much larger.** For ranges near `10^12` you would sieve the primes up
      to `sqrt(R)` and then run a **segmented** sieve over `[L, R]`, using
      `O(sqrt(R) + (R - L))` memory instead of `O(R)`.
