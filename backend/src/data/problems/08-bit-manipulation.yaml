  - sheetId: prob-8-2-3-power-set-bit-manipulatio
    slug: power-set-bit-manipulation
    title: "Power Set Bit Manipulation"
    difficulty: Medium
    topic: "Bit Manipulation"
    subtopic: "Interview Problems"
    tags: ["bit-manipulation", "bitmask", "subsets"]
    sourceUrl: "https://leetcode.com/problems/subsets/"
    statement: |
      You are given a string `s` of **distinct** lowercase letters. List every subset
      of those letters - the power set - including the empty subset and the full set.
      There are exactly `2^len(s)` of them.

      To make the output unique:

      - Write the letters of each subset in **increasing alphabetical order**.
      - Print the subsets in increasing **lexicographic** order of the resulting
        string. A string that is a prefix of another comes first, so the empty subset
        is always printed first, as an empty line.
    inputFormat: |
      - Line 1: the string `s`, made of distinct lowercase English letters.
    outputFormat: |
      - Line 1: the number of subsets, `2^len(s)`.
      - Then one subset per line, as a string of letters in alphabetical order. The
        empty subset is printed as an empty line.
    constraints:
      - "1 <= len(s) <= 12"
      - "All characters of `s` are distinct lowercase English letters."
    examples:
      - input: |
          abc
        output: |
          8

          a
          ab
          abc
          ac
          b
          bc
          c
        explanation: "Eight subsets. Sorted as strings they are the empty one, a, ab, abc, ac, b, bc, c - note that ab comes before ac and both come before b."
      - input: |
          ba
        output: |
          4

          a
          ab
          b
        explanation: "The letters are first put in alphabetical order, so the subsets are written a and b, never b then a. Sorted, the four lines are the empty one, a, ab, b."
    hints:
      - "There are 2^n subsets and exactly 2^n integers in the range 0 .. 2^n - 1. Let bit i of such a mask mean 'the i-th letter is in the subset'."
      - "For each mask, loop over the bit positions and append the letter whenever `mask >> i & 1` is 1. Sort the letters of s first so each subset comes out alphabetical automatically."
      - "Counting masks from 0 upwards does not produce the strings in lexicographic order (mask 4 gives 'c' but mask 3 gives 'ab'), so sort the collected strings at the end - or generate them with a recursive pre-order walk, which is already sorted."
    explanation: |
      **Bitmask enumeration - O(2^n * n) time, O(2^n * n) space for the output.** The
      subsets of an `n`-element set correspond one-to-one with the integers
      `0 .. 2^n - 1`: bit `i` of the integer says whether element `i` is in. So a single
      loop over the masks, with an inner loop over the `n` bit positions, builds every
      subset. Sorting `s` first makes each subset alphabetical by construction, since
      the bits are visited in increasing index order.

      This is the whole point of the exercise: no recursion, no call stack, just
      counting. The `n` inner steps can be cut to "one step per chosen letter" by
      peeling bits with `mask & -mask` (lowest set bit) and `mask &= mask - 1`.

      **Ordering.** Mask order and lexicographic order are *not* the same. Mask `3`
      (`011`) gives `ab` while mask `4` (`100`) gives `c`, yet `ab < c`. So the
      collected strings are sorted at the end, an extra `O(2^n * n log(2^n)) =
      O(2^n * n^2)` that is invisible at `n = 12`.

      **Recursive alternative - O(2^n * n) time, O(n) recursion depth.** `build(start)`
      records the current buffer and then, for each `i` from `start` to `n - 1`,
      appends letter `i`, recurses on `i + 1` and pops. Recording *before* the loop
      makes it a pre-order walk, which emits the subsets in exactly the required
      lexicographic order with no sorting at all - a prefix is always printed before
      its extensions.

      **Size.** The output has `2^n` lines of average length `n/2`, so about
      `n * 2^(n-1)` characters - 24576 for `n = 12`. That is why the limit is small:
      writing the answer is the dominant cost, and no method can avoid it.
