          42
          -1 -34 26 30 42 -49 -14 -16 33 18 30 -16 -19 -14 -6 -24 -20 -34 -5 -37 -27 24 -1 33 -37 -6 -20 24 6 12 -19 12 -42 18 -42 42 -27 -45 6 -5 -45 -49
        expectedOutput: |
          -24 26
        hidden: true
