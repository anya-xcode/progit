    statement: |
      You are given an array `nums` in which **every value appears exactly twice,
      except one value that appears exactly once**. Find that lonely value.

      The array is not sorted and the two copies of a repeated value may sit anywhere.
      Since every other value is paired up, `n` is always odd.

      Solve it in one pass using only a constant amount of extra memory.
    inputFormat: |
      - Line 1: an integer `n`, the length of the array.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the single integer that appears only once.
    constraints:
      - "1 <= n < 2000 and n is odd"
      - "-10^9 <= nums[i] <= 10^9"
      - "Exactly one value appears once; every other value appears exactly twice."
    examples:
      - input: |
          5
          4 1 2 1 2
        output: |
          4
        explanation: "1 and 2 each appear twice; 4 appears once, so 4 is the answer."
      - input: |
          3
          -7 9 -7
        output: |
          9
        explanation: "-7 is paired, 9 is not. Negative values behave exactly like positive ones here."
    hints:
      - "You need an operation that makes a pair of equal values disappear and leaves a lone value untouched."
      - "XOR does exactly that: x ^ x = 0 and x ^ 0 = x. It is also commutative and associative, so the order of the array does not matter."
      - "XOR the whole array into a single running value starting from 0. Every pair cancels to 0, and what survives is the unique element."
    explanation: |
      **Count with a hash map - O(n) time, O(n) space.** Tally how often each value
      occurs, then return the one with count 1. Straightforward, but it stores up to
      `n/2 + 1` entries.

      **Sort and scan - O(n log n) time, O(1) extra space.** After sorting, pairs sit
      next to each other, so walk in steps of two and return the first position where
      `nums[i] != nums[i+1]` (or the last element). No hash map, but the sort dominates
      and the input is destroyed.

      **XOR everything - O(n) time, O(1) space.** Fold the array with XOR starting from
      `0`. Because XOR is commutative and associative, you may reorder the array freely
      in your head and group the two copies of each repeated value together; each such
      group contributes `x ^ x = 0`, and `0` is the identity, so the fold collapses to
      the single unpaired value. One pass, one accumulator, no extra memory - and it
      never overflows, which a "sum of distinct values times two minus total sum"
      approach can.

      **Why negatives are no problem.** XOR acts on the two's-complement bit patterns,
      and two equal negative numbers have identical patterns, so they cancel just like
      positive ones.

      **Where this generalises.** If every value appeared three times instead of twice,
      XOR would no longer cancel and you would count set bits per position modulo 3
      instead. If two values appeared once, you would XOR everything, isolate any set
      bit of the result with `x & -x`, and split the array on that bit - that is the
      "Single Number III" variant.
