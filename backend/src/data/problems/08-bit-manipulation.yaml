  - slug: power-of-two
    title: "Power of Two"
    difficulty: Easy
    topic: "Bit Manipulation"
    subtopic: "Learn Bit Manipulation"
    tags: ["bit-manipulation", "math"]
    sourceUrl: "https://leetcode.com/problems/power-of-two/"
    statement: |
      Given a 32-bit signed integer `n`, decide whether `n` equals `2^k` for some
      integer `k >= 0` (that is, `n` is one of `1, 2, 4, 8, ...`).

      Zero and negative numbers are never powers of two.
    inputFormat: |
      - Line 1: an integer `n`.
    outputFormat: |
      Print `true` if `n` is a power of two, otherwise `false`.
    constraints:
      - "-2^31 <= n <= 2^31 - 1"
    examples:
      - input: |
          64
        output: |
          true
        explanation: "64 = 2^6. In binary it is 1000000, a single set bit."
      - input: |
          24
        output: |
          false
        explanation: "24 in binary is 11000, which has two set bits."
    hints:
      - "What does the binary representation of a power of two look like?"
      - "Subtracting 1 from a number flips its lowest set bit and every bit below it."
      - "For positive n, `n & (n - 1)` clears the lowest set bit. When is the result 0?"
    explanation: |
      **Repeated division - O(log n) time, O(1) space.** If `n <= 0`, answer `false`.
      Otherwise divide by 2 while the number is even; `n` is a power of two exactly
      when you end at `1`.

      **Count set bits - O(log n) time, O(1) space.** A positive power of two has
      exactly one `1` bit. Count the bits and compare with 1.

      **Clear the lowest set bit - O(1) time, O(1) space.** For `n > 0`,
      `n & (n - 1)` removes the lowest set bit. The result is `0` only if that was the
      sole set bit, so the test is `n > 0 and (n & (n - 1)) == 0`.
    starterCode:
      python: |
        import sys


        def is_power_of_two(n: int) -> bool:
            # Return True if n == 2^k for some k >= 0.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            print("true" if is_power_of_two(int(data[0])) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def is_power_of_two(n: int) -> bool:
            return n > 0 and (n & (n - 1)) == 0


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            print("true" if is_power_of_two(int(data[0])) else "false")


        if __name__ == "__main__":
            main()
