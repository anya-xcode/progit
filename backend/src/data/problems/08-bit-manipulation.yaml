    slug: swap-two-numbers
    title: "Swap Two Numbers"
    difficulty: Easy
    topic: "Bit Manipulation"
    subtopic: "Learn Bit Manipulation"
    tags: ["bit-manipulation", "xor"]
    sourceUrl: "https://www.naukri.com/code360/problems/swap-two-numbers"
    statement: |
      You are given `q` pairs of integers. Swap the two values of each pair and print
      them.

      The exercise is to do it **without a third variable** - no temporary, no tuple
      assignment, no array. Two variables go in, the same two variables come out
      holding each other's value.

      Answer every pair in the order it is given.
    inputFormat: |
      - Line 1: an integer `q`, the number of pairs.
      - Next `q` lines: two integers `a` and `b`.
    outputFormat: |
      Print `q` lines, each with the two swapped values `b` and `a` separated by a
      single space.
    constraints:
      - "1 <= q <= 1000"
      - "-10^9 <= a, b <= 10^9"
    examples:
      - input: |
          2
          3 8
          -4 7
        output: |
          8 3
          7 -4
        explanation: "The first pair becomes 8 3 and the second becomes 7 -4: each line simply prints the two values in the opposite order."
      - input: |
          1
          5 5
        output: |
          5 5
        explanation: "Both values are equal, so swapping changes nothing - a case worth checking, because the XOR method momentarily turns both variables into 0 here and still recovers correctly."
    hints:
      - "XOR undoes itself: (a ^ b) ^ b is a again, and (a ^ b) ^ a is b. That is the whole trick."
      - "Store a ^ b in a, then recover the original a into b with b = a ^ b, and finally recover the original b into a with a = a ^ b."
      - "Arithmetic works too - a = a + b; b = a - b; a = a - b - but it can overflow a fixed-width type when the values are large, while XOR never can."
    explanation: |
      **With a temporary - O(1) time, one extra variable.** `t = a; a = b; b = t`.
      Clear, safe, and what you should write in real code; the restriction here exists
      only to force the bit reasoning.

      **XOR swap - O(1) time, no extra variable.** Run the three assignments

      ```
      a = a ^ b      # a now holds a0 ^ b0
      b = a ^ b      # (a0 ^ b0) ^ b0 = a0
      a = a ^ b      # (a0 ^ b0) ^ a0 = b0
      ```

      The proof is three XOR identities: `x ^ x = 0`, `x ^ 0 = x`, and associativity.
      After the first line `a` is the "difference pattern" of the two values; XOR-ing
      it with either original recovers the other. Since `a0 ^ b0` fits in the same
      number of bits as the inputs, nothing can overflow - this is the main advantage
      over the arithmetic version.

      **The one failure mode.** The XOR swap is wrong when the two variables are the
      *same storage* (for example `swap(arr[i], arr[i])` through references or
      pointers): the first line zeroes that single variable and the value is lost. Two
      distinct variables holding the *same value*, as in the second example, are
      perfectly fine.

      **Arithmetic swap - O(1) time, no extra variable, but risky.**
      `a = a + b; b = a - b; a = a - b` is the same idea with `+`/`-` in place of XOR.
      With `a = b = 10^9` in a signed 32-bit type the first sum already overflows,
      which is undefined behaviour in C++. Multiplication and division fail even harder
      when one value is zero.

      Over `q` pairs the total is `O(q)` time and `O(1)` extra space.
    starterCode:
      python: |
        import sys
        from typing import List


        def swap(a: int, b: int) -> List[int]:
            # Return [b, a] without using a third variable.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            q = int(data[0])
            out = []
            for i in range(q):
                a, b = int(data[1 + 2 * i]), int(data[2 + 2 * i])
                first, second = swap(a, b)
                out.append("%d %d" % (first, second))
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def swap(a: int, b: int) -> List[int]:
            a = a ^ b
            b = a ^ b
            a = a ^ b
            return [a, b]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            q = int(data[0])
            out = []
            for i in range(q):
                a, b = int(data[1 + 2 * i]), int(data[2 + 2 * i])
                first, second = swap(a, b)
                out.append("%d %d" % (first, second))
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
