  - sheetId: prob-8-1-6-setunset-the-rightmost-un
    slug: set-unset-the-rightmost-unset-bit
    title: "Set/Unset the rightmost unset bit"
    difficulty: Easy
    topic: "Bit Manipulation"
    subtopic: "Learn Bit Manipulation"
    tags: ["bit-manipulation"]
    sourceUrl: "https://www.naukri.com/code360/problems/setunset-the-rightmost-unset-bit"
    statement: |
      Write `n` in binary **without leading zeros** and let `L` be the number of digits
      it has. (For `n = 0` the representation is the single digit `0`, so `L = 1`.)

      Among the bits at positions `0` to `L - 1`, find the **rightmost one that is
      `0`** - the unset bit with the smallest index - and turn it into a `1`. Print the
      resulting value.

      If all `L` bits are already `1` (that is, `n` is `1`, `3`, `7`, `15`, ...), there
      is nothing to set inside the representation, so print `n` unchanged.

      Answer `q` independent queries.
    inputFormat: |
      - Line 1: an integer `q`, the number of queries.
      - Next `q` lines: one integer `n` each.
    outputFormat: |
      Print `q` lines, one answer per query.
    constraints:
      - "1 <= q <= 1000"
      - "0 <= n <= 10^9"
    examples:
      - input: |
          3
          10
          12
          0
        output: |
          11
          13
          1
        explanation: "10 is 1010; its bit 0 is the rightmost zero, and setting it gives 1011 = 11. 12 is 1100; setting bit 0 gives 1101 = 13. 0 is written as the single digit 0, so setting that digit gives 1."
      - input: |
          2
          7
          11
        output: |
          7
          15
        explanation: "7 is 111 - all three of its bits are already 1, so it is printed unchanged. 11 is 1011, whose rightmost zero is bit 2; setting it gives 1111 = 15."
    hints:
      - "Adding 1 to n flips the trailing run of 1s to 0s and turns the first 0 above them into a 1 - exactly the bit you are looking for."
      - "So `n | (n + 1)` keeps every bit of n and additionally sets that one zero. Check the claim on 1010 + 1 = 1011 and on 1011 + 1 = 1100."
      - "Two special cases: when every bit is already set, `n & (n + 1)` is 0 and the answer is n itself; and n = 0 must give 1, so handle it before that test."
    explanation: |
      **Scan the bits - O(L) time, O(1) space.** Walk `i` from `0` upwards until
      `(n >> i) & 1` is `0`, then return `n | (1 << i)`. Stop at `i = L` and return `n`
      if you never found a zero. Clear, and only about 30 iterations here.

      **One expression - O(1) time, O(1) space.** Look at what `n + 1` does: the
      trailing block of `1`s becomes `0`s, and the first `0` above that block becomes
      `1`. Everything higher is untouched. So `n + 1` differs from `n` exactly on the
      trailing `1`s (lost) and the first `0` (gained), and `n | (n + 1)` keeps all of
      `n`'s bits while adding that gained bit - which is precisely the rightmost unset
      bit.

      Example: `n = 1011`, `n + 1 = 1100`, `n | (n+1) = 1111`. The rightmost zero of
      `1011` is bit 2, and that is the bit that appeared.

      **The two special cases.**

      - If `n` is `2^L - 1` (all ones), `n + 1 = 2^L` and `n | (n + 1)` would set a
        *new* bit above the representation, which the problem forbids. Detect it with
        `n & (n + 1) == 0` and return `n`.
      - `n = 0` also satisfies `n & (n + 1) == 0`, but its representation is the single
        digit `0`, whose bit is unset, so the answer is `1`. Test for it first.

      **The mirror trick.** Unsetting the rightmost **set** bit is `n & (n - 1)`, and
      isolating it is `n & -n`. The pattern is the same: `n - 1` and `n + 1` both
      rewrite exactly the trailing run, so combining them with `&` or `|` edits one
      bit in constant time.

      Over `q` queries the total is `O(q)` time and `O(1)` extra space.
    starterCode:
      python: |
        import sys


        def set_rightmost_unset_bit(n: int) -> int:
            # Set the lowest zero bit inside n's binary representation,
            # or return n unchanged when every bit of it is already 1.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            q = int(data[0])
            out = []
            for i in range(1, q + 1):
                out.append(str(set_rightmost_unset_bit(int(data[i]))))
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def set_rightmost_unset_bit(n: int) -> int:
            if n == 0:
                return 1
            if n & (n + 1) == 0:
                return n
            return n | (n + 1)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            q = int(data[0])
            out = []
            for i in range(1, q + 1):
                out.append(str(set_rightmost_unset_bit(int(data[i]))))
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
