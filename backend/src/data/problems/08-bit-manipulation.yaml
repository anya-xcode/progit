      python: |
        import sys
        from typing import List


        def single_number(nums: List[int]) -> int:
            result = 0
            for value in nums:
                result ^= value
            return result


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(single_number(nums))


        if __name__ == "__main__":
            main()
