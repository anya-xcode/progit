    referenceSolution:
      python: |
        import sys
        from typing import List


        def prime_factorisations(queries: List[int]) -> List[List[int]]:
            limit = max(queries)
            spf = list(range(limit + 1))
            p = 2
            while p * p <= limit:
                if spf[p] == p:
                    for multiple in range(p * p, limit + 1, p):
                        if spf[multiple] == multiple:
                            spf[multiple] = p
                p += 1

            answers: List[List[int]] = []
            for value in queries:
                factors: List[int] = []
                while value > 1:
                    prime = spf[value]
                    factors.append(prime)
                    value //= prime
                answers.append(factors)
            return answers


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            q = int(data[0])
            queries = [int(data[i]) for i in range(1, q + 1)]
            out = []
            for factors in prime_factorisations(queries):
                out.append(" ".join(str(p) for p in factors))
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
