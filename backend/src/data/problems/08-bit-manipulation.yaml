  - slug: divide-two-integers
    title: "Divide Two Integers"
    difficulty: Medium
    topic: "Bit Manipulation"
    subtopic: "Interview Problems"
    tags: ["bit-manipulation", "math"]
    sourceUrl: "https://leetcode.com/problems/divide-two-integers/"
    statement: |
      Given two integers `dividend` and `divisor`, compute their quotient **without**
      using the multiplication (`*`), division (`/`, `//`) or modulo (`%`) operators.
      Addition, subtraction and bit shifts are allowed.

      The quotient is **truncated toward zero**: `7 / -2` gives `-3`, not `-4`.

      Pretend you live in a 32-bit signed world: if the true quotient is greater than
      `2^31 - 1`, return `2^31 - 1`; if it is less than `-2^31`, return `-2^31`.
    inputFormat: |
      - Line 1: two integers `dividend` and `divisor`.
    outputFormat: |
      Print a single integer: the truncated quotient, clamped to `[-2^31, 2^31 - 1]`.
    constraints:
      - "-2^31 <= dividend, divisor <= 2^31 - 1"
      - "divisor != 0"
    examples:
      - input: |
          43 5
        output: |
          8
        explanation: "43 / 5 = 8.6, which truncates to 8."
      - input: |
          -7 2
        output: |
          -3
        explanation: "-7 / 2 = -3.5. Truncating toward zero gives -3."
    hints:
      - "Work with absolute values and fix the sign at the end. The sign is negative when exactly one input is negative."
      - "Subtracting the divisor one copy at a time can take two billion steps. Subtract bigger chunks instead."
      - "Find the largest k such that divisor << k still fits inside the remaining dividend, subtract it, and add 1 << k to the quotient. Repeat."
    explanation: |
      **Repeated subtraction - O(|dividend| / |divisor|) time, O(1) space.** Subtract
      `|divisor|` from `|dividend|` until it no longer fits, counting the steps. Dividing
      `2^31` by `1` needs about two billion iterations.

      **Doubling (shift) subtraction - O(log^2 N) time, O(1) space.** While the remainder
      is at least `|divisor|`, double a copy of the divisor with `<< 1` (and a matching
      multiple starting at 1) as long as the doubled value still fits, then subtract it
      and add the multiple to the quotient.

      **Bit-by-bit long division - O(log N) time, O(1) space.** For `k` from 31 down to
      0, if `(|divisor| << k) <= remainder`, subtract it and set bit `k` of the quotient.
      This is binary long division, with at most 32 steps. Finally apply the sign and
      clamp: the only overflowing case is `-2^31 / -1`, whose true quotient `2^31` must
      be reported as `2^31 - 1`.
    starterCode:
      python: |
        import sys

        INT_MAX = 2**31 - 1
        INT_MIN = -(2**31)


        def divide(dividend: int, divisor: int) -> int:
            # Return dividend / divisor truncated toward zero, clamped to 32-bit range.
            # Do not use *, / , // or %.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            print(divide(int(data[0]), int(data[1])))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys

        INT_MAX = 2**31 - 1
        INT_MIN = -(2**31)


        def divide(dividend: int, divisor: int) -> int:
            negative = (dividend < 0) != (divisor < 0)
            remainder = abs(dividend)
            base = abs(divisor)
            quotient = 0
            for shift in range(32, -1, -1):
                if (base << shift) <= remainder:
                    remainder -= base << shift
                    quotient += 1 << shift
            if negative:
                quotient = -quotient
            return max(INT_MIN, min(INT_MAX, quotient))


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            print(divide(int(data[0]), int(data[1])))


        if __name__ == "__main__":
            main()
