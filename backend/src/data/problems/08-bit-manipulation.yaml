      **Division - O(1) time, O(1) space.** `n % 2 != 0` is correct everywhere, but in
      C++ and Java the remainder of a negative number is negative, so the common
      shortcut `n % 2 == 1` silently fails for `-7`. Writing `abs(n) % 2 == 1` or
      `n % 2 != 0` fixes it. Integer division is also one of the slowest arithmetic
      instructions.

      **Lowest bit - O(1) time, O(1) space.** A binary number is
      `... + 4*b2 + 2*b1 + 1*b0`; every term except the last is even, so the parity of
      the number is the value of `b0`. Isolating it is `n & 1`, which is a single cheap
      instruction. It works unchanged for negative numbers because two's complement
      does not disturb bit `0`: `-7` ends in `...11001`, whose last bit is `1`.

      **Why not `n >> 1 << 1 == n`?** That also works (shifting right then left clears
      bit 0, so the value changes exactly when the number is odd), but it is two
      instructions instead of one and is easy to get wrong for negatives in languages
      without an arithmetic right shift.

      With `q` queries the total cost is `O(q)` time and `O(1)` extra space.
