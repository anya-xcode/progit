      - "`n & 1` keeps only that last bit, giving 1 for odd and 0 for even - one instruction, no division."
      - "Two's complement keeps bit 0 intact for negative values, so `n & 1` is still correct for them. Watch out for `n % 2` in C++ or Java, which returns -1 for a negative odd number, so comparing it with 1 would be wrong."
