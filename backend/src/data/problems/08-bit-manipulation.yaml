  - sheetId: prob-8-3-5-powxn
    slug: pow-x-n-2
    title: "Pow(x,n)"
    difficulty: Medium
    topic: "Math"
    subtopic: "Advanced Maths"
    tags: ["math", "recursion", "binary-exponentiation"]
    sourceUrl: "https://leetcode.com/problems/powx-n/"
    statement: |
      Given integers `x` and `n`, compute `x` raised to the power `n`.

      A negative exponent means a reciprocal: `x^(-k)` is `1 / x^k`. To keep the answer
      exact - no rounding, no floating point - print it as a **reduced fraction**
      `p/q`:

      - `q` is always positive, and `p` and `q` share no common factor greater than 1;
      - when the value is a whole number, `q` is `1` (so `2^10` prints as `1024/1`);
      - the sign, if any, belongs to `p`.

      By convention `x^0 = 1` for every `x`, including `x = 0`. When `n` is negative,
      `x` is guaranteed not to be `0`.

      Because `p` can have dozens of digits, use exact integer arithmetic.
    inputFormat: |
      - Line 1: two integers `x` and `n`.
    outputFormat: |
      Print the value of `x^n` as a reduced fraction `p/q`, written with no spaces
      around the slash.
    constraints:
      - "-20 <= x <= 20"
      - "-30 <= n <= 30"
      - "If `n < 0` then `x != 0`."
    examples:
      - input: |
          2 10
        output: |
          1024/1
        explanation: "2^10 = 1024, a whole number, so the denominator is 1."
      - input: |
          -2 -3
        output: |
          -1/8
        explanation: "(-2)^3 = -8, so (-2)^(-3) = 1 / (-8) = -1/8. The denominator is kept positive and the sign moves to the numerator."
    hints:
      - "Multiplying x by itself n times takes n steps. You can do far better by noticing that x^n = (x^(n/2))^2 when n is even."
      - "Write the recursion carefully: compute half = power(x, n // 2) exactly once, square it, and multiply by one extra x when n is odd. Computing power(x, n//2) twice would defeat the whole point."
      - "Handle the negative exponent by computing x^|n| and then inverting: the fraction is 1/value, and if value is negative move the minus sign to the numerator so the denominator stays positive."
    explanation: |
      **Repeated multiplication - O(|n|) time, O(1) space.** Multiply `x` into an
      accumulator `|n|` times. Correct, and for `|n| <= 30` it is instantaneous - but
      it is the wrong habit: the same problem with `n` up to `10^18` (as in modular
      exponentiation) would never finish.

      **Binary exponentiation, recursive - O(log |n|) time, O(log |n|) recursion
      depth.** Use

      - `power(x, 0) = 1`,
      - `power(x, e) = power(x, e/2)^2` when `e` is even,
      - `power(x, e) = power(x, e/2)^2 * x` when `e` is odd.

      The crucial detail is to evaluate `power(x, e/2)` **once** and store it. Writing
      `power(x, e/2) * power(x, e/2)` looks the same but makes the recursion tree
      branch, turning `O(log e)` into `O(e)`. Each level halves the exponent, so there
      are `floor(log2(e)) + 1` levels - at most 5 here.

      **Binary exponentiation, iterative - O(log |n|) time, O(1) space.** Walk the bits
      of `e` from the least significant: keep `base = x`, and while `e > 0`, multiply
      the answer by `base` when the lowest bit of `e` is 1, then square `base` and shift
      `e` right by one. This is the same computation read through a bitmask, and it is
      the version to memorise - it is exactly `x^e = product of x^(2^i) over the set
      bits i of e`.

      **Negative exponents.** Compute `v = x^|n|` with the routine above, then the
      answer is the fraction `1/v`. That fraction is already in lowest terms because
      the numerator is `1` (or `-1`); the only clean-up needed is moving a minus sign
      from the denominator to the numerator so `q > 0`. For `n >= 0` the answer is
      `v/1`.

      **Size of the numbers.** `20^30` has 40 digits, which overflows 64-bit integers,
      so this version deliberately uses big integers. In the classic floating-point
      form of the problem the same algorithm is used, and the extra care goes into
      `n = -2^31`, whose negation overflows a 32-bit `int`.
