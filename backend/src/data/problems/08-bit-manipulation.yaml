  - slug: xor-of-numbers-in-a-range
    title: "XOR of Numbers in a Range"
    difficulty: Medium
    topic: "Bit Manipulation"
    subtopic: "Interview Problems"
    tags: ["bit-manipulation", "math"]
    sourceUrl: ""
    statement: |
      Given two integers `L` and `R` with `L <= R`, compute
      `L ^ (L + 1) ^ (L + 2) ^ ... ^ R`, the bitwise XOR of every integer in the
      inclusive range.

      The range can contain up to a billion numbers, so aim for a constant-time
      formula.
    inputFormat: |
      - Line 1: two integers `L` and `R`.
    outputFormat: |
      Print a single integer: the XOR of all integers from `L` to `R`.
    constraints:
      - "0 <= L <= R <= 10^9"
    examples:
      - input: |
          3 6
        output: |
          4
        explanation: "3 ^ 4 = 7, 7 ^ 5 = 2, 2 ^ 6 = 4."
      - input: |
          1 4
        output: |
          4
        explanation: "1 ^ 2 = 3, 3 ^ 3 = 0, 0 ^ 4 = 4."
    hints:
      - "XOR is its own inverse: a ^ a = 0. How does that let you express the XOR of L..R using prefix XORs?"
      - "Let F(n) = 0 ^ 1 ^ ... ^ n. Then the answer is F(R) ^ F(L - 1)."
      - "Write out F(n) for n = 0..8. The values repeat with a pattern that depends only on n % 4."
    explanation: |
      **Loop over the range - O(R - L) time, O(1) space.** XOR every number from `L` to
      `R`. Up to `10^9` iterations is too slow.

      **Prefix XOR with a period-4 formula - O(1) time, O(1) space.** Define
      `F(n) = 0 ^ 1 ^ ... ^ n`. Because `a ^ a = 0`, the XOR of `L..R` equals
      `F(R) ^ F(L - 1)` (the common prefix `0..L-1` cancels). Working out the first
      few values shows `F(n)` depends on `n % 4`:

      - `n % 4 == 0` -> `n`
      - `n % 4 == 1` -> `1`
      - `n % 4 == 2` -> `n + 1`
      - `n % 4 == 3` -> `0`

      The pattern holds because every pair `(2k, 2k + 1)` XORs to `1`, and two such
      pairs cancel. Take `F(-1) = 0` for the case `L = 0`.
    starterCode:
      python: |
        import sys


        def range_xor(left: int, right: int) -> int:
            # Return left ^ (left + 1) ^ ... ^ right.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            print(range_xor(int(data[0]), int(data[1])))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def prefix_xor(n: int) -> int:
            if n < 0:
                return 0
            remainder = n % 4
            if remainder == 0:
                return n
            if remainder == 1:
                return 1
            if remainder == 2:
                return n + 1
            return 0


        def range_xor(left: int, right: int) -> int:
            return prefix_xor(right) ^ prefix_xor(left - 1)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            print(range_xor(int(data[0]), int(data[1])))


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          3 6
        expectedOutput: |
          4
        hidden: false
      - input: |
          1 4
        expectedOutput: |
          4
        hidden: false
      - input: |
          0 0
        expectedOutput: |
          0
        hidden: true
      - input: |
          5 5
        expectedOutput: |
          5
        hidden: true
      - input: |
