        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            q = int(data[0])
            out = []
            for i in range(1, q + 1):
                factors = distinct_prime_factors(int(data[i]))
                out.append(" ".join(str(p) for p in factors))
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def distinct_prime_factors(n: int) -> List[int]:
            factors: List[int] = []
            d = 2
            while d * d <= n:
                if n % d == 0:
                    factors.append(d)
                    while n % d == 0:
                        n //= d
                d += 1
            if n > 1:
                factors.append(n)
            return factors


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            q = int(data[0])
            out = []
            for i in range(1, q + 1):
                factors = distinct_prime_factors(int(data[i]))
                out.append(" ".join(str(p) for p in factors))
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
