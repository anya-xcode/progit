  - slug: count-set-bits
    title: "Count Set Bits"
    difficulty: Medium
    topic: "Bit Manipulation"
    subtopic: "Interview Problems"
    tags: ["bit-manipulation", "math"]
    sourceUrl: ""
    statement: |
      Given a positive integer `n`, write every integer from `1` to `n` (inclusive)
      in binary and count how many `1` bits appear in total.

      `n` can be as large as `10^9`, so checking every number one by one is too slow.
    inputFormat: |
      - Line 1: an integer `n`.
    outputFormat: |
      Print a single integer: the total number of set bits over all integers from `1`
      to `n`.
    constraints:
      - "1 <= n <= 10^9"
    examples:
      - input: |
          5
        output: |
          7
        explanation: "1 = 1, 2 = 10, 3 = 11, 4 = 100, 5 = 101. The counts are 1 + 1 + 2 + 1 + 2 = 7."
      - input: |
          8
        output: |
          13
        explanation: "The numbers 1..7 contain 12 set bits in total, and 8 = 1000 adds one more."
    hints:
      - "Counting bits of every number takes O(n log n) - fine for small n, too slow for 10^9."
      - "Look at one bit position at a time: bit b alternates between 2^b zeros and 2^b ones as numbers increase. How many ones does that give up to n?"
      - "Another view: if 2^x is the largest power of two <= n, then 1..2^x - 1 contain x * 2^(x-1) set bits, the leading bit is set in n - 2^x + 1 numbers, and the rest is the same problem for n - 2^x."
    explanation: |
      **Brute force - O(n log n) time, O(1) space.** For each `i` from 1 to `n`, count
      its set bits (for example with `i & (i - 1)` removal) and add them up. With
      `n = 10^9` this is far too slow.

      **Per-bit periodic counting - O(log n) time, O(1) space.** Across `0..n`, bit
      `b` follows a cycle of length `2^(b+1)`: `2^b` zeros then `2^b` ones. The full
      cycles contribute `((n + 1) // 2^(b+1)) * 2^b` ones, and the leftover part
      contributes `max(0, (n + 1) % 2^(b+1) - 2^b)`. Sum over all bit positions.

      **Highest power of two recursion - O(log n) time, O(log n) depth.** Let `x` be
      the index of the highest set bit of `n`, so `2^x <= n`. The numbers
      `1..2^x - 1` contain `x * 2^(x-1)` set bits (each of the `x` lower bits is set in
      half of them). The numbers `2^x..n` each have bit `x` set, contributing
      `n - 2^x + 1`, and their remaining bits range over `0..n - 2^x`, which is the
      same problem on a smaller input. Recurse until `n` becomes 0.
    starterCode:
      python: |
        import sys


        def count_total_set_bits(n: int) -> int:
            # Return the number of 1 bits over all integers 1..n.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            print(count_total_set_bits(int(data[0])))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def count_total_set_bits(n: int) -> int:
            if n <= 0:
                return 0
            x = n.bit_length() - 1
            power = 1 << x
            below = x * (power >> 1)
            leading = n - power + 1
            return below + leading + count_total_set_bits(n - power)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            print(count_total_set_bits(int(data[0])))


        if __name__ == "__main__":
            main()
    testCases:
