  - sheetId: prob-8-1-1-introduction-to-bits-and-
    type: reference
    slug: introduction-to-bits-and-tricks
    title: "Introduction to Bits and Tricks"
    difficulty: Easy
    topic: "Bit Manipulation"
    subtopic: "Learn Bit Manipulation"
    tags: ["bit-manipulation", "theory"]
    sourceUrl: "https://www.naukri.com/code360/problems/introduction-to-bits-and-tricks"
    statement: |
      Every integer in a computer is a fixed-length row of bits. Bit manipulation is
      the habit of working on that row directly instead of going through arithmetic -
      it is usually shorter, always constant time, and it turns several classic
      problems into one-liners.

      ## Reading a number as bits

      A non-negative integer `n` is written in base 2. Bit `i` is the coefficient of
      `2^i`, and bits are numbered from the **right**, starting at `0`:

      ```
             13  =  1   1   0   1
       bit index   3   2   1   0
         value     8 + 4 + 0 + 1
      ```

      So bit `0` of 13 is 1, bit `1` is 0, bit `2` is 1, bit `3` is 1.

      ## Negative numbers: two's complement

      Fixed-width languages store a negative number as **two's complement**: take the
      positive value, flip every bit, add 1. In 32 bits,

      ```
        5  =  00000000 00000000 00000000 00000101
       -5  =  11111111 11111111 11111111 11111011
      ```

      Three consequences worth memorising:

      - The top bit (bit 31 for a 32-bit `int`) is 1 exactly for negative numbers.
      - `-n` equals `~n + 1`, and `~n` equals `-n - 1`.
      - Bit `0` still tells you the parity, so `n & 1` detects odd numbers for negative
        values too - unlike `n % 2`, which is `-1` for odd negatives in C++ and Java.

      Python is the odd one out: its integers are unbounded, so `~` and shifts behave
      as if the two's-complement sign extended for ever. Whenever a problem says
      "32-bit", you have to mask explicitly with `& 0xFFFFFFFF`.

      ## The six operators

      | Operator | Meaning | Example |
      | --- | --- | --- |
      | `a & b` | AND - 1 where **both** are 1 | `12 & 10 = 8` |
      | `a \| b` | OR - 1 where **either** is 1 | `12 \| 10 = 14` |
      | `a ^ b` | XOR - 1 where they **differ** | `12 ^ 10 = 6` |
      | `~a` | NOT - flips every bit | `~12 = -13` |
      | `a << k` | shift left, i.e. multiply by `2^k` | `3 << 2 = 12` |
      | `a >> k` | shift right, i.e. floor-divide by `2^k` | `13 >> 2 = 3` |

      XOR is the one to know best, because of three properties: `x ^ x = 0`,
      `x ^ 0 = x`, and it is commutative and associative. Together they mean that
      XOR-ing a whole array makes every value that appears an **even** number of times
      cancel out.

      ## The tricks you will reuse constantly

      | Goal | Expression | Why |
      | --- | --- | --- |
      | Is bit `i` set? | `(n >> i) & 1` or `n & (1 << i)` | isolate that one bit |
      | Set bit `i` | `n \| (1 << i)` | OR forces a 1 |
      | Clear bit `i` | `n & ~(1 << i)` | AND with a 0 in that place |
      | Flip bit `i` | `n ^ (1 << i)` | XOR with 1 flips |
      | Lowest set bit | `n & -n` | two's complement isolates it |
      | Remove the lowest set bit | `n & (n - 1)` | `n-1` flips the trailing run |
      | Is `n` a power of two? | `n > 0 and (n & (n - 1)) == 0` | exactly one bit set |
      | Set the lowest zero bit | `n \| (n + 1)` | mirror image of the above |
      | Odd? | `n & 1` | bit 0 is the parity |
      | Multiply / divide by `2^k` | `n << k` / `n >> k` | shifting moves the point |
      | Swap without a temp | `a ^= b; b ^= a; a ^= b` | XOR undoes itself |

      `n & (n - 1)` deserves a second look: subtracting 1 turns the lowest `1` into a
      `0` and every `0` below it into a `1`, so ANDing keeps everything above and wipes
      the rest. Counting set bits by repeating `n &= n - 1` therefore takes as many
      steps as there are set bits, not as many as there are bits - this is Brian
      Kernighan's algorithm.

      ## Subsets for free

      An `n`-element set has `2^n` subsets, and the integers `0 .. 2^n - 1` are exactly
      the `2^n` ways of choosing which elements are in. Bit `i` of the mask means
      "element `i` is included". That correspondence turns "generate the power set"
      into a single loop, and it is the reason bitmasks show up all over dynamic
      programming.

      ## Pitfalls

      - **Precedence.** In C++ and Java, `&`, `|` and `^` bind *looser* than `==`, so
        `a & 1 == 0` parses as `a & (1 == 0)`. Parenthesise.
      - **Shifting too far.** Shifting a 32-bit value by 32 or more is undefined in
        C++; use a 64-bit type or shift in two steps.
      - **Signed right shift.** `>>` on a negative number keeps the sign in C++, Java
        and Python. Java's `>>>` shifts zeros in; C++ has no such operator.
      - **Overflow.** `1 << 31` overflows a signed 32-bit `int`. Write `1LL << 31` or
        use an unsigned type.
    explanation: |
      ## Worked micro-examples

      **Check, set, clear, flip bit 2 of 13 (`1101`).**

      - check: `13 >> 2 = 3`, `3 & 1 = 1` - the bit is set.
      - clear: `~(1 << 2) = ...11111011`, and `13 & that = 9` (`1001`).
      - flip: `13 ^ (1 << 2) = 9`; flipping again gives 13 back.
      - set bit 1: `13 | (1 << 1) = 15` (`1111`).

      **Lowest set bit of 12 (`1100`).** `-12` is `...110100`, so `12 & -12 = 4`
      (`100`). And `12 & 11 = 12 & 1011 = 8`, which is 12 with that lowest bit removed.

      **Count the set bits of 23 (`10111`).** `23 -> 22 -> 20 -> 16 -> 0`, four steps,
      so four bits are set.

      **XOR on an array.** In `[4, 1, 2, 1, 2]`, XOR-ing everything gives
      `4 ^ (1 ^ 1) ^ (2 ^ 2) = 4 ^ 0 ^ 0 = 4` - the value that appears once survives.

      ## Quick facts

      - `n` has `floor(log2(n)) + 1` bits for `n >= 1`.
      - The largest signed 32-bit value is `2^31 - 1 = 2147483647`; the smallest is
        `-2^31 = -2147483648`.
      - `x ^ y` has a 1 exactly where `x` and `y` differ, so the number of set bits of
        `x ^ y` is the number of bit flips needed to turn `x` into `y` (the Hamming
        distance).
      - `a + b = (a ^ b) + 2 * (a & b)`: XOR is addition without carries, AND finds
        where the carries happen.
      - Python helpers: `bin(n)`, `n.bit_length()`, `n.bit_count()` (3.10+), and
        `int(s, 2)` to read a binary string.
