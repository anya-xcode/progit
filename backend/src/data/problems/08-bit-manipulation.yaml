  - sheetId: prob-8-3-1-print-prime-factors-of-a-
    slug: print-prime-factors-of-a-number
    title: "Print Prime Factors of a Number"
    difficulty: Hard
    topic: "Math"
    subtopic: "Advanced Maths"
    tags: ["math", "number-theory", "primes"]
    sourceUrl: "https://www.naukri.com/code360/problems/print-prime-factors-of-a-number"
    statement: |
      For each query, print the **distinct** prime numbers that divide `n`, in
      increasing order. Each prime is printed once no matter how many times it divides
      `n`: the answer for `12 = 2 * 2 * 3` is `2 3`, not `2 2 3`.

      `1` has no prime factors, so its answer is an empty line.

      Answer the `q` queries in the order they are given.
    inputFormat: |
      - Line 1: an integer `q`, the number of queries.
      - Next `q` lines: one integer `n` each.
    outputFormat: |
      Print `q` lines. Line `i` holds the distinct prime factors of the `i`-th `n` in
      increasing order, separated by single spaces. Print an empty line when `n = 1`.
    constraints:
      - "1 <= q <= 20"
      - "1 <= n <= 10^9"
    examples:
      - input: |
          3
          12
          97
          1
        output: |
          2 3
          97

        explanation: "12 = 2^2 * 3, so its distinct primes are 2 and 3. 97 is prime, so it is its own only prime factor. 1 has none, hence the empty third line."
      - input: |
          2
          360
          1024
        output: |
          2 3 5
          2
        explanation: "360 = 2^3 * 3^2 * 5 gives 2 3 5. 1024 = 2^10 has the single prime factor 2."
    hints:
      - "Try the possible factors in increasing order. When d divides n, record d and then divide n by d repeatedly until it no longer does - that way d is recorded once and no multiple of d can ever divide the reduced n."
      - "Because you strip each factor completely, the first divisor you meet is always prime: any composite candidate would have had its own smaller prime factor removed earlier."
      - "You only need to try d up to sqrt(n) of the *current* n. Whatever is left above 1 at the end is a prime larger than the square root, so add it too."
    explanation: |
      **Test every candidate for primality - O(n * sqrt(n)) time.** Loop `d` from `2`
      to `n`, and when `d` divides `n` check whether `d` itself is prime. For
      `n = 10^9` that is a billion iterations plus a primality test each - far too
      slow.

      **Trial division with stripping - O(sqrt(n)) time, O(log n) space for the
      answer.** Walk `d` from `2` upwards while `d * d <= n`. If `d` divides `n`,
      append `d` to the answer and then divide `n` by `d` as long as it keeps dividing.
      Finally, if the remaining `n` is greater than `1`, it is a prime factor too.

      Two facts make this correct and fast:

      - **Every recorded `d` is prime.** All primes smaller than `d` were completely
        stripped out, so a composite `d` could not divide what is left.
      - **The loop bound is right.** A number has at most one prime factor greater than
        its square root, so once `d * d > n` the leftover is either `1` or that single
        large prime.

      The loop runs at most `sqrt(10^9) < 31623` times per query, and the repeated
      division only shrinks `n`, so 20 queries are finished in a fraction of a second.
      A distinct-prime list is short - the product of the first 10 primes already
      exceeds `10^9`, so there are never more than 9 of them.

      **Faster still for many queries.** Skipping even candidates after testing `2`
      halves the work; iterating over a precomputed list of primes up to `31623` (built
      once with a sieve) is faster again. For a large batch of *small* numbers, a
      smallest-prime-factor sieve answers every query in `O(log n)` after an
      `O(N log log N)` precomputation - that is the right tool when `n` is bounded by
      about `10^6` and `q` is in the thousands.
    starterCode:
      python: |
