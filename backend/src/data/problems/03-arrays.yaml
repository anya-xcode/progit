  - slug: 3sum
    title: "3Sum"
    difficulty: Medium
    topic: "Arrays"
    subtopic: "Hard Problems"
    tags: [array, two-pointers, sorting]
    sourceUrl: "https://leetcode.com/problems/3sum/"
    statement: |
      Given an integer array `nums`, find every **distinct triplet of values** `[a, b, c]` such
      that `a + b + c == 0` and the three values come from three different positions of the
      array.

      Two triplets are the same if they contain the same values (regardless of which
      positions they came from). Write each triplet in non-decreasing order
      (`a <= b <= c`) and list the triplets in lexicographic order.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      - Line 1: the number of distinct triplets `t`.
      - Next `t` lines: one triplet per line as `a b c` with `a <= b <= c`, in lexicographic
        order (compare `a` first, then `b`, then `c`).

      If there are no triplets, print just `0`.
    constraints:
      - "3 <= n <= 3000"
      - "-10^5 <= nums[i] <= 10^5"
    examples:
      - input: |
          6
          -1 0 1 2 -1 -4
        output: |
          2
          -1 -1 2
          -1 0 1
        explanation: "Two distinct triplets sum to zero: (-1, -1, 2) and (-1, 0, 1). (-1, 0, 1) can be formed in two ways but is listed once."
      - input: |
          4
          1 2 -2 -1
        output: |
          0
