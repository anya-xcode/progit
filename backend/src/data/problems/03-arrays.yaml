  - slug: merge-overlapping-intervals
    title: "Merge Overlapping Intervals"
    difficulty: Medium
    topic: "Arrays"
    subtopic: "Hard Problems"
    tags: [array, sorting, intervals]
    sourceUrl: "https://leetcode.com/problems/merge-intervals/"
    statement: |
      You are given `n` closed intervals `[start, end]` in arbitrary order. Two intervals
      **overlap** if they share at least one point — so intervals that merely touch, such as
      `[1, 3]` and `[3, 5]`, also overlap.

      Repeatedly merge overlapping intervals until no two remaining intervals overlap, and
      print the result sorted by start point.
    inputFormat: |
      - Line 1: an integer `n`.
      - Next `n` lines: two integers `start end` describing one interval.
    outputFormat: |
      Print the merged intervals, one per line as `start end`, in increasing order of `start`.
    constraints:
      - "1 <= n <= 10^4"
      - "0 <= start <= end <= 10^9"
    examples:
      - input: |
          5
          8 10
          1 3
          15 18
          2 6
          9 12
        output: |
          1 6
          8 12
          15 18
        explanation: "[1,3] and [2,6] overlap and become [1,6]; [8,10] and [9,12] become [8,12]; [15,18] stays alone."
      - input: |
          3
          1 4
          4 5
          0 0
        output: |
          0 0
          1 5
        explanation: "[4,5] touches [1,4] at point 4, so they merge into [1,5]; [0,0] shares no point with it."
    hints:
      - "If the intervals were sorted by start, which ones could possibly overlap with a given interval?"
      - "After sorting, compare each interval only with the last merged interval."
      - "Extend the last merged interval's end with max(), since a later interval can be fully contained in it."
    explanation: |
      **Repeated merging — O(n²) time (or worse), O(n) space.** Take an interval, merge every
      other interval that overlaps it, and repeat until nothing changes.

      **Sort + single sweep — O(n log n) time, O(n) space.** Sort intervals by start. Walk
      through them keeping a list of merged intervals. If the current interval's start is
      `<=` the end of the last merged interval, they overlap: set that end to
      `max(last_end, current_end)`. Otherwise, append the current interval as a new block.
      Sorting guarantees that once an interval starts after the current block ends, no later
      interval can reach back into that block.
    starterCode:
      python: |
        import sys
        from typing import List


        def merge_intervals(intervals: List[List[int]]) -> List[List[int]]:
            # Return the merged intervals sorted by start.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            intervals = [[int(data[1 + 2 * i]), int(data[2 + 2 * i])] for i in range(n)]
            for start, end in merge_intervals(intervals):
                print(start, end)


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def merge_intervals(intervals: List[List[int]]) -> List[List[int]]:
            merged = []
            for start, end in sorted(intervals):
                if merged and start <= merged[-1][1]:
                    merged[-1][1] = max(merged[-1][1], end)
                else:
                    merged.append([start, end])
            return merged


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            intervals = [[int(data[1 + 2 * i]), int(data[2 + 2 * i])] for i in range(n)]
            for start, end in merge_intervals(intervals):
                print(start, end)


        if __name__ == "__main__":
            main()
