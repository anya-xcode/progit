    referenceSolution:
      python: |
        import sys
        from typing import List


        def max_product_subarray(nums: List[int]) -> int:
            best = nums[0]
            best_here = nums[0]
            worst_here = nums[0]
            for value in nums[1:]:
                candidates = (value, value * best_here, value * worst_here)
                best_here = max(candidates)
                worst_here = min(candidates)
                if best_here > best:
                    best = best_here
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(max_product_subarray(nums))


        if __name__ == "__main__":
            main()
