  - slug: remove-duplicates-from-sorted-array
    title: "Remove Duplicates from Sorted Array"
    difficulty: Easy
    topic: "Arrays"
    subtopic: "Easy Problems"
    tags: [array, two-pointers]
    sourceUrl: "https://leetcode.com/problems/remove-duplicates-from-sorted-array/"
    statement: |
      You are given an integer array `nums` sorted in non-decreasing order. Rearrange it
      **in place** so that each distinct value appears exactly once at the front of the
      array, keeping their original (sorted) order.

      Return `k`, the number of distinct values. After your function returns, the first
      `k` positions of `nums` must hold the distinct values; what is stored after position
      `k - 1` does not matter.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers in non-decreasing order.
    outputFormat: |
      - Line 1: the count `k` of distinct values.
      - Line 2: the first `k` elements of the modified array, space-separated.
    constraints:
      - "1 <= n <= 3 * 10^4"
      - "-100 <= nums[i] <= 100"
      - "nums is sorted in non-decreasing order"
    examples:
      - input: |
          6
          1 1 2 2 2 3
        output: |
          3
          1 2 3
        explanation: "The distinct values are 1, 2 and 3, so k = 3 and they occupy the first three slots."
      - input: |
          10
          0 0 1 1 1 2 2 3 3 4
        output: |
          5
          0 1 2 3 4
        explanation: "Five distinct values remain: 0, 1, 2, 3, 4."
    hints:
      - "Because the array is sorted, equal values sit next to each other."
      - "Use one pointer for the position where the next distinct value should be written."
      - "Compare each element only with the last value you kept."
    explanation: |
      **Set — O(n log n) time, O(n) space.** Put the elements into a set, sort the set and
      copy it back into the front of the array.

      **Two pointers — O(n) time, O(1) space.** Keep `write = 1` (the first element is always
      kept). Scan `read` from 1 to `n - 1`; whenever `nums[read] != nums[write - 1]`, copy
      it to `nums[write]` and advance `write`. Sorted order guarantees that a value
      different from the last kept one has never been kept before. At the end
      `write` is `k`.
    starterCode:
      python: |
        import sys
        from typing import List


        def remove_duplicates(nums: List[int]) -> int:
            # Move the distinct values to the front of nums (in place) and return their count.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            k = remove_duplicates(nums)
            print(k)
            print(*nums[:k])


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def remove_duplicates(nums: List[int]) -> int:
            write = 1
            for read in range(1, len(nums)):
                if nums[read] != nums[write - 1]:
                    nums[write] = nums[read]
                    write += 1
            return write


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            k = remove_duplicates(nums)
            print(k)
            print(*nums[:k])


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          6
          1 1 2 2 2 3
        expectedOutput: |
          3
          1 2 3
        hidden: false
      - input: |
          10
          0 0 1 1 1 2 2 3 3 4
        expectedOutput: |
