    referenceSolution:
      python: |
        import sys
        from typing import List


        def majority_elements(nums: List[int]) -> List[int]:
            cand1 = cand2 = None
            count1 = count2 = 0
            for value in nums:
                if cand1 is not None and value == cand1:
                    count1 += 1
                elif cand2 is not None and value == cand2:
                    count2 += 1
                elif count1 == 0:
                    cand1, count1 = value, 1
                elif count2 == 0:
                    cand2, count2 = value, 1
                else:
                    count1 -= 1
                    count2 -= 1
                    if count1 == 0:
                        cand1 = None
                    if count2 == 0:
                        cand2 = None

            winners = []
            n = len(nums)
            for cand in (cand1, cand2):
                if cand is not None and nums.count(cand) * 3 > n:
                    winners.append(cand)
            return sorted(winners)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            winners = majority_elements(nums)
            print(len(winners))
            if winners:
                print(" ".join(str(x) for x in winners))


        if __name__ == "__main__":
            main()
