      python: |
        import sys
        from typing import List


        def majority_element(nums: List[int]) -> int:
            candidate = nums[0]
            count = 0
            for x in nums:
                if count == 0:
                    candidate = x
                count += 1 if x == candidate else -1
            return candidate


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(majority_element(nums))


