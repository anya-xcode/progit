  - sheetId: prob-3-3-9-find-the-repeating-and-mi
    slug: find-the-repeating-and-missing-number
    title: "Find the repeating and missing number"
    difficulty: Hard
    topic: "Arrays"
    subtopic: "Hard Problems"
    tags: [array, math, hashing]
    sourceUrl: ""
    statement: |
      An array of length `n` was supposed to contain each of the numbers `1, 2, ..., n` exactly
      once. Something went wrong: one value `x` now appears **twice** and another value `y` is
      **missing** entirely. The array is in no particular order.

      Recover both numbers.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the damaged array.
    outputFormat: |
      Print two integers separated by a space: the repeating value `x` first, then the missing
      value `y`.
    constraints:
      - "2 <= n <= 10^5"
      - "1 <= nums[i] <= n"
      - "Exactly one value appears twice and exactly one value is absent"
    examples:
      - input: |
          5
          3 1 2 5 3
        output: |
          3 4
        explanation: "3 shows up twice and 4 never appears, so the answer is 3 4."
      - input: |
          2
          2 2
        output: |
          2 1
        explanation: "With n = 2 the array should be a permutation of {1, 2}; 2 is doubled and 1 is gone."
    hints:
      - "A count array of size n + 1 solves it immediately - now think about doing it with O(1) extra space."
      - "Compare the array's sum with 1 + 2 + ... + n: that difference equals x - y."
      - "A second equation is needed. Sums of squares give x² - y² = (x + y)(x - y), which combined with x - y determines x + y, and then x and y."
    explanation: |
      **Count each value - O(n²) time, O(1) space.** For every candidate `v` in `1..n`, scan the
      array and count it; the one with count 2 is `x`, the one with count 0 is `y`.

      **Frequency array or hash map - O(n) time, O(n) space.** One pass fills counts, a second pass
      over `1..n` reads off both answers. This is the practical solution and the one to reach for
      first.

      **Two equations - O(n) time, O(1) space (optimal).** Let `S = sum(nums)` and
      `S2 = sum(v² for v in nums)`, and let `Sn = n(n+1)/2`, `S2n = n(n+1)(2n+1)/6` be the intended
      values. Then `S - Sn = x - y` and `S2 - S2n = x² - y² = (x + y)(x - y)`. Dividing the second
      by the first gives `x + y`; adding and halving gives `x`, and subtracting gives `y`. Only two
      accumulators are needed, and in Python the big intermediate values are exact.

      **XOR alternative - O(n) time, O(1) space.** XOR every array element with every value in
      `1..n`; the result is `x ^ y`. Any set bit of it separates all numbers into two groups whose
      XORs are `x` and `y`; a final pass tells which of the two is the repeating one.
    starterCode:
      python: |
        import sys
        from typing import List, Tuple


        def repeating_and_missing(nums: List[int]) -> Tuple[int, int]:
            # Return (repeating value, missing value).
