    slug: pascals-triangle
    title: "Pascal's Triangle I"
    difficulty: Easy
    topic: "Arrays"
    subtopic: "Hard Problems"
    tags: [array, math, combinatorics]
    sourceUrl: "https://leetcode.com/problems/pascals-triangle/"
    statement: |
      Build the first `n` rows of Pascal's triangle.

      Row 0 is the single value `1`. In every later row the first and last entries are `1`, and any
      other entry is the sum of the two entries directly above it in the previous row. Row `r`
      therefore has `r + 1` numbers, and its entry at position `c` equals the binomial coefficient
      `C(r, c)`.
    inputFormat: |
      - Line 1: a single integer `n`, the number of rows to print.
    outputFormat: |
      Print `n` lines. Line `r` (counting from 0) holds the `r + 1` numbers of row `r`, space
      separated.
    constraints:
      - "1 <= n <= 30"
    examples:
      - input: |
          5
        output: |
          1
          1 1
          1 2 1
          1 3 3 1
          1 4 6 4 1
        explanation: "Each row starts and ends with 1; for instance row 4 is 1 4 6 4 1 because 4 = 1 + 3 and 6 = 3 + 3."
      - input: |
          1
        output: |
          1
        explanation: "With n = 1 only the top of the triangle is printed."
    hints:
      - "Row r can be built from row r - 1 by adding neighbouring pairs and padding with 1 at both ends."
      - "Alternatively, inside one row: C(r, c) = C(r, c - 1) * (r - c + 1) / c, so a row can be produced from its own first element."
      - "Avoid computing each entry as a separate factorial - that repeats a lot of work."
    explanation: |
      **Factorials per entry - O(n² · n) time.** Compute `C(r, c) = r! / (c! (r - c)!)` for each of
      the ~n²/2 entries. Correct but wasteful, and with plain factorials the intermediate numbers
      get large fast.

      **Row from previous row - O(n²) time, O(n) space.** Start with `[1]`. To get the next row,
      add adjacent pairs of the current row and wrap the result in `1`s:
      `next = [1] + [row[i] + row[i+1] for i ...] + [1]`. This is the definition of the triangle,
      and it does exactly one addition per entry. Total work is the number of entries, `n(n+1)/2`,
      which is optimal because that is also the output size. Only the previous row has to be kept,
      so the extra space is O(n).

      **Row from itself - O(n²) time, O(1) extra space.** Inside row `r`, start at `1` and multiply
      by `(r - c + 1) / c` to step from entry `c - 1` to entry `c`. The division is always exact.
      Useful when a single row is wanted without building the ones above it.
    starterCode:
      python: |
        import sys
        from typing import List


        def pascals_triangle(n: int) -> List[List[int]]:
            # Return the first n rows of Pascal's triangle.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            for row in pascals_triangle(n):
                print(" ".join(str(x) for x in row))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def pascals_triangle(n: int) -> List[List[int]]:
            triangle: List[List[int]] = []
            row = [1]
            for _ in range(n):
                triangle.append(row)
                row = [1] + [row[i] + row[i + 1] for i in range(len(row) - 1)] + [1]
            return triangle


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            for row in pascals_triangle(n):
                print(" ".join(str(x) for x in row))


        if __name__ == "__main__":
            main()
