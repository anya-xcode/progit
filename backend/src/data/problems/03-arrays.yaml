    tags: [array, two-pointers, sorting]
    sourceUrl: "https://leetcode.com/problems/merge-sorted-array/"
    statement: |
      Two arrays `a` (size `n`) and `b` (size `m`) are each sorted in non-decreasing order. Merge
      them **in place**: afterwards `a` must hold the `n` smallest of all `n + m` values in sorted
      order, and `b` must hold the remaining `m` values, also sorted.

      The point of the exercise is to do this without allocating a third array of size `n + m`.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Line 2: `n` space-separated integers, the array `a`.
      - Line 3: `m` space-separated integers, the array `b`.
    outputFormat: |
      - Line 1: the `n` values of `a` after merging, space separated.
      - Line 2: the `m` values of `b` after merging, space separated.
    constraints:
      - "1 <= n, m <= 10^5"
      - "-10^9 <= a[i], b[i] <= 10^9"
      - "a and b are sorted in non-decreasing order"
    examples:
      - input: |
          4 3
          1 4 8 10
          2 3 9
        output: |
          1 2 3 4
          8 9 10
        explanation: "The seven values sorted are 1 2 3 4 8 9 10; the first four stay in a and the last three go to b."
      - input: |
          1 1
          5
          2
        output: |
          2
          5
        explanation: "Only one swap is needed: a becomes [2] and b becomes [5]."
    hints:
      - "Think of a and b glued together as one virtual array of length n + m; you must sort that virtual array."
      - "A simple in-place idea: compare a[n-1] with b[0]; if a[n-1] > b[0], swap them, then re-sort each array. That works but costs a sort per swap."
      - "The gap (shell) method: start with gap = ceil((n + m) / 2), compare every pair of virtual positions that are 'gap' apart and swap if out of order, then halve the gap until it reaches 0."
    explanation: |
      **Merge into a new array - O(n + m) time, O(n + m) space.** The classic merge, then copy the
      first `n` values back into `a` and the rest into `b`. Fast but uses the forbidden buffer.

      **Swap-then-sort - O(min(n, m) · (n log n + m log m)) time, O(1) space.** Walk `i` from the
      end of `a` and `j` from the start of `b`; while `a[i] > b[j]`, swap them. After all swaps, `a`
      and `b` are individually unsorted, so sort each. Easy to reason about but slow.

      **Gap (shell) method - O((n + m) log(n + m)) time, O(1) extra space.** Treat the pair as one
      virtual array of length `n + m` where index `x` means `a[x]` for `x < n` and `b[x - n]`
      otherwise. Start with `gap = ceil((n + m) / 2)`. For every pair of virtual indices `(x, x +
      gap)`, swap if the left value is larger. Then set `gap = ceil(gap / 2)` and repeat until the
      gap becomes 0 after a pass with gap 1. Each pass costs O(n + m) and there are
      O(log(n + m)) passes. The order is correct because each pass with gap `g` guarantees every
      pair `g` apart is ordered, and halving the gap preserves that while tightening it, exactly as
      in shell sort; the final pass with gap 1 leaves the whole virtual array sorted.
