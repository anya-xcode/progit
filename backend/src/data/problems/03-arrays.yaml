    tags: [array, matrix]
    sourceUrl: "https://leetcode.com/problems/set-matrix-zeroes/"
    statement: |
      You are given a `rows x cols` integer matrix. For every cell that contains `0` in the
      **original** matrix, set every cell in its row and every cell in its column to `0`.

      Zeros created by this process do not spread further — only the zeros present at the
      start matter. Try to use O(1) extra space.
    inputFormat: |
      - Line 1: two integers `rows` and `cols`.
      - Next `rows` lines: `cols` space-separated integers each.
    outputFormat: |
      Print the resulting matrix: `rows` lines with `cols` space-separated integers each.
    constraints:
      - "1 <= rows, cols <= 200"
      - "-2^31 <= matrix[i][j] <= 2^31 - 1"
    examples:
      - input: |
          3 3
          1 1 1
          1 0 1
          1 1 1
        output: |
          1 0 1
          0 0 0
          1 0 1
        explanation: "The single 0 at row 1, column 1 wipes out row 1 and column 1."
      - input: |
          3 4
          0 1 2 0
          3 4 5 2
          1 3 1 5
        output: |
          0 0 0 0
          0 4 5 0
          0 3 1 0
        explanation: "Zeros at (0,0) and (0,3) clear row 0 and columns 0 and 3."
    hints:
      - "First find out which rows and which columns must be cleared, then clear them."
      - "Two boolean arrays (one per row, one per column) are enough."
      - "To save space, use the first row and first column of the matrix itself as those markers, handling cell (0,0) carefully."
    explanation: |
      **Copy the matrix — O((r·c)·(r + c)) time, O(r·c) space.** For each zero in the original,
      clear its row and column in a copy.

      **Row/column markers — O(r·c) time, O(r + c) space.** One pass records `zero_row[i]` and
      `zero_col[j]` for every zero cell. A second pass sets a cell to 0 if its row or column
      is marked.

      **In-place markers — O(r·c) time, O(1) space.** Use `matrix[i][0]` and `matrix[0][j]`
      as the markers. Because `matrix[0][0]` would be shared by row 0 and column 0, keep a
      separate flag for column 0. Mark during the first pass; then clear cells of the inner
      submatrix `(1.., 1..)` based on the markers; then clear row 0 if `matrix[0][0]` is 0,
      and finally clear column 0 if its flag is set. The order matters so markers are not
      destroyed before they are read.
    starterCode:
