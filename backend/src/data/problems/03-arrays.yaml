    explanation: |
      **All triples + set — O(n³ log m) time, O(m) space.** Check every `i < j < k`, sort each
      zero-sum triple and insert it into a set to remove duplicates.

      **Fix one + hash set — O(n²) time, O(n) space.** For each `i`, scan `j > i` while storing
      the values seen between them in a set; if `-(nums[i] + nums[j])` is in the set, a triplet
      is found. Store sorted triplets in a set to deduplicate.

      **Sort + two pointers — O(n²) time, O(1) extra space (besides output).** Sort the array.
      For each index `i` (skipping a value equal to the previous one), set `lo = i + 1`,
      `hi = n - 1`. If the sum is too small move `lo` right, if too large move `hi` left;
      on a match record it, then move both pointers past any repeated values. Because the
      array is sorted and `i` increases, the triplets are produced already in lexicographic
      order.
