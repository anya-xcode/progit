    slug: count-subarrays-with-given-xor-k
    title: "Count subarrays with given xor K"
    difficulty: Hard
    topic: "Arrays"
    subtopic: "Hard Problems"
    tags: [array, hashing, bit-manipulation, prefix-xor]
    sourceUrl: ""
    statement: |
      Given an array `nums` of non-negative integers and a non-negative integer `k`, count the
      **non-empty contiguous subarrays** whose bitwise XOR of all elements equals `k`.

      Subarrays are distinguished by their position range, so two blocks holding the same values at
      different positions count separately.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print one integer: the number of subarrays whose XOR equals `k`.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= nums[i] < 2^30"
      - "0 <= k < 2^30"
    examples:
      - input: |
          4 6
          4 2 2 6
        output: |
          3
        explanation: "The blocks [4, 2], [2, 2, 6] and the final [6] each XOR to 6, giving 3."
      - input: |
          3 1
          2 2 2
        output: |
          0
        explanation: "The possible XORs are 2, 0 and 2, so 1 never appears."
    hints:
      - "XOR has the same 'prefix' structure as addition: xor(i..j) = prefix[j] XOR prefix[i-1]."
      - "Rearrange xor(i..j) == k using the fact that XOR is its own inverse: prefix[i-1] == prefix[j] XOR k."
      - "Sweep j and keep a dictionary counting how often every prefix XOR has occurred, seeded with {0: 1}."
    explanation: |
      **All subarrays - O(n²) time, O(1) space.** For each start, extend right while XOR-ing and
      count the hits. Fine up to a few thousand elements.

      **Prefix XOR + hash map - O(n) time, O(n) space (optimal).** Define `prefix[j]` as
      `nums[0] ^ ... ^ nums[j]`. Because `x ^ x == 0`, the XOR of the block `i..j` is
      `prefix[j] ^ prefix[i-1]`. Setting that equal to `k` and XOR-ing both sides by `prefix[j]`
      gives `prefix[i-1] == prefix[j] ^ k`. So sweep `j` left to right holding a dictionary
      `seen` of `prefix value -> number of occurrences`, initialised to `{0: 1}` for the empty
      prefix; at each step add `seen.get(prefix ^ k, 0)` to the answer, then bump `seen[prefix]`.

      **Why the sentinel matters.** `{0: 1}` accounts for subarrays that start at index 0: for
      those, `prefix[i-1]` is the XOR of nothing, which is 0. Forgetting it silently undercounts.
      The structure is identical to "count subarrays with sum k", with `+`/`-` replaced by `^`.
