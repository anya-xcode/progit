  - sheetId: prob-3-3-12-maximum-product-subarray-
    slug: maximum-product-subarray
    title: "Maximum Product Subarray in an Array"
    difficulty: Hard
    topic: "Arrays"
    subtopic: "Hard Problems"
    tags: [array, dynamic-programming, prefix-suffix]
    sourceUrl: "https://leetcode.com/problems/maximum-product-subarray/"
    statement: |
      Given an integer array `nums`, look at every **non-empty** contiguous block and multiply its
      elements together. Report the largest product obtainable.

      Negative values and zeros make this trickier than the maximum-sum version: two negatives
      multiply into a positive, and a zero resets everything.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print one integer: the maximum product of a non-empty contiguous subarray.
    constraints:
      - "1 <= n <= 10^4"
      - "-10 <= nums[i] <= 10"
      - "The answer fits in a signed 64-bit integer"
    examples:
      - input: |
          5
          2 3 -2 4 -1
        output: |
          48
        explanation: "Multiplying the whole array gives 2*3*(-2)*4*(-1) = 48, which beats every shorter block."
      - input: |
          4
          -2 0 -1 0
        output: |
          0
        explanation: "Every block that avoids a zero is negative, so the best product is 0 itself."
    hints:
      - "Count the negative numbers: if there is an even number of them and no zero, the whole array is the answer."
      - "Zeros cut the array into independent segments - solve each segment separately."
      - "Inside a segment with an odd number of negatives, you must drop everything up to and including the first negative, or everything from the last negative onwards. Running prefix and suffix products discover both options."
    explanation: |
      **All subarrays - O(n²) time, O(1) space.** For each start, extend right while multiplying and
      track the maximum. Straightforward and a good correctness reference.

      **Track max and min together - O(n) time, O(1) space.** For each index keep `best_here` and
      `worst_here`, the largest and smallest products of a block ending there. Multiplying by a
      negative number swaps their roles, so
      `best_here = max(x, x * prev_best, x * prev_worst)` and the mirror image for `worst_here`
      (a zero makes both collapse to `x`, which restarts the block). The answer is the maximum
      `best_here`. Keeping the minimum is essential, because today's most negative product can
      become tomorrow's largest.

      **Prefix and suffix products - O(n) time, O(1) space.** Sweep once from the left and once
      from the right multiplying a running product, resetting it to 1 whenever it becomes 0. The
      answer is the largest value either sweep ever holds. This works because any optimal block
      either reaches the start of its zero-free segment or its end: with an even count of negatives
      you take the whole segment, and with an odd count you must cut off one side, which is
      precisely what the two sweeps enumerate.
