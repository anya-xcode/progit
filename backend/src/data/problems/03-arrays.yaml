  - sheetId: prob-3-1-5-left-rotate-array-by-one
    slug: left-rotate-array-by-one
    title: "Left Rotate Array by One"
    difficulty: Easy
    topic: "Arrays"
    subtopic: "Easy Problems"
    tags: [array, two-pointers]
    sourceUrl: "https://leetcode.com/problems/rotate-array/"
    statement: |
      Shift every element of an integer array one position to the **left**. The value that falls
      off the front is placed at the very end, so the array keeps the same multiset of values.

      For example `[10, 20, 30]` becomes `[20, 30, 10]`.
    inputFormat: |
      - Line 1: an integer `n`, the size of the array.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the rotated array: `n` space-separated integers on one line.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
    examples:
      - input: |
          5
          1 2 3 4 5
        output: |
          2 3 4 5 1
        explanation: "Every value moves one slot left and the leading 1 wraps around to the back."
      - input: |
          1
          7
        output: |
          7
        explanation: "A single element rotated by one is unchanged."
    hints:
      - "Remember the first element before you start moving anything."
      - "Every element at position i should end up at position i - 1."
      - "One pass with a single saved variable is enough - no second array is needed."
    explanation: |
      **Extra array - O(n) time, O(n) space.** Build a new list as `nums[1:] + nums[:1]` and print
      it. Simple, but it allocates a second array.

      **Repeated shifting - O(n) time, O(1) space.** Save `first = nums[0]`, then copy
      `nums[i] = nums[i + 1]` for `i = 0 .. n - 2`, and finally write `first` into the last slot.
      Each element is touched once, so this is optimal; only one temporary variable is used.

      Rotating by one is the base case of "rotate by k": doing it k times costs O(n·k), which is
      why the general problem uses the reversal trick instead.
    starterCode:
      python: |
        import sys
        from typing import List


        def left_rotate_by_one(nums: List[int]) -> List[int]:
            # Move every element one place left and put the old first element last.
