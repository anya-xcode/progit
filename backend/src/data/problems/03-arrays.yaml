    title: "Sort an Array of 0s, 1s and 2s"
    difficulty: Medium
    topic: "Arrays"
    subtopic: "Medium Problems"
    tags: [array, two-pointers, sorting]
    sourceUrl: "https://leetcode.com/problems/sort-colors/"
    statement: |
      The array `nums` contains only the values `0`, `1` and `2`. Sort it in non-decreasing
      order **in place**, without calling a library sort.

      Can you do it in a single pass using constant extra space?
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated values, each `0`, `1` or `2`.
    outputFormat: |
      Print the sorted array on one line, space-separated.
    constraints:
      - "1 <= n <= 10^5"
      - "nums[i] is 0, 1 or 2"
    examples:
      - input: |
          6
          2 0 2 1 1 0
        output: |
          0 0 1 1 2 2
        explanation: "Two 0s, two 1s and two 2s end up grouped in that order."
      - input: |
          3
          0 1 2
        output: |
          0 1 2
        explanation: "The array is already sorted."
    hints:
      - "Counting how many 0s, 1s and 2s there are gives a simple two-pass solution."
      - "For one pass, maintain three regions: 0s at the front, 2s at the back, unknown in the middle."
      - "Use pointers low, mid and high (the Dutch National Flag idea)."
    explanation: |
      **Library sort — O(n log n) time.** Works, but ignores the special structure.

      **Counting — O(n) time, O(1) space, two passes.** Count the 0s, 1s and 2s, then
      overwrite the array with that many of each value.

      **Dutch National Flag — O(n) time, O(1) space, one pass.** Keep `low = mid = 0` and
      `high = n - 1`. Invariant: `nums[0..low-1]` are 0s, `nums[low..mid-1]` are 1s and
      `nums[high+1..]` are 2s. While `mid <= high`: a 0 is swapped with `nums[low]` (advance
      both `low` and `mid`), a 1 just advances `mid`, and a 2 is swapped with `nums[high]`
      (decrease `high`, but do not advance `mid`, since the swapped-in value is unexamined).
    starterCode:
