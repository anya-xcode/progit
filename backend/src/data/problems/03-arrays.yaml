  - slug: next-permutation
    title: "Next Permutation"
    difficulty: Medium
    topic: "Arrays"
    subtopic: "Medium Problems"
    tags: [array, two-pointers]
    sourceUrl: "https://leetcode.com/problems/next-permutation/"
    statement: |
      Imagine listing every distinct arrangement of the elements of `nums` in lexicographic
      (dictionary) order. The **next permutation** of `nums` is the arrangement that comes
      immediately after the current one in that list.

      If `nums` is already the last arrangement (sorted in non-increasing order), wrap around
      and return the first one (sorted in non-decreasing order).

      Transform `nums` in place using only constant extra memory. The array may contain
      duplicate values.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the next permutation on one line, space-separated.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= nums[i] <= 100"
    examples:
      - input: |
          3
          1 3 2
        output: |
          2 1 3
        explanation: "The arrangements of 1, 3, 2 in order are ..., 1 3 2, 2 1 3, ...; the one after 1 3 2 is 2 1 3."
      - input: |
          3
          3 2 1
        output: |
          1 2 3
        explanation: "3 2 1 is the largest arrangement, so we wrap around to the smallest, 1 2 3."
    hints:
      - "Generating all permutations is far too slow; think about which suffix must change."
      - "Scan from the right for the first index i with nums[i] < nums[i + 1]. The suffix after i is non-increasing."
      - "Swap nums[i] with the smallest suffix element greater than it, then reverse the suffix."
    explanation: |
      **Generate all permutations — O(n!·n) time.** List every distinct arrangement, sort
      them, find the current one and return its successor. Only feasible for tiny `n`.

      **Optimal — O(n) time, O(1) space.**
      1. Find the *pivot*: the largest index `i` with `nums[i] < nums[i + 1]`. The suffix
         `nums[i+1..]` is non-increasing, so it is already the largest arrangement of those
         elements.
      2. If no pivot exists, the whole array is the last permutation: reverse it and stop.
      3. From the right, find the first `j` with `nums[j] > nums[i]` — the smallest value in
         the suffix that is bigger than the pivot — and swap `nums[i]` with `nums[j]`.
      4. The suffix is still non-increasing; reverse it to make it the smallest arrangement.

      Using strict comparisons in steps 1 and 3 handles duplicates correctly.
    starterCode:
      python: |
        import sys
        from typing import List


        def next_permutation(nums: List[int]) -> None:
            # Rearrange nums into its next lexicographic permutation, in place.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            next_permutation(nums)
            print(*nums)


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def next_permutation(nums: List[int]) -> None:
            n = len(nums)
            i = n - 2
            while i >= 0 and nums[i] >= nums[i + 1]:
                i -= 1
            if i >= 0:
                j = n - 1
                while nums[j] <= nums[i]:
                    j -= 1
                nums[i], nums[j] = nums[j], nums[i]
            lo, hi = i + 1, n - 1
            while lo < hi:
                nums[lo], nums[hi] = nums[hi], nums[lo]
                lo += 1
                hi -= 1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            next_permutation(nums)
            print(*nums)


        if __name__ == "__main__":
            main()
