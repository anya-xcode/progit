  - slug: check-if-array-is-sorted
    title: "Check if Array is Sorted"
    difficulty: Easy
    topic: "Arrays"
    subtopic: "Easy Problems"
    tags: [array]
    sourceUrl: ""
    statement: |
      Decide whether the integer array `nums` is sorted in **non-decreasing** order, i.e.
      `nums[i] <= nums[i + 1]` for every valid `i`. Equal neighbours are allowed.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print `true` if the array is sorted in non-decreasing order, otherwise `false`.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
    examples:
      - input: |
          5
          1 2 2 5 9
        output: |
          true
        explanation: "Each element is at least as large as the one before it (2 <= 2 is fine)."
      - input: |
          4
          1 4 3 6
        output: |
          false
        explanation: "4 is followed by 3, which breaks the order."
    hints:
      - "You do not need to sort anything."
      - "An array is sorted exactly when every adjacent pair is in order."
    explanation: |
      **Compare with a sorted copy — O(n log n) time, O(n) space.** Sort a copy and check
      whether it equals the original.

      **Check every pair — O(n²) time, O(1) space.** For each `i`, verify that no later
      element is smaller. Correct but slow.

      **Adjacent pairs — O(n) time, O(1) space.** Non-decreasing order is transitive, so it
      is enough to check `nums[i - 1] <= nums[i]` for each `i` from 1 to `n - 1`. Return
      `false` at the first violation and `true` if none is found.
    starterCode:
      python: |
        import sys
        from typing import List


        def is_sorted(nums: List[int]) -> bool:
            # Return True if nums is sorted in non-decreasing order.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print("true" if is_sorted(nums) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def is_sorted(nums: List[int]) -> bool:
            for i in range(1, len(nums)):
                if nums[i - 1] > nums[i]:
                    return False
            return True


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print("true" if is_sorted(nums) else "false")


        if __name__ == "__main__":
            main()
