      **Check every start — O(n²) time, O(1) space.** From each index count how many ones
      follow in a row and keep the maximum.

      **Running counter — O(n) time, O(1) space.** Walk once through the array with
      `current` and `best`. On a `1`, increment `current` and update `best`; on a `0`, reset
      `current` to 0. `best` is the answer.
    starterCode:
