    sourceUrl: "https://leetcode.com/problems/majority-element-ii/"
    statement: |
      Given an integer array `nums` of length `n`, report every value that occurs **strictly more
      than `n / 3` times**.

      At most two values can satisfy this, and there may be none.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      - Line 1: the number of qualifying values `c` (0, 1 or 2).
      - Line 2: present only when `c > 0` - the `c` values in increasing order, space separated.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
    examples:
      - input: |
          7
          3 1 2 3 1 3 1
        output: |
          2
          1 3
        explanation: "n/3 is about 2.33. Both 3 and 1 occur three times, which is more than that; 2 occurs once."
      - input: |
          4
          1 2 3 4
        output: |
          0
        explanation: "Each value occurs once, which is not more than 4/3, so nothing qualifies."
    hints:
      - "Why can there be at most two answers? Three different values each occurring more than n/3 times would need more than n elements."
      - "A dictionary of counts solves it in O(n) time and O(n) space - now try to get the space down to O(1)."
      - "Extend Boyer-Moore voting to two candidates: keep two (value, count) slots, and cancel one from each slot when a third distinct value arrives. Then verify both candidates in a second pass."
    explanation: |
      **Count every value - O(n²) time, O(1) space.** For each distinct value, scan the array and
      count its occurrences. Simple, far too slow.

      **Hash map of counts - O(n) time, O(n) space.** One pass fills `value -> count`, then collect
      the values whose count exceeds `n / 3` and sort them (at most two, so the sort is free).

      **Extended Boyer-Moore voting - O(n) time, O(1) space (optimal).** Hold two candidate slots
      `(c1, n1)` and `(c2, n2)`, both empty at the start. For each value `x`: if it equals `c1` or
      `c2`, bump that count; else if a slot is empty, put `x` there with count 1; else decrement
      both counts, dropping a candidate when its count reaches 0. The intuition is cancellation -
      each decrement destroys one occurrence of three distinct values, and a value occurring more
      than `n / 3` times cannot be fully cancelled, so it must survive as a candidate. The counts
      at the end are **not** true frequencies, so a second pass must recount `c1` and `c2` and keep
      only those that really exceed `n / 3`. Finally sort the (at most two) winners.
