  - slug: longest-consecutive-sequence
    title: "Longest Consecutive Sequence"
    difficulty: Medium
    topic: "Arrays"
    subtopic: "Medium Problems"
    tags: [array, hashing]
    sourceUrl: "https://leetcode.com/problems/longest-consecutive-sequence/"
    statement: |
      Given an unsorted integer array `nums`, find the length of the longest set of values
      that form a run of consecutive integers `x, x + 1, x + 2, ..., x + L - 1`.

      The values may appear anywhere in the array and in any order. Duplicates count only
      once.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the length of the longest consecutive run.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
    examples:
      - input: |
          6
          100 4 200 1 3 2
        output: |
          4
        explanation: "The values 1, 2, 3, 4 are all present, giving a run of length 4."
      - input: |
          6
          1 0 1 2 2 0
        output: |
          3
        explanation: "Duplicates are ignored: 0, 1, 2 form a run of length 3."
    hints:
      - "Sorting makes runs adjacent, but costs O(n log n)."
      - "Put all values in a hash set so that 'is x + 1 present?' is O(1)."
      - "Only start counting from values x where x - 1 is NOT in the set."
    explanation: |
      **Repeated search — O(n²) time, O(1) space.** For each value, keep looking for the
      next integer with a linear scan of the array.

      **Sort — O(n log n) time, O(1) extra space.** Sort, then walk the array counting runs:
      skip equal neighbours, extend the run when the next value is exactly one larger,
      otherwise reset.

      **Hash set — O(n) time, O(n) space.** Insert all values into a set. A value `x` starts a
      run only if `x - 1` is absent; from each such start, count upward while `x + 1, x + 2, ...`
      exist. Every value is visited by at most one upward walk, so the total work is linear.
    starterCode:
      python: |
        import sys
        from typing import List


        def longest_consecutive(nums: List[int]) -> int:
            # Return the length of the longest run of consecutive integers present in nums.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(longest_consecutive(nums))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def longest_consecutive(nums: List[int]) -> int:
            values = set(nums)
            best = 0
            for x in values:
                if x - 1 not in values:
                    length = 1
                    while x + length in values:
                        length += 1
                    best = max(best, length)
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(longest_consecutive(nums))


        if __name__ == "__main__":
            main()
