          7 2
          1 2 3 4 5 6 7
        output: |
          3 4 5 6 7 1 2
        explanation: "Rotating left twice moves 1 and 2 to the back: 3 4 5 6 7 1 2."
      - input: |
          3 4
          10 20 30
        output: |
          20 30 10
        explanation: "Rotating a 3-element array 4 times is the same as rotating it once."
