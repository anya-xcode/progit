    statement: |
      Given an integer array `nums` and an integer `target`, find every **distinct quadruplet of
      values** `[a, b, c, d]` taken from four different positions such that
      `a + b + c + d == target`.

      Two quadruplets are the same when they consist of the same four values, no matter which
      positions produced them. Write each quadruplet in non-decreasing order and list the
      quadruplets in lexicographic order.
    inputFormat: |
      - Line 1: two integers `n` and `target`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      - Line 1: the number of distinct quadruplets `q`.
      - Next `q` lines: one quadruplet per line as `a b c d` with `a <= b <= c <= d`, in
        lexicographic order (compare `a`, then `b`, then `c`, then `d`).

      If there are none, print just `0`.
    constraints:
      - "4 <= n <= 200"
      - "-10^9 <= nums[i] <= 10^9"
      - "-4·10^9 <= target <= 4·10^9"
    examples:
      - input: |
          6 0
          1 0 -1 0 -2 2
        output: |
          3
          -2 -1 1 2
          -2 0 0 2
          -1 0 0 1
        explanation: "Three distinct quadruplets reach 0: (-2, -1, 1, 2), (-2, 0, 0, 2) and (-1, 0, 0, 1)."
      - input: |
          4 100
          1 2 3 4
        output: |
          0
        explanation: "The only quadruplet is (1, 2, 3, 4) with sum 10, so nothing matches 100."
    hints:
      - "Sort the array first: it makes duplicate removal easy and enables two pointers."
      - "Fix the two smallest members with nested loops, then look for the remaining pair with two pointers from both ends."
      - "Skip a value whenever it repeats the previous one at the same nesting level - that is what keeps the output distinct."
    explanation: |
      **All quadruples - O(n⁴) time.** Check every `i < j < k < l`, sort each matching quadruple and
      push it into a set to deduplicate. Unusable beyond tiny arrays.

      **Fix two + hash set - O(n³) time, O(n) space.** For each pair `(i, j)`, scan `k > j` while
      remembering the values in between; a match exists when `target - nums[i] - nums[j] - nums[k]`
      has been seen. Deduplicate with a set of sorted quadruples.

      **Sort + two pointers - O(n³) time, O(1) extra space besides the output (optimal in
      practice).** Sort `nums`. For each `i`, and each `j > i`, set `lo = j + 1`, `hi = n - 1` and
      move them inward: if the four-value sum is too small increase `lo`, if too large decrease
      `hi`, and on a match record the quadruplet and then push both pointers past repeated values.
      Skipping `nums[i] == nums[i-1]` and `nums[j] == nums[j-1]` prevents duplicate quadruplets at
      the outer levels. Because the array is sorted and the loops advance left to right, the
      quadruplets come out already in lexicographic order.

      The same ladder extends to k-Sum: sorting plus `k - 2` nested loops around a two-pointer
      scan gives O(n^(k-1)).
