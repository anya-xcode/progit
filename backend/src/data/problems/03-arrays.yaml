  - slug: count-inversions
    title: "Count Inversions"
    difficulty: Hard
    topic: "Arrays"
    subtopic: "Hard Problems"
    tags: [array, merge-sort, divide-and-conquer]
    sourceUrl: ""
    statement: |
      An **inversion** in an array `nums` is a pair of indices `(i, j)` with `i < j` and
      `nums[i] > nums[j]` (strictly greater). The number of inversions measures how far the
      array is from being sorted.

      Count the inversions in `nums`.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the number of inversions (it may not fit in 32 bits).
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
    examples:
      - input: |
          5
          5 2 4 1 6
        output: |
          5
        explanation: "The inversions are (5,2), (5,4), (5,1), (2,1) and (4,1): 5 in total."
      - input: |
          5
          1 2 2 3 8
        output: |
          0
        explanation: "The array is already sorted, and equal values do not form an inversion."
    hints:
      - "Checking every pair is O(n²); think divide and conquer."
      - "Split the array in halves. Inversions are inside the left half, inside the right half, or cross between them."
      - "While merging two sorted halves, when you take an element from the right half, every remaining element in the left half forms an inversion with it."
    explanation: |
      **All pairs — O(n²) time, O(1) space.** Test every pair `i < j`.

      **Merge sort — O(n log n) time, O(n) space.** Recursively sort and count each half. While
      merging sorted halves `L` and `R`, if `L[p] <= R[q]` take `L[p]`; otherwise take `R[q]`
      and add `len(L) - p` to the count, since every remaining element of `L` is greater than
      `R[q]` and lies before it in the original array. Using `<=` ensures equal values are not
      counted. The total is left count + right count + cross count.

      (A Fenwick tree over compressed values gives another O(n log n) solution.)
    starterCode:
      python: |
