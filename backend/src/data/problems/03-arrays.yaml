    referenceSolution:
      python: |
        import sys
        from typing import List


        def count_reverse_pairs(nums: List[int]) -> int:
            def sort_and_count(values: List[int]) -> int:
                if len(values) < 2:
                    return 0
                mid = len(values) // 2
                left = values[:mid]
                right = values[mid:]
                total = sort_and_count(left) + sort_and_count(right)

                j = 0
                for value in left:
                    while j < len(right) and value > 2 * right[j]:
                        j += 1
                    total += j

                merged = []
                a = b = 0
                while a < len(left) and b < len(right):
                    if left[a] <= right[b]:
                        merged.append(left[a])
                        a += 1
                    else:
                        merged.append(right[b])
                        b += 1
                merged.extend(left[a:])
                merged.extend(right[b:])
                values[:] = merged
                return total

            return sort_and_count(list(nums))


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(count_reverse_pairs(nums))


        if __name__ == "__main__":
            main()
