  - slug: leaders-in-an-array
    title: "Leaders in an Array"
    difficulty: Medium
    topic: "Arrays"
    subtopic: "Medium Problems"
    tags: [array]
    sourceUrl: ""
    statement: |
      An element of `nums` is a **leader** if it is **strictly greater** than every element
      to its right. The last element is always a leader, since nothing lies to its right.

      Find all leaders and print them in the order they appear in the array
      (left to right).
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the leaders on one line, space-separated, in their original left-to-right order.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
    examples:
      - input: |
          6
          16 17 4 3 5 2
        output: |
          17 5 2
        explanation: "17 beats 4, 3, 5, 2; 5 beats 2; 2 is last. 4 is not a leader because 5 is to its right."
      - input: |
          4
          1 6 3 6
        output: |
          6
        explanation: "The second 6 is the last element. The first 6 is not a leader because it is not strictly greater than 6."
    hints:
      - "Checking every element against everything on its right is O(n²)."
      - "Walk from right to left and remember the maximum seen so far."
      - "Collect leaders during the backwards walk, then reverse them."
    explanation: |
      **Brute force — O(n²) time, O(1) extra space.** For each index, scan everything to its
      right and keep it if it is larger than all of them.

      **Right-to-left scan — O(n) time, O(n) space for the output.** Keep `max_right`, the
      maximum of the elements already visited (initially negative infinity). Moving from the
      last index to the first, an element is a leader exactly when it is greater than
      `max_right`; record it and update `max_right`. The leaders are found in reverse
      order, so reverse the collected list before printing.
    starterCode:
      python: |
        import sys
        from typing import List


        def find_leaders(nums: List[int]) -> List[int]:
            # Return the leaders of nums in left-to-right order.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(*find_leaders(nums))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def find_leaders(nums: List[int]) -> List[int]:
            leaders = []
            max_right = None
            for x in reversed(nums):
                if max_right is None or x > max_right:
                    leaders.append(x)
                    max_right = x
            leaders.reverse()
            return leaders


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(*find_leaders(nums))


        if __name__ == "__main__":
            main()
