  - slug: second-largest-element
    title: "Second Largest Element in an Array"
    difficulty: Easy
    topic: "Arrays"
    subtopic: "Easy Problems"
    tags: [array]
    sourceUrl: ""
    statement: |
      Given an array `nums` of non-negative integers, find the **second largest distinct
      value**: the largest value that is strictly smaller than the maximum.

      If no such value exists (for example, when all elements are equal), print `-1`.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the second largest distinct value, or `-1` if it does not exist.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= nums[i] <= 10^9"
    examples:
      - input: |
          6
          3 12 7 12 10 1
        output: |
          10
        explanation: "The maximum is 12 (it appears twice). The largest value strictly below 12 is 10."
      - input: |
          4
          5 5 5 5
        output: |
          -1
        explanation: "All elements are 5, so there is no value smaller than the maximum."
    hints:
      - "Duplicates of the maximum do not count as the second largest."
      - "Can you track both the largest and the second largest in a single pass?"
      - "When a new maximum appears, the old maximum becomes the second largest candidate."
    explanation: |
      **Sort — O(n log n) time, O(1) space.** Sort the array, then walk backwards from the
      end until you find a value different from the last one.

      **Two passes — O(n) time, O(1) space.** First find the maximum. In a second pass,
      take the largest value that is strictly less than that maximum.

      **One pass — O(n) time, O(1) space.** Keep `largest` and `second` (both start at -1).
      For each value `x`: if `x > largest`, move `largest` into `second` and set
      `largest = x`; otherwise if `largest > x > second`, set `second = x`. Equal values
      are ignored, which handles duplicates naturally.
    starterCode:
      python: |
        import sys
        from typing import List


        def second_largest(nums: List[int]) -> int:
            # Return the largest value strictly smaller than max(nums), or -1.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(second_largest(nums))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def second_largest(nums: List[int]) -> int:
            largest = -1
            second = -1
            for x in nums:
                if x > largest:
                    second = largest
                    largest = x
                elif second < x < largest:
                    second = x
            return second


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(second_largest(nums))


        if __name__ == "__main__":
            main()
