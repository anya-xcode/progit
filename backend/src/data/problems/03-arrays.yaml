    title: "Maximum Subarray Sum (Kadane's Algorithm)"
    difficulty: Medium
    topic: "Arrays"
    subtopic: "Medium Problems"
    tags: [array, dynamic-programming, kadane]
    sourceUrl: "https://leetcode.com/problems/maximum-subarray/"
    statement: |
      Given an integer array `nums`, choose a **non-empty** contiguous subarray with the
      largest possible sum and report that sum.

      Note that when every element is negative, the answer is the largest single element.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the maximum subarray sum.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^4 <= nums[i] <= 10^4"
    examples:
      - input: |
          7
          -3 1 5 -1 6 -8 2
        output: |
          11
        explanation: "The subarray [5, -1, 6] (indices 2..4) has sum 10, the best possible."
      - input: |
          4
          -5 -2 -7 -3
        output: |
          -2
        explanation: "All values are negative, so the best choice is the single element -2."
    hints:
      - "Try all subarrays first and see what repeated work you can remove."
      - "For each index, what is the best sum of a subarray that ends exactly there?"
      - "If the running sum becomes negative, it can only hurt what comes next."
    explanation: |
      **All subarrays — O(n²) time, O(1) space.** Fix the start, extend the end with a
      running sum, and track the maximum. (Recomputing each sum from scratch would be O(n³).)

      **Kadane's algorithm — O(n) time, O(1) space.** Let `current` be the best sum of a
      subarray ending at the current index. For each `x`, set `current = max(x, current + x)`
      — either extend the previous subarray or start fresh at `x` — and update
      `best = max(best, current)`. Starting `best` at `nums[0]` makes all-negative arrays work.

      **Follow-up.** To recover the subarray itself, remember the index where `current` was
      last restarted and copy it whenever `best` improves.
    starterCode:
      python: |
        import sys
        from typing import List


        def max_subarray_sum(nums: List[int]) -> int:
            # Return the largest sum of a non-empty contiguous subarray.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(max_subarray_sum(nums))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def max_subarray_sum(nums: List[int]) -> int:
            best = current = nums[0]
            for x in nums[1:]:
                current = max(x, current + x)
                best = max(best, current)
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(max_subarray_sum(nums))


        if __name__ == "__main__":
            main()
