    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated non-negative integers, the array `nums`.
    outputFormat: |
      Print the length of the longest subarray with sum `k`, or `0` if none exists.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= nums[i] <= 10^4"
      - "0 <= k <= 10^9"
