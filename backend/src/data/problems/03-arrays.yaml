      - input: |
          6 7
          4 2 3 1 1 9
        output: |
          4
        explanation: "The subarray [2, 3, 1, 1] (indices 1..4) sums to 7 and has length 4; no longer one works."
      - input: |
          3 1
          2 3 5
        output: |
          0
        explanation: "Every element is at least 2, so no subarray can sum to 1."
    hints:
      - "Start with the brute force: fix a start index and extend the end while accumulating the sum."
      - "Because all values are non-negative, extending a window never decreases its sum."
      - "Grow the window on the right and shrink it from the left while the sum is too large."
    explanation: |
      **All subarrays — O(n²) time, O(1) space.** Fix the start, extend the end while
      maintaining a running sum, and record the length whenever the sum equals `k`.

      **Prefix sums + hash map — O(n) time, O(n) space.** Store the first index at which each
      prefix sum occurs. At index `i` with prefix sum `S`, if `S - k` was seen at index `j`,
      the subarray `j+1..i` sums to `k`. This also works with negative numbers.

      **Sliding window — O(n) time, O(1) space.** Since all values are non-negative, the
      window sum only grows when the right edge moves and only shrinks when the left edge
      moves. Add `nums[right]`, then while the sum exceeds `k` remove `nums[left]` and advance
      `left`. When the sum equals `k`, update the answer with `right - left + 1`.
