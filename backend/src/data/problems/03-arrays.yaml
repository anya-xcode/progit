    referenceSolution:
      python: |
        import sys
        from typing import List, Tuple


        def repeating_and_missing(nums: List[int]) -> Tuple[int, int]:
            n = len(nums)
            expected_sum = n * (n + 1) // 2
            expected_square_sum = n * (n + 1) * (2 * n + 1) // 6
            actual_sum = 0
            actual_square_sum = 0
            for value in nums:
                actual_sum += value
                actual_square_sum += value * value
            diff = actual_sum - expected_sum           # x - y
            square_diff = actual_square_sum - expected_square_sum  # x^2 - y^2
            total = square_diff // diff                # x + y
            x = (total + diff) // 2
            y = (total - diff) // 2
            return x, y


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            repeating, missing = repeating_and_missing(nums)
            print(repeating, missing)


        if __name__ == "__main__":
            main()
