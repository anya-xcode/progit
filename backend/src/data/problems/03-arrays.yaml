  - slug: largest-element
    title: "Largest Element in an Array"
    difficulty: Easy
    topic: "Arrays"
    subtopic: "Easy Problems"
    tags: [array]
    sourceUrl: ""
    statement: |
      Given an array of integers `nums`, find the biggest value stored in it.

      The array is not sorted and may contain negative numbers and repeated values.
    inputFormat: |
      - Line 1: an integer `n`, the size of the array.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print a single integer: the maximum element of `nums`.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
    examples:
      - input: |
          4
          4 9 2 7
        output: |
          9
        explanation: "Scanning the values 4, 9, 2, 7, the largest one seen is 9."
      - input: |
          3
          -8 -3 -15
        output: |
          -3
        explanation: "Every value is negative; -3 is the closest to zero, so it is the largest."
    hints:
      - "You only need to look at each element once."
      - "Keep a running 'best so far' and update it whenever you see something bigger."
    explanation: |
      **Sorting — O(n log n) time, O(1) extra space (in-place sort).** Sort the array and
      return the last element. Correct, but it does far more work than needed.

      **Single pass — O(n) time, O(1) space.** Start with `best = nums[0]` and walk through
      the rest of the array, replacing `best` whenever a larger value appears. After the
      scan `best` is the maximum. This is optimal because every element has to be
      inspected at least once.
    starterCode:
      python: |
        import sys
        from typing import List


        def largest_element(nums: List[int]) -> int:
            # Return the maximum value in nums.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(largest_element(nums))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def largest_element(nums: List[int]) -> int:
            best = nums[0]
            for value in nums[1:]:
                if value > best:
                    best = value
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(largest_element(nums))


        if __name__ == "__main__":
            main()
