      - "Keep a pointer to the slot where the next non-zero element should go."
    explanation: |
      **Extra array — O(n) time, O(n) space.** Copy the non-zero elements into a new list,
      append the right number of zeros and copy the result back.

      **Two pointers — O(n) time, O(1) space.** Let `slot = 0`. Scan the array; whenever
      `nums[i] != 0`, swap it with `nums[slot]` and advance `slot`. Everything before `slot`
      is the non-zero elements in their original order, and everything from `slot` onwards
      ends up zero.
