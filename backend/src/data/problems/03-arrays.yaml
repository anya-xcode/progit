    explanation: |
      **Count each element — O(n²) time, O(1) space.** For every element count its
      occurrences and return the one exceeding `n / 2`.

      **Hash map — O(n) time, O(n) space.** Count frequencies in one pass and return the key
      whose count is greater than `n / 2`. (Sorting and taking the middle element also
      works in O(n log n).)

      **Boyer–Moore voting — O(n) time, O(1) space.** Keep `candidate` and `count`. For each
      value: if `count == 0`, adopt it as the candidate; then add 1 if it equals the
      candidate, otherwise subtract 1. Each decrement cancels one majority copy against one
      other value; since the majority has more copies than all others combined, it
      survives as the final candidate.
