    referenceSolution:
      python: |
        import sys
        from typing import List


        def count_inversions(nums: List[int]) -> int:
            def sort_count(arr: List[int]):
                if len(arr) <= 1:
                    return arr, 0
                mid = len(arr) // 2
                left, left_count = sort_count(arr[:mid])
                right, right_count = sort_count(arr[mid:])
                merged = []
                count = left_count + right_count
                p = q = 0
                while p < len(left) and q < len(right):
                    if left[p] <= right[q]:
                        merged.append(left[p])
                        p += 1
                    else:
                        merged.append(right[q])
                        count += len(left) - p
                        q += 1
                merged.extend(left[p:])
                merged.extend(right[q:])
                return merged, count

            return sort_count(nums)[1]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(count_inversions(nums))


        if __name__ == "__main__":
            main()
