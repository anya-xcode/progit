    slug: count-subarrays-with-given-sum
    title: "Count subarrays with given sum"
    difficulty: Medium
    topic: "Arrays"
    subtopic: "Medium Problems"
    tags: [array, hashing, prefix-sum]
    sourceUrl: "https://leetcode.com/problems/subarray-sum-equals-k/"
    statement: |
      Given an integer array `nums` (values may be negative or zero) and an integer `k`, count how
      many **non-empty contiguous subarrays** have elements summing to exactly `k`.

      Two subarrays are different when their position ranges differ, even if they contain the same
      values.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print one integer: the number of subarrays whose sum equals `k`.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^4 <= nums[i] <= 10^4"
      - "-10^9 <= k <= 10^9"
    examples:
      - input: |
          5 3
          1 2 3 -3 3
        output: |
          5
        explanation: "Five blocks reach 3: [1, 2], [1, 2, 3, -3], [3] at position 2, [3, -3, 3] and [3] at position 4."
      - input: |
          4 7
          1 1 1 1
        output: |
          0
        explanation: "No block of 1s reaches 7, so nothing is counted."
    hints:
      - "The sum of nums[i..j] is prefix[j] - prefix[i - 1]. Rewrite 'sum == k' in terms of two prefix sums."
      - "While sweeping j, how many earlier prefixes equal prefix[j] - k? A dictionary of counts answers that in O(1)."
      - "Seed the dictionary with prefix sum 0 seen once, so subarrays starting at index 0 are counted."
    explanation: |
      **All subarrays - O(n²) time, O(1) space.** For every start, extend to the right with a
      running sum and increment a counter whenever it hits `k`.

      **Prefix sums + hash map of counts - O(n) time, O(n) space (optimal).** A subarray ending at
      `j` has sum `k` exactly when some earlier prefix equals `prefix[j] - k`. So keep a dictionary
      `seen` mapping a prefix value to **how many times** it has occurred, initialised with
      `{0: 1}` (the empty prefix). Sweep `j`: update `prefix`, add `seen.get(prefix - k, 0)` to the
      answer, then bump `seen[prefix]`. Every subarray is counted exactly once, at its right end.

      **Careful with counts, not indices.** The "longest subarray with sum k" problem stores the
      *first* index for each prefix; here you must store *multiplicities*, because each earlier
      occurrence produces a distinct subarray. Note also that a sliding window is unusable: with
      negative values the running sum is not monotonic in the window size.
    starterCode:
      python: |
        import sys
        from typing import List


        def count_subarrays_with_sum(nums: List[int], k: int) -> int:
            # Return how many contiguous subarrays sum to exactly k.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(count_subarrays_with_sum(nums, k))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def count_subarrays_with_sum(nums: List[int], k: int) -> int:
            seen = {0: 1}
            prefix = 0
            count = 0
            for value in nums:
                prefix += value
                count += seen.get(prefix - k, 0)
                seen[prefix] = seen.get(prefix, 0) + 1
            return count


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(count_subarrays_with_sum(nums, k))


        if __name__ == "__main__":
            main()
