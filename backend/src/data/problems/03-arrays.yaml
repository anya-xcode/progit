    slug: largest-subarray-with-sum-zero
    title: "Largest Subarray with Sum 0"
    difficulty: Medium
    topic: "Arrays"
    subtopic: "Hard Problems"
    tags: [array, hashing, prefix-sum]
    sourceUrl: ""
    statement: |
      Given an integer array `nums` that may hold positive values, negative values and zeros, find
      the length of the **longest contiguous block whose elements add up to 0**.

      If no such block exists, the answer is `0`.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print one integer: the length of the longest zero-sum subarray, or `0` if there is none.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
    examples:
      - input: |
          8
          9 -3 3 1 -4 -6 7 5
        output: |
          6
        explanation: "The first six values 9, -3, 3, 1, -4, -6 add up to 0, so the answer is 6; no longer block works."
      - input: |
          4
          1 2 3 4
        output: |
          0
        explanation: "All values are positive, so no block can add up to 0."
    hints:
      - "A block sums to 0 exactly when the prefix sum before it equals the prefix sum after it."
      - "So the task becomes: find two positions with equal prefix sums that are as far apart as possible."
      - "Store the first index at which each prefix sum appears, and treat 'prefix sum 0' as having appeared at index -1."
    explanation: |
      **All subarrays - O(n²) time, O(1) space.** For each start, extend to the right with a running
      sum and record the length whenever it is 0.

      **Prefix sums + hash map - O(n) time, O(n) space (optimal).** Let `prefix[j]` be the sum of
      `nums[0..j]`. The block `i..j` sums to 0 exactly when `prefix[j] == prefix[i-1]`. Sweep left
      to right with a dictionary `prefix value -> first index seen`, seeded with `{0: -1}` so that a
      prefix that is itself 0 yields the block starting at index 0. Whenever the current prefix has
      been seen before at index `p`, the candidate length is `j - p`; keep the maximum. Storing only
      the **first** occurrence is what makes the block as long as possible.

      **Relation to the general problem.** This is "longest subarray with sum k" for `k = 0`, and
      the same warning applies: sliding windows are unsound once negative numbers are allowed,
      because growing a window no longer grows its sum.
    starterCode:
      python: |
        import sys
        from typing import List


        def longest_zero_sum_subarray(nums: List[int]) -> int:
            # Return the length of the longest subarray whose elements sum to 0.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(longest_zero_sum_subarray(nums))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def longest_zero_sum_subarray(nums: List[int]) -> int:
            first_index = {0: -1}
            prefix = 0
            best = 0
            for j, value in enumerate(nums):
                prefix += value
                if prefix in first_index:
                    best = max(best, j - first_index[prefix])
                else:
                    first_index[prefix] = j
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(longest_zero_sum_subarray(nums))


        if __name__ == "__main__":
            main()
