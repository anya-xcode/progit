  - sheetId: prob-3-2-5-print-subarray-with-maxim
    slug: print-maximum-subarray
    title: "Print subarray with maximum subarray sum"
    difficulty: Medium
    topic: "Arrays"
    subtopic: "Medium Problems"
    tags: [array, kadane, dynamic-programming]
    sourceUrl: ""
    statement: |
      Given an integer array `nums`, consider every **non-empty** contiguous block and its sum.
      Instead of reporting the largest sum, print the block itself.

      Several blocks may share the maximum sum, so the answer is pinned down like this: among all
      blocks with the maximum sum take the one that **starts earliest**; if there is still a tie,
      take the **shortest** one.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the chosen subarray on one line: its elements in order, space separated.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
    examples:
      - input: |
          9
          -2 1 -3 4 -1 2 1 -5 4
        output: |
          4 -1 2 1
        explanation: "The block at positions 3..6 is [4, -1, 2, 1] with sum 6; every other block sums to less."
      - input: |
          5
          -5 -2 -9 -4 -1
        output: |
          -1
        explanation: "All values are negative, so the best non-empty block is the single largest element, -1."
    hints:
      - "Kadane's algorithm already finds the maximum sum; you only have to remember where the winning block begins and ends."
      - "Track a 'current start': it stays put while you extend the running sum, and jumps to i whenever the running sum is dropped and restarted."
      - "Update the stored answer only on a STRICT improvement - that is what keeps the earliest start and the shortest length."
    explanation: |
      **All subarrays - O(n²) time, O(1) space.** For each start `i`, extend `j` while keeping a
      running sum, and remember the best `(sum, start, length)` under the tie-breaking rule.

      **Kadane with bookkeeping - O(n) time, O(1) space (optimal).** Keep `current`, the best sum
      of a block ending at the current index, plus `temp_start`, where that block begins. Moving
      from index `i - 1` to `i`: if `current < 0` the old block can only hurt, so restart with
      `current = nums[i]` and `temp_start = i`; otherwise extend with `current += nums[i]`. Then,
      **only if `current > best`**, store `best = current` with `start = temp_start` and `end = i`.

      **Why the tie-break comes out right.** Using a strict `>` means a later block with an equal
      sum never replaces the stored one, so the earliest start wins; and extending the stored block
      with elements that sum to 0 also fails the strict test, so the shortest version wins. One
      pass, one integer of extra state - nothing cheaper is possible since every element must be
      read.
    starterCode:
      python: |
        import sys
        from typing import List


        def max_subarray(nums: List[int]) -> List[int]:
            # Return the maximum-sum subarray (earliest start, then shortest).
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(x) for x in max_subarray(nums)))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def max_subarray(nums: List[int]) -> List[int]:
            current = nums[0]
            best = nums[0]
            temp_start = 0
            start = end = 0
            for i in range(1, len(nums)):
                if current < 0:
                    current = nums[i]
                    temp_start = i
                else:
                    current += nums[i]
                if current > best:
                    best = current
                    start = temp_start
                    end = i
            return nums[start:end + 1]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(x) for x in max_subarray(nums)))


        if __name__ == "__main__":
            main()
