    title: "Rotate Matrix by 90 Degrees"
    difficulty: Medium
    topic: "Arrays"
    subtopic: "Medium Problems"
    tags: [array, matrix]
    sourceUrl: "https://leetcode.com/problems/rotate-image/"
    statement: |
      Rotate an `n x n` square matrix by 90 degrees **clockwise**. The top row becomes the
      rightmost column, the rightmost column becomes the bottom row, and so on.

      Do the rotation in place, without allocating a second matrix.
    inputFormat: |
      - Line 1: an integer `n`.
      - Next `n` lines: `n` space-separated integers each.
    outputFormat: |
      Print the rotated matrix: `n` lines with `n` space-separated integers each.
    constraints:
      - "1 <= n <= 100"
      - "-1000 <= matrix[i][j] <= 1000"
    examples:
      - input: |
          3
          1 2 3
          4 5 6
          7 8 9
        output: |
          7 4 1
          8 5 2
          9 6 3
        explanation: "The first row 1 2 3 becomes the last column read top to bottom."
      - input: |
          2
          1 2
          3 4
        output: |
          3 1
          4 2
        explanation: "Each 2x2 element moves one corner clockwise."
    hints:
      - "Where does the cell at (i, j) end up after a clockwise rotation?"
      - "With a new matrix: result[j][n - 1 - i] = matrix[i][j]."
      - "In place: a clockwise rotation equals a transpose followed by reversing every row."
    explanation: |
      **New matrix — O(n²) time, O(n²) space.** The element at `(i, j)` moves to
      `(j, n - 1 - i)`. Fill a fresh matrix using that rule.

      **Transpose + reverse rows — O(n²) time, O(1) space.** Swap `matrix[i][j]` with
      `matrix[j][i]` for all `i < j` (transpose), then reverse each row. Transposing sends
      `(i, j)` to `(j, i)` and reversing the row sends it to `(j, n - 1 - i)`, exactly the
      clockwise position.

      (Rotating the four cells of each ring in cycles is another O(1)-space approach.)
