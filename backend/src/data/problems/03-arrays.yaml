    tags: [array, two-pointers]
    sourceUrl: "https://leetcode.com/problems/rearrange-array-elements-by-sign/"
    statement: |
      The array `nums` has even length and contains exactly as many positive numbers as
      negative numbers (there are no zeros). Rearrange it so that:

      1. positive and negative numbers **alternate**, starting with a positive number, and
      2. the positive numbers keep their original relative order, and so do the negative
         numbers.

      Print the rearranged array.
    inputFormat: |
      - Line 1: an even integer `n`.
      - Line 2: `n` space-separated non-zero integers, the array `nums`.
    outputFormat: |
      Print the rearranged array on one line, space-separated.
    constraints:
      - "2 <= n <= 2 * 10^5, n is even"
      - "1 <= |nums[i]| <= 10^5"
      - "nums has n/2 positive and n/2 negative values"
    examples:
      - input: |
          6
          3 1 -2 -5 2 -4
        output: |
          3 -2 1 -5 2 -4
        explanation: "Positives in order are 3, 1, 2 and negatives are -2, -5, -4; interleave them starting with 3."
      - input: |
          2
          -1 1
        output: |
          1 -1
        explanation: "The only positive is 1 and the only negative is -1."
    hints:
      - "Because order must be preserved within each sign, you cannot just swap elements around."
      - "Where does the k-th positive number go in the answer? Where does the k-th negative go?"
      - "Fill an answer array using one index for even positions and one for odd positions."
    explanation: |
      **Split and merge — O(n) time, O(n) space, two passes.** Collect the positives and the
      negatives into two lists (both keep their order), then write `pos[i]` to index `2i` and
      `neg[i]` to index `2i + 1`.

      **Single pass with two write indices — O(n) time, O(n) space.** Create an answer array
      and keep `even = 0` and `odd = 1`. For each element, place it at `even` (then `even += 2`)
      if it is positive, otherwise at `odd` (then `odd += 2`).

      Extra space is unavoidable here if you want linear time, because an in-place stable
      rearrangement requires shifting elements (O(n²)).
    starterCode:
      python: |
        import sys
        from typing import List


        def rearrange_by_sign(nums: List[int]) -> List[int]:
            # Return a new list alternating positive/negative, starting positive, order preserved.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(*rearrange_by_sign(nums))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def rearrange_by_sign(nums: List[int]) -> List[int]:
            result = [0] * len(nums)
            even, odd = 0, 1
            for x in nums:
                if x > 0:
                    result[even] = x
                    even += 2
                else:
                    result[odd] = x
                    odd += 2
            return result


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(*rearrange_by_sign(nums))


        if __name__ == "__main__":
            main()
