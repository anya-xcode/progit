    referenceSolution:
      python: |
        import sys
        from typing import List, Tuple


        def merge_in_place(a: List[int], b: List[int]) -> Tuple[List[int], List[int]]:
            n, m = len(a), len(b)
            total = n + m

            def get(index: int) -> int:
                return a[index] if index < n else b[index - n]

            def put(index: int, value: int) -> None:
                if index < n:
                    a[index] = value
                else:
                    b[index - n] = value

            gap = (total + 1) // 2
            while gap > 0:
                left = 0
                right = gap
                while right < total:
                    if get(left) > get(right):
                        get_left, get_right = get(left), get(right)
                        put(left, get_right)
                        put(right, get_left)
                    left += 1
                    right += 1
                if gap == 1:
                    break
                gap = (gap + 1) // 2
            return a, b


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            a = [int(x) for x in data[2:2 + n]]
            b = [int(x) for x in data[2 + n:2 + n + m]]
            a, b = merge_in_place(a, b)
            print(" ".join(str(x) for x in a))
            print(" ".join(str(x) for x in b))


        if __name__ == "__main__":
            main()
