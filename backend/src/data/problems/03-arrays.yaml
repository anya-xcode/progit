        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(x) for x in left_rotate_by_one(nums)))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def left_rotate_by_one(nums: List[int]) -> List[int]:
            first = nums[0]
            for i in range(len(nums) - 1):
                nums[i] = nums[i + 1]
            nums[-1] = first
            return nums


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(x) for x in left_rotate_by_one(nums)))


        if __name__ == "__main__":
            main()
