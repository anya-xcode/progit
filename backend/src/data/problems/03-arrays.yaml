    tags: [array, math, bit-manipulation]
    sourceUrl: ""
    statement: |
      The numbers `1, 2, ..., n` were written into an array, one of them was removed, and the
      remaining `n - 1` numbers were shuffled. Given this array, find the number that was
      removed.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n - 1` space-separated distinct integers, each between 1 and `n`.
    outputFormat: |
      Print the missing number.
    constraints:
      - "2 <= n <= 10^5"
      - "All given numbers are distinct and lie in [1, n]"
    examples:
      - input: |
          5
          1 2 4 5
        output: |
          3
        explanation: "The numbers 1..5 should be present; 3 is absent."
      - input: |
          2
          2
        output: |
          1
        explanation: "With n = 2 only the number 2 is given, so 1 is missing."
    hints:
      - "What is the sum of 1 + 2 + ... + n?"
      - "The difference between the expected sum and the actual sum is the answer."
      - "XOR offers an overflow-free alternative: x ^ x = 0."
    explanation: |
      **Search each value — O(n²) time, O(1) space.** For every `v` from 1 to `n`, scan the
      array to see whether `v` is present.

      **Presence array — O(n) time, O(n) space.** Mark each number in a boolean array of size
      `n + 1` and report the unmarked index.

      **Sum formula or XOR — O(n) time, O(1) space.** The expected total is `n·(n+1)/2`;
      subtracting the actual sum leaves the missing value. Equivalently, XOR all numbers
      `1..n` together with all array elements: every present value cancels out, leaving
      the missing one (this avoids overflow in fixed-width languages).
    starterCode:
      python: |
        import sys
        from typing import List


        def missing_number(nums: List[int], n: int) -> int:
            # nums contains n - 1 distinct values from 1..n; return the absent one.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:n]]
            print(missing_number(nums, n))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def missing_number(nums: List[int], n: int) -> int:
            result = 0
            for v in range(1, n + 1):
                result ^= v
            for x in nums:
                result ^= x
            return result


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:n]]
            print(missing_number(nums, n))


        if __name__ == "__main__":
            main()
