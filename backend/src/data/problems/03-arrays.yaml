    sourceUrl: "https://leetcode.com/problems/best-time-to-buy-and-sell-stock/"
    statement: |
      `prices[i]` is the price of a stock on day `i`. You may buy one share on some day and
      sell it on a **strictly later** day, at most once.

      Find the maximum profit you can make. If no trade makes money, the answer is `0`
      (you simply do not trade).
    inputFormat: |
      - Line 1: an integer `n`, the number of days.
      - Line 2: `n` space-separated integers, the array `prices`.
    outputFormat: |
      Print the maximum achievable profit.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= prices[i] <= 10^4"
    examples:
      - input: |
          6
          8 2 6 1 9 4
        output: |
          8
        explanation: "Buy on day 1 at price 2 and sell on day 4 at price 9 for a profit of 7."
      - input: |
          4
          9 7 4 1
        output: |
          0
        explanation: "Prices only fall, so every trade would lose money; do not trade."
    hints:
      - "For a fixed selling day, which buying day is best?"
      - "Keep track of the minimum price seen so far while scanning the days."
    explanation: |
      **Every pair of days — O(n²) time, O(1) space.** Try each buy day with each later sell
      day and keep the largest difference.

      **Running minimum — O(n) time, O(1) space.** Scan the days once, maintaining
      `min_price`, the cheapest price seen before today. Selling today yields
      `prices[i] - min_price`; update the best profit with it, then update `min_price`.
      Starting the best profit at 0 handles the case where no profitable trade exists.
    starterCode:
      python: |
        import sys
        from typing import List


        def max_profit(prices: List[int]) -> int:
            # Return the best profit from one buy followed by one later sell (0 if none).
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(max_profit(nums))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def max_profit(prices: List[int]) -> int:
            best = 0
            min_price = prices[0]
            for price in prices[1:]:
                best = max(best, price - min_price)
                min_price = min(min_price, price)
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(max_profit(nums))


        if __name__ == "__main__":
            main()
