  - sheetId: prob-3-1-8-linear-search
    slug: linear-search
    title: "Linear Search"
    difficulty: Easy
    topic: "Arrays"
    subtopic: "Easy Problems"
    tags: [array, searching]
    sourceUrl: ""
    statement: |
      Given an unsorted integer array `nums` and a value `target`, report the **first** position
      where `target` occurs.

      Positions are 0-indexed. If `target` never occurs, report `-1`.
    inputFormat: |
      - Line 1: two integers `n` and `target`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print one integer: the smallest index `i` with `nums[i] == target`, or `-1` if there is
      no such index.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i], target <= 10^9"
    examples:
      - input: |
          6 12
          4 12 9 12 1 3
        output: |
          1
        explanation: "12 sits at positions 1 and 3; the first one is index 1."
      - input: |
          4 7
          1 2 3 4
        output: |
          -1
        explanation: "The array holds no 7, so the answer is -1."
    hints:
      - "The array is not sorted, so nothing can be skipped - you may have to look at every element."
      - "Scan from left to right and stop at the very first match so the smallest index wins."
    explanation: |
      **Sequential scan - O(n) time, O(1) space.** Walk the array from index 0 upwards and return
      as soon as `nums[i] == target`. Returning on the first hit is what makes the answer the
      *smallest* index; if the loop finishes, the value is absent and the answer is `-1`.

      **Why nothing better exists here.** In an arbitrary (unsorted) array, any element you have
      not inspected could be the target, so an algorithm that looks at fewer than `n` elements can
      be wrong. Linear search is therefore optimal for unsorted data. On average it inspects about
      `n / 2` elements when the target is present.

      **Hashing - O(n) preprocessing, O(1) per query, O(n) space.** If you had to answer many
      queries on the same array, build a dictionary `value -> first index` once and answer each
      query instantly. For a single query that preprocessing costs more than it saves.
    starterCode:
      python: |
        import sys
        from typing import List


        def linear_search(nums: List[int], target: int) -> int:
            # Return the first index of target, or -1 if it is not present.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, target = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(linear_search(nums, target))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def linear_search(nums: List[int], target: int) -> int:
            for i, value in enumerate(nums):
                if value == target:
                    return i
            return -1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, target = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(linear_search(nums, target))


        if __name__ == "__main__":
            main()
