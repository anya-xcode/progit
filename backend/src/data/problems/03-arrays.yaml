  - sheetId: prob-3-1-14-longest-subarray-with-sum
    slug: longest-subarray-with-sum-k-negatives
    title: "Longest subarray with sum K"
    difficulty: Medium
    topic: "Arrays"
    subtopic: "Easy Problems"
    tags: [array, hashing, prefix-sum]
    sourceUrl: ""
    statement: |
      You are given an integer array `nums` that may contain **positive numbers, negative numbers
      and zeros**, together with an integer `k`.

      A subarray is a block of consecutive elements. Find the length of the **longest** subarray
      whose elements add up to exactly `k`. If no subarray has that sum, the answer is `0`.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print one integer: the length of the longest subarray with sum `k`, or `0` if none exists.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
      - "-10^14 <= k <= 10^14"
    examples:
      - input: |
          6 6
          2 3 1 5 -1 2
        output: |
          3
        explanation: "Both [2, 3, 1] (positions 0..2) and [5, -1, 2] (positions 3..5) add up to 6, and no longer block does, so the answer is 3."
      - input: |
          5 -2
          -1 -1 1 -1 -1
        output: |
          4
        explanation: "Positions 1..4 hold [-1, 1, -1, -1], which sums to -2 and has length 4; nothing longer works."
    hints:
      - "Write the sum of nums[i..j] as prefix[j] - prefix[i - 1]; the condition becomes prefix[j] - k = prefix[i - 1]."
      - "Store, for every prefix sum you have seen, the EARLIEST index where it occurred - that makes the subarray as long as possible."
      - "The two-pointer / sliding-window trick does not work here, because adding a negative number can make the running sum shrink."
    explanation: |
      **All subarrays - O(n²) time, O(1) space.** Fix a left end `i`, extend `j` to the right while
      keeping a running sum, and record the length whenever the sum equals `k`. Fine for small `n`,
      too slow for 10^5.

      **Prefix sums + hash map - O(n) time, O(n) space (optimal).** Let `prefix[j]` be the sum of
      `nums[0..j]`. A subarray `i..j` sums to `k` exactly when `prefix[j] - prefix[i-1] == k`, i.e.
      `prefix[i-1] == prefix[j] - k`. Sweep `j` from left to right keeping a dictionary
      `prefix value -> first index where it appeared`. At each `j`, look up `prefix[j] - k`; if it
      is there at index `p`, the candidate length is `j - p`. Also handle the case
      `prefix[j] == k`, which means the subarray starts at index 0 (store the sentinel
      `prefix 0 -> index -1` to get this for free). Insert `prefix[j]` only when it is new, so the
      stored index is always the earliest one and the subarray found is the longest.

      **Why not a sliding window?** With only non-negative values the running sum grows as the
      window grows, so shrinking from the left is safe. Negative values break that monotonicity:
      a window whose sum overshoots `k` may still be extendable into a valid one, so the window
      technique is unsound and the hash-map method is needed.
    starterCode:
      python: |
        import sys
        from typing import List


        def longest_subarray_with_sum(nums: List[int], k: int) -> int:
            # Return the length of the longest subarray whose elements sum to k.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(longest_subarray_with_sum(nums, k))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def longest_subarray_with_sum(nums: List[int], k: int) -> int:
            first_index = {0: -1}
            prefix = 0
            best = 0
            for j, value in enumerate(nums):
                prefix += value
                if prefix - k in first_index:
                    best = max(best, j - first_index[prefix - k])
                if prefix not in first_index:
                    first_index[prefix] = j
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(longest_subarray_with_sum(nums, k))


        if __name__ == "__main__":
            main()
