        import sys
        from typing import List


        def sort_colors(nums: List[int]) -> None:
            # Sort nums (containing only 0, 1, 2) in place.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            sort_colors(nums)
            print(*nums)


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def sort_colors(nums: List[int]) -> None:
            low, mid, high = 0, 0, len(nums) - 1
            while mid <= high:
                if nums[mid] == 0:
                    nums[low], nums[mid] = nums[mid], nums[low]
                    low += 1
                    mid += 1
                elif nums[mid] == 1:
                    mid += 1
                else:
                    nums[mid], nums[high] = nums[high], nums[mid]
                    high -= 1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            sort_colors(nums)
            print(*nums)


        if __name__ == "__main__":
            main()
