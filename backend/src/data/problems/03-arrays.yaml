      - "A temporary array of the first k elements makes this straightforward in O(n) time."
      - "For O(1) extra space: reverse the first k elements, reverse the rest, then reverse the whole array."
    explanation: |
      **Rotate one step at a time — O(n·k) time, O(1) space.** Repeat a single left
      rotation `k mod n` times. Too slow when `k` and `n` are large.

      **Temporary array — O(n) time, O(k) space.** Set `k = k mod n`, copy the first `k`
      elements aside, shift the remaining `n - k` elements to the front and paste the saved
      elements at the end.

      **Reversal trick — O(n) time, O(1) space.** With `k = k mod n`, reverse `nums[0..k-1]`,
      reverse `nums[k..n-1]`, and finally reverse the whole array. Each block ends up in its
      rotated position with its internal order restored.
