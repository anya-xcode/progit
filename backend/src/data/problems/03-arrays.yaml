  - sheetId: prob-3-1-9-union-of-two-sorted-array
    slug: union-of-two-sorted-arrays
    title: "Union of two sorted arrays"
    difficulty: Easy
    topic: "Arrays"
    subtopic: "Easy Problems"
    tags: [array, two-pointers]
    sourceUrl: ""
    statement: |
      Two arrays `a` and `b` are given, each already sorted in **non-decreasing** order. Either of
      them may contain repeated values.

      Produce their **union**: every value that appears in `a` or in `b`, listed once each, in
      increasing order.
    inputFormat: |
      - Line 1: two integers `n` and `m`, the sizes of `a` and `b`.
      - Line 2: `n` space-separated integers, the array `a` (empty line when `n = 0`).
      - Line 3: `m` space-separated integers, the array `b` (empty line when `m = 0`).
    outputFormat: |
      Print the distinct values of the union on one line, space separated, in increasing order.
    constraints:
      - "0 <= n, m <= 10^5"
      - "n + m >= 1"
      - "-10^9 <= a[i], b[i] <= 10^9"
      - "a and b are sorted in non-decreasing order"
    examples:
      - input: |
          5 4
          1 2 3 4 5
          2 3 7 8
        output: |
          1 2 3 4 5 7 8
        explanation: "2 and 3 are in both arrays but are printed once; the rest are merged in order."
      - input: |
          3 3
          1 1 1
          1 1 1
        output: |
          1
        explanation: "Both arrays only hold 1, so the union is the single value 1."
    hints:
      - "Both inputs are already sorted - you should never have to sort anything again."
      - "Keep one index into each array and always consume the smaller front value."
      - "Before appending a value, compare it with the last value you appended to skip duplicates."
    explanation: |
      **Set + sort - O((n + m) log(n + m)) time, O(n + m) space.** Dump both arrays into a set and
      sort it. Correct, but it throws away the fact that the inputs are already ordered.

      **Two pointers - O(n + m) time, O(1) extra space besides the answer.** Keep `i` in `a` and
      `j` in `b`. Repeatedly take the smaller of `a[i]` and `b[j]` (either one when they are
      equal, advancing both), and append it only if it differs from the last value already
      appended. When one array runs out, drain the other the same way. Each index moves forward
      only, so the total work is linear - the best possible, since every element has to be read.

      **Duplicate handling.** Because the output is built in increasing order, "already present"
      can only mean "equal to the last value appended", which makes the check O(1) with no extra
      memory.
    starterCode:
      python: |
        import sys
        from typing import List


        def union_sorted(a: List[int], b: List[int]) -> List[int]:
            # Return the sorted list of values appearing in a or b, without duplicates.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            a = [int(x) for x in data[2:2 + n]]
            b = [int(x) for x in data[2 + n:2 + n + m]]
            print(" ".join(str(x) for x in union_sorted(a, b)))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def union_sorted(a: List[int], b: List[int]) -> List[int]:
            i = j = 0
            result: List[int] = []

            def push(value: int) -> None:
                if not result or result[-1] != value:
                    result.append(value)

            while i < len(a) and j < len(b):
                if a[i] < b[j]:
                    push(a[i])
                    i += 1
                elif b[j] < a[i]:
                    push(b[j])
                    j += 1
                else:
                    push(a[i])
                    i += 1
                    j += 1
            while i < len(a):
                push(a[i])
                i += 1
            while j < len(b):
                push(b[j])
                j += 1
            return result


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            a = [int(x) for x in data[2:2 + n]]
            b = [int(x) for x in data[2 + n:2 + n + m]]
            print(" ".join(str(x) for x in union_sorted(a, b)))


        if __name__ == "__main__":
            main()
