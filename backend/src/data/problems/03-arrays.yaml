  - sheetId: prob-3-3-11-reverse-pairs
    slug: reverse-pairs
    title: "Reverse Pairs"
    difficulty: Hard
    topic: "Arrays"
    subtopic: "Hard Problems"
    tags: [array, merge-sort, divide-and-conquer]
    sourceUrl: "https://leetcode.com/problems/reverse-pairs/"
    statement: |
      A pair of positions `(i, j)` is a **reverse pair** when `i < j` and `nums[i] > 2 * nums[j]`.

      Count the reverse pairs in the given integer array. Note the factor of two: this is stricter
      than counting plain inversions.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print one integer: the number of reverse pairs.
    constraints:
      - "1 <= n <= 5·10^4"
      - "-10^9 <= nums[i] <= 10^9"
    examples:
      - input: |
          5
          1 3 2 3 1
        output: |
          2
        explanation: "The qualifying pairs are (3, 1) at positions 1 and 4 and (3, 1) at positions 3 and 4, since 3 > 2 * 1."
      - input: |
          4
          1 2 3 4
        output: |
          0
        explanation: "The array increases, so no earlier value can exceed twice a later one."
    hints:
      - "Counting pairs across a split is easier when both halves are sorted - that is the merge sort idea."
      - "During the merge step, before merging, run a separate two-pointer pass that counts pairs (i in left, j in right) with left[i] > 2 * right[j]."
      - "That counting pointer only moves forward across the whole merge, so the extra pass is O(size) and does not change the overall O(n log n)."
    explanation: |
      **All pairs - O(n²) time, O(1) space.** Two nested loops testing `nums[i] > 2 * nums[j]`.
      Correct, but 5·10^4 elements means 1.25 billion checks.

      **Merge sort with a counting pass - O(n log n) time, O(n) space (optimal).** Sort the array
      with merge sort. At every merge of a sorted left half `L` and sorted right half `R`, all
      reverse pairs whose `i` lies in `L` and `j` in `R` can be counted before merging: walk
      `i` over `L` while advancing a pointer `j` over `R` as long as `L[i] > 2 * R[j]`, then add
      `j - start` to the answer. Because both halves are sorted, `j` never needs to move back when
      `i` advances, so the pass is linear. Pairs inside a half are counted by the recursive calls,
      so every pair is counted exactly once. The recursion depth is `log n` and each level costs
      O(n).

      **Why the counting must be separate from the merge.** The merge compares `L[i]` with `R[j]`,
      while the counting compares `L[i]` with `2 * R[j]` - different thresholds, so they advance at
      different speeds and cannot share one pointer.

      **Binary indexed tree - O(n log n) time, O(n) space.** Coordinate-compress the values and
      sweep right to left, querying how many already-seen values are below `nums[i] / 2`. Same
      complexity, different machinery.
