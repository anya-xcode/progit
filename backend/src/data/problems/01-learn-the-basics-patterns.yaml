        explanation: "The rules above applied with n = 4."
      - input: |2
          1
        output: |2
          **
          **
        explanation: "The rules above applied with n = 1."
    hints:
      - "Each row is three pieces: left wing, gap, right wing."
      - "The wing width plus half the gap is always n, which keeps the total width at 2n."
    explanation: |2
      **Two loops — O(n^2) time, O(1) extra space.** Write one helper that prints a
      row given its wing width, then call it with widths `n, n-1, ..., 1` and again
      with `1, 2, ..., n`. Since `wings + gap/2 = n`, every line is exactly `2n`
      characters wide.

      Unlike the half diamond, the narrowest row *is* printed twice here — that is
      what makes the middle of the butterfly look open.
