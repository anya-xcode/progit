    statement: |2
      Print a left-aligned right-angled triangle of stars that shrinks downwards.

      There are `n` rows. The first row has `n` stars, and every following row has one
      star fewer, so row `i` has `n - i + 1` stars. The stars are written one after
      another with no spaces between them and no spaces before the first star.

      For `n = 4` the expected picture is

      ```
      ****
      ***
      **
      *
      ```
    inputFormat: |2
      - A single line containing one integer `n`.
    outputFormat: |2
      Print `n` lines. Line `i` contains `n - i + 1` `*` characters with nothing
      between them.
    constraints:
      - "1 <= n <= 20"
      - "n is given as a single integer on one line."
    examples:
      - input: |2
          4
        output: |2
          ****
          ***
          **
          *
        explanation: "The rules above applied with n = 4."
      - input: |2
          1
        output: |2
          *
        explanation: "The rules above applied with n = 1."
    hints:
      - "The widest row comes first this time."
      - "If the row number is i, how many stars are left? Count down from n."
    explanation: |2
      **Nested loops — O(n^2) time, O(1) extra space.** The only change from the
      growing triangle is the star count: row `i` prints `n - i + 1` stars instead of
