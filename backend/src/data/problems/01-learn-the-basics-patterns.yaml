    statement: |2
      Print the outline of a square: stars on the border, empty space inside.

      The grid has `n` rows and `n` columns. A cell holds a star when it lies on the
      first row, the last row, the first column or the last column; every other cell
      is a space.

      That means the first and last rows are solid blocks of `n` stars, and each row
      in between is one star, `n - 2` spaces, and one star. When `n = 1` the single
      row is just `*`, and when `n = 2` both rows are `**`.

      For `n = 4` the expected picture is

      ```
      ****
      *  *
      *  *
      ****
      ```
    inputFormat: |2
      - A single line containing one integer `n`.
    outputFormat: |2
      Print `n` lines of `n` characters each, using `*` on the border of the square
      and a space elsewhere.

      The judge collapses the run of spaces inside a line to a single space, so what
      it checks is where the stars sit on each row.
    constraints:
      - "1 <= n <= 20"
      - "n is given as a single integer on one line."
    examples:
      - input: |2
          4
        output: |2
          ****
          *  *
          *  *
          ****
        explanation: "The rules above applied with n = 4."
      - input: |2
          1
        output: |2
          *
        explanation: "The rules above applied with n = 1."
    hints:
      - "Decide per cell: is its row or its column on the edge?"
      - "Handle n = 1 and n = 2 by thinking about what the rule says, not by adding special cases."
    explanation: |2
      **Cell-by-cell test — O(n^2) time, O(1) extra space.** Loop over rows and
      columns and print `*` when `row == 1 or row == n or col == 1 or col == n`, else
      a space. The rule handles `n = 1` and `n = 2` on its own, because then every
      cell is on some edge.

      **Row-at-a-time — still O(n^2) output, but only `n` prints.** The first and last
      rows are `"*" * n`; every other row is `"*" + " " * (n - 2) + "*"`. This is the
      version worth writing once you trust the rule.
