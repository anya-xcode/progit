      There are `n` rows and row `i` contains exactly `i` values separated by a single
      space. Within a row the values alternate between `1` and `0`. The first value of
      a row is `1` when the row number is odd and `0` when the row number is even, so
      the first column reads `1, 0, 1, 0, ...` downwards.

      For example row 1 is `1`, row 2 is `0 1`, row 3 is `1 0 1` and row 4 is
      `0 1 0 1`.

      For `n = 4` the expected picture is

      ```
      1
      0 1
      1 0 1
      0 1 0 1
      ```
    inputFormat: |2
      - A single line containing one integer `n`.
    outputFormat: |2
