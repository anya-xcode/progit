    statement: |2
      Print a left-aligned triangle in which every row repeats its own row number.

      There are `n` rows. Row `i` contains the number `i` written `i` times,
      separated by a single space. So row 1 is a single `1`, row 2 is `2 2`, row 3 is
      `3 3 3`, and so on.

      For `n = 4` the expected picture is

      ```
      1
      2 2
      3 3 3
      4 4 4 4
      ```
    inputFormat: |2
      - A single line containing one integer `n`.
    outputFormat: |2
      Print `n` lines. Line `i` contains the integer `i` repeated `i` times,
      separated by a single space.
    constraints:
      - "1 <= n <= 20"
      - "n is given as a single integer on one line."
    examples:
      - input: |2
          4
        output: |2
          1
          2 2
          3 3 3
          4 4 4 4
        explanation: "The rules above applied with n = 4."
      - input: |2
          1
        output: |2
          1
        explanation: "The rules above applied with n = 1."
    hints:
      - "Both the value you print and how many times you print it come from the row number."
      - "Only the outer loop variable is needed inside the inner loop."
    explanation: |2
      **Nested loops — O(n^2) time, O(1) extra space.** Row `i` runs an inner loop
      `i` times, and every iteration prints the same value `i`. The inner loop
      variable is never used, which is the whole point of the exercise: the value is
      controlled by the *outer* loop.

      In Python the row is `" ".join([str(row)] * row)`.
