      - "Inside the row, flip a 0/1 variable after printing it."
    explanation: |2
      **Nested loops with a toggle — O(n^2) time, O(1) extra space.** Set
      `value = 1` if the row index is odd and `0` if it is even, print it, then flip
      it with `value = 1 - value` after each position.

      An equivalent closed form avoids the toggle: the entry at row `i`, position `j`
      (both 1-based) is `(i + j) % 2`, which is exactly the chessboard colouring of
      the triangle.
