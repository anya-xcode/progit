    statement: |2
      Print a butterfly: two solid wings that pull apart and then come back
      together.

      The output has `2n` rows, each exactly `2n` characters wide.

      - For rows 1 to `n`, row `i` is `n - i + 1` stars, then `2(i - 1)` spaces, then
        `n - i + 1` stars again.
      - Rows `n + 1` to `2n` repeat those rows in reverse order, so row `n + 1` is
        identical to row `n` and the last row is identical to the first.

      The first and last rows are solid blocks of `2n` stars; the two rows in the
      middle are the most open, with a single star on each side.

      For `n = 4` the expected picture is

      ```
      ********
      ***  ***
      **    **
      *      *
      *      *
      **    **
      ***  ***
      ********
      ```
    inputFormat: |2
      - A single line containing one integer `n`.
    outputFormat: |2
      Print `2n` lines as described: on line `i` (for `i <= n`) a block of
      `n - i + 1` stars, a gap of `2(i - 1)` spaces, and another block of
      `n - i + 1` stars; lines `n + 1 .. 2n` mirror lines `n .. 1`.

      The judge collapses the run of spaces in the gap to a single space, so what it
      checks is the two star blocks on every line.
    constraints:
      - "1 <= n <= 20"
      - "n is given as a single integer on one line."
    examples:
