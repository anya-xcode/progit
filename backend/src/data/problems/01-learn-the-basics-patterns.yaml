    statement: |2
      Print a centred pyramid of letters that climbs up and comes back down.

      There are `n` rows. Row `i` is built from two parts, in this order:

      1. `n - i` spaces,
      2. `2i - 1` letters separated by a single space: the alphabet climbs from `A` up
         to the `i`-th letter and then walks back down to `A`.

      So row 1 is `A`, row 2 is `A B A`, row 3 is `A B C B A`, and so on. The middle
      letter of row `i` is the `i`-th letter of the alphabet and the row reads the
      same forwards and backwards.

      For `n = 4` the expected picture is

      ```
         A
        A B A
       A B C B A
      A B C D C B A
      ```
    inputFormat: |2
      - A single line containing one integer `n`.
    outputFormat: |2
      Print `n` lines. Line `i` is `n - i` spaces followed by the `2i - 1` letters
      `A ... (i-th letter) ... A`, separated by a single space.

      The leading spaces centre the pyramid; the judge trims leading and trailing
      spaces and collapses runs of spaces inside a line, so what it really checks is
      the sequence of letters on each row.
    constraints:
      - "1 <= n <= 20"
      - "n never exceeds 26, so the letters stay within A..Z."
    examples:
