    tags: [patterns, loops, stars]
    sourceUrl: ""
    statement: |2
      Print a filled square made of stars.

      The square has exactly `n` rows and every row is exactly `n` stars written one
      after another with no spaces between them.

      For `n = 4` the expected picture is

      ```
      ****
      ****
      ****
      ****
      ```
    inputFormat: |2
      - A single line containing one integer `n`.
    outputFormat: |2
      Print `n` lines. Line `i` (for every `i` from 1 to `n`) contains `n` `*`
      characters with nothing between them.
    constraints:
      - "1 <= n <= 20"
      - "n is given as a single integer on one line."
    examples:
      - input: |2
          4
        output: |2
          ****
          ****
          ****
          ****
        explanation: "The rules above applied with n = 4."
      - input: |2
          1
        output: |2
          *
        explanation: "The rules above applied with n = 1."
    hints:
      - "One loop prints the rows; inside it you always print the same text."
      - "In Python the whole row is just `\"*\" * n`."
    explanation: |2
      **Two nested loops — O(n^2) time, O(1) extra space.** The outer loop walks over
      the `n` rows; the inner loop prints `n` stars and then a newline ends the row.

      Because every row is identical you can skip the inner loop and build the row
      string once (`"*" * n`), then print it `n` times. Printing a prepared string is
      also much faster than `n * n` separate writes.
