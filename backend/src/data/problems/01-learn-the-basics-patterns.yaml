      python: |2
        import sys


        def pattern(n: int) -> None:
            for row in range(1, n + 1):
                letters = [chr(ord("A") + index) for index in range(row)]
                letters += letters[-2::-1]
                print(" " * (n - row) + " ".join(letters))


