  - sheetId: prob-1-3-2-pattern-2
    slug: pattern-2
    title: "Pattern 2"
    difficulty: Easy
    topic: "Patterns"
    subtopic: "Patterns"
    tags: [patterns, loops, stars]
    sourceUrl: ""
    statement: |2
      Print a left-aligned right-angled triangle of stars that grows downwards.

      There are `n` rows. Row `i` contains exactly `i` stars written one after another
      with no spaces between them, and no spaces before the first star, so the
      vertical side of the triangle is on the left.

      For `n = 4` the expected picture is

      ```
      *
      **
      ***
      ****
      ```
    inputFormat: |2
      - A single line containing one integer `n`.
    outputFormat: |2
      Print `n` lines. Line `i` contains `i` `*` characters with nothing between
      them.
    constraints:
      - "1 <= n <= 20"
      - "n is given as a single integer on one line."
    examples:
      - input: |2
          4
        output: |2
          *
          **
          ***
          ****
        explanation: "The rules above applied with n = 4."
      - input: |2
          1
        output: |2
          *
        explanation: "The rules above applied with n = 1."
    hints:
      - "The number of stars on a row is the row number itself."
      - "Let the outer loop variable run from 1 to n and reuse it as the star count."
    explanation: |2
      **Nested loops — O(n^2) time, O(1) extra space.** Row `i` needs `i` stars, so
      the inner loop runs `i` times. The total work is `1 + 2 + ... + n = n(n+1)/2`
      characters, which is `O(n^2)`.

      The idiomatic Python version replaces the inner loop with the repeated string
      `"*" * row`, which builds the row in one step.
