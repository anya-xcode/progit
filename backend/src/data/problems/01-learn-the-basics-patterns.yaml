  - sheetId: prob-1-3-7-pattern-7
    slug: pattern-7
    title: "Pattern 7"
    difficulty: Easy
    topic: "Patterns"
    subtopic: "Patterns"
    tags: [patterns, loops, stars]
    sourceUrl: ""
    statement: |2
      Print a centred pyramid of stars.

      There are `n` rows, each exactly `2n - 1` characters wide. Row `i` is built from
      three parts, in this order:

      1. `n - i` spaces,
      2. `2i - 1` stars written one after another with no spaces between them,
      3. nothing else (do not pad the end of the line).

      So the top row is a single star and the bottom row is a solid block of
      `2n - 1` stars.

      For `n = 4` the expected picture is

      ```
         *
        ***
       *****
      *******
      ```
    inputFormat: |2
      - A single line containing one integer `n`.
    outputFormat: |2
      Print `n` lines. Line `i` is `n - i` spaces followed by `2i - 1` `*`
      characters.

      The leading spaces are what centres the pyramid; the judge trims leading and
      trailing spaces and collapses runs of spaces inside a line, so what it really
      checks is the number of stars on each row.
    constraints:
      - "1 <= n <= 20"
      - "n is given as a single integer on one line."
    examples:
      - input: |2
          4
        output: |2
             *
            ***
           *****
          *******
        explanation: "The rules above applied with n = 4."
      - input: |2
          1
        output: |2
          *
        explanation: "The rules above applied with n = 1."
    hints:
      - "Count the spaces and the stars separately: they follow two different formulas."
      - "Row i has an odd number of stars: 1, 3, 5, ... which is 2i - 1."
    explanation: |2
      **Nested loops — O(n^2) time, O(1) extra space.** Each row is printed in two
      stages: first the `n - i` spaces that push the block to the right place, then
      the `2i - 1` stars.

      The two formulas are worth memorising because almost every centred pattern
      reuses them: the space count shrinks by one per row while the star count grows
      by two, which keeps the total width fixed at `2n - 1`.
