          A B C D C B A
        explanation: "The rules above applied with n = 4."
      - input: |2
          1
        output: |2
          A
        explanation: "The rules above applied with n = 1."
    hints:
      - "Print the increasing half up to the i-th letter, then the decreasing half back to A."
      - "Do not print the middle letter twice — the second half starts one step below it."
    explanation: |2
      **Nested loops — O(n^2) time, O(1) extra space.** After the `n - i` spaces,
      print `A` up to the `i`-th letter, then continue downwards from the
      `(i-1)`-th letter back to `A`. That gives `i + (i - 1) = 2i - 1` letters, the
      same odd widths as the star pyramid.

      A shortcut: build the increasing half as a list, then append a reversed copy of
      it without its last element.
    starterCode:
