    referenceSolution:
      python: |
        import sys
        from typing import List


        def palindrome_partitions(s: str) -> List[List[str]]:
            n = len(s)
            is_pal = [[False] * n for _ in range(n)]
            for i in range(n - 1, -1, -1):
                for j in range(i, n):
                    if s[i] == s[j] and (j - i < 2 or is_pal[i + 1][j - 1]):
                        is_pal[i][j] = True

            result: List[List[str]] = []
            pieces: List[str] = []

            def build(start: int) -> None:
                if start == n:
                    result.append(list(pieces))
                    return
                for end in range(start, n):
                    if is_pal[start][end]:
                        pieces.append(s[start:end + 1])
                        build(end + 1)
                        pieces.pop()

            build(0)
            return result


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            s = sys.stdin.read().split()[0]
            parts = palindrome_partitions(s)
            out = [str(len(parts))]
            out.extend(" ".join(p) for p in parts)
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
