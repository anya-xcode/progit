  - slug: word-search
    title: "Word Search"
    difficulty: Medium
    topic: "Recursion"
    subtopic: "Hard Problems"
    tags: ["recursion", "backtracking", "matrix"]
    sourceUrl: "https://leetcode.com/problems/word-search/"
    statement: |
      You are given a grid of letters with `r` rows and `c` columns and a string
      `word`. Decide whether `word` can be traced in the grid.

      A trace starts on any cell whose letter equals the first character of `word`
      and moves step by step to a **horizontally or vertically adjacent** cell for
      each following character. A single cell may be used **at most once** within
      one trace. Letters are case-sensitive.
    inputFormat: |
      - Line 1: two integers `r` and `c`.
      - Next `r` lines: `c` space-separated letters each, the grid rows.
      - Last line: the string `word`.
    outputFormat: |
      Print `true` if `word` can be traced, otherwise `false`.
    constraints:
      - "1 <= r, c <= 6"
      - "1 <= length of word <= 15"
      - "The grid and `word` contain only English letters (uppercase and lowercase)."
    examples:
      - input: |
          3 4
          C A T S
          X O D E
          P G U S
          CATDOG
        output: |
          true
        explanation: "Using (row, column): C(0,0) -> A(0,1) -> T(0,2) -> D(1,2) -> O(1,1) -> G(2,1). Each step moves to an adjacent cell and no cell repeats."
      - input: |
          2 2
          A B
          C D
          ABDCA
        output: |
          false
        explanation: "A -> B -> D -> C walks around the square, but the final A would need to reuse the starting cell, which is not allowed."
    hints:
      - "Try every cell as a starting point for the first letter."
      - "From a cell matching word[i], recursively look for word[i + 1] in the four neighbours."
      - "Mark the current cell as used before recursing and restore it afterwards (backtracking), so the same cell is not used twice in one path."
    explanation: |
      **Enumerate all paths - exponential.** Generating every simple path of length
      `len(word)` in the grid and comparing it with the word explores far too many
      irrelevant paths.

      **DFS with backtracking - O(r * c * 3^L) time, O(L) recursion depth.** For each
      starting cell call `dfs(row, col, i)`: fail if out of bounds or the letter does
      not equal `word[i]`; succeed if `i` is the last index. Otherwise temporarily
      overwrite the cell with a marker (so it cannot be reused), recurse into the four
      neighbours with `i + 1`, and restore the letter. After the first step each cell
      has at most 3 unvisited neighbours to try, giving the `3^L` factor for word
      length `L`; mismatches prune most branches early.

      **Cheap pre-checks.** If the word is longer than `r * c`, or some letter appears
      more often in the word than in the grid, answer `false` immediately. Starting the
      search from whichever end of the word has the rarer letter can also cut the
      search dramatically.
    starterCode:
      python: |
        import sys
        from typing import List


        def exist(board: List[List[str]], word: str) -> bool:
            # Return True if word can be traced through adjacent, unused cells.
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().split("\n")
            r, c = map(int, lines[0].split())
            board = [lines[1 + i].split()[:c] for i in range(r)]
            word = lines[1 + r].strip()
            print("true" if exist(board, word) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def exist(board: List[List[str]], word: str) -> bool:
            rows, cols = len(board), len(board[0])
            if len(word) > rows * cols:
                return False

            def dfs(r: int, c: int, i: int) -> bool:
                if r < 0 or c < 0 or r >= rows or c >= cols or board[r][c] != word[i]:
                    return False
                if i == len(word) - 1:
                    return True
                saved = board[r][c]
                board[r][c] = "#"
                found = (
                    dfs(r + 1, c, i + 1)
                    or dfs(r - 1, c, i + 1)
                    or dfs(r, c + 1, i + 1)
                    or dfs(r, c - 1, i + 1)
                )
                board[r][c] = saved
                return found

            for r in range(rows):
                for c in range(cols):
                    if dfs(r, c, 0):
                        return True
            return False


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().split("\n")
            r, c = map(int, lines[0].split())
            board = [lines[1 + i].split()[:c] for i in range(r)]
            word = lines[1 + r].strip()
            print("true" if exist(board, word) else "false")


        if __name__ == "__main__":
            main()
