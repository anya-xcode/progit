          451923867
          293678154
          768541392
          326785941
          875419623
          149236578
          584192736
          637854219
          912367485
        explanation: "Each empty cell is filled by trying digits and undoing the ones that lead to a contradiction; because the clues admit a single completion, the printed board is the only possible one."
      - input: |
          896415732
          154723698
          237689451
          378196245
          542837169
          961254873
          615342987
          423978516
          789561324
        output: |
          896415732
          154723698
          237689451
          378196245
          542837169
          961254873
          615342987
          423978516
          789561324
        explanation: "This board has no empty cells, so there is nothing to decide and it is printed exactly as it was given."
    hints:
      - "Collect the coordinates of the empty cells once, then fill them one at a time: solve(i) decides the i-th empty cell and calls solve(i + 1)."
      - "Before writing a digit, make sure it does not already appear in the cell's row, its column, or its 3 x 3 box. The box index is (row // 3) * 3 + col // 3."
      - "Instead of rescanning 27 cells for every test, keep three arrays of 9 bitmasks - one per row, one per column, one per box - and flip the bit when you place or undo a digit. Each check then becomes a single AND."
    explanation: |
      **Try all fillings - O(9^E)** for `E` empty cells. Filling the blanks blindly and
      checking the board at the end is astronomically slow: a board with 50 blanks
      would need `9^50` attempts.

      **Backtracking with per-cell validation - O(9^E) worst case, O(E) recursion
      depth, but fast in practice.** Walk the empty cells in a fixed order. For cell
      `i`, try each digit `1..9`; if it conflicts with the row, column or box, skip it,
      otherwise write it and recurse on cell `i + 1`. If no digit works, erase and
      report failure to the caller, which then tries its next digit. The moment a
      partial board becomes inconsistent the whole subtree below it is abandoned, which
      is what makes the search finish in milliseconds on a real puzzle instead of
      running for ever.

      **Bitmask bookkeeping - same asymptotics, far smaller constants.** Keep
      `rows[r]`, `cols[c]`, `boxes[b]` as 9-bit masks of the digits already used. The
      candidates for a cell are `~(rows[r] | cols[c] | boxes[b])`, so testing a digit is
      one AND and placing or undoing one is one XOR. No inner loop over 27 cells,
      no rescanning.

      **Choosing the next cell well (MRV).** Instead of a fixed order, always pick the
      empty cell with the **fewest** candidates. A cell with a single candidate is
      forced and costs nothing; a cell with zero candidates proves the branch dead
      immediately. This "minimum remaining values" heuristic typically reduces the
      number of explored nodes by orders of magnitude on hard puzzles, at the cost of a
      scan over the remaining cells at each step.

      **Space.** Beyond the board itself, only the 27 masks and the recursion stack are
      needed: `O(E)` frames, at most 81.
