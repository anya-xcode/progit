    slug: m-coloring-problem
    title: "M Coloring Problem"
    difficulty: Hard
    topic: "Recursion"
    subtopic: "Trying out all Combos / Hard"
    tags: ["recursion", "backtracking", "graph"]
    sourceUrl: "https://www.naukri.com/code360/problems/m-coloring-problem"
    statement: |
      You are given an undirected graph with `n` nodes numbered `0` to `n-1` and `m`
      edges, together with a number of available colours `k`.

      Paint every node with one of the `k` colours so that **no edge joins two nodes of
      the same colour**. You do not have to use all the colours.

      Decide whether such a painting exists.

      The graph has no self-loops and no repeated edges.
    inputFormat: |
      - Line 1: three integers `n`, `m` and `k`.
      - Next `m` lines: two integers `u` and `v`, an undirected edge between nodes `u`
        and `v` (0-indexed).
    outputFormat: |
      Print `true` if the nodes can be coloured with at most `k` colours so that
      adjacent nodes differ, otherwise `false`.
    constraints:
      - "1 <= n <= 12"
      - "0 <= m <= n * (n - 1) / 2"
      - "1 <= k <= 5"
      - "0 <= u, v < n and u != v; no edge is listed twice."
    examples:
      - input: |
          4 5 3
          0 1
          1 2
          2 3
          3 0
          0 2
        output: |
          true
        explanation: "Paint node 0 with colour 1, node 1 with colour 2, node 2 with colour 3 and node 3 with colour 2. Every edge then joins two different colours, so three colours are enough."
      - input: |
          3 3 2
          0 1
          1 2
          2 0
        output: |
          false
        explanation: "The three nodes form a triangle, so all three must differ from one another; two colours cannot do it."
    hints:
      - "Colour the nodes in a fixed order 0, 1, 2, ... At node i you only have to check the neighbours that already have a colour."
      - "For each of the k colours, test whether any coloured neighbour already uses it. If none does, assign it, recurse on the next node, and reset it to 'uncoloured' if the recursion fails."
      - "Return as soon as one full colouring succeeds. A useful extra cut: colours are interchangeable, so for node i you never need to try a colour numbered higher than one more than the largest colour used so far."
    explanation: |
      **Try every assignment - O(k^n * m) time.** Enumerate all `k^n` ways of labelling
      the nodes and check every edge. For `n = 12` and `k = 5` that is 244 million
      labellings, far too many, but it is the definition of the problem and a good
      reference implementation to test against on small inputs.

      **Backtracking node by node - O(k^n) worst case, O(n) recursion depth.**
      `assign(node)`:

      - if `node == n`, every node is coloured and no conflict was ever created, so
        return `true`;
      - otherwise for `colour` in `1..k`: if no already-coloured neighbour of `node`
        uses `colour`, set it, and if `assign(node + 1)` succeeds return `true`;
        otherwise reset the node and try the next colour;
      - if no colour worked, return `false`.

      The saving over brute force is that a conflict is detected the moment it is
      created, so an entire subtree of `k^(n-node-1)` labellings disappears at once.
      Checking a candidate colour costs `O(deg(node))`, or `O(1)` if you keep a bitmask
      of the colours used by each node's neighbourhood.

      **Symmetry breaking.** Colours have no identity: any colouring stays valid if you
      permute the colour names. So when colouring node `i` there is no point trying a
      colour numbered higher than `1 + (largest colour used so far)` - every such
      choice is a renaming of one you already tried. This cut alone removes a factor of
      roughly `k!` from the search and is what makes `n = 12` instant.

      **Cheap early answers.** If `k >= n` the answer is always `true` (give every node
      its own colour). If `k == 1` the answer is `true` exactly when there are no
      edges. And if some node has fewer than `k` neighbours it can always be coloured
      last - the basis of the greedy bound "a graph with maximum degree `d` is always
      `(d+1)`-colourable".
