  - sheetId: prob-7-2-4-learn-all-patterns-of-sub
    type: reference
    slug: learn-all-patterns-of-subsequences-theory
    title: "Learn All Patterns of Subsequences (Theory)"
    difficulty: Easy
    topic: "Recursion"
    subtopic: "Subsequences Pattern"
    tags: ["recursion", "theory", "subsequences"]
    sourceUrl: "https://www.naukri.com/code360/problems/learn-all-patterns-of-subsequences-theory"
    statement: |
      Almost every "try all possibilities" problem in this step is the same recursion
      wearing a different hat. This page is that recursion, written out once.

      ## What a subsequence is

      A **subsequence** of an array of length `n` is what you get by deleting zero or
      more elements while keeping the order of the ones that remain. Choosing a
      subsequence is exactly choosing, for each index, *in* or *out* - so there are
      `2^n` of them, including the empty subsequence and the whole array. That is
      different from a **subarray**, which must be contiguous (there are only
      `n(n+1)/2` of those).

      ## The one template: pick / not-pick

      Every subsequence problem is a walk down the indices where each level makes one
      binary decision.

      ```
      solve(index, state):
          if index == n:            # every element has been decided
              <use the completed choice>
              return

          take nums[index]: update state, solve(index + 1, ...), undo the update
          skip nums[index]:                 solve(index + 1, ...)
      ```

      The recursion tree has `2^n` leaves and `2^n - 1` internal nodes, so the plain
      template costs `O(2^n)` calls, plus whatever each leaf does. The depth - and
      therefore the extra memory - is only `O(n)`.

      The three lines that change from problem to problem are:

      1. **What `state` is.** A running list (to print the subsequence), a running sum,
         a count, a boolean.
      2. **What happens at the leaf.** Print, add 1 to a counter, compare with a
         target, take a maximum.
      3. **What you return.** Nothing (side effects), a number, or a boolean.

      ## The four shapes you will keep meeting

      **Print them all.** `state` is the list built so far. Append before the "take"
      branch and pop after it - that *undo* step is what backtracking means. Cost is
      `O(2^n * n)` because each of the `2^n` answers is `O(n)` long; you cannot beat
      that, since just writing the output is that big.

      **Count them.** Return an integer and add the two branches:
      `return take + skip`. No list, no undoing, `O(2^n)` time and `O(n)` space.

      **Does one exist?** Return a boolean and short-circuit:
      `if take_branch: return True` before even trying the skip branch. On lucky
      inputs this stops almost immediately; the worst case is still `O(2^n)`.

      **Print exactly one (usually the first).** Same as the boolean version, but
      record the list when the leaf succeeds and let `True` propagate all the way up
      so no further branches are explored.

      ## Two habits that make the difference

      **Prune early.** If the values are non-negative and you are chasing a target
      sum, a branch whose running sum already exceeds the target can never recover -
      return immediately. Pruning does not change the worst-case bound, but on real
      inputs it removes most of the tree.

      **Skip duplicates deliberately.** When the input may repeat values, sort it
      first and, inside the loop form of the template, ignore a candidate that equals
      the previous one at the same depth. This is how "Subsets II" and
      "Combination Sum II" avoid emitting the same answer twice, and it also keeps the
      output in sorted order for free.

      ## When to stop recursing

      If you only need a **count** or a **yes/no** and the state that matters is small
      (for example `index` plus a running sum bounded by `K`), the same recursion has
      overlapping subproblems: memoise on `(index, sum)` and the `2^n` collapses to
      `O(n * K)`. That is the bridge from this step into dynamic programming. If you
      must **list** the answers, memoisation cannot help - the output itself is
      exponential.
    explanation: |
      ## Quick reference

      | Question | Return type | Leaf action | Typical cost |
      | --- | --- | --- | --- |
      | Print every subsequence | none | record a copy of the list | `O(2^n * n)` |
      | Print those with sum K | none | record if `sum == K` | `O(2^n * n)` |
      | Count those with sum K | `int` | return `1` if `sum == K` else `0` | `O(2^n)`, `O(n*K)` memoised |
      | Does one with sum K exist | `bool` | return `sum == K` | `O(2^n)`, stops early |
      | Print any one with sum K | `bool` | record and return `True` | `O(2^n)` worst case |

      ## Checklist before you write the code

      - Does the empty subsequence count as an answer? (For a target of `0` it
        usually does - decide and say so.)
      - Can the values be negative or zero? Zeros double the number of answers for the
        same sum; negatives break the "stop when you overshoot" pruning.
      - Are duplicates possible in the input? If yes, sort first and skip equal
        siblings.
      - Do you need the answers in a fixed order? Sorting the input and always trying
        the smaller candidate first usually produces lexicographic order directly, so
        you never have to sort the output.
      - Are you appending to a shared list? Then every `append` needs a matching `pop`
        on the way out, and the leaf must store a **copy**, not the list itself.
