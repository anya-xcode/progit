  - slug: combination-sum
    title: "Combination Sum"
    difficulty: Medium
    topic: "Recursion"
    subtopic: "Subsequences"
    tags: ["recursion", "backtracking"]
    sourceUrl: "https://leetcode.com/problems/combination-sum/"
    statement: |
      You are given an array `candidates` of **distinct** positive integers and a
      positive integer `target`. Find every way to write `target` as a sum of
      candidate values, where each candidate may be used **any number of times**.

      Two ways count as the same if they use the same values with the same
      multiplicities, regardless of order. To make the output unique:

      - Write each combination in **non-decreasing** order.
      - Sort the combinations **lexicographically**, comparing numbers left to right;
        if one combination is a prefix of another, the shorter comes first.
    inputFormat: |
      - Line 1: two integers `n` and `target`.
      - Line 2: `n` space-separated distinct integers, the candidates.
    outputFormat: |
      - Line 1: the number of combinations `k` (possibly `0`).
      - Next `k` lines: one combination per line, values separated by spaces, in the
        order described above.
    constraints:
      - "1 <= n <= 20"
      - "2 <= candidates[i] <= 40"
      - "1 <= target <= 40"
      - "All candidates are distinct."
      - "The number of combinations is at most 500."
    examples:
      - input: |
          3 8
          5 2 3
        output: |
          3
          2 2 2 2
          2 3 3
          3 5
        explanation: "8 = 2+2+2+2 = 2+3+3 = 3+5. Sorted lexicographically, the combinations starting with 2 come first."
      - input: |
          2 7
          4 6
        output: |
          0
        explanation: "No sum of 4s and 6s is odd, so there are no combinations."
    hints:
      - "Sort the candidates. To avoid producing the same combination in different orders, only allow the next chosen value to be at the same index or later than the previous one."
      - "Recursive state: (start index, remaining target). Either use candidates[i] again (stay at i) or move on to a later index."
      - "Because candidates are sorted, you can stop the loop as soon as candidates[i] exceeds the remaining target."
    explanation: |
      **Brute force over multisets.** Enumerate all non-decreasing sequences of
      candidates up to length `target / min(candidates)` and keep those that sum to
      `target`. The number of sequences grows exponentially with the length, and
      most are wasted.

      **Pick / not-pick recursion - exponential time, O(target) depth.** At index `i`
      with remaining `r`: either take `candidates[i]` (stay at `i`, reduce `r`) or
      skip to `i + 1`. Record the path when `r == 0`. This never generates the same
      multiset twice.

      **Sorted backtracking with pruning - exponential time in the worst case, O(target)
      extra space.** Sort the candidates. `build(start, remaining)` records the path
      when `remaining == 0`; otherwise loops `i` from `start`, breaks as soon as
      `candidates[i] > remaining`, appends `candidates[i]`, recurses with
      `build(i, remaining - candidates[i])`, and pops. Since smaller values are tried
      first and each path is non-decreasing, the combinations are produced directly in
      lexicographic order. The running time is roughly proportional to the number of
      partial paths explored, which pruning keeps small.
