      - "Recurse over the position in num. At each step choose how long the next operand is, then choose the operator that precedes it (except for the very first operand, which has no operator)."
      - "An operand may not have a leading zero unless it is the single digit 0, so once the operand starts with '0' you may only take that one digit - stop extending it."
