    referenceSolution:
      python: |
        import sys
        from typing import List


        def add_operators(num: str, target: int) -> List[str]:
            n = len(num)
            results: List[str] = []

            def build(index: int, expr: str, total: int, last: int) -> None:
                if index == n:
                    if total == target:
                        results.append(expr)
                    return
                for end in range(index + 1, n + 1):
                    piece = num[index:end]
                    if len(piece) > 1 and piece[0] == "0":
                        break
                    value = int(piece)
                    if index == 0:
                        build(end, piece, value, value)
                    else:
                        build(end, expr + "+" + piece, total + value, value)
                        build(end, expr + "-" + piece, total - value, -value)
                        build(end, expr + "*" + piece, total - last + last * value, last * value)

            build(0, "", 0, 0)
            results.sort()
            return results


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            num, target = data[0], int(data[1])
            found = add_operators(num, target)
            out = [str(len(found))]
            out.extend(found)
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
