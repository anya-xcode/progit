        import sys
        from typing import List


        def subsequence_with_sum_exists(nums: List[int], k: int) -> bool:
            n = len(nums)

            def exists(index: int, remaining: int) -> bool:
                if remaining == 0:
                    return True
                if index == n or remaining < 0:
                    return False
                if exists(index + 1, remaining - nums[index]):
                    return True
                return exists(index + 1, remaining)

            return exists(0, k)


        # --- Input/output handling ---
