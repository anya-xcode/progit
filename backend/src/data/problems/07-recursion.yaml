    tags: ["recursion", "stack"]
    sourceUrl: "https://www.geeksforgeeks.org/problems/sort-a-stack/1"
    statement: |
      You are given a stack of integers. Sort it so that the **smallest value ends up
      at the bottom** and the largest at the top.

      The catch: the stack is the only container you may use. You may not copy the
      values into an array, and you may not write loops over the elements. The only
      operations allowed are `push`, `pop`, `top` and `is_empty`, plus **recursion** -
      the recursion call stack is your scratch space.

      Equal values may end up in any relative order; only the final sequence of values
      is checked.
    inputFormat: |
      - Line 1: an integer `n`, the number of elements.
      - Line 2: `n` space-separated integers listing the stack from **bottom to top**.
    outputFormat: |
      Print the sorted stack from **bottom to top** on one line, values separated by
      single spaces.
    constraints:
      - "1 <= n <= 300"
      - "-10^9 <= value <= 10^9"
      - "Values may repeat."
    examples:
      - input: |
          5
          3 1 4 1 5
        output: |
          1 1 3 4 5
        explanation: "Reading bottom to top the stack is 3, 1, 4, 1, 5 and its top element is 5. Sorted with the smallest at the bottom it becomes 1, 1, 3, 4, 5."
      - input: |
          4
          9 6 2 8
        output: |
          2 6 8 9
        explanation: "The four values in increasing order are 2, 6, 8, 9, so 2 is the new bottom and 9 the new top."
    hints:
      - "Solve a smaller problem first: pop the top element, sort what is left, and then put that element back where it belongs."
      - "'Put it back where it belongs' is itself recursive. Write insert(value): if the stack is empty or its top is <= value, just push value; otherwise pop the top, insert value into the smaller stack, and push the top back."
      - "Both helpers unwind the same way: everything they popped is pushed again on the way out, so nothing is lost and no extra container is needed."
    explanation: |
      **Copy out, sort, copy back - O(n log n) time, O(n) extra space.** Pop
      everything into an array, sort it, push it back. Fast, but it uses a second
      container, which the exercise forbids - the point is to learn how the call stack
      can replace it.

      **Recursive insertion sort on the stack - O(n^2) time, O(n) recursion depth.**
      Two mutually helpful routines:

      - `sort()`: if the stack is empty, it is sorted. Otherwise pop the top value
        `t`, call `sort()` on the remaining stack, then `insert(t)`.
      - `insert(v)`: if the stack is empty or its top is `<= v`, push `v` (it is now in
        the right place). Otherwise pop the top `t`, call `insert(v)` on the smaller
        stack, and push `t` back.

      `sort()` runs `n` levels deep, and each `insert` may descend another `n` levels,
      so the total work is `O(n^2)` comparisons and pushes - the standard cost of
      insertion sort. The deepest the recursion ever goes is about `2n` frames, which
      is the only extra memory used.

      **Why it is correct.** `insert(v)` keeps the invariant "the stack below is
      sorted with the smallest at the bottom"; it walks down past every element
      strictly greater than `v`, drops `v` there, and rebuilds the part it removed in
      the original order.
