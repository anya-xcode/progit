      python: |
        import sys
        from typing import List


        def solve_sudoku(board: List[List[str]]) -> List[List[str]]:
            rows = [0] * 9
            cols = [0] * 9
            boxes = [0] * 9
            empties = []
            for r in range(9):
                for c in range(9):
                    ch = board[r][c]
                    if ch == ".":
                        empties.append((r, c))
                    else:
                        bit = 1 << (ord(ch) - 48)
                        rows[r] |= bit
                        cols[c] |= bit
                        boxes[(r // 3) * 3 + c // 3] |= bit

            def place(index: int) -> bool:
                if index == len(empties):
                    return True
                r, c = empties[index]
                b = (r // 3) * 3 + c // 3
                used = rows[r] | cols[c] | boxes[b]
                for digit in range(1, 10):
                    bit = 1 << digit
                    if used & bit:
                        continue
                    rows[r] |= bit
                    cols[c] |= bit
                    boxes[b] |= bit
                    board[r][c] = chr(48 + digit)
                    if place(index + 1):
                        return True
                    rows[r] ^= bit
                    cols[c] ^= bit
                    boxes[b] ^= bit
                    board[r][c] = "."
                return False

            place(0)
            return board


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().split()
            board = [list(lines[i]) for i in range(9)]
            for row in solve_sudoku(board):
                print("".join(row))


        if __name__ == "__main__":
            main()
