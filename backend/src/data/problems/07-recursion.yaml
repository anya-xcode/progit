    referenceSolution:
      python: |
        import sys
        from typing import List


        def word_break(s: str, words: List[str]) -> bool:
            word_set = set(words)
            longest = max(len(w) for w in word_set)
            n = len(s)
            memo = {}

            def can_break(start: int) -> bool:
                if start == n:
                    return True
                if start in memo:
                    return memo[start]
                memo[start] = False
                for end in range(start + 1, min(n, start + longest) + 1):
                    if s[start:end] in word_set and can_break(end):
                        memo[start] = True
                        break
                return memo[start]

            return can_break(0)


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            words = data[1:1 + n]
            s = data[1 + n]
            print("true" if word_break(s, words) else "false")


        if __name__ == "__main__":
            main()
