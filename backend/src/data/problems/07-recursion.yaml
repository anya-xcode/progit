  - sheetId: prob-7-2-1-generate-binary-strings-w
    slug: generate-binary-strings-without-consecutive-1s
    title: "Generate Binary Strings Without Consecutive 1s"
    difficulty: Medium
    topic: "Recursion"
    subtopic: "Subsequences Pattern"
    tags: ["recursion", "backtracking", "strings"]
    sourceUrl: "https://www.naukri.com/code360/problems/generate-binary-strings-without-consecutive-1s"
    statement: |
      List every string of length `n` made only of the characters `0` and `1` in which
      **no two `1`s are next to each other**. A string qualifies when there is no
      position `i` with `s[i] = '1'` and `s[i + 1] = '1'`.

      To make the answer unique, print the strings in **increasing lexicographic
      order**. Since all strings have the same length and `'0' < '1'`, that is the
      same as reading them as binary numbers from smallest to largest.
    inputFormat: |
      - Line 1: a single integer `n`.
    outputFormat: |
      - Line 1: the number of qualifying strings.
      - Then one qualifying string per line, in increasing lexicographic order.
    constraints:
      - "1 <= n <= 12"
    examples:
      - input: |
          3
        output: |
          5
          000
          001
          010
          100
          101
        explanation: "Of the eight strings of length 3, the three containing '11' (011, 110, 111) are rejected, leaving five. Sorted as binary numbers they are 000, 001, 010, 100, 101."
      - input: |
          1
        output: |
          2
          0
          1
        explanation: "A single character cannot have a neighbour, so both 0 and 1 are valid."
    hints:
      - "Build the string one character at a time from left to right. At every position you may always write a 0."
      - "You may write a 1 only when the character you just wrote was a 0 (or when you are at the very first position), so pass the previous character down the recursion."
      - "Try 0 before 1 at every position. Because the strings all have the same length, that order produces them already sorted - no sorting step is needed."
    explanation: |
      **Generate all 2^n strings and filter - O(2^n * n) time.** Enumerate every
      binary string of length `n` and throw away those containing `11`. Correct, but
      it does far more work than necessary: for `n = 12` it builds 4096 strings and
      keeps only 377.

      **Backtracking with a "previous character" flag - O(answer) time, O(n)
      recursion depth.** `build(i, last)` fills position `i` knowing the character at
      position `i - 1`. Writing `0` is always allowed; writing `1` is allowed only when
      `last` is `0`. When `i` reaches `n`, record the string. Every node of the
      recursion tree leads to at least one complete answer, so the running time is
      proportional to the size of the output, `O(F * n)` where `F` is the number of
      qualifying strings.

      **How many are there?** Let `f(n)` be the count. A valid string either starts
      with `0`, followed by any valid string of length `n - 1`, or with `10`, followed
      by any valid string of length `n - 2`. So `f(n) = f(n-1) + f(n-2)` with
      `f(1) = 2` and `f(2) = 3` - the Fibonacci numbers. For `n = 12` that is 377,
      which is why the explicit listing stays small.

      **Ordering.** All answers have the same length, so lexicographic order is the
      numeric order of the binary values. Choosing `0` before `1` at every position is
      a pre-order walk of the binary tree, which emits them in exactly that order.
    starterCode:
      python: |
        import sys
        from typing import List


        def generate_binary_strings(n: int) -> List[str]:
            # Return every length-n binary string with no two adjacent 1s,
            # in increasing lexicographic order.
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            n = int(sys.stdin.read().split()[0])
            strings = generate_binary_strings(n)
            out = [str(len(strings))]
            out.extend(strings)
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def generate_binary_strings(n: int) -> List[str]:
            result: List[str] = []
            current: List[str] = []

            def build(index: int) -> None:
                if index == n:
                    result.append("".join(current))
                    return
                current.append("0")
                build(index + 1)
                current.pop()
                if index == 0 or current[index - 1] == "0":
                    current.append("1")
                    build(index + 1)
                    current.pop()

            build(0)
            return result


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            n = int(sys.stdin.read().split()[0])
            strings = generate_binary_strings(n)
            out = [str(len(strings))]
            out.extend(strings)
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
