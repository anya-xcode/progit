  - slug: generate-parentheses
    title: "Generate Parentheses"
    difficulty: Medium
    topic: "Recursion"
    subtopic: "Subsequences"
    tags: ["recursion", "backtracking", "strings"]
    sourceUrl: "https://leetcode.com/problems/generate-parentheses/"
    statement: |
      Given an integer `n`, list every string made of exactly `n` opening brackets
      `(` and `n` closing brackets `)` that is **balanced**: reading left to right,
      the number of `)` seen never exceeds the number of `(` seen, and the totals
      are equal at the end.

      Print the strings in **lexicographic order**, where `(` is considered smaller
      than `)` (this matches their ASCII codes).
    inputFormat: |
      - Line 1: an integer `n`.
    outputFormat: |
      Print each balanced string on its own line, in lexicographic order.
    constraints:
      - "1 <= n <= 8"
    examples:
      - input: |
          2
        output: |
          (())
          ()()
        explanation: "Only two balanced strings of length 4 exist, and `(())` comes first because its second character `(` is smaller than `)`."
      - input: |
          3
        output: |
          ((()))
          (()())
          (())()
          ()(())
          ()()()
        explanation: "The five balanced strings of length 6, sorted."
    hints:
      - "You could generate all 2^(2n) strings and keep the balanced ones, but most of them are invalid."
      - "Build the string one character at a time. When may you add `(`? When may you add `)`?"
      - "Add `(` while fewer than n are used; add `)` only while it is fewer than the `(` count. Trying `(` first yields sorted output for free."
    explanation: |
      **Generate and filter - O(2^(2n) * n) time.** Enumerate every string of length
      `2n` over `(` and `)`, check balance with a counter, collect the valid ones and
      sort them.

      **Backtracking with counts - O(C(n) * n) time, O(n) recursion depth.** Track
      how many `open` and `close` brackets have been placed. Recurse with `(` if
      `open < n` and with `)` if `close < open`; when the length reaches `2n`, record
      the string. Every branch leads to a valid answer, so the work is proportional
      to the output size, where `C(n)` is the n-th Catalan number. Exploring `(`
      before `)` emits the strings already in lexicographic order.
    starterCode:
      python: |
        import sys
        from typing import List


        def generate_parentheses(n: int) -> List[str]:
            # Return all balanced strings with n pairs, in lexicographic order.
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            print("\n".join(generate_parentheses(n)))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def generate_parentheses(n: int) -> List[str]:
            result = []
            current = []

            def build(open_count: int, close_count: int) -> None:
                if len(current) == 2 * n:
                    result.append("".join(current))
                    return
                if open_count < n:
                    current.append("(")
                    build(open_count + 1, close_count)
                    current.pop()
                if close_count < open_count:
                    current.append(")")
                    build(open_count, close_count + 1)
                    current.pop()

            build(0, 0)
            return result


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            print("\n".join(generate_parentheses(n)))


        if __name__ == "__main__":
            main()
