    tags: ["recursion", "backtracking", "sorting"]
    sourceUrl: "https://leetcode.com/problems/combination-sum-ii/"
    statement: |
      You are given `n` positive integers `candidates` (the list **may contain
      repeated values**) and a positive integer `target`.

      Choose a group of candidates that adds up exactly to `target`. Each position of
      the list may be used **at most once**, but if a value appears three times in the
      input you are allowed to use it up to three times.

      Two groups are the **same combination** when they contain the same values with
      the same multiplicities, regardless of which positions they came from. Report
      each distinct combination once.

      To make the output unique:

      - Print the values of each combination in **non-decreasing** order.
      - Print the combinations in increasing **lexicographic** order, comparing them
        element by element as numbers. If one combination is a prefix of another, the
        shorter one comes first.
    inputFormat: |
      - Line 1: two integers `n` and `target`.
      - Line 2: `n` space-separated integers, the list `candidates`.
    outputFormat: |
      - Line 1: the number of distinct combinations.
      - Then one combination per line, values separated by single spaces, in the order
        described above. If there are none, print only the `0`.
    constraints:
      - "1 <= n <= 25"
      - "1 <= candidates[i] <= 50"
      - "1 <= target <= 60"
    examples:
      - input: |
          7 8
          10 1 2 7 6 1 5
        output: |
          4
          1 1 6
          1 2 5
          1 7
          2 6
        explanation: "Sorted, the candidates are 1 1 2 5 6 7 10. The groups reaching 8 are 1+1+6, 1+2+5, 1+7 and 2+6. Note that 1+7 can be formed with either of the two 1s, but it is one combination, not two."
      - input: |
          5 5
          2 5 2 1 2
        output: |
          2
          1 2 2
          5
        explanation: "Sorted: 1 2 2 2 5. Using 1+2+2 reaches 5 and so does the single value 5. Using three 2s would give 6, which overshoots."
    hints:
      - "Sort the candidates first. Then a combination built by always moving forward in the list is automatically non-decreasing."
      - "Use the loop form of the recursion: build(start, remaining) tries every index i >= start as the next value, then recurses with start = i + 1 so each position is used at most once."
      - "Duplicates are the whole difficulty. Inside the loop, if i > start and candidates[i] == candidates[i-1], skip i: the identical value was already tried at this depth, and taking it again would rebuild the same combination from different positions."
    explanation: |
      **All 2^n subsets - O(2^n * n) time.** Enumerate every subset of positions, keep
      those that sum to `target`, sort each one and de-duplicate with a set. Correct,
      but for `n = 25` that is 33 million subsets, and the de-duplication hides the
      real insight.

      **Backtracking over a sorted list - O(2^n) worst case, O(target) recursion
      depth.** Sort `candidates`. `build(start, remaining)`:

      - if `remaining == 0`, record a copy of the current list and return;
      - otherwise loop `i` from `start` upwards, append `candidates[i]`, recurse with
        `build(i + 1, remaining - candidates[i])`, then pop.

      Moving to `i + 1` (not `i`) is what forbids reusing a position - the difference
      from Combination Sum I, where you would recurse with `i`.

      **Handling duplicates.** At one level of the recursion, picking the first `1` and
      picking the second `1` lead to *identical* sub-problems, so they would produce
      the same combinations twice. The sorted order puts equal values next to each
      other, so the rule "`if i > start and candidates[i] == candidates[i-1]: continue`"
      keeps only the first of each run of equal siblings. Every distinct combination is
      still reachable, because if a combination uses two `1`s it will pick the *first*
      two, one per level.

      **Two prunings.** Since the list is sorted and all values are positive, as soon
      as `candidates[i] > remaining` you can `break` out of the loop - every later
      candidate is at least as large. That alone makes the search fast for the sizes
      here. The work is then proportional to the number of nodes actually visited,
      which is close to the number of answers.

      **Ordering for free.** The list is sorted and each level tries candidates from
      small to large, so the recursion emits the combinations in exactly the
      lexicographic order required; no sort of the output is needed.
