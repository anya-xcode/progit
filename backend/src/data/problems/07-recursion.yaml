  - sheetId: prob-7-1-1-recursive-implementation-
    slug: recursive-implementation-of-atoi
    title: "Recursive Implementation of atoi()"
    difficulty: Medium
    topic: "Recursion"
    subtopic: "Get a Strong Hold"
    tags: ["recursion", "string", "parsing"]
    sourceUrl: "https://leetcode.com/problems/string-to-integer-atoi/"
    statement: |
      A classic C library routine turns the front of a text line into a number. Write
      your own version of it, and write the digit loop as a **recursion** rather than
      an iteration.

      Given a line `s`, read a number from its beginning using exactly these rules:

      1. If the first character is `+` or `-`, it fixes the sign and is consumed.
         Otherwise the number is positive.
      2. After that, consume characters as long as they are decimal digits `0`-`9`.
         Reading stops at the first character that is not a digit, or at the end of
         the line.
      3. The digits that were consumed form the magnitude. Leading zeros are allowed
         and ignored (`007` is `7`). If no digit was consumed at all, the answer is `0`.
      4. The answer is stored in a **32-bit signed integer**, so it is clamped to the
         range `[-2147483648, 2147483647]`: anything larger becomes `2147483647` and
         anything smaller becomes `-2147483648`.

      The line never begins with a space, but it may contain spaces later on - a space
      is simply a non-digit, so it ends the reading.
    inputFormat: |
      - Line 1: the string `s`. It may contain spaces, but never as its first
        character.
    outputFormat: |
      Print a single integer: the value obtained by the rules above.
    constraints:
      - "1 <= len(s) <= 200"
      - "Every character of `s` is printable ASCII (codes 32 to 126)."
      - "`s[0]` is not a space."
    examples:
      - input: |
          42
        output: |
          42
        explanation: "Every character is a digit, so the whole line is consumed and the value is 42."
