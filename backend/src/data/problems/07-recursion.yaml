    statement: |
      A sudoku board is a `9 x 9` grid divided into nine `3 x 3` boxes. Fill every
      empty cell with a digit from `1` to `9` so that

      - each **row** contains the nine digits `1`-`9` exactly once,
      - each **column** contains the nine digits `1`-`9` exactly once, and
      - each of the nine `3 x 3` **boxes** contains the nine digits `1`-`9` exactly
        once.

      Empty cells are written as `.`. The given board is valid and has **exactly one**
      solution, so the output is uniquely determined. A board with no empty cells is
      already solved and must be printed unchanged.
    inputFormat: |
      - Nine lines, each a string of exactly nine characters. Each character is a digit
        `1`-`9` (a given clue) or `.` (an empty cell). There are no spaces inside a
        line.
    outputFormat: |
      Print the completed board as nine lines of nine digits, with no spaces.
    constraints:
      - "The board is exactly 9 x 9."
      - "Every character of the input is `1`-`9` or `.`."
      - "The given clues never break a row, column or box rule."
      - "Exactly one completed board is consistent with the clues."
    examples:
