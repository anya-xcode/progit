    slug: count-good-numbers
    title: "Count Good Numbers"
    difficulty: Medium
    topic: "Recursion"
    subtopic: "Get a Strong Hold"
    tags: ["recursion", "math", "modular-arithmetic"]
    sourceUrl: "https://leetcode.com/problems/count-good-numbers/"
    statement: |
      A **digit string** of length `n` is a string of exactly `n` characters, each one
      of `0123456789`. Leading zeros are allowed, so there are `10^n` digit strings of
      length `n`.

      Positions are numbered from `0`. Call a digit string **good** when

      - every character at an **even** position is an even digit (`0`, `2`, `4`, `6`
        or `8`), and
      - every character at an **odd** position is a single-digit prime (`2`, `3`, `5`
        or `7`).

      Count the good digit strings of length `n`. The answer grows extremely fast, so
      print it **modulo 1000000007**.

      For `n = 0` there is exactly one digit string, the empty one, and it is good.
    inputFormat: |
      - Line 1: a single integer `n`.
    outputFormat: |
      Print one integer: the number of good digit strings of length `n`, taken modulo
      `1000000007`.
    constraints:
      - "0 <= n <= 10^18"
    examples:
      - input: |
          1
        output: |
          5
        explanation: "Only position 0 exists and it must hold an even digit, so the good strings are 0, 2, 4, 6 and 8."
      - input: |
          4
        output: |
          400
        explanation: "Positions 0 and 2 have 5 choices each and positions 1 and 3 have 4 choices each, giving 5 * 4 * 5 * 4 = 400."
    hints:
      - "The positions are independent: count the choices for each one and multiply. How many even positions and how many odd positions are there in a string of length n?"
      - "The answer is 5^(number of even positions) * 4^(number of odd positions) modulo 1000000007. With n up to 10^18 you cannot multiply one factor at a time."
      - "Write fast exponentiation recursively: pow(b, e) = pow(b, e/2)^2 for even e, and b * pow(b, e-1) for odd e. Reduce modulo 1000000007 after every multiplication."
    explanation: |
      **Generate every string - O(10^n) time.** Only usable to sanity-check tiny `n`;
      hopeless past `n = 8` and irrelevant for `n = 10^18`.

      **Multiply the factors one by one - O(n) time, O(1) space.** There are
      `ceil(n / 2)` even positions (each with 5 allowed digits) and `floor(n / 2)` odd
      positions (each with 4), so the answer is
      `5^ceil(n/2) * 4^floor(n/2) mod 1000000007`. Looping `n` times to build those
      powers is fine for small `n` but takes `10^18` steps here.

      **Recursive fast exponentiation - O(log n) time, O(log n) recursion depth.**
      `power(b, e)` computes `half = power(b, e // 2)` once, squares it, and multiplies
      by one extra `b` when `e` is odd. Every product is reduced modulo `1000000007`,
      so the numbers stay small. Two such calls (for base 5 and base 4) answer the
      problem in about 60 recursive steps for the largest `n`. Rewriting the same idea
      with a loop over the bits of `e` gives O(1) extra space.
