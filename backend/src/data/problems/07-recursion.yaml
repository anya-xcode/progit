section: recursion
problems:
  - slug: power-with-modulo
    title: "Power with Modulo"
    difficulty: Medium
    topic: "Recursion"
    subtopic: "Get a Strong Hold"
    tags: ["recursion", "math", "divide-and-conquer"]
    sourceUrl: ""
    statement: |
      Given an integer base `x` and a non-negative exponent `n`, compute
      `x^n mod (10^9 + 7)`.

      The exponent can be as large as `10^18`, so multiplying `x` by itself `n`
      times is far too slow. The answer must be reported as a value in the range
      `[0, 10^9 + 6]`: when `x` is negative, take the mathematical (non-negative)
      remainder. By convention `x^0 = 1` for every `x`, including `0`.
    inputFormat: |
      - Line 1: two integers `x` and `n`.
    outputFormat: |
      Print a single integer: `x^n mod (10^9 + 7)`, in the range `[0, 10^9 + 6]`.
    constraints:
      - "-10^9 <= x <= 10^9"
      - "0 <= n <= 10^18"
    examples:
      - input: |
          3 5
        output: |
          243
        explanation: "3^5 = 243, which is already smaller than 10^9 + 7."
      - input: |
          -2 3
        output: |
          999999999
        explanation: "(-2)^3 = -8. Its non-negative remainder modulo 10^9 + 7 is 1000000007 - 8 = 999999999."
    hints:
      - "x^n = (x^(n/2))^2 when n is even. What changes when n is odd?"
      - "Each recursive call halves the exponent, so the depth is about log2(n)."
      - "Reduce x modulo 10^9 + 7 first and take the modulo after every multiplication to keep numbers small."
    explanation: |
      **Repeated multiplication - O(n) time, O(1) space.** Multiply the running
      result by `x` exactly `n` times, reducing modulo `10^9 + 7` each time. With
      `n` up to `10^18` this never finishes.

      **Recursive fast exponentiation - O(log n) time, O(log n) space.** Compute
      `half = power(x, n // 2)`. The answer is `half * half` when `n` is even and
      `half * half * x` when `n` is odd, all modulo `10^9 + 7`. The base case is
      `n = 0`, which returns `1`. Normalizing `x` into `[0, 10^9 + 6]` first handles
      negative bases.

      **Iterative binary exponentiation - O(log n) time, O(1) space.** Scan the bits
      of `n` from lowest to highest, squaring the base at each step and multiplying
      it into the result whenever the current bit is 1.
    starterCode:
      python: |
        import sys

        MOD = 10**9 + 7


        def power_mod(x: int, n: int) -> int:
            # Return x^n modulo MOD as a value in [0, MOD - 1].
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            x, n = int(data[0]), int(data[1])
            print(power_mod(x, n))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys

        MOD = 10**9 + 7


        def power_mod(x: int, n: int) -> int:
            if n == 0:
                return 1 % MOD
            half = power_mod(x, n // 2)
            result = half * half % MOD
            if n % 2 == 1:
                result = result * (x % MOD) % MOD
            return result


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            x, n = int(data[0]), int(data[1])
            print(power_mod(x, n))


        if __name__ == "__main__":
            main()
