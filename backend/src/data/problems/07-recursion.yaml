    slug: letter-combinations-of-a-phone-number
    title: "Letter Combinations of a Phone Number"
    difficulty: Hard
    topic: "Recursion"
    subtopic: "Subsequences Pattern"
    tags: ["recursion", "backtracking", "strings"]
    sourceUrl: "https://leetcode.com/problems/letter-combinations-of-a-phone-number/"
    statement: |
      On an old telephone keypad each key from `2` to `9` carries a group of letters:

      | Key | Letters | Key | Letters |
      | --- | --- | --- | --- |
      | 2 | a b c | 6 | m n o |
      | 3 | d e f | 7 | p q r s |
      | 4 | g h i | 8 | t u v |
      | 5 | j k l | 9 | w x y z |

      Given a string of such digits, produce every word that could be typed by
      pressing those keys in order: the `i`-th letter of the word must be one of the
      letters printed on the `i`-th key.

      To make the output unique, print the words in increasing **lexicographic**
      order. All words have the same length, so this is ordinary dictionary order.
    inputFormat: |
      - Line 1: the string `digits`, made only of the characters `2`-`9`.
    outputFormat: |
      - Line 1: the number of words.
      - Then one word per line, in increasing lexicographic order.
    constraints:
      - "1 <= len(digits) <= 6"
      - "Every character of `digits` is one of `2 3 4 5 6 7 8 9`."
    examples:
      - input: |
          23
        output: |
          9
          ad
          ae
          af
          bd
          be
          bf
          cd
          ce
          cf
        explanation: "Key 2 offers a, b, c and key 3 offers d, e, f, so there are 3 * 3 = 9 words: ad, ae, af, bd, be, bf, cd, ce, cf."
      - input: |
          7
        output: |
          4
          p
          q
          r
          s
        explanation: "Key 7 carries four letters, so a single press gives the four one-letter words p, q, r, s."
    hints:
      - "Store the keypad as a lookup from a digit character to its string of letters."
      - "Recurse over the positions of digits: build(i) tries every letter of the key at position i, appends it, calls build(i + 1) and pops. When i reaches the end, record the assembled word."
      - "Each key's letters are already in alphabetical order, so trying them in that order makes the recursion emit the words in lexicographic order with no sorting afterwards."
    explanation: |
      **Iterative expansion - O(total * L) time.** Start from a list containing the
      empty word and, for each digit, replace the list by every word extended with
      every letter of that key. Perfectly correct and easy to write, but it holds all
      partial words in memory at once.

      **Backtracking - O(total * L) time, O(L) recursion depth plus the output.**
      `build(i)` fills position `i`: for every letter `ch` on key `digits[i]`, append
      `ch`, call `build(i + 1)`, then pop. When `i == len(digits)`, join the buffer and
      record it. Only one partial word ever exists, so the extra memory is the depth of
      the recursion, `O(L)`.

      **How big is the output?** A key with three letters multiplies the count by 3 and
      keys `7` and `9` multiply it by 4, so the number of words is the product of the
      key sizes - between `3^L` and `4^L`. That is why the length is capped at 6: at
      `4^6 = 4096` words the listing is already the dominant cost, and no algorithm can
      be faster than writing it.

      **Ordering.** The letters on each key are listed alphabetically and the word
      positions are processed left to right, so the recursion is a pre-order walk that
      produces the words in dictionary order directly. Since every word has the same
      length, there are no prefix ties to worry about.
