  - slug: subset-sums
    title: "Subset Sums"
    difficulty: Medium
    topic: "Recursion"
    subtopic: "Subsequences"
    tags: ["recursion", "backtracking"]
    sourceUrl: ""
    statement: |
      You are given an array `nums` of `n` non-negative integers (values may repeat).
      For each of the `2^n` ways of choosing a subset of **positions**, add up the
      chosen elements. The empty choice has sum `0`.

      Print all `2^n` sums in ascending order. Keep duplicates: two different
      choices of positions that give the same sum are listed separately.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers.
    outputFormat: |
      Print `2^n` integers on one line, separated by spaces, in non-decreasing order.
    constraints:
      - "1 <= n <= 12"
      - "0 <= nums[i] <= 10^4"
    examples:
      - input: |
          3
          2 5 1
        output: |
          0 1 2 3 5 6 7 8
        explanation: "The subsets give sums {}=0, {1}=1, {2}=2, {2,1}=3, {5}=5, {5,1}=6, {2,5}=7, {2,5,1}=8."
      - input: |
          2
          4 4
        output: |
          0 4 4 8
        explanation: "Choosing only the first 4 and choosing only the second 4 are different subsets, so 4 appears twice."
    hints:
      - "For each element you have exactly two choices: include it in the running sum or skip it."
      - "Write a recursive function f(index, running_sum). When index reaches n, record running_sum."
      - "Sort the collected sums at the end."
    explanation: |
      **Bitmask enumeration - O(2^n * n) time, O(2^n) space.** Loop over all masks and
      sum the elements whose bits are set, then sort. Each mask costs O(n).

      **Pick / not-pick recursion - O(2^n + 2^n log 2^n) time, O(2^n) space.** Call
      `f(i, s)`: if `i == n`, record `s`; otherwise call `f(i + 1, s + nums[i])` and
      `f(i + 1, s)`. The running sum is carried along, so each leaf costs O(1). The
      recursion depth is only `n`. Sorting the `2^n` sums dominates the time.

      **Merging instead of sorting - O(2^n) time.** Start with the sorted list `[0]`.
      For each element `v`, merge the current sorted list with a copy shifted by `v`
      (both are sorted) using a linear two-pointer merge.
    starterCode:
      python: |
        import sys
        from typing import List


        def subset_sums(nums: List[int]) -> List[int]:
            # Return the sums of all 2^n subsets in non-decreasing order.
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(" ".join(map(str, subset_sums(nums))))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def subset_sums(nums: List[int]) -> List[int]:
            sums = []

            def collect(index: int, running: int) -> None:
                if index == len(nums):
                    sums.append(running)
                    return
                collect(index + 1, running + nums[index])
                collect(index + 1, running)

            collect(0, 0)
            sums.sort()
            return sums


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(" ".join(map(str, subset_sums(nums))))


        if __name__ == "__main__":
            main()
