    statement: |
      You are given an array `nums` of `n` non-negative integers and a non-negative
      integer `k`.

      A **subsequence** keeps some of the positions of `nums` (possibly none, possibly
      all) without reordering them. Decide whether **at least one** subsequence adds up
      to exactly `k`.

      The empty subsequence is allowed and its sum is `0`, so the answer for `k = 0` is
      always `true`.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print `true` if some subsequence of `nums` sums to exactly `k`, otherwise
      `false`.
    constraints:
      - "1 <= n <= 18"
      - "0 <= nums[i] <= 10^4"
      - "0 <= k <= 10^5"
    examples:
      - input: |
          5 9
          4 1 8 7 2
        output: |
          true
        explanation: "The values 7 and 2 add up to 9, so such a subsequence exists."
      - input: |
          4 11
          2 4 6 8
        output: |
          false
        explanation: "Every value is even, so every subsequence sum is even and the odd target 11 can never be reached."
    hints:
      - "This is the counting version with the arithmetic replaced by logic: at index i the answer is (take it) OR (skip it)."
      - "The base case is at the end of the array: the branch succeeded exactly when the remaining target is 0."
      - "Two savings matter here. Return True the moment the first branch succeeds so the second is never explored, and abandon a branch as soon as the running sum exceeds k, which is safe because no value is negative."
    explanation: |
      **Try every subset with bitmasks - O(2^n * n) time.** Add up the values chosen
      by each of the `2^n` masks and compare with `k`. It always does the full work,
      even when the very first subset already matches.

      **Recursive search with short-circuiting - O(2^n) worst case, O(n) recursion
      depth.** `exists(i, remaining)` answers "can indices `i .. n-1` make exactly
      `remaining`?":

      - `remaining == 0` - yes, take nothing more;
      - `i == n` - no (the target is still positive);
      - otherwise `exists(i + 1, remaining - nums[i]) or exists(i + 1, remaining)`.

      Because `or` is short-circuiting, the first success stops the search - on many
      inputs only a tiny part of the tree is visited. Checking `remaining == 0` before
      checking `i == n` is what lets the empty tail succeed straight away.

      **Pruning.** All values are `>= 0`, so a branch that has overshot (`remaining <
      0`) is hopeless and returns `false` immediately. Sorting the array in decreasing
      order first makes the overshoot happen sooner and usually prunes even more.

      **Memoisation - O(n * k) time and space.** The state `(index, remaining)` takes
      at most `n * (k + 1)` values, so caching removes the exponential blow-up. It is
      the standard "subset-sum" dynamic programme and the right tool once `n` gets
      large; for `n <= 18` the pruned search is already instant.
