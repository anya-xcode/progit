  - sheetId: prob-7-3-4-rat-in-a-maze
    slug: rat-in-a-maze
    title: "Rat in a Maze"
    difficulty: Hard
    topic: "Recursion"
    subtopic: "Trying out all Combos / Hard"
    tags: ["recursion", "backtracking", "matrix"]
    sourceUrl: "https://www.naukri.com/code360/problems/rat-in-a-maze"
    statement: |
      A rat sits in the top-left cell `(0, 0)` of an `n x n` grid and wants to reach
      the bottom-right cell `(n-1, n-1)`. A cell holding `1` is open and a cell holding
      `0` is blocked. From an open cell the rat may step to an open neighbour in one of
      four directions:

      | Letter | Direction | Moves to |
      | --- | --- | --- |
      | `D` | down | `(r + 1, c)` |
      | `L` | left | `(r, c - 1)` |
      | `R` | right | `(r, c + 1)` |
      | `U` | up | `(r - 1, c)` |

      The rat may **not** visit the same cell twice on a route, and may not leave the
      grid. A route is written as the string of letters of the moves it makes, in
      order.

      List every route from `(0, 0)` to `(n-1, n-1)`. If the start or the destination
      is blocked there are none.

      To make the output unique, print the routes in increasing **lexicographic**
      order. (The letters `D < L < R < U` are already in alphabetical order, and no
      route can be a prefix of another because a route stops the moment it reaches the
      destination.)
    inputFormat: |
      - Line 1: an integer `n`, the side of the grid.
      - Next `n` lines: `n` space-separated values, each `0` or `1`.
    outputFormat: |
      - Line 1: the number of routes.
      - Then one route per line, as a string of the letters `D`, `L`, `R`, `U`, in
        increasing lexicographic order. If there are no routes, print only the `0`.
    constraints:
      - "2 <= n <= 5"
      - "Every grid value is `0` or `1`."
    examples:
      - input: |
          4
          1 0 0 0
          1 1 0 1
          1 1 0 0
          0 1 1 1
        output: |
          2
          DDRDRR
          DRDDRR
        explanation: "Two routes exist. DDRDRR goes down twice, right, down, then right twice; DRDDRR goes down, right, down twice, then right twice. Sorted, DDRDRR comes first."
      - input: |
          2
          1 0
          0 1
        output: |
          0
        explanation: "From (0,0) the only neighbours are (0,1) and (1,0) and both are blocked, so the rat cannot move and there is no route."
    hints:
      - "Depth-first search with a visited grid: mark the current cell, try the four moves, then unmark it before returning. That unmarking is what makes it backtracking rather than a plain search."
      - "Keep the letters of the moves made so far in a list; append before recursing and pop afterwards. When you land on (n-1, n-1), join the list and record it."
      - "Try the four directions in alphabetical order D, L, R, U. Since a route stops as soon as it reaches the destination, no route is a prefix of another, so that order alone makes the output sorted."
    explanation: |
      **Enumerate all move strings - hopeless.** Even bounding the length at `n^2 - 1`,
      there are `4^24` strings for `n = 5`. The structure of the grid has to drive the
      search.

      **Backtracking with a visited matrix - O(3^(n^2)) worst case, O(n^2) recursion
      depth.** `walk(r, c)`:

      - if `(r, c)` is the destination, record the joined move string and return;
      - mark `(r, c)` as visited;
      - for each direction in the order `D, L, R, U`: if the neighbour is inside the
        grid, open and unvisited, push the letter, `walk` into it, pop the letter;
      - unmark `(r, c)`.

      Unmarking on the way out is essential: a cell that is unusable on one route must
      be available again on the next one. Since the cell you arrived from is already
      marked, each step really has at most three choices, which is where the `3^(n^2)`
      bound comes from; the real count is far smaller because most branches die at a
      wall.

      **Why routes are simple paths.** The "no cell twice" rule is exactly what the
      visited matrix enforces, and it is also what keeps the answer finite - without it
      the rat could circle forever.

      **Cost in practice.** For an open `4 x 4` grid there are 184 routes and for
      `5 x 5` several thousand, which is why `n` is capped at 5: the output, not the
      search, is the bottleneck. A pure counting version could be memoised on
      `(cell, visited-mask)` for small grids, but listing the routes cannot avoid the
      exponential output.

      **Early exit.** If `grid[0][0]` or `grid[n-1][n-1]` is `0`, answer `0` without
      searching at all.
