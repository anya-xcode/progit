    referenceSolution:
      python: |
        import sys
        from typing import List


        def sort_stack(stack: List[int]) -> List[int]:
            # The list is used as the stack: index 0 is the bottom, index -1 the top.
            def insert(value: int) -> None:
                if not stack or stack[-1] <= value:
                    stack.append(value)
                    return
                top = stack.pop()
                insert(value)
                stack.append(top)

            def sort_rest() -> None:
                if not stack:
                    return
                top = stack.pop()
                sort_rest()
                insert(top)

            sort_rest()
            return stack


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            stack = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(x) for x in sort_stack(stack)))


        if __name__ == "__main__":
            main()
