      Collect the digit characters into a string, convert with a big-integer
      conversion and clamp afterwards. It works in Python, but in a fixed-width
      language the intermediate value would already have overflowed, which is exactly
      what the problem is about.

      **Recursive digit walk - O(d) time, O(d) recursion depth** where `d` is the
      number of digits consumed. Deal with the sign first, then call
      `parse(i, value)`: if `s[i]` is not a digit (or `i` is past the end) return
      `sign * value`; otherwise recurse on `i + 1` with `value * 10 + digit`. Each
      character is visited once.

      **Recursive walk with early clamping - O(d) time, O(d) depth, O(1) extra
      magnitude.** Before recursing, compare the new running value with the 32-bit
      bound. If a positive value exceeds `2147483647` the answer can only be that
      bound, so return it immediately; symmetrically for the negative bound. This
      never lets the accumulator grow beyond 32 bits, so the same code is safe in C++
      or Java, and a line of 200 digits stops after 10 recursive calls.
