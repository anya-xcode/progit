  - slug: n-queens
    title: "N-Queens"
    difficulty: Hard
    topic: "Recursion"
    subtopic: "Hard Problems"
    tags: ["recursion", "backtracking"]
    sourceUrl: "https://leetcode.com/problems/n-queens-ii/"
    statement: |
      Place `n` chess queens on an `n x n` board so that no two queens attack each
      other. A queen attacks every square in its row, its column, and both of its
      diagonals.

      Count the number of distinct placements. Two placements are different if some
      square holds a queen in one of them but not in the other (rotations and
      reflections of a solution count separately).
    inputFormat: |
      - Line 1: an integer `n`.
    outputFormat: |
      Print a single integer: the number of valid placements.
    constraints:
      - "1 <= n <= 10"
    examples:
      - input: |
          4
        output: |
          2
        explanation: "Rows top to bottom, the queens can sit in columns (2, 4, 1, 3) or (3, 1, 4, 2); no other arrangement works."
      - input: |
          3
        output: |
          0
        explanation: "On a 3 x 3 board any two queens in different rows and columns share a diagonal, so no placement exists."
    hints:
      - "Every row must contain exactly one queen, so decide the column for row 0, then row 1, and so on."
      - "A square (r, c) conflicts with an earlier queen if they share the column, the value r - c, or the value r + c."
      - "Keep three sets (columns, r - c diagonals, r + c anti-diagonals) so each safety check is O(1), and undo the additions when you backtrack."
    explanation: |
      **Try all subsets of squares - astronomically slow.** Choosing `n` squares out of
      `n^2` and checking each choice is hopeless beyond tiny boards.

      **Row-by-row backtracking with scanning - O(n!) branches, O(n) per check.** Put
      one queen per row. For a candidate column, scan the queens already placed to see
      whether any shares a column or diagonal. Invalid prefixes are abandoned early.

      **Backtracking with O(1) conflict sets - O(n!) worst case, O(n) space.** Maintain
      sets of occupied columns, occupied `row - col` diagonals and occupied
      `row + col` anti-diagonals. In `place(row)`, for each column that is free in all
      three sets, add it, recurse into `row + 1`, and remove it. Reaching `row == n`
      counts one solution. Pruning makes the explored tree far smaller than `n!` in
      practice (`n = 10` explores only tens of thousands of nodes). Bitmasks can
      replace the sets for an extra constant-factor speedup.
    starterCode:
      python: |
        import sys


        def total_n_queens(n: int) -> int:
            # Return the number of ways to place n non-attacking queens.
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            print(total_n_queens(n))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def total_n_queens(n: int) -> int:
            columns = set()
            diagonals = set()
            anti_diagonals = set()

            def place(row: int) -> int:
                if row == n:
                    return 1
                count = 0
                for col in range(n):
                    if col in columns or row - col in diagonals or row + col in anti_diagonals:
                        continue
                    columns.add(col)
                    diagonals.add(row - col)
                    anti_diagonals.add(row + col)
                    count += place(row + 1)
                    columns.remove(col)
                    diagonals.remove(row - col)
                    anti_diagonals.remove(row + col)
                return count

            return place(0)


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            print(total_n_queens(n))


        if __name__ == "__main__":
            main()
