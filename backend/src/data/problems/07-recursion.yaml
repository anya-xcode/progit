    referenceSolution:
      python: |
        import sys
        from typing import List


        def combination_sum_two(candidates: List[int], target: int) -> List[List[int]]:
            candidates = sorted(candidates)
            n = len(candidates)
            result: List[List[int]] = []
            current: List[int] = []

            def build(start: int, remaining: int) -> None:
                if remaining == 0:
                    result.append(list(current))
                    return
                for i in range(start, n):
                    if i > start and candidates[i] == candidates[i - 1]:
                        continue
                    if candidates[i] > remaining:
                        break
                    current.append(candidates[i])
                    build(i + 1, remaining - candidates[i])
                    current.pop()

            build(0, target)
            return result


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n, target = int(data[0]), int(data[1])
            candidates = [int(x) for x in data[2:2 + n]]
            combos = combination_sum_two(candidates, target)
            out = [str(len(combos))]
            out.extend(" ".join(str(v) for v in combo) for combo in combos)
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
