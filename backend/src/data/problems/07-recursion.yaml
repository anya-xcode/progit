    referenceSolution:
      python: |
        import sys
        from typing import List


        def can_colour(n: int, adjacency: List[List[int]], k: int) -> bool:
            colours = [0] * n

            def assign(node: int, used: int) -> bool:
                if node == n:
                    return True
                # Colours are interchangeable: never open more than one fresh colour.
                limit = min(k, used + 1)
                for colour in range(1, limit + 1):
                    if all(colours[nb] != colour for nb in adjacency[node]):
                        colours[node] = colour
                        if assign(node + 1, max(used, colour)):
                            return True
                        colours[node] = 0
                return False

            return assign(0, 0)


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n, m, k = int(data[0]), int(data[1]), int(data[2])
            adjacency = [[] for _ in range(n)]
            for e in range(m):
                u = int(data[3 + 2 * e])
                v = int(data[4 + 2 * e])
                adjacency[u].append(v)
                adjacency[v].append(u)
            print("true" if can_colour(n, adjacency, k) else "false")


        if __name__ == "__main__":
            main()
