    referenceSolution:
      python: |
        import sys
        from typing import List

        MOVES = (("D", 1, 0), ("L", 0, -1), ("R", 0, 1), ("U", -1, 0))


        def rat_routes(grid: List[List[int]]) -> List[str]:
            n = len(grid)
            result: List[str] = []
            if grid[0][0] == 0 or grid[n - 1][n - 1] == 0:
                return result

            visited = [[False] * n for _ in range(n)]
            path: List[str] = []

            def walk(r: int, c: int) -> None:
                if r == n - 1 and c == n - 1:
                    result.append("".join(path))
                    return
                visited[r][c] = True
                for letter, dr, dc in MOVES:
                    nr, nc = r + dr, c + dc
                    if 0 <= nr < n and 0 <= nc < n and grid[nr][nc] == 1 and not visited[nr][nc]:
                        path.append(letter)
                        walk(nr, nc)
                        path.pop()
                visited[r][c] = False

            walk(0, 0)
            return result


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            values = [int(x) for x in data[1:1 + n * n]]
            grid = [values[i * n:(i + 1) * n] for i in range(n)]
            routes = rat_routes(grid)
            out = [str(len(routes))]
            out.extend(routes)
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
