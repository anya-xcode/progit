    slug: expression-add-operators
    title: "Expression Add Operators"
    difficulty: Hard
    topic: "Recursion"
    subtopic: "Trying out all Combos / Hard"
    tags: ["recursion", "backtracking", "strings", "math"]
    sourceUrl: "https://leetcode.com/problems/expression-add-operators/"
    statement: |
      You are given a string `num` of digits and an integer `target`. Insert the
      operators `+`, `-` and `*` into the gaps between the digits - into **every** gap,
      one gap at a time, or none at all - so that the resulting arithmetic expression
      evaluates to `target`.

      Rules:

      - The digits keep their original order and none may be removed. Consecutive
        digits with no operator between them form a single multi-digit operand.
      - An operand of two or more digits must not start with `0`. From `105` the
        expressions `1+0+5`, `1*0*5`, `10-5` and `105` are all legal, while `1+05` and
        `1-05` are not, because the operand `05` has a leading zero. A single `0` on
        its own is always allowed.
      - The expression is evaluated with ordinary precedence: all `*` first, then `+`
        and `-` from left to right. There are no parentheses and no unary minus, so the
        expression always starts with a digit.

      List every expression that evaluates to `target`.

      To make the output unique, print the expressions in increasing **lexicographic**
      order, comparing them as ASCII strings. Note that `*` (42) sorts before `+` (43),
      which sorts before `-` (45), which sorts before every digit.
    inputFormat: |
      - Line 1: the digit string `num` and the integer `target`, separated by a space.
    outputFormat: |
      - Line 1: the number of expressions that evaluate to `target`.
      - Then one expression per line, with no spaces, in increasing lexicographic
        order. If there are none, print only the `0`.
    constraints:
      - "1 <= len(num) <= 9"
      - "Every character of `num` is a digit `0`-`9`."
      - "-10^9 <= target <= 10^9"
    examples:
      - input: |
          123 6
        output: |
          2
          1*2*3
          1+2+3
        explanation: "Both 1*2*3 and 1+2+3 equal 6. Since '*' sorts before '+', the multiplication line is printed first."
      - input: |
          232 8
