    explanation: |
      **Generate and evaluate - O(4^(L-1) * L) time.** Each of the `L - 1` gaps holds
      one of four things (`+`, `-`, `*`, or nothing), so build all `4^(L-1)`
      expressions, discard those with an illegal leading zero, and evaluate each one
      with a small precedence-aware parser. For `L = 9` that is 65536 expressions and
      runs instantly, which makes it the perfect cross-check.

      **Backtracking that carries the running value - O(4^(L-1)) time, O(L) recursion
      depth.** `build(index, expr, total, last)` where `total` is the value of `expr`
      and `last` is the signed value of the term most recently added:

      - if `index == L`, record `expr` when `total == target`;
      - otherwise for each `end > index`, let `piece = num[index:end]`:
        - if `index == 0`: `build(end, piece, value, value)` - the first operand has
          no operator;
        - else three branches: `+` gives `(total + value, last = value)`, `-` gives
          `(total - value, last = -value)`, and `*` gives
          `(total - last + last * value, last = last * value)`;
        - stop extending `piece` as soon as it has a leading zero.

      **Why the multiplication trick works.** `total` already includes `last` as a
      completed additive term. Multiplying attaches the new operand to that term
      instead, so you remove the old contribution (`total - last`) and add the new one
      (`last * value`). Because `last` carries its sign, this handles `2-3*4` correctly:
      `last = -3`, so the total becomes `2 - (-3) + (-3 * 4) = -10`. This is what lets
      the whole expression be evaluated on the fly, with no parser and no second pass.

      **Pruning the leading zero.** Inside the loop over operand lengths, `break` (not
      `continue`) the moment `num[index] == '0'` and the piece is longer than one
      character - every longer piece starts with the same zero and is equally illegal.

      **Ordering.** The recursion does not generate the expressions in ASCII order
      (`*`, `+` and `-` are tried in whatever order you write them, and operand lengths
      interleave), so the collected list is sorted at the end. With at most a few
      thousand answers that sort is negligible compared with the search.

      **Overflow.** `total`, `last` and the operands stay bounded by the value of the
      9-digit number, so 64-bit arithmetic is enough in a fixed-width language.
