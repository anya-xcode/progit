  - sheetId: prob-7-3-5-word-break
    slug: word-break
    title: "Word Break"
    difficulty: Medium
    topic: "Recursion"
    subtopic: "Trying out all Combos / Hard"
    tags: ["recursion", "memoization", "strings"]
    sourceUrl: "https://leetcode.com/problems/word-break/"
    statement: |
      You are given a dictionary of `n` words and a string `s`. Decide whether `s` can
      be written as a sequence of one or more dictionary words joined together, with
      nothing left over.

      Words may be reused as many times as you like, and you do not have to use them
      all. All words and `s` consist of lowercase English letters only.
    inputFormat: |
      - Line 1: an integer `n`, the number of dictionary words.
      - Line 2: `n` space-separated words.
      - Line 3: the string `s`.
    outputFormat: |
      Print `true` if `s` can be split into dictionary words, otherwise `false`.
    constraints:
      - "1 <= n <= 100"
      - "1 <= length of each dictionary word <= 20"
      - "1 <= len(s) <= 300"
      - "All words are distinct and contain only lowercase English letters."
    examples:
      - input: |
          2
          apple pen
          applepenapple
        output: |
          true
        explanation: "The string splits as apple + pen + apple; the word apple is used twice, which is allowed."
      - input: |
          5
          cats dog sand and cat
          catsandog
        output: |
          false
        explanation: "Every promising start fails: cats + and leaves og, and cat + sand leaves og as well. No split covers the whole string."
    hints:
      - "Think about the first word. Try every prefix of s; if the prefix is in the dictionary, ask the same question about the rest of the string."
      - "Put the dictionary in a hash set so 'is this prefix a word' is O(length of the prefix) instead of a scan over all words."
      - "The plain recursion can revisit the same suffix through many different splits. Cache the answer for each starting index - there are only len(s) + 1 of them, which turns the exponential search into a linear-sized table."
    explanation: |
      **Plain recursion - O(2^L) worst case.** `can_break(start)` tries every `end >
      start`, and whenever `s[start:end]` is a word it recurses on `end`. With a
      dictionary like `{a, aa, aaa, ...}` and a string of `a`s that ends in a
      character that is not in the dictionary, the same suffixes are re-explored
      through an exponential number of different splits, and the search stalls well
      before `L = 300`.

      **Recursion + memoisation - O(L * W) time, O(L) space** (plus the dictionary),
      where `W` is the longest word. The only thing that matters about the work left to
      do is *where the remaining suffix starts*, so cache `can_break(start)` for each
      of the `L + 1` starts. Each start is then computed once and tries at most `W`
      prefixes, each looked up in a hash set in time proportional to its length. That
      is the whole fix - the exponential blow-up was pure repetition.

      Two details that matter: stop extending a prefix once it is longer than the
      longest dictionary word, and check `start == L` first, which is the "nothing left
      over" success case.

      **Bottom-up dynamic programming - same bounds, no recursion.** Let
      `ok[i]` mean "`s[i:]` can be split". Then `ok[L] = true` and
      `ok[i] = OR over end of (s[i:end] in dict and ok[end])`. Filling the array from
      right to left is the iterative twin of the memoised recursion and avoids the
      recursion depth entirely.

      **Trie variant - O(L * W) time with cheaper constants.** Storing the dictionary
      in a trie lets you walk the characters of `s` once per start position and learn
      "is this a word" for every prefix along the way, instead of hashing each prefix
      separately.
