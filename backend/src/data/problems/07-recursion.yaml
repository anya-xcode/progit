    referenceSolution:
      python: |
        import sys


        def my_atoi(s: str) -> int:
            low, high = -2 ** 31, 2 ** 31 - 1

            def parse(i: int, value: int, sign: int) -> int:
                if i == len(s) or not ("0" <= s[i] <= "9"):
                    return sign * value
                value = value * 10 + (ord(s[i]) - 48)
                if sign == 1 and value > high:
                    return high
                if sign == -1 and -value < low:
                    return low
                return parse(i + 1, value, sign)

            if s == "":
                return 0
            if s[0] == "-":
                return parse(1, 0, -1)
            if s[0] == "+":
                return parse(1, 0, 1)
            return parse(0, 0, 1)


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            line = sys.stdin.read().split("\n")[0]
            print(my_atoi(line))


        if __name__ == "__main__":
            main()
