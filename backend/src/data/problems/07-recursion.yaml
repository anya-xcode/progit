        import sys
        from typing import List


        def reverse_stack(stack: List[int]) -> List[int]:
            # The list is used as the stack: index 0 is the bottom, index -1 the top.
            def insert_at_bottom(value: int) -> None:
                if not stack:
                    stack.append(value)
                    return
                top = stack.pop()
                insert_at_bottom(value)
                stack.append(top)

            def reverse() -> None:
                if not stack:
                    return
                top = stack.pop()
                reverse()
                insert_at_bottom(top)

            reverse()
            return stack


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            stack = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(x) for x in reverse_stack(stack)))


