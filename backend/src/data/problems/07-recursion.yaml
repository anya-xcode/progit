    tags: ["recursion", "backtracking", "sorting"]
    sourceUrl: "https://leetcode.com/problems/subsets-ii/"
    statement: |
      You are given an array `nums` of `n` integers that **may contain repeated
      values**. List every distinct subset of `nums`, including the empty subset and
      the whole array.

      Subsets are compared as **multisets**: `{1, 2}` taken from positions `0, 1` and
      `{1, 2}` taken from positions `0, 2` are the same subset and must be printed
      once. Two subsets are different only when some value appears a different number
      of times in them.

      To make the output unique:

      - Print the values of each subset in **non-decreasing** order.
      - Print the subsets in increasing **lexicographic** order, comparing them element
        by element as numbers. If one subset is a prefix of another, the shorter one
        comes first - in particular the empty subset is always first, printed as an
        empty line.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      - Line 1: the number of distinct subsets.
      - Then one subset per line, values separated by single spaces, in the order
        described above. The empty subset is printed as an empty line.
    constraints:
      - "1 <= n <= 12"
      - "-10 <= nums[i] <= 10"
    examples:
      - input: |
          3
          1 2 2
        output: |
          6

          1
          1 2
          1 2 2
          2
          2 2
        explanation: "The 8 index subsets collapse to 6 distinct multisets. In order: the empty one, then 1, 1 2, 1 2 2, 2 and 2 2."
      - input: |
          2
          -3 -3
        output: |
          3

          -3
          -3 -3
        explanation: "With two equal values there are only three distinct subsets: none of them, one -3, and both."
    hints:
      - "Sort the array first. Then building a subset by walking forward through the array automatically keeps it non-decreasing."
      - "Use the loop form: build(start) first records the subset built so far, then for every i from start onwards appends nums[i], recurses on i + 1 and pops."
      - "Recording before the loop and trying indices in increasing order is what makes the output lexicographic. To kill duplicates, skip index i when i > start and nums[i] == nums[i-1] - that value was already tried at this depth."
    explanation: |
      **All 2^n masks plus a set - O(2^n * n log n) time, O(2^n * n) space.** For each
      of the `2^n` index subsets, sort the chosen values, store the tuple in a hash set
      to remove duplicates, then sort the surviving list. It works but it builds many
      subsets only to throw them away, and the final sort is an extra `log` factor.

      **Backtracking on the sorted array - O(2^n * n) time, O(n) recursion depth plus
      the output.** Sort `nums`. `build(start)`:

      1. record a copy of the current list (this is a valid subset);
      2. for `i` from `start` to `n - 1`: append `nums[i]`, call `build(i + 1)`, pop.

      Step 1 before step 2 makes the walk a pre-order traversal of the subset tree: a
      subset is emitted before all of its extensions, and extensions with a smaller
      next element come first. That is precisely the lexicographic order requested, so
      the output never needs sorting.

      **Killing duplicates.** After sorting, equal values sit next to each other. Two
      siblings at the same depth that hold the same value generate exactly the same
      family of subsets, so keeping only the first is enough:
      `if i > start and nums[i] == nums[i-1]: continue`. The condition is `i > start`
      and not `i > 0` on purpose - a repeated value is still allowed *deeper* in the
      same branch, which is how `2 2` is produced from `1 2 2`.

      **Cost.** Every recursive call emits exactly one subset, so the number of calls
      equals the number of distinct subsets - never more than `2^n`, and far fewer when
      there are many repeats. Copying each subset costs `O(n)`, and that copying is
      unavoidable since the output itself is that large.
