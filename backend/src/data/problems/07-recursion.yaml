  - slug: subsets
    title: "Subsets"
    difficulty: Medium
    topic: "Recursion"
    subtopic: "Subsequences"
    tags: ["recursion", "backtracking", "bit-manipulation"]
    sourceUrl: "https://leetcode.com/problems/subsets/"
    statement: |
      You are given an array `nums` of **distinct** integers. List every subset of
      `nums` (the power set), including the empty subset and the whole array.

      To make the output unique:

      - Write the elements of each subset in **increasing** order.
      - Order the subsets **lexicographically** by comparing their elements as
        numbers from left to right. If one subset is a prefix of another, the
        shorter one comes first. In particular the empty subset is always first.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated distinct integers (an empty line if `n = 0`).
    outputFormat: |
      - Line 1: the number of subsets, `2^n`.
      - Then one subset per line in the order described above, with elements
        separated by spaces. The empty subset is printed as an empty line.
    constraints:
      - "0 <= n <= 10"
      - "-100 <= nums[i] <= 100"
      - "All values in `nums` are distinct."
    examples:
      - input: |
          3
          3 1 2
        output: |
          8

          1
          1 2
          1 2 3
          1 3
          2
          2 3
          3
        explanation: "After sorting, the elements are 1 2 3. The empty subset (blank line) comes first, then every subset starting with 1, then those starting with 2, then 3."
      - input: |
          2
          -4 7
        output: |
          4

          -4
          -4 7
          7
        explanation: "Numbers are compared by value, so -4 comes before 7."
    hints:
      - "Every element is either in or out of a subset, so there are 2^n subsets. A bitmask from 0 to 2^n - 1 can describe each one."
      - "Sorting the array first makes each subset automatically increasing if you pick elements left to right."
      - "Recursive idea: record the current subset, then for every index i after the last chosen one, add nums[i], recurse, and remove it. The records come out in exactly the required order."
    explanation: |
      **Bitmasks - O(2^n * n) time, O(2^n * n) space.** Sort `nums`. For every mask
      from `0` to `2^n - 1`, collect the elements whose bits are set. The masks do not
      come out in the required order, so sort the list of subsets afterwards, adding
      an `O(2^n * n * log(2^n))` factor.

      **Pick / not-pick recursion - O(2^n * n) time.** At each index decide whether to
      include the element. This also produces every subset, but again in a different
      order, so a final sort is needed.

      **Backtracking in lexicographic order - O(2^n * n) time, O(n) recursion depth
      (plus the output).** Sort `nums`. `build(start)` first records the current
      subset, then for each `i` from `start` to `n - 1` appends `nums[i]`, calls
      `build(i + 1)` and pops. This is a pre-order walk of the subset tree: a subset
      is emitted before all its extensions, and extensions with smaller next elements
      come first - precisely lexicographic order, so no sorting of the output is
      required.
