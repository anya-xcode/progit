  - sheetId: prob-7-2-11-combination-sum-iii
    slug: combination-sum-iii
    title: "Combination Sum III"
    difficulty: Medium
    topic: "Recursion"
    subtopic: "Subsequences Pattern"
    tags: ["recursion", "backtracking"]
    sourceUrl: "https://leetcode.com/problems/combination-sum-iii/"
    statement: |
      Pick exactly `k` **different** digits from `1, 2, 3, ..., 9` so that they add up
      to `n`. Each digit may be used at most once, and `0` is not available.

      List every such choice. Two choices are the same when they use the same set of
      digits, so `1 + 2 + 4` and `4 + 1 + 2` count once.

      To make the output unique:

      - Print the digits of each choice in **increasing** order.
      - Print the choices in increasing **lexicographic** order, comparing them digit
        by digit. All choices have the same length `k`, so this is the same as reading
        each line as a `k`-digit number and sorting those numbers.
    inputFormat: |
      - Line 1: two integers `k` and `n`.
    outputFormat: |
      - Line 1: the number of valid choices.
      - Then one choice per line, digits separated by single spaces, in increasing
        lexicographic order. If there are none, print only the `0`.
    constraints:
      - "1 <= k <= 9"
      - "1 <= n <= 60"
    examples:
      - input: |
          3 9
        output: |
          3
          1 2 6
          1 3 5
          2 3 4
        explanation: "Three different digits adding to 9: 1+2+6, 1+3+5 and 2+3+4. (1+4+4 is not allowed - a digit may not repeat.)"
      - input: |
          4 1
        output: |
          0
        explanation: "The four smallest different digits already add up to 1+2+3+4 = 10, so reaching 1 with four digits is impossible."
    hints:
      - "Walk the digits 1..9 in order and decide how the next digit is chosen: build(start, remaining, left) may use any digit from start to 9 as the next one, then recurses with start = digit + 1."
      - "Two counters must both hit their target at the same time: 'left' digits still to place and 'remaining' sum still to reach. Succeed only when left == 0 and remaining == 0."
      - "Prune hard. A digit larger than the remaining sum is useless (and so is every digit after it, so you can break). You can also stop when the largest 'left' digits still available cannot reach 'remaining'."
    explanation: |
      **All subsets of size k - O(C(9,k) * k) time.** There are at most `C(9,4) = 126`
      subsets of any single size and 512 subsets in total, so simply enumerating every
      subset of `{1..9}` and keeping those of size `k` with sum `n` is perfectly fast
      here. It is the honest brute force, and worth knowing because the search space
      is tiny.

      **Backtracking with two counters - O(C(9,k)) nodes, O(k) recursion depth.**
      `build(start, remaining, left)`:

      - if `left == 0`, record the current list when `remaining == 0` and return;
      - otherwise loop `digit` from `start` to `9`, append it, recurse with
        `build(digit + 1, remaining - digit, left - 1)`, and pop.

      Recursing from `digit + 1` enforces both "different digits" and "increasing
      order" at once, which is also what removes the reordering duplicates.

      **Pruning.** The digits are tried in increasing order, so once `digit >
      remaining` no later digit can fit either - `break` out of the loop instead of
      `continue`. A second, stronger bound: with `left` digits to go the largest sum
      still reachable from `digit` is `digit + (digit+1) + ... ` limited to `9`, so if
      even the `left` largest remaining digits fall short of `remaining`, the branch is
      dead. With these cuts the tree collapses to little more than the answers
      themselves.

      **Ordering for free.** Digits are always tried from small to large and every
      answer has length `k`, so the recursion produces the lines already in increasing
      lexicographic order.

      **Sanity bounds.** The smallest possible sum with `k` digits is
      `1 + 2 + ... + k = k(k+1)/2` and the largest is `9 + 8 + ... = k(19-k)/2`. If `n`
      falls outside that window the answer is immediately `0`.
