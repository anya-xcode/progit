  - sheetId: prob-7-3-1-palindrome-partitioning
    slug: palindrome-partitioning
    title: "Palindrome partitioning"
    difficulty: Hard
    topic: "Recursion"
    subtopic: "Trying out all Combos / Hard"
    tags: ["recursion", "backtracking", "strings", "palindrome"]
    sourceUrl: "https://leetcode.com/problems/palindrome-partitioning/"
    statement: |
      You are given a lowercase string `s`. Cut it into consecutive pieces so that
      **every piece reads the same forwards and backwards**. The pieces must cover the
      whole string, in order, with no gaps and no overlaps; a single character is
      always a palindrome, so at least one such cutting always exists.

      List every way to cut the string.

      To make the output unique, print the partitions in increasing **lexicographic
      order of the printed line** (ordinary ASCII comparison of the whole line, spaces
      included - a space sorts before every letter, so a partition whose first piece is
      shorter comes first).
    inputFormat: |
      - Line 1: the string `s`, made of lowercase English letters.
    outputFormat: |
      - Line 1: the number of ways to cut the string.
      - Then one partition per line: the pieces in left-to-right order, separated by
        single spaces.
    constraints:
      - "1 <= len(s) <= 12"
      - "`s` contains only lowercase English letters."
    examples:
      - input: |
          aab
        output: |
          2
          a a b
          aa b
        explanation: "Cutting after every character gives a | a | b, and joining the two a's gives aa | b. Splitting as a | ab fails because ab is not a palindrome."
      - input: |
          abba
        output: |
          3
          a b b a
          a bb a
          abba
        explanation: "Three cuttings work: every character on its own, keeping bb together, and taking the whole string, which is itself a palindrome."
    hints:
      - "Think of it as choosing the first piece: try every prefix of s, and if that prefix is a palindrome, solve the same problem on the rest of the string."
      - "Carry a start index and a list of pieces chosen so far. When start reaches the end of the string, the list is one complete answer - record a copy of it."
      - "Trying prefixes from shortest to longest makes the answers come out already sorted: a shorter first piece is a prefix of a longer one, and the separating space sorts before any letter."
    explanation: |
      **Try every set of cut positions - O(2^(L-1) * L^2) time.** There are `L - 1`
      gaps and each is either cut or not, so enumerate all `2^(L-1)` subsets, split
      accordingly and check that every piece is a palindrome. It is the definition
      turned into code, and for `L = 12` it is only 2048 candidates, so it is a fine
      way to double-check a fancier solution.

      **Backtracking on the first piece - O(2^(L-1) * L) time, O(L) recursion depth
      plus the output.** `build(start)`:

      - if `start == L`, record a copy of the pieces collected so far;
      - otherwise for every `end` from `start + 1` to `L`: if `s[start:end]` is a
        palindrome, push it, call `build(end)`, and pop.

      Every node of this tree corresponds to a palindromic prefix that really extends,
      so no work is wasted on dead branches beyond the palindrome tests themselves.

      **Speeding up the palindrome test.** Checking `s[start:end]` costs `O(L)` each
      time. Precompute a table `is_pal[i][j]` in `O(L^2)` with the recurrence
      `is_pal[i][j] = (s[i] == s[j]) and (j - i < 2 or is_pal[i+1][j-1])`, and every
      test afterwards is `O(1)`. For `L = 12` it barely matters, but it is the standard
      trick and it is what makes the same code usable on longer strings.

      **How many answers are there?** For a string of `L` identical characters every
      one of the `2^(L-1)` cuttings works, so the output really can be exponential -
      2048 lines for `L = 12`. No algorithm can beat that, since the answer has to be
      written out; the length limit exists for exactly that reason.

      **Ordering.** Extending the first piece one character at a time means the shorter
      candidate is always explored first, and the same holds recursively at every
      level. Comparing the printed lines, a shorter first piece is followed by a space
      (ASCII 32) while the longer one continues with a letter (ASCII 97 or more), so
      the shorter one is smaller - the recursion emits the lines in sorted order
      without any sorting step.
