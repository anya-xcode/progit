    referenceSolution:
      python: |
        import sys
        from typing import List


        def combination_sum_three(k: int, n: int) -> List[List[int]]:
            result: List[List[int]] = []
            current: List[int] = []

            def build(start: int, remaining: int, left: int) -> None:
                if left == 0:
                    if remaining == 0:
                        result.append(list(current))
                    return
                for digit in range(start, 10):
                    if digit > remaining:
                        break
                    current.append(digit)
                    build(digit + 1, remaining - digit, left - 1)
                    current.pop()

            build(1, n, k)
            return result


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            k, n = int(data[0]), int(data[1])
            combos = combination_sum_three(k, n)
            out = [str(len(combos))]
            out.extend(" ".join(str(v) for v in combo) for combo in combos)
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
