    slug: count-all-subsequences-with-sum-k
    title: "Count all subsequences with sum K"
    difficulty: Easy
    topic: "Recursion"
    subtopic: "Subsequences Pattern"
    tags: ["recursion", "subsequences", "counting"]
    sourceUrl: "https://www.naukri.com/code360/problems/count-all-subsequences-with-sum-k"
    statement: |
      You are given an array `nums` of `n` non-negative integers and a non-negative
      integer `k`.

      A **subsequence** is chosen by deciding, for every index, whether to keep it or
      drop it, without reordering anything. Two subsequences are considered different
      when the **set of indices** they keep is different - even if the values happen to
      be the same. The empty subsequence is one of them, and its sum is `0`.

      Count how many of the `2^n` subsequences have a sum exactly equal to `k`.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print a single integer: the number of subsequences whose sum is exactly `k`.
    constraints:
      - "1 <= n <= 18"
      - "0 <= nums[i] <= 100"
      - "0 <= k <= 1000"
    examples:
      - input: |
          4 5
          1 2 3 2
        output: |
          3
        explanation: "Writing the kept indices: {0,1,3} gives 1+2+2 = 5, {0,2} gives 1+3 = 4 - no. The index sets that work are {1,2} (2+3), {2,3} (3+2) and {0,1,3} (1+2+2), so the answer is 3."
      - input: |
          3 0
          0 0 1
        output: |
          4
        explanation: "A subsequence sums to 0 exactly when it avoids index 2. Indices 0 and 1 are free, giving the 4 index sets {}, {0}, {1}, {0,1}."
    hints:
      - "Walk the array one index at a time. At index i you either add nums[i] to the running sum or you do not - two recursive calls."
      - "Let the recursion return a number instead of printing: the answer for a position is (count when you take it) + (count when you skip it). At the end of the array, return 1 if the running sum is exactly k, else 0."
      - "All values are non-negative, so once the running sum passes k the branch is dead - return 0 immediately and skip the whole subtree."
    explanation: |
      **Enumerate with bitmasks - O(2^n * n) time, O(1) space.** For every mask from
      `0` to `2^n - 1`, add up the selected values and compare with `k`. Simple, but it
      re-adds the same prefixes over and over: for `n = 18` that is about 4.7 million
      additions.

      **Pick / not-pick recursion - O(2^n) time, O(n) recursion depth.**
      `count(i, remaining)` returns the number of ways to reach exactly `remaining`
      using indices `i .. n-1`:

      - if `i == n`, return `1` when `remaining == 0`, else `0`;
      - otherwise return `count(i + 1, remaining - nums[i]) + count(i + 1, remaining)`.

      Each node does `O(1)` work and there are fewer than `2^(n+1)` nodes. Note how
      naturally the empty subsequence is handled: it is the path that always takes the
      second branch.

      **Pruning.** Because every value is `>= 0`, a branch with `remaining < 0` can
      never come back, so returning `0` there cuts off entire subtrees. It does not
      improve the worst case (an array of zeros with `k = 0` really does have `2^n`
      answers) but it is a large win in practice.

      **Memoisation - O(n * k) time and space.** The state is just
      `(index, remaining)` with `0 <= remaining <= k`, so caching turns the exponential
      recursion into a table - the classic bridge from this pattern into dynamic
      programming. It is what you would use if `n` were 1000 instead of 18. Careful:
      this works because the values are non-negative and bounded; with negative values
      the reachable sums are no longer confined to `0..k`.
