      python: |
        import sys
        from typing import List

        KEYS = {
            "2": "abc",
            "3": "def",
            "4": "ghi",
            "5": "jkl",
            "6": "mno",
            "7": "pqrs",
            "8": "tuv",
            "9": "wxyz",
        }


        def letter_combinations(digits: str) -> List[str]:
            result: List[str] = []
            current: List[str] = []

            def build(index: int) -> None:
                if index == len(digits):
                    result.append("".join(current))
                    return
                for letter in KEYS[digits[index]]:
                    current.append(letter)
                    build(index + 1)
                    current.pop()

            build(0)
            return result


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            digits = sys.stdin.read().split()[0]
            words = letter_combinations(digits)
            out = [str(len(words))]
            out.extend(words)
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
