    referenceSolution:
      python: |
        import sys
        from typing import List, Tuple


        def run_bit_operations(x: int, operations: List[Tuple[str, int]]) -> List[int]:
            value = x
            results: List[int] = []
            for name, position in operations:
                if name == "get":
                    results.append((value >> position) & 1)
                elif name == "set":
                    value |= 1 << position
                elif name == "clear":
                    value &= ~(1 << position)
                elif name == "toggle":
                    value ^= 1 << position
                elif name == "count":
                    rest = value
                    ones = 0
                    while rest:
                        rest &= rest - 1
                        ones += 1
                    results.append(ones)
                else:
                    results.append(value)
            return results


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            x = int(data[0])
            q = int(data[1])
            pos = 2
            operations = []
            for _ in range(q):
                name = data[pos]
                pos += 1
                if name in ("count", "value"):
                    operations.append((name, -1))
                else:
                    operations.append((name, int(data[pos])))
                    pos += 1
            for result in run_bit_operations(x, operations):
                print(result)


        if __name__ == "__main__":
            main()
