  - slug: implement-trie-ii
    title: "Implement Trie II"
    difficulty: Hard
    topic: "Tries"
    subtopic: "Medium Problems"
    tags: [trie, design, string]
    sourceUrl: "https://leetcode.com/problems/implement-trie-ii-prefix-tree/"
    statement: |
      Build a trie that remembers **how many times** each word was inserted. Implement a class
      `Trie` with:

      - `insert(word)` -- add one copy of `word`;
      - `count_words_equal_to(word)` -- return how many copies of `word` are currently stored;
      - `count_words_starting_with(prefix)` -- return how many stored copies (counting duplicates)
        start with `prefix`;
      - `erase(word)` -- remove one copy of `word`. It is guaranteed that at least one copy exists
        when `erase` is called.

      Operations are given as the commands `insert w`, `countWordsEqualTo w`,
      `countWordsStartingWith p` and `erase w`.
    inputFormat: |
      - Line 1: an integer `q`, the number of operations.
      - Next `q` lines: one operation each, as described above.
    outputFormat: |
      For every `countWordsEqualTo` and `countWordsStartingWith` operation, print the resulting
      integer on its own line, in order. `insert` and `erase` print nothing.
    constraints:
      - "1 <= q <= 3 * 10^4"
      - "1 <= |w|, |p| <= 2000"
      - "words consist of lowercase English letters"
      - "erase is only called for a word with at least one stored copy"
    examples:
      - input: |
          7
          insert apple
          insert apple
          insert app
          countWordsEqualTo apple
          countWordsStartingWith app
          erase apple
          countWordsStartingWith app
        output: |
          2
          3
          2
        explanation: "Two copies of \"apple\" are stored. Three stored words start with \"app\" (both apples and \"app\"); after erasing one apple, two remain."
      - input: |
          5
          insert dog
          countWordsEqualTo do
          erase dog
          countWordsStartingWith d
          countWordsEqualTo dog
        output: |
          0
          0
          0
        explanation: "\"do\" is only a prefix, not a stored word. After the erase the trie is empty again."
    hints:
      - "Give each node two counters: how many stored words pass through it, and how many end exactly at it."
      - "insert increments the pass counter of every node on the path and the end counter of the last node."
      - "erase walks the same path decrementing those counters. Queries just walk the path and read a counter."
    explanation: |
      **Brute force: multiset of words -- O(number of distinct words * L) per prefix query.** Keep a
      hash map `word -> count`; prefix counting scans all stored words.

      **Optimal: counting trie -- O(L) per operation, O(total inserted characters) space.** Every
      node stores `prefix_count` (stored words whose path passes through this node) and
      `end_count` (stored words ending here).
      - `insert`: for each character move to (or create) the child and increment its
        `prefix_count`; finally increment `end_count`.
      - `count_words_equal_to`: walk the path; return `end_count` of the last node, or 0 if the
        path breaks.
      - `count_words_starting_with`: walk the path; return `prefix_count` of the last node, or 0.
      - `erase`: walk the path decrementing `prefix_count`, then decrement `end_count`. Nodes whose
        count reaches 0 can optionally be deleted to free memory.
