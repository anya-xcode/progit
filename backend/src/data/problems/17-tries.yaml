    referenceSolution:
      python: |
        import sys
        from typing import List


        class TrieNode:
            __slots__ = ("children", "prefix_count", "end_count")

            def __init__(self) -> None:
                self.children = {}
                self.prefix_count = 0
                self.end_count = 0


        class Trie:
            def __init__(self) -> None:
                self.root = TrieNode()

            def insert(self, word: str) -> None:
                node = self.root
                for ch in word:
                    if ch not in node.children:
                        node.children[ch] = TrieNode()
                    node = node.children[ch]
                    node.prefix_count += 1
                node.end_count += 1

            def _walk(self, text: str):
                node = self.root
                for ch in text:
                    node = node.children.get(ch)
                    if node is None:
                        return None
                return node

            def count_words_equal_to(self, word: str) -> int:
                node = self._walk(word)
                return node.end_count if node else 0

            def count_words_starting_with(self, prefix: str) -> int:
                node = self._walk(prefix)
                return node.prefix_count if node else 0

            def erase(self, word: str) -> None:
                node = self.root
                for ch in word:
                    node = node.children[ch]
                    node.prefix_count -= 1
                node.end_count -= 1


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            q = int(lines[0])
            trie = Trie()
            out = []
            for line in lines[1:1 + q]:
                op, arg = line.split()
                if op == "insert":
                    trie.insert(arg)
                elif op == "erase":
                    trie.erase(arg)
                elif op == "countWordsEqualTo":
                    out.append(str(trie.count_words_equal_to(arg)))
                else:
                    out.append(str(trie.count_words_starting_with(arg)))
            print("\n".join(out))


        if __name__ == "__main__":
            main()
