  - slug: maximum-xor-of-two-numbers-in-an-array
    title: "Maximum XOR of Two Numbers in an Array"
    difficulty: Hard
    topic: "Tries"
    subtopic: "Hard Problems"
    tags: [trie, bit-manipulation, array]
    sourceUrl: "https://leetcode.com/problems/maximum-xor-of-two-numbers-in-an-array/"
    statement: |
      Given an array `nums` of non-negative integers, find the largest value of
      `nums[i] XOR nums[j]` over all index pairs with `0 <= i <= j < n`.

      Choosing `i = j` is allowed (it gives `0`), so the answer for a single element is `0`.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated non-negative integers.
    outputFormat: |
      Print a single integer: the maximum XOR of two elements.
    constraints:
      - "1 <= n <= 2 * 10^4"
      - "0 <= nums[i] <= 2^31 - 1"
    examples:
      - input: |
          4
          8 1 2 12
        output: |
          14
        explanation: "2 XOR 12 = 0010 XOR 1100 = 1110 = 14, which beats every other pair (for example 1 XOR 12 = 13)."
      - input: |
          3
          6 6 6
        output: |
          0
        explanation: "All values are equal, so every XOR is 0."
    hints:
      - "XOR is maximised by making the highest bits differ. Decide the answer bit by bit from the most significant bit."
      - "Store every number's 31-bit binary representation in a trie, most significant bit first."
      - "For each number, walk the trie greedily choosing the opposite bit whenever that child exists."
    explanation: |
      **Brute force -- O(n^2) time, O(1) space.** XOR every pair and keep the maximum.

      **Better: prefix set per bit -- O(31 * n) time, O(n) space.** Build the answer from the top
      bit down. For bit `b`, collect the prefixes `num >> b` in a set and test whether the candidate
      `(answer << 1) | 1` can be formed as `p XOR q` for two prefixes in the set.

      **Optimal: binary trie -- O(31 * n) time, O(31 * n) space.** Insert every number as a path of
      31 bits (bit 30 down to bit 0). For each number `x`, start at the root; at bit `b` prefer the
      child with bit `1 - bit(x, b)`, adding `1 << b` to the running XOR when it exists, otherwise
      follow the same bit. The maximum over all `x` is the answer. Inserting all numbers first is
      fine because pairing `x` with itself only yields 0.
    starterCode:
      python: |
        import sys
        from typing import List


        def find_maximum_xor(nums: List[int]) -> int:
            # Return the maximum nums[i] ^ nums[j].
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(find_maximum_xor(nums))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def find_maximum_xor(nums: List[int]) -> int:
            BITS = 31
            zero = [0]
            one = [0]
            for num in nums:
                node = 0
                for b in range(BITS - 1, -1, -1):
                    child = one if (num >> b) & 1 else zero
                    if child[node] == 0:
                        child[node] = len(zero)
                        zero.append(0)
                        one.append(0)
                    node = child[node]
            best = 0
            for num in nums:
                node = 0
                current = 0
                for b in range(BITS - 1, -1, -1):
                    bit = (num >> b) & 1
                    want = zero if bit else one
                    if want[node]:
                        current |= 1 << b
                        node = want[node]
                    else:
                        node = (one if bit else zero)[node]
                best = max(best, current)
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(find_maximum_xor(nums))


        if __name__ == "__main__":
            main()
