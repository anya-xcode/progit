  - slug: maximum-xor-with-an-element-from-array
    title: "Maximum XOR With an Element From Array"
    difficulty: Hard
    topic: "Tries"
    subtopic: "Hard Problems"
    tags: [trie, bit-manipulation, sorting, offline-queries]
    sourceUrl: "https://leetcode.com/problems/maximum-xor-with-an-element-from-array/"
    statement: |
      You are given an array `nums` of non-negative integers and `q` queries. Query `i` is a pair
      `(x, m)`.

      The answer to a query is the maximum of `x XOR nums[j]` over all elements with
      `nums[j] <= m`. If no element of `nums` is at most `m`, the answer is `-1`.

      Answer every query.
    inputFormat: |
      - Line 1: two integers `n` and `q`.
      - Line 2: `n` space-separated non-negative integers, the array `nums`.
      - Next `q` lines: two integers `x m` per query.
    outputFormat: |
      Print `q` lines; line `i` contains the answer to query `i`.
    constraints:
      - "1 <= n, q <= 10^5"
      - "0 <= nums[j], x, m <= 10^9"
    examples:
      - input: |
          4 3
          5 2 9 12
          7 4
          7 1
          10 20
        output: |
          5
          -1
          15
        explanation: "Query 1: only 2 is <= 4, and 7 XOR 2 = 5. Query 2: no element is <= 1, so -1. Query 3: every element is allowed; 10 XOR 5 = 15 is the largest."
      - input: |
          3 2
          4 4 4
          4 4
          0 3
        output: |
          0
          -1
        explanation: "4 XOR 4 = 0 for the first query; no element is <= 3 for the second."
    hints:
      - "Without the limit m this is the maximum-XOR trie problem. How can you make the trie contain only elements <= m?"
      - "Process queries offline: sort them by m and sort nums ascending."
      - "Before answering a query, insert every not-yet-inserted element that is <= m, then query the trie greedily. Remember to print answers in the original order."
    explanation: |
      **Brute force -- O(n * q) time, O(1) space.** For each query scan all elements, skipping those
      greater than `m`.

      **Optimal: offline queries + binary trie -- O((n + q) * B + n log n + q log q) time,
      O(n * B) space** (B = 30 bits). Sort `nums`. Sort query indices by `m`. Keep a pointer into
      `nums`; for each query in increasing `m`, insert all elements `<= m` into the trie. If the trie
      is still empty the answer is `-1`; otherwise walk from the top bit, choosing the opposite bit of
      `x` whenever that child exists, to obtain the maximum XOR. Store the answer at the query's
      original index.

      An online alternative stores in each trie node the minimum value in its subtree and only
      follows children whose minimum is `<= m`; it has the same complexity without sorting queries.
    starterCode:
