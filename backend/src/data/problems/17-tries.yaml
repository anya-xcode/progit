section: tries
problems:
  - slug: implement-trie
    title: "Implement Trie (Prefix Tree)"
    difficulty: Hard
    topic: "Tries"
    subtopic: "Theory"
    tags: [trie, design, string]
    sourceUrl: "https://leetcode.com/problems/implement-trie-prefix-tree/"
    statement: |
      A **trie** (prefix tree) stores strings character by character so that words sharing a prefix
      share the same path from the root. Implement a class `Trie` supporting:

      - `insert(word)` -- add `word` to the trie (inserting an existing word changes nothing);
      - `search(word)` -- return whether `word` was inserted before;
      - `starts_with(prefix)` -- return whether some inserted word begins with `prefix`
        (a word counts as a prefix of itself).

      The operations are given as text commands `insert w`, `search w` and `startsWith p`.
    inputFormat: |
      - Line 1: an integer `q`, the number of operations.
      - Next `q` lines: one operation each: `insert w`, `search w` or `startsWith p`.
    outputFormat: |
      For every `search` and `startsWith` operation, print `true` or `false` on its own line, in
      the order the operations appear. `insert` prints nothing.
    constraints:
      - "1 <= q <= 3 * 10^4"
      - "1 <= |w|, |p| <= 2000"
      - "words consist of lowercase English letters"
    examples:
      - input: |
          6
          insert cart
          search car
          startsWith car
          insert car
          search car
          search carts
        output: |
          false
          true
          true
          false
        explanation: "\"car\" is only a prefix until it is inserted itself; \"carts\" was never inserted."
      - input: |
          4
          startsWith a
          insert a
          startsWith a
          search a
        output: |
          false
          true
          true
        explanation: "Nothing starts with \"a\" in an empty trie. After inserting \"a\", it is both a stored word and a prefix of itself."
    hints:
      - "Each node needs links to up to 26 children and a flag saying whether a word ends there."
      - "insert walks down the path, creating missing nodes; search and starts_with walk down without creating anything."
      - "search needs the end-of-word flag at the final node; starts_with only needs the path to exist."
    explanation: |
      **Brute force: list of words -- O(total length) per query.** Store words in a list (or a set
      for `search`) and check every word with `startswith` for prefix queries.

      **Optimal: trie -- O(L) per operation, O(total inserted characters) space** (L = length of the
      argument). Each node holds a map from character to child node and an `is_end` flag.
      - `insert`: walk from the root, creating children as needed; set `is_end` on the last node.
      - `search`: walk the path; if any child is missing return false; otherwise return `is_end`.
      - `starts_with`: walk the path; return true if it exists entirely.

      Children can be stored as a dictionary (compact) or an array of 26 slots (faster indexing).
