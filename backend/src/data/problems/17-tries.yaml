  - slug: count-distinct-substrings
    title: "Count Distinct Substrings"
    difficulty: Medium
    topic: "Tries"
    subtopic: "Medium Problems"
    tags: [trie, string]
    sourceUrl: ""
    statement: |
      Given a string `s`, count how many **different** strings occur as contiguous substrings of
      `s`. Equal substrings found at different positions are counted only once.

      **The empty string is counted as one of the substrings**, so the answer is always at least 1
      more than the number of distinct non-empty substrings.
    inputFormat: |
      - Line 1: the string `s`.
    outputFormat: |
      Print a single integer: the number of distinct substrings of `s`, including the empty string.
    constraints:
      - "1 <= |s| <= 1000"
      - "s consists of lowercase English letters"
    examples:
      - input: |
          aba
        output: |
          6
        explanation: "Non-empty distinct substrings: a, b, ab, ba, aba (the second \"a\" is a repeat). Adding the empty string gives 6."
      - input: |
          zzz
        output: |
          4
        explanation: "The distinct non-empty substrings are z, zz and zzz; with the empty string the count is 4."
    hints:
      - "Putting every substring into a hash set works, but building and hashing O(n^2) strings of length O(n) is O(n^3)."
      - "Every substring is a prefix of some suffix of s."
      - "Insert each suffix into a trie character by character. Each newly created node corresponds to exactly one new distinct substring."
    explanation: |
      **Brute force: hash set of substrings -- O(n^3) time, O(n^3) space.** Generate all
      `n(n+1)/2` substrings, add them to a set, and output `size + 1` for the empty string.

      **Optimal for this constraint: suffix trie -- O(n^2) time, O(n^2) space.** For each start
      index `i`, walk from the root inserting `s[i], s[i+1], ...`. A node is created exactly when the
      substring `s[i..j]` has never been seen before, so the number of created nodes equals the number
      of distinct non-empty substrings. The root itself represents the empty string, so the answer
      is `created + 1`.

      (Suffix automata or suffix arrays with LCP reach O(n) or O(n log n), but they are beyond the
      scope of this section.)
