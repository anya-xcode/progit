  - slug: longest-word-with-all-prefixes
    title: "Longest Word With All Prefixes"
    difficulty: Medium
    topic: "Tries"
    subtopic: "Medium Problems"
    tags: [trie, string]
    sourceUrl: ""
    statement: |
      You are given a list of words. A word is called **complete** if every one of its non-empty
      prefixes also appears in the list. For example, `"bat"` is complete only if `"b"`, `"ba"` and
      `"bat"` are all in the list.

      Find the longest complete word. If several complete words have the maximum length, return the
      **lexicographically smallest** one. If no word is complete, return `"None"`.
    inputFormat: |
      - Line 1: an integer `n`, the number of words.
      - Line 2: `n` space-separated words (duplicates may occur).
    outputFormat: |
      Print the longest complete word (lexicographically smallest on ties), or `None` if there is no
      complete word.
    constraints:
      - "1 <= n <= 10^5"
      - "1 <= |word| <= 10^5"
      - "sum of word lengths <= 10^5"
      - "words consist of lowercase English letters"
    examples:
      - input: |
          8
          b ba bat bath c ca cab cabin
        output: |
          bath
        explanation: "\"bath\" has prefixes b, ba, bat, bath, all present. \"cabin\" is longer but \"cabi\" is missing, and \"cab\" is shorter than \"bath\"."
      - input: |
          5
          x xz xy y yz
        output: |
          xy
        explanation: "\"xz\", \"xy\" and \"yz\" are all complete with length 2; the smallest of them is \"xy\"."
    hints:
      - "Checking each prefix of each word with a hash set costs O(L^2) per word because of slicing."
      - "Insert every word into a trie and mark the nodes where words end."
      - "A word is complete iff every node along its path is marked. Walk the trie (DFS) only through marked nodes, visiting children in alphabetical order."
    explanation: |
      **Brute force: hash set -- O(sum of L^2) time, O(sum of L) space.** Put all words in a set; for
      each word check every prefix with a slice lookup. Keep the best word by (length desc, lexicographic asc).

      **Optimal: trie -- O(sum of L) time and space.** Insert all words, marking end nodes. For each
      word, walk its path and verify that every node on the way is an end node; it is complete if so.
      Compare candidates by length, then lexicographically.

      An equivalent approach is a DFS from the root that only descends into children marked as word
      ends, visiting letters in order `a..z`; the first deepest node reached spells the answer.
    starterCode:
      python: |
        import sys
        from typing import List


        def complete_string(words: List[str]) -> str:
            # Return the longest word whose every prefix is in words (smallest on ties), or "None".
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            words = data[1:1 + n]
            print(complete_string(words))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def complete_string(words: List[str]) -> str:
            root = {}
            END = "#"
            for word in words:
                node = root
                for ch in word:
                    node = node.setdefault(ch, {})
                node[END] = True

            best = ""
            for word in words:
                if len(word) < len(best) or (len(word) == len(best) and word >= best):
                    continue
                node = root
                ok = True
                for ch in word:
                    node = node[ch]
                    if END not in node:
                        ok = False
                        break
                if ok:
                    best = word
            return best if best else "None"


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            words = data[1:1 + n]
            print(complete_string(words))


        if __name__ == "__main__":
            main()
