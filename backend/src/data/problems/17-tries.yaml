    referenceSolution:
      python: |
        import sys
        from typing import List


        def maximize_xor(nums: List[int], queries: List[List[int]]) -> List[int]:
            BITS = 30
            zero = [0]
            one = [0]

            def insert(num: int) -> None:
                node = 0
                for b in range(BITS - 1, -1, -1):
                    child = one if (num >> b) & 1 else zero
                    if child[node] == 0:
                        child[node] = len(zero)
                        zero.append(0)
                        one.append(0)
                    node = child[node]

            def best_xor(x: int) -> int:
                node = 0
                result = 0
                for b in range(BITS - 1, -1, -1):
                    bit = (x >> b) & 1
                    want = zero if bit else one
                    if want[node]:
                        result |= 1 << b
                        node = want[node]
                    else:
                        node = (one if bit else zero)[node]
                return result

            values = sorted(nums)
            answers = [-1] * len(queries)
            pointer = 0
            for idx in sorted(range(len(queries)), key=lambda i: queries[i][1]):
                x, limit = queries[idx]
                while pointer < len(values) and values[pointer] <= limit:
                    insert(values[pointer])
                    pointer += 1
                if pointer > 0:
                    answers[idx] = best_xor(x)
            return answers


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, q = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            queries = [[int(data[2 + n + 2 * i]), int(data[3 + n + 2 * i])] for i in range(q)]
            print("\n".join(map(str, maximize_xor(nums, queries))))


        if __name__ == "__main__":
            main()
