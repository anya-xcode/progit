  - sheetId: prob-17-2-4-bit-prerequisites-for-tri
    slug: bit-prerequisites-for-trie-problems
    title: Bit PreRequisites for TRIE Problems
    difficulty: Easy
    topic: Bit Manipulation
    subtopic: Problems
    tags: [bit manipulation, trie, simulation]
    sourceUrl: ""
    statement: |
      The trie problems that follow - maximum XOR of two numbers, maximum XOR with an
      element from an array - store numbers in a trie **bit by bit**, from the most
      significant bit down to the least. Before building one, you need to be fluent in
      reading and editing a single bit of an integer. This exercise drills exactly
      that.

      You start with a non-negative integer `x` and apply `q` operations to it. Bit
      positions are counted from the **least significant** end, so position `0` is the
      last bit of the binary representation, position `1` is the one before it, and so
      on.

      | Operation | Meaning |
      | --- | --- |
      | `get i` | report the bit at position `i` (`0` or `1`) |
      | `set i` | make the bit at position `i` equal to `1` |
      | `clear i` | make the bit at position `i` equal to `0` |
      | `toggle i` | flip the bit at position `i` |
      | `count` | report how many bits of the current value are `1` |
      | `value` | report the current value |

      `set`, `clear` and `toggle` change the number and print nothing; `get`, `count`
      and `value` print one line each. An operation applies to the value as it stands
      after all the previous operations.
    inputFormat: |
      - Line 1: two integers `x` and `q`, the starting value and the number of
        operations.
      - Next `q` lines: one operation each, in one of the forms `get i`, `set i`,
        `clear i`, `toggle i`, `count` or `value`.
    outputFormat: |
      For every `get`, `count` and `value` operation, print its answer on its own
      line, in the order the operations are given.
    constraints:
      - "0 <= x < 2^31"
      - "1 <= q <= 10^5"
      - "0 <= i <= 30"
    examples:
      - input: |
          13 6
          get 0
          get 1
          count
          clear 0
          value
          count
        output: |
          1
          0
          3
          12
          2
        explanation: "13 is 1101 in binary. Position 0 holds 1 and position 1 holds 0, and three bits are set. Clearing position 0 turns 1101 into 1100, which is 12 and has two bits set."
      - input: |
          8 5
          get 2
          set 1
          value
          toggle 3
          value
        output: |
          0
          10
          2
        explanation: "8 is 1000. Position 2 holds 0. Setting position 1 gives 1010 = 10. Position 3 is currently 1, so toggling it clears it and leaves 0010 = 2."
    hints:
      - "`1 << i` is a number whose only set bit is at position i - that single value is the key to all four bit operations."
      - "Reading is `(x >> i) & 1`. Setting is `x | (1 << i)`, flipping is `x ^ (1 << i)`, and clearing needs the inverted mask: `x & ~(1 << i)`."
      - "For `count`, `x & (x - 1)` erases the lowest set bit of x, so repeating it until x becomes 0 counts the set bits in as many steps as there are ones."
    explanation: |
      Every operation here is O(1) with the right mask, so the whole simulation is
      O(q) time and O(1) space beyond the output. What matters is getting the four
      identities right.

      **The mask.** `1 << i` is `2^i`: a number whose only `1` bit sits at position
      `i`. All four edits are built from it.

      - **Read**: `(x >> i) & 1`. Shifting right by `i` moves the wanted bit into
        position 0, and `& 1` discards everything above it. `(x & (1 << i)) != 0`
        works too, but note it yields `2^i`, not `1`, before the comparison.
      - **Set**: `x | (1 << i)`. OR leaves every other bit alone and forces position
        `i` to `1`, whether it was `0` or `1` already.
      - **Clear**: `x & ~(1 << i)`. `~` inverts the mask into a value that is `1`
        everywhere except at position `i`, so AND keeps the rest and zeroes that one
        bit. This is the operation people most often get wrong - `x & (1 << i)` would
        throw away all the *other* bits instead.
      - **Toggle**: `x ^ (1 << i)`. XOR with `1` flips a bit and XOR with `0` leaves
        it unchanged, which is exactly what the mask asks for.

      **Counting set bits.** The straightforward way tests all 31 positions:
      O(31) per query. **Brian Kernighan's trick** is better: `x & (x - 1)` clears the
      lowest set bit, because subtracting 1 flips that bit to `0` and turns everything
      below it into `1`s, which the AND then wipes. Looping until `x` becomes `0`
      takes one step per set bit - at most 31, and usually far fewer.

      **Why the trie problems need this.** Inserting a number into a binary trie walks
      its bits from position 30 down to position 0 and branches on each one, so the
      inner loop is nothing but `(x >> i) & 1` repeated 31 times. Searching for the
      number that maximises a XOR does the same walk and greedily prefers the child
      labelled with the *opposite* bit. If the four identities above are automatic,
      those problems reduce to ordinary trie traversal.

      A word of caution outside Python: `1 << i` is an `int` in C++ and Java, so with
      `i = 31` it overflows a signed 32-bit type - `1L << i` is needed there. Python
      integers are unbounded, so shifting is always safe, but `~x` gives a negative
      number for a positive `x`, and `bin(x)` never shows leading zeros; pad it
      yourself when a fixed width matters.
