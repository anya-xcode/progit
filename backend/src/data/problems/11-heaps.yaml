    title: "Hand of Straights"
    difficulty: Medium
    topic: "Heaps"
    subtopic: "Hard Problems"
    tags: [array, heap, greedy, hashing]
    sourceUrl: "https://leetcode.com/problems/hand-of-straights/"
    statement: |
      You hold a hand of cards, each showing an integer. You want to split the whole hand into
      groups so that:

      - every group has exactly `groupSize` cards, and
      - the cards in each group are **consecutive** integers (for example `5, 6, 7`).

      Every card must belong to exactly one group. Decide whether this is possible.
    inputFormat: |
      - Line 1: two integers `n` (number of cards) and `groupSize`.
      - Line 2: `n` space-separated integers, the card values.
    outputFormat: |
      Print `true` if the hand can be split as described, otherwise `false`.
    constraints:
      - "1 <= n <= 10^4"
      - "0 <= hand[i] <= 10^9"
      - "1 <= groupSize <= n"
    examples:
      - input: |
          8 4
          5 3 4 6 8 7 9 10
        output: |
          true
        explanation: "The groups 3 4 5 6 and 7 8 9 10 use every card."
      - input: |
          6 3
          1 2 4 5 6 7
        output: |
          false
        explanation: "The smallest card 1 must start a group 1 2 3, but there is no 3."
    hints:
      - "If n is not divisible by groupSize the answer is immediately false."
      - "Look at the smallest card still in hand. Which group can it possibly belong to?"
      - "It must start a group. Use a frequency map plus a min-heap (or sorted keys) to always find the current smallest card."
    explanation: |
      **Brute force: sort and remove -- O(n^2) time, O(n) space.** Sort the cards. Repeatedly take
      the smallest remaining card `x` and remove one copy each of `x, x + 1, ..., x + groupSize - 1`
      from the list; fail if any is missing. Removal from a list costs O(n).

      **Optimal: counts + min-heap -- O(n log n) time, O(n) space.** Count each value and put the
      distinct values in a min-heap. While the heap is non-empty, let `x` be its top. For every
      `v` in `x .. x + groupSize - 1`, require `count[v] > 0` and decrement it. When a count
      reaches zero, it must be the heap's current top (otherwise a smaller value would be left
      without a group start), so pop it. Sorting the distinct keys once and walking them in order
      achieves the same bound.
