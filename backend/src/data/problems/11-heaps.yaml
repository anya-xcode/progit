  - sheetId: prob-11-3-1-design-twitter
    slug: design-twitter
    title: "Design Twitter"
    difficulty: Medium
    topic: "Heaps"
    subtopic: "Hard Problems"
    tags: ["design", "heap", "hashing", "merge"]
    sourceUrl: "https://leetcode.com/problems/design-twitter/"
    statement: |
      Design a very small social network. Users are identified by integers and can post messages,
      follow and unfollow each other, and read a news feed.

      Implement the class `Twitter`:

      - `post_tweet(user, tweet)` - user `user` posts the message `tweet`. Every post happens
        strictly later than all previous ones.
      - `follow(follower, followee)` - `follower` starts following `followee`. Following somebody
        twice changes nothing, and following yourself is ignored (you always see your own posts).
      - `unfollow(follower, followee)` - `follower` stops following `followee`. Unfollowing
        somebody you do not follow changes nothing.
      - `get_news_feed(user)` - return the **10 most recent** tweet ids posted either by `user`
        or by somebody `user` follows, ordered from newest to oldest. Return fewer than 10 if
        that is all there is.
    inputFormat: |
      - Line 1: an integer `q`, the number of operations.
      - Next `q` lines: one operation each, written as one of

        - `postTweet user tweet`
        - `follow follower followee`
        - `unfollow follower followee`
        - `getNewsFeed user`
    outputFormat: |
      Print one line for every `getNewsFeed` operation, in operation order: the tweet ids from
      newest to oldest, separated by single spaces. Print the word `empty` when the feed contains
      no tweets at all.
    constraints:
      - "1 <= q <= 2000"
      - "0 <= user id <= 500"
      - "1 <= tweet id <= 10^4, and all tweet ids are distinct"
      - "A feed never shows more than 10 tweets."
    examples:
      - input: |
          8
          postTweet 1 101
          getNewsFeed 1
          follow 2 1
          postTweet 2 201
          getNewsFeed 2
          getNewsFeed 1
          unfollow 2 1
          getNewsFeed 2
        output: |
          101
          201 101
          101
          201
        explanation: "User 1 sees only their own tweet. After user 2 follows user 1 and posts, user 2's feed shows their newer tweet first, then user 1's. User 1 never follows anyone, so their feed is unchanged. After unfollowing, user 2 sees only their own tweet."
      - input: |
          5
          getNewsFeed 7
          follow 7 9
          getNewsFeed 7
          postTweet 9 55
          getNewsFeed 7
        output: |
          empty
          empty
          55
        explanation: "With nothing posted the feed is empty; following a user who has not posted yet keeps it empty. Once user 9 posts, the tweet shows up in user 7's feed."
    hints:
      - "Store each user's own tweets in a list with a global increasing timestamp - within one user the list is already ordered from oldest to newest."
      - "A feed is a merge of a few already-sorted lists. Take only the last 10 tweets of each source and merge them."
      - "A max-heap keyed by timestamp, seeded with the newest tweet of each source and refilled from that source after each pop, produces the 10 newest in O(10 log f) after the seeding."
    explanation: |
      **Brute force - O(T log T) per feed.** Collect every tweet of the user and of all their
      followees, sort by timestamp and take the first 10. Simple, but it re-reads the entire
      history on each call.

      **Per-user lists + k-way merge - O(f + 10 log f) per feed, where `f` is the number of
      sources.** Keep

      - `tweets[user]`: a list of `(timestamp, tweet_id)` appended in posting order, so it is
        already sorted from oldest to newest;
      - `following[user]`: a set of the users they follow, giving O(1) follow/unfollow and O(1)
        membership;
      - a global counter incremented on every post, which orders tweets across users.

      For `get_news_feed(user)` the sources are `{user} | following[user]`. Each source's list is
      sorted, so this is a **k-way merge** where only the first 10 results are needed:

      1. Push the newest tweet of every non-empty source into a max-heap keyed by timestamp,
         together with the index it came from.
      2. Pop the largest timestamp, append its tweet id to the answer, and push that source's
         next-newest tweet (if any).
      3. Stop after 10 pops or when the heap empties.

      Only 10 pops happen, so after seeding the heap the work is `O(10 log f)`. Since at most 10
      tweets per source can ever surface, you may also slice each source to its last 10 tweets
      before merging, which bounds the seeding work as well.

      `post_tweet`, `follow` and `unfollow` are all `O(1)`; memory is `O(total tweets + total
      follow edges)`.

      **Details that bite.** A user always sees their own tweets even though they do not follow
      themselves - add `user` to the source set explicitly, and make `follow(u, u)` a no-op so
      the tweets are not merged twice. In Python, `heapq` is a min-heap, so push negated
      timestamps, and put the timestamp first in the tuple so comparisons never reach a
      non-comparable field.
