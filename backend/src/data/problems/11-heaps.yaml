  - sheetId: prob-11-2-2-kth-smallest-element-in-a
    slug: kth-smallest-element-in-an-array-use-priority-queue
    title: "Kth smallest element in an array [use priority queue]"
    difficulty: Medium
    topic: "Heaps"
    subtopic: "Medium Problems"
    tags: ["array", "heap", "priority-queue", "selection"]
    sourceUrl: "https://www.naukri.com/code360/problems/kth-smallest-element-in-an-array-use-priority-queue"
    statement: |
      Given an array `nums` of `n` integers and an integer `k`, return the value that would sit
      at position `k` if the array were sorted in **non-decreasing** order.

      Duplicates count as separate elements: in `[4, 4, 9]` the 2nd smallest element is `4`.

      Solve it with a priority queue rather than by sorting the whole array - keeping only `k`
      candidates in memory is enough.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print a single integer: the k-th smallest element.
    constraints:
      - "1 <= k <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
    examples:
      - input: |
          6 3
          7 10 4 3 20 15
        output: |
          7
        explanation: "Sorted the array reads 3 4 7 10 15 20, so the 3rd smallest value is 7."
      - input: |
          5 4
          2 2 5 1 2
        output: |
          2
        explanation: "Sorted: 1 2 2 2 5. Duplicates are counted separately, so the 4th smallest is the last 2."
    hints:
      - "Sorting is O(n log n) but tells you far more than you asked for. You only need the boundary between the k smallest values and the rest."
      - "Keep a heap holding exactly the k smallest values seen so far. Which kind of heap lets you discard the *largest* of those k in O(log k)?"
      - "A max-heap of size k: push every element, and pop the largest whenever the heap grows past k. At the end its root is the k-th smallest."
    explanation: |
      **Sort - O(n log n) time, O(1) or O(n) space.** Sort and read index `k - 1`. Perfectly
      correct and hard to beat in practice, but it orders elements you never look at.

      **Max-heap of size k - O(n log k) time, O(k) space.** Maintain the invariant "the heap
      holds the `k` smallest elements seen so far, with the largest of them at the root".

      For each element `x`: push `x`; if the heap now holds `k + 1` elements, pop the root (the
      largest), because it cannot be among the `k` smallest of what has been read. After the
      whole array, the root is the k-th smallest overall.

      A small refinement: once the heap is full, compare `x` with the root first and skip the
      push entirely when `x >= root`. Python's `heapq` is a min-heap, so store the negated values
      (or use `heappushpop` on the negatives) to simulate a max-heap.

      This beats sorting when `k` is much smaller than `n`, and it needs only `O(k)` memory - the
      version that matters when the numbers arrive as a stream that does not fit in memory.

      **Quickselect - O(n) average, O(n^2) worst case, O(1) extra space.** Partition around a
      pivot like quicksort and recurse only into the side that contains position `k - 1`.
      Fastest on average, but its worst case is quadratic unless the pivot is chosen carefully
      (median-of-medians gives a guaranteed O(n)).
