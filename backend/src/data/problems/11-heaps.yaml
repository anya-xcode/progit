  - slug: top-k-frequent-elements
    title: "Top K Frequent Elements"
    difficulty: Medium
    topic: "Heaps"
    subtopic: "Medium Problems"
    tags: [array, heap, hashing, bucket-sort]
    sourceUrl: "https://leetcode.com/problems/top-k-frequent-elements/"
    statement: |
      Given an integer array `nums` and an integer `k`, find the `k` values that occur most often.

      To make the answer unique, rank the distinct values by:
      1. **higher frequency first**, and
      2. among equal frequencies, **smaller value first**.

      Output the first `k` values of this ranking, in ranking order.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers.
    outputFormat: |
      Print the `k` selected values on one line, separated by spaces, in ranking order.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^4 <= nums[i] <= 10^4"
      - "1 <= k <= number of distinct values"
    examples:
      - input: |
          8 2
          4 4 4 1 1 7 7 3
        output: |
          4 1
        explanation: "Frequencies: 4 -> 3, 1 -> 2, 7 -> 2, 3 -> 1. 4 comes first; 1 and 7 tie with frequency 2 and the smaller value 1 wins."
      - input: |
          5 3
          -2 5 5 -2 0
        output: |
          -2 5 0
        explanation: "-2 and 5 both appear twice (-2 is smaller, so it is first), then 0 appears once."
    hints:
      - "Start by counting occurrences with a hash map."
      - "Sorting all distinct values by (-frequency, value) is O(d log d). A heap of size k brings it to O(d log k)."
      - "Frequencies are at most n, so bucket sort by frequency is also possible; just sort each bucket by value."
    explanation: |
      **Brute force: count and sort -- O(n + d log d) time, O(d) space** (d = distinct values).
      Count with a hash map, sort the distinct values by `(-count, value)` and take the first `k`.

      **Better: heap of size k -- O(n + d log k) time, O(d) space.** Keep the `k` best entries in a
      heap keyed so that the *worst* of them (lowest frequency, then largest value) is on top;
      replace it when a better entry arrives. Finally sort the `k` survivors by the ranking.

      **Bucket sort -- O(n + d log d) worst case, typically near O(n).** Place each value in
      `bucket[count]`, walk buckets from high to low frequency, and within a bucket emit values in
      increasing order until `k` values are collected.
