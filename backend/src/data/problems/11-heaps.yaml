  - slug: merge-k-sorted-arrays
    title: "Merge K Sorted Arrays"
    difficulty: Medium
    topic: "Heaps"
    subtopic: "Medium Problems"
    tags: [array, heap, merge]
    sourceUrl: ""
    statement: |
      You are given `k` arrays, each already sorted in non-decreasing order. Some arrays may be
      empty.

      Combine all of their elements into one array sorted in non-decreasing order.
    inputFormat: |
      - Line 1: an integer `k`, the number of arrays.
      - Next `k` lines: the i-th line starts with `m_i`, the length of the i-th array, followed by
        its `m_i` elements in non-decreasing order.
    outputFormat: |
      Print all elements of the merged array on one line, separated by spaces.
    constraints:
      - "1 <= k <= 10^3"
      - "0 <= m_i"
      - "1 <= total number of elements <= 10^5"
      - "-10^9 <= element <= 10^9"
    examples:
      - input: |
          3
          3 1 4 7
          2 2 9
          4 0 4 5 10
        output: |
          0 1 2 4 4 5 7 9 10
        explanation: "Taking the smallest remaining front element each time yields 0 1 2 4 4 5 7 9 10."
      - input: |
          2
          1 -3
          3 -5 -3 8
        output: |
          -5 -3 -3 8
        explanation: "The two -3 values both appear in the output."
    hints:
      - "Concatenating and sorting works, but it ignores that each array is already sorted."
      - "At any moment the next output element is the smallest among the current fronts of the k arrays."
      - "Keep the fronts in a min-heap as (value, array index, element index) so each step costs O(log k)."
    explanation: |
      **Brute force: concatenate and sort -- O(N log N) time, O(N) space** (N = total elements).

      **Better: merge arrays pairwise -- O(N * k) time** when merging one array at a time into the
      result, or **O(N log k)** with divide-and-conquer pairing (merge 1-2, 3-4, ... in rounds).

      **Optimal: min-heap of fronts -- O(N log k) time, O(k) extra space.** Push the first element
      of every non-empty array as `(value, i, j)`. Repeatedly pop the minimum, append it to the
      output, and push `(arrays[i][j + 1], i, j + 1)` if that element exists. The heap never holds
      more than `k` entries.
    starterCode:
      python: |
        import heapq
        import sys
        from typing import List


        def merge_k_sorted(arrays: List[List[int]]) -> List[int]:
            # Return one sorted list containing every element of every array.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            k = int(data[0])
            pos = 1
            arrays = []
            for _ in range(k):
                m = int(data[pos])
                arrays.append([int(x) for x in data[pos + 1:pos + 1 + m]])
                pos += 1 + m
            print(" ".join(map(str, merge_k_sorted(arrays))))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import heapq
        import sys
        from typing import List


        def merge_k_sorted(arrays: List[List[int]]) -> List[int]:
            heap = [(arr[0], i, 0) for i, arr in enumerate(arrays) if arr]
            heapq.heapify(heap)
            result: List[int] = []
            while heap:
                value, i, j = heapq.heappop(heap)
                result.append(value)
                if j + 1 < len(arrays[i]):
                    heapq.heappush(heap, (arrays[i][j + 1], i, j + 1))
            return result


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            k = int(data[0])
            pos = 1
            arrays = []
            for _ in range(k):
                m = int(data[pos])
                arrays.append([int(x) for x in data[pos + 1:pos + 1 + m]])
                pos += 1 + m
            print(" ".join(map(str, merge_k_sorted(arrays))))


        if __name__ == "__main__":
            main()
