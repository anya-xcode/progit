    referenceSolution:
      python: |
        import sys
        import heapq
        from typing import List


        def sort_k_sorted(nums: List[int], k: int) -> List[int]:
            n = len(nums)
            window = nums[:min(k + 1, n)]
            heapq.heapify(window)
            result: List[int] = []
            for i in range(len(window), n):
                result.append(heapq.heapreplace(window, nums[i]))
            while window:
                result.append(heapq.heappop(window))
            return result


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(" ".join(str(value) for value in sort_k_sorted(nums, k)))


        if __name__ == "__main__":
            main()
