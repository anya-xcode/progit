  - slug: check-if-array-represents-min-heap
    title: "Check if an Array Represents a Min-Heap"
    difficulty: Easy
    topic: "Heaps"
    subtopic: "Learning"
    tags: [array, heap]
    sourceUrl: ""
    statement: |
      A binary heap is usually stored in an array: the element at index `i` (0-indexed) has its
      left child at index `2i + 1` and its right child at index `2i + 2`, when those indices exist.

      The array is a valid **min-heap** if every element is less than or equal to each of its
      children. Given an array, decide whether it is a valid min-heap.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers.
    outputFormat: |
      Print `true` if the array is a min-heap, otherwise `false`.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= arr[i] <= 10^9"
    examples:
      - input: |
          6
          1 3 2 7 4 5
        output: |
          true
        explanation: "1 <= 3 and 1 <= 2; 3 <= 7 and 3 <= 4; 2 <= 5. Every parent is at most its children."
      - input: |
          5
          10 15 30 40 12
        output: |
          false
        explanation: "The node 15 (index 1) has children 40 and 12, and 15 > 12, so the heap property fails."
    hints:
      - "Only nodes that have at least one child need to be checked. Which indices are those?"
      - "Indices 0 .. n/2 - 1 are the internal nodes; compare each with its children 2i+1 and 2i+2."
    explanation: |
      **Direct check -- O(n) time, O(1) space.** For every internal node `i` (from `0` to
      `n // 2 - 1`), verify `arr[i] <= arr[2i + 1]` and, if `2i + 2 < n`, `arr[i] <= arr[2i + 2]`.
      Return `false` on the first violation.

      An equivalent view loops over every child `c >= 1` and compares it with its parent
      `(c - 1) // 2`. A recursive version that checks subtrees is also O(n) time but uses O(log n)
      stack space.
    starterCode:
      python: |
        import sys
        from typing import List


        def is_min_heap(arr: List[int]) -> bool:
            # Return True if every element is <= its children at 2i+1 and 2i+2.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            print("true" if is_min_heap(arr) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def is_min_heap(arr: List[int]) -> bool:
            n = len(arr)
            for i in range(n // 2):
                left = 2 * i + 1
                right = left + 1
                if arr[i] > arr[left]:
                    return False
                if right < n and arr[i] > arr[right]:
                    return False
            return True


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            print("true" if is_min_heap(arr) else "false")


        if __name__ == "__main__":
            main()
