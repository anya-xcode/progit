    referenceSolution:
      python: |
        import sys
        from typing import List


        def replace_by_rank(nums: List[int]) -> List[int]:
            order = sorted(set(nums))
            rank = {value: position + 1 for position, value in enumerate(order)}
            return [rank[value] for value in nums]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(value) for value in replace_by_rank(nums)))


        if __name__ == "__main__":
            main()
