    referenceSolution:
      python: |
        import sys
        import heapq
        from typing import List


        def minimum_connect_cost(sticks: List[int]) -> int:
            heap = list(sticks)
            heapq.heapify(heap)
            total = 0
            while len(heap) > 1:
                first = heapq.heappop(heap)
                second = heapq.heappop(heap)
                merged = first + second
                total += merged
                heapq.heappush(heap, merged)
            return total


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            n = int(data[0])
            sticks = [int(x) for x in data[1:1 + n]]
            print(minimum_connect_cost(sticks))


        if __name__ == "__main__":
            main()
