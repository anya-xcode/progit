    referenceSolution:
      python: |
        import sys
        import heapq
        from typing import Dict, List, Set, Tuple


        class Twitter:
            FEED_SIZE = 10

            def __init__(self) -> None:
                self.tweets: Dict[int, List[Tuple[int, int]]] = {}
                self.following: Dict[int, Set[int]] = {}
                self.clock = 0

            def post_tweet(self, user: int, tweet: int) -> None:
                self.clock += 1
                self.tweets.setdefault(user, []).append((self.clock, tweet))

            def follow(self, follower: int, followee: int) -> None:
                if follower != followee:
                    self.following.setdefault(follower, set()).add(followee)

            def unfollow(self, follower: int, followee: int) -> None:
                self.following.setdefault(follower, set()).discard(followee)

            def get_news_feed(self, user: int) -> List[int]:
                sources = set(self.following.get(user, ()))
                sources.add(user)
                heap: List[Tuple[int, int, int, int]] = []
                for source in sources:
                    posts = self.tweets.get(source)
                    if posts:
                        index = len(posts) - 1
                        stamp, tweet = posts[index]
                        heap.append((-stamp, tweet, source, index))
                heapq.heapify(heap)
                feed: List[int] = []
                while heap and len(feed) < self.FEED_SIZE:
                    _, tweet, source, index = heapq.heappop(heap)
                    feed.append(tweet)
                    if index > 0:
                        stamp, older = self.tweets[source][index - 1]
                        heapq.heappush(heap, (-stamp, older, source, index - 1))
                return feed


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            q = int(lines[0].split()[0])
            twitter = Twitter()
            out = []
            for line in lines[1:1 + q]:
                parts = line.split()
                if not parts:
                    continue
                if parts[0] == "postTweet":
                    twitter.post_tweet(int(parts[1]), int(parts[2]))
                elif parts[0] == "follow":
                    twitter.follow(int(parts[1]), int(parts[2]))
                elif parts[0] == "unfollow":
                    twitter.unfollow(int(parts[1]), int(parts[2]))
                elif parts[0] == "getNewsFeed":
                    feed = twitter.get_news_feed(int(parts[1]))
                    out.append(" ".join(str(t) for t in feed) if feed else "empty")
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
