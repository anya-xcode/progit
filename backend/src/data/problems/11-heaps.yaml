  - slug: task-scheduler
    title: "Task Scheduler"
    difficulty: Medium
    topic: "Heaps"
    subtopic: "Hard Problems"
    tags: [greedy, heap, counting]
    sourceUrl: "https://leetcode.com/problems/task-scheduler/"
    statement: |
      A CPU must run a list of tasks, each labelled with an uppercase letter. Running one task takes
      exactly one time unit, and in each unit the CPU either runs one task or stays **idle**.
      Tasks may be run in any order.

      There is a cooldown `n`: after running a task with some label, at least `n` time units must
      pass before another task with the **same** label can run.

      Find the minimum number of time units needed to finish all tasks (idle units included).
    inputFormat: |
      - Line 1: two integers `m` (number of tasks) and `n` (cooldown).
      - Line 2: `m` space-separated uppercase letters, the task labels.
    outputFormat: |
      Print a single integer: the minimum total number of time units.
    constraints:
      - "1 <= m <= 10^4"
      - "0 <= n <= 100"
      - "labels are 'A'-'Z'"
    examples:
      - input: |
          7 2
          A A A A B C D
        output: |
          10
        explanation: "One optimal order is A B C A D idle A idle idle A: A needs 3 gaps of length 2 between its four runs, giving 10 units."
      - input: |
          6 1
          A B C A B C
        output: |
          6
        explanation: "A B C A B C already respects the cooldown, so no idle time is needed."
    hints:
      - "The most frequent task determines the skeleton: its copies must be spread n+1 units apart."
      - "Simulate with a max-heap of remaining counts: in every block of n+1 units run the most frequent available tasks."
      - "With maxCount = highest frequency and ties = number of labels having it, the answer is max(m, (maxCount - 1) * (n + 1) + ties)."
    explanation: |
      **Simulation with a heap -- O(m log 26) time, O(26) space.** Work in rounds of `n + 1` time
      units. In each round pop up to `n + 1` labels with the largest remaining counts from a
      max-heap, run each once, and push back those that still have work. A round costs `n + 1`
      units, except the final round, which costs only the number of tasks run in it.

      **Optimal counting formula -- O(m) time, O(26) space.** Let `f` be the largest frequency and
      `c` the number of labels with frequency `f`. Place the `f` copies of the most frequent labels
      in `f - 1` full frames of length `n + 1` plus a last frame of length `c`; the others fill
      the gaps. This needs `(f - 1) * (n + 1) + c` units. If there are more tasks than slots, no
      idling is ever necessary and the answer is simply `m`. So the answer is
      `max(m, (f - 1) * (n + 1) + c)`.
