    referenceSolution:
      python: |
        import sys
        from typing import List


        def convert_to_max_heap(heap: List[int]) -> List[int]:
            n = len(heap)

            def sift_down(index: int) -> None:
                while True:
                    largest = index
                    left = 2 * index + 1
                    right = left + 1
                    if left < n and heap[left] > heap[largest]:
                        largest = left
                    if right < n and heap[right] > heap[largest]:
                        largest = right
                    if largest == index:
                        return
                    heap[index], heap[largest] = heap[largest], heap[index]
                    index = largest

            for i in range(n // 2 - 1, -1, -1):
                sift_down(i)
            return heap


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            n = int(data[0])
            heap = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(value) for value in convert_to_max_heap(heap)))


        if __name__ == "__main__":
            main()
