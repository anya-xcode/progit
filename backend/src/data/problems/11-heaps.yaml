  - sheetId: prob-11-2-5-replace-elements-by-their
    slug: replace-elements-by-their-rank
    title: "Replace Elements by Their Rank"
    difficulty: Easy
    topic: "Heaps"
    subtopic: "Medium Problems"
    tags: ["array", "sorting", "hashing", "coordinate-compression"]
    sourceUrl: "https://www.naukri.com/code360/problems/replace-elements-by-their-rank"
    statement: |
      The **rank** of a value in an array is `1` plus the number of *distinct* values that are
      strictly smaller than it. So the smallest value has rank `1`, the next distinct value has
      rank `2`, and equal values always share the same rank.

      Given an array `nums` of `n` integers, replace every element by its rank and print the
      resulting array.
    inputFormat: |
      - Line 1: an integer `n`, the length of the array.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print `n` space-separated integers on one line: the rank of `nums[0]`, `nums[1]`, ...,
      `nums[n - 1]`.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
    examples:
      - input: |
          6
          20 15 26 2 98 6
        output: |
          4 3 5 1 6 2
        explanation: "Sorted the distinct values are 2, 6, 15, 20, 26, 98, which get ranks 1 to 6. Substituting gives 4 3 5 1 6 2."
      - input: |
          5
          7 7 3 7 3
        output: |
          2 2 1 2 1
        explanation: "There are only two distinct values: 3 has rank 1 and 7 has rank 2, and every copy of a value gets the same rank."
    hints:
      - "Counting, for each element, how many distinct smaller values exist is O(n^2). Sorting the distinct values gives all the ranks at once."
      - "Build a map from value to rank by walking the sorted distinct values, then do one pass over the original array."
      - "This is exactly coordinate compression: it shrinks arbitrary values to 1..m while preserving their order, which is what Fenwick trees and segment trees need."
    explanation: |
      **Brute force - O(n^2) time.** For each element, scan the array and count how many distinct
      values are strictly smaller. Quadratic, and deduplicating inside the scan makes it worse.

      **Sort the distinct values - O(n log n) time, O(n) space.**

      1. Collect the distinct values and sort them: `order[0] < order[1] < ... < order[m-1]`.
      2. Build a hash map `rank[order[i]] = i + 1`.
      3. Output `rank[nums[i]]` for every position.

      Step 1 costs `O(n log n)`, steps 2 and 3 are `O(n)` on average, so the sort dominates.
      Memory is `O(n)` for the map and the output.

      **With a heap - O(n log n) time as well.** Push all values into a min-heap and pop them in
      increasing order, assigning the next rank whenever the popped value differs from the
      previous one. Same asymptotics as sorting - a heap is simply an incremental sort here - but
      it is the natural formulation if the values arrive one at a time.

      **Sorting index-value pairs.** A variant that avoids the hash map: sort the pairs
      `(value, index)`, walk them in order, and write the current rank into the answer at the
      stored index, incrementing the rank only when the value changes. Same `O(n log n)`, with
      `O(n)` memory and no hashing.

      This operation is worth recognising on sight: reducing values to their ranks (*coordinate
      compression*) is the standard preprocessing step whenever a data structure indexed by value
      - a Fenwick tree, a segment tree, a counting array - has to handle values from a huge
      range.
