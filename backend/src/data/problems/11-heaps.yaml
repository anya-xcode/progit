  - sheetId: prob-11-3-2-minimum-cost-to-connect-s
    slug: minimum-cost-to-connect-sticks
    title: "Minimum Cost to Connect Sticks"
    difficulty: Medium
    topic: "Heaps"
    subtopic: "Hard Problems"
    tags: ["heap", "greedy", "priority-queue"]
    sourceUrl: "https://www.naukri.com/code360/problems/minimum-cost-to-connect-sticks"
    statement: |
      You have `n` sticks whose lengths are given in an array `sticks`. You may repeatedly pick
      any **two** sticks, glue them into a single stick, and pay a cost equal to the **sum of
      their lengths**. The glued stick can be used again in later steps.

      Keep going until a single stick remains. Print the smallest total cost achievable.

      If there is only one stick to begin with, no gluing is needed and the cost is `0`.
    inputFormat: |
      - Line 1: an integer `n`, the number of sticks.
      - Line 2: `n` space-separated integers, the stick lengths.
    outputFormat: |
      Print a single integer: the minimum total cost of combining all sticks into one.
    constraints:
      - "1 <= n <= 10^5"
      - "1 <= sticks[i] <= 10^4"
    examples:
      - input: |
          4
          1 8 3 5
        output: |
          30
        explanation: "Glue 1 and 3 for 4, then 4 and 5 for 9, then 9 and 8 for 17: total 30. Any other order costs more - for instance 8+5=13, 13+3=16, 16+1=17 adds up to 46."
      - input: |
          1
          7
        output: |
          0
        explanation: "A single stick is already the final stick, so nothing is paid."
    hints:
      - "A stick's length is paid again every time the stick it belongs to is glued, so long sticks should take part in as few gluings as possible."
      - "Always combine the two shortest sticks currently available - that keeps the largest lengths out of the early sums."
      - "A min-heap gives you those two shortest sticks in O(log n); push the result back and repeat n - 1 times."
    explanation: |
      **Brute force - factorial.** Trying every order of gluings explores `(n-1)!`-ish
      possibilities. Hopeless past a handful of sticks.

      **Greedy with a min-heap - O(n log n) time, O(n) space.** Repeat `n - 1` times: remove the
      two smallest sticks `a` and `b`, pay `a + b`, and insert the stick `a + b`. With a min-heap
      each round costs `O(log n)`, and building the heap from the input is `O(n)`.

      **Why the two shortest.** Think of the process as building a binary tree whose leaves are
      the original sticks: gluing two sticks makes them children of a new internal node. The cost
      of one gluing is the sum of the leaves below it, so the **total cost equals**

      ```
      sum over leaves of (stick length) * (its depth in the tree)
      ```

      Minimising that is exactly Huffman's problem, and the exchange argument applies: in an
      optimal tree the two deepest leaves are siblings, and swapping any longer stick into that
      position cannot decrease the total, so the two shortest sticks may be assumed to be the
      deepest siblings - which is what merging the two smallest first does. Repeating on the
      reduced multiset keeps the property, so the greedy choice is optimal.

      **A subtlety worth noticing.** Sorting once and then always taking the first two remaining
      elements is *not* correct, because a merged stick can be larger than sticks not yet used
      and must re-enter the ordering. The heap handles that automatically; a two-queue trick
      (one holding the sorted originals, the other the merged sticks in non-decreasing order)
      does the same in `O(n log n)` for the sort plus `O(n)` afterwards.

      With `n` up to `10^5` and lengths up to `10^4` the total stays well inside 64-bit range.
