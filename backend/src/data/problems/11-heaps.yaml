  - sheetId: prob-11-2-3-sort-k-sorted-array
    slug: sort-k-sorted-array
    title: "Sort K sorted array"
    difficulty: Easy
    topic: "Heaps"
    subtopic: "Medium Problems"
    tags: ["array", "heap", "priority-queue", "sorting"]
    sourceUrl: "https://www.naukri.com/code360/problems/sort-k-sorted-array"
    statement: |
      An array is called **k-sorted** (or *nearly sorted*) when every element is at most `k`
      positions away from the place it would occupy in the fully sorted array.

      You are given such an array `nums` of `n` integers together with `k`. Print the array in
      non-decreasing order.

      A general-purpose sort would work, of course - the point is to exploit `k`: because no
      element can travel more than `k` positions, the next value of the sorted output is always
      hiding inside a window of only `k + 1` candidates.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the k-sorted array `nums`.
    outputFormat: |
      Print the `n` values in non-decreasing order on one line, separated by single spaces.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= k < n"
      - "-10^9 <= nums[i] <= 10^9"
      - "The array is guaranteed to be k-sorted."
    examples:
      - input: |
          7 3
          6 5 3 2 8 10 9
        output: |
          2 3 5 6 8 9 10
        explanation: "No element is more than 3 places from its sorted position, so the smallest value must be among the first 4 entries - it is 2. Repeating that reasoning yields 2 3 5 6 8 9 10."
      - input: |
          4 1
          2 1 4 3
        output: |
          1 2 3 4
        explanation: "With k = 1 only neighbours can be out of order, so a window of two candidates is enough: 1 2 3 4."
    hints:
      - "If nums[i] belongs at sorted position p, then |i - p| <= k. So the element that belongs at position 0 must be somewhere in nums[0..k]."
      - "Keep a min-heap of the next k + 1 unprocessed candidates; its root is the next output value."
      - "After popping the root, push the next array element so the window keeps its size. Total cost O(n log k), and O(k) extra memory."
    explanation: |
      **General sort - O(n log n) time.** Correct and one line long, but it ignores the structure
      of the input.

      **Insertion sort - O(n * k) time, O(1) space.** In a k-sorted array each element moves at
      most `k` places during insertion sort, so the usual quadratic bound collapses to `O(n * k)`.
      Excellent for tiny `k`, bad when `k` approaches `n`.

      **Min-heap of size k + 1 - O(n log k) time, O(k) space.** The key fact: the element that
      belongs at sorted position `p` sits at some index in `[p - k, p + k]`. In particular, once
      positions `0..p-1` have been emitted, the value for position `p` must be among the indices
      `p .. p + k` that are still unprocessed - a window of `k + 1` candidates.

      So:

      1. Push the first `k + 1` elements into a min-heap.
      2. Repeatedly pop the root - that is the next value of the sorted output - and push the
         next unread array element, keeping the heap at size `k + 1`.
      3. When the array is exhausted, drain the heap; its elements come out in order.

      Each element is pushed and popped exactly once from a heap of size at most `k + 1`, so the
      running time is `O(n log k)` and the extra memory is `O(k)`, independent of `n`. For `k`
      much smaller than `n` this is a real win over a full sort, and it works even when the array
      arrives as a stream - only `k + 1` values ever need to be held.

      **Correctness.** When the root is popped, every candidate that could legally occupy the
      current output position is inside the heap (the window covers `p .. p + k`), and everything
      already emitted was `<=` all of them, so the popped minimum is the correct next value.
