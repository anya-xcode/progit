    referenceSolution:
      python: |
        import heapq
        import sys
        from typing import List


        def is_n_straight_hand(hand: List[int], group_size: int) -> bool:
            if len(hand) % group_size:
                return False
            count = {}
            for card in hand:
                count[card] = count.get(card, 0) + 1
            heap = list(count)
            heapq.heapify(heap)
            while heap:
                start = heap[0]
                for value in range(start, start + group_size):
                    if count.get(value, 0) == 0:
                        return False
                    count[value] -= 1
                    if count[value] == 0:
                        if value != heap[0]:
                            return False
                        heapq.heappop(heap)
            return True


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, group_size = int(data[0]), int(data[1])
            hand = [int(x) for x in data[2:2 + n]]
            print("true" if is_n_straight_hand(hand, group_size) else "false")


        if __name__ == "__main__":
            main()
