      python: |
        import sys
        import heapq
        from typing import List


        def kth_smallest(nums: List[int], k: int) -> int:
            largest_of_k: List[int] = []  # max-heap simulated with negated values
            for value in nums:
                if len(largest_of_k) < k:
                    heapq.heappush(largest_of_k, -value)
                elif value < -largest_of_k[0]:
                    heapq.heapreplace(largest_of_k, -value)
            return -largest_of_k[0]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(kth_smallest(nums, k))


        if __name__ == "__main__":
            main()
