  - sheetId: prob-11-3-4-maximum-sum-combination
    slug: maximum-sum-combination
    title: "Maximum Sum Combination"
    difficulty: Hard
    topic: "Heaps"
    subtopic: "Hard Problems"
    tags: ["heap", "priority-queue", "sorting", "array"]
    sourceUrl: "https://www.naukri.com/code360/problems/maximum-sum-combination"
    statement: |
      You are given two arrays `a` and `b`, both of length `n`, and an integer `k`.

      Consider all `n * n` sums `a[i] + b[j]` formed by picking one index in each array
      independently (`i` and `j` are unrelated, so both may be the same number). Those `n * n`
      sums form a multiset - equal sums coming from different index pairs are listed separately.

      Print the `k` largest sums of that multiset, in **non-increasing** order.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `a`.
      - Line 3: `n` space-separated integers, the array `b`.
    outputFormat: |
      Print the `k` largest sums on one line, separated by single spaces, from largest to
      smallest.
    constraints:
      - "1 <= n <= 1000"
      - "1 <= k <= min(n * n, 300)"
      - "-10^9 <= a[i], b[i] <= 10^9"
    examples:
      - input: |
          2 3
          3 2
          1 4
        output: |
          7 6 4
        explanation: "The four sums are 3+1=4, 3+4=7, 2+1=3 and 2+4=6. The three largest, in non-increasing order, are 7, 6 and 4."
      - input: |
          2 4
          5 5
          5 5
        output: |
          10 10 10 10
        explanation: "Every pair gives 10, and each index pair is counted separately, so all four largest sums are 10."
    hints:
      - "Generating all n*n sums costs 10^6 here but does not scale; notice that after sorting both arrays descending, the single largest sum must be a[0] + b[0]."
      - "From the pair (i, j) the only candidates that can come next are (i+1, j) and (i, j+1) - a max-heap over such frontier pairs yields the sums in decreasing order."
      - "Keep a visited set of index pairs so the same pair is never pushed twice, and stop after k pops."
    explanation: |
      **Generate and sort - O(n^2 log n) time, O(n^2) space.** Build all `n * n` sums and sort
      them. At `n = 1000` that is a million sums - borderline here and impossible for larger `n`.

      **Sort both arrays, then expand a frontier with a max-heap - O(n log n + k log k) time,
      O(k) space.** Sort `a` and `b` in non-increasing order. Then `a[i] + b[j]` is non-increasing
      in both `i` and `j`, so the pairs form a grid whose values decrease as you move right or
      down. The largest sum is at `(0, 0)`.

      Run a best-first search over that grid:

      1. Push `(a[0] + b[0], 0, 0)` into a max-heap and mark `(0, 0)` as seen.
      2. Pop the largest sum, output it, and push its two neighbours `(i + 1, j)` and
         `(i, j + 1)` if they are inside the grid and not seen yet.
      3. Stop after `k` pops.

      **Why every sum is reachable in the right order.** Any pair `(i, j)` can be reached from
      `(0, 0)` by a path that only moves right or down, and along such a path the sums never
      increase. So when a pair is popped, every pair that could hold a larger sum has already
      been popped - the heap emits the sums in non-increasing order. The `visited` set is
      essential: `(i, j)` has two predecessors, and without it the same pair would be pushed
      twice and printed twice.

      The heap never holds more than `O(k)` entries, so after the `O(n log n)` sort each of the
      `k` steps costs `O(log k)`. Ties are fine: equal sums from different pairs are distinct
      elements of the multiset and are all printed, which is exactly what the statement asks for.
