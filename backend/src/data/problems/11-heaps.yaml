  - sheetId: prob-11-1-4-convert-min-heap-to-max-h
    slug: convert-min-heap-to-max-heap
    title: "Convert Min Heap to Max Heap"
    difficulty: Medium
    topic: "Heaps"
    subtopic: "Learning"
    tags: ["heap", "array", "heapify"]
    sourceUrl: "https://www.naukri.com/code360/problems/convert-min-heap-to-max-heap"
    statement: |
      You are given an array `heap` of `n` integers that is already a valid **min-heap**: read as
      a complete binary tree (node `i` has children `2i + 1` and `2i + 2`), every node is less
      than or equal to its children.

      Rearrange the same values, in place, so that the array becomes a valid **max-heap**: every
      node is greater than or equal to its children.

      Many arrays qualify as a max-heap, so to make the answer unique you must produce exactly
      the array obtained by the standard bottom-up build:

      ```
      for i = n/2 - 1 down to 0:        (integer division)
          sift_down(i)

      sift_down(i):
          loop:
              largest = i
              if 2i+1 < n and heap[2i+1] > heap[largest]: largest = 2i+1
              if 2i+2 < n and heap[2i+2] > heap[largest]: largest = 2i+2
              if largest == i: stop
              swap heap[i] and heap[largest]
              i = largest
      ```

      Note the strict `>` comparisons: when a node ties with a child, no swap happens, and when
      both children are equal and larger, the **left** one is chosen.
    inputFormat: |
      - Line 1: an integer `n`, the size of the heap.
      - Line 2: `n` space-separated integers forming a valid min-heap.
    outputFormat: |
      Print the `n` values of the resulting max-heap on one line, separated by single spaces, in
      array order (index `0` first).
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= heap[i] <= 10^9"
      - "The input is guaranteed to satisfy the min-heap property."
    examples:
      - input: |
          7
          1 3 2 7 4 5 6
        output: |
          7 4 6 3 1 5 2
        explanation: "Sifting down index 2 swaps 2 with its larger child 6; index 1 swaps 3 with 7; index 0 swaps 1 with 7 and then that 1 sinks past 4, giving 7 4 6 3 1 5 2."
      - input: |
          1
          5
        output: |
          5
        explanation: "A single element is both a min-heap and a max-heap, so nothing moves."
    hints:
      - "You do not need to sort anything - a max-heap is much weaker than sorted order."
      - "Only the leaves are already valid max-heaps on their own. The nodes at indices n/2 .. n-1 are exactly the leaves, so start repairing at index n/2 - 1."
      - "Process indices in decreasing order so that when you sift a node down, both of its subtrees are already max-heaps; then the whole build costs O(n), not O(n log n)."
    explanation: |
      **Sort descending - O(n log n) time.** A descending array is always a valid max-heap, but
      it does more work than necessary and it is not the array the statement asks for.

      **Insert into a fresh heap - O(n log n) time, O(n) space.** Push all values into an empty
      max-heap one by one. Also more expensive than needed.

      **Bottom-up heapify in place - O(n) time, O(1) extra space.** The array already stores a
      complete tree, and the min-heap property of the input is irrelevant: any array can be
      turned into a max-heap by the same procedure.

      Every index from `n/2` to `n - 1` is a leaf, so each of them is already a one-node max-heap.
      Walk backwards from `n/2 - 1` to `0`. When you reach index `i`, its two subtrees have
      already been fixed, so only `heap[i]` itself can be out of place; `sift_down(i)` pushes it
      along a single downward path until both of its children are `<=` it, restoring the max-heap
      property of the whole subtree rooted at `i`. When the loop finishes, `i = 0` has been
      repaired, so the entire array is a max-heap.

      **Why it is O(n) and not O(n log n).** A node at height `h` above the leaves costs `O(h)`,
      and a complete tree has about `n / 2^(h+1)` nodes at height `h`. The total is

      ```
      sum over h of (n / 2^(h+1)) * O(h) = O(n * sum h/2^h) = O(2n) = O(n)
      ```

      because the series `sum h / 2^h` converges to 2. Only `O(1)` extra memory is used since all
      swaps happen inside the given array.

      **Determinism.** The strict `>` comparisons in the child selection mean equal values never
      swap and the left child wins a tie among equal larger children, so the procedure produces
      one specific array for each input.
