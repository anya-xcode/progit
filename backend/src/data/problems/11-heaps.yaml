section: heaps
problems:
  - slug: kth-largest-element-in-an-array
    title: "Kth Largest Element in an Array"
    difficulty: Medium
    topic: "Heaps"
    subtopic: "Medium Problems"
    tags: [array, heap, sorting]
    sourceUrl: "https://leetcode.com/problems/kth-largest-element-in-an-array/"
    statement: |
      Given an integer array `nums` and an integer `k`, return the element that would be at
      position `k` if the array were sorted in **non-increasing** order.

      Duplicates count as separate elements: in `[8, 8, 5]` the 2nd largest element is `8`.
      Try to do better than sorting the whole array.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers.
    outputFormat: |
      Print a single integer: the k-th largest element.
    constraints:
      - "1 <= k <= n <= 10^5"
      - "-10^4 <= nums[i] <= 10^4"
    examples:
      - input: |
          5 2
          7 4 9 4 1
        output: |
          7
        explanation: "In non-increasing order the array is 9 7 4 4 1, so the 2nd element is 7."
      - input: |
          6 4
          5 5 8 2 8 3
        output: |
          5
        explanation: "Sorted: 8 8 5 5 3 2. Duplicates are counted, so the 4th largest is 5."
    hints:
      - "Sorting gives the answer in O(n log n). Can you avoid ordering elements you do not care about?"
      - "Keep only the k largest values seen so far. Which data structure lets you discard the smallest of them quickly?"
      - "A min-heap of size k: its top is always the k-th largest among the processed elements."
    explanation: |
      **Brute force: sort -- O(n log n) time, O(1)-O(n) space.** Sort descending and read index
      `k - 1`.

      **Better: min-heap of size k -- O(n log k) time, O(k) space.** Push each element into a
      min-heap; whenever the heap grows beyond `k` elements, pop the smallest. After the scan the
      heap holds the `k` largest values and its root is the answer.

      **Alternative: Quickselect -- O(n) average, O(n^2) worst time, O(1) extra space.** Partition
      around a random pivot and recurse only into the side that contains position `k - 1`.
