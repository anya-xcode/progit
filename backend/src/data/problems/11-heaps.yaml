    subtopic: "Hard Problems"
    tags: [heap, design, data-stream]
    sourceUrl: "https://leetcode.com/problems/find-median-from-data-stream/"
    statement: |
      Design a structure that receives integers one at a time and can report the **median** of
      all integers received so far at any moment.

      The median of a sorted list with an odd number of elements is its middle element; with an
      even number of elements it is the average of the two middle elements.

      Implement the class `MedianFinder` with:
      - `add_num(num)` -- insert `num` into the structure;
      - `find_median()` -- return the current median.

      You will process a sequence of operations:
      - `add x` -- insert the integer `x`;
      - `median` -- report the median of the numbers inserted so far.
    inputFormat: |
      - Line 1: an integer `q`, the number of operations.
      - Next `q` lines: one operation each, either `add x` or `median`.
    outputFormat: |
      For every `median` operation print the median on its own line with **exactly one digit after
      the decimal point** (for example `4.0`, `2.5`, `-0.5`). Medians of integers are always
      exact at one decimal place.
    constraints:
      - "1 <= q <= 5 * 10^4"
      - "-10^5 <= x <= 10^5"
      - "At least one number has been added before every median operation"
    examples:
      - input: |
          5
          add 4
          add 1
          median
          add 9
          median
        output: |
          2.5
          4.0
        explanation: "After adding 4 and 1 the sorted list is [1, 4] with median 2.5. After adding 9 it is [1, 4, 9] with median 4.0."
      - input: |
          6
          add -3
          median
          add -6
          median
          add 10
          median
        output: |
          -3.0
          -4.5
          -3.0
        explanation: "[-3] -> -3.0; [-6, -3] -> -4.5; [-6, -3, 10] -> -3.0."
    hints:
      - "Keeping a sorted list makes the median O(1) but insertion O(n)."
      - "Split the numbers into a lower half and an upper half. You only ever need the largest of the lower half and the smallest of the upper half."
      - "Use a max-heap for the lower half and a min-heap for the upper half, and rebalance so their sizes differ by at most one."
    explanation: |
      **Brute force: sort on every query -- O(n log n) per median, O(n) space.** Store numbers in a
      list and sort when a median is requested.

      **Better: sorted insertion -- O(n) per add, O(1) per median.** Keep the list sorted using
      binary search to find the position; shifting elements still costs O(n).

      **Optimal: two heaps -- O(log n) per add, O(1) per median, O(n) space.** Maintain a max-heap
      `low` (store negated values in Python) holding the smaller half and a min-heap `high` holding
      the larger half, with `len(low) == len(high)` or `len(low) == len(high) + 1`. To add, push
      into `low`, move `low`'s maximum into `high`, and if `high` became larger, move its minimum
      back. The median is `low`'s top when the total is odd, else the average of both tops.

      Printing: the sum of the two middle values is an integer `s`, so the median `s / 2` has at
      most one decimal digit; format it with one decimal place.
