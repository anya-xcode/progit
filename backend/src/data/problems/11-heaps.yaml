  - sheetId: prob-11-3-3-kth-largest-element-in-a-
    slug: kth-largest-element-in-a-stream-of-running-integers
    title: "Kth largest element in a stream of running integers"
    difficulty: Hard
    topic: "Heaps"
    subtopic: "Hard Problems"
    tags: ["heap", "priority-queue", "design", "stream"]
    sourceUrl: "https://leetcode.com/problems/kth-largest-element-in-a-stream/"
    statement: |
      Numbers arrive one at a time and you must always be able to name the **k-th largest** value
      seen so far. Duplicates count as separate values, so in the multiset `{9, 9, 4}` the 2nd
      largest is `9`.

      Implement the class `KthLargest`:

      - `KthLargest(k, initial)` - start with the values in `initial` already seen.
      - `add(value)` - record `value` and return the k-th largest value among **everything** seen
        so far, or `-1` when fewer than `k` values have been seen.

      You may not keep re-sorting the whole history: each `add` should cost `O(log k)`.
    inputFormat: |
      - Line 1: three integers `k`, `n` and `q` - the rank to report, the number of starting
        values, and the number of `add` operations.
      - Line 2: `n` space-separated integers, the starting values (an empty line when `n = 0`).
      - Next `q` lines: one operation each, always of the form `add value`.
    outputFormat: |
      Print one line per `add`: the k-th largest value seen so far, or `-1` when fewer than `k`
      values have been seen.
    constraints:
      - "1 <= k <= 10^4"
      - "0 <= n <= 10^4"
      - "1 <= q <= 10^4"
      - "-10^9 <= value <= 10^9"
    examples:
      - input: |
          3 4 5
          4 5 8 2
          add 3
          add 5
          add 10
          add 9
          add 4
        output: |
          4
          5
          5
          8
          8
        explanation: "Starting values sorted descending are 8 5 4 2, so the 3rd largest is 4. Adding 3 leaves it at 4; adding 5 makes the order 8 5 5 4 3 2 with 5 in third place; adding 10 keeps 5; adding 9 pushes it to 8; adding 4 leaves 8."
      - input: |
          2 0 3

          add 7
          add 7
          add 3
        output: |
          -1
          7
          7
        explanation: "After the first value only one number has been seen, so the 2nd largest does not exist and -1 is printed. The second 7 makes the multiset {7, 7}, whose 2nd largest is 7, and adding 3 does not change that."
    hints:
      - "You never need the values that are smaller than the k-th largest - they can only matter if they are deleted, which never happens."
      - "Keep a min-heap holding exactly the k largest values seen so far. Its root is the answer."
      - "On each add: push, then pop while the heap holds more than k elements. Before the heap is full, report -1."
    explanation: |
      **Re-sort every time - O(m log m) per add.** Keeping all `m` values and sorting on each call
      is far too slow when both the history and the number of queries are large.

      **Min-heap of size k - O(log k) per add, O(k) space.** Maintain the invariant: *the heap
      contains exactly the `k` largest values seen so far, and its root is the smallest of them* -
      which is precisely the k-th largest overall.

      `add(value)`:

      1. Push `value`.
      2. If the heap now holds more than `k` elements, pop the root - that element is the
         `(k+1)`-th largest and can never become the k-th largest again, because values are only
         ever added, never removed.
      3. If the heap holds fewer than `k` elements, fewer than `k` values have been seen, so
         report `-1`; otherwise report the root.

      Seeding from `initial` is the same loop, or `heapify` on the whole list followed by popping
      down to `k`, which is `O(n)`.

      Each operation does `O(1)` heap pushes/pops on a heap of size at most `k + 1`, so the cost
      is `O(log k)` per add and `O(k)` memory - independent of how long the stream runs, which is
      the property that matters for streaming data.

      **Why discarding is safe.** The k-th largest of a growing multiset can only move upwards.
      An element that has already fallen out of the top `k` has `k` values above it, and that
      count never decreases, so it can never return to rank `k` or better.
    starterCode:
      python: |
        import sys
        from typing import List


        class KthLargest:
            def __init__(self, k: int, initial: List[int]) -> None:
                # Keep only the k largest values seen so far.
                pass

            def add(self, value: int) -> int:
                # The k-th largest value so far, or -1 if fewer than k values are known.
                pass


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            k, n, q = (int(x) for x in lines[0].split())
            initial = [int(x) for x in lines[1].split()][:n]
            stream = KthLargest(k, initial)
            out = []
            for line in lines[2:2 + q]:
                parts = line.split()
                if not parts:
                    continue
                if parts[0] == "add":
                    out.append(str(stream.add(int(parts[1]))))
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        import heapq
        from typing import List


        class KthLargest:
            def __init__(self, k: int, initial: List[int]) -> None:
                self.k = k
                self.heap: List[int] = list(initial)
                heapq.heapify(self.heap)
                while len(self.heap) > k:
                    heapq.heappop(self.heap)

            def add(self, value: int) -> int:
                if len(self.heap) < self.k:
                    heapq.heappush(self.heap, value)
                elif value > self.heap[0]:
                    heapq.heapreplace(self.heap, value)
                if len(self.heap) < self.k:
                    return -1
                return self.heap[0]


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            k, n, q = (int(x) for x in lines[0].split())
            initial = [int(x) for x in lines[1].split()][:n]
            stream = KthLargest(k, initial)
            out = []
            for line in lines[2:2 + q]:
                parts = line.split()
                if not parts:
                    continue
                if parts[0] == "add":
                    out.append(str(stream.add(int(parts[1]))))
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
