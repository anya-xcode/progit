    referenceSolution:
      python: |
        import sys
        from typing import List


        class MinHeap:
            def __init__(self) -> None:
                self.data: List[int] = []

            def _sift_up(self, index: int) -> None:
                while index > 0:
                    parent = (index - 1) // 2
                    if self.data[parent] <= self.data[index]:
                        break
                    self.data[parent], self.data[index] = self.data[index], self.data[parent]
                    index = parent

            def _sift_down(self, index: int) -> None:
                n = len(self.data)
                while True:
                    smallest = index
                    left = 2 * index + 1
                    right = left + 1
                    if left < n and self.data[left] < self.data[smallest]:
                        smallest = left
                    if right < n and self.data[right] < self.data[smallest]:
                        smallest = right
                    if smallest == index:
                        return
                    self.data[index], self.data[smallest] = self.data[smallest], self.data[index]
                    index = smallest

            def insert(self, x: int) -> None:
                self.data.append(x)
                self._sift_up(len(self.data) - 1)

            def get_min(self) -> int:
                if not self.data:
                    return -1
                return self.data[0]

            def extract_min(self) -> int:
                if not self.data:
                    return -1
                smallest = self.data[0]
                last = self.data.pop()
                if self.data:
                    self.data[0] = last
                    self._sift_down(0)
                return smallest

            def size(self) -> int:
                return len(self.data)


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            q = int(lines[0].split()[0])
            heap = MinHeap()
            out = []
            for line in lines[1:1 + q]:
                parts = line.split()
                if not parts:
                    continue
                if parts[0] == "insert":
                    heap.insert(int(parts[1]))
                elif parts[0] == "getMin":
                    out.append(str(heap.get_min()))
                elif parts[0] == "extractMin":
                    out.append(str(heap.extract_min()))
                elif parts[0] == "size":
                    out.append(str(heap.size()))
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
