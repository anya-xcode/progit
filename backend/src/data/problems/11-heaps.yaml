    referenceSolution:
      python: |
        import sys
        import heapq
        from typing import List, Tuple


        def max_sum_combinations(a: List[int], b: List[int], k: int) -> List[int]:
            first = sorted(a, reverse=True)
            second = sorted(b, reverse=True)
            n = len(first)
            heap: List[Tuple[int, int, int]] = [(-(first[0] + second[0]), 0, 0)]
            seen = {(0, 0)}
            result: List[int] = []
            while heap and len(result) < k:
                negated, i, j = heapq.heappop(heap)
                result.append(-negated)
                if i + 1 < n and (i + 1, j) not in seen:
                    seen.add((i + 1, j))
                    heapq.heappush(heap, (-(first[i + 1] + second[j]), i + 1, j))
                if j + 1 < n and (i, j + 1) not in seen:
                    seen.add((i, j + 1))
                    heapq.heappush(heap, (-(first[i] + second[j + 1]), i, j + 1))
            return result


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            n, k = int(data[0]), int(data[1])
            a = [int(x) for x in data[2:2 + n]]
            b = [int(x) for x in data[2 + n:2 + 2 * n]]
            print(" ".join(str(value) for value in max_sum_combinations(a, b, k)))


        if __name__ == "__main__":
            main()
