  - sheetId: prob-11-1-1-heaps-theory-video
    slug: heaps-theory-video
    title: "Heaps (Theory Video)"
    difficulty: Easy
    type: reference
    topic: "Heaps"
    subtopic: "Learning"
    tags: ["heap", "priority-queue", "theory"]
    sourceUrl: "https://takeuforward.org/data-structure/introduction-to-priority-queues-using-binary-heaps"
    statement: |
      A **heap** is the data structure you reach for when you repeatedly need *the smallest* (or
      *the largest*) item of a changing collection, and nothing else. Sorting would give you the
      full order, which is more than you need and costs more than you should pay.

      ## The shape

      A binary heap is a **complete binary tree**: every level is full except possibly the last,
      which fills from the left. That shape lets the tree live inside a plain array with no
      pointers at all - for the node stored at index `i` (0-based):

      - left child: `2i + 1`
      - right child: `2i + 2`
      - parent: `(i - 1) // 2`

      and a heap of `n` elements occupies exactly `array[0 .. n-1]`. Because the tree is
      complete, its height is always `floor(log2 n)`.

      ## The order

      A **min-heap** keeps the *heap property*: every node is `<=` both of its children. A
      **max-heap** keeps the mirror rule, `>=`. Note what this does **not** say: siblings are
      unordered, and a node deep in the left subtree may be smaller than a node high in the
      right subtree. The only guarantee is that the overall minimum (or maximum) sits at the
      root, `array[0]`.

      ## The two repair moves

      Every heap operation is one of two walks along a single root-to-leaf path, so each costs
      `O(log n)`:

      - **sift up** (used by insert): put the new element at the end of the array, then swap it
        with its parent while it violates the order.
      - **sift down** (used by extract): move the last element into the root, then repeatedly
        swap it with its smaller child (min-heap) until it is in place.

      ## Costs worth memorising

      | Operation | Cost |
      | --- | --- |
      | peek the minimum | `O(1)` |
      | insert | `O(log n)` |
      | extract the minimum | `O(log n)` |
      | build a heap from `n` items | `O(n)`, not `O(n log n)` |
      | delete or change an arbitrary key | `O(log n)` *if* you know its index |
      | search for an arbitrary value | `O(n)` |

      The `O(n)` build is the surprising one: sifting down from index `n//2 - 1` back to `0`
      works, and the sum of the heights is bounded by `n`, because most nodes are near the
      bottom and barely move.

      ## In Python

      `heapq` gives you a **min-heap over a plain list**: `heappush`, `heappop`, `heap[0]`,
      `heapify` (the `O(n)` build) and `heapreplace`/`heappushpop` for a pop-and-push in one
      pass. There is no max-heap, so the usual tricks are to push `-x` for integers, or to push
      tuples `(key, tiebreaker, payload)` and negate the key. The tiebreaker matters: if two keys
      are equal Python will compare the next tuple element, which must not be an object without
      an ordering.
    explanation: |
      ## Where heaps show up in this step

      - **k-th largest / k-th smallest.** Keep a heap of size `k` of the *opposite* type: for
        the k-th largest, a min-heap holding the `k` largest values seen so far, whose root is
        the answer. `O(n log k)` time and `O(k)` space, beating a full sort when `k` is small.
      - **Merging sorted sequences** (k sorted lists, a k-sorted array, a running stream). Push
        one candidate per source and repeatedly pop the smallest, pushing that source's next
        item.
      - **Repeated "combine the two cheapest"** (connecting sticks, Huffman coding). The greedy
        choice needs exactly the two minima, again and again - the heap's specialty.
      - **Two heaps facing each other** (running median, maximum sum combinations): a max-heap
        over the lower half and a min-heap over the upper half keeps the boundary between them
        accessible in `O(1)`.

      ## Traps

      - A heap is **not sorted**. Printing the backing array is not printing the elements in
        order, and the second-smallest element is not `array[1]` in general - it is
        `min(array[1], array[2])`.
      - **Comparator direction** is the single most common bug: for the k-th *largest* you keep
        a *min*-heap, and vice versa. Write down what the root should mean before you code.
      - With a heap of capacity `k`, always `push` and then `pop` only if the size exceeds `k`
        (or use `heappushpop`) - popping first can throw away the element you just inserted.
      - `heapify` on an existing list is `O(n)`; pushing the same `n` items one by one is
        `O(n log n)`. When you have all the data up front, heapify.
  - sheetId: prob-11-1-2-implement-min-heap
    slug: implement-min-heap
    title: "Implement Min Heap"
    difficulty: Medium
    topic: "Heaps"
    subtopic: "Learning"
    tags: ["heap", "priority-queue", "design"]
    sourceUrl: "https://www.naukri.com/code360/problems/implement-min-heap"
    statement: |
      Build a **binary min-heap** from scratch, on top of a plain array, without using any
      ready-made priority-queue type.

      A min-heap stores a complete binary tree in an array: the children of the node at index
      `i` live at `2i + 1` and `2i + 2`, its parent at `(i - 1) // 2`, and every node is less
      than or equal to both of its children. The smallest element is therefore always at index
      `0`.

      Implement the class `MinHeap`:

      - `insert(x)` - add `x` to the heap, in **O(log n)**.
      - `get_min()` - return the smallest element without removing it, in **O(1)**; return `-1`
        if the heap is empty.
      - `extract_min()` - remove the smallest element and return it, in **O(log n)**; return `-1`
        if the heap is empty.
      - `size()` - return how many elements the heap holds.

      Because every stored value is non-negative, the sentinel `-1` can never be confused with a
      real element.
    inputFormat: |
      - Line 1: an integer `q`, the number of operations.
      - Next `q` lines: one operation each, written as one of

        - `insert x`
        - `getMin`
        - `extractMin`
        - `size`
    outputFormat: |
      Print one line for every operation that returns a value, in the order the operations are
      performed:

      - `getMin` and `extractMin` print the smallest element, or `-1` when the heap is empty.
      - `size` prints an integer.

      `insert` prints nothing.
    constraints:
      - "1 <= q <= 2000"
      - "0 <= x <= 10^9"
      - "Every operation name is exactly one of the names listed above."
    examples:
      - input: |
          8
          insert 5
          insert 2
          insert 9
          getMin
          extractMin
          getMin
          size
          extractMin
        output: |
          2
          2
          5
          2
          5
        explanation: "After the three inserts the heap holds 2, 5 and 9, so the minimum is 2. Removing it leaves 5 as the new minimum with two elements remaining; the last extract takes that 5."
      - input: |
          6
          getMin
          extractMin
          insert 0
          insert 0
          extractMin
          size
        output: |
          -1
          -1
          0
          1
        explanation: "An empty heap answers -1 for both queries. Two equal values are two separate elements: one is removed and one remains, so size prints 1 - and note the stored 0 is printed as 0, never as -1."
    hints:
      - "Store the tree in a list. A node at index i has children at 2i+1 and 2i+2 and parent at (i-1)//2 - no pointers are needed."
      - "insert: append at the end, then swap the new element with its parent while it is smaller (sift up). That is one walk up the tree, O(log n)."
      - "extract_min: take index 0 as the answer, move the last element into index 0, shrink the list, then repeatedly swap it with its smaller child while it is bigger (sift down)."
    explanation: |
      **Sorted list - O(n) per insert.** Keeping the elements sorted makes `get_min` trivial but
      each `insert` has to shift elements, so `q` operations cost O(q * n).

      **Unsorted list - O(n) per extract.** Appending is O(1) but finding and removing the
      minimum scans everything.

      **Binary heap - O(log n) insert and extract, O(1) get_min, O(n) space.** Keep the complete
      binary tree in an array `data`, where the heap property holds: `data[i] <= data[2i+1]` and
      `data[i] <= data[2i+2]` whenever those children exist. The tree is complete, so its height
      is `floor(log2 n)`.

      *insert(x)*: append `x` at the end (position `n`), which keeps the shape complete but may
      break the order along the path to the root. **Sift up**: while the element has a parent
      that is strictly greater, swap them. Only that one root-to-node path can be violated, so
      at most `log n` swaps.

      *extract_min()*: the answer is `data[0]`. To keep the tree complete, move the **last**
      element into index `0` and drop the last slot. Now only the root may violate the order.
      **Sift down**: repeatedly find the smaller of the node's two children; if that child is
      smaller than the node, swap and continue from the child's index, otherwise stop. Again at
      most `log n` swaps.

      *get_min()* reads `data[0]`; *size()* is the list length.

      Both repair moves follow a single path of length `O(log n)` and do O(1) work per level, so
      a sequence of `q` operations costs O(q log n) with O(n) memory. Note that the array is
      **not sorted** at any point - the only ordering the heap promises is the parent/child one,
      which is exactly what makes the operations cheap.
