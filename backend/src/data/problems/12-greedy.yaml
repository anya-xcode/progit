        import sys
        from typing import List


        def job_sequencing(deadlines: List[int], profits: List[int]) -> List[int]:
            # Return [number_of_jobs_done, maximum_total_profit].
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            deadlines = [int(data[1 + 2 * i]) for i in range(n)]
            profits = [int(data[2 + 2 * i]) for i in range(n)]
            count, total = job_sequencing(deadlines, profits)
            print(count, total)


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def job_sequencing(deadlines: List[int], profits: List[int]) -> List[int]:
            n = len(deadlines)
            parent = list(range(n + 1))

            def find(slot: int) -> int:
                root = slot
                while parent[root] != root:
                    root = parent[root]
                while parent[slot] != root:
                    parent[slot], slot = root, parent[slot]
                return root

            order = sorted(range(n), key=lambda i: -profits[i])
            count = total = 0
            for i in order:
                slot = find(min(deadlines[i], n))
                if slot > 0:
                    count += 1
                    total += profits[i]
                    parent[slot] = slot - 1
            return [count, total]


