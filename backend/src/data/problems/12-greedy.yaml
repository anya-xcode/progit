  - slug: jump-game
    title: "Jump Game"
    difficulty: Easy
    topic: "Greedy"
    subtopic: "Medium Problems"
    tags: [array, greedy]
    sourceUrl: "https://leetcode.com/problems/jump-game/"
    statement: |
      You stand on index `0` of an array `nums` of non-negative integers. From index `i` you may
      jump forward to any index from `i + 1` up to `i + nums[i]` (a value of `0` means you cannot
      move from there).

      Decide whether the last index can be reached.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated non-negative integers.
    outputFormat: |
      Print `true` if the last index is reachable, otherwise `false`.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= nums[i] <= 10^5"
    examples:
      - input: |
          5
          3 0 0 1 2
        output: |
          true
        explanation: "Jump from index 0 straight to index 3, then to index 4."
      - input: |
          6
          1 2 0 1 0 3
        output: |
          false
        explanation: "Indices 0..4 are reachable, but index 4 holds 0 and nothing reachable jumps past it."
    hints:
      - "A DP over 'is index i reachable' is O(n^2). Do you need the full set of reachable indices?"
      - "The reachable indices always form a prefix 0..farthest."
      - "Scan left to right, extending farthest = max(farthest, i + nums[i]); fail if you reach an i beyond farthest."
    explanation: |
      **Brute force: recursion / DP -- O(n^2) time, O(n) space.** Mark index 0 reachable and, for
      each reachable index, mark every index it can jump to.

      **Optimal greedy -- O(n) time, O(1) space.** Because you can land on any index up to your
      maximum jump, the set of reachable indices is a prefix. Keep `farthest`, the largest index
      reachable so far. For each `i` in order: if `i > farthest` the scan is stuck, return false;
      otherwise update `farthest = max(farthest, i + nums[i])`. If the loop finishes (or `farthest
      >= n - 1`), return true.
    starterCode:
      python: |
        import sys
        from typing import List


        def can_jump(nums: List[int]) -> bool:
            # Return True if the last index can be reached from index 0.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print("true" if can_jump(nums) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def can_jump(nums: List[int]) -> bool:
            farthest = 0
            for i, step in enumerate(nums):
                if i > farthest:
                    return False
                farthest = max(farthest, i + step)
                if farthest >= len(nums) - 1:
                    return True
            return True


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print("true" if can_jump(nums) else "false")


        if __name__ == "__main__":
            main()
