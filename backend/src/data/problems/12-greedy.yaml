    referenceSolution:
      python: |
        import sys
        from typing import List


        def find_platform(arr: List[int], dep: List[int]) -> int:
            arrivals = sorted(arr)
            departures = sorted(dep)
            n = len(arrivals)
            i = j = 0
            platforms = best = 0
            while i < n:
                if arrivals[i] <= departures[j]:
                    platforms += 1
                    best = max(best, platforms)
                    i += 1
                else:
                    platforms -= 1
                    j += 1
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            dep = [int(x) for x in data[1 + n:1 + 2 * n]]
            print(find_platform(arr, dep))


        if __name__ == "__main__":
            main()
