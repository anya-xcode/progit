    referenceSolution:
      python: |
        import sys
        from collections import OrderedDict
        from typing import List, Tuple


        def simulate_lru(capacity: int, pages: List[int]) -> Tuple[int, List[int]]:
            memory = OrderedDict()
            faults = 0
            for page in pages:
                if page in memory:
                    memory.move_to_end(page)
                else:
                    faults += 1
                    if len(memory) == capacity:
                        memory.popitem(last=False)
                    memory[page] = None
            return faults, list(memory.keys())


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            capacity, n = int(data[0]), int(data[1])
            pages = [int(x) for x in data[2:2 + n]]
            faults, memory = simulate_lru(capacity, pages)
            print(faults)
            print(" ".join(str(page) for page in memory) if memory else "empty")


        if __name__ == "__main__":
            main()
