  - sheetId: prob-12-2-8-program-for-least-recentl
    slug: program-for-least-recently-used-lru-page-replacement-algorithm
    title: "Program for Least Recently Used (LRU) Page Replacement Algorithm"
    difficulty: Medium
    topic: "Greedy Algorithms"
    subtopic: "Medium/Hard"
    tags: ["greedy", "simulation", "hashing", "cache"]
    sourceUrl: "https://www.naukri.com/code360/problems/program-for-least-recently-used-lru-page-replacement-algorithm"
    statement: |
      An operating system keeps at most `capacity` pages in memory. A program then requests a
      sequence of `n` pages, one after another.

      For each request:

      - if the page is already in memory it is a **hit**, and the page becomes the most recently
        used one;
      - otherwise it is a **page fault**: the page is loaded into memory, and if memory was
        already full the **least recently used** page is thrown out first. The newly loaded page
        is then the most recently used one.

      Memory starts empty. Report how many page faults occur, and which pages are left in memory
      at the end.
    inputFormat: |
      - Line 1: two integers `capacity` and `n`.
      - Line 2: `n` space-separated integers, the requested page numbers.
    outputFormat: |
      Print two lines:

      - Line 1: the number of page faults.
      - Line 2: the pages still in memory, ordered from **least recently used to most recently
        used**, separated by single spaces; print `empty` if memory holds nothing.
    constraints:
      - "1 <= capacity <= 1000"
      - "1 <= n <= 10^5"
      - "0 <= page number <= 10^9"
    examples:
      - input: |
          3 8
          7 0 1 2 0 3 0 4
        output: |
          6
          3 0 4
        explanation: "The first three requests fault into empty frames. 2 evicts 7 (least recently used), 0 is a hit, 3 evicts 1, 0 is a hit again, and 4 evicts 2. That is 6 faults, leaving 3, 0 and 4 with 3 the least recently used."
      - input: |
          2 4
          5 5 5 5
        output: |
          1
          5
        explanation: "The first request faults; the remaining three find the page already in memory, so there is a single fault and memory holds only page 5."
    hints:
      - "You need two things fast: 'is this page in memory?' and 'which page was used longest ago?'."
      - "A hash set answers the first in O(1); for the second, keep the pages in a list ordered by recency and move a page to the most-recent end whenever it is touched."
      - "Moving an element inside a Python list costs O(capacity). A hash map to nodes of a doubly linked list (or collections.OrderedDict with move_to_end) makes every request O(1)."
    explanation: |
      **Scan for the victim - O(n * capacity) time.** Keep the pages in an array together with a
      "last used" timestamp; on a fault scan all frames for the smallest timestamp. Easy to write
      and fine when `capacity` is small, but each request costs `O(capacity)`.

      **Recency list - O(n * capacity) time as well.** Keep a list ordered from least to most
      recently used: a hit removes the page and re-appends it, a fault appends and pops the front
      when full. Conceptually the clearest version, but the removal from the middle is linear.

      **Hash map + doubly linked list - O(n) time, O(capacity) space.** Keep the pages in a doubly
      linked list ordered by recency, least recently used just after a `head` sentinel and most
      recently used just before a `tail` sentinel, plus a map `page -> node`.

      - **Hit**: look the node up, unlink it and re-insert it before `tail`. Both are O(1) because
        a doubly linked node knows its neighbours.
      - **Fault**: if the map is full, remove the node after `head` and delete its page from the
        map; then create a node, insert it before `tail`, store it in the map and increment the
        fault counter.

      Every request does a constant number of hash lookups and pointer updates, so the whole
      simulation is `O(n)` time and `O(capacity)` memory. In Python, `collections.OrderedDict`
      provides exactly this behaviour through `move_to_end` and `popitem(last=False)`, and
      iterating it yields the pages in least-to-most-recently-used order, which is what the
      second output line asks for.

      **Notes.** The first `capacity` distinct pages always fault (compulsory misses), so the
      answer is at least the number of distinct pages, and at most `n`. LRU is one of several
      replacement policies: FIFO evicts by arrival instead of by use, and the optimal policy
      (Belady's) would evict the page whose *next* use is furthest in the future - impossible
      online, which is precisely why the greedy "least recently used" heuristic is used instead.
    starterCode:
      python: |
