    hints:
      - "Removing the fewest intervals is the same as keeping the most pairwise non-overlapping intervals."
      - "Which interval would you keep first to leave the most space for the rest?"
      - "Sort by end; keep an interval whenever its start is at least the end of the last kept interval."
    explanation: |
      **Brute force -- O(2^n * n).** Try every subset to keep and check it.

      **Better: DP -- O(n^2) time, O(n) space.** Sort by start; `best[i]` = largest compatible set
      ending with interval `i`, built from any earlier `j` with `end[j] <= start[i]`. Answer
      `n - max(best)`.

      **Optimal greedy -- O(n log n) time, O(1) extra space.** Sort intervals by end. Keep
      `last_end = -infinity` and a counter `kept`. For each interval, if `start >= last_end`, keep it
      and set `last_end = end`; otherwise it must be removed. The answer is `n - kept`. Keeping the
      interval that ends earliest leaves the maximum room for later ones (classic activity selection).
