  - sheetId: prob-12-1-2-fractional-knapsack
    slug: fractional-knapsack
    title: "Fractional Knapsack"
    difficulty: Medium
    topic: "Greedy Algorithms"
    subtopic: "Easy Problems"
    tags: ["greedy", "sorting", "knapsack"]
    sourceUrl: "https://www.geeksforgeeks.org/problems/fractional-knapsack-1587115620/1"
    statement: |
      You have a bag that can carry a total weight of `capacity`, and `n` items; item `i` has
      value `value[i]` and weight `weight[i]`.

      Unlike the 0/1 knapsack, items here can be **cut**: you may take any fraction `f` with
      `0 <= f <= 1` of an item, which adds `f * weight[i]` to the load and `f * value[i]` to the
      value.

      Maximise the total value you carry without exceeding `capacity`.
    inputFormat: |
      - Line 1: two integers `n` and `capacity`.
      - Next `n` lines: two integers each, `value[i]` and `weight[i]`.
    outputFormat: |
      Print the maximum total value with **exactly two digits after the decimal point**, rounding
      half up (for example `240.00` or `240.50`).
    constraints:
      - "1 <= n <= 10^5"
      - "1 <= capacity <= 10^9"
      - "1 <= value[i] <= 10^4"
      - "1 <= weight[i] <= 10^4"
    examples:
      - input: |
          3 50
          60 10
          100 20
          120 30
        output: |
          240.00
        explanation: "The value per unit of weight is 6, 5 and 4. Take all of the first item (10 units, value 60), all of the second (20 units, value 100) and 20 of the remaining 30 units of the third, adding 2/3 * 120 = 80. The total is 240.00."
      - input: |
          3 6
          10 2
          30 5
          20 10
        output: |
          35.00
        explanation: "Per unit of weight the items are worth 5, 6 and 2. Take the whole second item (5 units, value 30), which leaves room for 1 more unit; the best remaining density is the first item, so take half of it for 5. The total is 35.00 and the third item is never touched."
    hints:
      - "Because items may be cut, what matters about an item is not its value but its value per unit of weight."
      - "Sort the items by value/weight descending and fill the bag greedily; only the last item you touch may need to be cut."
      - "Compare ratios without floating point by cross-multiplying: item A beats item B when value[A] * weight[B] > value[B] * weight[A]."
    explanation: |
      **Brute force - exponential.** Enumerate which items to take whole and which single item to
      cut. Correct but hopeless for large `n`; useful only for checking a small case by hand.

      **Greedy by value density - O(n log n) time, O(n) space.** Sort the items by
      `value[i] / weight[i]` in decreasing order. Walk them in that order:

      - if the whole item fits in the remaining capacity, take it and reduce the capacity;
      - otherwise take the fraction that exactly fills the bag, adding
        `value[i] * remaining / weight[i]`, and stop.

      The sort dominates, so the algorithm is `O(n log n)` with `O(n)` extra memory (or `O(1)` if
      sorted in place).

      **Why greedy is optimal here.** Suppose an optimal solution takes a smaller fraction of a
      denser item `i` than the greedy one does, while taking some of a less dense item `j`. Move
      a tiny amount of weight `d` from `j` to `i`: the load is unchanged and the value changes by
      `d * (value[i]/weight[i] - value[j]/weight[j]) >= 0`. Repeating this exchange turns the
      optimal solution into the greedy one without ever decreasing the value, so greedy is
      optimal. This argument depends on being allowed to take fractions - in the **0/1 knapsack**
      the exchange is impossible and greedy fails, which is why that version needs dynamic
      programming.

      **Practical notes.** Compare densities by cross-multiplication (`v1 * w2` against
      `v2 * w1`) rather than dividing, so the ordering is exact. Only one item is ever cut, and
      if the capacity is at least the total weight, everything is taken and no cut happens at
      all. The answer is printed to two decimals, rounded half up.
    starterCode:
      python: |
