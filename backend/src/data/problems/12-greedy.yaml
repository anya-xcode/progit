  - slug: candy
    title: "Candy"
    difficulty: Hard
    topic: "Greedy"
    subtopic: "Hard Problems"
    tags: [array, greedy]
    sourceUrl: "https://leetcode.com/problems/candy/"
    statement: |
      `n` children stand in a line and child `i` has a rating `ratings[i]`. You hand out candies
      so that:

      - every child gets **at least one** candy, and
      - a child with a **strictly higher** rating than an adjacent child gets **more** candies than
        that neighbour.

      Children with equal ratings have no constraint between them. Find the minimum total number of
      candies.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the ratings.
    outputFormat: |
      Print a single integer: the minimum number of candies.
    constraints:
      - "1 <= n <= 2 * 10^4"
      - "0 <= ratings[i] <= 2 * 10^4"
    examples:
      - input: |
          5
          1 3 4 5 2
        output: |
          11
        explanation: "Candies 1 2 3 4 1: the ratings rise to 5 and then drop, so the total is 11."
      - input: |
          4
          2 2 2 2
        output: |
          4
        explanation: "Equal neighbours impose no constraint, so everyone gets one candy."
    hints:
      - "Handle the two directions separately: first only the left-neighbour rule, then only the right-neighbour rule."
      - "Left pass: if ratings[i] > ratings[i-1], give left[i] = left[i-1] + 1. Right pass likewise from the end."
      - "Each child needs max(left[i], right[i]) candies. Can you do it in O(1) space by counting rising and falling slopes?"
    explanation: |
      **Brute force: repeated relaxation -- O(n^2) time, O(n) space.** Start everyone at 1 and keep
      scanning; whenever a child violates the rule against a neighbour, raise it to neighbour + 1.
      Stop when a full pass changes nothing.

      **Better: two passes -- O(n) time, O(n) space.** `left[i]` is 1 plus `left[i-1]` when the
      rating rises from the left, else 1. `right[i]` is computed symmetrically from the right. The
      answer is the sum of `max(left[i], right[i])`.

      **Optimal: slope counting -- O(n) time, O(1) space.** Walk the array tracking the length
      of the current increasing run (`up`) and decreasing run (`down`) and the height of the peak.
      Equal neighbours reset everything and add 1. On a rise, add `up + 1`. On a fall, add `down`
      (every child in the falling run gets one more), plus one extra if `down` has reached the peak
      height, since the peak must then grow too.
    starterCode:
      python: |
