  - slug: valid-parenthesis-string
    title: "Valid Parenthesis String"
    difficulty: Hard
    topic: "Greedy"
    subtopic: "Medium Problems"
    tags: [string, greedy, dynamic-programming]
    sourceUrl: "https://leetcode.com/problems/valid-parenthesis-string/"
    statement: |
      You are given a string made of the characters `(`, `)` and `*`. Each `*` is a wildcard that
      you may replace by `(`, by `)`, or by nothing (delete it). Each `*` is replaced independently.

      Decide whether some choice of replacements turns the string into a **balanced** parenthesis
      sequence: every `(` has a matching `)` after it, and no prefix has more `)` than `(`.
    inputFormat: |
      - Line 1: the string `s`.
    outputFormat: |
      Print `true` if the string can be made balanced, otherwise `false`.
    constraints:
      - "1 <= |s| <= 10^4"
      - "s contains only '(', ')' and '*'"
    examples:
      - input: |
          *(()*
        output: |
          true
        explanation: "Delete the first * and turn the last one into ')': \"(())\" is balanced."
      - input: |
          (*)(
        output: |
          false
        explanation: "The final '(' has nothing after it that could close it."
    hints:
      - "Without wildcards you would track a single counter of open brackets. With wildcards the counter can take a range of values."
      - "Track lo and hi: the minimum and maximum possible number of unmatched '(' after each prefix."
      - "If hi ever drops below 0 the string is invalid; clamp lo at 0; at the end the answer is lo == 0."
    explanation: |
      **Brute force -- O(3^k * n) time** (k = number of stars). Try every replacement for every
      `*` and check balance.

      **Better: DP over open counts -- O(n^2) time, O(n) space.** Maintain the set of possible
      unmatched-open counts after each prefix: `(` shifts every count up, `)` shifts down (dropping
      negatives), `*` produces all three options. The string is valid iff `0` is possible at the end.

      **Optimal greedy range -- O(n) time, O(1) space.** The set of possible counts is always a
      contiguous range `[lo, hi]`. For `(`: `lo += 1, hi += 1`. For `)`: `lo -= 1, hi -= 1`. For
      `*`: `lo -= 1, hi += 1`. If `hi < 0`, even treating every star as `(` fails, so return false.
      Clamp `lo = max(lo, 0)` because a negative count is never a legal state. Answer `lo == 0`.
    starterCode:
      python: |
        import sys


        def check_valid_string(s: str) -> bool:
            # Return True if the stars can be chosen so the string is balanced.
            pass


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print("true" if check_valid_string(s) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def check_valid_string(s: str) -> bool:
            lo = hi = 0
            for ch in s:
                if ch == "(":
                    lo += 1
                    hi += 1
                elif ch == ")":
                    lo -= 1
                    hi -= 1
                else:
                    lo -= 1
                    hi += 1
                if hi < 0:
                    return False
                lo = max(lo, 0)
            return lo == 0


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print("true" if check_valid_string(s) else "false")


        if __name__ == "__main__":
            main()
