  - sheetId: prob-12-2-10-merge-intervals
    slug: merge-intervals
    title: "Merge Intervals"
    difficulty: Medium
    topic: "Greedy Algorithms"
    subtopic: "Medium/Hard"
    tags: ["greedy", "sorting", "intervals"]
    sourceUrl: "https://leetcode.com/problems/merge-intervals/"
    statement: |
      You are given `n` closed intervals, the `i`-th one written as `start[i] end[i]` with
      `start[i] <= end[i]`. They come in no particular order and may overlap.

      Two intervals **overlap** when they share at least one point - touching at an endpoint
      counts, so `[1, 4]` and `[4, 7]` overlap and become `[1, 7]`, while `[1, 3]` and `[4, 7]`
      stay separate.

      Replace every group of intervals that overlap, directly or through a chain of other
      intervals, by the single interval that covers exactly their union, and print the resulting
      non-overlapping intervals.
    inputFormat: |
      - Line 1: an integer `n`, the number of intervals.
      - Next `n` lines: two integers each, `start[i]` and `end[i]`.
    outputFormat: |
      Print the merged intervals, one per line as `start end`, sorted by increasing start (their
      starts are all different, so this order is unique).
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= start[i] <= end[i] <= 10^9"
    examples:
      - input: |
          4
          1 3
          8 10
          2 6
          15 18
        output: |
          1 6
          8 10
          15 18
        explanation: "[1,3] and [2,6] share the points 2 and 3, so they become [1,6]. [8,10] and [15,18] touch nothing else and survive unchanged."
      - input: |
          2
          1 4
          4 5
        output: |
          1 5
        explanation: "The intervals share the single point 4, which counts as overlapping, so they merge into [1,5]."
    hints:
      - "In the given order you cannot tell whether a later interval will bridge two earlier ones. What ordering removes that problem?"
      - "Sort by start. Then an interval can only overlap the group you are currently building, never an earlier finished one."
      - "Sweep once: if the next start is <= the current end, extend the current end to the maximum of the two; otherwise close the current interval and start a new one."
    explanation: |
      **Brute force - O(n^2) or worse.** Compare every pair, union the overlapping ones (for
      example with a disjoint-set structure) and take the minimum start and maximum end of each
      component. Correct, but quadratic - and a naive "merge any overlapping pair, repeat"
      version can be worse still.

      **Sort by start, then sweep - O(n log n) time, O(n) space.** Sort the intervals by start
      (ties can be broken arbitrarily). Keep a "current" interval, initially the first one, and
      walk through the rest:

      - if `start[i] <= current_end`, the new interval starts before the current one finishes, so
        they overlap: set `current_end = max(current_end, end[i])` (the new interval may be
        completely swallowed, which is why the maximum is needed);
      - otherwise nothing that comes later can reach back to the current interval, so output it
        and make interval `i` the new current one.

      Output the last current interval when the loop ends.

      **Why one pass after sorting is enough.** After sorting, all starts to the right are `>=` the
      current start. If `start[i] > current_end` then every later interval also starts after
      `current_end`, so the current group is finished for good - the greedy decision to close it
      is safe. Conversely, while `start[i] <= current_end` the intervals genuinely share points
      and must be merged. Chains such as `[1,5], [4,8], [7,9]` are handled automatically because
      `current_end` keeps growing.

      The sort costs `O(n log n)` and the sweep `O(n)`, with `O(n)` space for the output (`O(1)`
      extra if the merge is written in place). The merged intervals come out already sorted by
      start, and since they are disjoint no two of them can share a start.
    starterCode:
      python: |
        import sys
        from typing import List, Tuple


        def merge_intervals(intervals: List[Tuple[int, int]]) -> List[Tuple[int, int]]:
            # Merge overlapping intervals; return them sorted by start.
            pass


        # --- Input/output handling ---
