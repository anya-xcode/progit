        from typing import List


        def candy(ratings: List[int]) -> int:
            # Return the minimum number of candies satisfying the neighbour rules.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            ratings = [int(x) for x in data[1:1 + n]]
            print(candy(ratings))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def candy(ratings: List[int]) -> int:
            n = len(ratings)
            total = 1
            up = down = peak = 0
            for i in range(1, n):
                if ratings[i] > ratings[i - 1]:
                    up += 1
                    peak = up
                    down = 0
                    total += up + 1
                elif ratings[i] == ratings[i - 1]:
                    up = down = peak = 0
                    total += 1
                else:
                    up = 0
                    down += 1
                    total += down + (0 if peak >= down else 1)
            return total


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            ratings = [int(x) for x in data[1:1 + n]]
            print(candy(ratings))


        if __name__ == "__main__":
            main()
