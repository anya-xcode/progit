    referenceSolution:
      python: |
        import sys
        from typing import List, Tuple


        def fractional_knapsack(items: List[Tuple[int, int]], capacity: int) -> float:
            order = sorted(items, key=lambda item: item[0] / item[1], reverse=True)
            remaining = capacity
            total = 0.0
            for value, weight in order:
                if remaining <= 0:
                    break
                if weight <= remaining:
                    total += value
                    remaining -= weight
                else:
                    total += value * remaining / weight
                    remaining = 0
            return total


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            n, capacity = int(data[0]), int(data[1])
            items = [(int(data[2 + 2 * i]), int(data[3 + 2 * i])) for i in range(n)]
            print("%.2f" % fractional_knapsack(items, capacity))


        if __name__ == "__main__":
            main()
