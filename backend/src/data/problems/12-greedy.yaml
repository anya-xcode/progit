  - slug: n-meetings-in-one-room
    title: "N Meetings in One Room"
    difficulty: Medium
    topic: "Greedy"
    subtopic: "Easy Problems"
    tags: [array, greedy, sorting, intervals]
    sourceUrl: ""
    statement: |
      A single meeting room is available and `n` meetings have been requested. Meeting `i` begins
      at `start[i]` and finishes at `end[i]`.

      Only one meeting can use the room at a time. Moreover, a meeting may only begin **strictly
      after** the previous meeting in the room has finished: if one meeting ends at time `5`, the
      next one must start at time `6` or later.

      What is the maximum number of meetings that can be held in the room?
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the start times.
      - Line 3: `n` space-separated integers, the end times.
    outputFormat: |
      Print a single integer: the maximum number of meetings.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= start[i] < end[i] <= 10^9"
    examples:
      - input: |
          5
          1 2 4 6 5
          3 4 5 8 7
        output: |
          3
        explanation: "Choose (1,3), (4,5) and (6,8). Taking (5,7) after (4,5) is not allowed because it starts exactly when (4,5) ends."
      - input: |
          4
          1 3 5 7
          3 5 7 9
        output: |
          2
        explanation: "Consecutive meetings touch at their endpoints, so only every other one fits: (1,3) and (5,7)."
    hints:
      - "Which meeting should occupy the room first to leave the most room for the others?"
      - "Pick the meeting that finishes earliest, then repeatedly pick the earliest-finishing meeting that starts after the last chosen end."
    explanation: |
      **Brute force: try all subsets -- O(2^n * n) time.** Check every subset for conflicts.

      **Better: DP over sorted meetings -- O(n^2) time, O(n) space.** Sort by start; `best[i]` is the
      largest chain ending with meeting `i`, built from any earlier meeting that ends before it starts.

      **Optimal greedy -- O(n log n) time, O(n) space.** Sort meetings by end time. Keep
      `last_end = -infinity`; for each meeting in that order, if `start > last_end`, hold it and set
      `last_end = end`. Choosing the earliest finishing compatible meeting never hurts: any optimal
      schedule can swap its first meeting for this one without creating a conflict.
    starterCode:
      python: |
        import sys
        from typing import List


        def max_meetings(start: List[int], end: List[int]) -> int:
            # Return the maximum number of non-conflicting meetings (next start > previous end).
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            start = [int(x) for x in data[1:1 + n]]
            end = [int(x) for x in data[1 + n:1 + 2 * n]]
            print(max_meetings(start, end))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def max_meetings(start: List[int], end: List[int]) -> int:
            order = sorted(range(len(start)), key=lambda i: end[i])
            count = 0
            last_end = -1
            for i in order:
                if start[i] > last_end:
                    count += 1
                    last_end = end[i]
            return count


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            start = [int(x) for x in data[1:1 + n]]
            end = [int(x) for x in data[1 + n:1 + 2 * n]]
            print(max_meetings(start, end))


        if __name__ == "__main__":
            main()
