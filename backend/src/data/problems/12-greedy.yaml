  - slug: job-sequencing
    title: "Job Sequencing"
    difficulty: Medium
    topic: "Greedy"
    subtopic: "Medium Problems"
    tags: [array, greedy, sorting, disjoint-set]
    sourceUrl: ""
    statement: |
      You have `n` jobs. Job `i` has a deadline `deadline[i]` and earns `profit[i]` if it is
      completed on time. Every job takes exactly **one unit of time**, time starts at `0`, and only
      one job can be done per unit. A job with deadline `d` is on time if it occupies one of the
      time slots `1, 2, ..., d`.

      Choose a set of jobs to complete on time so that the total profit is **maximum**. Report how
      many jobs are done and the total profit.

      Because all profits are positive, every maximum-profit schedule completes the same number of
      jobs, so the count is well defined.
    inputFormat: |
      - Line 1: an integer `n`.
      - Next `n` lines: two integers `deadline` and `profit` for each job.
    outputFormat: |
      Print two integers separated by a space: the number of jobs done and the maximum total profit.
    constraints:
      - "1 <= n <= 10^5"
      - "1 <= deadline[i] <= n"
      - "1 <= profit[i] <= 500"
    examples:
      - input: |
          5
          3 35
          1 30
          2 25
          1 40
          3 10
        output: |
          3 100
        explanation: "Do the profit-40 job in slot 1, the profit-25 job in slot 2 and the profit-35 job in slot 3: 3 jobs, 100 profit. The profit-30 job also needs slot 1, which is taken."
      - input: |
          3
          1 5
          1 8
          1 3
        output: |
          1 8
        explanation: "All deadlines are 1, so only one job fits; pick the one worth 8."
    hints:
      - "Consider jobs from the most profitable to the least profitable."
      - "Schedule each job as late as possible (in the latest free slot not after its deadline) so earlier slots stay free for tighter deadlines."
      - "Finding the latest free slot can be sped up with a disjoint-set structure where each slot points to the next free slot on its left."
    explanation: |
      **Brute force -- O(2^n * n log n).** Try every subset; a subset is feasible iff, after sorting
      it by deadline, the `k`-th job has deadline `>= k`.

      **Greedy with slot scanning -- O(n log n + n * D) time, O(D) space** (D = max deadline). Sort
      jobs by profit descending. For each job, scan slots from `deadline` down to `1` and place it in
      the first free slot found; skip the job if none is free. Count placed jobs and sum profits.

      **Optimal: greedy + disjoint set -- O(n log n) time, O(n) space.** Keep `parent[s]` = the
      latest free slot `<= s` (slot `0` means none). For a job with deadline `d`, find
      `s = find(min(d, n))`; if `s > 0`, take the job and union `s` into `s - 1`. Path compression
      makes each lookup nearly O(1).

      Correctness follows from the matroid structure of feasible job sets: taking the most profitable
      job that keeps the set feasible is always safe.
    starterCode:
