  - sheetId: prob-12-2-7-shortest-job-first
    slug: shortest-job-first
    title: "Shortest Job First"
    difficulty: Medium
    topic: "Greedy Algorithms"
    subtopic: "Medium/Hard"
    tags: ["greedy", "sorting", "scheduling"]
    sourceUrl: "https://www.naukri.com/code360/problems/shortest-job-first"
    statement: |
      `n` processes are all sitting in the ready queue at time `0`. Process `i` needs
      `burst[i]` units of uninterrupted CPU time.

      The CPU runs one process at a time and, once started, a process runs to completion
      (non-preemptive scheduling). The **waiting time** of a process is how long it sits in the
      queue before it starts running - so the process that runs first waits `0`, the second waits
      as long as the first one ran, and so on.

      Under the **Shortest Job First** policy the CPU always picks the waiting process with the
      smallest burst time. Compute the **average waiting time** under that policy and print it
      **rounded down** to an integer (that is, the total waiting time divided by `n`, using
      integer division).
    inputFormat: |
      - Line 1: an integer `n`, the number of processes.
      - Line 2: `n` space-separated integers, the burst times.
    outputFormat: |
      Print a single integer: the floor of the average waiting time.
    constraints:
      - "1 <= n <= 10^5"
      - "1 <= burst[i] <= 10^5"
    examples:
      - input: |
          5
          4 3 7 1 2
        output: |
          4
        explanation: "Run order 1, 2, 3, 4, 7 gives waiting times 0, 1, 3, 6 and 10, a total of 20. Divided by 5 processes that is exactly 4."
      - input: |
          3
          5 5 5
        output: |
          5
        explanation: "Every order is the same: the waiting times are 0, 5 and 10, total 15, and 15 / 3 = 5."
    hints:
      - "Write down the total waiting time as a formula: if the run order is b1, b2, ..., bn then the total is (n-1)*b1 + (n-2)*b2 + ... + 1*b(n-1)."
      - "Each burst time is multiplied by how many processes still wait behind it, so the smallest bursts should carry the largest multipliers."
      - "Sort ascending and accumulate a running clock; the answer is the sum of the prefix sums, divided by n."
    explanation: |
      **Simulate naively - O(n^2) time.** Repeatedly scan the remaining processes for the smallest
      burst, run it, and add the current clock to the waiting total. Correct, but quadratic.

      **Sort once - O(n log n) time, O(1) extra space.** Suppose the CPU runs the processes in the
      order `b1, b2, ..., bn`. The k-th process starts at `b1 + ... + b(k-1)`, so

      ```
      total waiting time = 0 + b1 + (b1 + b2) + ... + (b1 + ... + b(n-1))
                         = (n-1)*b1 + (n-2)*b2 + ... + 1*b(n-1) + 0*bn
      ```

      Every burst time is weighted by the number of processes that still have to wait behind it,
      and those weights are fixed: `n-1, n-2, ..., 1, 0`. Pairing the largest weights with the
      smallest values minimises the sum - that is the rearrangement inequality, and the exchange
      argument is direct: if some `b(i) > b(i+1)` appear in that order, swapping them changes the
      total by `b(i+1) - b(i) < 0`, an improvement. So a sorted-ascending order is optimal, which
      is exactly what Shortest Job First produces.

      The implementation is then a single sweep: sort ascending, keep a running `clock`, add
      `clock` to the waiting total before advancing `clock` by the current burst. Sorting
      dominates at `O(n log n)`; everything else is `O(n)` time and `O(1)` space.

      **Ties and rounding.** Equal burst times may be run in any order without changing the total,
      so the answer is well defined. The total can reach about `10^5 * 10^5 * 10^5 / 2`, so use
      64-bit arithmetic (Python integers are unbounded), and divide with integer division at the
      very end - dividing earlier would lose precision.
