  - slug: minimum-platforms
    title: "Minimum Platforms"
    difficulty: Medium
    topic: "Greedy"
    subtopic: "Medium Problems"
    tags: [array, greedy, sorting, two-pointers]
    sourceUrl: ""
    statement: |
      A station receives `n` trains in a day. Train `i` arrives at time `arr[i]` and departs at
      time `dep[i]` (times are written as `HHMM` integers, e.g. `930` means 09:30). A train
      occupies a platform for the whole closed interval `[arr[i], dep[i]]`.

      Two trains cannot share a platform at the same moment. In particular, if one train arrives at
      exactly the same time another departs, they need **different** platforms.

      Find the minimum number of platforms needed so that no train waits.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the arrival times.
      - Line 3: `n` space-separated integers, the departure times.
    outputFormat: |
      Print a single integer: the minimum number of platforms.
    constraints:
      - "1 <= n <= 5 * 10^4"
      - "0 <= arr[i] <= dep[i] <= 2359"
      - "times are valid HHMM values"
    examples:
      - input: |
          4
          1000 1015 1030 1200
          1030 1045 1100 1230
        output: |
          3
        explanation: "At 10:30 the first train is still present (it leaves at 10:30), the second is present and the third arrives, so 3 platforms are needed."
      - input: |
          3
          800 900 1000
          850 950 1050
        output: |
          1
        explanation: "No two trains are at the station at the same time, so one platform suffices."
    hints:
      - "The answer is the largest number of trains present at the same moment."
      - "It is enough to check the moments when some train arrives."
      - "Sort arrivals and departures separately and sweep through both with two pointers. On a tie, process the arrival first."
    explanation: |
      **Brute force -- O(n^2) time, O(1) space.** For every arrival time `x`, count trains with
      `arr[j] <= x <= dep[j]`; the maximum count is the answer (the peak always occurs at some
      arrival).

      **Optimal sweep -- O(n log n) time, O(1) extra space** (after sorting copies). Sort `arr` and
      `dep` independently. Use pointers `i` (arrivals) and `j` (departures) and a counter
      `platforms`. While `i < n`: if `arr[i] <= dep[j]`, a train arrives before (or exactly when)
      the earliest pending departure, so `platforms += 1`, `i += 1`, and update the maximum;
      otherwise a train leaves: `platforms -= 1`, `j += 1`. Using `<=` implements the rule that
      equal times need separate platforms.
