  - slug: lemonade-change
    title: "Lemonade Change"
    difficulty: Easy
    topic: "Greedy"
    subtopic: "Easy Problems"
    tags: [array, greedy, simulation]
    sourceUrl: "https://leetcode.com/problems/lemonade-change/"
    statement: |
      You run a lemonade stand where each drink costs **5** coins. Customers arrive in a fixed
      order, buy exactly one drink each and pay with a single bill of value `5`, `10` or `20`.

      You start with no money at all, and you can only give change using bills received from earlier
      customers. Decide whether you can give every customer the correct change.
    inputFormat: |
      - Line 1: an integer `n`, the number of customers.
      - Line 2: `n` space-separated integers, the bills in arrival order.
    outputFormat: |
      Print `true` if every customer can receive correct change, otherwise `false`.
    constraints:
      - "1 <= n <= 10^5"
      - "bills[i] is 5, 10 or 20"
    examples:
      - input: |
          5
          5 5 5 10 20
        output: |
          true
        explanation: "After three 5s, the 10 gets one 5 back; the 20 gets a 10 and a 5 back. Everyone is served."
      - input: |
          5
          5 5 10 10 20
        output: |
          false
        explanation: "The two 10s consume both 5s, so the customer with 20 needs 15 in change but only 10s remain."
    hints:
      - "Bills of 20 are never useful as change, so only track how many 5s and 10s you hold."
      - "For a 20 you can return 10 + 5 or 5 + 5 + 5. Which choice keeps you more flexible for later customers?"
      - "Fives are the more versatile bill, so prefer giving a 10 when you have one."
    explanation: |
      **Brute force: explore every change choice -- exponential time (O(n^3) states with
      memoisation).** For a 20 try both ways of paying 15 and search recursively.

      **Optimal greedy simulation -- O(n) time, O(1) space.** Keep counters `fives` and `tens`.
      - Bill 5: `fives += 1`.
      - Bill 10: need a 5; if none, fail; otherwise `fives -= 1`, `tens += 1`.
      - Bill 20: if `tens > 0` and `fives > 0`, use one of each; else if `fives >= 3`, use three
        fives; otherwise fail.

      Giving a 10 whenever possible is safe because a 5 can do everything a 10 can (in pairs) and
      also pay for a 10 bill, while a 10 cannot help with a 10 bill.
    starterCode:
      python: |
        import sys
        from typing import List


        def lemonade_change(bills: List[int]) -> bool:
            # Return True if every customer can receive exact change.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            bills = [int(x) for x in data[1:1 + n]]
            print("true" if lemonade_change(bills) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def lemonade_change(bills: List[int]) -> bool:
            fives = tens = 0
            for bill in bills:
                if bill == 5:
                    fives += 1
                elif bill == 10:
                    if fives == 0:
                        return False
                    fives -= 1
                    tens += 1
                else:
                    if tens > 0 and fives > 0:
                        tens -= 1
                        fives -= 1
                    elif fives >= 3:
                        fives -= 3
                    else:
                        return False
            return True


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            bills = [int(x) for x in data[1:1 + n]]
            print("true" if lemonade_change(bills) else "false")


        if __name__ == "__main__":
            main()
