    sourceUrl: "https://leetcode.com/problems/non-overlapping-intervals/"
    statement: |
      You are given `n` intervals `[start, end]` with `start < end`.

      Two intervals **overlap** if they share more than a single endpoint; intervals that only
      touch, such as `[1, 3]` and `[3, 6]`, do **not** overlap.

      Remove the minimum number of intervals so that no two of the remaining intervals overlap, and
      report that number.
    inputFormat: |
      - Line 1: an integer `n`.
      - Next `n` lines: two integers `start end` for each interval.
    outputFormat: |
      Print a single integer: the minimum number of intervals to remove.
    constraints:
      - "1 <= n <= 10^5"
      - "-5 * 10^4 <= start < end <= 5 * 10^4"
    examples:
      - input: |
          5
          1 5
          2 3
          4 6
          6 8
          3 4
