problems:
  - slug: assign-cookies
    title: "Assign Cookies"
    difficulty: Easy
    topic: "Greedy"
    subtopic: "Easy Problems"
    tags: [array, greedy, sorting, two-pointers]
    sourceUrl: "https://leetcode.com/problems/assign-cookies/"
    statement: |
      Each child `i` has a greed factor `g[i]`: the smallest cookie size that will make them happy.
      Each cookie `j` has a size `s[j]`.

      Every child can receive **at most one** cookie and every cookie can be given to at most one
      child. Child `i` is content if it receives a cookie with `s[j] >= g[i]`. Maximise the number
      of content children.
    inputFormat: |
      - Line 1: two integers `n` (children) and `m` (cookies).
      - Line 2: `n` space-separated integers, the greed factors.
      - Line 3: `m` space-separated integers, the cookie sizes.
    outputFormat: |
      Print a single integer: the maximum number of content children.
    constraints:
      - "1 <= n, m <= 3 * 10^4"
      - "1 <= g[i], s[j] <= 2^31 - 1"
    examples:
      - input: |
          4 3
          3 1 5 2
          2 1 4
        output: |
          3
        explanation: "Give cookie 1 to the child with greed 1, cookie 2 to greed 2 and cookie 4 to greed 3. The child with greed 5 cannot be satisfied."
      - input: |
          2 3
          10 9
          1 2 3
        output: |
          0
        explanation: "Every cookie is smaller than every greed factor."
    hints:
      - "Should a big cookie ever go to a child who would be happy with a small one?"
      - "Sort both arrays. Try to satisfy the least greedy child with the smallest cookie that is large enough."
    explanation: |
      **Brute force: maximum bipartite matching -- O(n * m * min(n, m)) time.** Connect child `i`
      to cookie `j` when `s[j] >= g[i]` and find a maximum matching. Correct but unnecessary.

      **Optimal: sort + two pointers -- O(n log n + m log m) time, O(1) extra space.** Sort greed
      factors and cookie sizes. Walk through cookies from smallest to largest with a pointer `i` on
      the children: if the current cookie satisfies child `i`, assign it and advance `i`; otherwise
      the cookie is too small for every remaining child, so skip it. The answer is `i`.

      Exchange argument: in any optimal assignment you can swap cookies so that the least greedy
      satisfied children receive the smallest adequate cookies without reducing the count.
    starterCode:
      python: |
        import sys
        from typing import List


        def find_content_children(greed: List[int], sizes: List[int]) -> int:
            # Return the maximum number of children that can get a large-enough cookie.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            greed = [int(x) for x in data[2:2 + n]]
            sizes = [int(x) for x in data[2 + n:2 + n + m]]
            print(find_content_children(greed, sizes))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def find_content_children(greed: List[int], sizes: List[int]) -> int:
            greed = sorted(greed)
            sizes = sorted(sizes)
            child = 0
            for cookie in sizes:
                if child < len(greed) and cookie >= greed[child]:
                    child += 1
            return child


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            greed = [int(x) for x in data[2:2 + n]]
            sizes = [int(x) for x in data[2 + n:2 + n + m]]
            print(find_content_children(greed, sizes))


        if __name__ == "__main__":
            main()
