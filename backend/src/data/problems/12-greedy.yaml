  - slug: insert-interval
    title: "Insert Interval"
    difficulty: Medium
    topic: "Greedy"
    subtopic: "Hard Problems"
    tags: [array, intervals]
    sourceUrl: "https://leetcode.com/problems/insert-interval/"
    statement: |
      You are given a list of closed intervals `[start, end]` sorted by `start`, where no two
      intervals share any point. You are also given one new interval.

      Insert the new interval into the list and merge wherever necessary, so that the result is
      again sorted by `start` and pairwise disjoint. Two intervals must be merged if they share at
      least one point; for example `[1, 3]` and `[3, 5]` become `[1, 5]`, while `[1, 2]` and
      `[3, 4]` stay separate.
    inputFormat: |
      - Line 1: an integer `n`, the number of existing intervals (may be `0`).
      - Next `n` lines: two integers `start end` for each existing interval.
      - Last line: two integers `start end`, the new interval.
    outputFormat: |
      Print the resulting intervals in increasing order of `start`, one per line, as `start end`.
    constraints:
      - "0 <= n <= 10^4"
      - "-10^5 <= start <= end <= 10^5"
      - "existing intervals are sorted and pairwise disjoint"
    examples:
      - input: |
          4
          1 2
          4 5
          7 9
          12 15
          5 8
        output: |
          1 2
          4 9
          12 15
        explanation: "[5, 8] touches [4, 5] and overlaps [7, 9], so the three merge into [4, 9]."
      - input: |
          2
          3 4
          8 10
          0 1
        output: |
          0 1
          3 4
          8 10
        explanation: "The new interval lies before everything and overlaps nothing; it is simply placed first."
    hints:
      - "Split the existing intervals into three groups: entirely before the new one, overlapping it, and entirely after it."
      - "An interval is entirely before the new one if its end < newStart; entirely after if its start > newEnd."
      - "Every interval in the middle group merges into one interval spanning the min start and max end."
    explanation: |
      **Brute force: append and merge -- O(n log n) time, O(n) space.** Add the new interval, sort
      all intervals by start, then run the standard merge pass.

      **Optimal: single linear pass -- O(n) time, O(n) space for the output.** Walk through the
      sorted list:
      1. Copy every interval with `end < new_start` to the output.
      2. While the current interval has `start <= new_end`, it overlaps (or touches) the new one:
         set `new_start = min(new_start, start)` and `new_end = max(new_end, end)`.
      3. Output the merged new interval, then copy the remaining intervals unchanged.
