        import sys
        from typing import List


        def average_waiting_time(burst: List[int]) -> int:
            order = sorted(burst)
            clock = 0
            total_waiting = 0
            for duration in order:
                total_waiting += clock
                clock += duration
            return total_waiting // len(order)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            n = int(data[0])
            burst = [int(x) for x in data[1:1 + n]]
            print(average_waiting_time(burst))


        if __name__ == "__main__":
            main()
