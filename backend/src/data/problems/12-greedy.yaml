  - slug: jump-game-ii
    title: "Jump Game II"
    difficulty: Medium
    topic: "Greedy"
    subtopic: "Medium Problems"
    tags: [array, greedy, bfs]
    sourceUrl: "https://leetcode.com/problems/jump-game-ii/"
    statement: |
      You start at index `0` of an array `nums` of non-negative integers. From index `i` one jump
      takes you to any index between `i + 1` and `i + nums[i]`.

      It is guaranteed that the last index is reachable. Find the **minimum number of jumps**
      needed to get there.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated non-negative integers.
    outputFormat: |
      Print a single integer: the minimum number of jumps (0 if `n = 1`).
    constraints:
      - "1 <= n <= 10^4"
      - "0 <= nums[i] <= 1000"
      - "The last index is reachable from index 0"
    examples:
      - input: |
          6
          2 1 3 1 1 2
        output: |
          2
        explanation: "Jump 0 -> 2 (value 3), then 2 -> 5. One jump cannot reach the end because nums[0] = 2."
      - input: |
          4
          1 1 1 1
        output: |
          3
        explanation: "Every jump advances exactly one index, so 3 jumps are required."
    hints:
      - "A DP where dp[j] = min jumps to reach j is O(n^2)."
      - "Think of BFS levels: all indices reachable with exactly k jumps form a contiguous range."
      - "Track the end of the current range and the farthest index reachable from inside it; when you pass the end, you must jump once more."
    explanation: |
      **Brute force: recursion -- exponential.** Try every jump length from every index.

