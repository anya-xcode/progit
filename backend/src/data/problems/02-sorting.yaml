  - slug: insertion-sort
    title: Insertion Sort
    difficulty: Easy
    topic: Sorting
    subtopic: Sorting Algorithms
    tags: [sorting, array]
    sourceUrl: ""
    statement: |
      Sort an array of integers into **non-decreasing** order by implementing
      **insertion sort** yourself (do not call a built-in sort).

      Insertion sort works like arranging playing cards in your hand: it takes
      the elements one by one and inserts each into its correct place among the
      elements already processed.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print the sorted array on one line, space-separated.
    constraints:
      - "1 <= n <= 1000"
      - "-10^6 <= arr[i] <= 10^6"
    examples:
      - input: |
          5
          12 7 15 2 9
        output: |
          2 7 9 12 15
        explanation: "Insert 7 before 12: [7, 12, 15, 2, 9]. 15 stays. 2 moves to the front: [2, 7, 12, 15, 9]. 9 moves between 7 and 12: [2, 7, 9, 12, 15]."
      - input: |
          3
          0 -4 0
        output: |
          -4 0 0
        explanation: -4 is shifted before the first 0; the last 0 is not smaller than its left neighbour, so it stays.
    hints:
      - "Keep `arr[0..i-1]` sorted. Store `key = arr[i]` before shifting anything."
      - Shift every larger element of the sorted part one step right, then drop `key` into the gap.
    explanation: |
      **Idea.** For `i = 1 .. n-1`, save `key = arr[i]`. Starting at `j = i - 1`,
      shift `arr[j]` one position to the right while `arr[j] > key`, moving `j`
      left. Place `key` at `j + 1`. The prefix `arr[0..i]` is now sorted.

      **Complexity.** In the worst case (reversed input) each element travels all
      the way to the front: **O(n^2) time**. In the best case (already sorted)
      the inner loop never runs: **O(n) time**. More generally the running time
      is O(n + number of inversions), which makes insertion sort excellent for
      nearly sorted data. It uses **O(1) extra space** and is **stable** because
      equal elements are never shifted past each other.

      **Comparison.** It often beats selection and bubble sort in practice and is
      used inside hybrid sorts for small subarrays, but O(n log n) algorithms win
      on large random inputs.
