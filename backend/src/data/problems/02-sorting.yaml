    referenceSolution:
      python: |
        import sys
        from typing import List


        def quick_sort(arr: List[int]) -> List[int]:
            def sort_range(lo: int, hi: int) -> None:
                while lo < hi:
                    pivot = arr[(lo + hi) // 2]
                    lt, i, gt = lo, lo, hi
                    # three-way partition: [lo, lt) < pivot, [lt, i) == pivot, (gt, hi] > pivot
                    while i <= gt:
                        if arr[i] < pivot:
                            arr[lt], arr[i] = arr[i], arr[lt]
                            lt += 1
                            i += 1
                        elif arr[i] > pivot:
                            arr[i], arr[gt] = arr[gt], arr[i]
                            gt -= 1
                        else:
                            i += 1
                    # recurse into the smaller side, loop on the larger one
                    if lt - lo < hi - gt:
                        sort_range(lo, lt - 1)
                        lo = gt + 1
                    else:
                        sort_range(gt + 1, hi)
                        hi = lt - 1

            sort_range(0, len(arr) - 1)
            return arr


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            print(" ".join(map(str, quick_sort(arr))))


        if __name__ == "__main__":
            main()
