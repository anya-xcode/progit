  - slug: bubble-sort
    title: Bubble Sort
    difficulty: Easy
    topic: Sorting
    subtopic: Sorting Algorithms
    tags: [sorting, array]
    sourceUrl: ""
    statement: |
      Sort an array of integers into **non-decreasing** order by implementing
      **bubble sort** yourself (do not call a built-in sort).

      Bubble sort repeatedly walks through the array comparing neighbours and
      swapping any adjacent pair that is out of order. After each full pass the
      largest remaining element has "bubbled" to the end of the unsorted part.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print the sorted array on one line, space-separated.
    constraints:
      - "1 <= n <= 1000"
      - "-10^6 <= arr[i] <= 10^6"
    examples:
      - input: |
          5
          6 1 9 4 3
        output: |
          1 3 4 6 9
        explanation: "Pass 1 moves 9 to the end: [1, 6, 4, 3, 9]. Pass 2 moves 6 before 9: [1, 4, 3, 6, 9]. Pass 3 swaps 4 and 3: [1, 3, 4, 6, 9]. Pass 4 makes no swap, so the array is sorted."
      - input: |
          3
          -1 -8 -1
        output: |
          -8 -1 -1
        explanation: -8 is swapped ahead of the first -1; equal neighbours are never swapped.
    hints:
      - "After pass `k`, the last `k` positions already hold their final values, so the inner loop can stop earlier each time."
      - If a whole pass performs no swap, the array is already sorted and you can stop.
    explanation: |
      **Idea.** For `end` going from `n - 1` down to `1`, compare `arr[j]` and
      `arr[j + 1]` for every `j < end` and swap them when `arr[j] > arr[j + 1]`.
      Each pass carries the largest element of `arr[0..end]` to position `end`.

      **Early exit.** Keep a flag recording whether the pass swapped anything.
      A pass with no swaps proves the array is sorted, so the algorithm can stop.

      **Complexity.** Worst and average case **O(n^2) time** (about `n^2/2`
      comparisons, e.g. for a reversed array). With the early-exit flag the best
      case - an already sorted array - is **O(n)**. Extra space is **O(1)**, and
      because only strictly out-of-order neighbours are swapped, bubble sort is
      **stable**. For large inputs prefer an O(n log n) algorithm such as merge
      sort.
    starterCode:
      python: |
        import sys
        from typing import List


        def bubble_sort(arr: List[int]) -> List[int]:
            # Sort arr in non-decreasing order using bubble sort and return it.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            print(" ".join(map(str, bubble_sort(arr))))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def bubble_sort(arr: List[int]) -> List[int]:
            n = len(arr)
            for end in range(n - 1, 0, -1):
                swapped = False
                for j in range(end):
                    if arr[j] > arr[j + 1]:
                        arr[j], arr[j + 1] = arr[j + 1], arr[j]
                        swapped = True
                if not swapped:
                    break
            return arr


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            print(" ".join(map(str, bubble_sort(arr))))


        if __name__ == "__main__":
            main()
