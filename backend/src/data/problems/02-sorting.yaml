  - slug: selection-sort
    title: Selection Sort
    difficulty: Easy
    topic: Sorting
    subtopic: Sorting Algorithms
    tags: [sorting, array]
    sourceUrl: ""
    statement: |
      Sort an array of integers into **non-decreasing** order by implementing
      **selection sort** yourself (do not call a built-in sort).

      Selection sort grows a sorted prefix one position at a time: in pass `i` it
      finds the smallest element among positions `i..n-1` and swaps it into
      position `i`.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print the sorted array on one line, space-separated.
    constraints:
      - "1 <= n <= 1000"
      - "-10^6 <= arr[i] <= 10^6"
    examples:
      - input: |
          5
          29 3 17 8 11
        output: |
          3 8 11 17 29
        explanation: "Pass 0 selects 3 and swaps it to the front: [3, 29, 17, 8, 11]. Pass 1 selects 8: [3, 8, 17, 29, 11]. Pass 2 selects 11: [3, 8, 11, 29, 17]. Pass 3 selects 17: [3, 8, 11, 17, 29]."
      - input: |
          4
          2 -5 2 0
        output: |
          -5 0 2 2
        explanation: Duplicates are allowed; equal values simply end up next to each other.
    hints:
      - "Use two loops: the outer loop fixes position `i`, the inner loop scans the unsorted part."
      - Track the index of the minimum in the unsorted part, and swap only once per pass.
    explanation: |
      **Idea.** The array is split into a sorted prefix `arr[0..i-1]` and an
      unsorted suffix. Each pass scans the suffix for its minimum and swaps it to
      position `i`, so the prefix grows by one element that is never moved again.
      After `n - 1` passes the whole array is sorted.

      **Complexity.** The inner scan always runs over the full suffix, so the
      number of comparisons is `(n-1) + (n-2) + ... + 1 = n(n-1)/2`: **O(n^2)
      time in the best, average and worst case**. It uses **O(1) extra space**
      and at most `n - 1` swaps, which is its main advantage. It is not stable
      (a long-distance swap can reorder equal elements).

      **Beyond selection sort.** Merge sort or quick sort bring the time down to
      O(n log n); selection sort is mainly useful for learning and when writes are
      expensive.
    starterCode:
      python: |
        import sys
        from typing import List


        def selection_sort(arr: List[int]) -> List[int]:
            # Sort arr in non-decreasing order using selection sort and return it.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            print(" ".join(map(str, selection_sort(arr))))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def selection_sort(arr: List[int]) -> List[int]:
            n = len(arr)
            for i in range(n - 1):
                smallest = i
                for j in range(i + 1, n):
                    if arr[j] < arr[smallest]:
                        smallest = j
                if smallest != i:
                    arr[i], arr[smallest] = arr[smallest], arr[i]
            return arr


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            print(" ".join(map(str, selection_sort(arr))))


        if __name__ == "__main__":
            main()
