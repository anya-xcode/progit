  - sheetId: prob-2-2-3-recursive-insertion-sort
    slug: recursive-insertion-sort
    title: Recursive Insertion Sort
    difficulty: Easy
    topic: Sorting
    subtopic: Sorting-II
    tags: [sorting, recursion, insertion sort]
    sourceUrl: ""
    statement: |
      Insertion sort keeps a sorted prefix at the front of the array and grows it one
      element at a time: the next element is lifted out and slid backwards past every
      larger element until it lands in the right place.

      You are given an integer array `arr` of length `n`. Sort it in non-decreasing
      order using **insertion sort written recursively**: instead of a loop over the
      positions, a function `sort(k)` first sorts the prefix `arr[0..k-1]` by calling
      itself, and then inserts `arr[k]` into that now-sorted prefix.

      Print the sorted array. You must not use a library sorting routine.
    inputFormat: |
      - Line 1: a single integer `n`.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print the `n` sorted elements on one line, separated by single spaces.
    constraints:
      - "1 <= n <= 1000"
      - "-10^9 <= arr[i] <= 10^9"
    examples:
      - input: |
          5
          4 2 9 2 7
        output: |
          2 2 4 7 9
        explanation: "The prefix [4] is already sorted. Inserting 2 gives [2, 4]; 9 stays at the end giving [2, 4, 9]; the second 2 slides back to the front giving [2, 2, 4, 9]; finally 7 settles between 4 and 9."
      - input: |
          4
          5 -1 -1 0
        output: |
          -1 -1 0 5
        explanation: "Duplicate values keep their relative order because an element only moves past strictly larger ones, so the sort is stable."
    hints:
      - "Define sort(k) as \"make arr[0..k] sorted\". The base case is k == 0, where a one-element prefix is already sorted."
      - "In the recursive case, call sort(k - 1) first. Only after it returns is arr[0..k-1] sorted and ready to receive arr[k]."
      - "To insert arr[k], remember its value, then shift every larger element of the prefix one position to the right and drop the value into the gap that opens up."
    explanation: |
      **Iterative insertion sort - O(n^2) time, O(1) space.** For `k` from `1` to
      `n - 1`, save `value = arr[k]`, then walk `j` back from `k - 1` while
      `arr[j] > value`, copying `arr[j]` to `arr[j + 1]`, and finally write `value`
      at `arr[j + 1]`.

      **Recursive insertion sort - O(n^2) time, O(n) stack space.** The same
      algorithm with the outer loop replaced by recursion:

      - base case: `sort(0)` - a prefix of one element is already sorted;
      - recursive case: `sort(k)` calls `sort(k - 1)` and then inserts `arr[k]` into
        the sorted prefix by the shifting step above.

      The insertion work happens *after* the recursive call returns, which is what
      makes the prefix sorted when the insertion runs. Each of the `n - 1` insertions
      shifts at most `k` elements, so the worst case (a strictly decreasing array) is
      `1 + 2 + ... + (n-1) = n(n-1)/2` shifts, i.e. O(n^2) comparisons and moves. On
      an already sorted array each insertion stops immediately, giving the best case
      O(n). The recursion adds `n` stack frames, the one cost over the loop, and it is
      why `n` is capped at 1000 here.

      Insertion sort is **stable** (equal elements never jump over each other,
      because the shifting stops at the first element that is not strictly greater)
      and it sorts **in place**. That combination makes it the routine of choice for
      tiny or nearly-sorted arrays, and real library sorts - Timsort included - fall
      back to it for small runs. For large unsorted inputs the O(n log n) sorts are
      far better.
