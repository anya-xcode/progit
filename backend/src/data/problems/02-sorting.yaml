  - slug: quick-sort
    title: Quick Sort
    difficulty: Medium
    topic: Sorting
    subtopic: Sorting Algorithms
    tags: [sorting, divide-and-conquer, recursion]
    sourceUrl: ""
    statement: |
      Sort an array of integers into **non-decreasing** order by implementing
      **quick sort** yourself (do not call a built-in sort).

      Quick sort picks a **pivot** element, **partitions** the array so that
      elements smaller than the pivot come before it and larger elements come
      after it, and then recursively sorts the two sides.

      The test data includes already sorted arrays and arrays with many equal
      values, so choose your pivot and partition scheme with care.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print the sorted array on one line, space-separated.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^6 <= arr[i] <= 10^6"
    examples:
      - input: |
          7
          10 80 30 90 40 50 70
        output: |
          10 30 40 50 70 80 90
        explanation: "With pivot 90 (the middle element) everything else is smaller, so one side is [10, 80, 30, 40, 50, 70] and it is sorted recursively the same way."
      - input: |
          5
          3 -1 3 -1 3
        output: |
          -1 -1 3 3 3
        explanation: Equal elements end up grouped together; their relative order does not matter for the output.
    hints:
      - "Always choosing the first or last element as the pivot degrades to O(n^2) (and deep recursion) on sorted input. Try the middle element or a random one."
      - "Hoare-style partitioning: move a left pointer right while values are < pivot and a right pointer left while values are > pivot, then swap and continue."
      - "Three-way partitioning (< pivot, == pivot, > pivot) handles arrays full of duplicates efficiently."
    explanation: |
      **Idea.** Choose a pivot value, rearrange `arr[lo..hi]` so all values
      `< pivot` are on the left and all values `> pivot` are on the right, then
      recurse into both parts. Unlike merge sort, the real work happens *before*
      the recursive calls and no merge step is needed.

      **Partition schemes.** Lomuto (last element as pivot, one scanning index)
      is the easiest to write but does many swaps and suffers on duplicates.
      Hoare's scheme (two pointers moving inward) does fewer swaps. A three-way
      "Dutch national flag" partition puts all copies of the pivot in the middle
      so they are never touched again.

      **Complexity.** Average **O(n log n) time**. The worst case is **O(n^2)**
      when the pivot is always an extreme value (for example, first-element pivot
      on sorted input); a middle or random pivot makes this extremely unlikely.
      Extra space is the recursion stack: **O(log n)** on average (O(n) worst
      case; recursing into the smaller side first bounds it by O(log n)). Quick
      sort sorts in place and is **not stable**.
