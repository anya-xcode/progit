  - slug: recursive-bubble-sort
    title: Recursive Bubble Sort
    difficulty: Easy
    topic: Sorting
    subtopic: Sorting Algorithms
    tags: [sorting, recursion]
    sourceUrl: ""
    statement: |
      Sort an array of integers into **non-decreasing** order by implementing
      **bubble sort recursively** (no outer loop over passes, and no built-in
      sort).

      A single bubble pass over the first `m` elements moves the largest of them
      to position `m - 1`. After that, only the first `m - 1` elements still need
      sorting - which is the same problem on a smaller size. Express the
      algorithm with that recursion.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print the sorted array on one line, space-separated.
    constraints:
      - "1 <= n <= 500"
      - "-10^6 <= arr[i] <= 10^6"
    examples:
      - input: |
          4
          13 46 24 52
        output: |
          13 24 46 52
        explanation: "The pass over all 4 elements swaps 46 and 24: [13, 24, 46, 52]. The call on the first 3 elements makes no swap, so the recursion can stop early."
      - input: |
          5
          0 0 -7 12 -7
        output: |
          -7 -7 0 0 12
        explanation: Each recursive call fixes the largest remaining value at the end of the active prefix.
    hints:
      - "Define `sort_prefix(m)`: sort `arr[0..m-1]`. The base case is `m <= 1`."
      - "Inside, do one loop of adjacent swaps over `j = 0..m-2`, then call `sort_prefix(m - 1)`."
      - If the pass made no swap, you can return immediately.
    explanation: |
      **Idea.** `sort_prefix(m)` performs one bubble pass over `arr[0..m-1]`,
      which places the maximum of that prefix at index `m - 1`, and then calls
      `sort_prefix(m - 1)`. The recursion replaces the outer loop of the
      iterative version. If a pass does no swap the prefix is sorted, so we
      return without recursing further.

      **Complexity.** The passes have lengths `n-1, n-2, ..., 1`, so the worst
      and average time is **O(n^2)**; with the no-swap check the best case
      (sorted input) is **O(n)**. The array is sorted in place, but the recursion
      uses **O(n) stack space** (one frame per pass), which is why the input size
      is kept small here. The algorithm is **stable**.

      **Note.** The iterative bubble sort has the same running time with O(1)
      space; the recursive form is an exercise in turning a loop into recursion.
