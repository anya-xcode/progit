    referenceSolution:
      python: |
        import sys
        from typing import List


        def recursive_insertion_sort(arr: List[int]) -> List[int]:
            def sort_prefix(k: int) -> None:
                if k <= 0:
                    return
                sort_prefix(k - 1)
                value = arr[k]
                j = k - 1
                while j >= 0 and arr[j] > value:
                    arr[j + 1] = arr[j]
                    j -= 1
                arr[j + 1] = value

            sort_prefix(len(arr) - 1)
            return arr


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(v) for v in recursive_insertion_sort(arr)))


        if __name__ == "__main__":
            main()
