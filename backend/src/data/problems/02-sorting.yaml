  - slug: merge-sort
    title: Merge Sort
    difficulty: Medium
    topic: Sorting
    subtopic: Sorting Algorithms
    tags: [sorting, divide-and-conquer, recursion]
    sourceUrl: ""
    statement: |
      Sort an array of integers into **non-decreasing** order by implementing
      **merge sort** yourself (do not call a built-in sort).

      Merge sort is a divide-and-conquer algorithm: split the array into two
      halves, sort each half recursively, then merge the two sorted halves into
      one sorted array.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print the sorted array on one line, space-separated.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^6 <= arr[i] <= 10^6"
    examples:
      - input: |
          6
          38 -2 27 43 3 9
        output: |
          -2 3 9 27 38 43
        explanation: "Split into [38, -2, 27] and [43, 3, 9]. These sort to [-2, 27, 38] and [3, 9, 43]. Merging repeatedly takes the smaller front element: -2, 3, 9, 27, 38, 43."
      - input: |
          5
          5 1 5 1 5
        output: |
          1 1 5 5 5
        explanation: Halves [5, 1] and [5, 1, 5] sort to [1, 5] and [1, 5, 5]; merging them gives the answer.
    hints:
      - "Base case: a subarray of length 0 or 1 is already sorted."
      - "To merge two sorted lists, keep one pointer in each and repeatedly copy the smaller front element. Take from the left list on ties to stay stable."
      - Don't forget to copy the leftovers of whichever list is not exhausted.
    explanation: |
      **Idea.** `merge_sort(lo, hi)` sorts `arr[lo..hi]`: if the range has at
      most one element, return. Otherwise compute `mid`, sort `arr[lo..mid]` and
      `arr[mid+1..hi]` recursively, then merge them with two pointers into a
      temporary list and copy it back.

      **Complexity.** The recursion halves the range, giving `log n` levels, and
      the merges on each level touch every element once. Therefore the time is
      **O(n log n) in the best, average and worst case**. Merging needs a
      temporary buffer, so extra space is **O(n)** plus **O(log n)** recursion
      stack. Merge sort is **stable** when ties are taken from the left half.

      **Compared with simpler sorts.** Selection, bubble and insertion sort need
      O(n^2) time, which is too slow for `n = 10^5`. Quick sort also averages
      O(n log n) with less memory, but merge sort's guarantee does not depend on
      pivot choices.
    starterCode:
      python: |
        import sys
        from typing import List


        def merge_sort(arr: List[int]) -> List[int]:
            # Sort arr in non-decreasing order using merge sort and return it.
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            print(" ".join(map(str, merge_sort(arr))))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def merge_sort(arr: List[int]) -> List[int]:
            def sort_range(lo: int, hi: int) -> None:
                if lo >= hi:
                    return
                mid = (lo + hi) // 2
                sort_range(lo, mid)
                sort_range(mid + 1, hi)
                merged = []
                i, j = lo, mid + 1
                while i <= mid and j <= hi:
                    if arr[i] <= arr[j]:
                        merged.append(arr[i])
                        i += 1
                    else:
                        merged.append(arr[j])
                        j += 1
                merged.extend(arr[i:mid + 1])
                merged.extend(arr[j:hi + 1])
                arr[lo:hi + 1] = merged

            sort_range(0, len(arr) - 1)
            return arr


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            print(" ".join(map(str, merge_sort(arr))))


        if __name__ == "__main__":
            main()
