    referenceSolution:
      python: |
        import sys
        from typing import List


        def recursive_bubble_sort(arr: List[int]) -> List[int]:
            def sort_prefix(m: int) -> None:
                if m <= 1:
                    return
                swapped = False
                for j in range(m - 1):
                    if arr[j] > arr[j + 1]:
                        arr[j], arr[j + 1] = arr[j + 1], arr[j]
                        swapped = True
                if swapped:
                    sort_prefix(m - 1)

            sort_prefix(len(arr))
            return arr


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            print(" ".join(map(str, recursive_bubble_sort(arr))))


        if __name__ == "__main__":
            main()
