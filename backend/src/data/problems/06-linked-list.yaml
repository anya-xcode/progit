    tags: ["linked-list", "basics"]
    sourceUrl: ""
    statement: |
      You are given the head of a singly linked list and a value `x`.

      Put a **new node holding `x` in front of the whole list**, so that it becomes the
      first node and the old head follows it. Return the head of the resulting list.

      The list may be empty, in which case the new node is the entire list. The existing
      nodes must be reused - do not rebuild the list from scratch.
    inputFormat: |
      - Line 1: two integers `n` (the number of nodes already in the list, may be `0`)
        and `x` (the value to insert).
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Print the values of the list after the insertion, from head to tail, separated by
      single spaces.
    constraints:
      - "0 <= n <= 1000"
      - "-10^5 <= node value, x <= 10^5"
    examples:
      - input: |
          4 9
          2 4 6 8
        output: |
          9 2 4 6 8
        explanation: "The new node 9 is placed before 2, so the list becomes 9 -> 2 -> 4 -> 6 -> 8."
      - input: |
          0 5
        output: |
          5
        explanation: "The list is empty, so the new node is the whole list."
    hints:
      - "The new node has to point at whatever the head currently is - even when that is None."
      - "Nothing else in the list changes, so this is O(1) work, not a walk."
      - "Remember that the head reference itself moves: the caller must get the new node back."
    explanation: |
      **Rebuilding the list - O(n) time, O(n) space.** Copy every value into an array,
      insert `x` at index 0 and build a brand new list. Correct, but it allocates `n + 1`
      nodes and touches every existing node for no reason.

      **Relinking - O(1) time, O(1) space.** Insertion at the head never depends on the
      length of the list. Create one node whose `next` already points at the current head,
      and return that node as the new head:

      1. `node = ListNode(x)`
      2. `node.next = head`
      3. return `node`

      The empty list needs no special case: `head` is `None`, so the new node's `next`
      becomes `None` and the result is a one-node list. This O(1) head insertion is exactly
      why a linked list is preferred over an array when values keep arriving at the front -
      an array would have to shift every element one place to the right, costing O(n) per
      insertion.
