  - slug: add-two-numbers
    title: "Add Two Numbers"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "Medium Problems"
    tags: ["linked-list", "math"]
    sourceUrl: "https://leetcode.com/problems/add-two-numbers/"
    statement: |
      Two non-negative integers are stored as singly linked lists, one decimal digit
      per node, with the digits in **reverse** order: the head holds the ones digit,
      the next node the tens digit, and so on.

      Return a linked list, in the same reversed-digit format, that represents the
      sum of the two integers.

      Neither number has leading zeros, except the number `0` itself, which is a
      single node with value `0`. The numbers can be far larger than any built-in
      integer type, so work digit by digit.
    inputFormat: |
      - Line 1: an integer `n`, the number of digits in the first number.
      - Line 2: `n` space-separated digits of the first number, ones digit first.
      - Line 3: an integer `m`, the number of digits in the second number.
      - Line 4: `m` space-separated digits of the second number, ones digit first.
    outputFormat: |
      Print the digits of the sum separated by spaces, ones digit first, with no
      leading zeros (the sum `0` is printed as `0`).
    constraints:
