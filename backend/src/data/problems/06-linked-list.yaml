    slug: search-in-linked-list
    title: "Search in Linked List"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "Learn 1D LinkedList"
    tags: ["linked-list", "traversal", "searching"]
    sourceUrl: ""
    statement: |
      You are given the head of a singly linked list and a value `key`.

      Number the nodes `0, 1, 2, ...` starting at the head. Return the **position of the
      first node whose value equals `key`**, or `-1` if no node holds that value.

      The values are in no particular order and may repeat, so only the earliest match
      counts.
    inputFormat: |
      - Line 1: two integers `n` (the number of nodes, may be `0`) and `key`.
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Print a single integer: the 0-indexed position of the first node holding `key`, or
      `-1` if there is none.
    constraints:
      - "0 <= n <= 5000"
      - "-10^5 <= node value, key <= 10^5"
    examples:
      - input: |
          6 30
          10 20 30 40 30 50
        output: |
          2
        explanation: "30 appears at positions 2 and 4; the first one is reported."
      - input: |
          4 7
          1 2 3 4
        output: |
          -1
        explanation: "No node holds 7, so the answer is -1."
    hints:
      - "Keep a counter alongside the walker so you know where you are."
      - "Return as soon as you find a match - later matches are irrelevant."
      - "Even if the values happened to be sorted, you could not run a binary search here. Why not?"
    explanation: |
      **Linear search - O(n) time, O(1) space.** Walk from the head with a position counter.
      The moment `node.val == key`, return the counter; if the walk reaches `None`, return
      `-1`. On average a present key is found after n/2 steps, and a missing key always costs
      a full pass.

      **Why not binary search?** Binary search needs to jump to the middle element in O(1).
      An array can do that by address arithmetic; a linked list can only reach position `i`
      by taking `i` single steps, so "jumping" to the middle already costs O(n) and the whole
      idea collapses to O(n log n). Sorting the list does not help either.

      **Repeated searches - O(n) preprocessing, O(1) per query.** If many keys have to be
      looked up in the same unchanging list, build a dictionary from value to its first
      position in one pass and answer every later query in O(1). That trades O(n) extra
      memory for the speed-up, and it is only worth it when the list is queried more than a
      couple of times.
    starterCode:
      python: |
        import sys
        from typing import Optional


        class ListNode:
            def __init__(self, val: int = 0, next: "Optional[ListNode]" = None):
                self.val = val
                self.next = next


        def find_position(head: Optional[ListNode], key: int) -> int:
            # Return the 0-indexed position of the first node holding key, or -1.
            pass


        # --- Input/output handling ---
        def build_list(values):
            dummy = ListNode()
            tail = dummy
            for value in values:
                tail.next = ListNode(value)
                tail = tail.next
            return dummy.next


        def main():
            data = sys.stdin.read().split()
            n, key = int(data[0]), int(data[1])
            head = build_list([int(x) for x in data[2:2 + n]])
            print(find_position(head, key))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import Optional


        class ListNode:
            def __init__(self, val: int = 0, next: "Optional[ListNode]" = None):
                self.val = val
                self.next = next


        def find_position(head: Optional[ListNode], key: int) -> int:
            position = 0
            node = head
            while node is not None:
                if node.val == key:
                    return position
                position += 1
                node = node.next
            return -1


        # --- Input/output handling ---
        def build_list(values):
            dummy = ListNode()
            tail = dummy
            for value in values:
                tail.next = ListNode(value)
                tail = tail.next
            return dummy.next


        def main():
            data = sys.stdin.read().split()
            n, key = int(data[0]), int(data[1])
            head = build_list([int(x) for x in data[2:2 + n]])
            print(find_position(head, key))


        if __name__ == "__main__":
            main()
