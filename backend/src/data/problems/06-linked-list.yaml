  - sheetId: prob-6-4-2-find-pairs-with-given-sum
    slug: find-pairs-with-given-sum-in-doubly-linked-list
    title: "Find Pairs with Given Sum in Doubly Linked List"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "Medium Problems of DLL"
    tags: ["doubly-linked-list", "two-pointers"]
    sourceUrl: ""
    statement: |
      In a **doubly linked list** every node stores a value plus two references: `next` to
      the node after it and `prev` to the node before it. The first node's `prev` and the
      last node's `next` are `None`, so the list can be walked from either end - and every
      change has to keep both directions consistent.

      You are given the head of a doubly linked list whose values are **sorted in strictly
      increasing order** (so no value appears twice), and an integer `target`.

      Find every pair of **two different nodes** whose values add up to `target`. Report each
      pair as its smaller value followed by its larger one, and list the pairs in increasing
      order of the smaller value. Return an empty list if there is no such pair.

      Because the list is sorted and has no duplicates, each unordered pair of values occurs
      at most once, so the answer is unambiguous.
    inputFormat: |
      - Line 1: two integers `n` (the number of nodes, may be `0`) and `target`.
      - Line 2: `n` space-separated integers in strictly increasing order, the node values
        from head to tail (an empty line when `n = 0`).
    outputFormat: |
      - Line 1: `k`, the number of pairs found.
      - Next `k` lines: two integers `a b` with `a < b` and `a + b = target`, in increasing
        order of `a`.

      Print only the `0` when there is no pair.
    constraints:
      - "0 <= n <= 1000"
      - "-10^5 <= node value <= 10^5"
      - "-10^6 <= target <= 10^6"
      - "The values are strictly increasing, so they are all distinct."
    examples:
      - input: |
          6 7
          1 2 3 4 5 6
        output: |
          3
          1 6
          2 5
          3 4
        explanation: "1+6, 2+5 and 3+4 all reach 7, and they are listed by their smaller value."
      - input: |
          5 100
          1 3 5 7 9
        output: |
          0
        explanation: "No two of these values add up to 100, so only the count 0 is printed."
    hints:
      - "Trying every pair is O(n^2). The list being sorted has to be worth something."
      - "A doubly linked list can be walked from the tail as well - start one pointer at each end."
      - "If the current sum is too small, only moving the left pointer right can help; if it is too large, only moving the right pointer left can. When do the pointers have to stop?"
    explanation: |
      **All pairs - O(n^2) time, O(1) space.** For every node, walk the rest of the list and
      test each sum. It ignores both the ordering and the backward references.

      **Hash set of values - O(n) time, O(n) space.** Walk once and check whether
      `target - value` has already been seen. Works even on an unsorted singly linked list,
      but it costs O(n) memory.

      **Two pointers from both ends - O(n) time, O(1) space.** This is the method the data
      structure is asking for. Put `left` on the head and walk once to the tail to place
      `right` there, then repeat:

      - if `left.val + right.val == target`, record the pair and move **both** pointers
        inwards (`left = left.next`, `right = right.prev`);
      - if the sum is smaller than `target`, the only way to grow it is `left = left.next`;
      - if the sum is larger, the only way to shrink it is `right = right.prev`.

      Stop as soon as the pointers meet (`left is right`) or cross (`left.prev is right`) -
      without that second test the pointers would step past each other and start reporting
      pairs twice, in reverse. Walking backwards from the tail in O(1) per step is exactly
      what the `prev` references buy you; on a singly linked list the same idea would need the
      values copied into an array first.

      Each iteration moves at least one pointer one step towards the other, so there are at
      most `n` iterations, and the pairs come out in increasing order of the smaller value for
      free.
