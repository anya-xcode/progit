  - sheetId: prob-6-3-5-find-the-starting-point-i
    slug: find-the-starting-point-in-ll
    title: "Find the starting point in LL"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "Medium Problems of LL"
    tags: ["linked-list", "two-pointers", "cycle"]
    sourceUrl: "https://leetcode.com/problems/linked-list-cycle-ii/"
    statement: |
      You are given the head of a singly linked list whose tail may point back into the list,
      creating a loop. Return the **first node of that loop** - the node the walk arrives at
      twice, i.e. the node where the straight part ends and the cycle begins. Return `None`
      if the list has no loop.

      Your function only receives the head. The driver builds the list from `pos`, the
      0-indexed position the tail points back to (`-1` for no loop), and then reports the
      position of the node you returned, so returning a node with the right *value* but the
      wrong identity does not help.
    inputFormat: |
      - Line 1: two integers `n` (the number of nodes, may be `0`) and `pos`.
        The tail's `next` points at the node at position `pos`, or at nothing when
        `pos = -1`.
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Print a single integer: the 0-indexed position of the first node of the loop, counted
      from the head, or `-1` if the list has no loop.
    constraints:
      - "0 <= n <= 5000"
      - "-10^5 <= node value <= 10^5"
      - "pos = -1, or 0 <= pos < n"
    examples:
      - input: |
          6 2
          1 2 3 4 5 6
        output: |
          2
        explanation: "The tail 6 points back at the node at position 2, so the loop is 3 -> 4 -> 5 -> 6 -> 3 and it starts at position 2."
      - input: |
          4 -1
          8 9 10 11
        output: |
          -1
        explanation: "The tail points at nothing, the walk ends, and there is no loop."
    hints:
      - "Storing every visited node in a set answers it directly - the first node you meet twice is the answer."
      - "Use the tortoise and hare to prove a loop exists first; the meeting point alone is not the start of the loop."
      - "Once the two pointers meet, restart one of them at the head and move both one step at a time. Why must they meet exactly at the entrance?"
    explanation: |
      **Hash set of nodes - O(n) time, O(n) space.** Walk from the head storing each node
      object (values may repeat, so identity is what matters). The first node already in the
      set is the entrance of the loop; reaching `None` means there is none. Simple, and often
      good enough, but it needs memory proportional to the list.

      **Floyd's algorithm, two phases - O(n) time, O(1) space.** Let `L` be the length of the
      straight part (so the entrance is node `L`) and `C` the length of the loop.

      *Phase 1 - detect.* Move `slow` one node and `fast` two nodes per step. Without a loop
      `fast` falls off the end. With a loop both pointers end up inside it and the gap shrinks
      by one per step, so they must meet.

      *Phase 2 - locate.* When they meet, `slow` has taken `k` steps and `fast` exactly `2k`,
      so `fast` travelled `k` extra nodes, and since both stand on the same node that surplus
      is a whole number of laps: `k` is a multiple of `C`. The meeting node therefore sits `k`
      steps from the head and also `k - L` steps into the loop. Now put one pointer back at
      the head and advance both one step at a time: after `L` steps the first is at the
      entrance, and the second has moved `k - L + L = k` steps inside the loop from the
      entrance - a multiple of `C` - so it is at the entrance too. They meet exactly there,
      which is the node to return.

      Each phase is at most a couple of passes, so the whole thing is O(n) time with only two
      extra references.
    starterCode:
      python: |
        import sys
        from typing import Optional


        class ListNode:
            def __init__(self, val: int = 0, next: "Optional[ListNode]" = None):
                self.val = val
                self.next = next


        def cycle_start(head: Optional[ListNode]) -> Optional[ListNode]:
            # Return the first node of the loop, or None if the list has no loop.
            pass


        # --- Input/output handling ---
        def build_list_with_cycle(values, pos):
            nodes = [ListNode(value) for value in values]
            for i in range(len(nodes) - 1):
                nodes[i].next = nodes[i + 1]
            if nodes and 0 <= pos < len(nodes):
                nodes[-1].next = nodes[pos]
            return nodes[0] if nodes else None


        def position_of(head, target, n):
            node = head
            for index in range(n):
                if node is target:
                    return index
                node = node.next
            return -1


        def main():
            data = sys.stdin.read().split()
            n, pos = int(data[0]), int(data[1])
            head = build_list_with_cycle([int(x) for x in data[2:2 + n]], pos)
            print(position_of(head, cycle_start(head), n))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import Optional


        class ListNode:
            def __init__(self, val: int = 0, next: "Optional[ListNode]" = None):
                self.val = val
                self.next = next


        def cycle_start(head: Optional[ListNode]) -> Optional[ListNode]:
            slow = fast = head
            while fast is not None and fast.next is not None:
                slow = slow.next
                fast = fast.next.next
                if slow is fast:
                    walker = head
                    while walker is not slow:
                        walker = walker.next
                        slow = slow.next
                    return walker
            return None


        # --- Input/output handling ---
        def build_list_with_cycle(values, pos):
            nodes = [ListNode(value) for value in values]
            for i in range(len(nodes) - 1):
                nodes[i].next = nodes[i + 1]
            if nodes and 0 <= pos < len(nodes):
                nodes[-1].next = nodes[pos]
            return nodes[0] if nodes else None


        def position_of(head, target, n):
            node = head
            for index in range(n):
                if node is target:
                    return index
                node = node.next
            return -1


        def main():
            data = sys.stdin.read().split()
            n, pos = int(data[0]), int(data[1])
            head = build_list_with_cycle([int(x) for x in data[2:2 + n]], pos)
            print(position_of(head, cycle_start(head), n))


        if __name__ == "__main__":
            main()
