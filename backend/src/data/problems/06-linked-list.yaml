    slug: add-one-to-a-number-represented-by-ll
    title: "Add one to a number represented by LL"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "Medium Problems of LL"
    tags: ["linked-list", "math"]
    sourceUrl: ""
    statement: |
      A non-negative integer is stored as a singly linked list with **one decimal digit per
      node, most significant digit first**: the list `3 -> 0 -> 7` is the number 307.

      **Add one to that number** and return the head of a list holding the result in the same
      format.

      The number has no leading zeros, except the number `0` itself, which is the single node
      `0`. The value can be far longer than any built-in integer type, so work digit by digit
      rather than converting the whole list to a number.
    inputFormat: |
      - Line 1: an integer `n`, the number of digits.
      - Line 2: `n` space-separated digits, most significant first.
    outputFormat: |
      Print the digits of the result, most significant first, separated by single spaces.
      The result never has a leading zero.
    constraints:
      - "1 <= n <= 1000"
      - "0 <= digit <= 9"
      - "The first digit is non-zero unless the list is exactly the single digit 0."
    examples:
      - input: |
          3
          1 2 9
        output: |
          1 3 0
        explanation: "129 + 1 = 130: the last digit turns 9 into 0 and carries one into the 2."
      - input: |
          3
          9 9 9
        output: |
          1 0 0 0
        explanation: "999 + 1 = 1000, so the carry survives every digit and a new leading node holding 1 appears."
    hints:
      - "Addition starts at the least significant digit, which here is the *last* node - the awkward end of a singly linked list."
      - "Reverse the list, add the one with a carry, then reverse it back."
      - "Only a number made entirely of 9s grows longer - and then the new leading digit is always 1."
    explanation: |
      The difficulty is direction: carries propagate from the least significant digit
      upwards, but a singly linked list can only be walked from the most significant end.

      **Reverse, add, reverse back - O(n) time, O(1) space.** Reverse the list so the units
      digit comes first. Walk it with `carry = 1`: for each node compute
      `total = node.val + carry`, store `total % 10` and keep `total // 10`. Stop early once
      the carry becomes `0` if you like - nothing after that changes. If a carry survives past
      the last node, append a new node holding it. Reverse the list back and return the head.
      Three passes, no extra storage.

      **Recursion - O(n) time, O(n) space.** Let a recursive function return the carry coming
      out of the sub-list that starts at a node: recurse to the end first, add the incoming
      carry on the way back, and let the caller handle what comes out. The reversals disappear,
      but the call stack costs O(n) and deep lists can overflow it.

      **The 9s trick - O(n) time, O(1) space.** Adding one only changes a suffix of the digits:
      find the last digit that is not `9`, add one to it, and set every digit after it to `0`.
      If there is no such digit the number is all 9s, so the answer is `1` followed by `n`
      zeros - the only case where the list grows.

      Converting the digits into a Python integer and back would pass here because Python has
      big integers, but it defeats the purpose of the exercise and fails in any language with
      fixed-width integers.
