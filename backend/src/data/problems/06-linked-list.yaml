  - sheetId: prob-6-2-3-delete-head-of-doubly-lin
    slug: delete-head-of-doubly-linked-list
    title: "Delete head of Doubly Linked List"
    difficulty: Easy
    topic: "Linked List"
    subtopic: "Learn Doubly LinkedList"
    tags: ["doubly-linked-list", "basics"]
    sourceUrl: ""
    statement: |
      Every node of a **doubly linked list** stores a value and two references: `next` to
      the node after it and `prev` to the node before it. The first node's `prev` and the
      last node's `next` are `None`. Because both directions are linked, the list can be
      walked from either end - and every change has to keep *both* sets of references
      consistent.

      You are given the head of a doubly linked list.

      **Remove its first node** and return the head of what remains. Return `None` if the
      list was empty or becomes empty.

      The node that is left at the front is now the first node, so nothing may come before
      it: walking backwards from the tail must stop there and must not reach the deleted
      node. The driver prints both walks, so a detached node that is still reachable through
      `prev` shows up in the output.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes (may be `0`).
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Two lines:

      - Line 1: the remaining values from head to tail, following `next`.
      - Line 2: the same list from tail back to head, following `prev`.

      Both lines are empty when the list ends up empty.
    constraints:
      - "0 <= n <= 1000"
      - "-10^5 <= node value <= 10^5"
    examples:
      - input: |
          4
          9 8 7 6
        output: |
          8 7 6
          6 7 8
        explanation: "9 is detached; the remaining list 8 7 6 reads 6 7 8 backwards, with nothing before 8."
      - input: |
          1
          3
        output: ""
        explanation: "The only node is removed, so the list is empty and both walks print nothing."
    hints:
      - "The second node becomes the head - what has to change about its `prev`?"
      - "A one-node list has no second node, so check for that before dereferencing."
      - "Cutting the removed node's `next` as well keeps the detached node from holding the list alive."
    explanation: |
      **Relinking - O(1) time, O(1) space.**

      1. if `head` is `None`, return `None`;
      2. `new_head = head.next`;
      3. if `new_head` is not `None`, set `new_head.prev = None`;
      4. optionally `head.next = None` to detach the old node completely;
      5. return `new_head`.

      Step 3 is the one that is easy to forget. Without it the new head still points back at
      a node that is no longer part of the list, so a backward walk from the tail runs one
      node too far and prints the deleted value - the second output line exists precisely to
      expose that.

      Step 4 matters in practice too: leaving the removed node pointing into the list keeps
      the rest of the list reachable from it, which is a small memory leak in languages
      without a garbage collector and confusing in any language.

      **Shifting values - O(n) time, O(1) space.** Copying every value one node towards the
      head and dropping the tail gives the same printed output, but it rewrites all `n`
      nodes instead of three references, and anyone holding a reference to a node suddenly
      sees a different value.
