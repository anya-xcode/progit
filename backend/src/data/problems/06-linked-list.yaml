  - sheetId: prob-6-3-3-reverse-a-ll
    slug: reverse-a-ll
    title: "Reverse a LL"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "Medium Problems of LL"
    tags: ["linked-list", "recursion"]
    sourceUrl: "https://leetcode.com/problems/reverse-linked-list/"
    statement: |
      You are given the head of a singly linked list. Turn every `next` reference around so
      that the old tail becomes the head, and return the new head.

      This is the same task as the iterative reversal, but here you are asked to solve it
      **recursively**: express the answer for a list in terms of the answer for a shorter
      list, and let the call stack do the bookkeeping that the `prev` variable does in the
      loop.

      Relink the existing nodes - do not create new ones.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes (may be `0`).
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Print the values of the reversed list, from its head to its tail, separated by single
      spaces. Print an empty line if the list is empty.
    constraints:
      - "0 <= n <= 2000"
      - "-10^5 <= node value <= 10^5"
      - "The driver raises the recursion limit, so a depth of n is safe."
    examples:
      - input: |
          5
          1 2 3 4 5
        output: |
          5 4 3 2 1
        explanation: "Reversing 1 -> 2 -> 3 -> 4 -> 5 gives 5 -> 4 -> 3 -> 2 -> 1."
      - input: |
          2
          -4 9
        output: |
          9 -4
        explanation: "The deepest call returns 9 as the new head, then 9 is pointed at -4 and -4 becomes the tail."
    hints:
      - "What are the smallest lists you can answer without any work at all?"
      - "Suppose the rest of the list, starting at `head.next`, has already been reversed. Where does `head` belong now, and which node is the new head?"
      - "After the recursive call, `head.next` still points at the node that is now the tail of the reversed part - use it to attach `head` at the end, then cut `head.next`."
    explanation: |
      **Values into a stack or array - O(n) time, O(n) space.** Collect the values, then walk
      again writing them back in reverse. It prints the right answer but shuffles payloads
      instead of links.

      **Recursion - O(n) time, O(n) space for the call stack.** The base case is a list with
      fewer than two nodes: it is its own reversal, so return `head`. Otherwise:

      1. `new_head = reverse(head.next)` - the rest of the list is now reversed, and
         `new_head` is the old tail, which never changes again as the recursion unwinds;
      2. `head.next.next = head` - `head.next` is still the node that directly followed
         `head`, and it is now the *last* node of the reversed part, so pointing it back at
         `head` appends `head` there;
      3. `head.next = None` - `head` is the new tail;
      4. return `new_head`, unchanged all the way up.

      Every node is handled once, so the time is O(n), but the `n` nested frames cost O(n)
      memory and a long enough list will overflow the stack - which is why the iterative
      version is the one to reach for in production.

      **Iterative relinking - O(n) time, O(1) space.** Carry `prev`, save `nxt = curr.next`,
      set `curr.next = prev`, then shift both forward. Same work, constant memory.
