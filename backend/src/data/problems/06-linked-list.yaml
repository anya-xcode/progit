  - sheetId: prob-6-5-2-rotate-a-ll
    slug: rotate-a-ll
    title: "Rotate a LL"
    difficulty: Hard
    topic: "Linked List"
    subtopic: "Hard Problems of LL"
    tags: ["linked-list", "two-pointers"]
    sourceUrl: "https://leetcode.com/problems/rotate-list/"
    statement: |
      You are given the head of a singly linked list and a non-negative integer `k`.

      **Rotate the list `k` places to the right**: every node moves `k` positions towards the
      tail, and the nodes that fall off the end reappear at the front in the same order. One
      rotation of `1 2 3 4 5` gives `5 1 2 3 4`; two rotations give `4 5 1 2 3`.

      Return the head of the rotated list. `k` may be much larger than the length of the list
      - rotating by the length gives the list back unchanged, so only `k mod n` really
      matters.

      Relink the existing nodes instead of copying values.
    inputFormat: |
      - Line 1: two integers `n` (the number of nodes, may be `0`) and `k`.
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Print the values of the rotated list, from head to tail, separated by single spaces.
      Print an empty line if the list is empty.
    constraints:
      - "0 <= n <= 5000"
      - "0 <= k <= 10^9"
      - "-10^5 <= node value <= 10^5"
    examples:
      - input: |
          5 2
          1 2 3 4 5
        output: |
          4 5 1 2 3
        explanation: "The last two nodes, 4 and 5, move to the front, giving 4 5 1 2 3."
      - input: |
          4 9
          7 8 9 10
        output: |
          10 7 8 9
        explanation: "9 mod 4 = 1, so the list is rotated by a single place and 10 moves to the front."
    hints:
      - "Rotating by n changes nothing, so reduce k first - but you need the length to do that."
      - "After the rotation, which of the original nodes is the head? Count from the front, not from the back."
      - "Joining the tail to the head turns the list into a ring; then all that is left is to cut it open in the right place."
    explanation: |
      **Rotate one step, `k` times - O(n * k) time, O(1) space.** Move the tail to the front
      repeatedly. Correct but hopeless for large `k`, which is exactly the case this problem
      is built around.

      **Close the ring and cut it - O(n) time, O(1) space, one and a bit passes.**

      1. Handle the trivial lists: `0` or `1` nodes rotate to themselves.
      2. Walk to the tail, counting as you go, so you end up with both `length` and a
         reference to the last node.
      3. `shift = k % length`. If it is `0` the list is unchanged - return the head as is.
      4. `tail.next = head` makes the list circular. Now no node is special any more, and
         choosing a new head is the same as choosing where to cut.
      5. The new head is the node `length - shift` steps from the old head (the last `shift`
         nodes move to the front, so the new front starts right after the first
         `length - shift` of them). Walk `length - shift - 1` steps to reach the node just
         before it, that is the **new tail**.
      6. `new_head = new_tail.next`, then `new_tail.next = None` to open the ring again, and
         return `new_head`.

      Two traversals at most, no extra memory. The modulo in step 3 is what keeps a `k` of a
      billion as cheap as a `k` of one, and the `shift == 0` check keeps step 5 from walking
      off the end.

      **With two pointers.** You can also run a fast pointer `shift` nodes ahead of a slow one
      and move both until the fast one reaches the tail, which puts the slow one on the new
      tail. It still needs the length first (to reduce `k`), so it saves nothing here.
