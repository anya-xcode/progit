    referenceSolution:
      python: |
        import sys
        from typing import List, Optional, Tuple


        class Node:
            def __init__(self, val: int = 0, prev: "Optional[Node]" = None, next: "Optional[Node]" = None):
                self.val = val
                self.prev = prev
                self.next = next


        def find_pairs_with_sum(head: Optional[Node], target: int) -> List[Tuple[int, int]]:
            if head is None:
                return []
            left = head
            right = head
            while right.next is not None:
                right = right.next
            pairs = []
            while left is not right and left.prev is not right:
                total = left.val + right.val
                if total == target:
                    pairs.append((left.val, right.val))
                    left = left.next
                    right = right.prev
                elif total < target:
                    left = left.next
                else:
                    right = right.prev
            return pairs


        # --- Input/output handling ---
        def build_doubly_list(values):
            head = None
            tail = None
            for value in values:
                node = Node(value)
                if head is None:
                    head = node
                else:
                    tail.next = node
                    node.prev = tail
                tail = node
            return head


        def main():
            data = sys.stdin.read().split()
            n, target = int(data[0]), int(data[1])
            head = build_doubly_list([int(x) for x in data[2:2 + n]])
            pairs = find_pairs_with_sum(head, target)
            print(len(pairs))
            for small, large in pairs:
                print(small, large)


        if __name__ == "__main__":
            main()
