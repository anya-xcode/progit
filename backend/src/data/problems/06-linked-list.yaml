    referenceSolution:
      python: |
        import sys
        from typing import Optional


        class Node:
            def __init__(self, val: int = 0):
                self.val = val
                self.next: "Optional[Node]" = None
                self.bottom: "Optional[Node]" = None


        def flatten(head: Optional[Node]) -> Optional[Node]:
            def merge(first, second):
                dummy = Node()
                tail = dummy
                while first is not None and second is not None:
                    if first.val <= second.val:
                        tail.bottom = first
                        first = first.bottom
                    else:
                        tail.bottom = second
                        second = second.bottom
                    tail = tail.bottom
                    tail.next = None
                tail.bottom = first if first is not None else second
                return dummy.bottom

            if head is None:
                return None
            merged = None
            node = head
            while node is not None:
                nxt = node.next
                node.next = None
                merged = merge(merged, node)
                node = nxt
            return merged


        # --- Input/output handling ---
        def build_multilevel(groups):
            head = None
            prev = None
            for values in groups:
                top = None
                for value in reversed(values):
                    node = Node(value)
                    node.bottom = top
                    top = node
                if head is None:
                    head = top
                else:
                    prev.next = top
                prev = top
            return head


        def print_bottom_list(head):
            out = []
            while head is not None:
                out.append(str(head.val))
                head = head.bottom
            print(" ".join(out))


        def main():
            sys.setrecursionlimit(10 ** 6)
            data = sys.stdin.read().split()
            n = int(data[0])
            index = 1
            groups = []
            for _ in range(n):
                size = int(data[index])
                index += 1
                groups.append([int(x) for x in data[index:index + size]])
                index += size
            print_bottom_list(flatten(build_multilevel(groups)))


        if __name__ == "__main__":
            main()
