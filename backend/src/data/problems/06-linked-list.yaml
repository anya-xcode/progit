    slug: length-of-loop-in-ll
    title: "Length of loop in LL"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "Medium Problems of LL"
    tags: ["linked-list", "two-pointers", "cycle"]
    sourceUrl: ""
    statement: |
      You are given the head of a singly linked list whose tail may point back into the list,
      creating a loop.

      Return **how many nodes the loop contains** - the number of nodes you pass through
      before coming back to where you started inside the loop. Return `0` if the list has no
      loop.

      Your function only receives the head; the driver knows where the loop is but does not
      tell you.
    inputFormat: |
      - Line 1: two integers `n` (the number of nodes, may be `0`) and `pos`.
        The tail's `next` points at the node at position `pos`, or at nothing when
        `pos = -1`.
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Print a single integer: the number of nodes in the loop, or `0` if there is no loop.
    constraints:
      - "0 <= n <= 5000"
      - "-10^5 <= node value <= 10^5"
      - "pos = -1, or 0 <= pos < n"
    examples:
      - input: |
          7 3
          1 2 3 4 5 6 7
        output: |
          4
        explanation: "The tail 7 links back to position 3, so the loop 4 -> 5 -> 6 -> 7 -> 4 holds 4 nodes."
      - input: |
          5 -1
          2 4 6 8 10
        output: |
          0
        explanation: "The walk reaches the end of the list, so there is no loop and the answer is 0."
    hints:
      - "If you record the step number at which each node was first visited, what does the difference tell you when you meet a node again?"
      - "The tortoise and hare meet somewhere *inside* the loop - not necessarily at its entrance."
      - "From any node inside the loop, how do you measure the loop without knowing where it starts?"
    explanation: |
      **Hash map from node to step number - O(n) time, O(n) space.** Walk from the head and
      store `node -> index` for every node visited. When you reach a node that is already in
      the map, the loop length is `current index - stored index`. Reaching `None` means there
      is no loop, so the answer is `0`.

      **Floyd's algorithm plus one lap - O(n) time, O(1) space.** Advance `slow` by one and
      `fast` by two. If `fast` runs off the end there is no loop. If they meet, the meeting
      node is guaranteed to be inside the loop - and that is all you need: freeze one pointer
      on it, walk a second pointer round with a counter starting at `1`, and stop when the
      second pointer is back on the frozen node. The counter is the loop length. You never
      have to find the entrance.

      Detection takes O(n) steps and the measuring lap takes exactly `C` more, so the total is
      O(n) with two references and a counter.
    starterCode:
      python: |
        import sys
        from typing import Optional


        class ListNode:
            def __init__(self, val: int = 0, next: "Optional[ListNode]" = None):
                self.val = val
                self.next = next


        def loop_length(head: Optional[ListNode]) -> int:
            # Return the number of nodes in the loop, or 0 if there is no loop.
            pass


        # --- Input/output handling ---
        def build_list_with_cycle(values, pos):
            nodes = [ListNode(value) for value in values]
            for i in range(len(nodes) - 1):
                nodes[i].next = nodes[i + 1]
            if nodes and 0 <= pos < len(nodes):
                nodes[-1].next = nodes[pos]
            return nodes[0] if nodes else None


        def main():
            data = sys.stdin.read().split()
            n, pos = int(data[0]), int(data[1])
            head = build_list_with_cycle([int(x) for x in data[2:2 + n]], pos)
            print(loop_length(head))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import Optional


        class ListNode:
            def __init__(self, val: int = 0, next: "Optional[ListNode]" = None):
                self.val = val
                self.next = next


        def loop_length(head: Optional[ListNode]) -> int:
            slow = fast = head
            while fast is not None and fast.next is not None:
                slow = slow.next
                fast = fast.next.next
                if slow is fast:
                    count = 1
                    node = slow.next
                    while node is not slow:
                        count += 1
                        node = node.next
                    return count
            return 0


        # --- Input/output handling ---
        def build_list_with_cycle(values, pos):
            nodes = [ListNode(value) for value in values]
            for i in range(len(nodes) - 1):
                nodes[i].next = nodes[i + 1]
            if nodes and 0 <= pos < len(nodes):
                nodes[-1].next = nodes[pos]
            return nodes[0] if nodes else None


        def main():
            data = sys.stdin.read().split()
            n, pos = int(data[0]), int(data[1])
            head = build_list_with_cycle([int(x) for x in data[2:2 + n]], pos)
            print(loop_length(head))


        if __name__ == "__main__":
            main()
