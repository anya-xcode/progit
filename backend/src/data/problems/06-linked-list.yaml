    slug: delete-the-middle-node-in-ll
    title: "Delete the middle node in LL"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "Medium Problems of LL"
    tags: ["linked-list", "two-pointers"]
    sourceUrl: "https://leetcode.com/problems/delete-the-middle-node-of-a-linked-list/"
    statement: |
      You are given the head of a singly linked list with `n` nodes, numbered
      `0, 1, ..., n - 1` from the head.

      **Delete the node at position `floor(n / 2)`** and return the head of the resulting
      list. For an even number of nodes there are two central nodes and it is the second one
      that goes.

      A list with a single node loses that node and becomes empty, so the answer is `None`.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes.
      - Line 2: `n` space-separated integers, the node values from head to tail.
    outputFormat: |
      Print the values of the list after the deletion, from head to tail, separated by
      single spaces. Print an empty line if the list becomes empty.
    constraints:
      - "1 <= n <= 5000"
      - "-10^5 <= node value <= 10^5"
    examples:
      - input: |
          5
          1 2 3 4 5
        output: |
          1 2 4 5
        explanation: "With 5 nodes the middle is position 2, holding 3, so the list becomes 1 2 4 5."
      - input: |
          4
          10 20 30 40
        output: |
          10 20 40
        explanation: "With 4 nodes positions 1 and 2 are central and the second one, 30, is deleted."
    hints:
      - "Counting the nodes first and walking half-way again works - but that is two passes."
      - "Deleting a node in a singly linked list means standing on the node *before* it."
      - "Run the usual slow/fast pair, but give the fast pointer a head start of one extra step so the slow pointer stops one node early."
    explanation: |
      **Two passes - O(n) time, O(1) space.** Count the nodes to get `n`, then walk
      `n // 2 - 1` steps from the head to reach the predecessor of the middle and unlink its
      successor with `prev.next = prev.next.next`. Handle `n == 1` separately, since there is
      no predecessor.

      **One pass with slow and fast pointers - O(n) time, O(1) space.** The plain
      tortoise-and-hare stops with `slow` *on* the middle node, which is useless in a singly
      linked list because you cannot step back to its predecessor. Start `fast` two nodes
      ahead instead (`slow = head`, `fast = head.next.next`) and the whole race shifts by one:
      when `fast` can no longer take two steps, `slow` is exactly the node **before** the
      middle. Then `slow.next = slow.next.next` removes it.

      Check `n == 1` first (`head.next is None` - return `None`); with `n >= 2` the shifted
      start is safe, and the loop leaves `slow.next` non-empty in every case.

      **Copying into an array - O(n) time, O(n) space.** Collect the values, drop index
      `n // 2` and rebuild. Correct, but it allocates a second list for no gain.
