    title: "Palindrome Linked List"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "Medium Problems"
    tags: ["linked-list", "two-pointers"]
    sourceUrl: "https://leetcode.com/problems/palindrome-linked-list/"
    statement: |
      Given the `head` of a singly linked list, determine whether the sequence of
      values reads the same from head to tail as from tail to head.

      Aim for a solution that uses only constant extra memory.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes.
      - Line 2: `n` space-separated integers, the node values from head to tail.
    outputFormat: |
      Print `true` if the values form a palindrome, otherwise `false`.
    constraints:
      - "1 <= n <= 5000"
      - "0 <= node value <= 9"
    examples:
      - input: |
          5
          3 1 4 1 3
        output: |
          true
        explanation: "Read backwards the values are 3 1 4 1 3, identical to the original order."
      - input: |
          4
          1 2 2 3
        output: |
          false
        explanation: "The first value is 1 but the last value is 3."
    hints:
      - "Copying the values into an array makes the check easy - but can you avoid the extra array?"
      - "Find the middle of the list with slow and fast pointers."
      - "Reverse the second half, then compare it node by node with the first half."
    explanation: |
      **Array copy - O(n) time, O(n) space.** Store all values in an array and compare
      it with its reverse (or use two indices moving inward). A stack of the values
      works the same way.

      **Reverse the second half - O(n) time, O(1) space.** Use slow/fast pointers to
      stop `slow` at the middle. Reverse the list starting from `slow`. Walk one
      pointer from the head and one from the head of the reversed half, comparing
      values until the reversed half ends. Any difference means it is not a
      palindrome. (In real code you would reverse the half back to restore the input.)
