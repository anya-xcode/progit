        import sys
        from typing import Optional


        class ListNode:
            def __init__(self, val: int = 0, next: "Optional[ListNode]" = None):
                self.val = val
                self.next = next


        def intersection_node(head_a: Optional[ListNode], head_b: Optional[ListNode]) -> Optional[ListNode]:
            if head_a is None or head_b is None:
                return None
            first = head_a
            second = head_b
            while first is not second:
                first = head_b if first is None else first.next
                second = head_a if second is None else second.next
            return first


        # --- Input/output handling ---
        def build_list(values):
            dummy = ListNode()
            tail = dummy
            for value in values:
                tail.next = ListNode(value)
                tail = tail.next
            return dummy.next


        def build_y_shape(first, second, shared):
            tail = build_list(shared)
            head_a = build_list(first)
            head_b = build_list(second)
            if head_a is None:
                head_a = tail
            else:
                node = head_a
                while node.next is not None:
                    node = node.next
                node.next = tail
            if head_b is None:
                head_b = tail
            else:
                node = head_b
                while node.next is not None:
                    node = node.next
                node.next = tail
            return head_a, head_b


        def main():
            data = sys.stdin.read().split()
            a, b, c = int(data[0]), int(data[1]), int(data[2])
            start = 3
            first = [int(x) for x in data[start:start + a]]
            start += a
            second = [int(x) for x in data[start:start + b]]
            start += b
            shared = [int(x) for x in data[start:start + c]]
            head_a, head_b = build_y_shape(first, second, shared)
            node = intersection_node(head_a, head_b)
            print(node.val if node is not None else -1)


        if __name__ == "__main__":
            main()
