      python: |
        import sys
        from typing import Optional


        class Node:
            def __init__(self, val: int = 0, prev: "Optional[Node]" = None, next: "Optional[Node]" = None):
                self.val = val
                self.prev = prev
                self.next = next


        def delete_all_occurrences(head: Optional[Node], key: int) -> Optional[Node]:
            node = head
            while node is not None:
                nxt = node.next
                if node.val == key:
                    if node.prev is not None:
                        node.prev.next = node.next
                    else:
                        head = node.next
                    if node.next is not None:
                        node.next.prev = node.prev
                    node.prev = None
                    node.next = None
                node = nxt
            return head


        # --- Input/output handling ---
        def build_doubly_list(values):
            head = None
            tail = None
            for value in values:
                node = Node(value)
                if head is None:
                    head = node
                else:
                    tail.next = node
                    node.prev = tail
                tail = node
            return head


        def print_both_ways(head):
            forward = []
            tail = None
            node = head
            while node is not None:
                forward.append(str(node.val))
                tail = node
                node = node.next
            backward = []
            node = tail
            while node is not None:
                backward.append(str(node.val))
                node = node.prev
            print(" ".join(forward))
            print(" ".join(backward))


        def main():
            data = sys.stdin.read().split()
            n, key = int(data[0]), int(data[1])
            head = build_doubly_list([int(x) for x in data[2:2 + n]])
            print_both_ways(delete_all_occurrences(head, key))


