        import sys
        from typing import Optional


        class Node:
            def __init__(self, val: int = 0, prev: "Optional[Node]" = None, next: "Optional[Node]" = None):
                self.val = val
                self.prev = prev
                self.next = next


        def remove_duplicates(head: Optional[Node]) -> Optional[Node]:
            node = head
            while node is not None:
                nxt = node.next
                while nxt is not None and nxt.val == node.val:
                    nxt = nxt.next
                if node.next is not nxt:
                    node.next = nxt
                    if nxt is not None:
                        nxt.prev = node
                node = nxt
            return head


        # --- Input/output handling ---
        def build_doubly_list(values):
            head = None
            tail = None
            for value in values:
                node = Node(value)
                if head is None:
                    head = node
                else:
                    tail.next = node
                    node.prev = tail
                tail = node
            return head


        def print_both_ways(head):
            forward = []
            tail = None
            node = head
            while node is not None:
                forward.append(str(node.val))
                tail = node
                node = node.next
            backward = []
            node = tail
            while node is not None:
                backward.append(str(node.val))
                node = node.prev
            print(" ".join(forward))
            print(" ".join(backward))


        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            head = build_doubly_list([int(x) for x in data[1:1 + n]])
            print_both_ways(remove_duplicates(head))


        if __name__ == "__main__":
            main()
