  - sheetId: prob-6-5-3-flattening-of-ll
    slug: flattening-of-ll
    title: "Flattening of LL"
    difficulty: Hard
    topic: "Linked List"
    subtopic: "Hard Problems of LL"
    tags: ["linked-list", "merge", "sorting"]
    sourceUrl: ""
    statement: |
      You are given a **two-level linked list**. Each node has two references: `next`, which
      leads to the next node along the top row, and `bottom`, which leads down a column of
      nodes hanging below it.

      Every column - the top node together with everything reachable from it through
      `bottom` - is already **sorted in non-decreasing order**. The top row itself is in no
      particular order.

      **Flatten the whole structure into a single sorted list linked through `bottom`
      references only**, containing every node of every column, and return its head. The
      result must be sorted in non-decreasing order.

      The `Node` class, with `val`, `next` and `bottom`, is defined for you above the driver.
      The driver prints the list you return by following `bottom` from the head, so a result
      that is still linked through `next` prints nothing useful.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes in the top row (may be `0`).
      - Next `n` lines: one column each, given as `m` followed by `m` space-separated
        integers in non-decreasing order. The first of those values is the value of the top
        node itself, and the rest hang below it through `bottom`.
    outputFormat: |
      Print the values of the flattened list, following `bottom` from the head, separated by
      single spaces. Print an empty line if there are no nodes at all.
    constraints:
      - "0 <= n <= 200"
      - "1 <= m <= 50 for every column"
      - "The total number of nodes is at most 2000"
      - "-10^5 <= node value <= 10^5"
      - "Every column is sorted in non-decreasing order"
    examples:
      - input: |
          4
          3 5 7 8
          1 10
          2 19 22
          4 2 6 9 20
        output: |
          2 5 6 7 8 9 10 19 20 22
        explanation: "The four columns hold 5 7 8, 10, 19 22 and 2 6 9 20; merged together they give 2 5 6 7 8 9 10 19 20 22."
      - input: |
          2
          1 4
          1 1
        output: |
          1 4
        explanation: "Two single-node columns: 1 comes before 4 even though its column is second in the top row."
    hints:
      - "Two already-sorted lists can be combined in one walk. How does that help when there are n of them?"
      - "Merging through `bottom` is the same loop as an ordinary merge - just follow and assign `bottom` instead of `next`."
      - "Merging the columns one at a time from the *right* keeps the code short: flatten everything after the current column first, then merge the current column into it."
    explanation: |
      Let `N` be the total number of nodes and `n` the number of columns.

      **Collect and sort - O(N log N) time, O(N) space.** Walk everything, put the values in
      an array, sort it and rebuild the chain. It works, but it ignores that the data arrives
      almost sorted and it allocates a second copy.

      **Repeated two-list merges - O(N * n) worst case, O(1) extra space (iteratively).** The
      only primitive needed is "merge two sorted `bottom`-chains", which is the standard merge
      loop with a dummy node, written against `bottom` instead of `next`. Then either

      - sweep the top row left to right, keeping a running `merged` chain and merging each
        column into it, or
      - recurse: `flatten(head) = merge(head_column, flatten(head.next))`, which merges from
        the right and costs O(n) stack frames.

      Both do `n - 1` merges. Each merge walks the whole accumulated result, so in the worst
      case the total work is O(N * n) - fine for these sizes, and the usual answer expected for
      this problem.

      **Merging with a heap - O(N log n) time, O(n) space.** Push the head of every column into
      a min-heap keyed by value; repeatedly pop the smallest, append it to the result and push
      its `bottom` successor. This is the same idea as merging `k` sorted lists and is the
      fastest of the three when `n` is large.

      Whichever you pick, one detail matters for correctness of the *shape*: each node you
      append should have its `next` cleared, so the result is a pure `bottom`-chain and no
      stale top-row reference survives.
