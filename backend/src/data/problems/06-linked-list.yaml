    statement: |
      Every node of a **doubly linked list** stores a value and two references: `next` to
      the node after it and `prev` to the node before it. The first node's `prev` and the
      last node's `next` are `None`. Because both directions are linked, the list can be
      walked from either end - and every change has to keep *both* sets of references
      consistent.

      You are given the head of a doubly linked list (possibly empty) and a value `x`.

      Insert a **new node holding `x` in front of the list** so that it becomes the new head,
      and return it. The old head must follow the new node, and it must be able to get back
      to it: after the insertion the whole list has to be walkable in both directions.

      Reuse the existing nodes; only one new node may be created.
    inputFormat: |
      - Line 1: two integers `n` (the number of nodes already in the list, may be `0`) and
        `x` (the value to insert).
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Two lines:

      - Line 1: the values of the new list from head to tail, following `next`.
      - Line 2: the same list from tail back to head, following `prev`.
    constraints:
      - "0 <= n <= 1000"
      - "-10^5 <= node value, x <= 10^5"
    examples:
      - input: |
          3 1
          2 3 4
        output: |
          1 2 3 4
          4 3 2 1
        explanation: "1 becomes the head; walking back from the tail 4 the prev references lead 4 3 2 1."
      - input: |
          0 6
        output: |
          6
          6
        explanation: "The list was empty, so the new node is both head and tail and each walk prints only 6."
    hints:
      - "Two references have to be written, not one: the new node's `next` and the old head's `prev`."
      - "The old head only has a `prev` to fix if it exists - check for the empty list first."
      - "No walking is needed, so this is O(1)."
    explanation: |
      **Relinking - O(1) time, O(1) space.** Insertion at the front never depends on the
      length of the list:

      1. `node = Node(x)`;
      2. `node.next = head`;
      3. if `head` is not `None`, `head.prev = node`;
      4. return `node`.

      Step 3 is what makes this a *doubly* linked insertion. Skip it and the forward walk
      still prints the right values while the backward walk from the tail stops at the old
      head, silently losing the new node - which is exactly what the second output line
      catches.

      An empty list needs no special case beyond the `None` check: the new node's `next`
      becomes `None` and it is head and tail at once.

      **Rebuilding the list - O(n) time, O(n) space.** Collecting the values into an array
      and building a fresh list also works, but it allocates `n + 1` nodes to achieve what
      three assignments already did.
