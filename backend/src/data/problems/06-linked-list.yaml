  - slug: reverse-a-linked-list
    title: "Reverse a Linked List"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "1D Linked List"
    tags: ["linked-list", "recursion"]
    sourceUrl: "https://leetcode.com/problems/reverse-linked-list/"
    statement: |
      Given the `head` of a singly linked list, reverse the direction of every
      `next` pointer so that the old tail becomes the new head. Return the new head.

      Try to do it by relinking the existing nodes rather than creating new ones.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes (may be `0`).
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Print the values of the reversed list separated by spaces. Print an empty line
      if the list is empty.
    constraints:
      - "0 <= n <= 5000"
      - "-10^5 <= node value <= 10^5"
    examples:
      - input: |
          4
          3 6 9 12
        output: |
          12 9 6 3
        explanation: "The list 3 -> 6 -> 9 -> 12 becomes 12 -> 9 -> 6 -> 3."
      - input: |
          2
          -1 5
        output: |
          5 -1
        explanation: "Swapping the direction of the single link gives 5 -> -1."
    hints:
      - "You could push all values onto a stack and rewrite them, but that uses extra memory."
      - "Walk the list once while remembering the previous node. Before redirecting `curr.next`, save the node that comes after it."
    explanation: |
      **Stack of values - O(n) time, O(n) space.** Push every value onto a stack, then
      walk the list again popping values into the nodes.

      **Recursion - O(n) time, O(n) space.** Reverse the rest of the list starting at
      `head.next`, then make `head.next.next = head` and `head.next = None`. The call
      stack costs O(n) and can overflow for long lists.

      **Iterative relinking - O(n) time, O(1) space.** Keep `prev = None` and
      `curr = head`. At each step save `nxt = curr.next`, point `curr.next` to `prev`,
      then shift `prev = curr` and `curr = nxt`. When `curr` becomes `None`, `prev`
      is the new head.
