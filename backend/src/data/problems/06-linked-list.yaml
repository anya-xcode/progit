    slug: reverse-a-doubly-linked-list
    title: "Reverse a Doubly Linked List"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "Learn Doubly LinkedList"
    tags: ["doubly-linked-list", "two-pointers"]
    sourceUrl: ""
    statement: |
      Every node of a **doubly linked list** stores a value and two references: `next` to
      the node after it and `prev` to the node before it. The first node's `prev` and the
      last node's `next` are `None`. Because both directions are linked, the list can be
      walked from either end - and every change has to keep *both* sets of references
      consistent.

      You are given the head of a doubly linked list. **Reverse it**: the old tail becomes
      the new head, the old head becomes the new tail, and the order of the values is turned
      around. Return the new head.

      Relink the existing nodes instead of creating new ones, and keep the list a valid
      doubly linked list - after the reversal both walks must work, and the new head's `prev`
      and the new tail's `next` must be `None`.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes (may be `0`).
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Two lines:

      - Line 1: the reversed list from its head to its tail, following `next`.
      - Line 2: the reversed list from its tail back to its head, following `prev`
        (which is the original order).

      Both lines are empty when the list is empty.
    constraints:
      - "0 <= n <= 5000"
      - "-10^5 <= node value <= 10^5"
    examples:
      - input: |
          5
          1 2 3 4 5
        output: |
          5 4 3 2 1
          1 2 3 4 5
        explanation: "The list becomes 5 4 3 2 1, and walking back from its tail gives the original order 1 2 3 4 5."
      - input: |
          2
          -8 3
        output: |
          3 -8
          -8 3
        explanation: "With two nodes the links simply swap, so the head is 3 and the tail is -8."
    hints:
      - "Reversing a doubly linked list means swapping `prev` and `next` in every node."
      - "Once you swap a node's two references, `node.prev` is the node you have to visit next - save it before the swap."
      - "The new head is the node you were standing on when the walk ran out of nodes."
    explanation: |
      **Copy the values - O(n) time, O(n) space.** Collect every value into an array, reverse
      it and write the values back into the nodes. The links are untouched, so the list stays
      valid, but it needs O(n) extra memory and rewrites all the payloads.

      **Swap the two references in every node - O(n) time, O(1) space.** For a doubly linked
      list, "reversed" and "`prev` and `next` exchanged" are the same thing. Walk with
      `node = head` and, for each node:

      1. `node.prev, node.next = node.next, node.prev` (one swap handles both directions);
      2. remember the node as `last`;
      3. move on with `node = node.prev` - after the swap, the *old* `next` lives in `prev`.

      When `node` becomes `None`, `last` is the final node visited, which is the old tail, so
      it is the new head. Its `prev` is already `None` (it used to be its `next`), and the old
      head's `next` is `None` for the same reason, so no clean-up is needed. The empty list
      falls straight through and returns `None`.

      An equivalent formulation keeps an explicit `prev_node` reference like the singly linked
      version and writes both fields by hand; the swap is just shorter and harder to get
      wrong. Either way one pass is enough, which is optimal since every node's references
      must change.
