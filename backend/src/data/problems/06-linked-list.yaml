  - sheetId: prob-6-1-1-introduction-to-singly-li
    slug: introduction-to-singly-linkedlist
    title: "Introduction to Singly LinkedList"
    difficulty: Easy
    topic: "Linked List"
    subtopic: "Learn 1D LinkedList"
    tags: ["linked-list", "basics"]
    sourceUrl: ""
    statement: |
      A **singly linked list** stores its values in separate objects called nodes. Every
      node keeps a value and a single reference, `next`, to the node that follows it. The
      last node's `next` is `None`, and the list as a whole is identified by its first
      node, the **head**.

      You are given the values of a list in order, as a plain Python list. Create one node
      per value, link each node to the one after it, and return the head of the list you
      built. Return `None` when there are no values at all.

      The driver then walks your list from the head, following `next` references only, and
      prints the values it meets - so the list has to be linked correctly for the output to
      be right.
    inputFormat: |
      - Line 1: an integer `n`, the number of values (may be `0`).
      - Line 2: `n` space-separated integers, the values in order
        (an empty line when `n = 0`).
    outputFormat: |
      Print the values of the list you built, from head to tail, separated by single
      spaces. Print an empty line when the list is empty.
    constraints:
      - "0 <= n <= 1000"
      - "-10^5 <= value <= 10^5"
    examples:
      - input: |
          5
          3 1 4 1 5
        output: |
          3 1 4 1 5
        explanation: "Five nodes are created and chained, so walking from the head prints the values in the same order."
      - input: |
          1
          42
        output: |
          42
        explanation: "A list of one node: 42 is the head and its next reference is None."
    hints:
      - "One node per value: create it, then attach it after the node you created before it."
      - "Keep a reference to the last node you attached so the next one can be linked in O(1)."
      - "Building from the back is even shorter: walk the values in reverse and make each new node point at the head you have so far."
    explanation: |
      **Appending from the front - O(n) time, O(n) space.** Walk the values from the head
      towards the tail. Keep two references: `head` (the first node) and `tail` (the last
      node attached so far). For each value create a node, set `tail.next` to it and move
      `tail` on. The very first node has no predecessor, so it becomes `head` instead. A
      **dummy node** placed before the real head removes that special case: link everything
      after the dummy and return `dummy.next` at the end.

      **Building from the back - O(n) time, O(n) space.** Start with `head = None` and walk
      the values in reverse order. Each new node is created with its `next` already pointing
      at the current `head`, and then becomes the new `head`. No tail reference and no
      special case for the first node.

      Both allocate `n` nodes, which is the O(n) space the list itself occupies; there is no
      extra bookkeeping beyond a couple of references.
