      python: |
        import sys
        from typing import Optional


        class ListNode:
            def __init__(self, val: int = 0, next: "Optional[ListNode]" = None):
                self.val = val
                self.next = next


        def add_one(head: Optional[ListNode]) -> Optional[ListNode]:
            def reverse(node):
                prev = None
                while node is not None:
                    nxt = node.next
                    node.next = prev
                    prev = node
                    node = nxt
                return prev

            node = reverse(head)
            reversed_head = node
            carry = 1
            tail = None
            while node is not None and carry:
                total = node.val + carry
                node.val = total % 10
                carry = total // 10
                tail = node
                node = node.next
            if carry:
                tail.next = ListNode(carry)
            return reverse(reversed_head)


        # --- Input/output handling ---
        def build_list(values):
            dummy = ListNode()
            tail = dummy
            for value in values:
                tail.next = ListNode(value)
                tail = tail.next
            return dummy.next


        def print_list(head):
            out = []
            while head is not None:
                out.append(str(head.val))
                head = head.next
            print(" ".join(out))


        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            head = build_list([int(x) for x in data[1:1 + n]])
            print_list(add_one(head))


        if __name__ == "__main__":
            main()
