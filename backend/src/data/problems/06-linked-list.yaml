    slug: deletion-of-the-head-of-ll
    title: "Deletion of the head of LL"
    difficulty: Easy
    topic: "Linked List"
    subtopic: "Learn 1D LinkedList"
    tags: ["linked-list", "basics"]
    sourceUrl: ""
    statement: |
      You are given the head of a singly linked list.

      **Remove its first node** and return the head of what is left. If the list was empty
      there is nothing to remove, so return `None`; if it had exactly one node the result is
      an empty list.

      Do not move values from node to node - detach the first node itself.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes (may be `0`).
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Print the values of the list after the deletion, from head to tail, separated by
      single spaces. Print an empty line if the list ends up empty.
    constraints:
      - "0 <= n <= 1000"
      - "-10^5 <= node value <= 10^5"
    examples:
      - input: |
          5
          10 20 30 40 50
        output: |
          20 30 40 50
        explanation: "The node 10 is detached, so the list starts at 20."
      - input: |
          1
          8
        output: ""
        explanation: "The only node is removed, leaving an empty list, so an empty line is printed."
    hints:
      - "Which node becomes the head after the old one is gone?"
      - "You never have to walk the list - the answer is one reference away."
      - "Handle the empty list before you touch `head.next`."
    explanation: |
      **Shifting values - O(n) time, O(1) space.** Copy every value one node to the left and
      drop the last node. It produces the right sequence of values but rewrites the whole
      list, and any reference someone else holds to a node now sees a different value.

      **Detaching the node - O(1) time, O(1) space.** The second node is already a complete,
      correctly linked list, so:

      1. if `head` is `None`, return `None`;
      2. otherwise remember `new_head = head.next`, optionally set `head.next = None` to cut
         the removed node loose, and return `new_head`.

      Nothing else is traversed, so deletion at the front is O(1) - the same reason head
      insertion is O(1). In a language with manual memory management this is also where you
      would free the detached node; in Python the garbage collector reclaims it once nothing
      refers to it.
