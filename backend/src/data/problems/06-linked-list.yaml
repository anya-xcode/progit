        def build_list(values):
            dummy = ListNode()
            tail = dummy
            for value in values:
                tail.next = ListNode(value)
                tail = tail.next
            return dummy.next


        def print_list(head):
            out = []
            while head is not None:
                out.append(str(head.val))
                head = head.next
            print(" ".join(out))


