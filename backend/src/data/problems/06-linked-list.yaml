        import sys
        from typing import Optional


        class ListNode:
            def __init__(self, val: int = 0, next: "Optional[ListNode]" = None):
                self.val = val
                self.next = next


        def sort_zero_one_two(head: Optional[ListNode]) -> Optional[ListNode]:
            zero = ListNode()
            one = ListNode()
            two = ListNode()
            tails = {0: zero, 1: one, 2: two}
            node = head
            while node is not None:
                nxt = node.next
                node.next = None
                tails[node.val].next = node
                tails[node.val] = node
                node = nxt
            tails[1].next = two.next
            tails[0].next = one.next
            return zero.next


        # --- Input/output handling ---
        def build_list(values):
            dummy = ListNode()
            tail = dummy
            for value in values:
                tail.next = ListNode(value)
                tail = tail.next
            return dummy.next


        def print_list(head):
            out = []
            while head is not None:
                out.append(str(head.val))
                head = head.next
            print(" ".join(out))


        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            head = build_list([int(x) for x in data[1:1 + n]])
            print_list(sort_zero_one_two(head))


