    slug: reverse-ll-in-group-of-given-size-k
    title: "Reverse LL in group of given size K"
    difficulty: Hard
    topic: "Linked List"
    subtopic: "Hard Problems of LL"
    tags: ["linked-list", "recursion", "two-pointers"]
    sourceUrl: "https://leetcode.com/problems/reverse-nodes-in-k-group/"
    statement: |
      You are given the head of a singly linked list and an integer `k`.

      Cut the list into consecutive blocks of `k` nodes, counting from the head, and
      **reverse each complete block**. If the last block has fewer than `k` nodes it is left
      exactly as it is. Return the head of the resulting list.

      For example, with `k = 3` the list `1 2 3 4 5 6 7 8` becomes `3 2 1 6 5 4 7 8`: the
      first two blocks are reversed and the leftover `7 8` stays put.

      Relink the existing nodes rather than moving values between them. Note that `k` may be
      larger than the whole list, in which case nothing changes.
    inputFormat: |
      - Line 1: two integers `n` (the number of nodes, may be `0`) and `k`.
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Print the values of the resulting list, from head to tail, separated by single spaces.
      Print an empty line if the list is empty.
    constraints:
      - "0 <= n <= 5000"
      - "1 <= k <= 5000"
      - "-10^5 <= node value <= 10^5"
    examples:
      - input: |
          8 3
          1 2 3 4 5 6 7 8
        output: |
          3 2 1 6 5 4 7 8
        explanation: "The blocks 1 2 3 and 4 5 6 are reversed; only 7 8 is left, which is shorter than 3, so it stays."
      - input: |
          5 5
          1 2 3 4 5
        output: |
          5 4 3 2 1
        explanation: "The list is exactly one complete block, so the whole list is reversed."
    hints:
      - "Before touching a block, check that it really has k nodes - walk k steps and see whether you fall off the end."
      - "Reversing one block is the ordinary reversal loop, except that it stops at the node after the block instead of at None, and starts with `prev` set to that node."
      - "The node that was the head of a block becomes its tail, and it is the node the *next* block has to be attached to. A dummy node in front of the list makes the very first block behave like all the others."
    explanation: |
      **Collect the values - O(n) time, O(n) space.** Copy the values into an array, reverse
      each full slice of `k`, and write them back. It gets the printed answer right but does
      not touch a single link, which is the whole point of the exercise.

      **Block by block, iteratively - O(n) time, O(1) space.** Put a dummy node in front of
      the list and keep `group_prev`, the node that comes just before the block being
      processed (it starts at the dummy).

      1. *Check the block.* Walk `k` steps from `group_prev` to reach `kth`, the last node of
         the block. If you hit `None` on the way, the remaining nodes are fewer than `k`, so
         they stay as they are and you are done - return `dummy.next`.
      2. *Reverse the block.* Remember `group_next = kth.next`. Run the usual reversal loop
         over the block but start with `prev = group_next` and stop when the walker reaches
         `group_next`. Because `prev` starts there, the block's old head ends up pointing
         straight at the rest of the list - no separate re-attachment needed.
      3. *Re-attach the front.* The block's old head (saved before the reversal) is now its
         tail and becomes the next `group_prev`; `group_prev.next` must be set to `kth`, which
         is the block's new head.

      Every node is visited a constant number of times, so this is O(n) time with a handful of
      references.

      **Recursively - O(n) time, O(n / k) stack.** Reverse the first `k` nodes, then set the
      old head's `next` to the result of recursing on the rest. Shorter to write; the stack
      depth is `n / k`, which is fine for large `k` and no better than the loop for `k = 1`.

      The two edge cases worth testing are `k = 1` (nothing changes) and `k > n` (no complete
      block, so again nothing changes).
