  - slug: remove-nth-node-from-end-of-list
    title: "Remove Nth Node From End of List"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "Medium Problems"
    tags: ["linked-list", "two-pointers"]
    sourceUrl: "https://leetcode.com/problems/remove-nth-node-from-end-of-list/"
    statement: |
      Given the `head` of a singly linked list and an integer `k`, delete the node
      that is `k`-th when counting from the **tail** (the tail itself is the 1st node
      from the end). Return the head of the resulting list.

      Note that the head may be the node that gets deleted.
    inputFormat: |
      - Line 1: two integers `n` (the number of nodes) and `k`.
      - Line 2: `n` space-separated integers, the node values from head to tail.
    outputFormat: |
      Print the values of the list after the deletion, separated by spaces. Print an
      empty line if the list becomes empty.
    constraints:
      - "1 <= n <= 5000"
      - "1 <= k <= n"
      - "-10^5 <= node value <= 10^5"
    examples:
      - input: |
          5 2
          10 20 30 40 50
        output: |
          10 20 30 50
        explanation: "Counting from the tail: 50 is 1st, 40 is 2nd, so 40 is removed."
      - input: |
          3 3
          8 9 10
        output: |
          9 10
        explanation: "The 3rd node from the end is the head, so the new head is 9."
    hints:
      - "If you knew the length n, which position from the front would you delete?"
      - "Can you do it in one pass? Start a second pointer only after the first one is k nodes ahead."
      - "A dummy node before the head makes deleting the head no different from deleting any other node."
    explanation: |
      **Count then delete - O(n) time, O(1) space, two passes.** Count the length `n`,
      then walk to the node at position `n - k - 1` (0-indexed) and unlink its
      successor. Deleting the head (`k == n`) needs a special case unless you use a
      dummy node.

      **Two pointers, one pass - O(n) time, O(1) space.** Put a dummy node before the
      head. Move `fast` forward `k` nodes from the dummy. Then move `fast` and `slow`
      (starting at the dummy) together until `fast.next` is `None`. Now `slow` sits
      right before the node to delete, so set `slow.next = slow.next.next` and return
      `dummy.next`.
    starterCode:
