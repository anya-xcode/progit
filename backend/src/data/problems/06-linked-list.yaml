  - sheetId: prob-6-5-4-clone-a-ll-with-random-an
    slug: clone-a-ll-with-random-and-next-pointer
    title: "Clone a LL with random and next pointer"
    difficulty: Hard
    topic: "Linked List"
    subtopic: "Hard Problems of LL"
    tags: ["linked-list", "hashing"]
    sourceUrl: "https://leetcode.com/problems/copy-list-with-random-pointer/"
    statement: |
      You are given a singly linked list whose nodes have **two** references: the usual `next`
      and an extra `random`, which may point at any node of the same list or at nothing.

      Build a **deep copy** of it: a brand new list of new nodes with the same values, in the
      same order, whose `next` and `random` references mirror the original exactly - the copy
      of node `i` must point at the *copy* of whatever node `i` points at, never at an
      original node. Return the head of the copy.

      The original list must be left exactly as it was.

      The driver checks both of those things and prints the structure of the copy, so a
      solution that returns the original head, or one that lets the copy's `random`
      references leak into the original list, is detected.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes (may be `0`).
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
      - Line 3: `n` space-separated integers `r[0] ... r[n-1]`. The `random` reference of the
        node at position `i` points at the node at position `r[i]`, or at nothing when
        `r[i] = -1` (an empty line when `n = 0`).
    outputFormat: |
      - Line 1: `true` if the returned list is a genuine deep copy - it has `n` nodes, none of
        which is a node of the original, and the original list is unchanged - otherwise
        `false`.
      - Next `n` lines: for each node of the copy, from its head to its tail, its value and
        the 0-indexed position **within the copy** of the node its `random` points at, or `-1`
        when it points at nothing.

      Only the first line is printed when the list is empty.
    constraints:
      - "0 <= n <= 1000"
      - "-10^5 <= node value <= 10^5"
      - "r[i] = -1, or 0 <= r[i] < n"
    examples:
      - input: |
          5
          7 13 11 10 1
          -1 0 4 2 0
        output: |
          true
          7 -1
          13 0
          11 4
          10 2
          1 0
        explanation: "The copy has the same five values; for instance the copy of 13 points at the copy of 7 (position 0), and 7 itself points at nothing."
      - input: |
          3
          1 2 3
          -1 -1 -1
        output: |
          true
          1 -1
          2 -1
          3 -1
        explanation: "No node has a random target, so every line ends in -1 and only the next chain is copied."
    hints:
      - "If you could ask 'which copy corresponds to this original node?' in O(1), the whole problem would be two easy passes."
      - "A dictionary from original node to copied node answers that - at the cost of O(n) memory."
      - "To do it without the dictionary, store the answer inside the list itself: put each copy directly after its original, so the copy of any node x is always x.next."
    explanation: |
      The difficulty is the `random` references: when you copy node `i` you generally have not
      created the node it points at yet, and even later you need a way to translate "this
      original node" into "its copy".

      **Hash map from original to copy - O(n) time, O(n) space.** First pass: walk the list and
      create a copy of every node, storing `original -> copy` in a dictionary. Second pass:
      for each original, set `copy.next = map[original.next]` and
      `copy.random = map[original.random]`, using `None` when the reference is `None`. Clear
      and easy to get right; the dictionary is the only cost.

      **Interleaving the copies - O(n) time, O(1) extra space.** The trick is to use the list
      itself as the lookup table, in three passes:

      1. *Weave.* After every original node insert its copy:
         `A -> A' -> B -> B' -> C -> C'`. Now the copy of any node `x` is simply `x.next` -
         the dictionary, stored inside the links.
      2. *Wire the random references.* For each original `x`, `x.next.random = x.random.next`
         (and `None` if `x.random` is `None`). Read it slowly: `x.next` is the copy of `x`, and
         `x.random.next` is the copy of `x.random` - exactly the node the copy should point at.
      3. *Unweave.* Separate the two chains again, restoring every original's `next` and
         linking the copies to each other. This pass is where careless code leaves the original
         list mangled or the last copy pointing at an original, so handle the final node
         explicitly.

      Both run in linear time; the second uses O(1) extra memory beyond the copied list itself,
      which is what makes it the interesting answer.

      **What not to do.** Copying only the values and the `next` chain and then translating
      `random` by *position* means walking from the head for every node, which is O(n^2).
    starterCode:
      python: |
        import sys
        from typing import Optional


        class Node:
            def __init__(self, val: int = 0):
                self.val = val
                self.next: "Optional[Node]" = None
                self.random: "Optional[Node]" = None


        def copy_random_list(head: Optional[Node]) -> Optional[Node]:
            # Return the head of a deep copy of the list, with `random` references mirrored.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            values = [int(x) for x in data[1:1 + n]]
            randoms = [int(x) for x in data[1 + n:1 + 2 * n]]
            nodes = [Node(value) for value in values]
            for i in range(n - 1):
                nodes[i].next = nodes[i + 1]
            for i in range(n):
                nodes[i].random = nodes[randoms[i]] if randoms[i] != -1 else None
            head = nodes[0] if nodes else None

            copy = copy_random_list(head)

            ok = True
            node = head
            for i in range(n):
                target = nodes[randoms[i]] if randoms[i] != -1 else None
                if node is not nodes[i] or node.val != values[i] or node.random is not target:
                    ok = False
                    break
                node = node.next
            else:
                if node is not None:
                    ok = False

            originals = {id(original) for original in nodes}
            position = {}
            order = []
            node = copy
            while node is not None and len(order) <= n:
                if id(node) in originals:
                    ok = False
                position[id(node)] = len(order)
                order.append(node)
                node = node.next
            if len(order) != n:
                ok = False

            print("true" if ok else "false")
            for node in order[:n]:
                print(node.val, -1 if node.random is None else position.get(id(node.random), -1))


        if __name__ == "__main__":
            main()
