problems:
  - slug: middle-of-the-linked-list
    title: "Middle of the Linked List"
    difficulty: Easy
    topic: "Linked List"
    subtopic: "1D Linked List"
    tags: ["linked-list", "two-pointers"]
    sourceUrl: "https://leetcode.com/problems/middle-of-the-linked-list/"
    statement: |
      You are given the `head` of a singly linked list. Return the node that sits in
      the **middle** of the list.

      Number the nodes `0, 1, ..., n - 1` from the head. The middle node is the one
      at position `floor(n / 2)`. So when the list has an even number of nodes there
      are two central nodes and you must return the **second** of them.

      The program prints the list starting from the node you return.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes.
      - Line 2: `n` space-separated integers, the node values from head to tail.
    outputFormat: |
      Print the values of the list starting at the middle node and running to the
      tail, separated by spaces.
    constraints:
      - "1 <= n <= 1000"
      - "-10^5 <= node value <= 10^5"
    examples:
      - input: |
          5
          4 8 15 16 23
        output: |
          15 16 23
        explanation: "There are 5 nodes; position floor(5/2) = 2 holds 15."
      - input: |
          6
          7 1 9 3 5 2
        output: |
          3 5 2
        explanation: "There are 6 nodes; the two central nodes are 9 and 3, and the second one (3) is returned."
    hints:
      - "Counting the nodes first and then walking half-way works, but it takes two passes."
      - "Move one pointer one step at a time and another pointer two steps at a time."
      - "When the fast pointer can no longer take two steps, where is the slow pointer?"
    explanation: |
      **Copy into an array - O(n) time, O(n) space.** Store every node in a list and
      return the element at index `n // 2`.

      **Two passes - O(n) time, O(1) space.** Count the nodes, then walk `n // 2`
      steps from the head.

      **Slow and fast pointers - O(n) time, O(1) space.** Start both pointers at the
      head. While `fast` and `fast.next` exist, advance `slow` by one node and `fast`
      by two. When the loop stops, `fast` has covered twice the distance of `slow`,
      so `slow` is at position `n // 2` - the second middle for even lengths. This
      needs only a single pass.
