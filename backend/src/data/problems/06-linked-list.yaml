  - slug: detect-a-cycle-in-linked-list
    title: "Detect a Cycle in a Linked List"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "Medium Problems"
    tags: ["linked-list", "two-pointers", "hashing"]
    sourceUrl: "https://leetcode.com/problems/linked-list-cycle/"
    statement: |
      You receive the `head` of a singly linked list. The list may loop back on
      itself: the `next` pointer of some node can point to a node that appears
      earlier, so walking the list would never reach `None`.

      Decide whether such a loop exists. Return `True` if following `next` pointers
      from the head eventually revisits a node, and `False` if the walk ends.

      The input tells the driver how to build the list: `pos` is the 0-indexed
      position of the node that the tail's `next` pointer should point to, or `-1`
      if the tail points to nothing. Your function only receives the head, not `pos`.
    inputFormat: |
      - Line 1: two integers `n` and `pos`.
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Print `true` if the list contains a cycle, otherwise `false`.
    constraints:
      - "0 <= n <= 10^4"
      - "-10^5 <= node value <= 10^5"
      - "pos = -1 or 0 <= pos < n"
    examples:
      - input: |
          4 1
          5 10 15 20
        output: |
          true
        explanation: "The tail (20) links back to the node at position 1 (10), forming the loop 10 -> 15 -> 20 -> 10."
      - input: |
          3 -1
          1 2 3
        output: |
          false
        explanation: "The tail points to nothing, so the walk 1 -> 2 -> 3 ends."
    hints:
      - "Remembering every node you have visited in a set answers the question, but costs O(n) memory."
      - "Picture two runners on a track, one twice as fast as the other. If the track is a loop, what must happen?"
      - "Advance one pointer by one node and another by two. If they ever point to the same node, there is a cycle."
    explanation: |
      **Hash set of nodes - O(n) time, O(n) space.** Walk the list and store each
      node object (not its value - values can repeat). If you meet a node already in
      the set, there is a cycle; reaching `None` means there is not.

      **Floyd's tortoise and hare - O(n) time, O(1) space.** Move `slow` one step and
      `fast` two steps per iteration. Without a cycle, `fast` reaches the end. With a
      cycle, once both pointers are inside the loop the gap between them shrinks by
      exactly one node per iteration, so `fast` must land on `slow` within one lap.
