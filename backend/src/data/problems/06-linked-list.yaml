  - sheetId: prob-6-1-4-find-the-length-of-the-li
    slug: find-the-length-of-the-linked-list
    title: "Find the length of the Linked List"
    difficulty: Easy
    topic: "Linked List"
    subtopic: "Learn 1D LinkedList"
    tags: ["linked-list", "traversal"]
    sourceUrl: ""
    statement: |
      You are given the head of a singly linked list. Return **how many nodes it contains**.

      A linked list does not store its size anywhere: unlike an array, there is no index and
      no length field. The only way to find out is to follow `next` references from the head
      until you fall off the end.

      An empty list (`head` is `None`) has length `0`.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes (may be `0`).
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Print a single integer: the number of nodes in the list.
    constraints:
      - "0 <= n <= 1000"
      - "-10^5 <= node value <= 10^5"
    examples:
      - input: |
          4
          5 6 7 8
        output: |
          4
        explanation: "Walking 5 -> 6 -> 7 -> 8 visits four nodes before reaching None."
      - input: |
          0
        output: |
          0
        explanation: "The head is None, so the walk never starts and the length is 0."
    hints:
      - "Start a counter at 0 and a walker at the head."
      - "The loop condition is `while node is not None`, not `while node.next is not None` - think about which one counts the last node."
      - "Recursion works too: an empty list has length 0, and any other list is 1 + the length of the rest."
    explanation: |
      **Iterative traversal - O(n) time, O(1) space.** Set `count = 0` and `node = head`.
      While `node` is not `None`, add one to `count` and move `node = node.next`. When the
      walk ends, `count` is the answer. Using `while node.next is not None` instead is the
      classic off-by-one: it stops on the last node and reports `n - 1`, and it crashes on an
      empty list.

      **Recursion - O(n) time, O(n) space.** `length(None) = 0` and
      `length(node) = 1 + length(node.next)`. Elegant, but every node costs a stack frame, so
      a long list can exhaust the call stack. The loop is strictly better here.

      There is no way to beat O(n) with only a head reference - the nodes are scattered in
      memory and nothing summarises them. If a program needs the length often, the usual fix
      is to wrap the list in a class that keeps a `size` field updated on every insert and
      delete, turning the query into O(1).
