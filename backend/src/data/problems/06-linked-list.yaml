      python: |
        import sys
        from typing import Optional


        class ListNode:
            def __init__(self, val: int = 0, next: "Optional[ListNode]" = None):
                self.val = val
                self.next = next


        def add_two_numbers(l1: Optional[ListNode], l2: Optional[ListNode]) -> Optional[ListNode]:
            dummy = ListNode()
            tail = dummy
            carry = 0
            while l1 is not None or l2 is not None or carry:
                total = carry
                if l1 is not None:
                    total += l1.val
                    l1 = l1.next
                if l2 is not None:
                    total += l2.val
                    l2 = l2.next
                carry, digit = divmod(total, 10)
                tail.next = ListNode(digit)
                tail = tail.next
            return dummy.next


        # --- Input/output handling ---
        def build_list(values):
            dummy = ListNode()
            tail = dummy
            for value in values:
                tail.next = ListNode(value)
                tail = tail.next
            return dummy.next


        def print_list(head):
            out = []
            while head is not None:
                out.append(str(head.val))
                head = head.next
            print(" ".join(out))


        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            l1 = build_list([int(x) for x in data[1:1 + n]])
            m = int(data[1 + n])
            l2 = build_list([int(x) for x in data[2 + n:2 + n + m]])
            print_list(add_two_numbers(l1, l2))


        if __name__ == "__main__":
            main()
