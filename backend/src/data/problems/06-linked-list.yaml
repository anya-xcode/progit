      - "Maintain two chains while you walk: one for odd positions and one for even positions."
      - "Remember the head of the even chain so you can attach it after the last odd node."
    explanation: |
      **Two arrays - O(n) time, O(n) space.** Collect the values at odd and even
      positions separately, then write them back into the nodes in the new order.

      **Relink in place - O(n) time, O(1) space.** Let `odd = head`,
      `even = head.next` and remember `even_head = even`. While `even` and
      `even.next` exist: link `odd.next = even.next`, move `odd` forward, link
      `even.next = odd.next`, move `even` forward. Each node is visited once. Finally
      connect `odd.next = even_head`. Empty and one-node lists are returned unchanged.
