  - sheetId: prob-6-3-12-sort-a-linked-list-of-0s-
    slug: sort-a-linked-list-of-0-s-1-s-and-2-s
    title: "Sort a Linked List of 0's 1's and 2's"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "Medium Problems of LL"
    tags: ["linked-list", "sorting", "partitioning"]
    sourceUrl: ""
    statement: |
      You are given the head of a singly linked list in which **every value is `0`, `1` or
      `2`**. Rearrange it so that all the `0`s come first, then all the `1`s, then all the
      `2`s, and return the head of the result.

      Because there are only three distinct values, the list can be sorted in a **single
      pass** - and the intended solution does it by relinking nodes, not by overwriting their
      values.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes (may be `0`).
      - Line 2: `n` space-separated integers, each `0`, `1` or `2`
        (an empty line when `n = 0`).
    outputFormat: |
      Print the values of the sorted list, from head to tail, separated by single spaces.
      Print an empty line if the list is empty.
    constraints:
      - "0 <= n <= 5000"
      - "node value is 0, 1 or 2"
    examples:
      - input: |
          7
          1 0 2 1 0 2 0
        output: |
          0 0 0 1 1 2 2
        explanation: "There are three 0s, two 1s and two 2s, so the sorted list is 0 0 0 1 1 2 2."
      - input: |
          4
          2 2 1 1
        output: |
          1 1 2 2
        explanation: "No 0 is present, so the 1s come first and the 2s follow."
    hints:
      - "Counting how many of each value there are is enough to know the answer - but can you get there without rewriting the values?"
      - "Build three separate lists while walking once, then join them."
      - "Use a dummy head for each of the three lists so appending never needs an 'is it empty?' check, and remember to terminate the final list."
    explanation: |
      **Counting pass - O(n) time, O(1) space, two passes.** Count the `0`s, `1`s and `2`s,
      then walk the list again writing that many `0`s, then `1`s, then `2`s into the nodes.
      Short and fast, but it overwrites payloads instead of moving nodes, which is not
      acceptable when the nodes carry more than the number you are sorting on.

      **General sorting - O(n log n) time.** Merge sort works, but it ignores the fact that
      there are only three distinct keys.

      **Three chains, one pass - O(n) time, O(1) space.** Keep three dummy heads - `zero`,
      `one`, `two` - each with its own tail reference. Walk the original list once and append
      every node to the chain matching its value, saving `node.next` first because you are
      about to overwrite it. Then stitch the chains together:

      - `tail_one.next = two.next` (the first real `2`, or `None` if there are none);
      - `tail_zero.next = one.next` (the first real `1`, which already leads into the `2`s);
      - return `zero.next`.

      Doing it in this order means a missing group simply contributes `None` and is skipped
      automatically. The one detail that must not be forgotten is cutting each node loose when
      it is appended (`node.next = None`), otherwise the last `2` still points at whatever
      followed it in the original list and the result ends in a loop.

      One pass, three extra references per group, no allocation - this is the linked-list
      counterpart of the Dutch national flag partition.
