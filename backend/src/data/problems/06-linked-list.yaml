      the node after it and `prev` to the node before it. The first node's `prev` and the
      last node's `next` are `None`. Because both directions are linked, the list can be
      walked from either end - and every change has to keep *both* sets of references
      consistent.

      You are given the values of a list in order. Build a doubly linked list out of them -
      one node per value, in the same order, with both `next` and `prev` set correctly - and
      return its head. Return `None` when there are no values.

      The `Node` class is already defined for you above the driver.

      To check that the backward references really are there, the driver walks your list
      forward to find the tail and then walks back from the tail using `prev` only. Both
      walks are printed, so a list with correct `next` references but missing `prev`
      references will fail.
    inputFormat: |
      - Line 1: an integer `n`, the number of values (may be `0`).
      - Line 2: `n` space-separated integers, the values in order
        (an empty line when `n = 0`).
    outputFormat: |
      Two lines:

      - Line 1: the values from head to tail, following `next`, separated by spaces.
      - Line 2: the values from tail back to head, following `prev`, separated by spaces.

      Both lines are empty when the list is empty.
    constraints:
      - "0 <= n <= 1000"
      - "-10^5 <= value <= 10^5"
    examples:
      - input: |
          4
          2 4 6 8
        output: |
          2 4 6 8
          8 6 4 2
        explanation: "Forward the nodes read 2 4 6 8; starting from the tail and following prev they read 8 6 4 2."
      - input: |
          1
          7
        output: |
          7
          7
        explanation: "One node is both head and tail, and both of its references are None, so each walk prints just 7."
    hints:
      - "Each new node has to be linked in twice: the old tail's `next` points at it, and its own `prev` points back at the old tail."
      - "Keep a reference to the tail so appending stays O(1)."
      - "The first node is the only one whose `prev` stays None - a dummy node in front removes that special case."
    explanation: |
      **One pass with a tail reference - O(n) time, O(n) space.** Keep `head` and `tail`.
      For each value create `node`; if `tail` is `None` this is the first node, so it becomes
      both `head` and `tail`. Otherwise write both links - `tail.next = node` **and**
      `node.prev = tail` - before moving `tail = node`. Forgetting the second assignment is
      the classic mistake: the forward walk looks perfect while the backward walk stops
      immediately.

      **With a dummy node - O(n) time, O(n) space.** Start from a throw-away node, append
      everything after it exactly the same way, then detach: `head = dummy.next` and, if it
      exists, `head.prev = None`. No special case for the first insertion.

      Both are optimal - the `n` nodes have to be allocated - and they only differ in how the
      first node is handled.

      **Why the second reference is worth its memory.** Each node costs one extra reference,
      but it buys O(1) deletion of a node you already hold (a singly linked list first has to
      find the predecessor, which costs O(n)), and it lets you walk backwards from the tail.
      That is exactly what the two-pointer scan over a sorted doubly linked list needs, and
      why an LRU cache is built on one.
