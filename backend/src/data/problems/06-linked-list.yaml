    tags: ["linked-list", "sorting", "divide-and-conquer"]
    sourceUrl: "https://leetcode.com/problems/sort-list/"
    statement: |
      You are given the head of a singly linked list. **Sort it into non-decreasing order**
      and return the head of the sorted list.

      Values may repeat. Sort the list by relinking its nodes - the intended solution runs in
      O(n log n) time and uses only O(log n) extra memory for the recursion, without copying
      the values into another container.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes (may be `0`).
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Print the values of the sorted list, from head to tail, separated by single spaces.
      Print an empty line if the list is empty.
    constraints:
      - "0 <= n <= 5000"
      - "-10^5 <= node value <= 10^5"
    examples:
      - input: |
          6
          4 2 1 3 6 5
        output: |
          1 2 3 4 5 6
        explanation: "The six values sorted in non-decreasing order are 1 2 3 4 5 6."
      - input: |
          5
          -1 5 3 -4 0
        output: |
          -4 -1 0 3 5
        explanation: "Negative values sort before the others, giving -4 -1 0 3 5."
    hints:
      - "Which classic sort never needs random access and merges two already-sorted sequences?"
      - "Splitting the list in half is the slow/fast pointer trick - and remember to cut the first half loose by setting the predecessor's `next` to None."
      - "Merging two sorted lists is a single walk with a dummy node in front of the result."
    explanation: |
      **Collect, sort, rewrite - O(n log n) time, O(n) space.** Copy all values into an
      array, sort it, and walk the list again writing them back. Easy and fast in practice,
      but it needs a second copy of the data and does not use the list structure at all.

      **Insertion sort on the list - O(n^2) time, O(1) space.** Take nodes one by one and
      splice each into the correct place of a growing sorted prefix. Fine for tiny or nearly
      sorted lists, far too slow otherwise.

      **Merge sort on the list - O(n log n) time, O(log n) space.** This is the natural fit:
      merging only ever looks at the front of two sequences, which is exactly what a linked
      list offers, and unlike an array version it needs no scratch buffer.

      1. *Base case.* A list with 0 or 1 nodes is already sorted.
      2. *Split.* Find the node just before the middle with slow and fast pointers started at
         `head` and `head.next`, then cut: `right = slow.next; slow.next = None`. Starting
         `fast` one node ahead is what guarantees both halves are non-empty for `n == 2`, so
         the recursion cannot loop forever.
      3. *Sort both halves recursively.*
      4. *Merge.* Walk both sorted halves with a dummy node in front of the result, always
         appending the smaller front node; take the left one on ties to keep the sort stable.
         Attach whatever is left over and return `dummy.next`.

      Each level of recursion touches every node once and there are `log n` levels, giving
      O(n log n) time; the only extra memory is the O(log n) call stack.
