      python: |
        import sys
        from typing import Optional


        class ListNode:
            def __init__(self, val: int = 0, next: "Optional[ListNode]" = None):
                self.val = val
                self.next = next


        def reverse_in_groups(head: Optional[ListNode], k: int) -> Optional[ListNode]:
            dummy = ListNode(0, head)
            group_prev = dummy
            while True:
                kth = group_prev
                for _ in range(k):
                    kth = kth.next
                    if kth is None:
                        return dummy.next
                group_next = kth.next
                prev = group_next
                curr = group_prev.next
                while curr is not group_next:
                    nxt = curr.next
                    curr.next = prev
                    prev = curr
                    curr = nxt
                new_group_prev = group_prev.next
                group_prev.next = kth
                group_prev = new_group_prev


        # --- Input/output handling ---
        def build_list(values):
            dummy = ListNode()
            tail = dummy
            for value in values:
                tail.next = ListNode(value)
                tail = tail.next
            return dummy.next


        def print_list(head):
            out = []
            while head is not None:
                out.append(str(head.val))
                head = head.next
            print(" ".join(out))


        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            head = build_list([int(x) for x in data[2:2 + n]])
            print_list(reverse_in_groups(head, k))


        if __name__ == "__main__":
            main()
