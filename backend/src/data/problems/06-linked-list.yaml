    slug: find-the-intersection-point-of-y-ll
    title: "Find the intersection point of Y LL"
    difficulty: Medium
    topic: "Linked List"
    subtopic: "Medium Problems of LL"
    tags: ["linked-list", "two-pointers"]
    sourceUrl: "https://leetcode.com/problems/intersection-of-two-linked-lists/"
    statement: |
      Two singly linked lists may **share a tail**: from some node on, they are literally the
      same nodes. Drawn on paper the picture looks like the letter Y - two separate arms that
      merge and continue as one.

      Given the heads of both lists, return the **first node they have in common**, or `None`
      if they never merge. "In common" means the same node object, not merely the same value:
      two nodes holding `17` are not the intersection unless they are the same node.

      The driver builds the shape from three groups of values: the part that belongs only to
      the first list, the part that belongs only to the second, and the shared tail. Once
      either list reaches the shared part, both continue through exactly the same nodes.
    inputFormat: |
      - Line 1: three integers `a`, `b` and `c` - the number of nodes before the merge in the
        first list, the number before the merge in the second list, and the number of shared
        nodes.
      - Line 2: `a` space-separated integers, the values of the first list's own part
        (an empty line when `a = 0`).
      - Line 3: `b` space-separated integers, the values of the second list's own part
        (an empty line when `b = 0`).
      - Line 4: `c` space-separated integers, the values of the shared tail
        (an empty line when `c = 0`, i.e. the lists do not merge).
    outputFormat: |
      Print the value stored in the first shared node, or `-1` if the two lists have no node
      in common. All node values are positive, so `-1` is unambiguous.
    constraints:
      - "0 <= a, b <= 5000"
      - "0 <= c <= 5000"
      - "a + c >= 1 and b + c >= 1 (neither list is empty)"
      - "1 <= node value <= 10^5"
    examples:
      - input: |
          2 3 3
          1 2
          9 8 7
          50 60 70
        output: |
          50
        explanation: "The first list is 1 2 50 60 70 and the second is 9 8 7 50 60 70; they merge at the node holding 50."
      - input: |
          3 2 0
          1 2 3
          4 5
        output: |
          -1
        explanation: "There is no shared tail, so the lists run to their own ends and never meet."
    hints:
      - "Putting every node of the first list in a set and then walking the second list finds it immediately - at the cost of O(n) memory."
      - "If the two lists were the same length, walking them in lockstep would land on the intersection together. How do you make them the same length?"
      - "Let each pointer, when it falls off the end of its own list, restart at the head of the other list. After how many steps have both walked exactly the same distance?"
    explanation: |
      Let the two arms have lengths `a` and `b` and the shared tail length `c`.

      **Hash set of nodes - O(a + b + c) time, O(a + c) space.** Store every node of the first
      list in a set (by identity), then walk the second and return the first node found in the
      set.

      **Difference of lengths - O(a + b + c) time, O(1) space.** Count both lists, advance a
      pointer in the longer one by `|(a + c) - (b + c)| = |a - b|` nodes, then move both
      pointers together; they reach the merge point at the same moment. Needs three passes and
      a length computation.

      **Two pointers that switch lists - O(a + b + c) time, O(1) space.** Start `p` at the
      first head and `q` at the second and advance both by one node. When a pointer runs off
      the end, restart it at the *other* list's head. Each pointer then walks
      `a + c` and `b + c` in some order, so after `a + b + c` steps both have travelled the
      same total distance and they stand on the same node - the intersection. If the lists
      never merge, both pointers become `None` after `a + c + b + c` steps... but with the
      usual formulation (move to the other head only when the pointer is `None`, comparing
      before moving) they become `None` at the same time, the comparison `p is q` succeeds
      with both equal to `None`, and the loop ends with the correct answer of "no
      intersection". Two references, one loop, no length counting.

      The only real trap is comparing values instead of node identity: repeated values would
      report a merge that does not exist.
