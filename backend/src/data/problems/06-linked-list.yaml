  - sheetId: prob-6-4-1-delete-all-occurrences-of
    slug: delete-all-occurrences-of-a-key-in-dll
    title: "Delete all occurrences of a key in DLL"
    difficulty: Hard
    topic: "Linked List"
    subtopic: "Medium Problems of DLL"
    tags: ["doubly-linked-list", "deletion"]
    sourceUrl: ""
    statement: |
      In a **doubly linked list** every node stores a value plus two references: `next` to
      the node after it and `prev` to the node before it. The first node's `prev` and the
      last node's `next` are `None`, so the list can be walked from either end - and every
      change has to keep both directions consistent.

      You are given the head of a doubly linked list and a value `key`.

      **Remove every node whose value equals `key`** and return the head of what is left. The
      surviving nodes keep their relative order, and the result must still be a valid doubly
      linked list: the new head's `prev` and the new tail's `next` are `None`, and the two
      walks must agree.

      Every occurrence has to go, including runs of consecutive matches, the head and the
      tail. If all the nodes match, the answer is an empty list.
    inputFormat: |
      - Line 1: two integers `n` (the number of nodes, may be `0`) and `key`.
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Two lines:

      - Line 1: the remaining values from head to tail, following `next`.
      - Line 2: the same list from tail back to head, following `prev`.

      Both lines are empty when every node was removed.
    constraints:
      - "0 <= n <= 5000"
      - "-10^5 <= node value, key <= 10^5"
    examples:
      - input: |
          7 2
          1 2 3 2 2 4 2
        output: |
          1 3 4
          4 3 1
        explanation: "All four nodes holding 2 are unlinked, including the tail, leaving 1 3 4 - which reads 4 3 1 backwards."
      - input: |
          4 5
          5 5 5 5
        output: ""
        explanation: "Every node matches the key, so the list becomes empty and both walks print nothing."
    hints:
      - "Save `node.next` before you unlink a node - you are about to destroy the reference you were going to walk on."
      - "Removing a node is two assignments: its predecessor skips over it and its successor points back past it. Both neighbours may be missing."
      - "When the node being removed is the head, the head reference itself has to move - which is why the function returns the head."
    explanation: |
      **Rebuild from the values - O(n) time, O(n) space.** Read the values into an array,
      filter out the key and build a fresh doubly linked list. Straightforward, but it
      allocates a second list and throws away the original nodes.

      **Unlink in place, one pass - O(n) time, O(1) space.** Walk from the head. For each
      node, first save `nxt = node.next`, because unlinking is about to clear it. If the value
      matches:

      - if `node.prev` exists, `node.prev.next = node.next`; otherwise the node is the current
        head, so the head reference moves to `node.next`;
      - if `node.next` exists, `node.next.prev = node.prev` - this is the assignment that is
        easy to forget, and it is what stops the backward walk from running through deleted
        nodes;
      - clear `node.prev` and `node.next` so the removed node no longer refers into the list.

      Then continue with `node = nxt`. Consecutive matches need no special treatment: by the
      time the second one is examined, its `prev` already points at the last surviving node,
      so the same two assignments are still correct. Deleting the tail is covered by the
      `node.next is None` branch, and deleting everything leaves `head` as `None`.

      One pass, a couple of references, and no allocation - optimal, since every node has to
      be inspected at least once.

      **A sentinel head** (a dummy node permanently in front of the list) removes the
      "node is the head" special case entirely; it is the standard trick when many deletions
      are expected.
    starterCode:
      python: |
