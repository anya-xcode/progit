    statement: |
      Given the `head` of a singly linked list, number the nodes by **position**
      starting at 1 for the head. Rearrange the list so that all nodes at odd
      positions (1st, 3rd, 5th, ...) come first, followed by all nodes at even
      positions (2nd, 4th, ...).

      Within each group the nodes must keep their original relative order. The
      grouping depends on positions, not on whether the values are odd or even.

      Do it by relinking nodes, using O(1) extra space.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes (may be `0`).
      - Line 2: `n` space-separated integers, the node values from head to tail
        (an empty line when `n = 0`).
    outputFormat: |
      Print the values of the rearranged list separated by spaces. Print an empty
      line if the list is empty.
    constraints:
