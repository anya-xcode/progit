  - sheetId: prob-6-4-3-remove-duplicates-from-so
    slug: remove-duplicates-from-sorted-dll
    title: "Remove duplicates from sorted DLL"
    difficulty: Hard
    topic: "Linked List"
    subtopic: "Medium Problems of DLL"
    tags: ["doubly-linked-list", "two-pointers"]
    sourceUrl: ""
    statement: |
      In a **doubly linked list** every node stores a value plus two references: `next` to
      the node after it and `prev` to the node before it. The first node's `prev` and the
      last node's `next` are `None`, so the list can be walked from either end - and every
      change has to keep both directions consistent.

      You are given the head of a doubly linked list whose values are **sorted in
      non-decreasing order**, so equal values always sit next to each other.

      **Keep only the first node of every run of equal values** and remove the rest, so that
      each value appears exactly once. Return the head of the resulting list, which must still
      be a valid doubly linked list in both directions.

      Relink the existing nodes; do not build a new list.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes (may be `0`).
      - Line 2: `n` space-separated integers in non-decreasing order, the node values from
        head to tail (an empty line when `n = 0`).
    outputFormat: |
      Two lines:

      - Line 1: the de-duplicated values from head to tail, following `next`.
      - Line 2: the same list from tail back to head, following `prev`.

      Both lines are empty when the list is empty.
    constraints:
      - "0 <= n <= 5000"
      - "-10^5 <= node value <= 10^5"
      - "The values are non-decreasing."
    examples:
      - input: |
          8
          1 1 2 3 3 3 4 5
        output: |
          1 2 3 4 5
          5 4 3 2 1
        explanation: "The runs of 1s and 3s collapse to a single node each, leaving 1 2 3 4 5."
      - input: |
          5
          7 7 7 7 7
        output: |
          7
          7
        explanation: "Every node holds the same value, so only the first one survives."
    hints:
      - "Since the list is sorted, a duplicate can only ever be the node directly after the one you are standing on."
      - "Skip the whole run at once: keep advancing a second reference while it holds the same value, then link the survivor straight to it."
      - "Whenever you set `a.next = b`, the matching `b.prev = a` must follow - unless `b` is None."
    explanation: |
      **Set of seen values - O(n) time, O(n) space.** Walk the list and delete any node whose
      value has been seen before. This is what you would need for an *unsorted* list, but on a
      sorted one the memory is wasted.

      **Skip runs in one pass - O(n) time, O(1) space.** Sorted means all copies of a value
      form one contiguous run, so the survivor of a run is its first node. Stand on `node` and
      let `nxt` run forward while `nxt.val == node.val`. When it stops, `nxt` is the first node
      with a different value (or `None`):

      - link over the whole run at once: `node.next = nxt`;
      - restore the backward direction: if `nxt` is not `None`, `nxt.prev = node`.

      Then continue from `nxt`. Skipping a run in one step rather than deleting one node at a
      time keeps the pointer surgery to two assignments per distinct value, and the `prev`
      fix-up is what keeps the backward walk honest - forget it and the second output line
      still shows the duplicates that the forward walk no longer sees.

      Every node is visited once by either `node` or `nxt`, so it is O(n) time and constant
      extra memory, which is the best possible.

      **Using both directions.** Nothing here needs `prev` for *finding* anything - the
      challenge of the doubly linked version is purely keeping the second set of references
      correct while nodes disappear.
