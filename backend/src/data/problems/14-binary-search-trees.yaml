  - slug: floor-and-ceil-in-a-bst
    title: "Floor and Ceil in a BST"
    difficulty: Easy
    topic: "Binary Search Trees"
    subtopic: "Concepts"
    tags: [bst, tree, binary-search]
    sourceUrl: ""
    statement: |
      Given a non-empty binary search tree with distinct values and an integer
      `key`, find:

      - the **floor** of `key`: the largest value in the tree that is `<= key`;
      - the **ceil** of `key`: the smallest value in the tree that is `>= key`.

      If no value qualifies for the floor (or ceil), report `-1` for it.
    inputFormat: |
      - Line 1: level-order values of the BST (`N` for a missing child).
      - Line 2: the integer `key`.
    outputFormat: |
      Print two integers separated by a space: the floor and the ceil of `key` (`-1` when one does not exist).
    constraints:
      - "1 <= number of nodes <= 1000"
      - "1 <= node value, key <= 10^5"
      - "All node values are distinct"
    examples:
      - input: |
          8 4 12 2 6 10 14
          11
        output: |
          10 12
        explanation: "10 is the largest value not above 11, and 12 is the smallest value not below 11."
      - input: |
          8 4 12 2 6 10 14
          1
        output: |
          -1 2
        explanation: "Every value is larger than 1, so there is no floor; the ceil is the minimum, 2."
    hints:
      - "An inorder traversal gives a sorted list — but can you avoid visiting every node?"
      - "While walking down, every node with value <= key is a floor candidate, and moving right can only find a better one."
      - "If a node equals the key, it is both the floor and the ceil."
    explanation: |
      **Sorted list — O(n) time, O(n) space.** Collect values with an inorder
      traversal and binary search (or scan) for the floor and ceil.

      **Two BST descents — O(h) time, O(1) space.** For the floor, start at the root:
      if `node.val == key` it is the answer; if `node.val < key` record it as the
      best floor so far and go right (a larger candidate may exist); otherwise go
      left. The ceil is symmetric: record nodes with `node.val > key` and go left.
      Both walks visit at most `h` nodes.
    starterCode:
      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def floor_and_ceil(root: Optional[TreeNode], key: int) -> List[int]:
            # Return [floor, ceil] of key, using -1 when a value does not exist.
            pass


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
            root = build_tree(lines[0].split())
            key = int(lines[1])
            print(" ".join(map(str, floor_and_ceil(root, key))))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def floor_and_ceil(root: Optional[TreeNode], key: int) -> List[int]:
            floor_value, ceil_value = -1, -1
            node = root
            while node:
                if node.val == key:
                    return [key, key]
                if node.val < key:
                    floor_value = node.val
                    node = node.right
                else:
                    node = node.left
            node = root
            while node:
                if node.val > key:
                    ceil_value = node.val
                    node = node.left
                else:
                    node = node.right
            return [floor_value, ceil_value]


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
            root = build_tree(lines[0].split())
            key = int(lines[1])
            print(" ".join(map(str, floor_and_ceil(root, key))))


        if __name__ == "__main__":
            main()
