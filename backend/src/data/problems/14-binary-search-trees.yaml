    referenceSolution:
      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def bst_from_preorder(preorder: List[int]) -> Optional[TreeNode]:
            if not preorder:
                return None
            root = TreeNode(preorder[0])
            stack = [root]
            for value in preorder[1:]:
                node = TreeNode(value)
                parent = stack[-1]
                if value < parent.val:
                    parent.left = node
                else:
                    while stack and stack[-1].val < value:
                        parent = stack.pop()
                    parent.right = node
                stack.append(node)
            return root


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
            data = " ".join(lines).split()
            n = int(data[0])
            preorder = [int(x) for x in data[1:1 + n]]
            root = bst_from_preorder(preorder)
            tokens: List[str] = []
            queue: List[Optional[TreeNode]] = [root]
            head = 0
            while head < len(queue):
                node = queue[head]
                head += 1
                if node is None:
                    tokens.append("N")
                    continue
                tokens.append(str(node.val))
                queue.append(node.left)
                queue.append(node.right)
            while tokens and tokens[-1] == "N":
                tokens.pop()
            print(" ".join(tokens))


        if __name__ == "__main__":
            main()
