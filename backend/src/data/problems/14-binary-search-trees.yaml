    slug: correct-bst-with-two-nodes-swapped
    title: "Recover a BST with Two Swapped Nodes"
    difficulty: Hard
    topic: "Binary Search Trees"
    subtopic: "Practice Problems"
    tags: [bst, tree, inorder]
    sourceUrl: "https://leetcode.com/problems/recover-binary-search-tree/"
    statement: |
      Someone took a valid binary search tree with distinct values and **exchanged
      the values of exactly two of its nodes**. The shape of the tree was not
      touched, only those two values.

      Put the two values back where they belong, so the tree is a valid BST again,
      and do it **without changing any pointer** — only the two values move. There
      is exactly one way to do this, so the answer is unique.

      The driver prints the repaired tree in level-order form.
    inputFormat: |
      A single line with the level-order values of the damaged tree, using `N` for a missing child. The tree has at least two nodes.
    outputFormat: |
      Print the level-order values of the repaired tree on one line, using `N` for a missing child of an existing node and dropping the trailing `N`s.
    constraints:
      - "2 <= number of nodes <= 2000"
      - "1 <= node value <= 10^5, and all node values are distinct"
      - "The tree becomes a valid BST after exchanging the values of exactly two nodes"
    examples:
      - input: |
          3 1 4 N N 2
        output: |
          2 1 4 N N 3
        explanation: "Inorder the tree reads 1 3 2 4, which should be 1 2 3 4. Exchanging the values 3 and 2 repairs it and leaves the shape untouched."
      - input: |
          10 15 5 3 7 N 18
        output: |
          10 5 15 3 7 N 18
        explanation: "Inorder the tree reads 3 15 7 10 5 18, which should be 3 5 7 10 15 18. The values 15 and 5 have traded places; putting them back makes the sequence increasing again."
    hints:
      - "Walk the tree inorder and watch for a place where the previous value is larger than the current one."
      - "Two swapped nodes produce either two such places (they are far apart) or exactly one (they are neighbours in the inorder order)."
      - "Record the larger value of the first violation and the smaller value of the last violation, then exchange them."
    explanation: |
      **Sort the inorder values — O(n log n) time, O(n) space.** Collect the inorder
      sequence, sort a copy, compare position by position: exactly two positions
      differ, and writing the sorted values back into the nodes in inorder fixes the
      tree. Simple, correct, and more work than necessary.

      **One inorder pass — O(n) time, O(h) space.** The inorder sequence of a valid
      BST is strictly increasing, so the damage shows up as *descents*. Walk inorder
      keeping a `previous` node and look for `previous.val > current.val`:

      - the **first** such violation gives two candidates — `previous` (the value
        that is too large) and `current` (the value that is too small);
      - if a **second** violation occurs later, the misplaced values are far apart:
        the answer is `first_violation.previous` and `second_violation.current`;
      - if there is only one violation, the two swapped nodes are adjacent in the
        inorder order and the answer is the two nodes of that single violation.

      Exchange those two values and stop. One traversal, no array, and only the
      traversal's own stack as memory.

      **Why exactly one or two violations.** Exchanging two entries of an increasing
      sequence creates a descent at each end of the disturbed region; when the two
      entries are neighbours the two descents coincide into a single one. That case
      is the one most solutions get wrong — test it deliberately.

      **O(1) space.** Replacing the stack with a Morris inorder traversal keeps the
      same logic and removes the last of the extra memory, at the cost of
      temporarily threading right pointers.
