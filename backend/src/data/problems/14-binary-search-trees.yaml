  - sheetId: prob-14-2-10-merge-2-bsts
    slug: merge-2-bst-s
    title: "Merge Two BSTs into a Sorted List"
    difficulty: Hard
    topic: "Binary Search Trees"
    subtopic: "Practice Problems"
    tags: [bst, tree, two-pointers, iterator]
    sourceUrl: ""
    statement: |
      You are given two binary search trees. Produce **all** of their values, from
      both trees together, in non-decreasing order.

      Values may repeat — a value can appear in both trees, in which case it must
      appear twice in the answer. The total number of printed values is exactly the
      number of nodes in the first tree plus the number of nodes in the second.

      The interesting part is doing it in `O(n + m)` without sorting anything: each
      tree already hands you its values in sorted order, one at a time, if you walk
      it inorder.
    inputFormat: |
      - Line 1: level-order values of the first BST (`N` for a missing child; the empty tree is `N`).
      - Line 2: level-order values of the second BST, in the same format.
    outputFormat: |
      Print all values of both trees on one line, space-separated, in non-decreasing order. Print an empty line if both trees are empty.
    constraints:
      - "0 <= number of nodes in each tree <= 2000"
      - "-10^5 <= node value <= 10^5"
      - "Each tree is a valid BST; values are distinct inside a tree but may repeat between the two"
    examples:
      - input: |
          5 2 8
          9 4 11
        output: |
          2 4 5 8 9 11
        explanation: "The first tree reads 2 5 8 inorder and the second reads 4 9 11, and merging the two sorted sequences gives 2 4 5 8 9 11."
      - input: |
          3
          N
        output: |
          3
        explanation: "The second tree is empty, so the answer is just the inorder traversal of the first."
    hints:
      - "The inorder traversal of a BST is already sorted — you never need a sort."
      - "Two sorted sequences are combined by the merge step of merge sort: compare the two fronts and take the smaller one."
      - "To avoid materialising both lists, drive each tree with its own iterator: a stack holding the path to the next smallest node."
    explanation: |
      **Collect and sort — O((n + m) log(n + m)) time.** Gather all values and call
      `sort`. It works, and it wastes the fact that both inputs were already
      ordered.

      **Two inorder lists + merge — O(n + m) time, O(n + m) space.** Flatten each
      tree with an inorder traversal, which gives two sorted lists, then merge them
      with two indices exactly as in merge sort: compare the two current values,
      append the smaller, advance that index, and append whatever remains when one
      list runs out. Linear and easy to defend.

      **Two BST iterators — O(n + m) time, O(h1 + h2) space.** The same merge
      without ever building the lists. An iterator over a BST keeps a stack holding
      the path to the next smallest node: push the whole left spine, and on `next()`
      pop a node, push the left spine of its right child, and return its value. Each
      node is pushed and popped once, so `next()` costs `O(1)` amortised and the
      stack never exceeds the height. Run one iterator per tree and take the smaller
      front each time. This is the version worth knowing — it also answers "merge
      k sorted streams" and "k-th smallest across two BSTs" without extra memory.

      **Why ties must be kept.** A value present in both trees appears twice in the
      output. Deduplicating would change the length of the answer, so the merge
      takes from one side on a tie and leaves the other for the next step.
