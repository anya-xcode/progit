        import sys
        from typing import List, Optional, Tuple


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def largest_bst_size(root: Optional[TreeNode]) -> int:
            INF = float("inf")
            best = 0

            def summarise(node: Optional[TreeNode]) -> Tuple[float, float, int, bool]:
                """Returns (minimum, maximum, size, is_bst) for the subtree."""
                nonlocal best
                if node is None:
                    return (INF, -INF, 0, True)
                left_min, left_max, left_size, left_ok = summarise(node.left)
                right_min, right_max, right_size, right_ok = summarise(node.right)
                if left_ok and right_ok and left_max < node.val < right_min:
                    size = left_size + right_size + 1
                    best = max(best, size)
                    return (min(left_min, node.val), max(right_max, node.val), size, True)
                return (-INF, INF, max(left_size, right_size), False)

            summarise(root)
            return best


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
            root = build_tree(lines[0].split() if lines else [])
            print(largest_bst_size(root))


        if __name__ == "__main__":
            main()
