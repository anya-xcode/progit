      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        class BSTIterator:
            """Yields BST values in increasing order, or decreasing when reverse=True."""

            def __init__(self, root: Optional[TreeNode], reverse: bool = False):
                self.reverse = reverse
                self.stack: List[TreeNode] = []
                self._descend(root)

            def _descend(self, node: Optional[TreeNode]) -> None:
                while node is not None:
                    self.stack.append(node)
                    node = node.right if self.reverse else node.left

            def has_next(self) -> bool:
                return bool(self.stack)

            def next(self) -> int:
                node = self.stack.pop()
                self._descend(node.left if self.reverse else node.right)
                return node.val


        def two_sum_in_bst(root: Optional[TreeNode], k: int) -> bool:
            if root is None:
                return False
            ascending = BSTIterator(root)
            descending = BSTIterator(root, reverse=True)
            small = ascending.next()
            large = descending.next()
            while small < large:
                total = small + large
                if total == k:
                    return True
                if total < k:
                    small = ascending.next()
                else:
                    large = descending.next()
            return False


