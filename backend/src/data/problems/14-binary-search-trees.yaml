problems:
  - slug: search-in-a-binary-search-tree
    title: "Search in a BST"
    difficulty: Easy
    topic: "Binary Search Trees"
    subtopic: "Concepts"
    tags: [bst, tree]
    sourceUrl: "https://leetcode.com/problems/search-in-a-binary-search-tree/"
    statement: |
      You are given the root of a **binary search tree** (every value in a node's
      left subtree is smaller than the node, every value in its right subtree is
      larger; all values are distinct) and a target value `val`.

      Locate the node whose value equals `val` and return it. The driver prints
      the **preorder traversal of the subtree rooted at that node**. If no node has
      the value, return nothing and the driver prints `null`.
    inputFormat: |
      - Line 1: level-order values of the BST (`N` for a missing child, `N` alone for the empty tree).
      - Line 2: the integer `val`.
    outputFormat: |
      Print the preorder traversal (space-separated) of the subtree whose root has value `val`, or `null` if `val` is not in the tree.
    constraints:
      - "0 <= number of nodes <= 1000"
      - "1 <= node value, val <= 10^5"
      - "All node values are distinct"
    examples:
      - input: |
          8 4 12 2 6 10 14
          4
        output: |
          4 2 6
        explanation: "The node 4 is the left child of the root; its subtree in preorder is 4, 2, 6."
      - input: |
          8 4 12 2 6 10 14
          5
        output: |
          null
        explanation: "5 would have to be the left child of 6, which does not exist, so the value is absent."
    hints:
      - "You do not need to look at both subtrees — the BST ordering tells you which side can contain val."
      - "Walk down from the root with a loop: go left when val is smaller, right when it is larger."
    explanation: |
      **Full traversal — O(n) time, O(h) space.** Search every node with DFS, ignoring
      the ordering. Correct but wasteful.

      **BST descent — O(h) time, O(1) space.** Start at the root. If the current value
      equals `val`, return the node. If `val` is smaller, only the left subtree can
      contain it; otherwise only the right subtree can. Stop when you fall off the
      tree. `h` is `O(log n)` for a balanced tree and `O(n)` for a skewed one.
    starterCode:
      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def search_bst(root: Optional[TreeNode], val: int) -> Optional[TreeNode]:
            # Return the node whose value is val, or None.
            pass


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
            root = build_tree(lines[0].split())
            val = int(lines[1])
            found = search_bst(root, val)
            if found is None:
                print("null")
            else:
                values: List[int] = []
                stack = [found]
                while stack:
                    node = stack.pop()
                    values.append(node.val)
                    if node.right:
                        stack.append(node.right)
                    if node.left:
                        stack.append(node.left)
                print(" ".join(map(str, values)))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def search_bst(root: Optional[TreeNode], val: int) -> Optional[TreeNode]:
            node = root
            while node and node.val != val:
                node = node.left if val < node.val else node.right
            return node


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
            root = build_tree(lines[0].split())
            val = int(lines[1])
            found = search_bst(root, val)
            if found is None:
                print("null")
            else:
                values: List[int] = []
                stack = [found]
                while stack:
                    node = stack.pop()
                    values.append(node.val)
                    if node.right:
                        stack.append(node.right)
                    if node.left:
                        stack.append(node.left)
                print(" ".join(map(str, values)))


        if __name__ == "__main__":
            main()
