      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        class BSTIterator:
            """Yields the values of a BST in increasing order, one at a time."""

            def __init__(self, root: Optional[TreeNode]):
                self.stack: List[TreeNode] = []
                self._descend(root)

            def _descend(self, node: Optional[TreeNode]) -> None:
                while node is not None:
                    self.stack.append(node)
                    node = node.left

            def has_next(self) -> bool:
                return bool(self.stack)

            def peek(self) -> int:
                return self.stack[-1].val

            def next(self) -> int:
                node = self.stack.pop()
                self._descend(node.right)
                return node.val


        def merge_bsts(first: Optional[TreeNode], second: Optional[TreeNode]) -> List[int]:
            left = BSTIterator(first)
            right = BSTIterator(second)
            merged: List[int] = []
            while left.has_next() and right.has_next():
                if left.peek() <= right.peek():
                    merged.append(left.next())
                else:
                    merged.append(right.next())
            while left.has_next():
                merged.append(left.next())
            while right.has_next():
                merged.append(right.next())
            return merged


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
            first = build_tree(lines[0].split() if len(lines) > 0 else [])
            second = build_tree(lines[1].split() if len(lines) > 1 else [])
            print(" ".join(map(str, merge_bsts(first, second))))


        if __name__ == "__main__":
            main()
