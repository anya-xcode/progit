        import sys
        from collections import deque
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def recover_bst(root: Optional[TreeNode]) -> None:
            first: Optional[TreeNode] = None
            middle: Optional[TreeNode] = None
            last: Optional[TreeNode] = None
            previous: Optional[TreeNode] = None

            stack: List[TreeNode] = []
            node = root
            while node is not None or stack:
                while node is not None:
                    stack.append(node)
                    node = node.left
                node = stack.pop()
                if previous is not None and previous.val > node.val:
                    if first is None:
                        first = previous
                        middle = node
                    else:
                        last = node
                previous = node
                node = node.right

            if first is not None and last is not None:
                first.val, last.val = last.val, first.val
            elif first is not None and middle is not None:
                first.val, middle.val = middle.val, first.val


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
