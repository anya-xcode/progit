  - slug: lowest-common-ancestor-of-a-binary-search-tree
    title: "LCA in a BST"
    difficulty: Medium
    topic: "Binary Search Trees"
    subtopic: "Medium Problems"
    tags: [bst, tree]
    sourceUrl: "https://leetcode.com/problems/lowest-common-ancestor-of-a-binary-search-tree/"
    statement: |
      Given a binary search tree with distinct values and the values `p` and `q` of
      two nodes in it, find their **lowest common ancestor**: the deepest node whose
      subtree contains both. A node is considered part of its own subtree.

      Try to use the BST ordering rather than a general binary-tree algorithm.
    inputFormat: |
      - Line 1: level-order values of the BST (`N` for a missing child).
      - Line 2: two integers `p` and `q` (both present in the tree; they may be equal).
    outputFormat: |
      Print the value of the lowest common ancestor.
    constraints:
      - "1 <= number of nodes <= 1000"
      - "1 <= node value <= 10^5"
      - "All node values are distinct"
    examples:
      - input: |
          8 4 12 2 6 10 14
          2 6
        output: |
          4
        explanation: "2 and 6 are on opposite sides of 4, and both are inside the root's left subtree."
      - input: |
          8 4 12 2 6 10 14
          6 14
        output: |
          8
        explanation: "6 is smaller than the root and 14 is larger, so the paths split at the root."
    hints:
      - "If both p and q are smaller than the current node, where must their LCA be?"
      - "The first node on the root-down walk whose value lies between p and q (inclusive) is the answer."
    explanation: |
      **General binary-tree LCA — O(n) time, O(h) space.** Search both subtrees
      recursively, ignoring the ordering.

      **BST walk — O(h) time, O(1) space.** Start at the root. If both `p` and `q` are
      smaller than the node, move left; if both are larger, move right. Otherwise
      the values are split across this node (or one of them is this node), so it
      is the lowest common ancestor.
