      whether **two different nodes** hold values that add up to `k`.

      The same node may not be used twice: in a tree containing `6`, the target
      `12` is only reachable if some *other* node also holds `6`, which distinct
      values rule out.
    inputFormat: |
      - Line 1: level-order values of the BST (`N` for a missing child; the empty tree is `N`).
      - Line 2: the integer `k`.
    outputFormat: |
      Print `true` if two different nodes sum to `k`, otherwise `false`.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^5 <= node value <= 10^5, and all node values are distinct"
      - "-10^6 <= k <= 10^6"
      - "The tree is a valid BST"
    examples:
