      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def insert_into_bst(root: Optional[TreeNode], val: int) -> TreeNode:
            new_node = TreeNode(val)
            if root is None:
                return new_node
            node = root
            while True:
                if val < node.val:
                    if node.left is None:
                        node.left = new_node
                        return root
                    node = node.left
                else:
                    if node.right is None:
                        node.right = new_node
                        return root
                    node = node.right


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
