  - sheetId: prob-14-2-2-floor-in-a-binary-search-
    slug: floor-in-a-binary-search-tree
    title: "Floor Queries on a BST"
    difficulty: Easy
    topic: "Binary Search Trees"
    subtopic: "Practice Problems"
    tags: [bst, tree, binary-search]
    sourceUrl: ""
    statement: |
      The **floor** of a value `key` in a set of numbers is the largest number in
      the set that is not greater than `key`. In a binary search tree that means
      the largest node value `v` with `v <= key`; if every node is larger than
      `key`, the floor does not exist.

      You are given a binary search tree and `q` query values. Answer every query
      with the floor of that value, or `-1` when there is none. Each query must be
      answered by walking **one root-to-leaf path**, not by scanning the tree.
    inputFormat: |
      - Line 1: level-order values of the BST (`N` for a missing child); the tree has at least one node.
      - Line 2: an integer `q`, the number of queries.
      - Line 3: `q` space-separated integers, the query values.
    outputFormat: |
      Print `q` lines: the floor of each query value in the order given, or `-1` if the tree has no value `<= key`.
    constraints:
      - "1 <= number of nodes <= 2000"
      - "1 <= q <= 2000"
      - "1 <= node value, key <= 10^5, and all node values are distinct"
      - "The tree is a valid BST"
    examples:
      - input: |
          8 4 12 2 6 10 14
          4
          11 8 1 100
        output: |
          10
          8
          -1
          14
        explanation: "For 11 the largest value not above it is 10; 8 is present so it is its own floor; every value is above 1, so the answer is -1; and 14 is the largest value in the tree, so it is the floor of 100."
      - input: |
          10 5 20 N 7 15 N
          3
          6 7 9
        output: |
          5
          7
          7
        explanation: "For 6 the candidates are 5 and 10 and 15 and 7 — the largest one not above 6 is 5. For 7 the node itself qualifies. For 9 the answer is 7."
    hints:
      - "Start at the root with 'no candidate yet' and walk down once per query."
      - "A node whose value is <= key is a candidate — and going right can only find a bigger candidate, so record it and move right."
      - "A node whose value is > key can never be the floor, so move left without recording anything."
    explanation: |
      **Sorted inorder + binary search — O(n) time once, then O(log n) per query.**
      The inorder traversal of a BST is sorted, so collect it into a list and binary
      search for the rightmost value `<= key`. Excellent when there are many
      queries, but it copies the whole tree into an array and ignores the structure
      that is already there.

      **Descend once per query — O(h) time, O(1) space.** Keep `answer = -1` and
      start at the root:

      - if `node.val == key`, the floor is `key` itself — stop;
      - if `node.val < key`, the node is a valid candidate, so set
        `answer = node.val` and move **right**, where any value is still `<= key`
        only if it is larger than this one, i.e. strictly better;
      - if `node.val > key`, it cannot be the floor and neither can anything in its
        right subtree, so move **left**.

      When you fall off the bottom, `answer` holds the best candidate seen. The walk
      touches one node per level, so a query costs `O(h)` — `O(log n)` for a
      balanced tree — with no extra memory.

      **Why the candidate is never lost.** Every time you move right from a
      candidate you are looking for something between it and `key`; if the right
      subtree contains nothing suitable, the recorded candidate is still the answer.
      Overwriting `answer` only ever improves it.

      **The ceil** is the mirror image: record nodes with `node.val > key` and move
      left, otherwise move right.

      **Total cost here** is `O(q·h)` time and `O(1)` extra space beyond the output.
    starterCode:
      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def floor_queries(root: Optional[TreeNode], keys: List[int]) -> List[int]:
            # Return the floor of every key, using -1 when no value is <= key.
            pass


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
            root = build_tree(lines[0].split())
            q = int(lines[1])
            keys = [int(x) for x in lines[2].split()] if q > 0 else []
            print("\n".join(map(str, floor_queries(root, keys))))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def floor_queries(root: Optional[TreeNode], keys: List[int]) -> List[int]:
            answers: List[int] = []
            for key in keys:
                best = -1
                node = root
                while node is not None:
                    if node.val == key:
                        best = key
                        break
                    if node.val < key:
                        best = node.val
                        node = node.right
                    else:
                        node = node.left
                answers.append(best)
            return answers


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
            root = build_tree(lines[0].split())
            q = int(lines[1])
            keys = [int(x) for x in lines[2].split()] if q > 0 else []
            print("\n".join(map(str, floor_queries(root, keys))))


        if __name__ == "__main__":
            main()
