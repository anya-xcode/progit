  - slug: construct-bst-from-preorder-traversal
    title: "Construct BST from Preorder Traversal"
    difficulty: Medium
    topic: "Binary Search Trees"
    subtopic: "Medium Problems"
    tags: [bst, tree, stack, recursion]
    sourceUrl: "https://leetcode.com/problems/construct-binary-search-tree-from-preorder-traversal/"
    statement: |
      You are given the **preorder traversal** of a binary search tree whose values
      are all distinct. Exactly one BST has this preorder, so rebuild it and return
      its root.

      The driver prints the rebuilt tree in the same level-order format used for
      tree inputs, defined precisely as follows:

      1. Start a queue with the root.
      2. Pop the front entry. If it is a node, output its value and push its left
         child and then its right child (missing children are pushed as empty
         entries). If it is an empty entry, output `N` and push nothing.
      3. Repeat until the queue is empty, then **remove all trailing `N` tokens**.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes.
      - Line 2: `n` distinct integers, the preorder traversal of a BST.
    outputFormat: |
      Print the level-order serialization of the tree on one line, space-separated, with trailing `N` tokens removed.
    constraints:
      - "1 <= n <= 1000"
      - "1 <= value <= 10^5"
      - "All values are distinct and form a valid BST preorder"
    examples:
      - input: |
          6
          8 5 1 7 10 12
        output: |
          8 5 10 1 7 N 12
        explanation: "8 is the root; 5, 1, 7 are smaller and form the left subtree; 10 and 12 form the right subtree, where 10 has no left child."
      - input: |
          3
          1 2 3
        output: |
          1 N 2 N 3
        explanation: "Each value is larger than all previous ones, so the tree is a chain of right children."
    hints:
      - "The first value is always the root. Which of the following values belong to its left subtree?"
      - "Inserting the values one by one into an empty BST reproduces the tree, but can be O(n²)."
      - "Recurse with an upper bound: build a subtree while the next value is below the bound, consuming values from a shared index."
    explanation: |
      **Repeated insertion — O(n²) worst case, O(n) space.** Insert every value, in the
      given order, into an initially empty BST. Because a parent always appears
      before its descendants in preorder, this recreates the exact tree.

      **Split by root — O(n log n) to O(n²) time.** The root is `preorder[0]`; the
      following values smaller than it form the left subtree and the rest form the
      right subtree. Find the split point (linearly or with binary search) and
      recurse on both parts.

      **Upper-bound recursion — O(n) time, O(h) space.** Keep a global index into the
      preorder array. `build(bound)` returns null if the array is exhausted or the
      next value exceeds `bound`; otherwise it consumes the value as a node, builds
      its left child with bound = node value and its right child with the
      inherited bound. Every value is consumed exactly once. A monotonic stack
      gives an equivalent iterative O(n) solution.
