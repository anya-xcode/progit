    slug: inorder-successor-predecessor-in-bst
    title: "Inorder Successor and Predecessor in a BST"
    difficulty: Medium
    topic: "Binary Search Trees"
    subtopic: "Practice Problems"
    tags: [bst, tree, binary-search]
    sourceUrl: "https://leetcode.com/problems/inorder-successor-in-bst/"
    statement: |
      The inorder traversal of a binary search tree lists its values in increasing
      order. For a value `key`:

      - the **inorder predecessor** is the largest node value **strictly smaller**
        than `key`;
      - the **inorder successor** is the smallest node value **strictly larger**
        than `key`.

      `key` itself may or may not be present in the tree — the definitions above do
      not care. Report both, using `-1` when one of them does not exist.
    inputFormat: |
      - Line 1: level-order values of the BST (`N` for a missing child); the tree has at least one node.
      - Line 2: the integer `key`.
    outputFormat: |
      Print two integers separated by a space: the predecessor and the successor of `key`, each replaced by `-1` when it does not exist.
    constraints:
      - "1 <= number of nodes <= 2000"
      - "1 <= node value, key <= 10^5, and all node values are distinct"
      - "The tree is a valid BST"
    examples:
      - input: |
          8 4 12 2 6 10 14
          6
        output: |
          4 8
        explanation: "Sorted, the tree is 2 4 6 8 10 12 14. The neighbours of 6 are 4 and 8."
      - input: |
          8 4 12 2 6 10 14
          2
        output: |
          -1 4
        explanation: "2 is the smallest value, so it has no predecessor; the next value up is 4."
    hints:
      - "Do not build the inorder list — each answer is one walk down the tree."
      - "For the successor: at a node larger than key, record it and go left (a smaller candidate may still exist); otherwise go right."
      - "The predecessor is the mirror image: record nodes smaller than key and go right."
    explanation: |
      **Inorder list — O(n) time, O(n) space.** Flatten the BST into a sorted list
      and scan for the neighbours of `key`. Easy and obviously correct, but it
      visits every node for something that needs one path.

      **Two descents — O(h) time, O(1) space.** For the **successor**, start with
      `answer = -1` at the root and repeat:

      - if `node.val > key`, this node is a candidate, so record it and move
        **left**, because a still smaller value above `key` could be there;
      - otherwise (`node.val <= key`) nothing in this node's left subtree can beat
        `key` either, so move **right**.

      The **predecessor** is the same loop with the comparisons flipped: record when
      `node.val < key` and move right, otherwise move left. Each loop takes one step
      per level, so both together are `O(h)` with no extra memory.

      **The "successor of a node" variant.** When you already hold the *node* rather
      than a value, there is a shortcut: if it has a right child, the successor is
      the leftmost node of that right subtree; otherwise it is the lowest ancestor
      whose left subtree contains the node — the last node from which you turned
      left on the way down. The version implemented here works even when `key` is
      absent, which is why it is stated in terms of a value.

      **Why `-1` is safe** as the "does not exist" answer: the constraints keep all
      node values at least 1, so `-1` can never be a real answer.
