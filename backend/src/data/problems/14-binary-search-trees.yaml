  - sheetId: prob-14-1-1-introduction-to-bst
    type: reference
    slug: introduction-to-bst
    title: "Introduction to Binary Search Trees"
    difficulty: Easy
    topic: "Binary Search Trees"
    subtopic: "Concepts"
    tags: [bst, tree, theory]
    sourceUrl: ""
    statement: |
      A **binary search tree** is a binary tree with one extra promise, checked at
      every node:

      > every value in the node's **left** subtree is smaller than the node's
      > value, and every value in its **right** subtree is larger.

      Read that carefully: the rule is about whole *subtrees*, not just the two
      children. A tree where each node is larger than its left child and smaller
      than its right child can still fail — `10` with left child `5`, and `5` with
      right child `20`, breaks the promise because `20` sits in `10`'s left
      subtree. Nothing to submit here; read it and move on to the problems.

      **What the promise buys you.** At any node you can throw away half the tree:
      if the value you want is smaller than the node, it can only be on the left.
      So searching, inserting and deleting all cost `O(h)` steps, where `h` is the
      height — about `log2(n)` when the tree is balanced.

      **What it costs.** Nothing keeps a plain BST balanced. Insert `1, 2, 3, 4, 5`
      in that order and you get a right-going chain of height 4: every operation
      becomes `O(n)` and the structure is a linked list with extra pointers. Real
      libraries therefore use *self-balancing* variants (AVL, red-black) that
      rotate after each update to keep the height `O(log n)`; `std::map`,
      `TreeMap` and Java's `TreeSet` are red-black trees underneath.

      **Duplicates.** Unless a problem says otherwise, assume values are distinct.
      When duplicates must be supported the usual fix is a counter stored in the
      node rather than a second node with the same value, because "equal" has no
      side to go to.

      **The single most useful fact.** The **inorder traversal of a BST is sorted**,
      in strictly increasing order. Most BST problems are a sorted-array problem in
      disguise: "k-th smallest" is an index, "two sum" is two pointers, "validate"
      is "is this sequence increasing", "recover two swapped nodes" is "find the
      out-of-order pairs".
    explanation: |
      **The three basic operations, in one place.**

      | Operation | How | Cost |
      | --- | --- | --- |
      | Search | compare with the node; go left if smaller, right if larger, stop on equal | `O(h)` |
      | Insert | search for the value; the null slot where the search fails is where the new leaf goes | `O(h)` |
      | Find min / max | walk left as far as possible / right as far as possible | `O(h)` |
      | Delete | see below | `O(h)` |

      **Deletion has three cases.** Once the node is found:

      1. *No children* — detach it.
      2. *One child* — replace the node with that child.
      3. *Two children* — the node cannot simply vanish, so replace its value with
         its **inorder successor** (the smallest value in its right subtree, found
         by going right once and then left as far as possible) and then delete that
         successor from the right subtree, where it has at most one child. Using the
         inorder **predecessor** instead is equally valid; a problem that checks the
         resulting shape must say which one it wants.

      **Validation, done right.** Checking `left.val < node.val < right.val` at each
      node is the classic wrong answer. Carry a permitted range down instead: the
      root may be anything, the left child inherits the upper bound `node.val`, the
      right child inherits the lower bound `node.val`. Equivalently, run an inorder
      traversal and check that it strictly increases.

      **Bounds you should be able to state.** A BST with `n` nodes has height
      between `floor(log2 n)` and `n - 1`. Building one by inserting `n` values
      costs `O(n log n)` when they arrive in random order and `O(n²)` when they
      arrive sorted. Inorder traversal is `O(n)` and gives the values sorted, so
      "sort by inserting into a BST" is a genuine — if fragile — sorting algorithm.

      **How to recognise a BST problem.** If the statement mentions a search tree
      and a target value, the answer almost always walks **one root-to-leaf path**
      and costs `O(h)`; if it mentions order, rank or a range, think about the
      sorted inorder sequence. Solutions that traverse the whole tree when the BST
      property was available are the common miss.

  - sheetId: prob-14-1-3-find-minmax-in-bst
    slug: find-min-max-in-bst
    title: "Minimum and Maximum in a BST"
    difficulty: Easy
    topic: "Binary Search Trees"
    subtopic: "Concepts"
    tags: [bst, tree]
    sourceUrl: ""
    statement: |
      In a binary search tree every value in a node's left subtree is smaller than
      the node and every value in its right subtree is larger.

      Given a non-empty binary search tree, print its smallest and its largest
      value. Do not traverse the whole tree — the ordering tells you exactly where
      each of them has to be.
    inputFormat: |
      A single line with the level-order values of the BST, using `N` for a missing child. The tree has at least one node.
    outputFormat: |
      Print two integers separated by a space: the minimum value and the maximum value.
    constraints:
      - "1 <= number of nodes <= 2000"
      - "-10^5 <= node value <= 10^5"
      - "All node values are distinct and the tree is a valid BST"
    examples:
      - input: |
          8 4 12 2 6 10 14
        output: |
          2 14
        explanation: "Going left from the root reaches 4 and then 2, which has no left child, so 2 is the minimum. Going right reaches 12 and then 14, the maximum."
      - input: |
          5 N 9 N 11
        output: |
          5 11
        explanation: "The root has no left child at all, so the root itself is the minimum; following the right chain to its end gives 11."
    hints:
      - "Where can a value smaller than the root possibly be stored?"
      - "The minimum is the node you reach by going left until there is no left child — no comparisons needed."
      - "Two independent walks, each at most the height of the tree."
    explanation: |
      **Scan every node — O(n) time, O(h) space.** Traverse the tree and keep a
      running minimum and maximum. It works on any binary tree, and it throws away
      the only thing that makes this tree special.

      **Two descents — O(h) time, O(1) space.** The smallest value cannot be to the
      right of anything, so start at the root and follow `left` until a node has no
      left child: that node holds the minimum. Symmetrically, follow `right` to the
      end for the maximum. Each walk visits one node per level, so together they
      cost `O(h)` — about 20 steps for a balanced tree of a million nodes, against a
      million steps for the full scan.

      **Inorder shortcut.** Since the inorder traversal of a BST is sorted, the
      minimum is its first element and the maximum its last. That is the same two
      nodes reached above, and it is worth remembering because "leftmost node" is
      exactly what the successor/predecessor and deletion routines need later.

      **A degenerate tree** — a chain of `n` nodes — still costs `O(n)`, because
      then `h = n - 1`. The `O(h)` bound is honest about that; it is the balance of
      the tree, not the algorithm, that makes the difference.
    starterCode:
      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def min_and_max(root: Optional[TreeNode]) -> List[int]:
            # Return [minimum, maximum] of the BST.
            pass


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
            root = build_tree(lines[0].split())
            print(" ".join(map(str, min_and_max(root))))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def min_and_max(root: Optional[TreeNode]) -> List[int]:
            node = root
            while node.left is not None:
                node = node.left
            smallest = node.val
            node = root
            while node.right is not None:
                node = node.right
            return [smallest, node.val]


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
            root = build_tree(lines[0].split())
            print(" ".join(map(str, min_and_max(root))))


        if __name__ == "__main__":
            main()
