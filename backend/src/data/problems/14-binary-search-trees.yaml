  - sheetId: prob-14-2-13-largest-bst-in-binary-tre
    slug: largest-bst-in-binary-tree
    title: "Largest BST Inside a Binary Tree"
    difficulty: Hard
    topic: "Binary Search Trees"
    subtopic: "Practice Problems"
    tags: [bst, tree, postorder, recursion]
    sourceUrl: ""
    statement: |
      You are given an arbitrary binary tree — it is **not** promised to be a
      search tree. Some of its subtrees may nevertheless be valid binary search
      trees on their own.

      A **subtree** here means a node together with *everything* below it, and it
      counts as a BST when every value in its left part is **strictly smaller**
      than the node and every value in its right part is **strictly larger** (so a
      subtree containing two equal values is never a BST).

      Print the number of nodes in the largest such subtree. Every single leaf is a
      BST of size 1, so the answer of a non-empty tree is at least 1; the empty
      tree answers `0`.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print a single integer: the number of nodes in the largest subtree that is a BST.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^5 <= node value <= 10^5"
      - "Values may repeat"
    examples:
      - input: |
          10 5 15 1 8 N 7
        output: |
          3
        explanation: "The whole tree fails because 7 sits in the right subtree of 10 but is smaller than 10. The subtree rooted at 5 (with children 1 and 8) is a valid BST with 3 nodes, and nothing larger qualifies."
      - input: |
          8 4 12 2 6 10 14
        output: |
          7
        explanation: "The entire tree is already a binary search tree, so the answer is all 7 nodes."
    hints:
      - "Check every subtree independently and you get an O(n²) solution — what information would let a node decide in O(1)?"
      - "From each child, a node needs three things: is that subtree a BST, what is its smallest value and what is its largest value, plus its size."
      - "A node is a BST exactly when both children are BSTs and left_max < node.val < right_min — note it is the left subtree's maximum and the right subtree's minimum."
    explanation: |
      **Check each subtree separately — O(n²) time.** For every node, validate its
      whole subtree and count it if it passes. Each validation is `O(size)`, and for
      a skewed tree the total is quadratic.

      **One postorder pass — O(n) time, O(h) space.** Solve the problem bottom-up:
      every node asks its two children for a small summary and produces its own.
      The summary is four numbers — `(is_bst, minimum, maximum, size)` — or, more
      compactly, `(minimum, maximum, size)` where a subtree that is not a BST
      reports a deliberately impossible range.

      For a node with summaries `L` and `R`:

      - it is a BST when both children are BSTs **and** `L.maximum < node.val` and
        `node.val < R.minimum`;
      - if so, its size is `L.size + R.size + 1`, its minimum is
        `min(L.minimum, node.val)` and its maximum is `max(R.maximum, node.val)`;
      - if not, the node reports "not a BST" and passes upward the largest BST size
        found anywhere below it, so the answer survives.

      An empty child returns `size = 0` with a minimum of `+infinity` and a maximum
      of `-infinity`, which makes both comparisons succeed automatically — the neat
      trick that removes all the null special cases. Each node is visited once and
      does `O(1)` work, so the pass is linear.

      **Strictness matters.** Using `<=` instead of `<` would accept duplicates and
      change the answer on trees where a value repeats; the definition above is
      strict, so `5` with a child `5` is two separate BSTs of size 1.

      **Watch the recursion depth** on a 2000-node chain, and remember that the
      answer is a *size*, not a height — a common misreading of this problem.
