  - slug: insert-into-a-binary-search-tree
    title: "Insert into a BST"
    difficulty: Medium
    topic: "Binary Search Trees"
    subtopic: "Concepts"
    tags: [bst, tree]
    sourceUrl: "https://leetcode.com/problems/insert-into-a-binary-search-tree/"
    statement: |
      You are given the root of a binary search tree with distinct values and a
      value `val` that is **not** in the tree. Insert `val` as a **new leaf**: start
      at the root and repeatedly move left if `val` is smaller than the current
      node or right if it is larger, until you reach a missing child — attach the
      new node there. Existing nodes must not be rearranged.

      Return the root of the updated tree (which is the new node if the tree was
      empty). The driver prints the **preorder traversal** of the result; because
      the tree is a BST, preorder pins down its exact shape.
    inputFormat: |
      - Line 1: level-order values of the BST (`N` for a missing child, `N` alone for the empty tree).
      - Line 2: the integer `val`.
    outputFormat: |
      Print the preorder traversal of the tree after insertion, space-separated.
    constraints:
      - "0 <= number of nodes <= 1000"
      - "1 <= node value, val <= 10^5"
      - "All values, including val, are distinct"
    examples:
      - input: |
          8 4 12 2 6
          5
        output: |
          8 4 2 6 5 12
        explanation: "5 < 8 goes left, 5 > 4 goes right, 5 < 6 goes left — an empty spot, so 5 becomes the left child of 6."
      - input: |
          N
          3
        output: |
          3
        explanation: "Inserting into an empty tree makes the new node the root."
    hints:
