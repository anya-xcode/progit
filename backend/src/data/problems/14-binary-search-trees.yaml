    sourceUrl: "https://leetcode.com/problems/kth-smallest-element-in-a-bst/"
    statement: |
      Given the root of a binary search tree with distinct values and an integer
      `k`, return the `k`-th smallest value in the tree (counting from 1).
    inputFormat: |
      - Line 1: level-order values of the BST (`N` for a missing child).
      - Line 2: the integer `k`.
    outputFormat: |
      Print the k-th smallest value.
    constraints:
      - "1 <= k <= number of nodes <= 1000"
      - "1 <= node value <= 10^5"
      - "All node values are distinct"
    examples:
      - input: |
          8 4 12 2 6 10 14
          3
        output: |
          6
        explanation: "The sorted values are 2 4 6 8 10 12 14, and the third one is 6."
      - input: |
          5 3 N 1 N N 2
          4
        output: |
          5
        explanation: "The values in order are 1 2 3 5, so the 4th smallest is the root 5."
    hints:
      - "What order does an inorder traversal of a BST produce?"
      - "You can stop the traversal as soon as you have visited k nodes."
    explanation: |
      **Collect and sort — O(n log n) time, O(n) space.** Gather all values with any
      traversal, sort them and pick index `k - 1`.

      **Inorder list — O(n) time, O(n) space.** Inorder traversal of a BST is already
      sorted, so build that list and pick index `k - 1` without sorting.

      **Early-stopping iterative inorder — O(h + k) time, O(h) space.** Use the stack
      version of inorder traversal and count nodes as they are popped. The `k`-th
      popped node is the answer, so the rest of the tree is never touched. (Morris
      traversal brings the space down to O(1).)
