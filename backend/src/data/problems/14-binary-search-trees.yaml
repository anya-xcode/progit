    explanation: |
      **All pairs — O(n²) time, O(h) space.** For every node, search the rest of the
      tree for `k - value`. Correct, and quadratic.

      **Hash set during a traversal — O(n) time, O(n) space.** Traverse once; for
      each value check whether `k - value` has already been seen, otherwise add it.
      This works on any binary tree, not just a BST, and is the answer to give if
      the ordering is not available.

      **Sorted list + two pointers — O(n) time, O(n) space.** Flatten inorder into a
      sorted array, put one index at each end and move inward: if the sum is smaller
      than `k` advance the left index, if it is larger move the right index down, and
      stop when they meet. Each step discards one value for a provable reason.

      **Two BST iterators — O(n) time, O(h) space.** The same two-pointer walk with
      no array. Build one iterator that yields values in increasing order (push the
      left spine, pop, then push the right child's left spine) and one that yields
      them in decreasing order (the mirror image, using right spines). Take the
      first value from each; while the small one is less than the large one,
      compare their sum with `k` and advance the appropriate iterator. Because the
      two iterators only ever move towards each other, each node is popped at most
      once, so the whole search is linear while the memory is one stack per
      direction — `O(h)`, which is `O(log n)` on a balanced tree.

      **The "different nodes" rule** is what stops the loop at `small < large`
      instead of `small <= large`. With equal values allowed you would also have to
      check that two *nodes* carry the value, not just one.
