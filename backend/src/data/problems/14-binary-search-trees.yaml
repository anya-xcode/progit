  - slug: validate-binary-search-tree
    title: "Validate BST"
    difficulty: Medium
    topic: "Binary Search Trees"
    subtopic: "Medium Problems"
    tags: [bst, tree, dfs]
    sourceUrl: "https://leetcode.com/problems/validate-binary-search-tree/"
    statement: |
      Decide whether a binary tree is a valid **binary search tree**, meaning that
      for every node:

      - every value in its left subtree is **strictly smaller** than the node's value;
      - every value in its right subtree is **strictly larger** than the node's value.

      Equal values anywhere violate the rule. The empty tree is a valid BST.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print `true` if the tree is a valid BST, otherwise `false`.
    constraints:
      - "0 <= number of nodes <= 1000"
      - "-2^31 <= node value <= 2^31 - 1"
    examples:
      - input: |
          8 4 12 2 6 10 14
        output: |
          true
        explanation: "Every node sits between the values allowed by its ancestors."
      - input: |
          8 4 12 2 9
        output: |
          false
        explanation: "9 is the right child of 4, which is fine locally, but it lies in the root's left subtree and 9 > 8."
    hints:
      - "Comparing each node only with its direct children is not enough — look at example 2."
      - "Pass down an allowed open interval (low, high) for each node and narrow it when descending."
      - "Alternatively, the inorder traversal of a valid BST is strictly increasing."
    explanation: |
      **Subtree min/max — O(n²) time worst case.** For every node compute the maximum of
      its left subtree and the minimum of its right subtree separately and compare
      with the node.

      **Range recursion — O(n) time, O(h) space.** `valid(node, low, high)` requires
      `low < node.val < high`, then checks `valid(left, low, node.val)` and
      `valid(right, node.val, high)`. Start with unbounded limits (use `None` or
      infinities rather than a fixed integer sentinel, since values may reach the
      32-bit extremes).

      **Inorder check — O(n) time, O(h) space.** Traverse inorder while remembering
      the previous value; the tree is valid exactly when each value is strictly
      larger than the previous one.
