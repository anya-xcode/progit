  - sheetId: prob-14-2-4-delete-a-node-in-bst
    slug: delete-a-node-in-bst
    title: "Delete a Node in a BST"
    difficulty: Medium
    topic: "Binary Search Trees"
    subtopic: "Practice Problems"
    tags: [bst, tree, recursion]
    sourceUrl: "https://leetcode.com/problems/delete-node-in-a-bst/"
    statement: |
      Remove the node holding a given `key` from a binary search tree, so that the
      result is still a valid BST containing exactly the other values. If no node
      holds `key`, the tree is unchanged.

      A node with two children cannot simply be dropped, and several repairs are
      possible, so the required one is fixed here:

      > replace the node's value with the **smallest value in its right subtree**
      > (its inorder successor), then delete that successor from the right subtree.

      With that rule the resulting tree is unique, and the driver prints its
      level-order form so both shape and values are checked.
    inputFormat: |
      - Line 1: level-order values of the BST (`N` for a missing child; the empty tree is `N`).
      - Line 2: the integer `key` to delete.
    outputFormat: |
      Print the level-order values of the resulting tree on one line, using `N` for a missing child of an existing node and dropping the trailing `N`s. Print `N` if the tree ends up empty.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "1 <= node value, key <= 10^5, and all node values are distinct"
      - "The input tree is a valid BST"
    examples:
      - input: |
          5 3 6 2 4 N 7
          3
        output: |
          5 4 6 2 N N 7
        explanation: "Node 3 has both children, so it takes the smallest value of its right subtree, 4, and that 4 is then removed from the right subtree, leaving 4 with the single child 2."
      - input: |
          5 3 6 2 4 N 7
          5
        output: |
          6 3 7 2 4
        explanation: "The root has two children. The smallest value on its right is 6, so the root becomes 6 and the old 6 — which had only a right child 7 — is replaced by 7."
    hints:
      - "Search for the key first; the interesting work only starts once the node is found."
      - "A node with at most one child is replaced by that child (or by nothing)."
      - "For two children, the inorder successor is 'one step right, then left as far as possible', and deleting it afterwards is an easier case of the same problem."
    explanation: |
      **Rebuild from the values — O(n) time, O(n) space.** Collect the inorder
      sequence, drop the key and build a new BST. It is correct only if you also
      reproduce the exact shape the rules demand, which you cannot, so the answer
      would not match. Mentioned because it is the tempting shortcut.

      **Recursive delete — O(h) time, O(h) space.** A function that returns the new
      root of the subtree it was given:

      1. empty subtree — return `None`;
      2. `key < node.val` — `node.left = delete(node.left, key)`, return `node`;
      3. `key > node.val` — `node.right = delete(node.right, key)`, return `node`;
      4. found it:
         - no left child — return the right child;
         - no right child — return the left child;
         - both children — find the successor (leftmost node of the right subtree),
           copy its value into the node, then
           `node.right = delete(node.right, successor_value)` and return `node`.

      Reassigning the child pointer on the way back up is what actually detaches the
      node, and it removes the need for a parent pointer. The walk follows one path
      down, plus a second short path to the successor, so time is `O(h)`.

      **Why the successor is safe.** It is the smallest value greater than the
      node's value, so putting it in the node's place keeps everything on the left
      smaller and everything on the right larger. And because it is the leftmost
      node of a subtree it has no left child, so the recursive deletion of it lands
      in the easy one-child case and terminates immediately.

      **Iterative version — O(h) time, O(1) space.** Track the parent while
      searching, then splice the node out by reassigning the parent's correct child.
      Faster in practice, but easy to get wrong when the node to delete is the root.
