    referenceSolution:
      python: |
        import sys
        from typing import List


        def _count_at_most(nums: List[int], limit: int) -> int:
            if limit < 0:
                return 0
            left = 0
            total = 0
            result = 0
            for right, value in enumerate(nums):
                total += value
                while total > limit:
                    total -= nums[left]
                    left += 1
                result += right - left + 1
            return result


        def num_subarrays_with_sum(nums: List[int], goal: int) -> int:
            return _count_at_most(nums, goal) - _count_at_most(nums, goal - 1)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, goal = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(num_subarrays_with_sum(nums, goal))


        if __name__ == "__main__":
            main()
