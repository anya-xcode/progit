  - slug: fruit-into-baskets
    title: "Fruit Into Baskets"
    difficulty: Medium
    topic: "Sliding Window"
    subtopic: "Medium Problems"
    tags: [array, sliding-window, hashing]
    sourceUrl: "https://leetcode.com/problems/fruit-into-baskets/"
    statement: |
      Trees stand in a row, and tree `i` produces fruit of type `fruits[i]`.

      You carry **two baskets**. Each basket can hold any amount of fruit, but only of a single
      type. You pick a starting tree and walk to the right, taking exactly one fruit from every
      tree you pass (including the starting one). You must stop as soon as the current tree's
      fruit does not fit into either basket.

      What is the maximum number of fruits you can collect?
    inputFormat: |
      - Line 1: an integer `n`, the number of trees.
      - Line 2: `n` space-separated integers, the fruit types.
    outputFormat: |
      Print a single integer: the maximum number of fruits you can collect.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= fruits[i] < n"
    examples:
      - input: |
          7
          3 3 1 3 2 2 1
        output: |
          4
        explanation: "Start at tree 0 and collect types 3, 3, 1, 3 (only two types used). Tree 4 has type 2, which would be a third type."
      - input: |
          5
          0 1 2 1 2
        output: |
          4
        explanation: "Start at tree 1 and collect 1, 2, 1, 2 -- four fruits of two types."
    hints:
      - "You are really looking for the longest contiguous subarray with at most two distinct values."
      - "Maintain a window and a frequency map of the types inside it. Shrink from the left whenever the map has more than two keys."
    explanation: |
      **Brute force -- O(n^2) time, O(1) space.** For every start, walk right while tracking the set
      of types; stop when a third type appears.

      **Optimal sliding window -- O(n) time, O(1) space.** Keep a frequency map for the window
      `[left, right]`. Add `fruits[right]`; while the map has more than two keys, decrement
      `fruits[left]` (deleting it when its count hits zero) and advance `left`. Record the window
      length after each step. The map never holds more than three keys, so extra space is constant.
    starterCode:
      python: |
        import sys
        from typing import List


        def total_fruit(fruits: List[int]) -> int:
            # Return the length of the longest subarray with at most two distinct values.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            fruits = [int(x) for x in data[1:1 + n]]
            print(total_fruit(fruits))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def total_fruit(fruits: List[int]) -> int:
            count = {}
            left = 0
            best = 0
            for right, kind in enumerate(fruits):
                count[kind] = count.get(kind, 0) + 1
                while len(count) > 2:
                    old = fruits[left]
                    count[old] -= 1
                    if count[old] == 0:
                        del count[old]
                    left += 1
                best = max(best, right - left + 1)
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            fruits = [int(x) for x in data[1:1 + n]]
            print(total_fruit(fruits))


        if __name__ == "__main__":
            main()
