      **Brute force -- O(n^2) time, O(1) space.** For each start index, extend right while counting
      odd numbers; add one whenever the count equals `k` and stop once it exceeds `k`.

      **Better: prefix counts -- O(n) time, O(n) space.** Let `p` be the number of odd values seen
      so far. The number of nice subarrays ending here equals how many earlier prefixes had count
      `p - k`; keep those frequencies in an array.

      **Optimal: sliding window -- O(n) time, O(1) space.** Define `atMost(x)` = number of
      subarrays with at most `x` odd numbers, computed with a window that shrinks whenever the odd
      count exceeds `x` and adds `right - left + 1` each step. The answer is
