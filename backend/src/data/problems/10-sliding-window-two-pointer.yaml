  - slug: maximum-points-you-can-obtain-from-cards
    title: "Maximum Points You Can Obtain from Cards"
    difficulty: Medium
    topic: "Sliding Window"
    subtopic: "Medium Problems"
    tags: [array, sliding-window, prefix-sum]
    sourceUrl: "https://leetcode.com/problems/maximum-points-you-can-obtain-from-cards/"
    statement: |
      Cards are laid out in a row and card `i` is worth `cardPoints[i]` points.

      You must take **exactly `k` cards**, one at a time. Each time you may take either the
      leftmost or the rightmost card still remaining. Your score is the total value of the cards you
      took. Find the maximum possible score.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the card values.
    outputFormat: |
      Print a single integer: the maximum score.
    constraints:
      - "1 <= n <= 10^5"
      - "1 <= k <= n"
      - "1 <= cardPoints[i] <= 10^4"
    examples:
      - input: |
          6 2
          9 1 1 1 1 8
        output: |
          17
        explanation: "Taking one card from each end gives 9 + 8 = 17, better than two from the left (10) or two from the right (9)."
      - input: |
          4 4
          2 5 1 3
        output: |
          11
        explanation: "k equals n, so every card is taken: 2 + 5 + 1 + 3 = 11."
    hints:
      - "Whatever order you take cards in, you end up with some i cards from the left and k - i from the right."
      - "Try every i from 0 to k. Can you update the sum in O(1) when i changes?"
      - "Alternatively: the cards you leave behind form a contiguous block of n - k cards. Minimise its sum."
    explanation: |
      **Brute force -- O(k^2) time, O(1) space.** For each split `i` (cards from the left), sum the
      first `i` and last `k - i` values from scratch.

      **Optimal: sliding the split -- O(k) time, O(1) space.** Start with the sum of the first `k`
      cards. Then, for `i = 1..k`, remove the `(k - i)`-th card of the left part and add the
      `i`-th card from the right, updating the best score each time.

      **Equivalent view -- O(n) time, O(1) space.** The untaken cards are a contiguous window of
      length `n - k`; the answer is `total - (minimum window sum)`, found with a fixed-size sliding
      window.
    starterCode:
      python: |
        import sys
        from typing import List


        def max_score(card_points: List[int], k: int) -> int:
            # Return the best total from taking k cards off the two ends.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            cards = [int(x) for x in data[2:2 + n]]
            print(max_score(cards, k))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def max_score(card_points: List[int], k: int) -> int:
            n = len(card_points)
            current = sum(card_points[:k])
            best = current
            for i in range(1, k + 1):
                current -= card_points[k - i]
                current += card_points[n - i]
                best = max(best, current)
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            cards = [int(x) for x in data[2:2 + n]]
            print(max_score(cards, k))


        if __name__ == "__main__":
            main()
