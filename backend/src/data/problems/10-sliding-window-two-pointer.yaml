  - sheetId: prob-10-2-2-subarrays-with-k-differen
    slug: subarrays-with-k-different-integers
    title: Subarrays with K Different Integers
    difficulty: Medium
    topic: Sliding Window
    subtopic: Hard Problems
    tags: [array, sliding window, two pointers, hashing]
    sourceUrl: "https://leetcode.com/problems/subarrays-with-k-different-integers/"
    statement: |
      You are given an integer array `arr` of length `n` and an integer `k`.

      Count the **subarrays** (contiguous, non-empty stretches of `arr`) that contain
      exactly `k` distinct values. Two subarrays that hold the same values but start
      at different positions are counted separately.

      For example in `[1, 2, 1]` with `k = 2` the qualifying subarrays are
      `[1, 2]`, `[2, 1]` and `[1, 2, 1]` - three of them.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print one integer: the number of subarrays holding exactly `k` distinct values.
    constraints:
      - "1 <= n <= 2 x 10^4"
      - "1 <= k <= n"
      - "1 <= arr[i] <= n"
    examples:
      - input: |
          5 2
          1 2 1 2 3
        output: |
          7
        explanation: "Seven subarrays use exactly two distinct values: [1,2], [2,1], [1,2], [1,2,1], [2,1,2], [1,2,1,2] and the final [2,3]."
      - input: |
          5 3
          1 2 1 3 4
        output: |
          3
        explanation: "Three subarrays use exactly three distinct values: [1,2,1,3], [2,1,3] and [1,3,4]."
    hints:
      - "A window cannot simply be grown and shrunk to keep \"exactly k\" - adding one element can jump from k to k+1, and there is no single window per right end that captures every valid subarray."
      - "Counting subarrays with *at most* k distinct values is easy with a sliding window, because that property survives shrinking."
      - "exactly(k) = atMost(k) - atMost(k - 1). Run the same window routine twice and subtract."
    explanation: |
      **Brute force - O(n^2) time, O(n) space.** Fix the left end, extend the right
      end with a running frequency map, count a hit whenever the map has exactly `k`
      keys and stop once it has more. With `n = 2 x 10^4` that is `4 x 10^8` steps -
      too slow.

      **Sliding window on "at most" - O(n) time, O(n) space.** "Exactly `k`" is not
      directly windowable: the set of valid subarrays ending at a given index is not a
      contiguous range of left ends in the way a window needs. "At most `k`" is,
      because removing elements from a window never increases its number of distinct
      values. Define `atMost(limit)`:

      - move `right` forward, adding `arr[right]` to a frequency map (a new key
        increases the distinct count);
      - while the map has more than `limit` keys, remove `arr[left]` and move `left`
        forward, dropping a key when its count hits 0;
      - add `right - left + 1` to the total - that is exactly the number of valid
        subarrays ending at `right`, namely every suffix of the current window.

      Then use the inclusion difference:

      ```
      exactly(k) = atMost(k) - atMost(k - 1)
      ```

      Every subarray with at most `k` distinct values has either exactly `k`, or at
      most `k - 1`, so subtracting leaves exactly the ones we want. Each call is a
      single linear pass with each index entering and leaving the window once, so the
      total is O(n) time and O(n) space for the map (at most `n` distinct keys).

      **Three-pointer variant - O(n) time, O(n) space.** The same count can be had in
      one pass by keeping two left pointers, the smallest and the largest left end
      that keeps exactly `k` distinct values, and adding their difference at every
      step. It saves a pass but is markedly easier to get wrong than the subtraction.

      The answer can be close to `n(n+1)/2`, about `2 x 10^8` here, so it needs a
      64-bit integer outside Python.
    starterCode:
      python: |
        import sys
        from typing import List


        def subarrays_with_k_distinct(arr: List[int], k: int) -> int:
            # Count the subarrays of arr holding exactly k distinct values.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            arr = [int(x) for x in data[2:2 + n]]
            print(subarrays_with_k_distinct(arr, k))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import Dict, List


        def subarrays_with_k_distinct(arr: List[int], k: int) -> int:
            def at_most(limit: int) -> int:
                if limit <= 0:
                    return 0
                counts: Dict[int, int] = {}
                left = 0
                total = 0
                for right, value in enumerate(arr):
                    counts[value] = counts.get(value, 0) + 1
                    while len(counts) > limit:
                        out = arr[left]
                        counts[out] -= 1
                        if counts[out] == 0:
                            del counts[out]
                        left += 1
                    total += right - left + 1
                return total

            return at_most(k) - at_most(k - 1)


        # --- Input/output handling ---
        def main():
