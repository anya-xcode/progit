    referenceSolution:
      python: |
        import sys


        def number_of_substrings(s: str) -> int:
            last = {"a": -1, "b": -1, "c": -1}
            total = 0
            for right, ch in enumerate(s):
                last[ch] = right
                total += min(last["a"], last["b"], last["c"]) + 1
            return total


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(number_of_substrings(s))


        if __name__ == "__main__":
            main()
