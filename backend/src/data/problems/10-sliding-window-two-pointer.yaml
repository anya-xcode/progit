    title: "Minimum Window Substring"
    difficulty: Hard
    topic: "Sliding Window"
    subtopic: "Hard Problems"
    tags: [string, sliding-window, hashing]
    sourceUrl: "https://leetcode.com/problems/minimum-window-substring/"
    statement: |
      You are given two strings `s` and `t`. A substring of `s` **covers** `t` if, for every
      character, it contains that character at least as many times as `t` does. Letters are
      case-sensitive and duplicates in `t` matter (to cover `"aa"` a window needs two `a`s).

      Find the shortest substring of `s` that covers `t`. If several covering substrings share the
      minimum length, choose the one that **starts earliest** (leftmost). If no substring covers
      `t`, the answer is the empty string.
    inputFormat: |
      - Line 1: the string `s`.
      - Line 2: the string `t`.
    outputFormat: |
      Print the leftmost shortest covering substring. If none exists, print an empty line.
    constraints:
      - "1 <= |s|, |t| <= 10^5"
      - "s and t consist of English letters (a-z, A-Z)"
    examples:
      - input: |
          xaybzcxab
          abc
        output: |
          cxab
        explanation: "\"aybzc\" and \"bzcxa\" cover a, b and c but have length 5; \"cxab\" (indices 5..8) has length 4 and is the shortest."
      - input: |
          aab
          aaa
        output: "\n"
        explanation: "s has only two a's, so no substring covers t and an empty line is printed."
    hints:
      - "Keep counts of what t needs and a single number 'missing' = how many required characters the window still lacks."
      - "Expand the right edge until missing becomes 0, then shrink the left edge as long as the window still covers t."
      - "Update the answer only when a strictly shorter window is found; since windows are discovered in order of their right end, this keeps the leftmost one among ties."
    explanation: |
      **Brute force -- O(n^2 * sigma) time.** Check every substring (or, for each start, extend
      until it covers `t`) and keep the shortest leftmost one. For each start the extension is
      O(n), giving O(n^2) overall with incremental counts.

      **Optimal sliding window -- O(|s| + |t|) time, O(sigma) space.** Build `need[c]` from `t`
      and set `missing = |t|`. Move `right` across `s`: if `need[s[right]] > 0`, decrement
      `missing`; then decrement `need[s[right]]` (it may go negative for surplus characters).
      Whenever `missing == 0`, advance `left` while `need[s[left]] < 0` (those characters are
      surplus), restoring their counts. The window `[left, right]` is now the shortest covering
      window ending at `right`; record it if strictly shorter than the best. Then release `s[left]`
      (increment its need, increment `missing`) and move `left` on.

      Among windows of equal minimum length, the leftmost one also ends earliest, so it is seen
      first and the strict comparison keeps it.
