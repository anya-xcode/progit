    title: "Number of Substrings Containing All Three Characters"
    difficulty: Hard
    topic: "Sliding Window"
    subtopic: "Hard Problems"
    tags: [string, sliding-window]
    sourceUrl: "https://leetcode.com/problems/number-of-substrings-containing-all-three-characters/"
    statement: |
      You are given a string `s` made only of the letters `a`, `b` and `c`.

      Count the non-empty substrings of `s` that contain **at least one** `a`, at least one `b`
      and at least one `c`. Substrings at different positions are counted separately.
    inputFormat: |
      - Line 1: the string `s`.
    outputFormat: |
      Print a single integer: the number of qualifying substrings.
    constraints:
      - "1 <= |s| <= 5 * 10^4"
      - "s consists only of 'a', 'b' and 'c'"
    examples:
      - input: |
          aabcb
        output: |
          4
        explanation: "A valid substring must include the c at index 3, an a (index 0 or 1) and a b. Starting at index 0 or 1 and ending at index 3 or 4 gives 2 * 2 = 4 substrings."
      - input: |
          ccba
        output: |
          2
        explanation: "Only \"cba\" and \"ccba\" contain all three letters."
    hints:
      - "If s[i..j] already contains all three letters, then so does every s[i..j'] with j' > j."
      - "Instead, fix the right end. How far to the left can the start be while the window still has every letter?"
      - "Track the last index where each letter appeared. For right end r, the number of valid starts is 1 + min(last[a], last[b], last[c])."
    explanation: |
      **Brute force -- O(n^2) time, O(1) space.** For every start index, extend right until all
      three letters have appeared at index `j`; then every end in `j..n-1` works, so add `n - j`.

      **Optimal -- O(n) time, O(1) space.** Scan with right end `r` and remember `last[x]`, the
      most recent index of each letter (initially `-1`). A substring ending at `r` contains all
      three letters exactly when its start is at most `min(last)`, so add `min(last) + 1` for each
      `r`. (An equivalent two-pointer version shrinks the window while it is still valid and adds
      `left` at each step.)
