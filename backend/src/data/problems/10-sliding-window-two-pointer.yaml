    referenceSolution:
      python: |
        import sys
        from typing import List


        def _at_most_odd(nums: List[int], limit: int) -> int:
            if limit < 0:
                return 0
            left = 0
            odd = 0
            result = 0
            for right, value in enumerate(nums):
                odd += value & 1
                while odd > limit:
                    odd -= nums[left] & 1
                    left += 1
                result += right - left + 1
            return result


        def number_of_subarrays(nums: List[int], k: int) -> int:
            return _at_most_odd(nums, k) - _at_most_odd(nums, k - 1)


        # --- Input/output handling ---
