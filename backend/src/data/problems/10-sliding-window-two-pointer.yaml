    referenceSolution:
      python: |
        import sys


        def min_window_subsequence(s1: str, s2: str) -> str:
            n, m = len(s1), len(s2)
            best_start = -1
            best_len = n + 1
            i = 0
            while i < n:
                matched = 0
                k = i
                while k < n:
                    if s1[k] == s2[matched]:
                        matched += 1
                        if matched == m:
                            break
                    k += 1
                if matched < m:
                    break
                end = k
                back = m - 1
                while back >= 0:
                    if s1[k] == s2[back]:
                        back -= 1
                    k -= 1
                start = k + 1
                if end - start + 1 < best_len:
                    best_len = end - start + 1
                    best_start = start
                i = start + 1
            if best_start < 0:
                return ""
            return s1[best_start:best_start + best_len]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s1 = data[0]
            s2 = data[1]
            print(min_window_subsequence(s1, s2))


        if __name__ == "__main__":
            main()
