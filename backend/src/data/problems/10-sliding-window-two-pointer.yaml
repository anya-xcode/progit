problems:
  - slug: longest-substring-without-repeating-characters
    title: "Longest Substring Without Repeating Characters"
    difficulty: Medium
    topic: "Sliding Window"
    subtopic: "Medium Problems"
    tags: [string, sliding-window, hashing]
    sourceUrl: "https://leetcode.com/problems/longest-substring-without-repeating-characters/"
    statement: |
      You are given a string `s`. Among all of its **contiguous** substrings, consider
      only those in which every character occurs at most once.

      Return the length of the longest such substring. The empty string counts as a
      substring of length `0`.
    inputFormat: |
      - Line 1: the string `s` (it may be empty, in which case the line is blank).
    outputFormat: |
      Print a single integer: the length of the longest substring with all distinct characters.
    constraints:
      - "0 <= |s| <= 5 * 10^4"
      - "s contains printable ASCII characters other than whitespace"
    examples:
      - input: |
          zxyzxyz
        output: |
          3
        explanation: "\"zxy\", \"xyz\" and \"yzx\" all have 3 distinct characters; any window of length 4 repeats a letter."
      - input: |
          cccc
        output: |
          1
        explanation: "Every character is the same, so the best window is a single \"c\"."
    hints:
      - "Checking every substring works but is far too slow. Fix a left end and extend right until a repeat appears."
      - "Keep a window [left, right] with no repeats. When s[right] is already inside the window, where must left jump to?"
      - "Store the last index at which each character was seen so that left can jump in O(1)."
    explanation: |
      **Brute force -- O(n^3) time, O(k) space.** Enumerate all substrings and test each for
      duplicates with a set.

      **Better -- O(n * k) time, O(k) space** (k = alphabet size). For each start index, extend to
      the right while the characters stay distinct; stop at the first repeat.

      **Optimal sliding window -- O(n) time, O(k) space.** Maintain a window `[left, right]` with
      no duplicates and a map `last[c]` = latest index of character `c`. When `s[right]` was last
      seen at an index `>= left`, move `left` to one past that index. After each step the window is
      valid, so update the answer with `right - left + 1`.
    starterCode:
      python: |
        import sys


        def length_of_longest_substring(s: str) -> int:
            # Return the length of the longest substring of s without repeated characters.
            pass


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().rstrip("\r\n")
            print(length_of_longest_substring(s))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def length_of_longest_substring(s: str) -> int:
            last = {}
            left = 0
            best = 0
            for right, ch in enumerate(s):
                if ch in last and last[ch] >= left:
                    left = last[ch] + 1
                last[ch] = right
                best = max(best, right - left + 1)
            return best


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().rstrip("\r\n")
            print(length_of_longest_substring(s))


        if __name__ == "__main__":
            main()
