  - sheetId: prob-10-2-1-longest-substring-with-at
    slug: longest-substring-with-at-most-k-distinct-characters
    title: Longest Substring With At Most K Distinct Characters
    difficulty: Hard
    topic: Sliding Window
    subtopic: Hard Problems
    tags: [string, sliding window, two pointers, hashing]
    sourceUrl: "https://leetcode.com/problems/longest-substring-with-at-most-k-distinct-characters/"
    statement: |
      You are given a string `s` of lowercase English letters and an integer `k`.

      Find the length of the longest **substring** (a contiguous stretch of `s`) that
      uses at most `k` distinct characters. A character may repeat as often as it
      likes - only the number of *different* characters in the substring is limited.

      If `k` is at least the number of distinct characters in `s`, the whole string
      qualifies.
    inputFormat: |
      - Line 1: the string `s`.
      - Line 2: a single integer `k`.
    outputFormat: |
      Print one integer: the length of the longest substring of `s` containing at most
      `k` distinct characters.
    constraints:
      - "1 <= |s| <= 10^4"
      - "1 <= k <= 26"
      - "`s` consists of lowercase English letters only."
    examples:
      - input: |
          abaccc
          2
        output: |
          4
        explanation: "The substring accc (positions 3-6) uses only a and c, so it is valid and has length 4. Anything longer would have to reach back to the b at position 2 and would then use three distinct letters."
      - input: |
          abcd
          1
        output: |
          1
        explanation: "Every letter is different, so a valid substring can only be a single character."
    hints:
      - "A substring that is valid stays valid when you cut characters off either end, so the answer can be found by growing and shrinking one window instead of testing all substrings."
      - "Push the right end forward one character at a time and keep a frequency table of the window. While it holds more than k distinct characters, drop characters from the left end."
      - "A character leaves the window's distinct set only when its frequency drops to 0 - that is the moment to decrement the distinct counter. Record the window length after every shrink."
    explanation: |
      **Brute force - O(n^2) time, O(1) space.** Fix the left end, extend the right
      end with a running frequency table, and stop as soon as the window holds more
      than `k` distinct characters. For `n = 10^4` that is up to `10^8` steps.

      **Sliding window (two pointers) - O(n) time, O(1) space.** The property "the
      window has at most `k` distinct characters" is *monotone*: any sub-window of a
      valid window is valid too. So there is no need to re-examine a window from
      scratch - it is enough to keep one window `[left..right]` and repair it:

      1. Move `right` forward and add `s[right]` to a 26-slot frequency table. If its
         count was 0, the number of distinct characters goes up by one.
      2. While the window holds more than `k` distinct characters, remove `s[left]`
         and move `left` forward; when a count reaches 0 the distinct counter goes
         down by one.
      3. The window is now valid, and it is the longest valid window ending at
         `right`; compare `right - left + 1` with the best seen so far.

      Each index is added once and removed at most once, so both pointers travel a
      total of `2n` steps - O(n) time. The table has one entry per distinct character,
      which is at most 26 here, so the extra space is O(1) (O(min(n, alphabet)) in
      general).

      Two mistakes are common. The first is decrementing the distinct counter on every
      removal instead of only when a count hits zero. The second is shrinking with an
      `if` rather than a `while`: a single removal is not always enough to restore the
      invariant if several copies of the leaving character are still inside.

      A variant of the problem asks for the substring itself rather than its length -
      record `left` alongside the best length when a new maximum is found.
    starterCode:
      python: |
        import sys


        def longest_with_k_distinct(s: str, k: int) -> int:
            # Length of the longest substring of s with at most k distinct characters.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s = data[0]
            k = int(data[1])
            print(longest_with_k_distinct(s, k))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def longest_with_k_distinct(s: str, k: int) -> int:
            counts = [0] * 26
            distinct = 0
            left = 0
            best = 0
            for right in range(len(s)):
                index = ord(s[right]) - 97
                if counts[index] == 0:
                    distinct += 1
                counts[index] += 1
                while distinct > k:
                    out = ord(s[left]) - 97
                    counts[out] -= 1
                    if counts[out] == 0:
                        distinct -= 1
                    left += 1
                if right - left + 1 > best:
                    best = right - left + 1
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s = data[0]
            k = int(data[1])
            print(longest_with_k_distinct(s, k))


        if __name__ == "__main__":
            main()
