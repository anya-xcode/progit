  - sheetId: prob-10-2-4-minimum-window-subsequenc
    slug: minimum-window-subsequence
    title: Minimum Window Subsequence
    difficulty: Hard
    topic: Two Pointers
    subtopic: Hard Problems
    tags: [string, two pointers, sliding window, greedy]
    sourceUrl: "https://leetcode.com/problems/minimum-window-subsequence/"
    statement: |
      You are given two strings `s1` and `s2`.

      Find the shortest **contiguous** substring `w` of `s1` such that `s2` is a
      **subsequence** of `w` - that is, `s2` can be obtained from `w` by deleting some
      characters (possibly none) without reordering the rest.

      If several shortest windows exist, report the one that starts first. If no
      window works, print an empty line.

      Note the asymmetry: the window must be contiguous in `s1`, but the characters of
      `s2` only have to appear inside it in the right *order*, not next to each other.
    inputFormat: |
      - Line 1: the string `s1`.
      - Line 2: the string `s2`.
    outputFormat: |
      Print the shortest qualifying substring of `s1`, or an empty line if there is
      none.
    constraints:
      - "1 <= |s1| <= 10^4"
      - "1 <= |s2| <= 100"
      - "Both strings consist of lowercase English letters only."
    examples:
      - input: |
          abcdebdde
          bde
        output: |
          bcde
        explanation: "Starting at the b in position 2 and matching b, d, e greedily ends at position 5, giving bcde of length 4. The other candidate window, bdde, also has length 4 but starts later, so bcde is the answer."
      - input: |
          banana
          na
        output: |
          na
        explanation: "The n at position 3 is followed immediately by an a, so the window na of length 2 is as short as possible. It is the leftmost window of that length."
    hints:
      - "For a fixed start position, the shortest window is found greedily: walk forward through s1 and take each character of s2 the first time it appears. Stopping at the first opportunity can never be worse than waiting."
      - "Doing that from every start is O(|s1|^2). The fix is to run the greedy match forward once, and then, from the position where the match completed, walk *backwards* matching s2 from its end - that slides the start as far right as possible without breaking the window."
      - "After recording a window, restart the forward scan from one position after that window's start, so the next candidate is found in order and ties are resolved in favour of the leftmost one."
    explanation: |
      **Brute force - O(|s1|^2) time, O(1) space.** From every start position, match
      `s2` greedily and note where the match completes; keep the shortest window seen,
      preferring the earlier start on a tie. The greedy inner match is correct because
      taking the earliest possible occurrence of each character of `s2` never
      postpones the finish. The outer loop makes it quadratic - about `10^8` character
      comparisons at the limit.

      **Forward-backward two pointers - O(|s1| x |s2|) time, O(1) space.** The
      observation is that once a greedy forward match finishes at index `end`, the
      *best* window ending there is found by running the same match backwards:
      starting at `end`, walk left matching `s2` from its last character to its first.
      The index where the backward match completes is the largest possible start, so
      the window is minimal for that `end`. Then set the scan position to
      `start + 1` and repeat. Every restart advances the start by at least one, so
      there are at most `|s1|` rounds, each costing O(|s1|) in the worst case but
      O(|s2|) in practice on the backward leg - the usual bound quoted is
      O(|s1| x |s2|). The space is a handful of indices.

      Update the best window only when the new one is **strictly** shorter, which
      keeps the earliest window among equally short ones, as the statement requires.

      **Dynamic programming - O(|s1| x |s2|) time, O(|s1| x |s2|) space.** Let
      `dp[i][j]` be the largest start index such that `s2[0..j]` is a subsequence of
      `s1[start..i]`. Then `dp[i][j] = dp[i-1][j-1]` when `s1[i] == s2[j]` and
      `dp[i-1][j]` otherwise, and every `i` with `dp[i][m-1]` set gives a candidate
      window. It is easier to reason about but uses far more memory; the row can be
      compressed to O(|s2|).

      Edge cases: `s2` longer than `s1`, `s2` containing a character absent from `s1`,
      and `s2` equal to `s1` - all handled naturally by reporting the empty answer or
      the whole string.
