    statement: |
      Given a binary array `nums` and an integer `goal`, count the **non-empty contiguous
      subarrays** whose elements add up to exactly `goal`.

      Two subarrays are different if they start or end at different positions, even when their
      contents are identical.
    inputFormat: |
      - Line 1: two integers `n` and `goal`.
      - Line 2: `n` space-separated values, each `0` or `1`.
    outputFormat: |
      Print a single integer: the number of subarrays with sum equal to `goal`.
    constraints:
      - "1 <= n <= 3 * 10^4"
      - "nums[i] is 0 or 1"
      - "0 <= goal <= n"
    examples:
      - input: |
          6 2
          0 1 1 0 1 0
        output: |
          6
        explanation: "The subarrays with sum 2 are at index ranges [1,2], [0,2], [1,3], [0,3], [2,4] and [2,5] -- six in total."
      - input: |
          4 0
          0 0 1 0
        output: |
          4
        explanation: "Sum 0 means only zeros: [0], [1], [0,1] from the first block and [3] from the last -- four subarrays."
    hints:
      - "A prefix-sum map answers the question in O(n) time and O(n) space. Can you avoid the extra memory?"
      - "Counting subarrays with sum EXACTLY goal is awkward for a window, but counting those with sum AT MOST goal is easy."
      - "exactly(goal) = atMost(goal) - atMost(goal - 1). Be careful when goal is 0."
    explanation: |
      **Brute force -- O(n^2) time, O(1) space.** Fix the start, extend the end while summing, and
      count the positions where the sum equals `goal`.

      **Better: prefix sums + hash map -- O(n) time, O(n) space.** A subarray `(i, j]` has sum
      `goal` iff `prefix[j] - prefix[i] == goal`. Walk left to right, adding
      `seen[prefix - goal]` to the answer and then recording the current prefix.

      **Optimal: two sliding windows -- O(n) time, O(1) space.** Let `atMost(x)` count subarrays
      with sum `<= x`. Since all values are non-negative, a window works: for each `right`, shrink
      `left` while the sum exceeds `x`, then add `right - left + 1` (every valid subarray ending at
      `right`). The answer is `atMost(goal) - atMost(goal - 1)`, with `atMost(-1) = 0`.
