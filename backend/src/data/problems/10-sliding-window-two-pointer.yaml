    statement: |
      You are given a string `s` of uppercase English letters and an integer `k`.

      You may perform at most `k` operations; each operation changes one character of `s` into any
      other uppercase letter. Find the length of the longest substring that can be made to consist
      of a **single repeated letter**.
    inputFormat: |
      - Line 1: the string `s`.
      - Line 2: the integer `k`.
    outputFormat: |
      Print a single integer: the length of the longest achievable block of one letter.
    constraints:
      - "1 <= |s| <= 10^5"
      - "s contains only 'A'-'Z'"
      - "0 <= k <= |s|"
    examples:
      - input: |
          BAAABCBB
          2
        output: |
          5
        explanation: "Take \"BAAAB\" (indices 0..4) and change both B's to A, giving \"AAAAA\" of length 5. Changing C and A in \"ABCBB\" also gives length 5; nothing of length 6 needs only 2 changes."
      - input: |
          XYZ
          0
        output: |
          1
        explanation: "No changes are allowed and all letters differ, so the best block has length 1."
    hints:
      - "A window can be turned into one letter iff (window length) - (count of its most frequent letter) <= k."
      - "Slide a window and keep letter counts. When the condition fails, move the left edge forward."
      - "You never need the exact maximum frequency after shrinking: keeping the largest value seen so far is enough, because the answer only grows when that value grows."
    explanation: |
      **Brute force -- O(n^2 * 26) time, O(26) space.** For every substring, count letters and
      check whether `length - maxCount <= k`. Maintaining counts incrementally per start index
      brings this to O(n^2).

      **Sliding window -- O(26 * n) time, O(26) space.** Grow the window to the right; while
      `length - max(counts) > k`, shrink it from the left. Track the best valid length.

      **Optimal -- O(n) time, O(26) space.** Keep `maxFreq`, the highest single-letter count ever
      seen in any window, without decreasing it on shrink. If `length - maxFreq > k`, slide the
      window forward by one (move `left` once). The window size therefore never decreases and only
      increases when a larger `maxFreq` makes it valid, so its final size is the answer.
