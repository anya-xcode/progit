      python: |
        import sys
        from typing import List


        def search_matrix_ii(matrix: List[List[int]], target: int) -> bool:
            row = 0
            col = len(matrix[0]) - 1
            while row < len(matrix) and col >= 0:
                value = matrix[row][col]
                if value == target:
                    return True
                if value > target:
                    col -= 1
                else:
                    row += 1
            return False


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            rows, cols = int(data[0]), int(data[1])
            values = [int(v) for v in data[2:2 + rows * cols]]
            target = int(data[2 + rows * cols])
            matrix = [values[r * cols:(r + 1) * cols] for r in range(rows)]
            print("true" if search_matrix_ii(matrix, target) else "false")


        if __name__ == "__main__":
            main()
