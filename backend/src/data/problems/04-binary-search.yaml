  - sheetId: prob-4-2-9-book-allocation-problem
    slug: book-allocation-problem
    title: "Book Allocation Problem"
    difficulty: Hard
    topic: "Binary Search"
    subtopic: "BS on Answers"
    tags: [array, binary-search, greedy]
    sourceUrl: ""
    statement: |
      `n` books stand in a row; book `i` has `pages[i]` pages. They must be handed out to `m`
      students so that:

      - every student gets at least one book;
      - each student receives a **contiguous** block of the row;
      - every book goes to exactly one student.

      Among all such hand-outs, minimise the **largest number of pages any single student ends up
      with**. If `m > n` the requirement cannot be met, so report `-1`.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Line 2: `n` space-separated integers, the array `pages`.
    outputFormat: |
      Print one integer: the smallest possible maximum page count, or `-1` when `m > n`.
    constraints:
      - "1 <= n <= 10^5"
      - "1 <= m <= 10^5"
      - "1 <= pages[i] <= 10^4"
    examples:
      - input: |
          4 2
          12 34 67 90
        output: |
          113
        explanation: "Splitting as (12, 34, 67) and (90) gives piles of 113 and 90, so the maximum is 113; no other split does better."
      - input: |
          3 4
          10 20 30
        output: |
          -1
        explanation: "Four students cannot each get a book when only three books exist, so the answer is -1."
    hints:
      - "If a limit L works, every larger limit works too - that monotonicity is what binary search needs."
      - "For a fixed limit, count greedily: keep adding to the current group while it stays within L, otherwise start a new group."
      - "The answer is never below max(values) and never above sum(values); search that range."
    explanation: |
      **Try every limit - O(sum(pages) · n) time.** Test limits `max(pages), max(pages) + 1, ...`
      with the greedy count below and take the first that needs at most `m` students.

      **The feasibility check - O(n).** Given a limit `L`, walk the books left to right adding to
      the current student's total; when the next book would exceed `L`, hand it to a new student.
      Count the students used and compare with `m`. Greedy is optimal here: giving the current
      student as many books as fit never forces more students later, because any valid assignment
      can be shifted forward book by book without increasing the count.

      **Binary search on the answer - O(n log(sum(pages))) time, O(1) space (optimal).** The
      students needed is non-increasing in `L`, so feasibility flips exactly once. Search
      `low = max(pages)` (a single book must fit in one student's pile) and `high = sum(pages)` (one
      student takes everything). If `mid` is feasible, record it and go left; otherwise go right.

      **Fewer students than allowed is fine.** The greedy check counts the *minimum* students needed
      for limit `L`; if that is below `m`, spare students can always take one book each from a
      larger block without increasing the maximum - which is why `<= m` is the right test. The `-1`
      case is just `m > n`, since every student needs a book.
    starterCode:
      python: |
        import sys
        from typing import List


        def allocate_books(pages: List[int], m: int) -> int:
            # Return the minimum possible maximum pages per student, or -1 when impossible.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            pages = [int(v) for v in data[2:2 + n]]
            print(allocate_books(pages, m))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def allocate_books(pages: List[int], m: int) -> int:
            if m > len(pages):
                return -1

            def students_needed(limit: int) -> int:
                used = 1
                total = 0
                for value in pages:
                    if total + value > limit:
                        used += 1
                        total = value
                    else:
                        total += value
                return used

            low, high = max(pages), sum(pages)
            answer = high
            while low <= high:
                mid = (low + high) // 2
                if students_needed(mid) <= m:
                    answer = mid
                    high = mid - 1
                else:
                    low = mid + 1
            return answer


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            pages = [int(v) for v in data[2:2 + n]]
            print(allocate_books(pages, m))


        if __name__ == "__main__":
            main()
