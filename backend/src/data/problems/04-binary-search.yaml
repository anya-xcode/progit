        import sys
        from typing import List


        def kth_missing(nums: List[int], k: int) -> int:
            # Return the k-th positive integer absent from the strictly increasing array nums.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(v) for v in data[2:2 + n]]
            print(kth_missing(nums, k))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def kth_missing(nums: List[int], k: int) -> int:
            low, high = 0, len(nums) - 1
            while low <= high:
                mid = (low + high) // 2
                missing = nums[mid] - (mid + 1)
                if missing < k:
                    low = mid + 1
                else:
                    high = mid - 1
            return low + k


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(v) for v in data[2:2 + n]]
            print(kth_missing(nums, k))


        if __name__ == "__main__":
            main()
