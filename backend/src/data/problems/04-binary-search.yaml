    referenceSolution:
      python: |
        import sys
        from typing import List


        def smallest_divisor(nums: List[int], limit: int) -> int:
            def total(divisor: int) -> int:
                return sum((value + divisor - 1) // divisor for value in nums)

            low, high = 1, max(nums)
            answer = high
            while low <= high:
                mid = (low + high) // 2
                if total(mid) <= limit:
                    answer = mid
                    high = mid - 1
                else:
                    low = mid + 1
            return answer


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, limit = int(data[0]), int(data[1])
            nums = [int(v) for v in data[2:2 + n]]
            print(smallest_divisor(nums, limit))


        if __name__ == "__main__":
            main()
