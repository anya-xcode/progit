  - sheetId: prob-4-2-11-painters-partition
    slug: painters-partition
    title: "Painter's Partition"
    difficulty: Medium
    topic: "Binary Search"
    subtopic: "BS on Answers"
    tags: [array, binary-search, greedy]
    sourceUrl: ""
    statement: |
      A fence is made of `n` boards standing side by side; board `i` needs `boards[i]` units of time
      to paint. There are `k` painters, each painting at the same speed and all working at the same
      time.

      A painter may only take a **contiguous stretch** of boards (no painter jumps over another's
      work), and every board must be painted. Since the painters work in parallel, the job finishes
      when the busiest painter finishes. Find the smallest possible finishing time.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `boards`.
    outputFormat: |
      Print one integer: the minimum time in which the fence can be painted.
    constraints:
      - "1 <= n <= 10^5"
      - "1 <= k <= 10^5"
      - "1 <= boards[i] <= 10^5"
    examples:
      - input: |
          4 2
          10 20 30 40
        output: |
          60
        explanation: "One painter takes (10, 20, 30) = 60 and the other takes (40); the busiest needs 60, which is the best possible."
      - input: |
          3 5
          5 8 2
        output: |
          8
        explanation: "There are more painters than boards, so each board can have its own painter and the time is the largest board, 8."
    hints:
      - "The finishing time equals the largest total assigned to a single painter, so you are minimising a maximum."
      - "Fix a candidate time T and ask how few painters can finish within T: hand boards to the current painter while the total stays <= T, then move on."
      - "Painters needed shrinks as T grows, so binary search T between max(boards) and sum(boards)."
    explanation: |
      **Try every time - O(sum(boards) · n) time.** Check `T = max(boards)`, `+1`, `+2` ... until the
      greedy count fits in `k` painters.

      **The feasibility check - O(n).** Given `T`, walk the boards keeping the current painter's
      workload; when the next board would push it past `T`, that board starts the next painter's
      stretch. The resulting count is the minimum number of painters that can finish by `T`,
      because loading each painter as much as possible never costs a painter later.

      **Binary search on the answer - O(n log(sum(boards))) time, O(1) space (optimal).**
      `painters(T)` is non-increasing, so `painters(T) <= k` is false below the answer and true from
      it onwards. Search `low = max(boards)` (one board cannot be shared) and `high = sum(boards)`
      (a single painter does everything). On a feasible `mid`, record it and move `high = mid - 1`;
      otherwise `low = mid + 1`.

      **More painters than boards.** When `k >= n` every board can get its own painter, and the
      answer collapses to `max(boards)` - which the search finds automatically, since `low` starts
      there. This is the same computation as book allocation and split-array-largest-sum; only the
      story differs, and here no `-1` case exists because extra painters may simply idle.
