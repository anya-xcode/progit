            data = sys.stdin.read().split()
            n, x = int(data[0]), int(data[1])
            nums = [int(v) for v in data[2:2 + n]]
            print(upper_bound(nums, x))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def upper_bound(nums: List[int], x: int) -> int:
            low, high = 0, len(nums) - 1
            answer = len(nums)
            while low <= high:
                mid = (low + high) // 2
                if nums[mid] > x:
                    answer = mid
                    high = mid - 1
                else:
                    low = mid + 1
            return answer


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, x = int(data[0]), int(data[1])
            nums = [int(v) for v in data[2:2 + n]]
            print(upper_bound(nums, x))


        if __name__ == "__main__":
            main()
