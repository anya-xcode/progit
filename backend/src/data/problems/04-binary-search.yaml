      python: |
        import sys
        from typing import List


        def count_occurrences(nums: List[int], x: int) -> int:
            # Return how many elements equal x.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, x = int(data[0]), int(data[1])
            nums = [int(v) for v in data[2:2 + n]]
            print(count_occurrences(nums, x))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def count_occurrences(nums: List[int], x: int) -> int:
            def first_at_least(target: int) -> int:
                low, high = 0, len(nums) - 1
                answer = len(nums)
                while low <= high:
                    mid = (low + high) // 2
                    if nums[mid] >= target:
                        answer = mid
                        high = mid - 1
                    else:
                        low = mid + 1
                return answer

            return first_at_least(x + 1) - first_at_least(x)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, x = int(data[0]), int(data[1])
            nums = [int(v) for v in data[2:2 + n]]
            print(count_occurrences(nums, x))


        if __name__ == "__main__":
            main()
