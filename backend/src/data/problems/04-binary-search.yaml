    referenceSolution:
      python: |
        import sys
        from typing import List


        def minimize_max_distance(pos: List[int], k: int) -> int:
            gaps = [pos[i + 1] - pos[i] for i in range(len(pos) - 1)]

            def stations_needed(distance: int) -> int:
                return sum((gap + distance - 1) // distance - 1 for gap in gaps)

            low, high = 1, max(gaps)
            answer = high
            while low <= high:
                mid = (low + high) // 2
                if stations_needed(mid) <= k:
                    answer = mid
                    high = mid - 1
                else:
                    low = mid + 1
            return answer


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            pos = [int(v) for v in data[2:2 + n]]
            print(minimize_max_distance(pos, k))


        if __name__ == "__main__":
            main()
