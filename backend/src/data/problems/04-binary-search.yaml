    slug: minimize-max-distance-to-gas-station
    title: "Minimize Max Distance to Gas Station"
    difficulty: Hard
    topic: "Binary Search"
    subtopic: "BS on Answers"
    tags: [array, binary-search, greedy]
    sourceUrl: ""
    statement: |
      A highway runs along the integer number line. `n` gas stations already stand on it at
      **strictly increasing integer** positions `pos[0] < pos[1] < ... < pos[n-1]`.

      You may build up to `k` extra stations, each at an **integer** coordinate of your choice
      strictly between two existing stations. Nothing is built before the first or after the last
      station, so the highway's endpoints do not move.

      Let `D` be the largest distance between two neighbouring stations once you are done. Choose
      the placements that make `D` as small as possible, and print that `D`. Because all positions
      are integers, `D` is an integer too.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated strictly increasing integers, the array `pos`.
    outputFormat: |
      Print one integer: the smallest achievable maximum distance between adjacent stations.
    constraints:
      - "2 <= n <= 10^5"
      - "0 <= k <= 10^9"
      - "0 <= pos[i] <= 10^9"
      - "pos is strictly increasing"
    examples:
      - input: |
          5 2
          1 5 9 13 17
        output: |
          4
        explanation: "Every gap is 4. Two new stations can halve only two of the four gaps, so some gap of 4 survives and the answer stays 4."
      - input: |
          2 3
          0 10
        output: |
          3
        explanation: "The single gap of 10 is split by three stations into four pieces; the best split gives pieces of at most 3 (for example at 3, 6 and 8)."
    hints:
      - "Work with the n - 1 gaps between consecutive stations - each gap is filled independently."
      - "To make every piece of a gap of length g at most D, you need ceil(g / D) pieces, hence ceil(g / D) - 1 new stations inside it."
      - "Summing that over all gaps gives a cost that never increases as D grows, so binary search D in 1..max gap."
    explanation: |
      **Greedy with a heap - O((n + k) log n) time.** Repeatedly take the gap whose current largest
      piece is biggest, add a station there, and push it back. Correct but it performs `k`
      operations, and `k` can be 10^9.

      **The feasibility check - O(n).** For a candidate distance `D >= 1`, a gap of length `g` has
      to be chopped into at least `ceil(g / D)` pieces, which costs `ceil(g / D) - 1` new stations,
      and those cut points can be taken at integer coordinates because `D` and `g` are integers.
      Summing over all gaps gives `need(D)`; `D` is achievable exactly when `need(D) <= k`.

      **Binary search on the answer - O(n log(max gap)) time, O(1) space (optimal).** `need(D)` is
      non-increasing in `D`, so the predicate is monotone. Search `low = 1` and
      `high = max(pos[i+1] - pos[i])` - no placement can ever beat 1, and the untouched largest gap
      always works with zero new stations. Keep the smallest feasible `D`.

      **Why integer coordinates change nothing important.** With real-valued placement the answer
      would be a fraction and you would binary search on real numbers with a fixed precision. By
      restricting the new stations to integer positions the same feasibility test works unchanged
      and the answer becomes an exact integer - no epsilon, no rounding, and the search finishes in
      about 30 iterations.
