  - slug: single-element-in-a-sorted-array
    title: "Single Element in a Sorted Array"
    difficulty: Medium
    topic: "Binary Search"
    subtopic: "BS on 1D Arrays"
    tags: [array, binary-search]
    sourceUrl: "https://leetcode.com/problems/single-element-in-a-sorted-array/"
    statement: |
      The sorted array `nums` consists of pairs of equal values sitting next to each other,
      except for one value that appears only **once**. Find that value.

      Your solution should run in O(log n) time and O(1) extra space.
    inputFormat: |
      - Line 1: an odd integer `n`.
      - Line 2: `n` space-separated integers in non-decreasing order.
    outputFormat: |
      Print the value that appears exactly once.
    constraints:
      - "1 <= n <= 10^5, n is odd"
      - "-10^9 <= nums[i] <= 10^9"
      - "Every value appears exactly twice except one value that appears once"
    examples:
      - input: |
          7
          1 1 2 2 4 5 5
        output: |
          4
        explanation: "Every value is paired except 4."
      - input: |
          5
          3 3 7 7 10
        output: |
          10
        explanation: "The single value 10 is at the very end."
    hints:
      - "XOR of all elements works in O(n), but you can use the sorted structure."
      - "Before the single element, each pair starts at an even index. After it, pairs start at odd indices."
      - "Binary search on an even index mid: compare nums[mid] with nums[mid + 1]."
    explanation: |
      **Linear scan or XOR — O(n) time, O(1) space.** Walk the array in steps of two and
      return the first `i` where `nums[i] != nums[i + 1]` (or the last element), or XOR
      everything together.

      **Binary search on pair alignment — O(log n) time, O(1) space.** To the left of the
      single element, every pair occupies indices `(even, even + 1)`; to its right the pairs
      are shifted to `(odd, odd + 1)`. Search over even indices only: with `low = 0`,
      `high = n - 1`, take `mid` and make it even (subtract 1 if odd). If
      `nums[mid] == nums[mid + 1]`, the alignment is still intact, so the single element is
      to the right: `low = mid + 2`. Otherwise it is at `mid` or to its left: `high = mid`.
      When `low == high`, that index holds the answer.
    starterCode:
      python: |
        import sys
        from typing import List


        def single_non_duplicate(nums: List[int]) -> int:
            # Return the only value that appears once in the sorted array.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(single_non_duplicate(nums))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def single_non_duplicate(nums: List[int]) -> int:
            low, high = 0, len(nums) - 1
            while low < high:
                mid = (low + high) // 2
                if mid % 2 == 1:
                    mid -= 1
                if nums[mid] == nums[mid + 1]:
                    low = mid + 2
                else:
                    high = mid
            return nums[low]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(single_non_duplicate(nums))


        if __name__ == "__main__":
            main()
