    referenceSolution:
      python: |
        import sys
        from typing import List, Tuple


        def floor_and_ceil(nums: List[int], x: int) -> Tuple[int, int]:
            low, high = 0, len(nums) - 1
            floor_value = ceil_value = -1
            while low <= high:
                mid = (low + high) // 2
                if nums[mid] == x:
                    return x, x
                if nums[mid] < x:
                    floor_value = nums[mid]
                    low = mid + 1
                else:
                    ceil_value = nums[mid]
                    high = mid - 1
            return floor_value, ceil_value


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, x = int(data[0]), int(data[1])
            nums = [int(v) for v in data[2:2 + n]]
            low, high = floor_and_ceil(nums, x)
            print(low, high)


        if __name__ == "__main__":
            main()
