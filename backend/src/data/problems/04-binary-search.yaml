    tags: [array, binary-search]
    sourceUrl: "https://leetcode.com/problems/koko-eating-bananas/"
    statement: |
      A monkey named Koko finds `n` piles of bananas; pile `i` holds `piles[i]` bananas. She has
      `h` hours before the guards return.

      Koko picks an integer eating speed `s` (bananas per hour). Every hour she chooses one pile
      and eats `s` bananas from it; if the pile has fewer than `s` bananas she finishes it and
      does not eat anything else during that hour.

      Find the **minimum** integer speed `s` that lets her finish all piles within `h` hours.
    inputFormat: |
      - Line 1: two integers `n` and `h`.
      - Line 2: `n` space-separated integers, the pile sizes.
    outputFormat: |
      Print the minimum eating speed.
    constraints:
      - "1 <= n <= 10^4"
      - "n <= h <= 10^9"
      - "1 <= piles[i] <= 10^9"
    examples:
      - input: |
          4 8
          3 6 7 11
        output: |
          4
        explanation: "At speed 4 the piles take 1 + 2 + 2 + 3 = 8 hours, which fits; speed 3 would need 10 hours."
      - input: |
          5 5
          30 11 23 4 20
        output: |
          30
        explanation: "With exactly one hour per pile she must finish the largest pile (30) in one hour."
    hints:
      - "For a fixed speed s, pile p takes ceil(p / s) hours. Can you check a speed in O(n)?"
      - "If speed s works, every faster speed also works. What does that monotonicity suggest?"
      - "Binary search the speed between 1 and max(piles)."
    explanation: |
      **Try every speed — O(max(piles) · n) time, O(1) space.** Test `s = 1, 2, 3, ...` and
      stop at the first speed whose total hours `sum(ceil(p / s))` is at most `h`.

      **Binary search on the answer — O(n · log(max(piles))) time, O(1) space.** The total
      hours never increase as the speed grows, so feasibility is monotonic. The answer lies in
      `[1, max(piles)]` (speed `max(piles)` needs exactly `n <= h` hours). Binary search: if
      speed `mid` is feasible, record it and try smaller speeds (`high = mid - 1`); otherwise
      go faster (`low = mid + 1`). Compute `ceil(p / s)` with integers as `(p + s - 1) // s`.
    starterCode:
