    title: "Median of Two Sorted Arrays"
    difficulty: Hard
    topic: "Binary Search"
    subtopic: "BS on Answers"
    tags: [array, binary-search, divide-and-conquer]
    sourceUrl: "https://leetcode.com/problems/median-of-two-sorted-arrays/"
    statement: |
      You are given two arrays `a` (length `n`) and `b` (length `m`), each sorted in
      non-decreasing order. Find the **median** of all `n + m` numbers taken together.

      - If `n + m` is odd, the median is the middle element of the combined sorted order.
      - If `n + m` is even, it is the average of the two middle elements.

      Because the inputs are integers, the median is always a whole number or ends in `.5`.
      Aim for O(log(min(n, m))) time.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Line 2: `n` space-separated integers, the array `a` (an empty line if `n = 0`).
      - Line 3: `m` space-separated integers, the array `b` (an empty line if `m = 0`).
    outputFormat: |
      Print the median with **exactly one digit** after the decimal point, e.g. `2.0`, `2.5`,
      `-0.5`.
    constraints:
      - "0 <= n, m <= 10^5"
      - "1 <= n + m"
      - "-10^6 <= a[i], b[i] <= 10^6"
      - "Both arrays are sorted in non-decreasing order"
    examples:
      - input: |
          2 3
          1 5
          2 3 7
        output: |
          3.0
        explanation: "Merged order is 1 2 3 5 7; the middle element is 3."
      - input: |
          2 2
          1 2
          3 4
        output: |
          2.5
        explanation: "Merged order is 1 2 3 4; the median is (2 + 3) / 2 = 2.5."
    hints:
      - "Merging both arrays gives the answer in O(n + m); you only need to merge up to the middle."
      - "Think of cutting a into a left part of size i and b into a left part of size j, with i + j equal to half of the total."
      - "The cut is correct when a[i-1] <= b[j] and b[j-1] <= a[i]. Binary search i over the shorter array."
    explanation: |
      **Merge — O(n + m) time, O(n + m) space.** Merge the arrays like in merge sort and read
      the middle element(s).

      **Merge with counters — O(n + m) time, O(1) space.** Walk both arrays with two pointers
      without storing the merged result, and remember only the elements at positions
      `(n + m) // 2 - 1` and `(n + m) // 2`.

      **Binary search on the partition — O(log(min(n, m))) time, O(1) space.** Make `a` the
      shorter array. Let `half = (n + m + 1) // 2`. Choose `i` elements from `a` and
      `j = half - i` from `b` for the left half. Let `l1 = a[i-1]`, `r1 = a[i]`, `l2 = b[j-1]`,
      `r2 = b[j]` (using -∞/+∞ past the ends). The partition is valid when `l1 <= r2` and
      `l2 <= r1`. If `l1 > r2`, too many elements were taken from `a`, so move `i` left;
      if `l2 > r1`, move `i` right. At the valid cut, the median is `max(l1, l2)` for an odd
      total, or `(max(l1, l2) + min(r1, r2)) / 2` for an even total.

      To print exactly one decimal digit without floating-point issues, work with the integer
      sum `s` of the two middle values: the result is `s / 2`, which is either an integer
      (`.0`) or ends in `.5`.
