    title: "Floor Square Root"
    difficulty: Easy
    topic: "Binary Search"
    subtopic: "BS on Answers"
    tags: [math, binary-search]
    sourceUrl: "https://leetcode.com/problems/sqrtx/"
    statement: |
      Given a non-negative integer `x`, compute the **floor of its square root**: the largest
      integer `r` such that `r * r <= x`.

      Do not use a built-in square root or power function; work with integers only.
    inputFormat: |
      A single integer `x`.
    outputFormat: |
      Print the largest integer `r` with `r * r <= x`.
    constraints:
      - "0 <= x <= 10^18"
    examples:
      - input: |
          28
        output: |
          5
        explanation: "5 * 5 = 25 <= 28 but 6 * 6 = 36 > 28, so the answer is 5."
      - input: |
          49
        output: |
          7
        explanation: "49 is a perfect square: 7 * 7 = 49."
    hints:
      - "Try r = 0, 1, 2, ... until r * r exceeds x. How many steps can that take?"
      - "The condition r * r <= x is true for small r and false from some point on."
      - "Binary search on r in the range [0, x] (or a tighter upper bound)."
    explanation: |
      **Linear search — O(√x) time, O(1) space.** Increase `r` while `(r + 1)²  <= x`. For
      `x = 10^18` that is 10^9 steps — too slow.

      **Binary search on the answer — O(log x) time, O(1) space.** The predicate
      `r * r <= x` is monotonic in `r`. Search `low = 0`, `high = x` (or `min(x, 2·10^9)`).
      If `mid * mid <= x`, `mid` is a valid candidate: store it and move `low = mid + 1`;
      otherwise `high = mid - 1`. The last stored candidate is the floor square root. In
      fixed-width languages, compare `mid <= x / mid` to avoid overflow.

      (Floating-point `sqrt` can be off by one for large inputs, which is why the integer
      method is preferred.)
