    slug: count-occurrences-in-a-sorted-array
    title: "Count Occurrences in a Sorted Array"
    difficulty: Easy
    topic: "Binary Search"
    subtopic: "BS on 1D Arrays"
    tags: [array, binary-search]
    sourceUrl: ""
    statement: |
      Given an array `nums` sorted in non-decreasing order and a value `x`, count how many times
      `x` occurs.

      Because the array is sorted, all copies of `x` sit next to each other in one block.
    inputFormat: |
      - Line 1: two integers `n` and `x`.
      - Line 2: `n` space-separated integers, the array `nums`, in non-decreasing order.
    outputFormat: |
      Print one integer: the number of elements equal to `x` (`0` if it never occurs).
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i], x <= 10^9"
      - "nums is sorted in non-decreasing order"
    examples:
      - input: |
          8 3
          1 2 3 3 3 5 5 9
        output: |
          3
        explanation: "The value 3 fills positions 2, 3 and 4, so it occurs 3 times."
      - input: |
          5 4
          1 2 3 5 6
        output: |
          0
        explanation: "4 is missing, so the count is 0."
    hints:
      - "The copies of x form one contiguous block, so you only need where it starts and where it ends."
      - "The first index with value >= x and the first index with value > x bracket that block."
      - "The count is simply upper_bound(x) - lower_bound(x), and it is 0 automatically when x is absent."
    explanation: |
      **Linear count - O(n) time, O(1) space.** Scan once and increment a counter on every match.

      **Find one, then expand - O(log n + c) time.** Binary search for any occurrence, then walk
      left and right while the values stay equal. Fast when `x` is rare, but degenerates to O(n)
      when `x` fills the array.

      **Two binary searches - O(log n) time, O(1) space (optimal).** Compute
      `first = lower_bound(x)`, the smallest index with `nums[i] >= x`, and
      `after = upper_bound(x)`, the smallest index with `nums[i] > x`. Both are ordinary binary
      searches on a monotone predicate. The occurrences of `x` occupy exactly the index range
      `[first, after)`, so the answer is `after - first`. If `x` is missing, both searches land on
      the same index and the difference is 0 - no special case needed. The running time does not
      depend on how many copies there are.
