    slug: find-peak-element-ii
    title: "Find Peak Element - II"
    difficulty: Medium
    topic: "Binary Search"
    subtopic: "BS on 2D Arrays"
    tags: [matrix, binary-search]
    sourceUrl: "https://leetcode.com/problems/find-a-peak-element-ii/"
    statement: |
      A cell of a grid is a **peak** when it is strictly greater than each of its up to four
      orthogonal neighbours (up, down, left, right). Cells on the border simply have fewer
      neighbours to beat.

      You are given a `rows x cols` grid in which no two side-by-side cells hold the same value and
      **exactly one** peak exists. Report its position.
    inputFormat: |
      - Line 1: two integers `rows` and `cols`.
      - Next `rows` lines: `cols` space-separated integers each - the grid.
    outputFormat: |
      Print two integers separated by a space: the 0-indexed row and column of the peak.
    constraints:
      - "1 <= rows, cols <= 500"
      - "-10^9 <= grid[i][j] <= 10^9"
      - "No two orthogonally adjacent cells hold the same value"
      - "The grid contains exactly one peak"
    examples:
      - input: |
          3 3
          10 20 15
          8 9 6
          7 5 4
        output: |
          0 1
        explanation: "The 20 at row 0, column 1 is larger than its left neighbour 10, its right neighbour 15 and the 9 below it; no other cell beats all of its neighbours."
      - input: |
          1 5
          1 2 5 4 3
        output: |
          0 2
        explanation: "A single row is just the 1D problem: 5 is larger than both 2 and 4."
    hints:
      - "Solve the 1D version first: in an array with no equal neighbours, comparing a[mid] with a[mid + 1] tells you which side must contain a peak."
      - "Lift it to 2D by binary searching over COLUMNS: in the middle column, take the row holding that column's largest value."
      - "That cell already beats its vertical neighbours, so only the left and right neighbours matter - and the bigger of the two points at a half that must contain a peak."
    explanation: |
      **Scan every cell - O(rows · cols) time, O(1) space.** Test each cell against its neighbours.
      With 500 x 500 grids this is 250000 cells and perfectly workable, but it does not scale in
      spirit.

      **Binary search over columns - O(rows · log cols) time, O(1) space (optimal).** Keep a range
      of columns `[low, high]`, initially all of them. Take `mid = (low + high) // 2` and find
      `r`, the row where column `mid` attains its **maximum**. That cell `(r, mid)` is already
      greater than `grid[r-1][mid]` and `grid[r+1][mid]`, so it is a peak unless a horizontal
      neighbour beats it.

      - If `grid[r][mid - 1] > grid[r][mid]`, continue in the left half (`high = mid - 1`).
      - Else if `grid[r][mid + 1] > grid[r][mid]`, continue in the right half (`low = mid + 1`).
      - Otherwise `(r, mid)` is a peak - return it.

      **Why a peak is always inside the chosen half.** Think of the band of columns you keep. Its
      column-wise maxima form a sequence that rises towards the side you moved to, and the
      strictly larger neighbour guarantees the maximum of that band is not on the discarded side.
      Since values are finite and no two adjacent cells are equal, the band's overall maximum is a
      peak of the whole grid. Every step halves the number of columns and costs one O(rows) column
      scan.

      **On uniqueness.** In general a grid can contain several peaks and any one of them is a valid
      answer; this problem guarantees exactly one so the expected output is well defined.
