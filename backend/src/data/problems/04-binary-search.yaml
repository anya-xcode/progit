    slug: kth-missing-positive-number
    title: "Kth Missing Positive Number"
    difficulty: Medium
    topic: "Binary Search"
    subtopic: "BS on Answers"
    tags: [array, binary-search]
    sourceUrl: "https://leetcode.com/problems/kth-missing-positive-number/"
    statement: |
      An array `nums` lists distinct positive integers in **strictly increasing** order. Consider
      the positive integers `1, 2, 3, ...` that are **not** in `nums`.

      Print the `k`-th of those missing numbers.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `nums`, strictly increasing.
    outputFormat: |
      Print one integer: the `k`-th missing positive number.
    constraints:
      - "1 <= n <= 10^5"
      - "1 <= k <= 10^8"
      - "1 <= nums[i] <= 10^9"
      - "nums is strictly increasing"
    examples:
      - input: |
          5 5
          2 3 4 7 11
        output: |
          9
        explanation: "The missing positives are 1, 5, 6, 8, 9, 10, ... and the fifth of them is 9."
      - input: |
          4 2
          1 2 3 4
        output: |
          6
        explanation: "Nothing is missing below 5, so the missing list starts 5, 6, 7, ... and its second entry is 6."
    hints:
      - "How many positive integers are missing before nums[i]? Compare nums[i] with what it would be in the untouched sequence 1, 2, 3, ..."
      - "missing(i) = nums[i] - (i + 1) never decreases as i grows, which is exactly what binary search needs."
      - "Find the last index whose missing count is still below k; the answer is then that index plus k plus 1."
    explanation: |
      **Walk the numbers - O(nums[n-1] + k) time.** Count upwards from 1, skipping values present in
      the array, until `k` missing ones have been seen. Too slow when values reach 10^9.

      **Linear scan over the array - O(n) time, O(1) space.** For each `i`, `nums[i] - (i + 1)`
      missing numbers lie before `nums[i]`. Stop at the first index where this count reaches `k`.

      **Binary search on the answer - O(log n) time, O(1) space (optimal).** The function
      `missing(i) = nums[i] - (i + 1)` is non-decreasing, because consecutive strictly increasing
      integers grow by at least 1 each step. Binary search for the smallest index `i` with
      `missing(i) >= k`; let `low` be where the search settles (equivalently, the number of array
      elements lying before the answer). Then the answer is `low + k`: `low` elements of the array
      have been passed, so the `k`-th gap lands `k` positions after them.

      **A worked sanity check.** With `nums = [2, 3, 4, 7, 11]` and `k = 5`: the missing counts are
      `1, 1, 1, 3, 6`. The first index with count `>= 5` is 4, so `low = 4` and the answer is
      `4 + 5 = 9`. Indeed the missing numbers are 1, 5, 6, 8, 9.
    starterCode:
