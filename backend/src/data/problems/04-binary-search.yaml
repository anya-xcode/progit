    referenceSolution:
      python: |
        import sys
        from typing import List


        def find_median(a: List[int], b: List[int]) -> str:
            if len(a) > len(b):
                a, b = b, a
            n, m = len(a), len(b)
            half = (n + m + 1) // 2
            neg_inf, pos_inf = float("-inf"), float("inf")
            low, high = 0, n
            while low <= high:
                i = (low + high) // 2
                j = half - i
                l1 = a[i - 1] if i > 0 else neg_inf
                r1 = a[i] if i < n else pos_inf
                l2 = b[j - 1] if j > 0 else neg_inf
                r2 = b[j] if j < m else pos_inf
                if l1 > r2:
                    high = i - 1
                elif l2 > r1:
                    low = i + 1
                else:
                    if (n + m) % 2 == 1:
                        return f"{int(max(l1, l2))}.0"
                    total = int(max(l1, l2)) + int(min(r1, r2))
                    sign = "-" if total < 0 else ""
                    return f"{sign}{abs(total) // 2}.{5 if total % 2 else 0}"
            return "0.0"


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            a = [int(x) for x in data[2:2 + n]]
            b = [int(x) for x in data[2 + n:2 + n + m]]
            print(find_median(a, b))


        if __name__ == "__main__":
            main()
