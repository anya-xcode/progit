    slug: minimum-days-to-make-m-bouquets
    title: "Minimum days to make M bouquets"
    difficulty: Medium
    topic: "Binary Search"
    subtopic: "BS on Answers"
    tags: [array, binary-search, greedy]
    sourceUrl: "https://leetcode.com/problems/minimum-number-of-days-to-make-m-bouquets/"
    statement: |
      A row of `n` flowers is planted in a line; flower `i` opens on day `bloom[i]` and stays open
      forever after.

      A bouquet needs `k` flowers that are **adjacent in the row** and already open. Each flower can
      be used in at most one bouquet. Find the earliest day on which `m` bouquets can be made, or
      report `-1` when it is impossible no matter how long you wait.
    inputFormat: |
      - Line 1: three integers `n`, `m` and `k`.
      - Line 2: `n` space-separated integers, the array `bloom`.
    outputFormat: |
      Print one integer: the earliest possible day, or `-1` if `m` bouquets can never be made.
    constraints:
      - "1 <= n <= 10^5"
      - "1 <= m, k <= 10^5"
      - "1 <= bloom[i] <= 10^9"
    examples:
      - input: |
          8 2 3
          7 7 7 7 13 11 12 7
        output: |
          12
        explanation: "By day 12 the flowers 7 7 7 7 (positions 0..3) give one bouquet and 11 12 7 (positions 5..7) give another; on day 11 the second group is not complete yet."
      - input: |
          5 3 2
          1 10 3 10 2
        output: |
          -1
        explanation: "Three bouquets need 6 flowers but only 5 exist, so it is impossible."
    hints:
      - "When is the task hopeless regardless of the day? Compare m * k with n."
      - "For a FIXED day, counting the bouquets is easy: scan the row, grow a run of open flowers, and cut a bouquet each time the run reaches k."
      - "If a day works, every later day works too - so binary search the day between min(bloom) and max(bloom)."
    explanation: |
      **Try every day - O(max(bloom) · n) time.** Test day `1, 2, 3, ...` with the counting scan
      below and stop at the first success. Correct, hopelessly slow when bloom days reach 10^9.

      **The feasibility check - O(n).** On a given day, walk the row keeping `run`, the number of
      consecutive open flowers so far. When `run` reaches `k`, take a bouquet and reset `run` to 0;
      a closed flower also resets it. Cutting greedily as soon as `k` adjacent flowers are
      available is optimal, because delaying a cut can only waste flowers - it never enables a
      bouquet that the greedy cut prevented.

      **Binary search on the answer - O(n log(max bloom)) time, O(1) space (optimal).** Feasibility
      is monotone in the day: a flower open on day `d` is still open on day `d + 1`, so the bouquet
      count never decreases. Search `low = min(bloom)`, `high = max(bloom)`; if `mid` works, record
      it and try earlier (`high = mid - 1`), otherwise `low = mid + 1`. Searching only inside the
      range of bloom days is enough because the count only changes on days when some flower opens.

      **The impossible case.** `m` bouquets need `m * k` distinct flowers, so if `m * k > n` the
      answer is `-1`. Checking this first also avoids overflow in languages with fixed-width
      integers, where `m * k` can exceed the range.
