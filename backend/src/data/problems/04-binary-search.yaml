  - slug: lower-bound
    title: "Lower Bound"
    difficulty: Easy
    topic: "Binary Search"
    subtopic: "BS on 1D Arrays"
    tags: [array, binary-search]
    sourceUrl: ""
    statement: |
      The **lower bound** of a value `x` in a sorted array `nums` is the smallest index `i`
      such that `nums[i] >= x`. If every element is smaller than `x`, the lower bound is `n`
      (one past the last index).

      Given `nums` sorted in non-decreasing order (duplicates allowed) and `x`, find the lower
      bound in O(log n) time.
    inputFormat: |
      - Line 1: two integers `n` and `x`.
      - Line 2: `n` space-separated integers in non-decreasing order.
    outputFormat: |
      Print the lower bound index (a value between `0` and `n`).
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i], x <= 10^9"
      - "nums is sorted in non-decreasing order"
    examples:
      - input: |
          6 5
          1 2 5 5 8 9
        output: |
          2
        explanation: "nums[2] = 5 is the first element that is at least 5 (the earlier elements are 1 and 2)."
      - input: |
          4 10
          3 5 8 9
        output: |
          4
        explanation: "Every element is smaller than 10, so the answer is n = 4."
    hints:
      - "The condition nums[i] >= x is false for a prefix of the array and true for the rest."
      - "Binary search for the first index where the condition becomes true."
      - "Initialise the answer to n so the 'not found' case needs no special handling."
    explanation: |
      **Linear scan — O(n) time, O(1) space.** Return the first index whose value is `>= x`,
      or `n`.

      **Binary search — O(log n) time, O(1) space.** Because the array is sorted, the
      predicate `nums[i] >= x` is monotonic: `false … false true … true`. Keep
      `answer = n`, `low = 0`, `high = n - 1`. If `nums[mid] >= x`, record `answer = mid` and
      search the left half for an even earlier index (`high = mid - 1`); otherwise search the
      right half (`low = mid + 1`). When the loop ends, `answer` is the first true position.
    starterCode:
      python: |
        import sys
        from typing import List


        def lower_bound(nums: List[int], x: int) -> int:
            # Return the smallest index i with nums[i] >= x, or len(nums) if none.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(lower_bound(nums, k))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def lower_bound(nums: List[int], x: int) -> int:
            low, high = 0, len(nums) - 1
            answer = len(nums)
            while low <= high:
                mid = (low + high) // 2
                if nums[mid] >= x:
                    answer = mid
                    high = mid - 1
                else:
                    low = mid + 1
            return answer


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(lower_bound(nums, k))


        if __name__ == "__main__":
            main()
