                return used

            low, high = max(nums), sum(nums)
            answer = high
            while low <= high:
                mid = (low + high) // 2
                if pieces_needed(mid) <= k:
                    answer = mid
                    high = mid - 1
                else:
                    low = mid + 1
            return answer


        # --- Input/output handling ---
