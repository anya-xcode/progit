    slug: find-the-smallest-divisor
    title: "Find the smallest divisor"
    difficulty: Medium
    topic: "Binary Search"
    subtopic: "BS on Answers"
    tags: [array, binary-search]
    sourceUrl: "https://leetcode.com/problems/find-the-smallest-divisor-given-a-threshold/"
    statement: |
      You are given an array `nums` of positive integers and a threshold `limit`.

      Pick a positive integer `d`, divide every element by `d` **rounding up**, and add the results.
      Find the smallest `d` for which that total is at most `limit`.

      Such a `d` always exists because `limit >= n`, and `d = max(nums)` makes every term 1.
    inputFormat: |
      - Line 1: two integers `n` and `limit`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print one integer: the smallest divisor `d` whose rounded-up quotient sum is `<= limit`.
    constraints:
      - "1 <= n <= 10^5"
      - "n <= limit <= 10^9"
      - "1 <= nums[i] <= 10^9"
    examples:
      - input: |
          5 8
          1 2 5 9 11
        output: |
          5
        explanation: "With d = 4 the rounded quotients are 1 + 1 + 2 + 3 + 3 = 10 which is too big; with d = 5 they are 1 + 1 + 1 + 2 + 3 = 8, exactly the limit."
      - input: |
          3 3
          4 4 4
        output: |
          4
        explanation: "Only d = 4 brings the sum down to 1 + 1 + 1 = 3; any smaller divisor makes at least one quotient 2."
    hints:
      - "Compute the sum for d = 1: it is the largest possible. What happens to the sum as d grows?"
      - "The sum is non-increasing in d, so the set of workable divisors is everything from the answer upwards."
      - "Binary search d in 1..max(nums); ceil(a / d) is (a + d - 1) // d with integer arithmetic."
    explanation: |
      **Try every divisor - O(n · max(nums)) time.** Test `d = 1, 2, 3, ...` and stop at the first
      one that fits. With values up to 10^9 this is far too slow.

      **The feasibility check - O(n).** For a given `d`, `total(d) = sum(ceil(nums[i] / d))`. Using
      integer arithmetic, `ceil(a / d)` is `(a + d - 1) // d`, which avoids floating point
      entirely.

      **Binary search on the answer - O(n log(max nums)) time, O(1) space (optimal).** `total(d)`
      is non-increasing in `d`: making the divisor larger can only shrink each rounded quotient. So
      "total(d) <= limit" is false up to some point and true from there on, and the answer is the
      first true position. Search `low = 1`, `high = max(nums)`; when `mid` fits, record it and try
      smaller (`high = mid - 1`), otherwise `low = mid + 1`.

      **Bounds.** `d = max(nums)` always works (every term becomes 1, giving `n <= limit`), so the
      search never runs past the array maximum and an answer is guaranteed. About 30 iterations,
      each a linear pass.
