  - sheetId: prob-4-1-3-upper-bound
    slug: upper-bound
    title: "Upper Bound"
    difficulty: Easy
    topic: "Binary Search"
    subtopic: "BS on 1D Arrays"
    tags: [array, binary-search]
    sourceUrl: ""
    statement: |
      The **upper bound** of a value `x` in a sorted array is the position of the first element
      that is **strictly greater** than `x`.

      Given an array `nums` sorted in non-decreasing order, report the upper bound of `x`. If every
      element is `<= x`, the answer is `n` (one past the last position).
    inputFormat: |
      - Line 1: two integers `n` and `x`.
      - Line 2: `n` space-separated integers, the array `nums`, in non-decreasing order.
    outputFormat: |
      Print one integer: the smallest index `i` with `nums[i] > x`, or `n` if there is no such
      index.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i], x <= 10^9"
      - "nums is sorted in non-decreasing order"
    examples:
      - input: |
          6 4
          1 2 4 4 7 9
        output: |
          4
        explanation: "Elements 0..3 are all <= 4; the first value above 4 is the 7 at index 4."
      - input: |
          4 9
          1 3 5 7
        output: |
          4
        explanation: "Nothing in the array exceeds 9, so the answer is n = 4."
    hints:
      - "The predicate 'nums[i] > x' is false for a prefix of the array and true for the rest - a perfect setting for binary search."
      - "Keep a variable holding the best index found so far, starting at n, and shrink the search range around it."
      - "Compare with lower bound: swapping > for >= turns one into the other."
    explanation: |
      **Linear scan - O(n) time, O(1) space.** Walk from the left and stop at the first element
      greater than `x`. Correct, but it ignores the sorting.

      **Binary search - O(log n) time, O(1) space (optimal).** Because the array is sorted, the
      test `nums[i] > x` is monotone: once true it stays true. Set `low = 0`, `high = n - 1`,
      `answer = n`. While `low <= high`, take `mid = (low + high) // 2`; if `nums[mid] > x`, record
      `answer = mid` and move left with `high = mid - 1`; otherwise move right with
      `low = mid + 1`. The recorded `answer` ends up being the leftmost true position, or stays `n`
      if nothing is greater.

      **Relation to lower bound and counting.** The lower bound uses `nums[mid] >= x`. With both,
      `upper - lower` is the number of occurrences of `x`, and `lower == upper` means `x` is
      absent. Each search halves the range, so `log2(10^5) ~ 17` steps suffice.
    starterCode:
