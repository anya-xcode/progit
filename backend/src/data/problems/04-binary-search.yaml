  - slug: search-insert-position
    title: "Search Insert Position"
    difficulty: Easy
    topic: "Binary Search"
    subtopic: "BS on 1D Arrays"
    tags: [array, binary-search]
    sourceUrl: "https://leetcode.com/problems/search-insert-position/"
    statement: |
      You have a strictly increasing array `nums` of distinct integers and a value `target`.

      If `target` is in the array, report its index. Otherwise, report the index at which it
      would have to be inserted so that the array stays sorted. Solve it in O(log n) time.
    inputFormat: |
      - Line 1: two integers `n` and `target`.
      - Line 2: `n` space-separated distinct integers in increasing order.
    outputFormat: |
      Print a single index between `0` and `n`.
    constraints:
      - "1 <= n <= 10^4"
      - "-10^4 <= nums[i], target <= 10^4"
      - "nums is strictly increasing"
    examples:
      - input: |
          5 6
          1 3 6 8 10
        output: |
          2
        explanation: "6 is already present at index 2."
      - input: |
          5 4
          1 3 6 8 10
        output: |
          2
        explanation: "4 is not present; placing it between 3 and 6 (at index 2) keeps the array sorted."
    hints:
      - "Where would a present value and a missing value both 'belong'?"
      - "The answer is the first index whose value is >= target — this is exactly the lower bound."
    explanation: |
      **Linear scan — O(n) time, O(1) space.** Walk until you reach an element `>= target`
      and return its index, or `n` if none exists.

      **Binary search (lower bound) — O(log n) time, O(1) space.** In both cases — target
      present or absent — the answer is the first index `i` with `nums[i] >= target`. Run a
      lower-bound binary search with `answer = n` as the default: whenever `nums[mid] >= target`,
      store `mid` and continue left; otherwise go right.
    starterCode:
      python: |
        import sys
        from typing import List


        def search_insert(nums: List[int], target: int) -> int:
            # Return the index of target, or where it would be inserted to keep nums sorted.
