    referenceSolution:
      python: |
        import sys
        from typing import List


        def matrix_median(matrix: List[List[int]]) -> int:
            rows, cols = len(matrix), len(matrix[0])
            half = (rows * cols) // 2

            def count_at_most(value: int) -> int:
                total = 0
                for row in matrix:
                    low, high = 0, cols - 1
                    position = 0
                    while low <= high:
                        mid = (low + high) // 2
                        if row[mid] <= value:
                            position = mid + 1
                            low = mid + 1
                        else:
                            high = mid - 1
                    total += position
                return total

            low = min(row[0] for row in matrix)
            high = max(row[-1] for row in matrix)
            answer = high
            while low <= high:
                mid = low + (high - low) // 2
                if count_at_most(mid) > half:
                    answer = mid
                    high = mid - 1
                else:
                    low = mid + 1
            return answer


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            rows, cols = int(data[0]), int(data[1])
            values = [int(v) for v in data[2:2 + rows * cols]]
            matrix = [values[r * cols:(r + 1) * cols] for r in range(rows)]
            print(matrix_median(matrix))


        if __name__ == "__main__":
            main()
