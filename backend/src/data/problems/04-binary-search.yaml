      python: |
        import sys
        from typing import List, Tuple


        def find_peak_grid(grid: List[List[int]]) -> Tuple[int, int]:
            rows, cols = len(grid), len(grid[0])
            low, high = 0, cols - 1
            while low <= high:
                mid = (low + high) // 2
                best_row = 0
                for i in range(1, rows):
                    if grid[i][mid] > grid[best_row][mid]:
                        best_row = i
                value = grid[best_row][mid]
                left = grid[best_row][mid - 1] if mid > 0 else value - 1
                right = grid[best_row][mid + 1] if mid + 1 < cols else value - 1
                if left > value:
                    high = mid - 1
                elif right > value:
                    low = mid + 1
                else:
                    return best_row, mid
            return -1, -1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            rows, cols = int(data[0]), int(data[1])
            values = [int(v) for v in data[2:2 + rows * cols]]
            grid = [values[r * cols:(r + 1) * cols] for r in range(rows)]
            row, col = find_peak_grid(grid)
            print(row, col)


        if __name__ == "__main__":
            main()
