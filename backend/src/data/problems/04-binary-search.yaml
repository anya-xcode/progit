        import sys
        from typing import List


        def first_and_last(nums: List[int], k: int) -> List[int]:
            def find(go_left: bool) -> int:
                low, high = 0, len(nums) - 1
                found = -1
                while low <= high:
                    mid = (low + high) // 2
                    if nums[mid] == k:
                        found = mid
                        if go_left:
                            high = mid - 1
                        else:
                            low = mid + 1
                    elif nums[mid] < k:
                        low = mid + 1
                    else:
                        high = mid - 1
                return found

            return [find(True), find(False)]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            first, last = first_and_last(nums, k)
            print(first, last)


        if __name__ == "__main__":
            main()
