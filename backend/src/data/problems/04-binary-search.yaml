  - slug: first-and-last-occurrence
    title: "First and Last Occurrence"
    difficulty: Medium
    topic: "Binary Search"
    subtopic: "BS on 1D Arrays"
    tags: [array, binary-search]
    sourceUrl: "https://leetcode.com/problems/find-first-and-last-position-of-element-in-sorted-array/"
    statement: |
      The array `nums` is sorted in non-decreasing order and may contain repeated values.
      For a given `k`, find the index of its **first** occurrence and the index of its **last**
      occurrence.

      If `k` does not appear in the array, both answers are `-1`. Aim for O(log n) time.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers in non-decreasing order.
    outputFormat: |
      Print two integers separated by a space: the first and last index of `k`, or `-1 -1`.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i], k <= 10^9"
      - "nums is sorted in non-decreasing order"
    examples:
      - input: |
          8 8
          2 4 4 8 8 8 11 13
        output: |
          3 5
        explanation: "The value 8 occupies indices 3, 4 and 5."
      - input: |
          5 6
          1 3 5 7 9
        output: |
