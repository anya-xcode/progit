    sourceUrl: "https://leetcode.com/problems/find-minimum-in-rotated-sorted-array/"
    statement: |
      A strictly increasing array of **distinct** integers was rotated by some unknown number
      of positions (possibly zero): a prefix of it was cut off and appended to the end.

      Given the rotated array `nums`, find its smallest element in O(log n) time.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated distinct integers, the rotated array.
    outputFormat: |
      Print the minimum element.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
      - "All values are distinct"
      - "nums is a rotation of a strictly increasing array"
    examples:
      - input: |
          6
          7 9 11 1 3 5
        output: |
          1
        explanation: "The original array 1 3 5 7 9 11 was rotated; the smallest element is 1."
      - input: |
          5
          2 4 6 8 10
        output: |
          2
        explanation: "The array was rotated by zero positions, so the first element is the minimum."
    hints:
      - "If nums[low] <= nums[high], the range is already sorted — its minimum is nums[low]."
      - "Compare nums[mid] with nums[high]: which side must contain the drop?"
    explanation: |
      **Linear scan — O(n) time, O(1) space.** Take the minimum of all elements.

      **Binary search — O(log n) time, O(1) space.** Keep `low = 0`, `high = n - 1`. While
      `low < high`, let `mid = (low + high) // 2`. If `nums[mid] > nums[high]`, the rotation
      point (and thus the minimum) is strictly to the right of `mid`, so `low = mid + 1`.
      Otherwise `nums[mid..high]` is sorted and the minimum is at `mid` or to its left, so
      `high = mid`. When the range shrinks to one element, `nums[low]` is the minimum.
