    slug: kth-element-of-2-sorted-arrays
    title: "Kth element of 2 sorted arrays"
    difficulty: Medium
    topic: "Binary Search"
    subtopic: "BS on Answers"
    tags: [array, binary-search, two-pointers]
    sourceUrl: ""
    statement: |
      Two arrays `a` and `b` are each sorted in non-decreasing order. If you merged them into one
      sorted array of `n + m` values (keeping duplicates), what would the `k`-th value be?

      `k` is counted from 1, so `k = 1` asks for the smallest value overall.
    inputFormat: |
      - Line 1: three integers `n`, `m` and `k`.
      - Line 2: `n` space-separated integers, the array `a` (empty line when `n = 0`).
      - Line 3: `m` space-separated integers, the array `b` (empty line when `m = 0`).
    outputFormat: |
      Print one integer: the `k`-th smallest value of the merged array.
    constraints:
      - "0 <= n, m <= 10^5"
      - "1 <= k <= n + m"
      - "-10^9 <= a[i], b[i] <= 10^9"
      - "a and b are sorted in non-decreasing order"
    examples:
      - input: |
          4 3 5
          2 3 6 7
          1 4 8
        output: |
          6
        explanation: "Merged the values read 1 2 3 4 6 7 8; the fifth of them is 6."
      - input: |
          3 3 1
          5 6 7
          1 2 3
        output: |
          1
        explanation: "k = 1 asks for the overall minimum, which is the 1 at the front of the second array."
    hints:
      - "Merging with two pointers and stopping after k steps already gives O(k) - good, but k can be 2·10^5."
      - "Instead, decide how many of the k smallest values come from a: if it is i, then k - i come from b. Binary search i."
      - "A split is correct when the largest value taken from either array is not greater than the smallest value left behind in the other."
    explanation: |
      **Merge fully - O(n + m) time, O(n + m) space.** Build the merged array and index it. Simple
      and perfectly fine when the arrays are small.

      **Partial merge - O(k) time, O(1) space.** Advance two pointers, always consuming the smaller
      front value, and stop after `k` values have been consumed.

      **Binary search on the split - O(log(min(n, m))) time, O(1) space (optimal).** Always search
      over the shorter array; say that is `a`. Choose `i`, the number of values taken from `a`;
      then `j = k - i` come from `b`. Write `left_a = a[i-1]` (or `-infinity` when `i = 0`),
      `right_a = a[i]` (or `+infinity` when `i = n`), and similarly for `b`. The split is the right
      one exactly when `left_a <= right_b` and `left_b <= right_a`: that says everything taken is
      no bigger than anything left behind, so the `k` chosen values really are the `k` smallest.
      The answer is then `max(left_a, left_b)`.

      **Steering the search.** If `left_a > right_b`, too much was taken from `a`, so move the
      upper end of the search down; otherwise take more from `a`. Clamp `i` to the range
      `[max(0, k - m), min(k, n)]` so that `j` stays a valid count. Each step halves the range, so
      the whole thing costs `O(log(min(n, m)))` regardless of `k` - this is the same machinery as
      the median of two sorted arrays, with the split size chosen as `k` instead of half the
      total.
    starterCode:
      python: |
        import sys
        from typing import List


        def kth_element(a: List[int], b: List[int], k: int) -> int:
            # Return the k-th smallest value (1-indexed) of the merged sorted arrays.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m, k = int(data[0]), int(data[1]), int(data[2])
            a = [int(v) for v in data[3:3 + n]]
            b = [int(v) for v in data[3 + n:3 + n + m]]
            print(kth_element(a, b, k))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def kth_element(a: List[int], b: List[int], k: int) -> int:
            if len(a) > len(b):
                a, b = b, a
            n, m = len(a), len(b)
            low = max(0, k - m)
            high = min(k, n)
            neg_inf = float("-inf")
            pos_inf = float("inf")
            while low <= high:
                i = (low + high) // 2
                j = k - i
                left_a = a[i - 1] if i > 0 else neg_inf
                right_a = a[i] if i < n else pos_inf
                left_b = b[j - 1] if j > 0 else neg_inf
                right_b = b[j] if j < m else pos_inf
                if left_a <= right_b and left_b <= right_a:
                    return int(max(left_a, left_b))
                if left_a > right_b:
                    high = i - 1
                else:
                    low = i + 1
            return -1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m, k = int(data[0]), int(data[1]), int(data[2])
            a = [int(v) for v in data[3:3 + n]]
            b = [int(v) for v in data[3 + n:3 + n + m]]
            print(kth_element(a, b, k))


        if __name__ == "__main__":
            main()
