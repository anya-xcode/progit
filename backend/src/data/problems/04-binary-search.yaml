problems:
  - slug: binary-search
    title: "Binary Search"
    difficulty: Easy
    topic: "Binary Search"
    subtopic: "BS on 1D Arrays"
    tags: [array, binary-search]
    sourceUrl: "https://leetcode.com/problems/binary-search/"
    statement: |
      You are given an array `nums` of **distinct** integers sorted in increasing order, and an
      integer `k`. Find the position of `k` in the array, or report that it is absent.

      Your algorithm should run in O(log n) time.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated distinct integers in increasing order.
    outputFormat: |
      Print the 0-based index of `k` in `nums`, or `-1` if `k` does not occur.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i], k <= 10^9"
      - "nums is strictly increasing"
    examples:
      - input: |
          6 9
          -1 0 3 5 9 12
        output: |
          4
        explanation: "9 is stored at index 4."
      - input: |
          4 2
          -4 1 3 8
        output: |
          -1
        explanation: "2 lies between 1 and 3 but is not in the array."
    hints:
      - "Compare k with the middle element. What does the result tell you about the other half?"
      - "Keep a search range [low, high] and halve it at every step until it is empty."
    explanation: |
      **Linear scan — O(n) time, O(1) space.** Check each element in turn.

      **Binary search — O(log n) time, O(1) space.** Keep `low = 0`, `high = n - 1`. While
      `low <= high`, look at `mid = (low + high) // 2`. If `nums[mid] == k` you are done; if
      `nums[mid] < k`, the target can only be to the right, so `low = mid + 1`; otherwise
      `high = mid - 1`. If the range becomes empty, `k` is absent. Each step halves the
      range. (In fixed-width languages compute `mid = low + (high - low) / 2` to avoid
      overflow.)
    starterCode:
      python: |
        import sys
        from typing import List


        def binary_search(nums: List[int], k: int) -> int:
            # Return the index of k in the sorted array nums, or -1.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(binary_search(nums, k))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def binary_search(nums: List[int], k: int) -> int:
            low, high = 0, len(nums) - 1
            while low <= high:
                mid = (low + high) // 2
                if nums[mid] == k:
                    return mid
                if nums[mid] < k:
                    low = mid + 1
                else:
                    high = mid - 1
            return -1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(binary_search(nums, k))


        if __name__ == "__main__":
            main()
