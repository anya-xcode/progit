    slug: search-in-rotated-sorted-array-ii
    title: "Search in rotated sorted array-II"
    difficulty: Medium
    topic: "Binary Search"
    subtopic: "BS on 1D Arrays"
    tags: [array, binary-search]
    sourceUrl: "https://leetcode.com/problems/search-in-rotated-sorted-array-ii/"
    statement: |
      A non-decreasing array was rotated left an unknown number of times: the result is
      `nums`. Unlike the classic version, **duplicate values are allowed**.

      Decide whether the value `x` appears anywhere in `nums`.
    inputFormat: |
      - Line 1: two integers `n` and `x`.
      - Line 2: `n` space-separated integers, the rotated array `nums`.
    outputFormat: |
      Print `true` if `x` occurs in `nums`, otherwise `false`.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i], x <= 10^9"
      - "nums is a non-decreasing array rotated left by some amount; values may repeat"
    examples:
      - input: |
          7 3
          6 7 1 2 3 4 5
        output: |
          true
        explanation: "The sorted array 1..7 was rotated by two; 3 is present, so the answer is true."
      - input: |
          8 0
          1 1 1 1 1 1 2 1
        output: |
          false
        explanation: "Every value is 1 or 2, so 0 never occurs. This is also the case where duplicates force the search to shrink one step at a time."
    hints:
      - "In a rotated array, at least one of the two halves around mid is sorted - find out which, then decide where x can be."
      - "Duplicates break that test: when nums[low], nums[mid] and nums[high] are all equal you cannot tell which side is sorted."
      - "In exactly that ambiguous case, shrink the range by one from both ends (low += 1, high -= 1) and carry on."
    explanation: |
      **Linear scan - O(n) time, O(1) space.** Just look for `x`. Perfectly correct, and in the
      worst case it is also what the clever method costs.

      **Modified binary search - O(log n) average, O(n) worst case, O(1) space.** Keep
      `low`/`high`. At `mid`: if `nums[mid] == x` answer `true`. Otherwise decide which side is
      sorted. If `nums[low] <= nums[mid]`, the left part is sorted, so if
      `nums[low] <= x < nums[mid]` search left, else search right. If instead the right part is
      sorted, apply the mirrored test with `nums[mid] < x <= nums[high]`.

      **The duplicate trap.** When `nums[low] == nums[mid] == nums[high]` the test above gives no
      information - the array could be sorted on either side. The fix is to discard one element
      from each end (`low += 1`, `high -= 1`) and repeat; this never removes the only copy of `x`,
      because the discarded values equal `nums[mid]`, which is already known to differ from `x`.
      That step costs O(1) but shrinks the range by only 2, so an array such as
      `[1, 1, 1, 1, 1, 1, 0, 1]` degrades to O(n). This worst case is unavoidable: with heavy
      duplication no algorithm can decide the answer without inspecting almost everything.
    starterCode:
      python: |
        import sys
        from typing import List


        def search_rotated_with_duplicates(nums: List[int], x: int) -> bool:
            # Return True when x appears in the rotated (possibly duplicated) array.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, x = int(data[0]), int(data[1])
            nums = [int(v) for v in data[2:2 + n]]
            print("true" if search_rotated_with_duplicates(nums, x) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def search_rotated_with_duplicates(nums: List[int], x: int) -> bool:
            low, high = 0, len(nums) - 1
            while low <= high:
                mid = (low + high) // 2
                if nums[mid] == x:
                    return True
                if nums[low] == nums[mid] and nums[mid] == nums[high]:
                    low += 1
                    high -= 1
                elif nums[low] <= nums[mid]:
                    if nums[low] <= x < nums[mid]:
                        high = mid - 1
                    else:
                        low = mid + 1
                else:
                    if nums[mid] < x <= nums[high]:
                        low = mid + 1
                    else:
                        high = mid - 1
            return False


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, x = int(data[0]), int(data[1])
            nums = [int(v) for v in data[2:2 + n]]
            print("true" if search_rotated_with_duplicates(nums, x) else "false")


        if __name__ == "__main__":
            main()
