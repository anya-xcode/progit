  - sheetId: prob-4-3-3-search-in-2d-matrix-ii
    slug: search-in-2d-matrix-ii
    title: "Search in 2D matrix - II"
    difficulty: Hard
    topic: "Binary Search"
    subtopic: "BS on 2D Arrays"
    tags: [matrix, binary-search, two-pointers]
    sourceUrl: "https://leetcode.com/problems/search-a-2d-matrix-ii/"
    statement: |
      A `rows x cols` matrix is sorted **along each row** (left to right, non-decreasing) and
      **along each column** (top to bottom, non-decreasing). Unlike the fully sorted version, a row
      may start below where the previous row ended, so reading row by row is *not* a sorted
      sequence.

      Decide whether a given `target` appears anywhere in the matrix.
    inputFormat: |
      - Line 1: two integers `rows` and `cols`.
      - Next `rows` lines: `cols` space-separated integers each - the matrix.
      - Last line: a single integer `target`.
    outputFormat: |
      Print `true` if `target` occurs in the matrix, otherwise `false`.
    constraints:
      - "1 <= rows, cols <= 500"
      - "-10^9 <= matrix[i][j], target <= 10^9"
      - "Each row is non-decreasing left to right and each column is non-decreasing top to bottom"
    examples:
      - input: |
          4 4
          1 4 7 11
          2 5 8 12
          3 6 9 16
          10 13 14 17
          9
        output: |
          true
        explanation: "Starting at 11, the walk steps left to 8 (too small, go down), and reaches 9 at row 2, column 2, so the answer is true."
      - input: |
          4 4
          1 4 7 11
          2 5 8 12
          3 6 9 16
          10 13 14 17
          15
        output: |
          false
        explanation: "15 lies between 14 and 16 but is stored nowhere, so the answer is false."
    hints:
      - "Which corner of the matrix tells you the most? Think about a cell that is the largest in its row and the smallest in its column."
      - "Standing at the top-right cell: if it is bigger than the target, its whole column can be discarded; if it is smaller, its whole row can be discarded."
      - "Each comparison removes an entire row or column, so the walk takes at most rows + cols steps."
    explanation: |
      **Check every cell - O(rows · cols) time, O(1) space.** Always correct, but it uses none of the
      ordering.

      **Binary search each row - O(rows · log cols) time, O(1) space.** Every row is sorted, so run
      a binary search in each. A clear improvement, and the natural first idea.

      **Staircase walk - O(rows + cols) time, O(1) space (optimal).** Start at the top-right cell
      `(0, cols - 1)`. That cell is the **largest in its row** and the **smallest in its column**,
      which makes every comparison decisive:

      - if it equals `target`, answer `true`;
      - if it is greater than `target`, no value in that column can be the target (everything below
        is even larger), so drop the column with `col -= 1`;
      - if it is smaller, no value in that row can be the target (everything to the left is even
        smaller), so drop the row with `row += 1`.

      Each step erases a whole row or column, so at most `rows + cols - 1` cells are inspected.
      The bottom-left corner works symmetrically; the other two corners are useless because they
      are extreme in both directions at once and a comparison there rules nothing out.

      **Why the flattening trick fails here.** With only row-wise and column-wise sorting, the
      row-major reading can go down (row 1 may start below the end of row 0), so a single binary
      search over `rows · cols` indices is unsound - that shortcut belongs to the fully sorted
      variant.
