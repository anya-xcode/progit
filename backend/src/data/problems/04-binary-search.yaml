  - sheetId: prob-4-3-2-search-in-a-2d-matrix
    slug: search-in-a-2d-matrix
    title: "Search in a 2D matrix"
    difficulty: Hard
    topic: "Binary Search"
    subtopic: "BS on 2D Arrays"
    tags: [matrix, binary-search]
    sourceUrl: "https://leetcode.com/problems/search-a-2d-matrix/"
    statement: |
      A `rows x cols` matrix is **fully sorted in row-major order**: every row increases from left
      to right, and the first value of each row is larger than the last value of the row above.
      Reading the rows one after another therefore gives one strictly increasing sequence, so every
      value occurs at most once.

      Given a `target`, report where it sits.
    inputFormat: |
      - Line 1: two integers `rows` and `cols`.
      - Next `rows` lines: `cols` space-separated integers each - the matrix.
      - Last line: a single integer `target`.
    outputFormat: |
      Print two integers separated by a space: the 0-indexed row and column of `target`. If the
      matrix does not contain `target`, print `-1 -1`.
    constraints:
      - "1 <= rows, cols <= 300"
      - "-10^9 <= matrix[i][j], target <= 10^9"
      - "Flattening the matrix row by row gives a strictly increasing sequence"
    examples:
      - input: |
          3 4
          1 3 5 7
          10 11 16 20
          23 30 34 60
          16
        output: |
          1 2
        explanation: "Flattened the matrix reads 1 3 5 7 10 11 16 20 23 30 34 60; the value 16 is the seventh entry, i.e. row 1, column 2."
      - input: |
          3 4
          1 3 5 7
          10 11 16 20
          23 30 34 60
          13
        output: |
          -1 -1
        explanation: "13 would belong between 11 and 16 but is not stored, so the answer is -1 -1."
    hints:
      - "Reading the matrix row after row gives a single sorted array - can you binary search it without actually building it?"
      - "Index t of that virtual array corresponds to row t // cols and column t % cols."
      - "One binary search over 0 .. rows*cols - 1 is enough: O(log(rows*cols))."
    explanation: |
      **Check every cell - O(rows · cols) time, O(1) space.** Straightforward, but it throws away the
      ordering.

      **Locate the row, then search it - O(log rows + log cols) time.** Binary search the rows for
      the one whose last element is `>= target`, then binary search inside that row. Two searches,
      and the row selection needs a little care at the boundaries.

      **One search over the flattened matrix - O(log(rows · cols)) time, O(1) space (optimal).**
      Because the row-major reading is sorted, the matrix behaves exactly like a sorted array of
      length `rows · cols`. Binary search indices `low = 0`, `high = rows * cols - 1`; the value at
      virtual index `t` is `matrix[t // cols][t % cols]`. When it equals `target`, report
      `t // cols` and `t % cols`; when it is smaller go right, otherwise go left. If the loop ends
      without a hit, print `-1 -1`.

      **Why it stays O(1) in space.** The flattened array is never materialised - only the index
      arithmetic is used. Note this trick relies on the *global* sorting: for a matrix that is only
      sorted per row and per column, the flattening is no longer monotone and the staircase walk
      must be used instead. Because the sequence is strictly increasing, the reported position is
      unique.
