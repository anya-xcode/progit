  - sheetId: prob-4-3-5-matrix-median
    slug: matrix-median
    title: "Matrix Median"
    difficulty: Hard
    topic: "Binary Search"
    subtopic: "BS on 2D Arrays"
    tags: [matrix, binary-search]
    sourceUrl: ""
    statement: |
      A `rows x cols` matrix has every **row sorted** in non-decreasing order, and `rows * cols` is
      **odd**.

      If all `rows * cols` values were poured into one list and sorted, the median would be the
      middle entry - the one at 0-indexed position `(rows * cols) // 2`. Report that value without
      sorting everything.
    inputFormat: |
      - Line 1: two integers `rows` and `cols`, with `rows * cols` odd.
      - Next `rows` lines: `cols` space-separated integers each, every row in non-decreasing order.
    outputFormat: |
      Print one integer: the median of all `rows * cols` values.
    constraints:
      - "1 <= rows, cols <= 201"
      - "rows * cols is odd"
      - "-10^9 <= matrix[i][j] <= 10^9"
      - "Every row is sorted in non-decreasing order"
    examples:
      - input: |
          3 3
          1 5 7
          2 3 4
          1 6 8
        output: |
          4
        explanation: "The nine values sorted are 1 1 2 3 4 5 6 7 8, and the fifth of them is 4."
      - input: |
          1 5
          2 4 6 8 10
        output: |
          6
        explanation: "With a single row the median is simply its middle entry, 6."
    hints:
      - "Instead of searching positions, search VALUES: for a candidate v, how many matrix entries are <= v?"
      - "That count is the sum over rows of an upper bound, so one candidate costs O(rows · log cols)."
      - "The median is the smallest value v that is present in the matrix and has count(v) > (rows*cols)/2 - binary search v over the value range."
    explanation: |
      **Flatten and sort - O(rows · cols · log(rows · cols)) time, O(rows · cols) space.** Copy every
      value into one list, sort it and index the middle. Simple and a perfect reference, but it
      ignores the row ordering and needs a full copy.

      **Merge with a heap - O(rows · cols · log rows) time, O(rows) space.** Merge the sorted rows
      and stop after `(rows*cols)//2 + 1` values. Better in space, still linear in the number of
      cells.

      **Binary search on the value - O(rows · log cols · log(value range)) time, O(1) space
      (optimal).** For a candidate value `v`, define `count(v)` as the number of matrix entries
      `<= v`. Each row is sorted, so its contribution is an upper-bound search costing
      O(log cols), and the whole count costs O(rows · log cols). `count` is non-decreasing in `v`,
      and the median is exactly the smallest value with `count(v) > (rows * cols) // 2`. Binary
      search `v` over the integer range `[min value, max value]`, keeping the smallest `v` whose
      count passes the test.

      **Why the answer is a real matrix entry.** The smallest `v` whose count exceeds half must be a
      value actually present: if it were absent, `count(v - 1)` would equal `count(v)` and `v - 1`
      would already qualify, contradicting minimality. That is what lets the search run over plain
      integers instead of over positions, and why the odd total makes the median unambiguous.
