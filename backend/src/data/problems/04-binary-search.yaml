    referenceSolution:
      python: |
        import sys


        def floor_sqrt(x: int) -> int:
            low, high = 0, min(x, 2 * 10**9)
            answer = 0
            while low <= high:
                mid = (low + high) // 2
                if mid * mid <= x:
                    answer = mid
                    low = mid + 1
                else:
                    high = mid - 1
            return answer


        # --- Input/output handling ---
        def main():
            x = int(sys.stdin.read().split()[0])
            print(floor_sqrt(x))


        if __name__ == "__main__":
            main()
