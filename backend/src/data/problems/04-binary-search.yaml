    referenceSolution:
      python: |
        import sys
        from typing import List


        def ship_capacity(weights: List[int], days: int) -> int:
            def days_needed(capacity: int) -> int:
                used = 1
                load = 0
                for weight in weights:
                    if load + weight > capacity:
                        used += 1
                        load = weight
                    else:
                        load += weight
                return used

            low, high = max(weights), sum(weights)
            answer = high
            while low <= high:
                mid = (low + high) // 2
                if days_needed(mid) <= days:
                    answer = mid
                    high = mid - 1
                else:
                    low = mid + 1
            return answer


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, days = int(data[0]), int(data[1])
            weights = [int(v) for v in data[2:2 + n]]
            print(ship_capacity(weights, days))


        if __name__ == "__main__":
            main()
