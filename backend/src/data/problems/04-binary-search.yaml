    referenceSolution:
      python: |
        import sys
        from typing import List


        def min_days(bloom: List[int], m: int, k: int) -> int:
            if m * k > len(bloom):
                return -1

            def bouquets_by(day: int) -> int:
                made = run = 0
                for value in bloom:
                    if value <= day:
                        run += 1
                        if run == k:
                            made += 1
                            run = 0
                    else:
                        run = 0
                return made

            low, high = min(bloom), max(bloom)
            answer = -1
            while low <= high:
                mid = (low + high) // 2
                if bouquets_by(mid) >= m:
                    answer = mid
                    high = mid - 1
                else:
                    low = mid + 1
            return answer


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m, k = int(data[0]), int(data[1]), int(data[2])
            bloom = [int(v) for v in data[3:3 + n]]
            print(min_days(bloom, m, k))


        if __name__ == "__main__":
            main()
