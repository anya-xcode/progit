  - slug: find-peak-element
    title: "Find Peak Element"
    difficulty: Medium
    topic: "Binary Search"
    subtopic: "BS on 1D Arrays"
    tags: [array, binary-search]
    sourceUrl: ""
    statement: |
      An index `i` of the array `nums` is a **peak** if `nums[i]` is strictly greater than its
      neighbours. Positions outside the array count as negative infinity, so the first element
      only needs to beat the second, and the last element only needs to beat the one before it.

      In this problem the array is guaranteed to have **exactly one peak**: its values strictly
      increase up to the peak and then strictly decrease (either part may be empty). Find the
      index of the peak in O(log n) time.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the 0-based index of the peak.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
      - "nums strictly increases up to a single peak and strictly decreases after it"
    examples:
      - input: |
          5
          1 4 7 5 2
        output: |
          2
        explanation: "Values rise 1, 4, 7 and then fall 5, 2, so the peak 7 is at index 2."
      - input: |
          4
          -3 0 2 9
        output: |
          3
        explanation: "The array only increases, so the last element (index 3) is the peak."
    hints:
      - "Compare nums[mid] with nums[mid + 1]. Are you on the rising or the falling side?"
      - "If nums[mid] < nums[mid + 1], the peak lies strictly to the right of mid."
      - "Otherwise the peak is at mid or to its left; shrink until one index remains."
    explanation: |
      **Linear scan — O(n) time, O(1) space.** Return the first index `i` where the next element
      is smaller (or `n - 1` if there is none).

      **Binary search on the slope — O(log n) time, O(1) space.** Keep `low = 0`,
      `high = n - 1`. While `low < high`, look at `mid` and its right neighbour. If
      `nums[mid] < nums[mid + 1]`, `mid` is on the increasing slope and the peak is to the
      right, so `low = mid + 1`. Otherwise `mid` is on the decreasing slope or is the peak, so
      `high = mid`. The loop ends with `low` at the peak.

      The same slope argument also finds *some* peak in arrays with many peaks (as long as
      adjacent values differ) — the guarantee of a single peak just makes the answer unique.
    starterCode:
      python: |
        import sys
        from typing import List


        def find_peak(nums: List[int]) -> int:
            # Return the index of the unique peak of nums.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(find_peak(nums))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def find_peak(nums: List[int]) -> int:
            low, high = 0, len(nums) - 1
            while low < high:
                mid = (low + high) // 2
                if nums[mid] < nums[mid + 1]:
                    low = mid + 1
                else:
                    high = mid
            return low


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(find_peak(nums))


        if __name__ == "__main__":
            main()
