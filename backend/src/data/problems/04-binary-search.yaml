  - slug: aggressive-cows
    title: "Aggressive Cows"
    difficulty: Hard
    topic: "Binary Search"
    subtopic: "BS on Answers"
    tags: [array, binary-search, sorting]
    sourceUrl: ""
    statement: |
      A farmer has built `n` stalls along a straight line; stall `i` is at position
      `stalls[i]` (all positions distinct, in no particular order). He needs to place `k` cows
      into `k` different stalls.

      The cows fight when they are close, so he wants the **minimum distance between any two
      cows to be as large as possible**. Find that largest possible minimum distance.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated distinct integers, the stall positions.
    outputFormat: |
      Print the largest achievable value of the minimum distance between two cows.
    constraints:
      - "2 <= n <= 10^5"
      - "2 <= k <= n"
      - "0 <= stalls[i] <= 10^9"
      - "All positions are distinct"
    examples:
      - input: |
          5 3
          1 2 8 4 9
        output: |
          3
        explanation: "After sorting: 1 2 4 8 9. Placing cows at 1, 4 and 8 (or 9) gives a minimum gap of 3; no placement achieves 4."
      - input: |
          4 2
          0 3 10 4
        output: |
          10
        explanation: "With two cows, put them in the two farthest stalls: 10 - 0 = 10."
    hints:
      - "Sort the stalls first."
      - "For a fixed distance d, you can greedily check if k cows fit: place a cow in the first stall, then in each next stall at least d away from the previous cow."
      - "If distance d is achievable, so is every smaller distance. Binary search for the largest feasible d."
    explanation: |
      **Try every distance — O(n · range) time.** After sorting, test `d = 1, 2, ...` up to
      `(max - min) / (k - 1)` with the greedy check below and keep the last feasible one.

      **Greedy check.** Place the first cow in the leftmost stall. Scan to the right, placing a
      cow whenever the stall is at least `d` from the last placed cow. If you place `k` cows,
      `d` is feasible. Taking the earliest possible stall is never worse, because it leaves
      the most room for the remaining cows. This costs O(n).

      **Binary search on the answer — O(n log n + n · log(range)) time, O(1) extra space.**
      Feasibility is monotonic in `d`. Sort, then binary search `d` in
      `[1, stalls[n-1] - stalls[0]]`: if feasible, record it and try larger (`low = mid + 1`);
      otherwise `high = mid - 1`.
    starterCode:
      python: |
        import sys
        from typing import List


        def aggressive_cows(stalls: List[int], k: int) -> int:
            # Return the largest possible minimum distance between k cows.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(aggressive_cows(nums, k))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def aggressive_cows(stalls: List[int], k: int) -> int:
            stalls = sorted(stalls)

            def can_place(distance: int) -> bool:
                count, last = 1, stalls[0]
                for position in stalls[1:]:
                    if position - last >= distance:
                        count += 1
                        last = position
                        if count >= k:
                            return True
                return count >= k

            low, high = 1, stalls[-1] - stalls[0]
            answer = 0
            while low <= high:
                mid = (low + high) // 2
                if can_place(mid):
                    answer = mid
                    low = mid + 1
                else:
                    high = mid - 1
            return answer


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            print(aggressive_cows(nums, k))


        if __name__ == "__main__":
            main()
