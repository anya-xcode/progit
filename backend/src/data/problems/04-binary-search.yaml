    referenceSolution:
      python: |
        import sys
        from typing import List, Tuple


        def search_matrix(matrix: List[List[int]], target: int) -> Tuple[int, int]:
            rows, cols = len(matrix), len(matrix[0])
            low, high = 0, rows * cols - 1
            while low <= high:
                mid = (low + high) // 2
                value = matrix[mid // cols][mid % cols]
                if value == target:
                    return mid // cols, mid % cols
                if value < target:
                    low = mid + 1
                else:
                    high = mid - 1
            return -1, -1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            rows, cols = int(data[0]), int(data[1])
            values = [int(v) for v in data[2:2 + rows * cols]]
            target = int(data[2 + rows * cols])
            matrix = [values[r * cols:(r + 1) * cols] for r in range(rows)]
            row, col = search_matrix(matrix, target)
            print(row, col)


        if __name__ == "__main__":
            main()
