    tags: [array, binary-search]
    sourceUrl: "https://leetcode.com/problems/search-in-rotated-sorted-array/"
    statement: |
      An array of **distinct** integers was sorted in increasing order and then rotated at
      some unknown pivot: some prefix was moved, unchanged, to the end. For example,
      `[1, 2, 4, 6, 7, 9]` might become `[6, 7, 9, 1, 2, 4]`. The rotation may also be by zero
      positions.

      Given the rotated array `nums` and a value `k`, return the index of `k`, or `-1` if it is
      absent. Your solution should run in O(log n) time.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated distinct integers, the rotated array.
    outputFormat: |
      Print the 0-based index of `k`, or `-1`.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i], k <= 10^9"
      - "All values are distinct"
      - "nums is a rotation of a strictly increasing array"
    examples:
      - input: |
          6 1
          6 7 9 1 2 4
        output: |
          3
        explanation: "The value 1 sits at index 3 of the rotated array."
      - input: |
          6 5
          6 7 9 1 2 4
        output: |
          -1
        explanation: "5 does not appear in the array."
    hints:
      - "When you split the array at mid, at least one of the two halves is sorted normally."
      - "Compare nums[low] with nums[mid] to find out which half is sorted."
      - "If k lies inside the range of the sorted half, search there; otherwise search the other half."
    explanation: |
      **Linear scan — O(n) time, O(1) space.** Check every element.

      **Find the pivot, then search — O(log n) time.** Binary search for the index of the
      minimum element, which splits the array into two sorted pieces, then run a normal
      binary search in the piece whose range contains `k`.

      **Single modified binary search — O(log n) time, O(1) space.** At each step, if
      `nums[mid] == k` return `mid`. Otherwise one half is sorted: if `nums[low] <= nums[mid]`
      the left half `[low, mid]` is sorted, and `k` is there exactly when
      `nums[low] <= k < nums[mid]`; else the right half `[mid, high]` is sorted, and `k` is
      there when `nums[mid] < k <= nums[high]`. Discard the half that cannot contain `k`.
    starterCode:
