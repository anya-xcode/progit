  - sheetId: prob-4-2-2-find-nth-root-of-a-number
    slug: find-nth-root-of-a-number
    title: "Find Nth root of a number"
    difficulty: Medium
    topic: "Binary Search"
    subtopic: "BS on Answers"
    tags: [binary-search, math]
    sourceUrl: ""
    statement: |
      Given two integers `n` and `m`, find the positive integer `x` with `x^n == m` (that is, `x`
      multiplied by itself `n` times equals `m`).

      If `m` is not a perfect `n`-th power, print `-1`. Floating-point functions such as
      `pow(m, 1/n)` lose precision on large inputs, so solve it with integer arithmetic only.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
    outputFormat: |
      Print the integer `n`-th root of `m`, or `-1` when `m` is not a perfect `n`-th power.
    constraints:
      - "1 <= n <= 30"
      - "1 <= m <= 10^9"
    examples:
      - input: |
          3 27
        output: |
          3
        explanation: "3 * 3 * 3 = 27, so the cube root is 3."
      - input: |
          4 69
        output: |
          -1
        explanation: "2^4 = 16 and 3^4 = 81, so 69 sits between two consecutive fourth powers and has no integer root."
    hints:
      - "x^n grows with x, so the predicate 'x^n <= m' is true for a prefix of the candidates - binary search over x."
      - "The answer is at most m, and in fact at most 10^(9/n), so the range 1..m is already enough."
      - "Multiplying naively can create enormous intermediate numbers; stop the multiplication early as soon as the running product exceeds m."
    explanation: |
      **Try every candidate - O(m · n) time.** Test `x = 1, 2, 3, ...` until `x^n >= m`. For `n = 1`
      this walks all the way to 10^9.

      **Binary search on the answer - O(n log m) time, O(1) space (optimal).** The function
      `x -> x^n` is strictly increasing on the positive integers, so the answers split into
      "too small", possibly "exactly right", and "too large". Search `low = 1`, `high = m`; at each
      step compute `power(mid, n)` and compare with `m`: equal means `mid` is the answer, smaller
      means go right, larger means go left. About `log2(10^9) ~ 30` iterations, each costing `n`
      multiplications.

      **Keeping the arithmetic safe.** `mid^n` can be astronomically large (`mid` up to 10^9 and
      `n` up to 30), so the power helper multiplies step by step and bails out the moment the
      running product exceeds `m`, returning a "too large" marker. That keeps every intermediate
      value bounded and, in languages with fixed-width integers, avoids overflow entirely.

      **Why not floating point.** `round(m ** (1 / n))` is tempting but the exponentiation is
      inexact: values like `m = 10^9`, `n = 9` can round the wrong way, giving a root that is off
      by one. An integer check `x^n == m` at the end is mandatory if you take that route.
