      python: |
        import sys


        def nth_root(n: int, m: int) -> int:
            def compare_power(base: int) -> int:
                # -1 if base**n < m, 0 if equal, 1 if greater (without huge intermediates).
                product = 1
                for _ in range(n):
                    product *= base
                    if product > m:
                        return 1
                if product == m:
                    return 0
                return -1

            low, high = 1, m
            while low <= high:
                mid = (low + high) // 2
                sign = compare_power(mid)
                if sign == 0:
                    return mid
                if sign < 0:
                    low = mid + 1
                else:
                    high = mid - 1
            return -1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            print(nth_root(n, m))


        if __name__ == "__main__":
            main()
