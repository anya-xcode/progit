    explanation: |
      **Linear scan — O(n) time, O(1) space.** Record the first and last index where `k` is
      seen.

      **Find one occurrence and expand — O(log n + c) time.** Binary search for any copy,
      then walk left and right. This degrades to O(n) when `k` repeats many times.

      **Two binary searches — O(log n) time, O(1) space.** Run a binary search that, on a
      match, stores `mid` and continues left (`high = mid - 1`); it ends with the first
      occurrence. Run a second one that continues right on a match (`low = mid + 1`) to get
      the last occurrence. If the first search found nothing, print `-1 -1`.
