  - sheetId: prob-4-1-11-find-out-how-many-times-t
    slug: find-out-how-many-times-the-array-is-rotated
    title: "Find out how many times the array is rotated"
    difficulty: Easy
    topic: "Binary Search"
    subtopic: "BS on 1D Arrays"
    tags: [array, binary-search]
    sourceUrl: ""
    statement: |
      An array of **distinct** integers was sorted in increasing order and then rotated to the
      **right** `k` times. One right rotation moves every element one position to the right and
      wraps the last element around to the front, so after `k` of them the original smallest value
      sits at index `k`.

      Given the rotated array, recover `k`. A value of `0` means the array is still sorted.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated distinct integers, the rotated array.
    outputFormat: |
      Print one integer: the number of left rotations `k`, which lies in `0 .. n - 1`.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
      - "All values are distinct"
      - "The array is a sorted array rotated right k times for some 0 <= k < n"
    examples:
      - input: |
          5
          4 5 1 2 3
        output: |
          2
        explanation: "Rotating 1 2 3 4 5 right twice gives 4 5 1 2 3, and the smallest value 1 has moved to index 2."
      - input: |
          4
          1 2 3 4
        output: |
          0
        explanation: "The array is already sorted, so it was rotated 0 times."
    hints:
      - "The smallest element is exactly the one that was moved to the front, so k is its index."
      - "At any mid, one of the two halves is sorted; the minimum cannot be strictly inside a sorted half except at its first position."
      - "Compare nums[mid] with nums[high] to decide whether the minimum is at mid or to its right."
    explanation: |
      **Scan for the minimum - O(n) time, O(1) space.** The index of the smallest value is `k`.

      **Binary search on the rotation point - O(log n) time, O(1) space (optimal).** Keep
      `low = 0`, `high = n - 1`. At `mid = (low + high) // 2`, compare `nums[mid]` with
      `nums[high]`:

      - if `nums[mid] > nums[high]`, the drop (the rotation point) is strictly to the right, so
        `low = mid + 1`;
      - otherwise the segment `mid..high` is sorted, so the minimum is at `mid` or to its left, and
        `high = mid`.

      The loop ends with `low == high` at the minimum, and that index is the answer. Note the
      window never becomes empty because `high = mid` keeps `mid` as a candidate, so no separate
      "best so far" variable is needed.

      **Why comparing with `nums[high]` rather than `nums[low]`.** Comparing with `nums[low]` is
      also workable but needs an extra check for the already-sorted case; comparing with the right
      end handles `k = 0` automatically, because then the whole array is sorted and every step
      takes the `high = mid` branch down to index 0. Distinct values are what make the strict
      comparison reliable - with duplicates the same ambiguity as in "search in rotated array II"
      appears.
    starterCode:
      python: |
        import sys
        from typing import List


        def count_rotations(nums: List[int]) -> int:
            # Return how many times the sorted array was rotated left.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(v) for v in data[1:1 + n]]
            print(count_rotations(nums))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def count_rotations(nums: List[int]) -> int:
            low, high = 0, len(nums) - 1
            while low < high:
                mid = (low + high) // 2
                if nums[mid] > nums[high]:
                    low = mid + 1
                else:
                    high = mid
            return low


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(v) for v in data[1:1 + n]]
            print(count_rotations(nums))


        if __name__ == "__main__":
            main()
