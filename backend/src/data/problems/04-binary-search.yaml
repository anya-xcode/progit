    slug: floor-and-ceil-in-sorted-array
    title: "Floor and Ceil in Sorted Array"
    difficulty: Easy
    topic: "Binary Search"
    subtopic: "BS on 1D Arrays"
    tags: [array, binary-search]
    sourceUrl: ""
    statement: |
      For a sorted array `nums` and a value `x`:

      - the **floor** of `x` is the largest element that is `<= x`;
      - the **ceil** of `x` is the smallest element that is `>= x`.

      Report both. When one of them does not exist, report `-1` in its place. All array values and
      `x` are non-negative, so `-1` is never a real answer.
    inputFormat: |
      - Line 1: two integers `n` and `x`.
      - Line 2: `n` space-separated integers, the array `nums`, in non-decreasing order.
    outputFormat: |
      Print two integers on one line: the floor of `x` and then the ceil of `x`, using `-1` for a
      value that does not exist.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= nums[i], x <= 10^9"
      - "nums is sorted in non-decreasing order"
    examples:
      - input: |
          6 5
          2 3 4 7 10 11
        output: |
          4 7
        explanation: "The largest value not above 5 is 4 and the smallest value not below 5 is 7."
      - input: |
          5 7
          1 4 7 8 9
        output: |
          7 7
        explanation: "7 is in the array, so it is both its own floor and its own ceil."
    hints:
      - "Both answers are values, not indices - but they sit next to each other in the array."
      - "One binary search can carry both: when nums[mid] <= x remember it as a floor candidate and go right, otherwise remember it as a ceil candidate and go left."
      - "If x is present in the array, floor and ceil are both x."
    explanation: |
      **Linear scan - O(n) time, O(1) space.** Walk the array keeping the largest value `<= x` and
      the first value `>= x`.

      **One binary search - O(log n) time, O(1) space (optimal).** Set `low = 0`, `high = n - 1`,
      `floor_value = ceil_value = -1`. While `low <= high`, let `mid = (low + high) // 2`. If
      `nums[mid] == x` you are done: `x` is its own floor and its own ceil. If `nums[mid] < x`,
      then `nums[mid]` is a valid floor candidate and a better one can only lie further right, so
      store it and set `low = mid + 1`. Otherwise `nums[mid]` is a valid ceil candidate and a
      smaller one can only be to the left, so store it and set `high = mid - 1`. When the loop ends
      both stored values are the tightest ones seen.

      Do not skip the equality case: folding it into the `<=` branch would record `x` as the floor
      but then keep searching to the right, leaving a ceil that is one element too far.

      **Two bounds instead.** Equivalently, compute `i = lower_bound(nums, x)`. Then the ceil is
      `nums[i]` when `i < n`, and the floor is `nums[i]` when `nums[i] == x`, else `nums[i - 1]`
      when `i > 0`. Same complexity - two clean searches rather than one search with two
      accumulators.
