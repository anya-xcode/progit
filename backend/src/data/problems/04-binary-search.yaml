  - sheetId: prob-4-2-10-split-array-largest-sum
    slug: split-array-largest-sum
    title: "Split array - largest sum"
    difficulty: Hard
    topic: "Binary Search"
    subtopic: "BS on Answers"
    tags: [array, binary-search, dynamic-programming]
    sourceUrl: "https://leetcode.com/problems/split-array-largest-sum/"
    statement: |
      Cut an array `nums` of non-negative integers into exactly `k` **non-empty contiguous** pieces.
      Each piece has a sum; the cost of a cut is the largest of those `k` sums.

      Report the smallest cost achievable over all ways of cutting.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print one integer: the minimum possible largest piece sum.
    constraints:
      - "1 <= k <= n <= 10^4"
      - "0 <= nums[i] <= 10^6"
    examples:
      - input: |
          5 2
          7 2 5 10 8
        output: |
          18
        explanation: "Cutting into (7, 2, 5) and (10, 8) gives sums 14 and 18, so the cost is 18; every other cut is worse."
      - input: |
          4 4
          1 2 3 4
        output: |
          4
        explanation: "Four pieces from four elements means one element each, so the cost is the largest element, 4."
    hints:
      - "Guess the answer L and ask a simpler question: what is the fewest pieces whose sums all stay at most L?"
      - "That count is computed greedily in one pass, and it only gets smaller as L grows."
      - "So binary search L between max(nums) and sum(nums), keeping the smallest L whose greedy count is at most k."
    explanation: |
      **Interval dynamic programming - O(n² k) time, O(n k) space.** Let `dp[g][i]` be the best cost
      for the first `i` elements cut into `g` pieces; then
      `dp[g][i] = min over j of max(dp[g-1][j], sum(j..i-1))`. Exact and a good reference
      implementation, but quadratic in `n`.

      **The feasibility check - O(n).** For a limit `L`, sweep the array accumulating a running
      piece sum and starting a new piece whenever adding the next element would exceed `L`. The
      number of pieces produced is the minimum possible for that limit, because a greedy piece is
      always a superset of what any other valid cut could take at that point.

      **Binary search on the answer - O(n log(sum(nums))) time, O(1) space (optimal).** `pieces(L)`
      is non-increasing in `L`, so the predicate `pieces(L) <= k` is monotone. Search
      `low = max(nums)` (no single element may be split) and `high = sum(nums)` (one piece holds
      everything). Whenever `mid` is feasible, record it and search left; otherwise search right.

      **"Exactly k" versus "at most k".** The greedy check returns the *minimum* number of pieces
      for limit `L`. If that number is below `k`, any piece with two or more elements can be split
      further without raising the maximum, so exactly `k` pieces are reachable as long as
      `k <= n`. That is why testing `pieces(L) <= k` is correct even though the statement demands
      exactly `k`.
    starterCode:
      python: |
        import sys
        from typing import List


        def split_array(nums: List[int], k: int) -> int:
            # Return the minimum possible largest sum over k contiguous pieces.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            nums = [int(v) for v in data[2:2 + n]]
            print(split_array(nums, k))


        if __name__ == "__main__":
            main()
    referenceSolution:
