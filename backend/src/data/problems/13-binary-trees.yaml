    statement: |
      Give every node a **column number**: the root sits in column `0`, a left
      child sits one column to the left of its parent (`column - 1`) and a right
      child one column to the right (`column + 1`).

      Looking at the tree from directly above, in each column you only see the
      node that is **closest to the root** — the first one reached by a level-order
      (breadth-first) walk of that column. Print those nodes, from the leftmost
      column to the rightmost.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print the visible values on one line, space-separated, ordered by column from left to right. Print an empty line for the empty tree.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^4 <= node value <= 10^4"
      - "Node values are not necessarily distinct"
    examples:
      - input: |
          1 2 3 4 5 6 7
        output: |
          4 2 1 3 7
        explanation: "Columns are: 4 at -2, 2 at -1, 1 and 5 and 6 at 0, 3 at 1, 7 at 2. In column 0 the root 1 is the shallowest, so the visible nodes left to right are 4 2 1 3 7."
      - input: |
          10 20 30 N 40 50 N N N 60
        output: |
          20 10 30
        explanation: "20 is at column -1, 10 and 40 and 50 at column 0 (10 is shallowest), 30 at column 1, 60 at column -1 but deeper than 20. So the top view is 20 10 30."
    hints:
      - "Carry the column number along with each node during the traversal."
      - "Breadth-first order guarantees that the first node you meet in a column is the one you can see; record it only if the column is still empty."
      - "A depth-first walk also works, but then you must also compare depths before overwriting a column."
    explanation: |
      **BFS with a column map — O(n) time, O(n) space.** Push `(root, 0)` into a
      queue and keep a dictionary `column -> value`. Pop `(node, column)`, and if
      `column` is not in the dictionary yet, store `node.val` there. Then push
      `(node.left, column - 1)` and `(node.right, column + 1)`. Because BFS drains
      the tree level by level, the first node stored for a column is automatically
      the shallowest one, and among equally shallow nodes it is the leftmost — a
      unique answer either way. Finally sort the dictionary by column and print the
      values. Sorting `k <= n` columns costs `O(n log n)`; tracking the smallest
      and largest column and walking the range makes it `O(n)`.

      **DFS with depths — O(n) time, O(n) space.** Recurse carrying `(column,
      depth)` and store a value only when the column is unseen or the new depth is
      strictly smaller. Correct, but you must recurse left before right *and* keep
      depths, since a depth-first walk can reach a column from a deeper node first.

      **Why BFS is the safer answer.** The "first wins" rule is only valid when
      nodes arrive in non-decreasing depth order. That is exactly what a queue
      gives you and what a stack does not.
