        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def vertical_traversal(root: Optional[TreeNode]) -> List[List[int]]:
            triples = []
            stack = [(root, 0, 0)] if root else []
            while stack:
                node, row, col = stack.pop()
                triples.append((col, row, node.val))
                if node.left:
                    stack.append((node.left, row + 1, col - 1))
                if node.right:
                    stack.append((node.right, row + 1, col + 1))
            triples.sort()
            columns: List[List[int]] = []
            last_col = None
            for col, _, value in triples:
                if col != last_col:
                    columns.append([])
                    last_col = col
                columns[-1].append(value)
            return columns


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
