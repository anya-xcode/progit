      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def root_to_leaf_paths(root: Optional[TreeNode]) -> List[List[int]]:
            paths: List[List[int]] = []
            if root is None:
                return paths
            path: List[int] = []

            def walk(node: TreeNode) -> None:
                path.append(node.val)
                if node.left is None and node.right is None:
                    paths.append(list(path))
                else:
                    if node.left is not None:
                        walk(node.left)
                    if node.right is not None:
                        walk(node.right)
                path.pop()

            walk(root)
            return paths


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
