  - slug: binary-tree-postorder-traversal
    title: "Postorder Traversal"
    difficulty: Easy
    topic: "Binary Trees"
    subtopic: "Traversals"
    tags: [tree, dfs, stack]
    sourceUrl: "https://leetcode.com/problems/binary-tree-postorder-traversal/"
    statement: |
      Given the root of a binary tree, list the node values in **postorder**: the
      left subtree (postorder), then the right subtree (postorder), and the node
      itself last.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print the postorder sequence on one line, space-separated. Print an empty line for the empty tree.
    constraints:
      - "0 <= number of nodes <= 1000"
      - "-1000 <= node value <= 1000"
      - "Tree height <= 1000"
    examples:
      - input: |
          1 2 3 4 5 N 6
        output: |
          4 5 2 6 3 1
        explanation: "Both children of 2 come before 2, the subtree of 3 comes next, and the root 1 is last."
      - input: |
          8 3 N 1 6
        output: |
          1 6 3 8
        explanation: "8 has only a left child 3, whose children are 1 and 6."
    hints:
      - "A node can only be recorded after both of its subtrees are finished."
      - "Preorder with the children swapped (node, right, left) is exactly the reverse of postorder."
      - "For a single-stack version, remember the last node you recorded to know whether you are returning from the right child."
    explanation: |
      **Recursion — O(n) time, O(h) space.** Recurse left, recurse right, record.

      **Two stacks / reversed preorder — O(n) time, O(n) space.** Traverse in the
      order node → right → left using a stack, collecting values, then reverse the
      collected list.

      **One stack — O(n) time, O(h) space.** Walk left pushing nodes. Peek at the
      top: if it has an unvisited right child, move there; otherwise pop and
      record it, remembering it as the last visited node so you do not re-enter
      its right subtree.
