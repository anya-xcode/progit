      python: |
        import sys
        from collections import deque
        from typing import Dict, List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def build_from_postorder_inorder(postorder: List[int], inorder: List[int]) -> Optional[TreeNode]:
            position: Dict[int, int] = {value: index for index, value in enumerate(inorder)}
            cursor = len(postorder) - 1

            def build(low: int, high: int) -> Optional[TreeNode]:
                nonlocal cursor
                if low > high:
                    return None
                value = postorder[cursor]
                cursor -= 1
                node = TreeNode(value)
                mid = position[value]
                node.right = build(mid + 1, high)
                node.left = build(low, mid - 1)
                return node

            return build(0, len(inorder) - 1)


        # --- Input/output handling ---
        def serialize_level_order(root: Optional[TreeNode]) -> str:
            """Level-order values with "N" for a missing child, trailing "N"s dropped."""
            if root is None:
                return "N"
            tokens = [str(root.val)]
            queue = deque([root])
            while queue:
                node = queue.popleft()
                for child in (node.left, node.right):
                    if child is None:
                        tokens.append("N")
                    else:
                        tokens.append(str(child.val))
                        queue.append(child)
            while tokens and tokens[-1] == "N":
                tokens.pop()
            return " ".join(tokens)


        def main():
            sys.setrecursionlimit(10**6)
            data = sys.stdin.read().split()
            n = int(data[0])
            postorder = [int(x) for x in data[1:1 + n]]
            inorder = [int(x) for x in data[1 + n:1 + 2 * n]]
            print(serialize_level_order(build_from_postorder_inorder(postorder, inorder)))


        if __name__ == "__main__":
            main()
