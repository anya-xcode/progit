    slug: post-order-traversal-of-binary-tree-using-1-stack
    title: "Iterative Postorder Traversal with One Stack"
    difficulty: Easy
    topic: "Binary Trees"
    subtopic: "Traversals"
    tags: [tree, dfs, stack, iterative]
    sourceUrl: "https://leetcode.com/problems/binary-tree-postorder-traversal/"
    statement: |
      Given the root of a binary tree, print its **postorder** traversal — left
      subtree, right subtree, node — **without recursion and using a single
      stack**, so the extra memory stays proportional to the height of the tree
      rather than to the number of nodes.

      The difficulty is that a node sits on the stack twice as long as in
      preorder: it may only be recorded after *both* of its subtrees are finished,
      so when you come back to it you must know whether you are arriving from the
      left side or from the right side.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print the postorder sequence on one line, space-separated. Print an empty line for the empty tree.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^4 <= node value <= 10^4"
      - "The tree may be completely skewed, so the height can reach 2000"
    examples:
      - input: |
          5 3 8 1 4 N 9
        output: |
          1 4 3 9 8 5
        explanation: "1 and 4 are recorded before their parent 3, then 9 before 8, and the root 5 comes last."
      - input: |
          2 N 1
        output: |
          1 2
        explanation: "2 has only a right child. The right subtree (just 1) must be finished before 2 is recorded."
    hints:
      - "Keep a variable holding the node you recorded most recently."
      - "When you peek at the top node, decide: if its right child exists and is not the node you just recorded, descend right; otherwise the node is finished."
      - "An alternative is to store a small state number next to each node on the stack instead of tracking the last one recorded."
    explanation: |
      **Two stacks — O(n) time, O(n) space.** Collect the mirrored preorder
      (`node, right, left`) and reverse it. Easy, but it stores every value a
      second time.

      **One stack with a 'last recorded' pointer — O(n) time, O(h) space.** Keep a
      cursor and a variable `last`:

      1. Push nodes while moving left from the cursor, until there is no left child.
      2. Peek at the top node. If it has a right child that is **not** `last`, move
         the cursor to that right child and go back to step 1.
      3. Otherwise both subtrees are done: pop the node, record it, set `last` to
         it, and leave the cursor null so the loop peeks again.

      Comparing the right child with `last` is what distinguishes "I am going down
      the right side for the first time" from "I have just come back up from it",
      which is exactly the information recursion keeps for free. Each node is
      pushed once and popped once, so time stays `O(n)` and the stack never holds
      more than one node per level.

      **One stack with states — O(n) time, O(h) space.** Push `(node, 0)`; on
      popping state 0 push `(node, 1)` and the left child, on state 1 push
      `(node, 2)` and the right child, and on state 2 record the node. Same cost,
      slightly more memory per entry, and easier to get right the first time.
