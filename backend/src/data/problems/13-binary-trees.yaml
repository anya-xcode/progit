    statement: |
      Given the root of a binary tree, print its **inorder** traversal — the left
      subtree, then the node, then the right subtree — **without using recursion**.

      Inorder is the awkward one to write iteratively: a node must be remembered
      while its left subtree is processed and only recorded on the way back up.
      Getting that loop right is what makes binary-search-tree iterators possible
      later on.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print the inorder sequence on one line, space-separated. Print an empty line for the empty tree.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^4 <= node value <= 10^4"
      - "The tree may be completely skewed, so the height can reach 2000"
    examples:
      - input: |
          1 2 3 4 5 N 6
        output: |
          4 2 5 1 3 6
        explanation: "Walking left from 1 stacks 1 and 2 and 4. Popping gives 4, then 2, then the right subtree of 2 gives 5, then 1, then 3 and 6."
      - input: |
          7 N 8 9
        output: |
          7 9 8
        explanation: "7 has no left child, so it is recorded first. Its right child 8 has a left child 9, which must come before 8."
    hints:
      - "Keep a cursor node and a stack: push while you can move left."
      - "When the cursor becomes null, pop — that node's left subtree is finished, so record it and move the cursor to its right child."
      - "The loop must keep running while either the cursor is non-null or the stack is non-empty."
    explanation: |
      **Recursion — O(n) time, O(h) space.** Recurse left, record the node, recurse
      right. The hidden call stack is what the iterative version rebuilds by hand.

      **Explicit stack — O(n) time, O(h) space.** Keep a cursor starting at the
      root and loop while the cursor is non-null **or** the stack is non-empty:

      1. while the cursor is non-null, push it and move to its left child;
      2. pop a node — everything to its left is done — record its value;
      3. set the cursor to that node's right child and repeat.

      Each node is pushed and popped once, so time is `O(n)`; the stack holds one
      node per level of the current path, so space is `O(h)`.

      **Morris inorder — O(n) time, O(1) space.** Instead of a stack, temporarily
      point the rightmost node of the left subtree back at the current node, so the
      walk can return upward on its own. Covered on its own later in this step.
