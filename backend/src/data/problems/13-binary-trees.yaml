                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def serialize_level_order(root: Optional[TreeNode]) -> str:
            """Level-order values with "N" for a missing child, trailing "N"s dropped."""
            if root is None:
                return "N"
            tokens = [str(root.val)]
            queue = deque([root])
            while queue:
                node = queue.popleft()
                for child in (node.left, node.right):
                    if child is None:
                        tokens.append("N")
                    else:
                        tokens.append(str(child.val))
                        queue.append(child)
            while tokens and tokens[-1] == "N":
                tokens.pop()
            return " ".join(tokens)


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
            root = build_tree(lines[0].split() if lines else [])
            data = serialize(root)
