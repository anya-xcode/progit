      python: |
        import sys
        from collections import deque
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def serialize(root: Optional[TreeNode]) -> str:
            tokens: List[str] = []
            stack: List[Optional[TreeNode]] = [root]
            while stack:
                node = stack.pop()
                if node is None:
                    tokens.append("#")
                    continue
                tokens.append(str(node.val))
                stack.append(node.right)
                stack.append(node.left)
            return " ".join(tokens)


        def deserialize(data: str) -> Optional[TreeNode]:
            tokens = data.split()
            if not tokens:
                return None
            cursor = 0
            if tokens[0] == "#":
                return None
            root = TreeNode(int(tokens[0]))
            cursor = 1
            # Each stack entry is a node plus which child slot to fill next.
            stack: List[List] = [[root, 0]]
            while stack and cursor < len(tokens):
                frame = stack[-1]
                node, slot = frame
                if slot == 2:
                    stack.pop()
                    continue
                frame[1] = slot + 1
                token = tokens[cursor]
                cursor += 1
                if token == "#":
                    continue
                child = TreeNode(int(token))
                if slot == 0:
                    node.left = child
                else:
                    node.right = child
                stack.append([child, 0])
            return root


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
