  - sheetId: prob-13-3-11-serialize-and-de-serializ
    slug: serialize-and-de-serialize-bt
    title: "Serialize and Deserialize a Binary Tree"
    difficulty: Hard
    topic: "Binary Trees"
    subtopic: "Hard Problems"
    tags: [tree, dfs, design, string]
    sourceUrl: "https://leetcode.com/problems/serialize-and-deserialize-binary-tree/"
    statement: |
      Write a pair of functions that turn a binary tree into a single line of text
      and turn that text back into the identical tree.

      To keep the answer unique, the exact format is fixed — **preorder with
      explicit nulls**:

      - walk the tree in preorder (node, left subtree, right subtree);
      - write each node's value as a decimal integer;
      - whenever you are about to descend into a **missing** child, write `#`
        instead and do not descend;
      - separate consecutive tokens with a single space.

      The empty tree therefore serializes to exactly `#`, and the tree with root
      `1`, left child `2` and right child `3` serializes to `1 2 # # 3 # #`.

      `deserialize(serialize(root))` must produce a tree with the same shape and
      the same values as `root`.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print two lines. Line 1: the serialization of the tree, in the format above. Line 2: the level-order form of the tree rebuilt from that text (`N` for a missing child of an existing node, trailing `N`s dropped, and `N` alone for the empty tree).
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^4 <= node value <= 10^4"
      - "Node values are not necessarily distinct"
    examples:
      - input: |
          1 2 3 N N 4 5
        output: |
          1 2 # # 3 4 # # 5 # #
          1 2 3 N N 4 5
        explanation: "Preorder visits 1, then 2 whose two children are missing (two #), then 3, then 4 and 5 with their missing children. Rebuilding that text gives back the original tree."
      - input: |
          N
        output: |
          #
          N
        explanation: "The empty tree serializes to a single #, and reading that text back produces the empty tree, printed as N."
    hints:
      - "Both directions are a single preorder walk — the same order, once writing and once reading."
      - "A `#` is what tells the reader 'this subtree is finished', which is why the format needs no brackets or counts."
      - "Deserialize with a cursor over the tokens: read one token; if it is `#` return None, otherwise create the node and read its left subtree and then its right subtree."
    explanation: |
      **Why plain traversals are not enough.** Preorder alone loses the shape: the
      trees "1 with left child 2" and "1 with right child 2" both give `1 2`. Level
      order alone has the same problem unless the gaps are written down. The fix in
      every working format is the same — record the **missing** children explicitly,
      here as `#`.

      **Serialize — O(n) time, O(h) space.** One preorder walk appending
      `str(node.val)` for a node and `#` for a null, then join with spaces. Because
      the walk emits a fixed number of tokens per node (its value, plus one `#` per
      missing child), the output is at most `2n + 1` tokens.

      **Deserialize — O(n) time, O(h) space.** Split the text and keep a cursor.
      `read()` takes the next token: if it is `#` return `None`; otherwise create
      the node, then set `node.left = read()` and `node.right = read()` — in that
      order — and return it. The recursion consumes exactly the tokens that its
      subtree produced, which is why no separators or subtree sizes are needed.
      Each token is read once, so both directions are linear, and the only extra
      memory is the recursion depth plus the token list.

      **Iterative alternatives.** Both directions can be written with an explicit
      stack, which matters when the tree is a 2000-node chain. A level-order format
      (`1 2 3 # # 4 5` written by a queue, with `#` for missing children) is equally
      valid and is what DSAForge's own input lines use; the preorder form is fixed
      here only so the expected output is unique.

      **The usual mistakes.** Forgetting that values can be negative and stripping a
      leading `-`; using an empty token instead of a marker, which a split then
      swallows; and reading the right child before the left one, which silently
      mirrors the tree.
