    tags: [tree, dfs]
    sourceUrl: "https://leetcode.com/problems/diameter-of-binary-tree/"
    statement: |
      The **diameter** of a binary tree is the number of **edges** on the longest
      path between any two nodes. The path does not have to pass through the root.

      Compute the diameter. A tree with zero or one node has diameter 0.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print a single integer, the diameter.
    constraints:
      - "0 <= number of nodes <= 1000"
      - "-1000 <= node value <= 1000"
    examples:
      - input: |
          1 2 3 4 5 N 6
        output: |
          4
        explanation: "The path 4 → 2 → 1 → 3 → 6 uses 4 edges."
      - input: |
          1 2 N 3 4 5 N N 6
        output: |
          4
        explanation: "The longest path 5 → 3 → 2 → 4 → 6 has 4 edges and does not include the root."
    hints:
      - "Any path has a single highest node. At that node the path goes down into the left subtree and down into the right subtree."
      - "The longest path through a node has length height(left) + height(right) edges."
      - "Compute heights bottom-up and update a global best on the way."
    explanation: |
      **Brute force — O(n²) time, O(h) space.** For each node compute
      `height(left) + height(right)` with fresh height computations and take the
      maximum over all nodes.

      **Post-order heights — O(n) time, O(h) space.** A single DFS returns the
      height of every subtree (number of nodes on its longest downward path).
      Before returning from a node, update `best = max(best, leftHeight +
      rightHeight)`, which is the number of edges of the longest path whose highest
      point is this node. Every path is considered exactly at its highest node.
