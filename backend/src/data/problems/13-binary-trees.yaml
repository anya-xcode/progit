      python: |
        import sys
        from collections import deque
        from typing import Dict, List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def nodes_at_distance_k(root: Optional[TreeNode], target: int, k: int) -> List[int]:
            if root is None:
                return []
            parent: Dict[int, Optional[TreeNode]] = {id(root): None}
            start: Optional[TreeNode] = None
            stack = [root]
            while stack:
                node = stack.pop()
                if node.val == target:
                    start = node
                for child in (node.left, node.right):
                    if child is not None:
                        parent[id(child)] = node
                        stack.append(child)
            if start is None:
                return []

            visited = {id(start)}
            level = deque([start])
            for _ in range(k):
                nxt: deque = deque()
                for node in level:
                    for neighbour in (node.left, node.right, parent[id(node)]):
                        if neighbour is not None and id(neighbour) not in visited:
                            visited.add(id(neighbour))
                            nxt.append(neighbour)
                level = nxt
                if not level:
                    return []
            return sorted(node.val for node in level)


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
            root = build_tree(lines[0].split())
            target, k = map(int, lines[1].split())
            print(" ".join(map(str, nodes_at_distance_k(root, target, k))))


        if __name__ == "__main__":
            main()
