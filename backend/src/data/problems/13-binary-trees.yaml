  - sheetId: prob-13-3-9-construct-a-bt-from-preor
    slug: construct-a-bt-from-preorder-and-inorder
    title: "Build a Tree from Preorder and Inorder"
    difficulty: Hard
    topic: "Binary Trees"
    subtopic: "Hard Problems"
    tags: [tree, recursion, hashing, construction]
    sourceUrl: "https://leetcode.com/problems/construct-binary-tree-from-preorder-and-inorder-traversal/"
    statement: |
      You are given the **preorder** and the **inorder** traversals of a binary
      tree whose `n` node values are all **distinct**. Rebuild the tree and return
      its root.

      The two sequences determine exactly one tree: preorder starts with the root,
      and the position of that value inside inorder splits the remaining values
      into the left subtree (before it) and the right subtree (after it).

      The driver prints the tree you return in DSAForge's level-order form, so
      your answer is checked for both shape and values.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes.
      - Line 2: `n` space-separated integers, the preorder traversal (empty line if `n = 0`).
      - Line 3: `n` space-separated integers, the inorder traversal (empty line if `n = 0`).
    outputFormat: |
      Print the level-order values of the rebuilt tree on one line, using `N` for a missing child of an existing node and dropping the trailing `N`s. Print `N` for the empty tree.
    constraints:
      - "0 <= n <= 2000"
      - "-10^4 <= node value <= 10^4, and all values are distinct"
      - "The two sequences are genuine traversals of the same binary tree"
    examples:
      - input: |
          6
          1 2 4 5 3 6
          4 2 5 1 3 6
        output: |
          1 2 3 4 5 N 6
        explanation: "Preorder starts at 1, so 1 is the root. Inorder puts 4 2 5 before 1 (the left subtree) and 3 6 after it (the right subtree); recursing on each half rebuilds the whole tree."
      - input: |
          3
          7 8 9
          7 9 8
        output: |
          7 N 8 9
        explanation: "7 is the root and nothing precedes it in inorder, so its left subtree is empty. In the remaining piece 8 is the root and 9 comes before it, so 9 is 8's left child."
    hints:
      - "The first unused value of preorder is always the root of the piece you are building."
      - "Searching inorder for the root on every call costs O(n) each time — store value -> index in a dictionary first."
      - "Pass index ranges into the recursion instead of slicing lists, and the left subtree's size tells you where to cut the preorder range."
    explanation: |
      **Recursion with slicing — O(n²) time, O(n²) space.** Take `preorder[0]` as
      the root, find it in `inorder` with a linear scan, then recurse on the two
      slices. Every call copies and scans lists, so a skewed tree degrades to
      quadratic.

      **Recursion with a value-to-index map — O(n) time, O(n) space.** Build
      `position[value] = index in inorder` once. Then write
      `build(pre_lo, pre_hi, in_lo, in_hi)`:

      1. if the range is empty, return `None`;
      2. the root value is `preorder[pre_lo]`; look up `mid = position[root]`;
      3. the left subtree holds `left_size = mid - in_lo` values, so it is built
         from `preorder[pre_lo + 1 .. pre_lo + left_size]` and
         `inorder[in_lo .. mid - 1]`;
      4. the right subtree takes the rest of both ranges.

      Each value becomes a node exactly once and every lookup is `O(1)`, so the
      whole construction is linear; the map and the recursion stack are the extra
      memory.

      **Iterative version — O(n) time, O(n) space.** Walk preorder with a stack of
      ancestors and a pointer into inorder: push nodes as left children while the
      top of the stack does not match `inorder[i]`, and when it does, pop while it
      matches, advancing `i`, then attach the next preorder value as the right
      child of the last popped node. Harder to justify, but it avoids recursion on
      a 2000-deep chain.

      **Why distinct values matter.** The algorithm locates the root inside inorder
      by value. With duplicates the position is ambiguous, several trees fit, and
      the problem would no longer have a unique answer.
