  - sheetId: prob-13-3-8-requirements-needed-to-co
    slug: requirements-needed-to-construct-a-unique-bt
    title: "Which Traversal Pairs Rebuild a Unique Tree"
    difficulty: Medium
    topic: "Binary Trees"
    subtopic: "Hard Problems"
    tags: [tree, traversal, theory]
    sourceUrl: ""
    statement: |
      You are handed the values of two traversals of some binary tree whose node
      values are all **distinct**, and told which traversal each one is. Sometimes
      that is enough to rebuild exactly one tree; sometimes several different trees
      produce the same pair.

      For each query you are given the names of the two traversals — each one of
      `preorder`, `inorder` or `postorder`, possibly the same name twice. Decide
      whether *every* pair of sequences of that kind can come from at most one
      binary tree.

      Answer `true` when the pair always determines the tree, and `false` when some
      pair of sequences of those two kinds is produced by two different trees.
    inputFormat: |
      - Line 1: an integer `q`, the number of queries.
      - Next `q` lines: two names separated by a space, each one of `preorder`, `inorder` or `postorder`.
    outputFormat: |
      Print `q` lines, one per query: `true` if that combination always determines a unique binary tree, otherwise `false`.
    constraints:
      - "1 <= q <= 50"
      - "Each name is exactly one of preorder, inorder, postorder"
      - "The two names in a query may be equal"
    examples:
      - input: |
          3
          preorder inorder
          inorder postorder
          preorder postorder
        output: |
          true
          true
          false
        explanation: "Preorder or postorder tells you which value is the root; inorder then splits the remaining values into the two subtrees. Without inorder, preorder and postorder cannot tell a single left child from a single right child."
      - input: |
          2
          inorder inorder
          postorder preorder
        output: |
          false
          false
        explanation: "Two copies of the same traversal add no information. The second query is the same unordered pair as preorder + postorder, which is not enough."
    hints:
      - "Which traversal tells you where the root is? Which one tells you how the remaining values split between the two subtrees?"
      - "Try the two trees 'root 1 with only a left child 2' and 'root 1 with only a right child 2' and write down all three traversals of each."
      - "The order in which the two names are given does not matter."
    explanation: |
      **The rule.** A pair determines the tree exactly when the two names are
      **different** and one of them is **inorder**. So `preorder + inorder` and
      `inorder + postorder` are `true`; `preorder + postorder`, and any pair that
      repeats a name, are `false`.

      **Why inorder is indispensable.** Rebuilding a tree is a recursive split, and
      it needs two facts at every step: *which value is the root*, and *which of the
      remaining values sit on the left*. Preorder hands you the first fact (its
      first value is the root) and so does postorder (its last value is the root),
      but neither says where the split is. Inorder answers exactly that: everything
      before the root's position belongs to the left subtree, everything after it to
      the right. Combining one "root finder" with inorder gives both facts, and
      recursing on the two halves rebuilds the tree uniquely.

      **Why preorder + postorder fails.** Take the two trees "1 with a left child 2"
      and "1 with a right child 2". Both have preorder `1 2` and postorder `2 1`, so
      the pair cannot distinguish them. The ambiguity always comes from a node with
      exactly one child: preorder and postorder never record which side that child
      is on. (For *full* binary trees, where every node has 0 or 2 children, the
      ambiguity disappears and preorder + postorder *is* enough — a nice thing to
      mention in an interview.)

      **Why a repeated name fails.** Two copies of the same traversal are two copies
      of the same information; `inorder + inorder` cannot even locate the root.

      **Complexity.** Each query is answered in `O(1)`, so the whole input takes
      `O(q)` time and `O(1)` extra space. The value of the problem is the
      justification, not the code.
    starterCode:
      python: |
        import sys
        from typing import List


        def determines_unique_tree(first: str, second: str) -> bool:
            # Return True when the two named traversals always rebuild one tree.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            q = int(data[0])
            answers: List[str] = []
            for i in range(q):
                first = data[1 + 2 * i]
                second = data[2 + 2 * i]
                answers.append("true" if determines_unique_tree(first, second) else "false")
            print("\n".join(answers))


        if __name__ == "__main__":
            main()
