  - slug: binary-tree-inorder-traversal
    title: "Inorder Traversal"
    difficulty: Easy
    topic: "Binary Trees"
    subtopic: "Traversals"
    tags: [tree, dfs, stack]
    sourceUrl: "https://leetcode.com/problems/binary-tree-inorder-traversal/"
    statement: |
      Given the root of a binary tree, list the node values in **inorder**: first
      everything in the left subtree (visited inorder), then the node itself, then
      everything in the right subtree (visited inorder).
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print the inorder sequence on one line, space-separated. Print an empty line for the empty tree.
    constraints:
      - "0 <= number of nodes <= 1000"
      - "-1000 <= node value <= 1000"
      - "Tree height <= 1000"
    examples:
      - input: |
          1 2 3 4 5 N 6
        output: |
          4 2 5 1 3 6
        explanation: "The root 1 has left subtree 2 (children 4 and 5) and right subtree 3 (right child 6). Left part gives 4 2 5, then 1, then 3 6."
      - input: |
          7 N 8 9
        output: |
          7 9 8
        explanation: "7 has no left child, so it is printed first; its right child 8 has a left child 9, which comes before 8."
    hints:
      - "The recursive definition translates directly: left, node, right."
      - "To avoid recursion, push nodes onto a stack while walking left; pop, record, then move to the right child."
      - "Morris traversal can reach O(1) extra space by temporarily threading predecessor pointers."
    explanation: |
      **Recursion — O(n) time, O(h) space.** Visit the left subtree, record the
      node, visit the right subtree. `h` is the tree height (call-stack depth).

      **Iterative stack — O(n) time, O(h) space.** Starting at the root, push nodes
      while moving left. When you cannot go left any more, pop a node, record it
      and continue from its right child. This simulates the call stack explicitly
      and avoids recursion limits.

      **Morris traversal — O(n) time, O(1) space.** For each node with a left
      child, find its inorder predecessor (rightmost node of the left subtree) and
      make its right pointer point back to the current node. The thread lets you
      return upward without a stack; remove it on the second visit.
