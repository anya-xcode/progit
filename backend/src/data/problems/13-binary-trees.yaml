    statement: |
      A **path** in a binary tree is a sequence of distinct nodes where each pair
      of consecutive nodes is connected by an edge. A path contains **at least one
      node** and need not pass through the root. Its **sum** is the total of the
      values on it.

      Find the largest possible path sum in the given non-empty tree.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child. The tree is not empty.
    outputFormat: |
      Print a single integer, the maximum path sum.
    constraints:
      - "1 <= number of nodes <= 1000"
      - "-1000 <= node value <= 1000"
    examples:
      - input: |
          -5 4 8 N N 11 -2
        output: |
          19
        explanation: "The best path is 8 → 11 with sum 19. Extending it through -5 to 4 would give 18."
