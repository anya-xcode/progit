  - sheetId: prob-13-3-1-print-root-to-leaf-path-i
    slug: print-root-to-leaf-path-in-bt
    title: "Print All Root-to-Leaf Paths"
    difficulty: Medium
    topic: "Binary Trees"
    subtopic: "Hard Problems"
    tags: [tree, dfs, backtracking]
    sourceUrl: ""
    statement: |
      A **root-to-leaf path** is the sequence of values you read while walking
      from the root down to a leaf, taking one edge at a time. A leaf is a node
      with no children.

      Given the root of a binary tree, print every root-to-leaf path. Print them in
      the order in which a depth-first walk that always tries the **left** child
      before the right one reaches the leaves.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print one path per line: the values from the root to the leaf, space-separated. Print nothing at all for the empty tree.
    constraints:
      - "0 <= number of nodes <= 1000"
      - "-10^4 <= node value <= 10^4"
      - "Node values are not necessarily distinct"
      - "The total number of printed values stays below 10^5"
    examples:
      - input: |
          1 2 3 4 5 N 6
        output: |
          1 2 4
          1 2 5
          1 3 6
        explanation: "The leaves are 4, 5 and 6. Going left first reaches 4, then 5, then 6, and each line records the values on the way down."
      - input: |
          7 N 8 9
        output: |
          7 8 9
        explanation: "There is exactly one leaf, 9, reached through 7 and 8."
    hints:
      - "Carry the current path down the recursion and append the node's value on the way in."
      - "When you reach a node with no children, copy the path into the answer — copy it, do not store the list you keep mutating."
      - "Remove the node's value again before returning, so the path is correct for the sibling branch (that is the backtracking step)."
    explanation: |
      **Collect paths by returning lists — O(n·h) time, O(n·h) space.** A leaf
      returns `[[value]]`; an internal node takes every path returned by its
      children and prefixes its own value. Easy to write, but every prefix copies
      whole lists, so the constant factor is poor.

      **DFS with backtracking — O(n·h) time, O(h) extra space.** Keep one list
      `path`. On entering a node, append its value. If it is a leaf, append a copy
      of `path` to the answer. Otherwise recurse into the children that exist.
      Before returning, pop the value you appended. The pop is what keeps `path`
      correct when the recursion comes back up and walks into a sibling subtree —
      without it the second branch would inherit values from the first.

      Total time is bounded by the number of printed values, which is the sum of
      the depths of all leaves — `O(n·h)` in the worst case and `O(n)` for a single
      chain. Besides the output, only the current path is stored, so extra space is
      `O(h)`.

      **Iterative variant — O(n·h) time, O(n·h) space.** Push `(node, path_so_far)`
      pairs on a stack, pushing the right child before the left one so that leaves
      are still reached left to right. Simple, but each stack entry carries its own
      copy of the path.
