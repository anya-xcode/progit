      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def boundary_traversal(root: Optional[TreeNode]) -> List[int]:
            if root is None:
                return []

            def is_leaf(node: TreeNode) -> bool:
                return node.left is None and node.right is None

            result: List[int] = []
            if not is_leaf(root):
                result.append(root.val)

            node = root.left
            while node is not None and not is_leaf(node):
                result.append(node.val)
                node = node.left if node.left is not None else node.right

            leaves: List[int] = []
            stack: List[TreeNode] = [root]
            while stack:
                current = stack.pop()
                if is_leaf(current):
                    leaves.append(current.val)
                if current.right is not None:
                    stack.append(current.right)
                if current.left is not None:
                    stack.append(current.left)
            result.extend(leaves)

            right_side: List[int] = []
            node = root.right
            while node is not None and not is_leaf(node):
                right_side.append(node.val)
                node = node.right if node.right is not None else node.left
            result.extend(reversed(right_side))
            return result


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
