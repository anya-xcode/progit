      write `seen[column] = node.val`, then enqueue the children with `column - 1`
      and `column + 1`. Breadth-first order visits nodes in non-decreasing depth
      and, within a depth, from left to right, so the final value left in each
      column is exactly the deepest-then-rightmost node. Print the columns from the
      smallest to the largest.

