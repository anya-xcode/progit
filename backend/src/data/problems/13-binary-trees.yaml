    slug: children-sum-property-in-binary-tree
    title: "Check the Children Sum Property"
    difficulty: Medium
    topic: "Binary Trees"
    subtopic: "Hard Problems"
    tags: [tree, dfs, recursion]
    sourceUrl: ""
    statement: |
      A binary tree satisfies the **children sum property** when, for every node
      that has at least one child, the node's value equals the sum of its
      children's values. A missing child contributes `0`, and a leaf is always
      considered fine.

      Given the root of a binary tree, decide whether the whole tree satisfies the
      property. The empty tree satisfies it.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print `true` if every node with a child equals the sum of its children, otherwise `false`.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^4 <= node value <= 10^4"
      - "Values may be negative or zero"
    examples:
      - input: |
          10 4 6 N N 2 4
        output: |
          true
        explanation: "10 = 4 + 6, and 6 = 2 + 4. The nodes 4, 2 and 4 are leaves, so they are fine."
      - input: |
          10 4 6 N N 3 4
        output: |
          false
        explanation: "The root is still fine, but 6 is not equal to 3 + 4 = 7, so the tree fails."
    hints:
      - "Handle three cases per node: no children (always fine), one child, two children."
      - "A missing child counts as 0 — do not skip the check for a node with a single child."
      - "The whole tree is valid only if the node itself is valid and both subtrees are valid."
    explanation: |
      **Recursive check — O(n) time, O(h) space.** For a node: if it has no
      children, it is fine. Otherwise compute
      `total = (left.val if left else 0) + (right.val if right else 0)` and require
      `node.val == total`; then require the same of both subtrees. Every node is
      inspected once, and only the recursion stack is extra memory.

      **Iterative check — O(n) time, O(n) space.** Any traversal works, since the
      condition at a node depends only on the node and its two children. Push the
      root, pop nodes, test each one, and push its children. Use this if the tree
      can be 2000 nodes deep and you would rather not touch the recursion limit.

      **The two traps.** First, a node with exactly one child still has to obey the
      rule, with the missing side counted as `0` — `5` with a single child `5` is
      valid, `5` with a single child `4` is not. Second, do not assume positive
      values: with negatives, `0 = 7 + (-7)` is perfectly valid, so a shortcut such
      as "a parent must be at least as large as each child" is wrong.

      **Related problem.** A harder variant asks you to *convert* an arbitrary tree
      so that the property holds by only increasing values — that one needs a
      downward pass that pushes a parent's surplus into its children and an upward
      pass that raises a parent to match its children.
