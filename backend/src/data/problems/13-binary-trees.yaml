    tags: [tree, dfs, bfs]
    sourceUrl: "https://leetcode.com/problems/symmetric-tree/"
    statement: |
      A binary tree is **symmetric** if it looks the same as its mirror image — that
      is, the left subtree of the root is a reflection of the right subtree, both
      in shape and in values.

      Decide whether the given tree is symmetric. The empty tree is symmetric.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print `true` if the tree is symmetric, otherwise `false`.
    constraints:
      - "0 <= number of nodes <= 1000"
      - "-100 <= node value <= 100"
    examples:
      - input: |
          5 7 7 N 9 9
        output: |
          true
        explanation: "The left 7 has a right child 9 and the right 7 has a left child 9, which mirror each other."
      - input: |
          5 7 7 9 N 9
        output: |
          false
        explanation: "Both 9s are left children, so the halves are copies rather than reflections."
    hints:
      - "Compare two subtrees at a time: they mirror each other when their roots match and the outer pair and inner pair of children mirror each other."
      - "The outer pair is (a.left, b.right); the inner pair is (a.right, b.left)."
    explanation: |
      **Mirror copy — O(n) time, O(n) space.** Build the mirrored copy of the tree
      and check whether it is identical to the original.

      **Paired recursion — O(n) time, O(h) space.** `mirror(a, b)` is true when both
      are null; false if one is null or the values differ; otherwise
      `mirror(a.left, b.right) and mirror(a.right, b.left)`. The answer is
      `mirror(root.left, root.right)`.

      **Iterative — O(n) time, O(w) space.** Push node pairs onto a queue in the
      same outer/inner order and check them one pair at a time.
