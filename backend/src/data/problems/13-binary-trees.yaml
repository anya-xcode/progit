  - sheetId: prob-13-3-6-minimum-time-taken-to-bur
    slug: minimum-time-taken-to-burn-the-bt-from-a-given-node
    title: "Time to Burn the Whole Tree"
    difficulty: Hard
    topic: "Binary Trees"
    subtopic: "Hard Problems"
    tags: [tree, bfs, graph]
    sourceUrl: ""
    statement: |
      A fire starts at one node of a binary tree. Every minute the fire spreads
      from each burning node to all of its **adjacent** nodes — its left child, its
      right child and its parent — and a node that catches fire stays on fire.

      Given a binary tree with distinct values and the value of the node where the
      fire starts, print how many minutes pass until every node is burning. If the
      tree has a single node the answer is `0`.
    inputFormat: |
      - Line 1: level-order values of the tree (`N` for a missing child).
      - Line 2: the integer `start`, the value of the node where the fire begins.
    outputFormat: |
      Print a single integer: the number of minutes until the whole tree is burning.
    constraints:
      - "1 <= number of nodes <= 2000"
      - "1 <= node value <= 10^4, and all values are distinct"
      - "The start value occurs in the tree"
    examples:
      - input: |
          1 2 3 4 5 N 6 N N 7 8
          5
        output: |
          4
        explanation: "Minute 1 burns 2, 7 and 8; minute 2 burns 4 and 1; minute 3 burns 3; minute 4 burns 6. The last node catches fire after 4 minutes."
      - input: |
          1 2 3
          1
        output: |
          1
        explanation: "The fire starts at the root and reaches both children after one minute."
    hints:
      - "The answer is the largest distance from the start node to any other node."
      - "Fire also travels upwards, so you need each node's parent — record them in one traversal."
      - "Then a breadth-first search from the start node, counting completed levels, gives the answer directly."
    explanation: |
      **Reformulate first.** A node catches fire exactly `d` minutes after the
      start, where `d` is its distance from the start node in the tree seen as an
      **undirected** graph. The whole tree burns when the farthest node does, so the
      answer is `max distance from start`, also called the *eccentricity* of that
      node.

      **Parent map + BFS — O(n) time, O(n) space.** Traverse once to record
      `parent[node]` and to locate the start node. Then breadth-first search from
      the start, visiting `left`, `right` and `parent` and marking nodes as
      visited. Count how many times you finish a level after the first: that count
      is the answer. Both phases touch each node a constant number of times.

      **Explicit adjacency list — O(n) time, O(n) space.** Same idea, written more
      plainly: build `graph[value] = [neighbours]` from the tree, then BFS over it.
      Slightly more memory, but it is the version to reach for when several such
      queries follow, and it makes the "this is just a graph" step obvious.

      **Recursive one-pass version — O(n) time, O(h) space.** A single recursion can
      return each subtree's height *and* the distance from the current node down to
      the start node, updating a global maximum where the two meet — the same trick
      used by the diameter problem. It avoids the parent map but is far easier to
      get wrong; write the BFS version first.
    starterCode:
