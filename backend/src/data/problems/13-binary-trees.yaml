  - sheetId: prob-13-3-5-print-all-nodes-at-a-dist
    slug: print-all-nodes-at-a-distance-of-k-in-bt
    title: "Nodes at Distance K"
    difficulty: Hard
    topic: "Binary Trees"
    subtopic: "Hard Problems"
    tags: [tree, bfs, graph]
    sourceUrl: "https://leetcode.com/problems/all-nodes-distance-k-in-binary-tree/"
    statement: |
      The **distance** between two nodes of a binary tree is the number of edges on
      the unique path between them, where an edge may be walked in either
      direction — downwards from a parent to a child *or* upwards from a child to
      its parent.

      Given a binary tree with distinct values, the value of a `target` node and an
      integer `k`, report every node whose distance from the target is exactly `k`.
    inputFormat: |
      - Line 1: level-order values of the tree (`N` for a missing child).
      - Line 2: two integers `target` and `k`.
    outputFormat: |
      Print the qualifying values on one line, in increasing order, space-separated. Print an empty line if no node is at distance `k`.
    constraints:
      - "1 <= number of nodes <= 2000"
      - "0 <= node value <= 10^4, and all values are distinct"
      - "The target value occurs in the tree"
      - "0 <= k <= 2000"
    examples:
      - input: |
          3 5 1 6 2 0 8 N N 7 4
          5 2
        output: |
          1 4 7
        explanation: "From 5 the nodes two edges away are 7 and 4 (down through 2) and 1 (up to 3, then down to 1). Sorted, that is 1 4 7."
      - input: |
          3 5 1 6 2 0 8 N N 7 4
          3 0
        output: |
          3
        explanation: "Distance 0 means the target itself."
    hints:
      - "The links you need point both ways, but a TreeNode only points downwards."
      - "One traversal can record each node's parent in a dictionary; after that the tree behaves like an undirected graph."
      - "With the parent links in place, a breadth-first search from the target that never revisits a node gives every distance at once."
    explanation: |
      **Brute force — O(n²) time.** For every node, compute the distance to the
      target by finding their lowest common ancestor and adding the two depths
      below it. Correct, but it redoes the same search `n` times.

      **Parent map + BFS — O(n) time, O(n) space.** Two passes:

      1. Walk the tree once and store `parent[node]` for every node, and find the
         node whose value is `target` while you are there.
      2. Breadth-first search from the target over three neighbours per node —
         `left`, `right` and `parent` — keeping a `visited` set so the search never
         walks back where it came from. Stop after `k` levels; whatever sits in the
         queue is the answer. If the queue empties earlier, no node is that far away
         and the answer is empty.

      Every node is enqueued at most once, so both passes are linear, and the
      dictionary of parents plus the visited set are the `O(n)` memory.

      **Recursive distance-from-target variant — O(n) time, O(h) space.** A single
      recursion can return the distance from the current node down to the target
      (or -1). When a node learns that the target is `d` edges below it, it prints
      the nodes exactly `k - d` levels down its *other* subtree, and the node
      itself when `d == k`. It avoids the parent dictionary at the cost of much
      trickier bookkeeping.

      **Sorting the output** is only needed because several nodes can share a
      distance; it keeps the expected answer unique.
