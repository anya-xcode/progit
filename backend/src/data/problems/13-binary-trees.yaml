  - sheetId: prob-13-1-12-preorder-inorder-and-post
    slug: preorder-inorder-and-postorder-traversal-in-one-traversal
    title: "Traversal Log of a Single Walk"
    difficulty: Easy
    topic: "Binary Trees"
    subtopic: "Traversals"
    tags: [tree, dfs, stack, euler-tour]
    sourceUrl: ""
    statement: |
      A single depth-first walk passes every node **three times**: on the way in,
      again after the left subtree is finished, and once more after the right
      subtree is finished. Writing the node's value down at all three moments
      produces the *traversal log* of the walk.

      Formally, the log of a tree rooted at `node` is

      ```
      log(empty)  = (nothing)
      log(node)   = value, log(left subtree), value, log(right subtree), value
      ```

      Given the root of a binary tree with `n` nodes, print this log. It has
      exactly `3n` entries: taking the **first** occurrence of every node gives
      the preorder sequence, the **second** occurrences give inorder and the
      **third** give postorder — which is why one walk is enough to produce all
      three.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print the `3n` log entries on one line, space-separated. Print an empty line for the empty tree.
    constraints:
      - "0 <= number of nodes <= 1500"
      - "-10^4 <= node value <= 10^4"
      - "Node values are not necessarily distinct"
    examples:
      - input: |
          1 2 3
        output: |
          1 2 2 2 1 3 3 3 1
        explanation: "Entering 1 writes 1. The left subtree (leaf 2) writes 2 2 2. Back at 1 writes 1. The right subtree (leaf 3) writes 3 3 3. Leaving 1 writes 1."
      - input: |
          4 N 5
        output: |
          4 4 5 5 5 4
        explanation: "4 is written on entry; its empty left subtree contributes nothing, so 4 is written again immediately; the leaf 5 contributes 5 5 5; then 4 is written on the way out."
    hints:
      - "A leaf always contributes its value three times in a row."
      - "Recursively: append the value, recurse left, append it again, recurse right, append it a third time."
      - "Iteratively, push (node, state) with state 1, 2 or 3 and append the value every time you pop, re-pushing the node with the next state."
    explanation: |
      **Three separate traversals — O(n) time, O(h) space.** Compute preorder,
      inorder and postorder independently, then interleave them by matching nodes.
      Interleaving correctly is fiddly precisely because the three lists describe
      the same walk, which is the point of the problem.

      **One recursive walk — O(n) time, O(h) space.** Follow the definition
      literally: append the value, recurse into the left subtree, append the value,
      recurse into the right subtree, append the value. Every node contributes
      three entries and the recursion does nothing else, so the log is built in a
      single pass of `O(n)` work with `O(h)` stack frames.

      **One iterative walk — O(n) time, O(n) space.** Push `(root, 1)` on a stack.
      On popping `(node, state)`: append `node.val`; if `state < 3`, push
      `(node, state + 1)` and then push `(child, 1)` for the left child when
      `state == 1` or the right child when `state == 2`, skipping nulls. The three
      states are the three moments the recursion passes through the node, made
      explicit — and separating the appends by state is exactly how you would emit
      preorder, inorder and postorder from the same loop.
