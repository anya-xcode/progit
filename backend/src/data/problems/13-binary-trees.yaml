  - slug: binary-tree-zigzag-level-order-traversal
    title: "Zigzag Level Order Traversal"
    difficulty: Medium
    topic: "Binary Trees"
    subtopic: "Traversals"
    tags: [tree, bfs, deque]
    sourceUrl: "https://leetcode.com/problems/binary-tree-zigzag-level-order-traversal/"
    statement: |
      Traverse a binary tree level by level, but alternate the direction: level 0
      (the root) is read **left to right**, level 1 **right to left**, level 2 left
      to right again, and so on.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print one line per level, starting with the root's level, containing that level's values in the zigzag direction, space-separated. Print nothing for the empty tree.
    constraints:
      - "0 <= number of nodes <= 1000"
      - "-1000 <= node value <= 1000"
    examples:
      - input: |
          1 2 3 4 5 N 6
        output: |
          1
          3 2
          4 5 6
        explanation: "Level 1 is read right to left (3 2); level 2 is read left to right again."
      - input: |
          1 2 3 4 5 6 7 8 9
        output: |
          1
          3 2
          4 5 6 7
          9 8
        explanation: "The fourth level (8 and 9, children of 4) is read right to left."
    hints:
      - "Start from an ordinary level-order traversal."
      - "Collect each level left to right and reverse it on odd levels — or fill a deque from the appropriate end."
    explanation: |
      **Level order + reverse — O(n) time, O(w) space.** Run a normal BFS that
      groups nodes by level; reverse every level with an odd index before
      outputting it.

      **Deque per level — O(n) time, O(w) space.** Still enqueue children left to
      right, but while building a level append values to the back on even levels
      and to the front on odd levels, avoiding the separate reverse pass.

      **Two stacks — O(n) time, O(w) space.** Pop from one stack and push children
      into the other, switching the push order (left-then-right vs.
      right-then-left) on every level.
    starterCode:
      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
