          -4 -2 -7
        output: |
          -2
        explanation: "All values are negative, so the best path is the single node -2."
    hints:
      - "Every path has one highest node where it may bend, taking a downward branch into each side."
      - "For each node, compute the best sum of a path that starts at the node and goes straight down. Negative branches should be dropped (treated as 0)."
      - "The answer candidate at a node is node.val + max(0, bestLeft) + max(0, bestRight); but only one side may be returned to the parent."
    explanation: |
      **Brute force — O(n²·h) time.** Enumerate every pair of nodes, walk the path
      between them via parent pointers and sum it.

      **Better — O(n²) time.** For every node treat it as the bend point and
      compute the best downward chains on both sides with separate DFS calls.

      **Optimal post-order DP — O(n) time, O(h) space.** Let `gain(node)` be the
      maximum sum of a downward path starting at `node`:
      `gain(node) = node.val + max(0, gain(left), gain(right))`. While computing it,
      update the global answer with `node.val + max(0, gain(left)) + max(0,
      gain(right))`, the best path that bends at this node. Initialise the answer
      to negative infinity so all-negative trees work.
