  - slug: binary-tree-preorder-traversal
    title: "Preorder Traversal"
    difficulty: Easy
    topic: "Binary Trees"
    subtopic: "Traversals"
    tags: [tree, dfs, stack]
    sourceUrl: "https://leetcode.com/problems/binary-tree-preorder-traversal/"
    statement: |
      Given the root of a binary tree, list the node values in **preorder**: the
      node itself first, then its left subtree (preorder), then its right subtree
      (preorder).
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print the preorder sequence on one line, space-separated. Print an empty line for the empty tree.
    constraints:
      - "0 <= number of nodes <= 1000"
      - "-1000 <= node value <= 1000"
      - "Tree height <= 1000"
    examples:
      - input: |
          10 20 30 N 40 50
        output: |
          10 20 40 30 50
        explanation: "10 is visited first, then its left subtree (20 with right child 40), then its right subtree (30 with left child 50)."
      - input: |
          -3 N -8 N -1
        output: |
          -3 -8 -1
        explanation: "Every node only has a right child, so preorder simply walks down the chain."
    hints:
      - "Record the node before descending into either child."
      - "With an explicit stack, pop a node, record it, then push its right child before its left child so the left one is processed first."
    explanation: |
      **Recursion — O(n) time, O(h) space.** Record the node, recurse left,
      recurse right.

      **Iterative stack — O(n) time, O(h) space.** Push the root. Repeatedly pop a
      node, record it, and push its right child followed by its left child. Since
      a stack is LIFO, the left subtree is fully handled before the right one.

      **Morris preorder — O(n) time, O(1) space.** Same threading idea as Morris
      inorder, but the node is recorded the first time it is reached (when the
      thread is created) instead of when the thread is removed.
