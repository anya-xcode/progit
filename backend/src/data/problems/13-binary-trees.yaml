    statement: |
      A binary tree is **height-balanced** if, for **every** node, the heights of
      its left and right subtrees differ by at most 1. (The height of an empty
      subtree is 0.)

      Decide whether the given tree is height-balanced. The empty tree is balanced.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print `true` if the tree is height-balanced, otherwise `false`.
    constraints:
      - "0 <= number of nodes <= 1000"
      - "-1000 <= node value <= 1000"
    examples:
      - input: |
          1 2 3 4 5 N 6
        output: |
          true
        explanation: "Node 2 and node 3 both have height 2, and every other node's subtrees differ by at most 1."
      - input: |
          1 2 N 3
        output: |
          false
        explanation: "The root's left subtree has height 2 while its right subtree is empty (height 0)."
    hints:
      - "Checking only the root is not enough — the condition must hold at every node."
      - "Computing the height separately for every node repeats work. Can one post-order pass return the height and the verdict together?"
      - "Return a sentinel such as -1 from the height function as soon as an imbalance is found."
    explanation: |
      **Brute force — O(n²) time worst case, O(h) space.** For every node, compute
      the heights of both subtrees with a separate traversal and compare them,
      then recurse into the children.

      **Single post-order pass — O(n) time, O(h) space.** Write `check(node)` that
      returns the height of the subtree, or `-1` if the subtree is unbalanced.
      Compute the children first; if either is `-1` or their heights differ by more
      than 1, return `-1`; otherwise return `1 + max(left, right)`. The tree is
      balanced exactly when `check(root) != -1`.
