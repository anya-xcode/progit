    sourceUrl: "https://leetcode.com/problems/binary-tree-preorder-traversal/"
    statement: |
      Given the root of a binary tree, print its **preorder** traversal — the node
      first, then its left subtree, then its right subtree — **without using
      recursion**. Manage the pending work yourself with an explicit stack.

      The tree may be a single chain 2000 nodes long, which is exactly the
      situation where a recursive walk risks exhausting the call stack, so the
      iterative version is the one worth owning.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print the preorder sequence on one line, space-separated. Print an empty line for the empty tree.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^4 <= node value <= 10^4"
      - "The tree may be completely skewed, so the height can reach 2000"
    examples:
      - input: |
          1 2 3 4 5 N 6
        output: |
          1 2 4 5 3 6
        explanation: "Push 1; pop and record it, push 3 then 2; pop 2 and record it, push 5 then 4; and so on — the left side is always finished before the right."
      - input: |
          -3 N -8 N -1
        output: |
          -3 -8 -1
        explanation: "Every node has only a right child, so the stack never holds more than one node and the walk runs straight down the chain."
    hints:
      - "A stack is LIFO — so to handle the left child first, push it last."
      - "Record a node the moment you pop it, before touching its children."
      - "Never push a null child; then the loop condition is simply 'the stack is not empty'."
    explanation: |
      **Recursion — O(n) time, O(h) space.** Record the node, recurse left, recurse
      right. Simple, but the hidden call stack is `O(h)` deep and a 2000-node chain
      can exceed the interpreter's default limit.

      **Explicit stack — O(n) time, O(h) space.** Push the root (if it exists).
      While the stack is not empty: pop a node, record its value, push its **right**
      child and then its **left** child, skipping nulls. Because a stack returns the
      most recent item first, the left child is processed next and the entire left
      subtree is finished before the right one is reached — precisely the preorder
      rule. The stack holds at most one node per level on the current root-to-node
      path plus their siblings, i.e. `O(h)`.

      **Morris preorder — O(n) time, O(1) space.** Thread each node's inorder
      predecessor back to it, record the node when the thread is created, and
      remove the thread on the second encounter. It needs no stack at all, at the
      cost of temporarily mutating pointers; it is covered on its own later in this
      step.
