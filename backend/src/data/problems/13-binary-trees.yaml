  - sheetId: prob-13-3-14-flatten-binary-tree-to-li
    slug: flatten-binary-tree-to-linked-list
    title: "Flatten a Binary Tree to a Linked List"
    difficulty: Medium
    topic: "Binary Trees"
    subtopic: "Hard Problems"
    tags: [tree, linked-list, morris, in-place]
    sourceUrl: "https://leetcode.com/problems/flatten-binary-tree-to-linked-list/"
    statement: |
      Rearrange a binary tree **in place** into a linked list that uses the same
      `TreeNode` objects:

      - the nodes appear along the `right` pointers in **preorder** (node, left
        subtree, right subtree);
      - every node's `left` pointer ends up `None`;
      - no new nodes are created — only the existing pointers are rewired.

      Change the tree through the root you are given; the function returns nothing.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print two lines. Line 1: the values found by following the `right` pointers from the root, space-separated (an empty line for the empty tree). Line 2: `true` if every node on that chain has an empty `left` pointer, otherwise `false`.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^4 <= node value <= 10^4"
      - "The nodes must be reused; the chain must contain every node exactly once"
    examples:
      - input: |
          1 2 5 3 4 N 6
        output: |
          1 2 3 4 5 6
          true
        explanation: "The preorder of the tree is 1 2 3 4 5 6, so the chain is 1 -> 2 -> 3 -> 4 -> 5 -> 6 and every left pointer has been cleared."
      - input: |
          1 N 2 N 3
        output: |
          1 2 3
          true
        explanation: "The tree is already a right-going chain, so the preorder is unchanged and nothing needs to be rewired."
    hints:
      - "The last node of the flattened left subtree must be spliced in front of the original right subtree."
      - "Visiting the tree in reverse preorder (right, left, node) lets you build the chain from the end backwards with a single 'previous' pointer."
      - "There is also an O(1)-space way: for each node with a left child, find the rightmost node of that left subtree and hang the right subtree there."
    explanation: |
      **Preorder list, then rebuild — O(n) time, O(n) space.** Collect the preorder
      values (or nodes), then walk the list setting `left = None` and
      `right = next node`. Straightforward and a fine first solution, but it stores
      the whole traversal.

      **Reverse preorder with one pointer — O(n) time, O(h) space.** Traverse in the
      order *right subtree, left subtree, node* — the exact reverse of preorder.
      Keep a variable `previous`, initially `None`. At each node set
      `node.right = previous`, `node.left = None`, then `previous = node`. Because
      the nodes arrive in reverse order, the chain is built from its tail forwards
      and each node's successor is already finished. Recursion depth is the only
      extra memory.

      **Morris-style threading — O(n) time, O(1) extra space.** Start at the root
      and repeat while the current node is not null:

      1. if it has a left child, find the **rightmost** node of that left subtree;
      2. attach the current node's right subtree to that rightmost node;
      3. move the left subtree over to the right and set `left = None`;
      4. move on to `current.right`.

      Step 2 is the heart of it: the rightmost node of the left subtree is exactly
      the node that comes last in the left subtree's preorder, so the original right
      subtree belongs immediately after it. Every edge is traversed a constant
      number of times, so this is linear with no extra memory at all.

      **Check yourself on the two easy mistakes:** overwriting `node.right` before
      you have saved the old right subtree, and forgetting to clear `left`, which
      leaves a tree that merely *looks* like a list when printed along `right`.
