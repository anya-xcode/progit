    sourceUrl: "https://leetcode.com/problems/lowest-common-ancestor-of-a-binary-tree/"
    statement: |
      In a binary tree with **unique** node values, the **lowest common ancestor**
      (LCA) of two nodes `p` and `q` is the deepest node that has both `p` and `q`
      in its subtree. A node counts as part of its own subtree, so a node can be
      the LCA of itself and one of its descendants.

      Given the tree and the values of `p` and `q`, print the value of their LCA.
    inputFormat: |
      - Line 1: level-order values of the tree (`N` for a missing child).
      - Line 2: two integers `p` and `q`, values of nodes in the tree (they may be equal).
    outputFormat: |
      Print the value of the lowest common ancestor.
    constraints:
      - "1 <= number of nodes <= 1000"
      - "All node values are distinct, 1 <= value <= 10^4"
      - "Both p and q exist in the tree"
