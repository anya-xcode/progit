    tags: [tree, dfs, stack, iterative]
    sourceUrl: "https://leetcode.com/problems/binary-tree-postorder-traversal/"
    statement: |
      Given the root of a binary tree, print its **postorder** traversal — the
      left subtree, then the right subtree, then the node — **without recursion**,
      using the two-stack technique.

      The idea behind two stacks: postorder is `left, right, node`. Reverse it and
      you get `node, right, left`, which is just a preorder walk that visits the
      right child before the left one. So run that easy walk on the first stack,
      collect its output on the second stack, and read the second stack back.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print the postorder sequence on one line, space-separated. Print an empty line for the empty tree.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^4 <= node value <= 10^4"
      - "The tree may be completely skewed, so the height can reach 2000"
    examples:
      - input: |
          1 2 3 4 5 N 6
        output: |
          4 5 2 6 3 1
        explanation: "Both children of 2 come before 2, the right subtree 3 6 is finished before the root, and 1 is printed last."
      - input: |
          8 N 9 N 10
        output: |
          10 9 8
        explanation: "The chain 8 -> 9 -> 10 goes down through right children, so postorder unwinds it from the deepest node back to the root."
    hints:
      - "Reversed postorder is 'node, right subtree, left subtree' — a mirrored preorder."
      - "On the first stack push the left child before the right one, so the right side is popped first."
      - "The second stack (or a list you reverse at the end) turns that order back into postorder."
    explanation: |
      **Recursion — O(n) time, O(h) space.** Recurse left, recurse right, record the
      node. The clean version, but it depends on the call stack.

      **Two stacks — O(n) time, O(n) space.** Push the root onto stack A. While A
      is not empty: pop a node, push it onto stack B, then push its **left** child
      and then its **right** child onto A (skipping nulls). Stack A therefore
      produces `node, right, left` order, and stack B receives it. Popping B
      completely reverses that sequence into `left, right, node` — postorder. Stack
      B holds all `n` nodes, hence the `O(n)` space; in Python the second stack is
      usually just a list that you reverse at the end.

      **One stack — O(n) time, O(h) space.** Possible too, by remembering the last
      node you emitted and only recording a node once both of its children are
      done. It uses less memory but more care; it is the next problem in this step.
