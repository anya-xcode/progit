  - sheetId: prob-13-3-12-morris-preorder-traversal
    slug: morris-preorder-traversal-of-a-binary-tree
    title: "Morris Preorder Traversal"
    difficulty: Hard
    topic: "Binary Trees"
    subtopic: "Hard Problems"
    tags: [tree, morris, threading]
    sourceUrl: ""
    statement: |
      Print the **preorder** traversal of a binary tree using **O(1) extra
      memory** — no recursion and no stack.

      The technique is *threading*. Before walking into a left subtree, find the
      node that would be visited last in it (its rightmost node) and temporarily
      point that node's empty right pointer back at the current node. When the walk
      later falls off the bottom of the left subtree, the thread carries it back up
      instead of a stack frame. On the way back the thread is removed, so the tree
      is left exactly as it was found.

      Your function must not build a list of ancestors, a stack or a parent map;
      the output list itself is of course allowed.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print the preorder sequence on one line, space-separated. Print an empty line for the empty tree.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^4 <= node value <= 10^4"
      - "Extra memory besides the output must be O(1)"
    examples:
      - input: |
          1 2 3 4 5 N 6
        output: |
          1 2 4 5 3 6
        explanation: "1 is recorded when its thread to 5 is created, then 2 when its thread to 4 is created, then 4, and the threads bring the walk back to 5, 3 and 6."
      - input: |
          7 N 8 9
        output: |
          7 8 9
        explanation: "7 has no left child, so it is recorded and the walk simply steps right to 8; 8's left subtree is the single node 9, which is recorded after 8."
    hints:
      - "Two cases only: the current node has no left child, or it has one."
      - "With no left child, record the node and move right."
      - "With a left child, walk right from it until you reach a node whose right pointer is empty or already points back at the current node — the first case means 'going down', the second means 'coming back'."
    explanation: |
      **Recursion — O(n) time, O(h) space.** Record the node, then the left subtree,
      then the right subtree. The memory is the call stack, which is what Morris
      removes.

      **Morris preorder — O(n) time, O(1) extra space.** Start with `current` at the
      root and loop while it is not null:

      - *No left child.* Record `current.val` and move `current = current.right`.
      - *Left child exists.* Find the **inorder predecessor**: start at
        `current.left` and go right while the right pointer is non-null and is not
        `current` itself.
        - If that predecessor's right pointer is `None`, you are entering the left
          subtree for the first time: set `predecessor.right = current`, **record
          `current.val` now** (this is the only difference from Morris inorder),
          and move `current = current.left`.
        - Otherwise the pointer already points back at `current`, so the left
          subtree is finished: restore `predecessor.right = None` and move
          `current = current.right`.

      **Why it is still linear.** Each edge of the tree is walked at most a constant
      number of times: once while searching for a predecessor on the way down and
      once on the way back, so the total work is `O(n)` even though the predecessor
      search looks like a nested loop.

      **Morris inorder is the same code** with the "record" line moved into the
      branch that removes the thread — record when you come *back* to a node rather
      than when you first reach it.

      **The trade-off.** No extra memory, but the tree is temporarily mutated, which
      makes the method unusable if other code might read the tree concurrently, and
      it is slower in practice than a plain stack because of the predecessor
      searches.
    starterCode:
      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def morris_preorder(root: Optional[TreeNode]) -> List[int]:
            # Return the preorder sequence using threading, with O(1) extra memory.
            pass


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
