    explanation: |
      **Root-to-node paths — O(n) time, O(n) space.** Find the path from the root to
      `p` and the path to `q` (e.g. by DFS with backtracking). Walk both paths from
      the start; the last node they share is the LCA.

      **Parent map — O(n) time, O(n) space.** Record each node's parent with a
      traversal, put all ancestors of `p` into a set, then climb from `q` until you
      hit a node in the set.

      **Single recursive search — O(n) time, O(h) space.** `find(node)` returns
      null for an empty subtree and returns `node` if it equals `p` or `q`.
      Otherwise it searches both children: if both return a non-null node, `p` and
      `q` are split across the sides and `node` is the LCA; if only one side is
      non-null, pass that result upward.
