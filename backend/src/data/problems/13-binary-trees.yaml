  - sheetId: prob-13-1-1-introduction-to-trees
    type: reference
    slug: introduction-to-trees
    title: "Introduction to Trees"
    difficulty: Easy
    topic: "Binary Trees"
    subtopic: "Traversals"
    tags: [tree, theory]
    sourceUrl: ""
    statement: |
      Arrays and linked lists are **linear**: every element has at most one thing
      before it and one thing after it. A **tree** drops that restriction. Each
      element (a *node*) can point at several successors, so the data branches out
      instead of running in a line. Nothing to submit here — read it, then start
      the traversal problems.

      **The vocabulary.**

      - **Node** — one cell of the tree: a value plus links to its children.
      - **Root** — the single node with no parent; every tree is named by it. An
        empty tree has no root at all, which is why almost every tree function
        starts with "if the node is null, ...".
      - **Child / parent** — a node directly below / directly above another.
      - **Leaf** — a node with no children.
      - **Edge** — one parent-child link. A tree with `n` nodes has exactly
        `n - 1` edges and contains no cycles.
      - **Depth of a node** — the number of edges from the root down to it, so the
        root sits at depth 0.
      - **Height of a node** — the number of edges on the longest path down to a
        leaf. The height of the tree is the height of the root. A single node has
        height 0; the empty tree is usually given height -1.
      - **Subtree** — any node together with everything below it. This is the
        important one: a subtree *is itself a tree*, which is why recursion fits
        trees so naturally.

      **Kinds of tree you will meet in this step.**

      | Name | Rule |
      | --- | --- |
      | Binary tree | every node has at most two children, called left and right |
      | Full (strict) binary tree | every node has either 0 or 2 children |
      | Complete binary tree | every level is full except possibly the last, which is filled left to right |
      | Perfect binary tree | every level, including the last, is completely full |
      | Balanced binary tree | the height stays O(log n) — e.g. the two subtree heights of every node differ by at most 1 |
      | Degenerate (skewed) tree | every node has one child, so the tree behaves like a linked list |

      **Why the shape matters.** A perfect tree with height `h` holds
      `2^(h+1) - 1` nodes, so `n` nodes fit in height about `log2(n)`. That is the
      whole promise of trees: reach any node in `O(log n)` steps instead of `O(n)`.
      A skewed tree destroys that promise — height `n - 1`, every operation linear,
      and deep recursion that can blow the call stack. Half of the later steps
      (balanced trees, BSTs, heaps) exist to keep trees from degenerating.

      **The mental model to keep.** A binary tree is defined recursively: it is
      either empty, or a node with a left binary tree and a right binary tree.
      Almost every problem in this step is solved by writing a function that
      answers the question for a node assuming it already works on the two
      subtrees.
    explanation: |
      **How DSAForge feeds you a tree.** Every tree problem in this step reads
      **one line of level-order values**, with `N` marking a missing child, and the
      empty tree written as a single `N`. The line is read top to bottom, left to
      right, and only *existing* nodes contribute a pair of child slots.

      So `1 2 3 N 4` means:

      ```
            1
           / \
          2   3
           \
            4
      ```

      Read it as: root `1`; children of `1` are `2` and `3`; children of `2` are
      `N` (none) and `4`. Node `3` has no tokens left, so it is a leaf. The driver
      in each problem already contains a `build_tree` helper that does this — you
      only write the function above the `# --- Input/output handling ---` line.

      **Traversals, in one place.** Four orders account for nearly everything:

      - **Preorder** — node, left subtree, right subtree. Good for copying a tree
        or writing it out (the first value is always the root).
      - **Inorder** — left subtree, node, right subtree. On a binary *search* tree
        this prints the values in sorted order.
      - **Postorder** — left subtree, right subtree, node. Good when a node's
        answer needs both children's answers first (heights, deletion, sums).
      - **Level order** — all of depth 0, then all of depth 1, ... using a queue.

      **The two costs to quote.** Every traversal touches each node once, so time
      is `O(n)`. Space is the part people forget: a recursive walk costs `O(h)`
      stack frames (`h` = height), which is `O(log n)` for a balanced tree but
      `O(n)` for a skewed one; a level-order walk costs `O(w)` for the widest
      level, which can be about `n / 2`.

  - sheetId: prob-13-1-2-binary-tree-representatio
    type: reference
    slug: binary-tree-representation-in-java
    title: "Binary Tree Representation"
    difficulty: Easy
    topic: "Binary Trees"
    subtopic: "Traversals"
    tags: [tree, theory]
    sourceUrl: ""
    statement: |
      Before you can traverse a tree you have to *store* one. This entry is about
      the two ways that is done — linked nodes and a flat array — and about the
      text format DSAForge uses to hand you a tree on standard input. Nothing to
      submit.

      **1. Linked representation (what every problem here uses).** One object per
      node, holding a value and two references:

      ```python
      class TreeNode:
          def __init__(self, val=0, left=None, right=None):
              self.val = val
              self.left = left
              self.right = right
      ```

      The same idea in a class-based language such as Java or C++ is a class with
      an `int` field and two pointers/references to the same class, plus a
      constructor that sets the value and leaves both children null. A missing
      child is `None` / `null` / `nullptr` — never a special sentinel value, so
      the base case of every recursive function is "the node is null".

      The whole tree is then represented by a **single reference to its root**.
      Passing a child reference to a function passes a complete, smaller tree;
      that is what makes recursion the default tool here.

      Cost: `O(n)` memory, with two extra references per node, and no
      constant-time way to jump to "the parent" or "the k-th node" unless you
      store that yourself.

      **2. Array representation.** Put the root at index `1` and store the
      children of index `i` at `2i` and `2i + 1` (its parent is `i // 2`). With
      0-based indexing the formulas become `2i + 1`, `2i + 2` and `(i - 1) // 2`.

      No pointers, perfect cache behaviour, and moving between parent and child is
      arithmetic — but a node at depth `d` needs an index up to `2^(d+1)`, so a
      skewed tree of 40 nodes would need an array of about a trillion slots. That
      is why this layout is reserved for trees that are **complete** by
      construction, above all the **binary heap** in the priority-queue step.

      **3. The DSAForge input format.** Problems give the tree as one line of
      **level-order** values with `N` for a missing child (the empty tree is a
      single `N`). Unlike the array layout it does not reserve slots for the
      descendants of a missing child, so it stays compact for skewed trees.
    explanation: |
      **Reading the level-order line.** Keep a queue of nodes whose children have
      not been filled in yet. The first token becomes the root and enters the
      queue. Then repeatedly pop a node and consume the next two tokens as its
      left and right child: a real value becomes a node and joins the queue, an
      `N` leaves that slot empty. Stop when the tokens run out — any node still in
      the queue simply has no children. That is exactly the `build_tree` helper
      sitting under the `# --- Input/output handling ---` line in every tree
      problem, and it runs in `O(n)`.

      **Writing a tree back out.** The inverse is just as short: BFS from the
      root, and for every node you pop, emit its left child and then its right
      child, writing `N` for an empty slot. Trimming the `N`s that trail at the
      end keeps the line short. Two trees are identical in both shape and values
      exactly when these strings match, which is how several later problems check
      a constructed tree.

      **Three habits worth forming now.**

      1. *Never dereference before the null check.* Write
         `if node is None: return ...` as the first line of every recursive tree
         function; the rest of the body may then assume `node` exists.
      2. *A child reference is a whole tree.* If your function is correct for
         `node.left` and `node.right`, combining those two answers is usually the
         entire body.
      3. *Null is a shape, not a value.* `0` is a perfectly good node value; it is
         not an empty slot. Problems that allow negative or zero values break any
         solution that uses a sentinel number instead of `None`.

  - sheetId: prob-13-1-3-pre-post-inorder-in-one-t
    slug: pre-post-inorder-in-one-traversal
    title: "Pre, Post and Inorder in One Traversal"
    difficulty: Easy
    topic: "Binary Trees"
    subtopic: "Traversals"
    tags: [tree, dfs, stack]
    sourceUrl: ""
    statement: |
      The three depth-first orders differ only in **when** a node is recorded
      relative to its two subtrees:

      - **preorder** — node, left subtree, right subtree;
      - **inorder** — left subtree, node, right subtree;
      - **postorder** — left subtree, right subtree, node.

      Given the root of a binary tree, produce all three sequences. A depth-first
      walk already passes each node three times — once on the way in, once
      between the two subtrees and once on the way out — so **one** walk is enough
      to fill all three lists.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print three lines: the preorder sequence, the inorder sequence and the postorder sequence, each space-separated on its own line. Print an empty line for a sequence of an empty tree.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^4 <= node value <= 10^4"
      - "Node values are not necessarily distinct"
    examples:
      - input: |
          1 2 3 4 5 N 6
        output: |
          1 2 4 5 3 6
          4 2 5 1 3 6
          4 5 2 6 3 1
        explanation: "Root 1 has left child 2 (children 4 and 5) and right child 3 (right child 6). Preorder writes a node before its subtrees, inorder between them, postorder after both."
      - input: |
          10 20 N 30 40
        output: |
          10 20 30 40
          30 20 40 10
          30 40 20 10
        explanation: "10 has only a left child 20, whose children are 30 and 40. Preorder is 10 20 30 40, inorder puts 20 between its children, postorder writes both children before 20 and 20 before 10."
    hints:
      - "Write the three recursive traversals separately first and notice that only the position of the 'record the node' line changes."
      - "Carry three lists into one recursive walk: append before the left call, between the calls, and after the right call."
      - "To do it iteratively, push pairs (node, state) with state 1, 2 or 3 and act on the state when you pop."
    explanation: |
      **Three separate walks — O(n) time, O(h) space.** Run the preorder, inorder
      and postorder recursions one after another. Correct, but it touches every
      node three times and repeats the same code with one line moved.

      **One recursive walk — O(n) time, O(h) space.** Pass all three lists down a
      single recursion: append the value to the preorder list, recurse left,
      append to the inorder list, recurse right, append to the postorder list.
      Every node is handled exactly once, and the three "record" points are
      literally the three moments a depth-first walk visits a node.

      **One iterative walk — O(n) time, O(n) space.** Push `(node, 1)` on a stack.
      When you pop `(node, state)`:

      - state 1 — record in preorder, push `(node, 2)`, then push `(node.left, 1)`;
      - state 2 — record in inorder, push `(node, 3)`, then push `(node.right, 1)`;
      - state 3 — record in postorder and drop the node.

      Skip null children. This is the recursion written out by hand, so it avoids
      recursion limits on a tree that is 2000 nodes deep, at the cost of storing
      the state number alongside each node.
