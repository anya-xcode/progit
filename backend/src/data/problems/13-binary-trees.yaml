    title: "Vertical Order Traversal"
    difficulty: Medium
    topic: "Binary Trees"
    subtopic: "Hard Problems"
    tags: [tree, bfs, sorting, hashing]
    sourceUrl: "https://leetcode.com/problems/vertical-order-traversal-of-a-binary-tree/"
    statement: |
      Place a binary tree on a grid. The root is at **row 0, column 0**. For a node
      at `(row, col)`, its left child is at `(row + 1, col - 1)` and its right child
      is at `(row + 1, col + 1)`.

      Report the tree column by column, from the **leftmost** column to the
      **rightmost** one. Inside one column, list the nodes by **row** (top first);
      nodes that share both the row and the column are listed by **value** in
      increasing order.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print one line per non-empty column, from left to right, with that column's values space-separated in the order described. Print nothing for the empty tree.
    constraints:
      - "0 <= number of nodes <= 1000"
      - "-1000 <= node value <= 1000"
    examples:
      - input: |
          8 3 10 1 6 4 12
        output: |
          1
          3
          8 4 6
          10
          12
        explanation: "Column 0 holds 8 (row 0) and both 6 and 4 (row 2). The tie on row 2 is broken by value, giving 8 4 6."
      - input: |
          5 2 7 N 4 N N 3
        output: |
          2 3
          5 4
          7
        explanation: "Node 4 is the right child of 2, so it sits in column 0 under the root; 3 is 4's left child and lands in column -1 below 2."
    hints:
      - "First compute (column, row) for every node with any traversal."
      - "Sorting all triples (column, row, value) gives exactly the required order."
      - "Group the sorted triples by column when printing."
    explanation: |
      **Coordinates + global sort — O(n log n) time, O(n) space.** Traverse the tree
      (DFS or BFS) and collect a triple `(col, row, value)` for every node. Sort the
      triples; the order of the tuple fields matches the rules (column, then row,
      then value). Walk the sorted list and start a new output line whenever the
      column changes.

      **Map of columns — O(n log n) time, O(n) space.** Keep a dictionary from
      column to a list of `(row, value)` pairs while traversing. Track the minimum
      and maximum column, then for each column in range sort its pairs and output
      the values. Sorting per column is cheaper in practice but has the same
      worst-case bound.

      A frequent bug is to sort a column only by row (as BFS naturally does) and
      forget the value tie-break for nodes in the same row and column.
