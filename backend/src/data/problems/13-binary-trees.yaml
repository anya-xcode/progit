  - sheetId: prob-13-2-7-boundary-traversal
    slug: boundary-traversal
    title: "Boundary Traversal"
    difficulty: Medium
    topic: "Binary Trees"
    subtopic: "Medium Problems"
    tags: [tree, dfs, bfs]
    sourceUrl: "https://leetcode.com/problems/boundary-of-binary-tree/"
    statement: |
      Imagine drawing the outline of a binary tree and walking around it
      **anti-clockwise**, starting at the root. The result is the *boundary
      traversal*, defined as three parts joined together:

      1. the **root**;
      2. the **left boundary**, from the root downwards, *excluding leaves*: start
         at the root's left child and repeatedly move to the left child if it
         exists, otherwise to the right child, stopping when you reach a leaf;
      3. every **leaf**, from left to right (the order in which a depth-first walk
         that prefers the left child meets them);
      4. the **right boundary**, *excluding leaves*, in **reverse**: start at the
         root's right child and repeatedly move to the right child if it exists,
         otherwise to the left child, stopping at a leaf; then output that list
         backwards.

      No node is printed twice. If the root itself is a leaf (a one-node tree),
      the answer is just the root.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print the boundary values on one line, space-separated, in the anti-clockwise order described above. Print an empty line for the empty tree.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^4 <= node value <= 10^4"
      - "A leaf is a node with no left child and no right child"
    examples:
      - input: |
          1 2 3 4 5 N 6 N N 7 8 N 9
        output: |
          1 2 4 7 8 9 6 3
        explanation: "The root 1 comes first. Walking down the left side gives 2, then 4 — but 4 is a leaf, so only 2 is kept. The leaves from left to right are 4, 7, 8, 9. Walking down the right side gives 3, then 6, then the leaf 9 which stops the walk; reversing 3, 6 gives 6, 3 at the end."
      - input: |
          10 20 30 N N 40 50
        output: |
          10 20 40 50 30
        explanation: "Root 10; its left child 20 is a leaf, so the left boundary is empty; the leaves left to right are 20, 40, 50; the right boundary below the root is just 30, which is not a leaf, so it is printed last."
    hints:
      - "Solve it as three independent walks and concatenate them — do not try to do it in one pass."
      - "A node on the left boundary is only added if it is not a leaf; the same for the right boundary."
      - "Collect the leaves with an ordinary depth-first walk that visits the left child first, and remember that the root counts as a leaf only when the tree has one node."
    explanation: |
      **Three walks — O(n) time, O(n) space.** The definition is the algorithm:

      1. If the root is not a leaf, output it.
      2. *Left boundary*: start at `root.left`; while the current node is not a
         leaf, output it and move to its left child if it has one, otherwise to its
         right child. The walk length is at most the height.
      3. *Leaves*: run a depth-first walk that recurses left before right and
         outputs a node when it has no children. This visits them in left-to-right
         order.
      4. *Right boundary*: the mirror of step 2 starting at `root.right`, collected
         into a list and appended reversed.

      Steps 2 and 4 cost `O(h)` each, step 3 costs `O(n)`, so the total is `O(n)`
      time with `O(h)` recursion depth plus the output list.

      **Why leaves are excluded from the two boundaries.** Every leaf is already
      produced by step 3, and the deepest node of a boundary walk is a leaf. Adding
      it in both places would duplicate it — the classic bug in this problem,
      together with forgetting that a single-node tree must print the root exactly
      once.

      **A common alternative.** You can also collect the boundary by recursion:
      `add_left_boundary`, `add_leaves`, `add_right_boundary` as three helpers
      appending into one list. Same complexity; slightly easier to read than the
      iterative version.
