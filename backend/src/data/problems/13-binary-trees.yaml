    slug: morris-inorder-traversal-of-a-binary-tree
    title: "Morris Inorder Traversal"
    difficulty: Hard
    topic: "Binary Trees"
    subtopic: "Hard Problems"
    tags: [tree, morris, threading]
    sourceUrl: "https://leetcode.com/problems/binary-tree-inorder-traversal/"
    statement: |
      Print the **inorder** traversal of a binary tree using **O(1) extra
      memory** — no recursion and no stack.

      An inorder walk has to postpone a node while its left subtree is processed,
      and a stack is the usual place to keep it. Morris traversal removes the stack
      by *threading*: the rightmost node of a left subtree — the node visited
      immediately **before** the current one in inorder — gets its empty right
      pointer temporarily aimed back at the current node. Falling off the bottom of
      the left subtree then leads straight back to the postponed node, which is
      recorded and the thread removed, leaving the tree unchanged.

      Your function must not use a stack, recursion, or a parent map; the output
      list itself is of course allowed.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print the inorder sequence on one line, space-separated. Print an empty line for the empty tree.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^4 <= node value <= 10^4"
      - "Extra memory besides the output must be O(1)"
    examples:
      - input: |
          1 2 3 4 5 N 6
        output: |
          4 2 5 1 3 6
        explanation: "Node 2's left subtree is the single node 4, so 4 is threaded back to 2 and recorded first, then 2. Node 1's left subtree ends at its rightmost node 5, whose thread returns the walk to 1 after 5 is recorded; then come 3 and 6."
      - input: |
          8 N 9 10
        output: |
          8 10 9
        explanation: "8 has no left child, so it is recorded at once and the walk steps right to 9, whose left child 10 is recorded before 9."
    hints:
      - "The rightmost node of a node's left subtree is its inorder predecessor."
      - "A predecessor whose right pointer is empty means you are descending for the first time; a predecessor already pointing back means the left subtree is done."
      - "Compared with Morris preorder, only the line that records the value moves."
    explanation: |
      **Recursion or a stack — O(n) time, O(h) space.** The two standard inorder
      walks. Both spend memory proportional to the height, which a chain of 2000
      nodes makes as bad as `O(n)`.

      **Morris inorder — O(n) time, O(1) extra space.** Start with `current` at the
      root and loop while it is not null:

      - *No left child.* Record `current.val`, then move `current = current.right`.
      - *Left child exists.* Find the inorder predecessor: go to `current.left`,
        then right while the right pointer is non-null and is not `current`.
        - Predecessor's right is `None` — first visit: set
          `predecessor.right = current` and move `current = current.left`
          **without recording anything**.
        - Predecessor's right is `current` — the left subtree is finished: restore
          `predecessor.right = None`, **record `current.val`**, and move
          `current = current.right`.

      Recording on the second encounter is what makes it inorder; recording on the
      first would make it preorder.

      **Why the time is O(n).** A node with a left subtree causes one predecessor
      search on the way down and one on the way back. Each such search walks the
      right spine of a subtree, and each edge belongs to at most one such spine, so
      the total number of steps is bounded by a constant times the number of edges.

      **Why the tree survives.** Every thread that is created is removed the second
      time the walk reaches the same node, so when the loop ends every right
      pointer is back to its original value. Verify this in your head before using
      Morris on a tree someone else owns — a half-finished Morris walk that is
      abandoned early leaves cycles behind.
