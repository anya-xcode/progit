    referenceSolution:
      python: |
        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def count_nodes(root: Optional[TreeNode]) -> int:
            def left_spine(node: Optional[TreeNode]) -> int:
                height = 0
                while node.left is not None:
                    node = node.left
                    height += 1
                return height

            def right_spine(node: Optional[TreeNode]) -> int:
                height = 0
                while node.right is not None:
                    node = node.right
                    height += 1
                return height

            node = root
            total = 0
            while node is not None:
                left = left_spine(node)
                right = right_spine(node)
                if left == right:
                    return total + (1 << (left + 1)) - 1
                # The left subtree is perfect exactly when the hole is on the right.
                if left_spine(node.left) == right_spine(node.left):
                    total += (1 << left) - 1 + 1
                    node = node.right
                else:
                    total += (1 << (left - 1)) - 1 + 1
                    node = node.left
            return total


        # --- Input/output handling ---
        def build_tree(tokens: List[str]) -> Optional[TreeNode]:
            """Builds a tree from level-order tokens, where "N" marks a missing child."""
            if not tokens or tokens[0] == "N":
                return None
            root = TreeNode(int(tokens[0]))
            queue = [root]
            head = 0
            i = 1
            while head < len(queue) and i < len(tokens):
                node = queue[head]
                head += 1
                if tokens[i] != "N":
                    node.left = TreeNode(int(tokens[i]))
                    queue.append(node.left)
                i += 1
                if i < len(tokens) and tokens[i] != "N":
                    node.right = TreeNode(int(tokens[i]))
                    queue.append(node.right)
                i += 1
            return root


        def main():
            sys.setrecursionlimit(10**6)
            lines = sys.stdin.read().splitlines()
            root = build_tree(lines[0].split() if lines else [])
            print(count_nodes(root))


        if __name__ == "__main__":
            main()
