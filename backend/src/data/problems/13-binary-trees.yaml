    slug: count-total-nodes-in-a-complete-bt
    title: "Count Nodes of a Complete Binary Tree"
    difficulty: Easy
    topic: "Binary Trees"
    subtopic: "Hard Problems"
    tags: [tree, binary-search, recursion]
    sourceUrl: "https://leetcode.com/problems/count-complete-tree-nodes/"
    statement: |
      In a **complete** binary tree every level is completely filled except
      possibly the last, and the nodes of the last level are pushed as far to the
      **left** as they can go.

      Given the root of a complete binary tree, print how many nodes it has. Just
      walking the whole tree is `O(n)`; the point of this problem is to use the
      completeness and finish in `O(log²n)` — that is, in fewer steps than there
      are nodes.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`). The tree is guaranteed to be complete.
    outputFormat: |
      Print a single integer: the number of nodes in the tree.
    constraints:
      - "0 <= number of nodes <= 5000"
      - "-10^4 <= node value <= 10^4"
      - "The tree is a complete binary tree"
    examples:
      - input: |
          1 2 3 4 5 6
        output: |
          6
        explanation: "The first two levels are full (1 + 2 nodes) and the last level holds 4, 5 and 6, pushed to the left."
      - input: |
          1 2 3 4 5 6 7
        output: |
          7
        explanation: "Three completely full levels: 1 + 2 + 4 = 7 nodes, a perfect tree."
    hints:
      - "Walk from a node always to the left child, and then always to the right child, counting the steps."
      - "If those two counts are equal, the subtree is perfect — and a perfect subtree of height h has exactly 2^(h+1) - 1 nodes, no traversal needed."
      - "If they differ, count the node itself and recurse into both children; only one side can be imperfect at each level."
    explanation: |
      **Count every node — O(n) time, O(h) space.** Any traversal, adding one per
      node. It ignores the shape completely, which is exactly what the problem asks
      you to exploit.

      **Perfect-subtree shortcut — O(log²n) time, O(log n) space.** For the current
      node compute two numbers:

      - `left_height`: steps taken following only left children to the bottom;
      - `right_height`: steps taken following only right children to the bottom.

      If they are equal the subtree is **perfect**, and a perfect subtree whose
      spine has `h` steps holds `2^(h+1) - 1` nodes — return that immediately
      without visiting anything. Otherwise return
      `1 + count(left child) + count(right child)`.

      Why it is fast: in a complete tree the "imperfect" nodes all lie on a single
      root-to-leaf path, so the recursion really only descends one branch — about
      `log n` levels — and at each level the two spine walks cost `O(log n)`. That
      gives `O(log²n)` total. For 5000 nodes that is a few hundred steps instead of
      5000.

      **Binary search on the last level — O(log²n) time, O(1) space.** An
      equivalent formulation: the levels above the last hold `2^h - 1` nodes, and
      the number of nodes on the last level can be found by binary searching the
      leftmost missing position, testing a candidate by walking down using the bits
      of its index. Same complexity, no recursion.
