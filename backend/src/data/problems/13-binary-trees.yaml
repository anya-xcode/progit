    slug: construct-the-binary-tree-from-postorder-and-inorder-traversal
    title: "Build a Tree from Postorder and Inorder"
    difficulty: Hard
    topic: "Binary Trees"
    subtopic: "Hard Problems"
    tags: [tree, recursion, hashing, construction]
    sourceUrl: "https://leetcode.com/problems/construct-binary-tree-from-inorder-and-postorder-traversal/"
    statement: |
      You are given the **postorder** and the **inorder** traversals of a binary
      tree whose `n` node values are all **distinct**. Rebuild the tree and return
      its root.

      Postorder writes a node *after* both of its subtrees, so its **last** value
      is the root. Locating that value inside inorder splits the rest into the left
      subtree (before it) and the right subtree (after it) — the same recursive cut
      as with preorder, run from the other end.

      The driver prints the tree you return in DSAForge's level-order form, so
      your answer is checked for both shape and values.
    inputFormat: |
      - Line 1: an integer `n`, the number of nodes.
      - Line 2: `n` space-separated integers, the postorder traversal (empty line if `n = 0`).
      - Line 3: `n` space-separated integers, the inorder traversal (empty line if `n = 0`).
    outputFormat: |
      Print the level-order values of the rebuilt tree on one line, using `N` for a missing child of an existing node and dropping the trailing `N`s. Print `N` for the empty tree.
    constraints:
      - "0 <= n <= 2000"
      - "-10^4 <= node value <= 10^4, and all values are distinct"
      - "The two sequences are genuine traversals of the same binary tree"
    examples:
      - input: |
          6
          4 5 2 6 3 1
          4 2 5 1 3 6
        output: |
          1 2 3 4 5 N 6
        explanation: "The last postorder value 1 is the root. Inorder puts 4 2 5 on its left and 3 6 on its right; repeating the step on each side rebuilds the tree."
      - input: |
          3
          9 8 7
          7 9 8
        output: |
          7 N 8 9
        explanation: "7 is the root and has nothing before it in inorder, so its left subtree is empty. In the piece 9 8 / 9 8, the postorder end 8 is the root and 9 precedes it, making 9 the left child of 8."
    hints:
      - "Consume postorder from the back — the value you take is the root of the current piece."
      - "Because you move backwards, build the right subtree before the left one."
      - "A dictionary from value to its index in inorder turns the root lookup into O(1)."
    explanation: |
      **Recursion with slicing — O(n²) time, O(n²) space.** Take the last postorder
      value as the root, find it in `inorder` by scanning, and recurse on the two
      slices. Simple, but the repeated scans and copies make it quadratic.

      **Recursion with a value-to-index map — O(n) time, O(n) space.** Build
      `position[value] = index in inorder`. Keep a cursor at the **end** of
      postorder and write `build(in_lo, in_hi)`:

      1. if `in_lo > in_hi`, return `None`;
      2. take `value = postorder[cursor]` and decrement the cursor;
      3. create the node, look up `mid = position[value]`;
      4. build the **right** subtree from `(mid + 1, in_hi)` first, then the left
         subtree from `(in_lo, mid - 1)`.

      The order of steps 4 is the only real difference from the preorder version:
      reading postorder backwards yields `root, right subtree, left subtree`, which
      is the mirror image of preorder. Getting it the wrong way round silently
      builds a mirrored tree, which is the classic bug here.

      **Iterative version — O(n) time, O(n) space.** Walk postorder backwards with
      a stack, attaching right children while the stack top does not match
      `inorder[j]` (with `j` starting at the end), then popping and attaching a left
      child. Same trade-off as before: no recursion depth, more care.

      **Consistency check.** If the two sequences did not describe the same tree,
      the recursion would run out of values or find a root that is not inside the
      current inorder range. The constraints promise they do, so no validation is
      needed.
