  - sheetId: prob-13-3-3-maximum-width-of-bt
    slug: maximum-width-of-bt
    title: "Maximum Width of a Binary Tree"
    difficulty: Medium
    topic: "Binary Trees"
    subtopic: "Hard Problems"
    tags: [tree, bfs, indexing]
    sourceUrl: "https://leetcode.com/problems/maximum-width-of-binary-tree/"
    statement: |
      Give every position of a **perfect** binary tree an index: the root gets `0`,
      and the children of the position with index `i` get `2i + 1` and `2i + 2`.
      Real trees have gaps, but the indices are still defined — a missing node just
      leaves its index unused.

      The **width of a level** is the number of positions between the leftmost and
      the rightmost node actually present on that level, counting the empty
      positions in between:
      `width = rightmost_index - leftmost_index + 1`.

      Given the root of a binary tree, print the largest width over all levels. The
      empty tree has width `0`.
    inputFormat: |
      A single line with the level-order values of the tree, using `N` for a missing child (the empty tree is `N`).
    outputFormat: |
      Print a single integer: the maximum width over all levels.
    constraints:
      - "0 <= number of nodes <= 2000"
      - "-10^4 <= node value <= 10^4"
      - "The answer fits in a 64-bit signed integer"
    examples:
      - input: |
          1 3 2 5 3 N 9
        output: |
          4
        explanation: "The deepest level holds 5 at index 3, 3 at index 4 and 9 at index 6; index 5 is empty but still counted, so the width is 6 - 3 + 1 = 4."
      - input: |
          1 3 N 5 3
        output: |
          2
        explanation: "The last level holds 5 at index 3 and 3 at index 4, giving width 2; the levels above have widths 1 and 1."
    hints:
      - "Do a level-order walk carrying an index with every node."
      - "For each level, the width is the last index minus the first index plus one."
      - "Subtract the first index of the level from every index on that level; the widths do not change and the numbers stay small."
    explanation: |
      **Count nodes per level — wrong.** Counting how many nodes a level contains
      ignores the gaps, and the gaps are the whole point: a level holding only the
      leftmost and rightmost positions of depth 10 is 1025 wide, not 2 wide.

      **BFS with position indices — O(n) time, O(w) space.** Push `(root, 0)`. For
      each level, read how many entries the queue holds, note the index of the
      first entry, pop them all while pushing `(left, 2i + 1)` and
      `(right, 2i + 2)`, and take `last_index - first_index + 1` as the level's
      width. The answer is the maximum over levels. `w` is the widest level.

      **Keeping the indices small.** In a tree 2000 levels deep, `2i + 2` grows to
      astronomically large numbers — fine in Python, an overflow in most other
      languages, and slow either way. The fix costs one line: when you start a
      level, remember its first index `base` and store `i - base` instead of `i`.
      Differences within a level are unchanged, so the widths are identical, while
      every index stays below the level's width.

      **DFS variant — O(n) time, O(h) space.** Recurse carrying `(depth, index)`,
      record the first index seen at each depth (the leftmost, because you go left
      first) and update `answer = max(answer, index - first[depth] + 1)` at every
      node. Same result with less queue memory.
