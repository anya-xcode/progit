        import sys
        from typing import List, Optional


        class TreeNode:
            def __init__(self, val: int = 0, left: "Optional[TreeNode]" = None, right: "Optional[TreeNode]" = None):
                self.val = val
                self.left = left
                self.right = right


        def traversal_log(root: Optional[TreeNode]) -> List[int]:
            log: List[int] = []
            if root is None:
                return log
            stack: List[tuple] = [(root, 1)]
            while stack:
                node, state = stack.pop()
                log.append(node.val)
                if state == 1:
                    stack.append((node, 2))
                    if node.left:
