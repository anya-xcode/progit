        from typing import List


        def z_function(s: str) -> List[int]:
            # Return the Z-array of s, with z[0] = len(s).
            pass


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(" ".join(str(value) for value in z_function(s)))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def z_function(s: str) -> List[int]:
            n = len(s)
            z = [0] * n
            z[0] = n
            left = right = 0
            for i in range(1, n):
                if i < right:
                    z[i] = min(right - i, z[i - left])
                while i + z[i] < n and s[z[i]] == s[i + z[i]]:
                    z[i] += 1
                if i + z[i] > right:
                    left, right = i, i + z[i]
            return z


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(" ".join(str(value) for value in z_function(s)))


        if __name__ == "__main__":
            main()
