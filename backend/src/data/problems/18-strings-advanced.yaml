  - sheetId: prob-18-1-6-kmp-algorithm-or-lps-arra
    slug: kmp-algorithm-or-lps-array
    title: "KMP Algorithm or LPS array"
    difficulty: Hard
    topic: "Pattern Matching"
    subtopic: "Hard Problems"
    tags: ["string", "kmp", "pattern-matching"]
    sourceUrl: ""
    statement: |
      The **LPS array** (longest proper prefix which is also a suffix, also
      called the failure function) of a string `p` of length `m` is defined by

      ```
      lps[i] = length of the longest proper prefix of p[0..i] that is also a
               suffix of p[0..i]
      ```

      "Proper" means the whole prefix `p[0..i]` itself does not count, so
      `0 <= lps[i] <= i`. For `p = "ababd"` the array is `0 0 1 2 0`: after
      `"aba"` the prefix `"a"` is also a suffix, after `"abab"` the prefix
      `"ab"` is also a suffix, and after `"ababd"` nothing matches.

      This array is exactly what the **Knuth-Morris-Pratt** algorithm uses to
      search without ever moving backwards in the text: on a mismatch it slides
      the pattern forward by as much as the LPS array allows.

      Given a `text` and a `pattern`, print the LPS array of the **pattern**,
      and then every position at which the pattern occurs in the text.
      Occurrences may **overlap**.
    inputFormat: |
      - Line 1: the string `text`.
      - Line 2: the string `pattern`.
    outputFormat: |
      Print two lines.

      - Line 1: the LPS array of `pattern` — `m` integers separated by single
        spaces.
      - Line 2: all 0-indexed starting positions of `pattern` in `text`, in
        increasing order, separated by single spaces; print `-1` on this line if
        there is no occurrence.
    constraints:
      - "1 <= length of text <= 100000"
      - "1 <= length of pattern <= 100000"
      - "Both strings contain only lowercase English letters ('a'-'z')"
      - "The pattern may be longer than the text, in which case there is no occurrence"
    examples:
      - input: |
          ababcabcabababd
          ababd
        output: |
          0 0 1 2 0
          10
        explanation: >-
          The LPS array of `ababd` is `0 0 1 2 0`. Scanning the text, the
          pattern matches only once, starting at index 10 (`text[10..15) =
          "ababd"`).
      - input: |
          aaaaa
          aa
        output: |
          0 1
          0 1 2 3
        explanation: >-
          For `aa` the prefix `a` is also a suffix, so the LPS array is `0 1`.
          The pattern matches at four overlapping positions; after each match
          the search resumes from `lps[m-1] = 1`, which is what lets overlaps be
          found.
    hints:
      - >-
        Build the LPS array by matching the pattern against itself. Keep a
        length k of the border found so far; when p[i] equals p[k] the border
        grows by one.
      - >-
        On a mismatch do not reset k to 0 — fall back to lps[k - 1], which is
        the next shorter border, and try again. Repeat until it matches or k
        reaches 0.
      - >-
        Searching uses the same loop with the text on one side and the pattern
        on the other. When k reaches m you have found an occurrence ending at i,
        so record i - m + 1 and set k = lps[m - 1] to allow overlaps.
    explanation: |
      Let `n = |text|` and `m = |pattern|`.

      **Brute force — O(n · m) time.** Try every start and compare characters.
      The failure mode is a text and pattern that agree on a long prefix at
      every position, such as `"aaaa...a"` against `"aaa...b"`.

      **Building the LPS array — O(m) time, O(m) space.** Compare the pattern
      with itself. Keep `k`, the length of the longest border of the prefix
      processed so far, and scan `i` from `1` to `m - 1`:

      - while `k > 0` and `p[i] != p[k]`, set `k = lps[k - 1]`. Falling back to
        `lps[k - 1]` jumps to the next shorter border, which is the only other
        candidate that can still work;
      - if `p[i] == p[k]`, increment `k`;
      - store `lps[i] = k`.

      `k` increases at most once per step and never goes below zero, so the
      total number of fall-backs is bounded by the number of increments:
      amortised `O(m)`.

      **Searching — O(n) time.** Run the same loop with `text[i]` against
      `pattern[k]`. Whenever `k` reaches `m`, the pattern ends at `i`, so record
      the start `i - m + 1` and set `k = lps[m - 1]` instead of `0`. Resetting
      to the border rather than to zero is precisely what allows overlapping
      matches to be reported, and it is why the text pointer never moves
      backwards.

      Total cost `O(n + m)` time and `O(m)` space, worst case — no probability
      involved, unlike Rabin-Karp.

      **Edge cases.** A pattern longer than the text yields an LPS array but no
      occurrence, so line 2 must be `-1`. A one-character pattern has
      `lps = [0]`. A pattern of identical characters gives `0 1 2 ... m-1`, the
      case where the fall-back chain is longest.
    starterCode:
      python: |
        import sys
        from typing import List, Tuple


        def kmp_search(text: str, pattern: str) -> Tuple[List[int], List[int]]:
            # Return (lps array of pattern, sorted start positions in text).
            pass


        # --- Input/output handling ---
        def main():
            text = sys.stdin.readline().strip()
            pattern = sys.stdin.readline().strip()
            lps, positions = kmp_search(text, pattern)
            print(" ".join(str(value) for value in lps))
            print(" ".join(str(p) for p in positions) if positions else -1)


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List, Tuple


        def build_lps(pattern: str) -> List[int]:
            lps = [0] * len(pattern)
            k = 0
            for i in range(1, len(pattern)):
                while k > 0 and pattern[i] != pattern[k]:
                    k = lps[k - 1]
                if pattern[i] == pattern[k]:
                    k += 1
                lps[i] = k
            return lps


        def kmp_search(text: str, pattern: str) -> Tuple[List[int], List[int]]:
            m = len(pattern)
            lps = build_lps(pattern)
            positions = []
            k = 0
            for i, ch in enumerate(text):
                while k > 0 and ch != pattern[k]:
                    k = lps[k - 1]
                if ch == pattern[k]:
                    k += 1
                if k == m:
                    positions.append(i - m + 1)
                    k = lps[k - 1]
            return lps, positions


        # --- Input/output handling ---
        def main():
            text = sys.stdin.readline().strip()
            pattern = sys.stdin.readline().strip()
            lps, positions = kmp_search(text, pattern)
            print(" ".join(str(value) for value in lps))
            print(" ".join(str(p) for p in positions) if positions else -1)


        if __name__ == "__main__":
            main()
