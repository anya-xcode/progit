  - sheetId: prob-18-1-7-shortest-palindrome
    slug: shortest-palindrome
    title: "Shortest Palindrome"
    difficulty: Hard
    topic: "Pattern Matching"
    subtopic: "Hard Problems"
    tags: ["string", "z-function", "kmp", "palindrome"]
    sourceUrl: ""
    statement: |
      You are given a string `s` of lowercase English letters. You may insert
      any number of characters **in front of** `s` (never inside it and never
      after it).

      Produce the **shortest palindrome** that can be obtained this way.

      Because the characters you add must be exactly the reverse of some suffix
      of `s` — everything that is not covered by a palindromic prefix of `s` —
      the shortest such palindrome is unique, so there is only one correct
      answer.
    inputFormat: |
      - A single line: the string `s`.
    outputFormat: |
      Print one line: the shortest palindrome that has `s` as a suffix.
    constraints:
      - "1 <= length of s <= 100000"
      - "s contains only lowercase English letters ('a'-'z')"
    examples:
      - input: |
          aacecaaa
        output: |
          aaacecaaa
        explanation: >-
          The longest palindromic prefix of `aacecaaa` is `aacecaa` (7
          characters). Only the final `a` is left over, so reversing it and
          putting it in front gives `a` + `aacecaaa` = `aaacecaaa`, a palindrome
          of length 9.
      - input: |
          abcd
        output: |
          dcbabcd
        explanation: >-
          The only palindromic prefix of `abcd` is the single letter `a`, so
          `bcd` must be mirrored in front: `dcb` + `abcd` = `dcbabcd`.
    hints:
      - >-
        Whatever you prepend is the reverse of a suffix of s. Minimising what
        you prepend is the same as maximising the length of a prefix of s that
        is already a palindrome.
      - >-
        Checking every prefix for being a palindrome costs O(n^2). Rewrite the
        question as a prefix-suffix problem: a prefix of s is a palindrome
        exactly when it is also a prefix of reverse(s) of the same length
        ending at the string's end.
      - >-
        Build t = s + '#' + reverse(s) with a separator that appears in neither
        half, and run the Z-algorithm (or the KMP failure function) on it. The
        largest value that reaches the end of t is the length of the longest
        palindromic prefix.
    explanation: |
      Let `n = |s|`.

      **Brute force — O(n²) time.** Try prefix lengths `k = n, n-1, ..., 1`,
      stop at the first `k` for which `s[0..k)` is a palindrome, and answer
      `reverse(s[k..n)) + s`. Each palindrome test is `O(n)`, so the total is
      quadratic — fine for a few thousand characters, too slow at `10^5`,
      especially on `"aaaa...a"`-like inputs.

      **Reformulate.** The characters we prepend are the reverse of the suffix
      that is *not* covered by a palindromic prefix, so the whole problem is:
      **find the longest prefix of `s` that is a palindrome**. Everything else
      follows.

      **Linear solution with the Z-algorithm — O(n) time, O(n) space.** Build

      ```
      t = s + '#' + reverse(s)
      ```

      where `#` occurs in neither part (so no match can straddle it). Compute
      the Z-array of `t`. For an index `i` in the `reverse(s)` half, `z[i]` is
      the length of the longest common prefix of `s` and the tail of `t`
      starting at `i`. When `z[i] == len(t) - i`, that tail — a *prefix of
      `reverse(s)` read to its end*, i.e. a reversed suffix… which for the tail
      reaching the end means a reversed **prefix** of `s` — matches a prefix of
      `s` exactly. So the prefix of `s` of that length equals its own reverse:
      it is a palindrome. Take the largest such `z[i]`, call it `k`, and print

      ```
      reverse(s[k..n)) + s
      ```

      **KMP variant.** The same value is `lps[len(t) - 1]` of the failure
      function of `t`, because the longest border of `s + '#' + reverse(s)` is
      precisely the longest prefix of `s` that is also a suffix of `reverse(s)`
      — again the longest palindromic prefix. Either tool is `O(n)`; pick the
      one you find easier to remember.

      **Edge cases.** A string that is already a palindrome (`racecar`, `aaaa`)
      needs zero additions and must be printed unchanged. A single character is
      its own answer. The separator must not be a lowercase letter, or a match
      could cross it and overstate `k`.
    starterCode:
      python: |
        import sys


        def shortest_palindrome(s: str) -> str:
            # Return the shortest palindrome that ends with s.
            pass


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(shortest_palindrome(s))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def z_function(s: str) -> List[int]:
            n = len(s)
            z = [0] * n
            z[0] = n
            left = right = 0
            for i in range(1, n):
                if i < right:
                    z[i] = min(right - i, z[i - left])
                while i + z[i] < n and s[z[i]] == s[i + z[i]]:
                    z[i] += 1
                if i + z[i] > right:
                    left, right = i, i + z[i]
            return z


        def shortest_palindrome(s: str) -> str:
            n = len(s)
            combined = s + "#" + s[::-1]
            z = z_function(combined)
            best = 0
            for i in range(n + 1, len(combined)):
                if z[i] == len(combined) - i and z[i] > best:
                    best = z[i]
            return s[best:][::-1] + s


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(shortest_palindrome(s))


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          aacecaaa
        expectedOutput: |
          aaacecaaa
        hidden: false
      - input: |
          abcd
        expectedOutput: |
          dcbabcd
        hidden: false
      - input: |
          a
        expectedOutput: |
          a
        hidden: true
      - input: |
          aaaa
        expectedOutput: |
          aaaa
        hidden: true
      - input: |
          abb
        expectedOutput: |
          bbabb
        hidden: true
      - input: |
          abab
        expectedOutput: |
          babab
        hidden: true
      - input: |
          racecar
        expectedOutput: |
          racecar
        hidden: true
      - input: |
          
        expectedOutput: |
          
        hidden: true
      - input: |
          baaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        expectedOutput: |
          
        hidden: true

  - sheetId: prob-18-1-8-longest-happy-prefix
    slug: longest-happy-prefix
    title: "Longest happy prefix"
    difficulty: Hard
    topic: "Pattern Matching"
    subtopic: "Hard Problems"
    tags: ["string", "kmp", "z-function"]
    sourceUrl: "https://leetcode.com/problems/longest-happy-prefix/"
    statement: |
      A **happy prefix** of a string `s` is a non-empty prefix of `s` that is
      also a suffix of `s` and is **strictly shorter** than `s` itself. (Such a
      prefix is usually called a *border* of `s`; the whole string does not
      count.)

      For `s = "ababab"` the happy prefixes are `"ab"` and `"abab"`, so the
      longest one is `"abab"`. For `s = "abcd"` there is none.

      Print the **longest happy prefix** of `s`.
    inputFormat: |
      - A single line: the string `s`.
    outputFormat: |
      Print one line: the longest happy prefix of `s`. If `s` has no happy
      prefix at all, print `-1` instead.
    constraints:
      - "1 <= length of s <= 100000"
      - "s contains only lowercase English letters ('a'-'z')"
      - "The answer is never the whole string, so a string of length 1 has no happy prefix"
    examples:
      - input: |
          ababab
        output: |
          abab
        explanation: >-
          `"abab"` is the first four characters and also the last four, and it is
          shorter than `"ababab"`. No longer border exists, because a border of
          length 5 would force `s[0] == s[1]`.
      - input: |
          abcd
        output: |
          -1
        explanation: >-
          The prefixes `a`, `ab`, `abc` are not suffixes (`d`, `cd`, `bcd`), so
          there is no happy prefix and the answer line is `-1`.
    hints:
      - >-
        Comparing every prefix with the matching suffix is O(n^2). This is
        exactly the quantity the KMP preprocessing step computes for each
        position.
      - >-
        Build the LPS (failure) array of s. lps[i] is the longest border of the
        prefix ending at i, so the answer length sits in the very last entry.
      - >-
        Alternatively compute the Z-array: the answer is the largest i with
        z[i] == n - i, since that says the suffix starting at i equals a prefix
        of the same length.
    explanation: |
      Let `n = |s|`.

      **Brute force — O(n²) time.** For `k = n - 1` down to `1`, test whether
      `s[0..k) == s[n-k..n)` and return the first success. Each test is `O(n)`,
      and a string like `"aaaa...a"` needs no early exit, so the worst case is
      quadratic.

      **Hashing — O(n) expected time.** Precompute prefix hashes and compare the
      hash of `s[0..k)` with the hash of `s[n-k..n)` in `O(1)` per `k`, from the
      largest `k` down. Linear and easy, but the answer is only probabilistically
      correct unless you verify the characters on a hit.

      **KMP failure function — O(n) time, O(n) space, exact.** Build the LPS
      array, where `lps[i]` is the length of the longest proper border of the
      prefix `s[0..i]`. The value we want is the longest proper border of the
      *whole* string, which is exactly `lps[n - 1]`. Print `s[:lps[n-1]]`, or
      `-1` when that value is `0`.

      Building the array is the standard self-matching loop: keep a running
      border length `k`, fall back to `lps[k - 1]` on a mismatch, increment on a
      match. The fall-backs are amortised `O(1)` each because `k` grows at most
      once per position.

      **Z-array variant.** The answer is the largest index `i >= 1` with
      `z[i] == n - i`: the suffix beginning at `i` then matches a prefix of the
      same length. Scanning `i` upwards and taking the first hit gives the
      longest such border directly.

      **Why `lps[n-1]` is the longest border and not just *a* border.** The
      construction never skips a candidate: when the running border cannot be
      extended it moves to `lps[k-1]`, the next longest border of the same
      prefix, and the borders of a string form exactly that chain. So the value
      stored is maximal at every position.

      **Edge cases.** `n = 1` has no proper non-empty border, so the answer is
      `-1`. A string of identical characters gives the border of length `n - 1`.
      Overlapping borders are allowed — for `"aaaa"` the answer `"aaa"` overlaps
      itself, which is fine.
    starterCode:
      python: |
        import sys


        def longest_happy_prefix(s: str) -> str:
            # Return the longest non-empty proper border of s, or "-1".
            pass


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(longest_happy_prefix(s))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def longest_happy_prefix(s: str) -> str:
            n = len(s)
            lps = [0] * n
            k = 0
            for i in range(1, n):
                while k > 0 and s[i] != s[k]:
                    k = lps[k - 1]
                if s[i] == s[k]:
                    k += 1
                lps[i] = k
            border = lps[n - 1]
            return s[:border] if border > 0 else "-1"


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(longest_happy_prefix(s))


        if __name__ == "__main__":
            main()
