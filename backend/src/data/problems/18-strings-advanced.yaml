  - sheetId: prob-18-1-9-count-palindromic-subsequ
    slug: count-palindromic-subsequences
    title: "Count Palindromic Subsequences"
    difficulty: Medium
    topic: "Dynamic Programming"
    subtopic: "Hard Problems"
    tags: ["string", "dynamic-programming", "palindrome"]
    sourceUrl: ""
    statement: |
      You are given a string `s` of lowercase English letters. Count its
      **palindromic subsequences**.

      A *subsequence* is obtained by deleting zero or more characters without
      changing the order of the rest. Two rules make the count unambiguous:

      - **The empty subsequence does not count.** Only non-empty subsequences
        are counted.
      - **Subsequences are counted by position, not by the text they spell.**
        Two subsequences are different whenever their sets of chosen indices
        differ, even if they read the same. For `s = "aaa"` the answer is `7`:
        three single characters (indices 0, 1, 2), three pairs (0-1, 0-2, 1-2)
        and one triple — not `3` (`"a"`, `"aa"`, `"aaa"`).

      The count can be enormous, so print it **modulo 10^9 + 7**.
    inputFormat: |
      - A single line: the string `s`.
    outputFormat: |
      Print one integer: the number of non-empty palindromic subsequences of
      `s`, counted by position, modulo `10^9 + 7`.
    constraints:
      - "1 <= length of s <= 1000"
      - "s contains only lowercase English letters ('a'-'z')"
    examples:
      - input: |
          aba
        output: |
          5
        explanation: >-
          The palindromic subsequences are the three single characters (indices
          0, 1, 2), the pair of `a`s at indices 0 and 2, and the whole string
          `aba`. That is 5 in total; the pairs `ab` and `ba` are not
          palindromes.
      - input: |
          aaa
        output: |
          7
        explanation: >-
          Every non-empty subsequence of `aaa` is a palindrome, and there are
          `2^3 - 1 = 7` of them. They are counted by position, so all three
          single `a`s and all three pairs count separately.
    hints:
      - >-
        Enumerating all 2^n subsequences is hopeless beyond about 20 characters.
        Think about an interval DP instead: what is the answer for the substring
        s[i..j]?
      - >-
        Counting the palindromes inside s[i+1..j] plus those inside s[i..j-1]
        counts everything that lives in both ranges twice, so subtract the count
        for s[i+1..j-1].
      - >-
        When s[i] equals s[j] you may additionally wrap that pair around every
        palindrome of s[i+1..j-1], and around the empty one — which is where the
        extra `+ 1` comes from. Take the modulus after every subtraction so the
        value never goes negative.
    explanation: |
      Let `n = |s|`.

      **Brute force — O(2^n · n) time.** Enumerate every subset of positions,
      build the string it spells and test it for being a palindrome. Correct,
      and a useful cross-check for `n <= 20`, but exponential.

      **Interval DP — O(n²) time, O(n²) space.** Let `dp[i][j]` be the number of
      non-empty palindromic subsequences of `s[i..j]` (inclusive), counted by
      position. Base case `dp[i][i] = 1` (the single character).

      For `i < j`:

      - `dp[i+1][j] + dp[i][j-1]` counts every palindrome that avoids `s[i]`
        plus every one that avoids `s[j]`, but the palindromes that avoid
        **both** have been counted twice, so subtract `dp[i+1][j-1]`;
      - if `s[i] == s[j]`, that pair can also wrap around every palindrome
        strictly inside — there are `dp[i+1][j-1]` of them — and around nothing
        at all, giving the pair `s[i]s[j]` itself. So add
        `dp[i+1][j-1] + 1`.

      Putting the two together:

      ```
      s[i] != s[j] :  dp[i][j] = dp[i+1][j] + dp[i][j-1] - dp[i+1][j-1]
      s[i] == s[j] :  dp[i][j] = dp[i+1][j] + dp[i][j-1] + 1
      ```

      (the `- dp[i+1][j-1]` and the `+ dp[i+1][j-1]` cancel in the equal case).
      Fill by increasing interval length; the answer is `dp[0][n-1]`.

      **Working modulo 10^9 + 7.** The subtraction can make an intermediate
      value negative before the modulus is applied. In Python `%` always returns
      a non-negative result so a single `% MOD` is enough; in languages where it
      does not, add `MOD` before reducing.

      **Space.** Only the previous two "diagonals" — or, filling by `i`
      descending, the previous row — are ever needed, so the table can be
      reduced to `O(n)` if memory is tight. With `n <= 1000` the full `n × n`
      table is about a million entries and runs in a fraction of a second.

      **Related but different.** Counting *distinct* palindromic subsequences
      (by the text they spell) needs a different recurrence with cases for how
      many times the boundary character appears inside; do not mix the two up.
