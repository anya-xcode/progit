  - sheetId: prob-1-1-9-theory-with-examples
    type: reference
    slug: theory-with-examples
    title: "Theory with examples"
    difficulty: Easy
    topic: "Complexity"
    subtopic: "Things to Know in C++/Java/Python or any language"
    tags: [complexity, theory, big-o]
    sourceUrl: ""
    statement: |
      This entry is the sheet's introduction to **time and space complexity** —
      the vocabulary you will use to justify every solution from here on. Nothing
      to submit; read it, then start applying it out loud to each problem you
      solve.

      **What complexity measures.** Not seconds — machines differ. It measures how
      the *amount of work* grows as the input grows. Count the operations that
      dominate (comparisons, array accesses, recursive calls), throw away constant
      factors and lower-order terms, and what remains is the growth rate. `3n + 7`
      and `n / 2` are both **O(n)**: doubling the input roughly doubles the work.

      **The ladder you will meet.**

      | Notation | Name | Typical source |
      | --- | --- | --- |
      | O(1) | constant | arithmetic, one array access, a hash lookup |
      | O(log n) | logarithmic | binary search, halving a range |
      | O(n) | linear | one pass over the data |
      | O(n log n) | linearithmic | sorting, divide and conquer with a linear merge |
      | O(n²) | quadratic | a loop inside a loop over the same data |
      | O(2ⁿ), O(n!) | exponential, factorial | trying every subset or every permutation |

      **A rule of thumb for judges.** Most online judges allow roughly 10⁸ simple
      operations per second in C++, and closer to 10⁷ in Python. So read the
      constraints *before* choosing an approach: `n` up to 10⁵ rules out O(n²);
      `n` up to 10³ makes it fine; `n` up to 20 is an invitation to try all 2ⁿ
      subsets.

      **Space complexity** is the same idea applied to extra memory — the storage
      you allocate beyond the input. Sorting in place is O(1) auxiliary space;
      building a frequency dictionary is O(n); recursion costs O(depth) in stack
      frames, which is why a recursive walk of a skewed tree can overflow.

      **Worst, average, best.** Unless a problem says otherwise, quote the
      **worst case**. Quicksort is O(n log n) on average but O(n²) in the worst
      case; a hash lookup is O(1) on average but O(n) if everything collides.
      Saying which case you mean is half the answer in an interview.
    explanation: |
      **How to read complexity off your own code**

      1. A loop over `n` items with O(1) work inside → O(n).
      2. Nested loops both over `n` → O(n²). Nested loops where the inner one runs
         over a *different* bound `m` → O(n·m), which is not the same thing.
      3. A loop whose counter is multiplied or divided by a constant each pass
         (`i *= 2`) → O(log n).
      4. Sorting anywhere in the solution → at least O(n log n); there is no point
         micro-optimising an O(n) pass that sits next to a sort.
      5. Recursion → count the number of calls and the work per call. Halving the
         input with one recursive call gives O(log n); two calls on halves plus a
         linear merge gives O(n log n); two calls on `n - 1` gives O(2ⁿ).

      **A worked pair.** Finding whether two numbers in an array sum to a target:
      checking every pair is two nested loops, O(n²) time and O(1) space. Scanning
      once while remembering seen values in a hash set is O(n) time and O(n) space.
      Same problem, same answer — a deliberate trade of memory for time. Recognising
      that trade is most of what the next seventeen steps teach.

      **Amortised cost.** Appending to a dynamic array (`vector`, `list`) is O(1)
      *amortised*: occasionally it must reallocate and copy everything, but the
      cost of those rare copies, spread over all the appends, stays constant per
      operation. The same reasoning explains why a hash table stays O(1) while
      growing.

      **Practise this way.** For every problem you finish, write one line:
      "O(...) time, O(...) space, because ...". If you cannot finish the sentence,
      you do not yet understand your own solution.

