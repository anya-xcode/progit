  - sheetId: prob-1-1-7-while-loops
    slug: while-loops
    title: While loops
    difficulty: Easy
    topic: "Language Basics"
    subtopic: "Things to Know in C++/Java/Python or any language"
    tags: [basics, loops, simulation]
    sourceUrl: ""
    statement: |
      A `for` loop suits a count you know in advance. A `while` loop suits the
      other case: **repeat until a condition stops being true**, however long that
      takes. Getting one right means making sure the state you test actually moves
      towards the exit — otherwise the loop never ends.

      Here is a rule that shrinks any positive integer to `1`:

      - if `n` is even, replace it with `n / 2`;
      - if `n` is odd, replace it with `3 * n + 1`.

      Applying the rule once counts as **one step**. Starting from `1`, zero steps
      are needed. For each given starting value, report how many steps it takes to
      reach `1`.

      For example, starting at `3` the values are
      `3 -> 10 -> 5 -> 16 -> 8 -> 4 -> 2 -> 1`, which is 7 steps.
    inputFormat: |
      - Line 1: an integer `q`, the number of starting values.
      - Next `q` lines: one integer `n` each.
    outputFormat: |
      Print `q` lines. Line `i` is the number of steps needed to bring the `i`-th
      starting value down to `1`.
    constraints:
      - "1 <= q <= 100"
      - "1 <= n <= 10^6"
      - "Every starting value in the tests does reach 1."
    examples:
      - input: |
          4
          1
          2
          3
          6
        output: |
          0
          1
          7
          8
        explanation: "1 is already done. 2 halves once. 3 needs the seven steps listed above. 6 halves to 3 and then needs those same seven steps."
      - input: |
          2
          7
          27
        output: |
          16
          111
        explanation: "Small starting values can take surprisingly long: the value grows several times before it finally collapses to 1."
    hints:
      - "The loop condition is `n != 1`, not a fixed count — you cannot know the number of steps beforehand."
      - "Every pass must change `n`; forget that and the loop spins forever."
    explanation: |
      **The idea.** Simulate the rule directly:

      ```
      steps = 0
      while n != 1:
          n = n // 2 if n % 2 == 0 else 3 * n + 1
          steps += 1
      return steps
      ```

      Three things make this a textbook `while` loop. The exit test is a *property*
      of the state, not a counter. The body is guaranteed to change that state.
      And the number of iterations is not known until you run it — which is exactly
      when a `for` loop is the wrong tool.

      **Why the intermediate value can exceed the input.** An odd step multiplies
      by three, so from `n = 10^6` the sequence can climb well above the starting
      value before coming back down. In C++ this is a real trap: use `long long`,
      because repeated `3 * n + 1` on an `int` can overflow. Python integers are
      unbounded, so the concern disappears — but the reason it disappears is worth
      understanding.

      **Cost.** O(steps) per query with O(1) extra space. Within these limits no
      starting value needs more than a few hundred steps, so the whole input is
      handled in well under a millisecond.

      **Going faster for repeated queries.** If `q` were large and the values
      overlapped, you could memoise: cache the step count of every value you pass
      through, and stop the loop as soon as you land on a cached one. That trades
      memory for time and is the first taste of dynamic programming.
    starterCode:
      python: |
        import sys


        def steps_to_one(n: int) -> int:
            # Repeatedly halve n when it is even, or replace it with 3n + 1 when it
            # is odd, and return how many steps it takes to reach 1.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            q = int(data[0])
            out = [str(steps_to_one(int(data[1 + i]))) for i in range(q)]
            print("\n".join(out))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def steps_to_one(n: int) -> int:
            steps = 0
            while n != 1:
                if n % 2 == 0:
                    n //= 2
                else:
                    n = 3 * n + 1
                steps += 1
            return steps


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            q = int(data[0])
            out = [str(steps_to_one(int(data[1 + i]))) for i in range(q)]
            print("\n".join(out))


        if __name__ == "__main__":
            main()
