  - sheetId: prob-1-1-6-for-loops
    slug: for-loops
    title: For loops
    difficulty: Easy
    topic: "Language Basics"
    subtopic: "Things to Know in C++/Java/Python or any language"
    tags: [basics, loops]
    sourceUrl: ""
    statement: |
      A `for` loop is the tool for repeating something a **known number of times**.
      It bundles three decisions in one place: where the counter starts, when the
      loop stops, and how the counter moves.

      Print the multiplication table of an integer `k`, from `1` up to `n`.
      Row `i` must read exactly:

      ```
      k x i = k*i
      ```

      with single spaces around the `x` and the `=`.
    inputFormat: |
      - Line 1: two space-separated integers `k` and `n`.
    outputFormat: |
      Print `n` lines. Line `i` (for `i` from `1` to `n`) is `k x i = p`, where `p` is
      the product `k * i`.
    constraints:
      - "-1000 <= k <= 1000"
      - "1 <= n <= 100"
    examples:
      - input: |
          3 5
        output: |
          3 x 1 = 3
          3 x 2 = 6
          3 x 3 = 9
          3 x 4 = 12
          3 x 5 = 15
        explanation: "Five rows, one per value of i from 1 to 5."
      - input: |
          -4 4
        output: |
          -4 x 1 = -4
          -4 x 2 = -8
          -4 x 3 = -12
          -4 x 4 = -16
        explanation: "k may be negative; only the products change sign, the layout does not."
    hints:
      - "The counter runs from 1 to n inclusive, so a range starting at 0 needs a shift."
      - "Build each line as a string and print the lines in order; do not print anything before the first row."
    explanation: |
      **The idea.** One counted loop:

      ```
      for i in range(1, n + 1):
          print(f"{k} x {i} = {k * i}")
      ```

      The only thing to be careful about is the *inclusive* upper bound: the table
      must contain row `n`, and `range(1, n)` stops one short. This off-by-one is
      the single most common bug in beginner loops, and it is worth forming the
      habit of asking "how many times does this body run?" — here, `n` times.

      **Anatomy, across languages.** C++ writes the three decisions explicitly,
      `for (int i = 1; i <= n; i++)`: initialise, test before each pass, advance
      after each pass. Python hides them inside `range(start, stop, step)`, where
      `stop` is always excluded. Once you see that `range(1, n + 1)` and
      `i = 1; i <= n; i++` describe the same `n` iterations, translating loops
      between languages stops being guesswork.

      **Output buffering.** Printing inside the loop is fine for 100 rows. When a
      problem asks for tens of thousands of lines, collect them in a list and emit
      one `print("\n".join(lines))` (or `sys.stdout.write`) — each `print` call has
      real overhead, and that single change often turns a timeout into an accepted
      solution.

      **Cost.** O(n) time, O(1) extra space if you print as you go.
