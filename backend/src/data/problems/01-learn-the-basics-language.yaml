    topic: "Problem Solving"
    subtopic: "Build-up Logical Thinking"
    tags: [patterns, practice, theory]
    sourceUrl: ""
    statement: |
      This is not a single problem — it is the sheet's **easy and medium pattern
      collection**, a batch of star/number/alphabet patterns to be printed with
      nested loops. Work through them with pen and paper first, then tick this
      entry off.

      **Why patterns, before any real algorithm?** Because they force you to
      convert a picture into index arithmetic, which is the same skill every
      array, matrix and string problem needs. A pattern gives you instant,
      unambiguous feedback: the shape either matches or it does not.

      **A method that works on every one of them.**

      1. Count the rows. That is your outer loop, usually `for i in range(n)`.
      2. For one fixed row, count the characters — spaces included. That is your
         inner loop's bound, and it is almost always a small formula in `i`:
         `i + 1`, `n - i`, `2 * i + 1`, `2 * (n - i) - 1`.
      3. Decide what each inner position prints: a star, a digit derived from `i`
         or `j`, or a letter such as `chr(ord('A') + j)`.
      4. Handle leading spaces as their own inner loop before the visible
         characters — that is what turns a left-aligned triangle into a centred
         pyramid.
      5. Print the row, then move to the next.

      **The shapes to be comfortable with:** solid and hollow squares; left,
      right, inverted and double-sided triangles; centred pyramids and inverted
      pyramids; diamonds; number triangles counting up, counting down and
      restarting per row; Floyd's triangle; Pascal's triangle; alphabet
      triangles; and the "butterfly".

      **How to practise.** Do not look up the formula. Draw the 4-row version on
      paper, index the rows `0..3`, write down how many spaces and how many
      symbols each row has, and only then fit a formula to the table you just
      built. DSAForge has the individual patterns as runnable problems in the
      Patterns sub-step; the practice links on this entry point at the sheet's
      own collection and video walkthrough.
    explanation: |
      **A worked example of the method.** Centred pyramid, `n = 4`:

      ```
         *
        ***
       *****
      *******
      ```

      Row `i` (0-indexed) has `n - 1 - i` leading spaces and `2 * i + 1` stars.
      Check the table before writing code — row 0: 3 spaces, 1 star; row 3:
      0 spaces, 7 stars. Both fit. Now the code is two inner loops and there is
      nothing left to debug.

      **Common traps.**

      - Off-by-one at the bottom row: decide once whether `i` is 0-indexed or
        1-indexed and keep it consistent through *all* the formulas.
      - Trailing spaces: harmless on most judges (whitespace inside a line is
        normalised), but do not rely on that when the shape itself is made of
        spaces, such as a hollow square.
      - Building the row with string concatenation inside the inner loop is
        O(width²); append the pieces to a list and join once.

      **Cost.** Every pattern here is O(rows × width) time — you print each
      character once — and O(width) extra space for the row you are assembling.

      **When you are done.** You should be able to look at an unfamiliar shape and
      write the row formula within a minute, without running anything. That is the
      readiness signal for moving on to the harder collection.

  - sheetId: prob-1-2-2-hard
    type: reference
    slug: hard
    title: Hard
    difficulty: Easy
    topic: "Problem Solving"
    subtopic: "Build-up Logical Thinking"
    tags: [patterns, practice, theory]
    sourceUrl: ""
    statement: |
      The second half of the sheet's **logical-thinking pattern collection**: the
      same "print a shape with nested loops" game, but with shapes whose row
      formula is no longer obvious at a glance. Read, practise, tick off.

      **What makes these harder.** In the easy set, one formula in `i` describes a
      row. Here a row usually has *several segments* that must be reasoned about
      separately, and some shapes are only symmetric if you deliberately build
      them that way.

      **The shapes worth mastering:**

      - **The butterfly** — stars, spaces, stars in every row, with the space
        count shrinking to zero at the waist and growing again. Three segments per
        row, and the top and bottom halves are mirror images.
      - **Hollow shapes** — a hollow pyramid or diamond prints a symbol only on
        the border. The condition is positional: print `*` when
        `j == 0 or j == width - 1 or i == 0 or i == n - 1`, a space otherwise.
      - **Symmetric number patterns** — `1 2 3 2 1` style rows, where the value
        depends on the *distance from the centre*, not on `j` directly.
      - **The "0 1 0 1" triangle** — the digit comes from the parity of `i + j`.
      - **Pascal's triangle** — row `i` holds the binomial coefficients; build
        each entry from the previous one with `value = value * (i - j) // (j + 1)`
        instead of recomputing factorials.
      - **Concentric squares** — the value at `(i, j)` is determined by the
        distance to the nearest edge: `min(i, j, n - 1 - i, n - 1 - j)`.

      **The technique that unlocks all of them.** Stop thinking "what do I print
      next" and start thinking "what is the value at position `(i, j)`". Write a
      single expression `f(i, j)` for the character, then the whole program is two
      plain loops and one `print`. Every pattern above collapses once you find its
      `f`.

      **How to practise.** Draw the `n = 5` version, write the grid of `(i, j)`
      values on paper, and look for what the printed character depends on: `i`,
      `j`, `i + j`, `i - j`, or a distance to an edge or centre. Then verify
      against `n = 4` too — an even size exposes the off-by-one that an odd one
      hides.
    explanation: |
      **Worked example — the butterfly, `n = 4`.**

      ```
      *      *
      **    **
      ***  ***
      ********
      ***  ***
      **    **
      *      *
      ```

      Top half, row `i` from 0 to `n - 1`: `i + 1` stars, then
      `2 * (n - 1 - i)` spaces, then `i + 1` stars. Check row 0 — 1 star, 6
      spaces, 1 star, width 8 — and row 3 — 4 stars, 0 spaces, 4 stars, width 8.
      The width is constant at `2n`, which is the invariant that tells you the
      formula is right. The bottom half is the top half printed in reverse row
      order, so generate the rows into a list and emit `rows + rows[-2::-1]`
      rather than writing the loop twice.

      **Worked example — concentric squares, `n = 5`.** The value at `(i, j)` is
      `n - min(i, j, n - 1 - i, n - 1 - j)`, giving `5` on the border, `4` one
      ring in, and `3` in the middle. One expression, no case analysis — this is
      the `f(i, j)` idea in its purest form.

      **Checklist before you call a pattern done.**

      - Does it hold for `n = 1`?
      - Does it hold for an even `n` as well as an odd one?
      - Is every row the same width when the shape says it should be?
      - Did you build each row into a list and `"".join` it, rather than
        concatenating in a loop?

      **Cost.** O(n²) time for an `n`-row pattern, since you emit on the order of
      `n²` characters, and O(n) extra space for one row at a time.

      **Where this pays off.** Matrix problems in Step 3 (spiral traversal,
      rotation, diagonal sums) are exactly this skill with a payload instead of a
      star, and Step 15's string questions lean on the same index reasoning.

  # ---------------------------------------------------------------------------
  # Sub-step 1.4 — Learn STL / Java Collections
  # ---------------------------------------------------------------------------
  - sheetId: prob-1-4-1-stl
    type: reference
    slug: stl
    title: STL
    difficulty: Easy
    topic: "Language Tools"
    subtopic: "Learn STL/Java-Collections or similar thing in your language"
    tags: [stl, containers, theory, cpp]
    sourceUrl: ""
    statement: |
      The **Standard Template Library** is C++'s box of ready-made containers and
      algorithms. You are expected to know what is in the box, what each piece
      costs, and — crucially — which one to reach for. DSAForge judges Python, so
      the table below pairs every STL container with the Python tool that plays
      the same role.

      **Sequence containers.**

      | STL | Python | Notes |
      | --- | --- | --- |
      | `vector<T>` | `list` | Dynamic array. O(1) indexing, O(1) amortised append, O(n) insert in the middle. The default choice. |
      | `deque<T>` | `collections.deque` | Push and pop at **both** ends in O(1). The right container for BFS queues and sliding windows. |
      | `array<T, N>` | tuple / fixed list | Fixed size, no growth. |

      **Adapters.**

      | STL | Python | Notes |
      | --- | --- | --- |
      | `stack<T>` | `list` with `append` / `pop` | LIFO, all O(1). |
      | `queue<T>` | `deque` with `append` / `popleft` | FIFO. Never use a plain list for this — `pop(0)` is O(n). |
      | `priority_queue<T>` | `heapq` | O(log n) push and pop. C++ gives a **max**-heap by default; `heapq` is a **min**-heap, so push negated values for a max-heap. |

      **Associative containers.**

      | STL | Python | Notes |
      | --- | --- | --- |
      | `unordered_map` / `unordered_set` | `dict` / `set` | Hashed. O(1) average lookup, no order. |
      | `map` / `set` | `sortedcontainers` or a sorted list | **Ordered**, O(log n), backed by a balanced tree. Python has no built-in equivalent — this is the one real gap. |
      | `multiset` / `multimap` | `Counter`, or a heap | Duplicate keys allowed. |

      **Algorithms worth knowing by name:** `sort`, `stable_sort`, `reverse`,
      `min_element` / `max_element`, `accumulate`, `count`, `find`, `next_permutation`,
      and the two binary searches `lower_bound` (first element `>=` x) and
      `upper_bound` (first element `>` x) — in Python, `bisect_left` and
      `bisect_right`.
    explanation: |
      **Choosing a container — the questions to ask, in order.**

      1. *Do I need order by key?* Yes and you also need range queries or the
         smallest key on demand → ordered map/set (`bisect` on a sorted list in
         Python). No → hash map/set.
      2. *Do I only need the extreme element?* → heap, not a sorted structure.
         Sorting to find one minimum is doing O(n log n) work for an O(n) answer.
      3. *Do I add and remove at both ends?* → deque.
      4. *Anything else?* → plain dynamic array. It is cache-friendly and beats
         cleverer structures at small sizes far more often than people expect.

      **The Python cheat sheet you will actually use on this sheet.**

      ```
      from collections import Counter, defaultdict, deque
      import heapq, bisect

      freq   = Counter(nums)                 # value -> count, in one pass
      groups = defaultdict(list)             # no "key not found" checks
      dq     = deque([1, 2]); dq.appendleft(0); dq.pop()
      heapq.heappush(h, (cost, node)); cost, node = heapq.heappop(h)
      i      = bisect.bisect_left(sorted_a, x)   # first index with a[i] >= x
      nums.sort(key=lambda p: (p[0], -p[1]))     # multi-key sort
      ```

      **Two habits that matter more than memorising APIs.** First, know the cost
      of every call you make — `list.insert(0, x)` and `x in some_list` are both
      O(n) and both quietly turn an O(n) solution into an O(n²) one. Second, when
      an interviewer asks "which container?", answer with the operation profile
      ("I need O(1) membership and I do not care about order, so a hash set")
      rather than the name alone. The name is the conclusion; the profile is the
      reasoning.

  - sheetId: prob-1-4-2-java-collections
    type: reference
    slug: java-collections
    title: "Java Collections"
    difficulty: Easy
    topic: "Language Tools"
    subtopic: "Learn STL/Java-Collections or similar thing in your language"
    tags: [java, collections, containers, theory]
    sourceUrl: ""
    statement: |
      The **Java Collections Framework** is Java's answer to the STL: a set of
      interfaces (`List`, `Set`, `Map`, `Queue`, `Deque`) with several concrete
      implementations each, so you program against the interface and pick the
      implementation by its cost profile. DSAForge judges Python, so read this as
      the third column of the same table — and as preparation for interviews where
      Java is the house language.

      **The four interfaces and what to instantiate.**

      | Interface | Pick | Cost | Python analogue |
      | --- | --- | --- | --- |
      | `List` | `ArrayList` | O(1) get/set, amortised O(1) add at the end | `list` |
      | | `LinkedList` | O(1) add/remove at the ends, O(n) get | `deque` |
      | `Set` | `HashSet` | O(1) average add/contains, unordered | `set` |
      | | `LinkedHashSet` | as above, keeps insertion order | `dict.fromkeys` trick |
      | | `TreeSet` | O(log n), **sorted**, with `floor`/`ceiling`/`headSet` | no built-in equivalent |
      | `Map` | `HashMap` | O(1) average, unordered | `dict` |
      | | `LinkedHashMap` | insertion-ordered (and the usual LRU building block) | `dict` (ordered since 3.7) |
      | | `TreeMap` | O(log n), sorted keys, `firstKey`, `floorKey` | `bisect` on a sorted list |
      | `Queue` / `Deque` | `ArrayDeque` | O(1) at both ends — the default stack **and** queue | `collections.deque` |
      | | `PriorityQueue` | O(log n) offer/poll, **min**-heap by default | `heapq` |

      **Things that trip people up.**

      - Generics cannot hold primitives: it is `List<Integer>`, not `List<int>`.
        Autoboxing hides this until you compare with `==`, which compares
        references — always use `.equals()` (or `intValue()`) for boxed numbers.
      - `Arrays.sort` on a primitive array uses a dual-pivot quicksort with an
        O(n²) worst case; on an object array it uses a stable merge sort. Sorting
        `Integer[]` instead of `int[]` is the usual defence in adversarial tests.
      - `java.util.Stack` is legacy and synchronised — use `ArrayDeque` instead.
      - `HashMap` iteration order is unspecified. If a problem's expected output
        depends on order, sort explicitly.

      **Useful helpers:** `Collections.sort/reverse/max/min`, `Arrays.asList`,
      `map.getOrDefault(k, 0)`, `map.merge(k, 1, Integer::sum)` for frequency
      counting, and `Arrays.binarySearch`.
    explanation: |
      **The same decision procedure, in Java words.** Need key order or range
      queries → `TreeMap`/`TreeSet`. Need only the extreme element →
      `PriorityQueue`. Need both ends → `ArrayDeque`. Otherwise → `ArrayList` plus
      `HashMap`/`HashSet`. That covers well over ninety per cent of the problems
      on this sheet.

      **Frequency counting, three ways, all O(n):**

      ```java
      map.put(k, map.getOrDefault(k, 0) + 1);
      map.merge(k, 1, Integer::sum);
      map.compute(k, (key, v) -> v == null ? 1 : v + 1);
      ```

      The Python equivalent is one line — `Counter(nums)` — which is a fair
      summary of the difference in verbosity between the two languages. The
      algorithmic content is identical, and that is the only part an interviewer
      is grading.

      **Why `TreeMap` has no Python twin.** A balanced binary search tree keeps
      keys sorted while supporting O(log n) insert, delete and "nearest key"
      queries. Python's standard library ships no such structure, so on this sheet
      you will emulate it with a sorted list plus the `bisect` module (O(log n)
      search but O(n) insert — fine up to a few thousand elements), with a heap
      when only the extreme matters, or by sorting offline and processing queries
      in a clever order. Knowing *why* you are reaching for a workaround is the
      point; it is a question that comes up often.

      **What to actually do with this entry.** Skim the table, then look up the
      concrete class the next time you need one rather than trying to memorise all
      of it today. Tick it off and move on to Step 1's maths and recursion
      problems, where these containers start earning their keep.
