  - sheetId: prob-1-1-1-input-output
    slug: input-output
    title: Input Output
    difficulty: Easy
    topic: "Language Basics"
    subtopic: "Things to Know in C++/Java/Python or any language"
    tags: [basics, io]
    sourceUrl: ""
    statement: |
      Every judged problem works the same way: your program reads the whole test
      from standard input, computes something, and prints the answer to standard
      output. Nothing else counts — no prompts, no decorations, no extra blank
      words. This first exercise is only about getting that pipe right.

      You are given a `name` (one word) and two integers `a` and `b`. Greet the
      person, then report the sum and the product of the two numbers, each on its
      own line.
    inputFormat: |
      - Line 1: a single word `name` made of Latin letters only (no spaces).
      - Line 2: two space-separated integers `a` and `b`.
    outputFormat: |
      Print exactly three lines:

      - Line 1: `Hello, <name>!` — the word `Hello`, a comma, a space, the name, then `!`.
      - Line 2: the value of `a + b`.
      - Line 3: the value of `a * b`.
    constraints:
      - "1 <= length of name <= 20"
      - "name contains only the letters a-z and A-Z"
      - "-10^6 <= a, b <= 10^6"
    examples:
      - input: |
          Ada
          3 4
        output: |
          Hello, Ada!
          7
          12
        explanation: "3 + 4 = 7 and 3 * 4 = 12, printed on separate lines after the greeting."
      - input: |
          Grace
          -5 9
        output: |
          Hello, Grace!
          4
          -45
        explanation: "-5 + 9 = 4 and -5 * 9 = -45. Negative results are printed with a minus sign."
    hints:
      - "Read everything from standard input first, then decide what each token means."
      - "The output is three separate lines, so print three times (or join with newlines)."
    explanation: |
      **Reading input.** Two common shapes work for almost every problem on this
      sheet. If the values are just whitespace-separated tokens, `sys.stdin.read().split()`
      gives you a flat list you can index — the newline between the name and the
      numbers is whitespace like any other. If a line may contain spaces that
      matter (a sentence, a name with a space in it), read that line on its own
      with `sys.stdin.readline().rstrip("\n")` instead.

      **Producing output.** Build the three lines and print them in order. The
      judge compares line by line, so the number of lines and their order matter;
      the exact amount of spacing inside a line does not.

      **Cost.** Reading a fixed number of tokens and printing three lines is
      O(1) time and O(1) extra space — but the habit is what matters here:
      parse, compute, print, and never print anything the statement did not ask
      for.
    starterCode:
      python: |
        import sys
        from typing import List


        def build_lines(name: str, a: int, b: int) -> List[str]:
            # Return the three output lines: the greeting, then a + b, then a * b.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            name = data[0]
            a, b = int(data[1]), int(data[2])
            for line in build_lines(name, a, b):
                print(line)


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def build_lines(name: str, a: int, b: int) -> List[str]:
            return [f"Hello, {name}!", str(a + b), str(a * b)]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            name = data[0]
            a, b = int(data[1]), int(data[2])
            for line in build_lines(name, a, b):
                print(line)


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          Ada
          3 4
        expectedOutput: |
          Hello, Ada!
          7
          12
        hidden: false
      - input: |
          Grace
          -5 9
        expectedOutput: |
          Hello, Grace!
          4
          -45
        hidden: false
      - input: |
          Bob
          0 0
        expectedOutput: |
          Hello, Bob!
          0
          0
        hidden: true
      - input: |
          Linus
          1000000 1000000
        expectedOutput: |
          Hello, Linus!
          2000000
          1000000000000
        hidden: true
      - input: |
          Zoe
          -7 -8
        expectedOutput: |
          Hello, Zoe!
          -15
          56
        hidden: true
      - input: |
          Al
          1 -1
        expectedOutput: |
          Hello, Al!
          0
          -1
        hidden: true
      - input: |
          Katherine
          123456 0
        expectedOutput: |
          Hello, Katherine!
          123456
          0
        hidden: true
      - input: |
          X
          -1000000 999999
        expectedOutput: |
          Hello, X!
          -1
          -999999000000
        hidden: true

  - sheetId: prob-1-1-2-cpp-basics
    type: reference
    slug: cpp-basics
    title: Cpp Basics
    difficulty: Easy
    topic: "Language Basics"
    subtopic: "Things to Know in C++/Java/Python or any language"
    tags: [basics, theory, cpp]
    sourceUrl: ""
    statement: |
      DSAForge judges **Python 3**, so there is nothing to submit here. Treat this
      entry as the checklist of language features you must be fluent in before
      data structures make any sense — written once, language-agnostically, with
      the C++ specifics called out where they differ.

      **The checklist.**

      - *Program shape.* Every program has one entry point. In C++ that is
        `int main() { ... }`, compiled ahead of time; in Python it is the module
        body, usually guarded by `if __name__ == "__main__":`.
      - *Variables and types.* C++ is statically typed: you declare
        `int n;`, `long long total;`, `double x;`, `char c;`, `bool ok;` and the
        compiler enforces them. Python infers types at runtime. The practical
        consequence is **overflow**: a C++ `int` holds roughly ±2·10⁹ and silently
        wraps past that, so sums of large arrays need `long long`. Python integers
        grow without limit, which removes a whole class of bugs — but do not let
        that make you forget the issue exists, because interviewers ask about it.
      - *Operators.* Arithmetic, comparison and logical operators are the same
        ideas everywhere, with two traps: integer division (`7 / 2` is `3` in C++,
        `3.5` in Python — use `//` for the C++ behaviour), and the sign of the
        remainder for negative operands.
      - *Control flow.* `if / else if / else`, `switch`, `for`, `while`,
        `do-while`, plus `break` and `continue`. The next few entries drill each
        one.
      - *Functions.* Parameters, return values, and the difference between
        copying an argument and sharing it — the "pass by value / pass by
        reference" entry below.
      - *Input and output.* `cin >> x` and `cout << x` in C++; `input()` or
        `sys.stdin` in Python. For large inputs C++ needs
        `ios_base::sync_with_stdio(false)` and Python needs `sys.stdin.read()`
        instead of a loop of `input()` calls.

      If any line above is unfamiliar, spend an hour on it now. Everything in the
      remaining seventeen steps is built out of exactly these pieces.
    explanation: |
      **Why the sheet starts here.** Almost every "I cannot solve this" moment in
      the first few steps is really a language problem wearing a costume: an
      off-by-one in a loop bound, an integer overflow, a list copied when it
      should have been shared. Fixing the language layer first makes the
      algorithmic layer visible.

      **A translation table worth memorising.**

      | Idea | C++ | Python |
      | --- | --- | --- |
      | Dynamic array | `vector<int> v;` | `v = []` |
      | Size | `v.size()` | `len(v)` |
      | Append | `v.push_back(x)` | `v.append(x)` |
      | Fixed loop | `for (int i = 0; i < n; i++)` | `for i in range(n):` |
      | Range-for | `for (int x : v)` | `for x in v:` |
      | Text | `string s;` (mutable) | `s = ""` (immutable) |
      | Big sum | `long long` | plain `int` |
      | Swap | `swap(a, b)` | `a, b = b, a` |

      **One habit to build now.** Whatever language you use on this sheet, write
      the solution as a *function* that takes arguments and returns a value, and
      keep the reading and printing in a separate driver. Every problem in
      DSAForge is laid out that way on purpose: it is how interview code is
      written, and it makes your solution testable without retyping input.
  - sheetId: prob-1-1-3-if-elseif
    slug: if-elseif
    title: If ElseIf
    difficulty: Easy
    topic: "Language Basics"
    subtopic: "Things to Know in C++/Java/Python or any language"
    tags: [basics, conditionals]
    sourceUrl: ""
    statement: |
      A chain of `if / else if / else` picks **exactly one** branch: the
      conditions are tested top to bottom and the first true one wins, so the
      order you write them in is part of the logic.

      You are given `q` exam scores. Convert each score to a letter grade using
      these bands:

      | Score | Grade |
      | --- | --- |
      | 90 to 100 | `A` |
      | 75 to 89 | `B` |
      | 60 to 74 | `C` |
      | 40 to 59 | `D` |
      | 0 to 39 | `F` |

      The bands do not overlap and together they cover every allowed score.
    inputFormat: |
      - Line 1: an integer `q`, the number of scores.
      - Next `q` lines: one integer `score` each.
    outputFormat: |
      Print `q` lines. Line `i` is the single uppercase letter grade of the `i`-th score.
    constraints:
      - "1 <= q <= 1000"
      - "0 <= score <= 100"
    examples:
      - input: |
          4
          95
          78
          61
          12
        output: |
          A
          B
          C
          F
        explanation: "95 falls in 90-100, 78 in 75-89, 61 in 60-74 and 12 in 0-39."
      - input: |
          3
          90
          89
          40
        output: |
          A
          B
          D
        explanation: "The boundaries belong to the higher band: 90 is already an A, while 89 is still a B and 40 is the lowest D."
    hints:
      - "Write the conditions from the highest band downwards; then each test only needs a lower bound."
      - "Once a branch is taken the rest are skipped, so you never need to write `score >= 75 and score <= 89`."
    explanation: |
      **The idea.** Sort the bands by their lower bound, largest first, and write
      one comparison per band:

      ```
      if score >= 90:  A
      elif score >= 75: B
      elif score >= 60: C
      elif score >= 40: D
      else:             F
      ```

      Because `elif` is only reached when every earlier condition failed, the
      upper bound of each band is implied. Writing the chain in the other order
      (`if score >= 40: D` first) would label a 95 as a `D` — the classic bug
      this exercise exists to teach.

      **Alternative — a table scan.** Keep a list of `(threshold, letter)` pairs
      in descending order and return the first letter whose threshold the score
      reaches. That is the same logic expressed as data instead of code, and it
      is what you would do if the bands came from a config file or if there were
      fifty of them.

      **Alternative — arithmetic.** For evenly spaced bands you can index
      directly, e.g. `"FFFFDDCCBA"[min(score, 99) // 10]` works for these bands.
      Cute, but fragile: it silently breaks the moment a boundary moves. Prefer
      the explicit chain unless the spacing is genuinely part of the problem.

      **Cost.** O(1) per score, O(q) overall, O(1) extra space.
    starterCode:
      python: |
        import sys


        def grade_of(score: int) -> str:
            # Return "A", "B", "C", "D" or "F" for the given score.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            q = int(data[0])
            out = [grade_of(int(data[1 + i])) for i in range(q)]
            print("\n".join(out))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def grade_of(score: int) -> str:
            if score >= 90:
                return "A"
            elif score >= 75:
                return "B"
            elif score >= 60:
                return "C"
            elif score >= 40:
                return "D"
            else:
                return "F"


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            q = int(data[0])
            out = [grade_of(int(data[1 + i])) for i in range(q)]
            print("\n".join(out))


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          4
          95
          78
          61
          12
        expectedOutput: |
          A
          B
          C
          F
        hidden: false
      - input: |
          3
          90
          89
          40
        expectedOutput: |
          A
          B
          D
        hidden: false
      - input: |
          1
          0
        expectedOutput: |
          F
        hidden: true
      - input: |
          1
          100
        expectedOutput: |
          A
        hidden: true
      - input: |
          8
          39
          40
          59
          60
          74
          75
          89
          90
        expectedOutput: |
          F
          D
          D
          C
          C
          B
          B
          A
        hidden: true
      - input: |
          5
          60
          60
          60
          60
          60
        expectedOutput: |
          C
          C
          C
          C
          C
        hidden: true
      - input: |
          2
          74
          75
        expectedOutput: |
          C
          B
        hidden: true
      - input: |
          14
          100
          99
          90
          89
          76
          75
          74
          60
          59
          41
          40
          39
          1
          0
        expectedOutput: |
          A
          A
          A
          B
          B
          B
          C
          C
          D
          D
          D
          F
          F
          F
        hidden: true

  - sheetId: prob-1-1-4-switch-case
    slug: switch-case
    title: Switch Case
    difficulty: Easy
    topic: "Language Basics"
    subtopic: "Things to Know in C++/Java/Python or any language"
    tags: [basics, conditionals, dispatch]
    sourceUrl: ""
    statement: |
      A `switch` picks one branch out of many by matching a value against a list
      of labels, with a `default` branch for everything that matches nothing.
      Python has no `switch` keyword before 3.10, so the same job is done with an
      `if / elif / else` chain or — more idiomatically — a dictionary that maps
      each label to the action it should trigger.

      Build a tiny calculator. You are given `q` commands; each command is an
      operation name followed by two integers `a` and `b`:

      | Operation | Result |
      | --- | --- |
      | `add` | `a + b` |
      | `sub` | `a - b` |
      | `mul` | `a * b` |
      | `div` | `a / b`, rounded down to an integer |
      | `mod` | the remainder of `a / b` |

      Any other operation name is unsupported: print `invalid` for it — that is
      the `default` case.
    inputFormat: |
      - Line 1: an integer `q`, the number of commands.
      - Next `q` lines: a word `op` (lowercase Latin letters) and two integers `a` and `b`, space-separated.

      For every `div` and `mod` command it is guaranteed that `a >= 0` and `b >= 1`,
      so the result is an ordinary non-negative integer.
    outputFormat: |
      Print `q` lines. Line `i` is the integer result of the `i`-th command, or the
      word `invalid` if its operation is not one of the five supported names.
    constraints:
      - "1 <= q <= 1000"
      - "1 <= length of op <= 10, lowercase Latin letters only"
      - "-10^6 <= a, b <= 10^6"
      - "For `div` and `mod`: 0 <= a <= 10^6 and 1 <= b <= 10^6"
    examples:
      - input: |
          5
          add 7 5
          sub 7 5
          mul 7 5
          div 7 5
          mod 7 5
        output: |
          12
          2
          35
          1
          2
        explanation: "7 + 5 = 12, 7 - 5 = 2, 7 * 5 = 35, 7 divided by 5 is 1 with remainder 2."
      - input: |
          3
          pow 2 10
          add -4 9
          mul -3 -6
        output: |
          invalid
          5
          18
        explanation: "`pow` is not one of the five supported names, so it falls through to the default branch."
    hints:
      - "A dictionary from the operation name to a small lambda is the Python spelling of a switch."
      - "Handle the unknown name once, where the lookup fails, instead of testing for it in every branch."
    explanation: |
      **Chain of comparisons.** The direct translation of a `switch` is
      `if op == "add": ... elif op == "sub": ... else: invalid`. It is clear and
      costs O(number of labels) comparisons per command — irrelevant for five
      labels, noticeable for fifty.

      **Dictionary dispatch — the idiomatic version.** Build the table once,
      outside the loop:

      ```
      OPS = {
          "add": lambda a, b: a + b,
          "sub": lambda a, b: a - b,
          "mul": lambda a, b: a * b,
          "div": lambda a, b: a // b,
          "mod": lambda a, b: a % b,
      }
      ```

      Then each command is a single hash lookup: `fn = OPS.get(op)`, and
      `fn is None` *is* the default branch. This is O(1) per command no matter how
      many operations exist, and adding a sixth one touches one line.

      **A note on `div` and `mod`.** Languages disagree about negative operands:
      C++ truncates toward zero (`-7 / 2 == -3`) while Python floors
      (`-7 // 2 == -4`), and the remainder follows the same split. The statement
      sidesteps the disagreement by guaranteeing non-negative operands for those
      two operations, where every language agrees. In an interview, say this out
      loud rather than assuming.

      **Cost.** O(q) time, O(1) extra space beyond the output.
    starterCode:
      python: |
        import sys


        def apply_operation(op: str, a: int, b: int) -> str:
            # Return the result of op applied to a and b as a string,
            # or "invalid" when op is not one of add/sub/mul/div/mod.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            q = int(data[0])
            out = []
            for i in range(q):
                op = data[1 + 3 * i]
                a, b = int(data[2 + 3 * i]), int(data[3 + 3 * i])
                out.append(apply_operation(op, a, b))
            print("\n".join(out))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys

        OPERATIONS = {
            "add": lambda a, b: a + b,
            "sub": lambda a, b: a - b,
            "mul": lambda a, b: a * b,
            "div": lambda a, b: a // b,
            "mod": lambda a, b: a % b,
        }


        def apply_operation(op: str, a: int, b: int) -> str:
            action = OPERATIONS.get(op)
            if action is None:
                return "invalid"
            return str(action(a, b))


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            q = int(data[0])
            out = []
            for i in range(q):
                op = data[1 + 3 * i]
                a, b = int(data[2 + 3 * i]), int(data[3 + 3 * i])
                out.append(apply_operation(op, a, b))
            print("\n".join(out))


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          5
          add 7 5
          sub 7 5
          mul 7 5
          div 7 5
          mod 7 5
        expectedOutput: |
          12
          2
          35
          1
          2
        hidden: false
      - input: |
          3
          pow 2 10
          add -4 9
          mul -3 -6
        expectedOutput: |
          invalid
          5
          18
        hidden: false
      - input: |
          1
          div 0 7
        expectedOutput: |
          0
        hidden: true
      - input: |
          1
          mod 0 7
        expectedOutput: |
          0
        hidden: true
      - input: |
          4
          sub -1000000 1000000
          mul 1000000 1000000
          add 0 0
          divide 8 2
        expectedOutput: |
          -2000000
          1000000000000
          0
          invalid
        hidden: true
      - input: |
          3
          mod 100 7
          div 100 7
          mod 7 100
        expectedOutput: |
          2
          14
          7
        hidden: true
      - input: |
          2
          sub 0 -5
          mul 1 0
        expectedOutput: |
          5
          0
        hidden: true
      - input: |
          6
          add 2 3
          xor 2 3
          sub 2 3
          mul 2 3
          div 2 3
          mod 2 3
        expectedOutput: |
          5
          invalid
          -1
          6
          0
          2
        hidden: true

  - sheetId: prob-1-1-5-what-are-arrays-strings
    slug: what-are-arrays-strings
    title: "What are arrays, strings?"
    difficulty: Easy
    topic: "Arrays"
    subtopic: "Things to Know in C++/Java/Python or any language"
    tags: [array, string, indexing, slicing]
    sourceUrl: ""
    statement: |
      An **array** is a block of values laid out one after another, addressed by
      position: `nums[0]` is the first, `nums[n - 1]` is the last, and reaching
      any of them costs the same tiny amount of time. A **string** is the same
      idea with characters instead of numbers.

      This exercise is pure position arithmetic — no algorithm, just the three
      things you will use in every later step: read an element by index, walk a
      subset of the indices, and reverse a sequence.

      You are given an array `nums` of `n` integers and a string `s`. Report:

      1. the first and the last element of `nums`,
      2. the elements of `nums` sitting at **even indices** (`0`, `2`, `4`, ...),
      3. the string `s` written backwards.
    inputFormat: |
      - Line 1: an integer `n`, the size of the array.
      - Line 2: `n` space-separated integers, the array `nums`.
      - Line 3: the string `s` (letters and digits, no spaces).
    outputFormat: |
      Print exactly three lines:

      - Line 1: `nums[0]` and `nums[n - 1]`, separated by a space.
      - Line 2: the elements at indices `0, 2, 4, ...`, in increasing index order, separated by spaces.
      - Line 3: the characters of `s` in reverse order.
    constraints:
      - "1 <= n <= 10^4"
      - "-10^9 <= nums[i] <= 10^9"
      - "1 <= length of s <= 10^4"
      - "s contains only the characters a-z, A-Z and 0-9"
    examples:
      - input: |
          5
          4 8 15 16 23
          dsaforge
        output: |
          4 23
          4 15 23
          egrofasd
        explanation: "The first element is 4 and the last is 23. Indices 0, 2 and 4 hold 4, 15 and 23. Reading `dsaforge` backwards gives `egrofasd`."
      - input: |
          1
          7
          a
        output: |
          7 7
          7
          a
        explanation: "With a single element, the first and the last element are the same one, and index 0 is the only even index."
    hints:
      - "The last position of a sequence of length n is n - 1, never n."
      - "A step of 2 over the index range gives you the even positions in one pass."
    explanation: |
      **Line 1 — direct indexing.** `nums[0]` and `nums[n - 1]`. An array stores
      its elements contiguously, so the machine finds element `i` by computing
      `base + i * element_size`: one multiplication and one addition, no searching.
      That constant-time random access is the entire reason arrays are the
      default data structure. (Python also allows `nums[-1]` for the last
      element, which is the same thing spelled more safely.)

      **Line 2 — a strided walk.** Loop `i` from `0` while `i < n`, stepping by
      `2`, and collect `nums[i]`; in Python that is `range(0, n, 2)` or the slice
      `nums[::2]`. You touch about `n / 2` elements, so O(n) time. Note that the
      last even index is `n - 1` when `n` is odd and `n - 2` when `n` is even —
      the loop condition handles both without a special case.

      **Line 3 — reversal.** Either build the answer by walking from the last
      character down to the first, or swap the characters at `i` and
      `len(s) - 1 - i` for `i` below `len(s) / 2`. Both are O(len(s)).

      **A difference worth knowing.** Python strings are **immutable** — `s[0] = 'x'`
      is an error, and every "modification" produces a new string. C++ `std::string`
      and Java `char[]` can be edited in place. When a problem asks you to change a
      string in Python, convert it to a list of characters first, edit, then
      `"".join(...)` it back.

      **Cost.** O(n + len(s)) time, O(n + len(s)) space for the printed answer.
    starterCode:
      python: |
        import sys
        from typing import List


        def describe(nums: List[int], s: str) -> List[str]:
            # Return the three output lines:
            #   1) first and last element of nums
            #   2) the elements at even indices
            #   3) s reversed
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            s = data[1 + n]
