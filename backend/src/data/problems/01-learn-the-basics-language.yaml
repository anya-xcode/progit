  - sheetId: prob-1-1-8-functions-pass-by-referen
    slug: functions-pass-by-reference-and-value
    title: "Functions (Pass by Reference and Value)"
    difficulty: Easy
    topic: "Language Basics"
    subtopic: "Things to Know in C++/Java/Python or any language"
    tags: [basics, functions, mutability]
    sourceUrl: ""
    statement: |
      When you hand a value to a function, one of two things happens. Either the
      function works on its **own copy** — and the caller's data survives untouched —
      or it works on the **same object** the caller holds, and any edit is visible
      outside. C++ spells the difference out (`void f(vector<int> v)` copies,
      `void f(vector<int>& v)` does not). Python decides it for you by type: numbers,
      strings and tuples are immutable, so they behave like copies, while lists,
      dictionaries and sets are shared and can be changed from inside.

      Write both versions of the same operation and watch the difference.

      You are given an array `nums` of `n` integers and a non-zero integer `x`.
      Implement two functions:

      - one that returns a **new** array with `x` added to every element, leaving
        `nums` exactly as it was;
      - one that adds `x` to every element of `nums` **itself**, changing the
        caller's array.

      The driver calls them in that order and reports what happened after each.
    inputFormat: |
      - Line 1: two space-separated integers `n` and `x`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print exactly four lines:

      - Line 1: the array returned by the copying function, space-separated.
      - Line 2: `true` if `nums` is still unchanged after that call, `false` otherwise.
      - Line 3: `nums` after the in-place function has run, space-separated.
      - Line 4: `true` if the in-place call did change `nums`, `false` otherwise.
    constraints:
      - "1 <= n <= 10^4"
      - "-10^9 <= nums[i] <= 10^9"
      - "-10^6 <= x <= 10^6 and x != 0"
    examples:
      - input: |
          5 10
          1 2 3 4 5
        output: |
          11 12 13 14 15
          true
          11 12 13 14 15
          true
        explanation: "The copying call produces the shifted array but leaves the original alone, so line 2 is `true`. The in-place call then shifts the original itself, so line 4 is `true`."
      - input: |
          3 -2
          0 -5 7
        output: |
          -2 -7 5
          true
          -2 -7 5
          true
        explanation: "x may be negative; the same two behaviours apply."
    hints:
      - "`copy = nums` does not copy anything — both names then point at the same list."
      - "To change the caller's list you must edit it in place (assign to `nums[i]`), not rebind the parameter name."
    explanation: |
      **The copying function.** Build a fresh list and never touch the argument:
      `return [value + x for value in nums]`. A list comprehension (or an explicit
      loop appending to a new list) allocates new storage, so the caller's array is
      untouched. Cost: O(n) time, O(n) extra space.

      **The in-place function.** Overwrite each slot of the object you were given:

      ```
      for i in range(len(nums)):
          nums[i] += x
      ```

      Cost: O(n) time, O(1) extra space. The caller sees the change because both
      names refer to the same list object.

      **The trap this exercise exists for.** Writing `nums = [v + x for v in nums]`
      inside the in-place function looks right and does nothing: it rebinds the
      *local parameter name* to a brand-new list and drops it when the function
      returns. The caller's list never moves. The same mistake in reverse —
      writing `copy = nums` and then editing `copy` — silently corrupts the
      caller's data, and is a genuinely common source of wrong answers later in
      this sheet (think of a backtracking routine that must not mutate the path it
      was handed).

      **How to reason about it.** In Python, arguments are always passed by
      *object reference*: the function receives another name for the same object.
      Assigning to that name changes only the name; calling a mutating method
      (`append`, `sort`, item assignment) changes the shared object. In C++ the
      same distinction is made at the signature — by value, by `&` reference, or by
      pointer — and in Java every object is handed over by reference while the
      primitives (`int`, `double`, `char`) are copied.

      **Defensive habit.** When a function must not disturb its input, take a copy
      at the top (`nums = nums[:]`) and say so in the name or a comment. When it is
      meant to mutate, return `None` so the call site cannot mistake it for the
      pure version — that is exactly the convention Python's own `list.sort()`
      (mutates, returns `None`) and `sorted()` (returns a new list) follow.
    starterCode:
      python: |
        import sys
        from typing import List


        def add_to_copy(nums: List[int], x: int) -> List[int]:
            # Return a NEW list with x added to every element. Leave nums untouched.
            pass


        def add_in_place(nums: List[int], x: int) -> None:
            # Add x to every element of nums itself, so the caller sees the change.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, x = int(data[0]), int(data[1])
            nums = [int(v) for v in data[2:2 + n]]
            original = nums[:]

            copied = add_to_copy(nums, x)
            print(" ".join(str(v) for v in copied))
            print("true" if nums == original else "false")

            add_in_place(nums, x)
            print(" ".join(str(v) for v in nums))
            print("true" if nums != original else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def add_to_copy(nums: List[int], x: int) -> List[int]:
            return [value + x for value in nums]


        def add_in_place(nums: List[int], x: int) -> None:
            for i in range(len(nums)):
                nums[i] += x


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, x = int(data[0]), int(data[1])
            nums = [int(v) for v in data[2:2 + n]]
            original = nums[:]

            copied = add_to_copy(nums, x)
            print(" ".join(str(v) for v in copied))
            print("true" if nums == original else "false")

            add_in_place(nums, x)
            print(" ".join(str(v) for v in nums))
            print("true" if nums != original else "false")


        if __name__ == "__main__":
            main()
