      python: |
        import sys
        from typing import List, Tuple


        def shortest_paths_dag(n: int, adj: List[List[Tuple[int, int]]], src: int) -> List[int]:
            indegree = [0] * n
            for u in range(n):
                for v, _ in adj[u]:
                    indegree[v] += 1
            order: List[int] = [node for node in range(n) if indegree[node] == 0]
            head = 0
            while head < len(order):
                node = order[head]
                head += 1
                for v, _ in adj[node]:
                    indegree[v] -= 1
                    if indegree[v] == 0:
                        order.append(v)

            inf = float("inf")
            dist = [inf] * n
            dist[src] = 0
            for node in order:
                if dist[node] == inf:
                    continue
                base = dist[node]
                for v, w in adj[node]:
                    if base + w < dist[v]:
                        dist[v] = base + w
            return [int(d) if d != inf else -1 for d in dist]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m, src = int(data[0]), int(data[1]), int(data[2])
            adj: List[List[Tuple[int, int]]] = [[] for _ in range(n)]
            for i in range(m):
                u = int(data[3 + 3 * i])
                v = int(data[4 + 3 * i])
                w = int(data[5 + 3 * i])
                adj[u].append((v, w))
            print(" ".join(map(str, shortest_paths_dag(n, adj, src))))


        if __name__ == "__main__":
            main()
