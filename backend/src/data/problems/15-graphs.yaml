      python: |
        import sys
        from typing import List, Tuple


        def make_connected(n: int, cables: List[Tuple[int, int]]) -> int:
            if len(cables) < n - 1:
                return -1
            parent = list(range(n))
            size = [1] * n

            def find(x: int) -> int:
                root = x
                while parent[root] != root:
                    root = parent[root]
                while parent[x] != root:
                    parent[x], x = root, parent[x]
                return root

            components = n
            for u, v in cables:
                ru, rv = find(u), find(v)
                if ru == rv:
                    continue
                if size[ru] < size[rv]:
                    ru, rv = rv, ru
                parent[rv] = ru
                size[ru] += size[rv]
                components -= 1
            return components - 1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            cables: List[Tuple[int, int]] = []
            for i in range(m):
                u, v = int(data[2 + 2 * i]), int(data[3 + 2 * i])
                cables.append((u, v))
            print(make_connected(n, cables))


        if __name__ == "__main__":
            main()
