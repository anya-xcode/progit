    title: "Alien Dictionary"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "Topo Sort"
    tags: [graph, topological-sort, string, heap]
    sourceUrl: ""
    statement: |
      A dictionary written in an alien language uses the first `k` lowercase English
      letters, but nobody knows in which order that alphabet runs. You are given `n`
      words from the dictionary, listed in the order the aliens consider sorted.

      "Sorted" means the usual rule with their alphabet instead of ours: comparing
      two words, the first position where they differ decides, and if one word is a
      prefix of the other the **shorter** one comes first.

      Recover an alphabet order that is consistent with the given list. Several
      orders may fit, so print the **lexicographically smallest** one, comparing the
      candidate orders as ordinary strings of our letters.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Next `n` lines: one word each. Every word is non-empty and uses only the
        first `k` lowercase letters (`a` to the `k`-th letter).
    outputFormat: |
      Print the `k` letters in the recovered order as one string, choosing the
      lexicographically smallest order that fits. If no order fits the given list,
      print `-1`.
    constraints:
      - "1 <= k <= 26"
      - "1 <= n <= 1000"
      - "1 <= length of each word <= 20"
      - "Every letter used is among the first k lowercase letters."
      - "Words may repeat."
    examples:
      - input: |
          5 4
          baa
          abcd
          abca
          cab
          cad
        output: |
          bdac
        explanation: "The pairs give b before a, then d before a (abcd vs abca), a before c and b before d. Only b can start; d must follow it, then a, then c, so the order is bdac."
      - input: |
          2 3
          abc
          ab
        output: |
          -1
        explanation: "ab is a prefix of abc, so a correct dictionary would list ab first. No alphabet order can repair that, hence -1."
    hints:
      - "Two neighbouring words give exactly one piece of information: the first position where they differ orders those two letters, and nothing after that position matters."
      - "A longer word placed before its own prefix is impossible whatever the alphabet - check for it explicitly."
      - "The letters plus the derived 'comes before' pairs form a directed graph; the answer is its topological order, and a min-heap makes it the smallest one."
    explanation: |
      **Turning words into edges — O(total length).** Compare each pair of
      consecutive words. Walk them together until they differ: that single position
      gives one edge `first[pos] -> second[pos]` ("this letter comes first").
      Everything after that position is irrelevant, and everything before it is
      equal, so no other edge can be deduced from the pair. If one word runs out
      first, the pair carries no ordering information at all — unless the earlier
      word is the **longer** one, which is impossible in a sorted list and means the
      answer is `-1`.

      Add each edge at most once (a `set` per node); a repeated pair would otherwise
      inflate the in-degree and stall the algorithm.

      **Topological order — O(k log k + E log k) with `E <= n` edges.** The letters
      are the nodes. A valid alphabet is a topological order of this graph:
      lay the letters out so that every "comes before" edge points forward. Kahn's
      algorithm does it — start with the letters of in-degree `0`, emit one, and
      decrease the in-degree of everything it precedes.

      **Getting the smallest order.** Keep the available letters in a **min-heap**
      and always emit the smallest. Choosing any larger letter would make the result
      lexicographically larger at that position, and choosing the smallest can never
      paint you into a corner, because the rest of the graph is still acyclic.
      A FIFO queue would give a valid but arbitrary order.

      **Two ways to fail.** The prefix violation described above, and a cycle in the
      deduced order (for example `a -> b` from one pair and `b -> a` from another):
      then Kahn emits fewer than `k` letters. Both print `-1`.

      **Brute force — O(k! . n . L).** Try every permutation of the `k` letters in
      lexicographic order and keep the first one under which the whole word list is
      sorted. It is a good cross-check for small `k` and hopeless beyond about
      `k = 9`.

      **Watch out:** letters that never appear in any word still belong to the
      alphabet. They have in-degree `0`, so Kahn emits them as early as their number
      allows — which is exactly what "smallest order" demands.
