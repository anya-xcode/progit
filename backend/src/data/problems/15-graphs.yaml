    slug: articulation-point-in-graph
    title: "Articulation point in graph"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "Other Algorithms"
    tags: [graph, dfs, tarjan, articulation-point]
    sourceUrl: ""
    statement: |
      You are given an **undirected** graph with `n` nodes numbered `0` to `n - 1`
      and `m` edges. The graph may be disconnected, and the edge list may contain
      self-loops and parallel edges.

      A node is an **articulation point** (a cut vertex) when deleting it — together
      with every edge touching it — increases the number of connected components of
      the graph.

      List all the articulation points.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Next `m` lines: two integers `u v`, an undirected edge between `u` and `v`.
    outputFormat: |
      - Line 1: the number of articulation points `k`.
      - Line 2: the `k` node numbers in increasing order, space-separated; print
        `-1` on this line when `k = 0`.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= m <= 2 * 10^5"
      - "0 <= u, v < n"
      - "Self-loops and parallel edges may appear."
    examples:
      - input: |
          5 5
          0 1
          1 2
          2 0
          1 3
          3 4
        output: |
          2
          1 3
        explanation: "Deleting node 1 splits the triangle {0,2} from {3,4}, and deleting node 3 cuts off node 4. Nodes 0, 2 and 4 can all be removed without breaking anything apart."
      - input: |
          4 4
          0 1
          1 2
          2 3
          3 0
        output: |
          0
          -1
        explanation: "In a cycle every node has two routes to the rest, so removing any single node leaves the remaining three still connected."
    hints:
      - "Run a DFS. A node is dangerous when one of its children cannot reach above it without going through it."
      - "With low[child] = the earliest discovery time the child's subtree can reach, a non-root parent is an articulation point when low[child] >= discovery[parent] for some child."
      - "The root of a DFS tree is special: it is an articulation point exactly when it has two or more children in that tree."
    explanation: |
      **Brute force — O(n . (n + m)).** Delete each node in turn and count the
      connected components of what is left; the node is an articulation point when
      the count is larger than for the untouched graph. Slow, but the clearest
      definition and the natural cross-check.

      **Tarjan's algorithm — O(n + m) time, O(n) space.** Run a DFS keeping
      `discovery[node]` (when the node was entered) and

      ```
      low[node] = the smallest discovery time reachable from node's subtree
                  through tree edges plus at most one non-tree edge
      ```

      For a **non-root** node `p` with DFS child `c`, `p` is an articulation point
      exactly when `low[c] >= discovery[p]`: the subtree of `c` cannot climb above
      `p` without passing through `p`, so deleting `p` strands it. Note the `>=`
      here, unlike the strict `>` used for bridges — the child may reach `p` itself
      and `p` is still a cut vertex.

      The **root** has no node above it, so the rule does not apply. It is an
      articulation point exactly when it has **two or more children in the DFS tree**:
      with one child everything hangs below that child and stays connected; with two
      the two subtrees only meet at the root.

      A node can be flagged by several children — use a boolean array so it is
      reported once.

      **Traps.**

      - Skip the edge you arrived by using its **index**, not the parent's number. A
        parallel edge is a genuine second route; treating it as "the parent" would
        turn a safe node into a false articulation point.
      - Self-loops are harmless: they lead to an already discovered node and change
        neither `low` nor the verdict.
      - A disconnected graph needs the DFS restarted from every undiscovered node,
        and the root rule applies separately to each root.
      - Write the DFS iteratively with frames `[node, incoming_edge_id, next_index]`;
        a 10^5-node chain would overflow the recursion limit. Fold a child's `low`
        into its parent's at the moment the child is popped.

      **Relation to bridges.** The two algorithms share the whole `discovery`/`low`
      machinery and differ only in the final comparison (`>` for bridges on the edge,
      `>=` for articulation points on the parent) and in the special root rule.
      Neither one implies the other: a node can be a cut vertex without any incident
      bridge (two cycles sharing a single node).
