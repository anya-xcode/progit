    statement: |
      You are given an undirected weighted graph with `n` nodes numbered `0` to
      `n - 1` and `m` edges. **All edge weights are different**, which means the graph
      has exactly one minimum spanning tree — a set of `n - 1` edges that keeps every
      node connected and whose total weight is as small as possible.

      Print that tree: its total weight and the edges it uses. The edge list may
      contain self-loops and parallel edges (their weights are still all different),
      and the graph may be disconnected, in which case no spanning tree exists.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Next `m` lines: three integers `u v w` — an undirected edge between `u` and
        `v` of weight `w`.
    outputFormat: |
      If the graph is not connected, print `-1` on a single line and nothing else.

      Otherwise:

      - Line 1: the total weight of the minimum spanning tree (`0` when `n = 1`).
      - Next `n - 1` lines: one edge each as `u v w` with `u < v`, sorted by `u` and
        then by `v`.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= m <= 2 * 10^5"
      - "0 <= u, v < n"
      - "1 <= w <= 10^6, and all m weights are pairwise different"
      - "Self-loops and parallel edges may appear."
    examples:
      - input: |
          5 7
          0 1 2
          0 3 6
          1 2 3
          1 3 8
          1 4 5
          2 4 7
          3 4 9
        output: |
          16
          0 1 2
          0 3 6
          1 2 3
          1 4 5
        explanation: "The tree takes 0-1 (2), 1-2 (3), 1-4 (5) and 0-3 (6) for a total of 16. The heavier edges 2-4 (7), 1-3 (8) and 3-4 (9) would each close a cycle."
      - input: |
          4 2
          0 1 1
          2 3 2
        output: |
          -1
        explanation: "Nodes 0 and 1 are in one component and 2 and 3 in another, so no set of edges connects all four."
    hints:
      - "Grow one tree: start anywhere and keep adding the cheapest edge that leaves the tree, because that edge is always safe."
      - "Push candidate edges into a min-heap as (weight, node, parent); a popped entry whose node is already in the tree is stale, so drop it."
      - "If the tree stops growing before it holds n nodes, the graph is disconnected - count the edges you accepted instead of adding a separate check."
    explanation: |
      **The cut property, in one sentence.** Split the nodes into "already in the
      tree" and "not yet". The cheapest edge crossing that split can always be added
      safely. Prim's algorithm is nothing but that sentence in a loop.

      **Prim with a binary heap — O(m log n) time, O(n + m) space.** Mark node `0` as
      the seed and push its incident edges. Repeatedly pop the cheapest entry
      `(w, node, parent)`; if `node` is already in the tree the entry is a leftover,
      so skip it. Otherwise add `node` (and the edge `parent - node`) to the tree and
      push the edges leaving `node`. Each edge is pushed at most twice, so the heap
      holds `O(m)` entries.

      Skipping the stale entries is what keeps the algorithm correct: without that
      check you would add an edge inside the tree and create a cycle.

      **Prim with a linear scan — O(n^2).** Keep `best[v]`, the cheapest edge from
      the tree to `v`, and find the minimum with a scan instead of a heap. Better
      on dense graphs where `m` approaches `n^2`.

      **Kruskal — O(m log m).** Sort all edges by weight and accept an edge whenever
      its endpoints are still in different components, tested with a Disjoint Set
      Union. Same tree here (weights are distinct), and the natural independent
      check. Kruskal also handles the disconnected case gracefully: it simply ends
      with fewer than `n - 1` accepted edges.

      **Why distinct weights matter.** With ties there may be several minimum
      spanning trees, all of the same total weight, so printing "the" edge list would
      not be well defined. Distinct weights force uniqueness (if two spanning trees
      differed, the cheapest edge in only one of them could be swapped in to make the
      other strictly cheaper).

      **Details.** A self-loop is never popped as a useful candidate, because its
      endpoint is already in the tree when the edge is examined. Of several parallel
      edges only the cheapest can ever be accepted. Sorting the chosen edges at the
      end is what makes the output order unique; `n = 1` prints weight `0` and no
      edge lines.
