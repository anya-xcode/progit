    slug: cheapest-flight-within-k-stops
    title: "Cheapest flight within K stops"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "Shortest Path"
    tags: [graph, bellman-ford, shortest-path, dp]
    sourceUrl: "https://leetcode.com/problems/cheapest-flights-within-k-stops/"
    statement: |
      There are `n` cities numbered `0` to `n - 1` and `m` one-way flights; a flight
      `u v w` goes from `u` to `v` and costs `w`. There is at most one flight for any
      ordered pair of cities.

      You want to travel from `src` to `dst` using at most `k` **stops** — a stop is
      an intermediate city where you change planes, so a route with `k` stops uses
      `k + 1` flights. Find the cheapest such route.

      Several different routes may share the cheapest price, so report the route only
      when exactly one route achieves it; otherwise report the price alone.
    inputFormat: |
      - Line 1: five integers `n`, `m`, `src`, `dst` and `k`.
      - Next `m` lines: three integers `u v w` — a one-way flight from `u` to `v`
        costing `w`.
    outputFormat: |
      If `dst` cannot be reached from `src` with at most `k` stops, print `-1` on a
      single line and nothing else.

      Otherwise:

      - Line 1: the cheapest total price (`0` when `src == dst`).
      - Line 2: if exactly one route achieves that price, its cities from `src` to
        `dst` separated by spaces; otherwise the word `MULTIPLE`.
    constraints:
      - "1 <= n <= 300"
      - "0 <= m <= 2000"
      - "0 <= u, v, src, dst < n and u != v"
      - "1 <= w <= 10^4"
      - "0 <= k <= n - 1"
      - "At most one flight exists for each ordered pair (u, v)."
    examples:
      - input: |
          4 5 0 3 1
          0 1 100
          1 2 100
          2 0 100
          1 3 600
          2 3 200
        output: |
          700
          0 1 3
        explanation: "With at most one stop only two-flight routes are allowed. 0-1-3 costs 700; 0-2-3 is impossible because there is no flight 0-2, and 0-1-2-3 (which would cost 400) needs two stops."
      - input: |
          4 4 0 3 1
          0 1 1
          0 2 1
          1 3 1
          2 3 1
        output: |
          2
          MULTIPLE
        explanation: "Both 0-1-3 and 0-2-3 cost 2 and use one stop, so the price is printed but no single route can be named."
    hints:
      - "Dijkstra alone is wrong here: a cheaper route may use too many flights, and the algorithm would settle a city with it and never look back."
      - "Add the number of flights used to the state. Relax the whole edge list once per round, exactly k + 1 rounds, using only the values from the previous round."
      - "Copying the previous round into a fresh array is what stops one round from using two flights; updating in place silently allows extra hops."
    explanation: |
      **Why the straightforward shortest path fails.** Cheapest and "few enough
      flights" pull in different directions: the globally cheapest route to a city may
      use more flights than allowed, and a plain Dijkstra would settle the city with
      that value and discard the pricier-but-shorter alternative.

      **Bellman-Ford by rounds — O(k . m) time, O(n) space.** Let `cost[t][v]` be the
      cheapest way to reach `v` using exactly `t` flights. Round `t` scans all edges
      once and computes `cost[t][v]` from `cost[t-1][u] + w`. After `k + 1` rounds the
      answer is the smallest `cost[t][dst]` over `t = 0 .. k + 1`. The key discipline
      is to read only from the previous round's array while writing the current one;
      relaxing in place would let a single round chain several flights together and
      quietly break the stop limit.

      **Dijkstra on an extended state — O(k . m . log(k . m)).** Put `(cost, stops,
      city)` into the heap and keep the best cost seen per `(city, stops)` pair. It is
      also correct, and faster when `k` is large and the graph is sparse, but it needs
      more bookkeeping. Plain BFS is not an option, because the prices differ.

      **Counting the cheapest routes.** Carry `count[t][v]` alongside the cost, capped
      at `2` — a strictly better relaxation copies `count[t-1][u]`, an equal one adds
      to it. At the end, add up the counts of every `t` whose `cost[t][dst]` equals
      the best price; different `t` values are different routes, so they must all be
      summed. Cap the sum at `2` as well: the only question is "one or many".

      Because all prices are at least `1`, a cheapest route never revisits a city —
      cutting the detour out would be strictly cheaper and use fewer flights — so
      every route counted is a genuine sequence of distinct cities.

      **Rebuilding.** Store `came[t][v]`, the predecessor that produced the strict
      improvement. When the total count is `1`, follow `came` backwards from
      `(chosen_t, dst)` exactly `chosen_t` times and reverse.

      **Edge cases.** `src == dst` gives price `0` with the one-city route, and `k = 0`
      allows only direct flights.
