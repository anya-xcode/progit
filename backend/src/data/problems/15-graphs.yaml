  - slug: number-of-islands
    title: "Number of Islands"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "BFS/DFS"
    tags: [graph, dfs, bfs, matrix]
    sourceUrl: "https://leetcode.com/problems/number-of-islands/"
    statement: |
      A map is given as a grid of characters where `1` is land and `0` is water. An
      **island** is a maximal group of land cells connected **horizontally or
      vertically** (diagonal contact does not count). Everything outside the grid
      is water.

      Count the islands.
    inputFormat: |
      - Line 1: two integers `rows` and `cols`.
      - Next `rows` lines: a string of exactly `cols` characters, each `0` or `1` (no spaces).
    outputFormat: |
      Print the number of islands.
    constraints:
      - "1 <= rows, cols <= 100"
      - "rows * cols <= 3000"
      - "Every character is 0 or 1"
    examples:
      - input: |
          4 5
          11000
          11011
          00010
          00001
        output: |
          3
        explanation: "The 2×2 block at the top-left is one island, the three cells around column 3–4 in rows 1–2 are another, and the bottom-right cell only touches them diagonally, so it is a third."
      - input: |
          3 3
          010
          111
          010
        output: |
          1
        explanation: "All five land cells form a plus shape connected through the centre."
    hints:
      - "Treat each land cell as a node connected to its four neighbours."
      - "Whenever you find unvisited land, count a new island and mark its whole component as visited with BFS or DFS."
