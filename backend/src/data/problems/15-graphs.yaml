    referenceSolution:
      python: |
        import sys
        from typing import List


        def has_cycle_directed(n: int, adj: List[List[int]]) -> bool:
            state = [0] * n  # 0 = unvisited, 1 = on the current path, 2 = finished
            for start in range(n):
                if state[start]:
                    continue
                state[start] = 1
                stack = [(start, 0)]
                while stack:
                    node, index = stack[-1]
                    if index < len(adj[node]):
                        stack[-1] = (node, index + 1)
                        nxt = adj[node][index]
                        if state[nxt] == 1:
                            return True
                        if state[nxt] == 0:
                            state[nxt] = 1
                            stack.append((nxt, 0))
                    else:
                        state[node] = 2
                        stack.pop()
            return False


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            adj: List[List[int]] = [[] for _ in range(n)]
            for i in range(m):
                u, v = int(data[2 + 2 * i]), int(data[3 + 2 * i])
                adj[u].append(v)
            print("true" if has_cycle_directed(n, adj) else "false")


        if __name__ == "__main__":
            main()
