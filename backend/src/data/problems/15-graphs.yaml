    statement: |
      An office has `n` computers numbered `0` to `n - 1` wired together by `m`
      cables; a cable `u v` joins computers `u` and `v` directly. Computers are
      connected when a chain of cables joins them.

      In one **operation** you may unplug any cable and plug it back between any two
      computers you like. Find the fewest operations needed to make **all** `n`
      computers connected to each other, or report that it cannot be done.

      The cable list may contain duplicates (two cables between the same pair) and
      cables with both ends on the same computer.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Next `m` lines: two integers `u v`, a cable joining `u` and `v`.
    outputFormat: |
      Print the minimum number of operations, or `-1` if the computers cannot all be
      connected.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= m <= 2 * 10^5"
      - "0 <= u, v < n"
      - "Duplicate cables and cables with u == v may appear."
    examples:
      - input: |
          6 6
          0 1
          0 2
          1 2
          3 4
          3 5
          4 5
        output: |
          1
        explanation: "The computers form two triangles. Each triangle has one cable more than it needs, so unplugging one of them and using it to join the two triangles is enough: one operation."
      - input: |
          5 3
          0 1
          1 2
          2 3
        output: |
          -1
        explanation: "Four computers are already chained together but computer 4 is isolated, and only three cables exist for five computers. Connecting n computers always needs at least n - 1 cables, so it is impossible."
    hints:
      - "Connecting n computers needs at least n - 1 cables no matter how they are arranged - check that first."
      - "A cable whose two ends are already connected is spare; every spare cable can be moved somewhere useful."
      - "With c connected groups you need exactly c - 1 cables to chain them, and there are always enough spare ones once m >= n - 1."
    explanation: |
      **Counting argument.** Any connected arrangement of `n` computers uses at least
      `n - 1` cables, so if `m < n - 1` the answer is `-1` immediately — no amount of
      rewiring helps.

      Otherwise, let `c` be the number of connected groups the current cables
      produce. Each operation can merge at most two groups, so at least `c - 1`
      operations are needed. And `c - 1` are always enough: a group with `k`
      computers uses at least `k - 1` cables, so the total "necessary" count is
      `n - c`, leaving `m - (n - c) >= c - 1` spare cables — exactly the ones whose
      endpoints were already connected. So the answer is `c - 1`.

      **Disjoint Set Union — O(n + m . alpha(n)) time, O(n) space.** Start with `n`
      groups. For each cable, if its endpoints are already in the same set the cable
      is spare; otherwise union them and drop the group count by one. Union by size
      plus path compression makes each operation effectively constant. A self-loop
      always finds the same root, so it is counted as spare; duplicate cables are
      handled the same way.

      **BFS / DFS — O(n + m).** Building the adjacency lists and flooding from every
      unvisited computer counts the groups just as well, in the same linear time. DSU
      is preferred when the cables arrive one at a time or when the same structure is
      needed for a later merge.

      **Edge cases.** `n = 1` needs zero operations (one computer is already a
      connected network, even with `m = 0`). A graph that is already connected gives
      `c = 1` and answer `0`.
