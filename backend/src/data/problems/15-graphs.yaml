      python: |
        import sys
        from typing import List, Tuple


        def cheapest_route(n: int, flights: List[Tuple[int, int, int]], src: int, dst: int, k: int) -> Tuple[int, List[int]]:
            inf = float("inf")
            hops = k + 1
            cost = [[inf] * n for _ in range(hops + 1)]
            count = [[0] * n for _ in range(hops + 1)]
            came = [[-1] * n for _ in range(hops + 1)]
            cost[0][src] = 0
            count[0][src] = 1
            for t in range(1, hops + 1):
                previous, current = cost[t - 1], cost[t]
                for u, v, w in flights:
                    if previous[u] == inf:
                        continue
                    candidate = previous[u] + w
                    if candidate < current[v]:
                        current[v] = candidate
                        count[t][v] = count[t - 1][u]
                        came[t][v] = u
                    elif candidate == current[v]:
                        count[t][v] = min(2, count[t][v] + count[t - 1][u])
            best = min(cost[t][dst] for t in range(hops + 1))
            if best == inf:
                return -1, []
            total = 0
            chosen = -1
            for t in range(hops + 1):
                if cost[t][dst] == best:
                    total = min(2, total + count[t][dst])
                    if chosen == -1:
                        chosen = t
            if total != 1:
                return int(best), []
            route = [dst]
            node, t = dst, chosen
            while t > 0:
                node = came[t][node]
                route.append(node)
                t -= 1
            route.reverse()
            return int(best), route


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            src, dst, k = int(data[2]), int(data[3]), int(data[4])
            flights: List[Tuple[int, int, int]] = []
            for i in range(m):
                u = int(data[5 + 3 * i])
                v = int(data[6 + 3 * i])
                w = int(data[7 + 3 * i])
                flights.append((u, v, w))
            price, route = cheapest_route(n, flights, src, dst, k)
            if price < 0:
                print(-1)
            else:
                print(price)
                print(" ".join(map(str, route)) if route else "MULTIPLE")


        if __name__ == "__main__":
            main()
