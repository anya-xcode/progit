    referenceSolution:
      python: |
        import sys
        from typing import List, Tuple


        def find_bridges(n: int, adj: List[List[Tuple[int, int]]]) -> List[Tuple[int, int]]:
            discovery = [-1] * n
            low = [0] * n
            timer = 0
            bridges: List[Tuple[int, int]] = []
            for start in range(n):
                if discovery[start] != -1:
                    continue
                discovery[start] = low[start] = timer
                timer += 1
                stack = [[start, -1, 0]]
                while stack:
                    frame = stack[-1]
                    node, came_by, index = frame[0], frame[1], frame[2]
                    if index < len(adj[node]):
                        frame[2] = index + 1
                        nxt, edge_id = adj[node][index]
                        if edge_id == came_by:
                            continue
                        if discovery[nxt] == -1:
                            discovery[nxt] = low[nxt] = timer
                            timer += 1
                            stack.append([nxt, edge_id, 0])
                        elif discovery[nxt] < low[node]:
                            low[node] = discovery[nxt]
                    else:
                        stack.pop()
                        if stack:
                            parent = stack[-1][0]
                            if low[node] < low[parent]:
                                low[parent] = low[node]
                            if low[node] > discovery[parent]:
                                bridges.append((min(parent, node), max(parent, node)))
            bridges.sort()
            return bridges


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            adj: List[List[Tuple[int, int]]] = [[] for _ in range(n)]
            for i in range(m):
                u, v = int(data[2 + 2 * i]), int(data[3 + 2 * i])
                adj[u].append((v, i))
                adj[v].append((u, i))
            bridges = find_bridges(n, adj)
            out = [str(len(bridges))]
            for u, v in bridges:
                out.append("%d %d" % (u, v))
            print("\n".join(out))


        if __name__ == "__main__":
            main()
