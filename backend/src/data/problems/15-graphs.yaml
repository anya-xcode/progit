    sourceUrl: "https://leetcode.com/problems/accounts-merge/"
    statement: |
      You are given `n` account records. Each record holds a person's name followed
      by one or more email addresses.

      Two records belong to the **same person** when they share at least one email
      address. The relation spreads: if record A shares an email with B and B shares
      a different email with C, then all three belong to the same person. Two records
      with the same name but no shared email belong to different people — names are
      not unique.

      Merge the records that belong to the same person and print the result.
    inputFormat: |
      - Line 1: an integer `n`, the number of records.
      - Next `n` lines: a name followed by one or more email addresses, separated by
        single spaces. Names and emails contain no spaces. The same email may appear
        more than once inside one record.
    outputFormat: |
      Print one line per merged person: the name, then that person's **distinct**
      email addresses in increasing lexicographic order, separated by single spaces.

      Sort the printed lines themselves in increasing lexicographic order, comparing
      each whole line character by character.
    constraints:
      - "1 <= n <= 1000"
      - "1 <= emails in one record <= 10"
      - "Names and emails are non-empty strings of at most 30 printable characters with no spaces."
      - "Records sharing an email always carry the same name."
    examples:
      - input: |
          4
          John johnsmith@mail.com john_newyork@mail.com
          John johnsmith@mail.com john00@mail.com
          Mary mary@mail.com
          John johnnybravo@mail.com
        output: |
          John john00@mail.com john_newyork@mail.com johnsmith@mail.com
          John johnnybravo@mail.com
          Mary mary@mail.com
        explanation: "The first two records share johnsmith@mail.com, so they merge into one person with three emails. The third John shares nothing, so he stays separate, and Mary is untouched."
      - input: |
          3
          Alex alex@a.com
          Alex alex@b.com
          Bob bob@a.com bob@b.com
        output: |
          Alex alex@a.com
          Alex alex@b.com
          Bob bob@a.com bob@b.com
        explanation: "The two Alex records share no email, so they are two different people despite the identical name. Bob's emails only look similar - an email counts only when it is exactly the same string."
    hints:
      - "Comparing every pair of records costs O(n^2) email-set intersections; think about what an email itself can tell you."
      - "Keep a map from an email to the first record that contained it. Meeting that email again tells you exactly which two records to merge."
      - "After all the merging, gather the emails by the representative of their record, sort each list, then sort the finished lines."
    explanation: |
      **Brute force — O(n^2 . L).** Compare every pair of records, join those with a
      common email, then flood the resulting graph. Correct but quadratic in the
      number of records.

      **Disjoint Set Union over records — O(N . alpha(N)) plus sorting, where `N` is
      the total number of emails.** Two passes:

      1. Walk every record and every email in it, keeping a dictionary
         `owner[email] = index of the first record that contained it`. If the email
         is already there, `union` the current record with that one; otherwise store
         it. Each email is looked at once, so the merging is effectively linear.
      2. Walk `owner` again and bucket every email under `find(index)`, the
         representative of the merged person.

      The dictionary is what removes the quadratic factor: instead of asking "which
      other record shares an email with me?", each email answers "which record was I
      seen in first?".

      **Producing the output.** Every record inside a group carries the same name, so
      the representative's name can be used for the whole group. Sorting each email
      list costs `O(k log k)` for a group of `k` emails, and sorting the finished
      lines costs `O(G log G . L)` — together `O(N log N)` in the worst case. Both
      sorts are what make the answer unique: without them the order would depend on
      dictionary iteration order.

      Duplicate emails inside one record are handled for free: the second occurrence
      finds the record itself as the owner, and the union is a no-op. Bucketing from
      `owner` (not from the raw records) guarantees each email is printed once.

      **BFS / DFS alternative — O(N).** Build a graph whose nodes are emails, joining
      the first email of each record to all the others, then flood it. Each connected
      group is one person. Same complexity; DSU avoids materialising the adjacency
      lists.
