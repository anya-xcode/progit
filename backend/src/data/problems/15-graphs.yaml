    referenceSolution:
      python: |
        import sys
        from collections import deque
        from typing import List


        def eventual_safe_nodes(n: int, adj: List[List[int]]) -> List[int]:
            reverse: List[List[int]] = [[] for _ in range(n)]
            outdegree = [0] * n
            for u in range(n):
                for v in adj[u]:
                    reverse[v].append(u)
                    outdegree[u] += 1
            queue = deque(node for node in range(n) if outdegree[node] == 0)
            safe = [False] * n
            for node in queue:
                safe[node] = True
            while queue:
                node = queue.popleft()
                for previous in reverse[node]:
                    outdegree[previous] -= 1
                    if outdegree[previous] == 0:
                        safe[previous] = True
                        queue.append(previous)
            return [node for node in range(n) if safe[node]]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            adj: List[List[int]] = [[] for _ in range(n)]
            for i in range(m):
                u, v = int(data[2 + 2 * i]), int(data[3 + 2 * i])
                adj[u].append(v)
            safe = eventual_safe_nodes(n, adj)
            print(" ".join(map(str, safe)) if safe else -1)


        if __name__ == "__main__":
            main()
