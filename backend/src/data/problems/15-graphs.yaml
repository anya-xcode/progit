    tags: [graph, dsu, union-find, matrix]
    sourceUrl: "https://leetcode.com/problems/number-of-islands-ii/"
    statement: |
      A `rows x cols` grid starts as all water. You then perform `q` operations; each
      operation names a cell and turns it into land. A cell that is already land is
      left unchanged.

      An **island** is a maximal group of land cells connected horizontally or
      vertically (diagonals do not count).

      After **each** operation, report how many islands the grid contains.
    inputFormat: |
      - Line 1: three integers `rows`, `cols` and `q`.
      - Next `q` lines: two integers `r c`, the cell turned into land.
    outputFormat: |
      Print `q` space-separated integers: the number of islands after each operation,
      in order.
    constraints:
      - "1 <= rows, cols <= 300"
      - "1 <= q <= 10^4"
      - "0 <= r < rows and 0 <= c < cols"
      - "An operation may repeat a cell that is already land."
    examples:
      - input: |
          3 3 4
          0 0
          0 1
          1 2
          2 1
        output: |
          1 1 2 3
        explanation: "After (0,0) there is one island; (0,1) touches it, so still one. (1,2) is on its own, making two, and (2,1) is a third separate island."
      - input: |
          2 2 4
          0 0
          0 0
          1 1
          0 1
        output: |
          1 1 2 1
        explanation: "The second operation repeats (0,0) and changes nothing. Adding (1,1) makes two islands, and (0,1) then touches both of them, merging everything into one."
    hints:
      - "Re-flooding the whole grid after every operation costs O(q . rows . cols); the grid only ever gains land, so think about maintaining the count instead."
      - "A new land cell first adds one island; then each neighbouring island it joins removes one."
      - "Careful with two neighbours that already belong to the same island - only a successful union may decrease the count."
    explanation: |
      **Brute force — O(q . rows . cols).** Re-run a flood fill over the whole grid
      after every operation. Easy to get right, and a good cross-check, but far too
      slow at the limits.

      **Disjoint Set Union, adding land incrementally — O(q . alpha) time,
      O(rows . cols) space.** Land is only ever added, never removed, which is
      exactly the situation DSU handles. Number cell `(r, c)` as `r * cols + c` and
      keep `parent[cell] = -1` for water.

      For each operation:

      1. If the cell is already land, the count is unchanged — print it and move on.
         Forgetting this makes repeated operations inflate the answer.
      2. Otherwise create the cell as its own set and add `1` to the island count.
      3. For each of the four neighbours that is land, union it with the new cell.
         **Only a successful union** (different roots) decreases the count by `1`: a
         cell can touch two neighbours that already belong to the same island, and
         counting that twice is the classic bug.

      Union by size with path compression keeps every operation effectively constant,
      so the whole sequence is linear in `q` plus the grid allocation.

      **Why DSU and not BFS.** BFS answers "what is connected *now*" from scratch;
      DSU carries the answer forward, and merging two islands is a single pointer
      write. The moment the problem says "after each operation", DSU is the tool —
      the same pattern drives *Making a large island* and *Swim in rising water*.

      **Note.** Deletions would break this approach: path compression makes a union
      impossible to undo. Problems that remove land have to be processed backwards in
      time, turning removals into additions.
