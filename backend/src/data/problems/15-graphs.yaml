  - slug: word-ladder
    title: "Word Ladder"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "Hard Problems"
    tags: [graph, bfs, string, hashing]
    sourceUrl: "https://leetcode.com/problems/word-ladder/"
    statement: |
      You are given a start word `begin`, a target word `end` and a dictionary of
      words. All words have the same length and use lowercase English letters.

      A **ladder** is a sequence of words that starts with `begin` and ends with
      `end`, where every consecutive pair differs in **exactly one** position and
      every word after `begin` belongs to the dictionary. (`begin` itself does not
      need to be in the dictionary.)

      Print the number of words in the **shortest** ladder, or `0` if no ladder
      exists — in particular, when `end` is not in the dictionary.
    inputFormat: |
      - Line 1: two words, `begin` and `end` (`begin != end`).
      - Line 2: an integer `n`, the dictionary size.
      - Line 3: `n` space-separated distinct words.
    outputFormat: |
      Print the number of words in the shortest ladder, or `0` if none exists.
    constraints:
      - "1 <= word length <= 10"
      - "1 <= n <= 5000"
      - "All words have the same length and consist of lowercase letters"
      - "begin != end; dictionary words are distinct"
    examples:
      - input: |
          cold warm
          5
          cord card ward warm worm
        output: |
          5
        explanation: "cold → cord → card → ward → warm changes one letter at a time and uses 5 words; no shorter ladder exists."
      - input: |
          lead gold
          2
          load goad
        output: |
          0
        explanation: "The target gold is not in the dictionary, so it can never be reached."
    hints:
      - "Treat words as nodes, with an edge between words that differ in exactly one letter. You need the shortest path."
      - "Comparing every pair of words costs O(n² · L). Instead, try replacing each position of the current word with 'a'..'z' and look the result up in a set."
      - "Run BFS from begin, counting words; remove a word from the set when it is first reached so it is never enqueued twice."
    explanation: |
      **BFS with pairwise comparison — O(n² · L) time, O(n) space.** Build edges by
      comparing every pair of words (including `begin`), then BFS from `begin`.
      The BFS level at which `end` is reached, plus one, is the answer.

      **BFS with letter substitution — O(n · L · 26) time, O(n · L) space.** Put the
      dictionary in a hash set. BFS from `begin` with distance 1. For the current
      word, try every position and every letter; if the resulting word is in the
      set, it is a neighbour: remove it from the set (marks it visited) and enqueue
      it with distance + 1. Return the distance when `end` is dequeued or
      generated, or `0` when the queue empties. Each substitution also costs
      `O(L)` to build and hash the string.

      **Bidirectional BFS.** Expanding alternately from `begin` and `end` (always the
      smaller frontier) greatly reduces the number of explored words in practice,
      with the same worst-case bound.
    starterCode:
      python: |
        import sys
        from typing import List


        def ladder_length(begin: str, end: str, words: List[str]) -> int:
            # Return the number of words in the shortest ladder, or 0.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            begin, end = data[0], data[1]
            n = int(data[2])
            words = data[3:3 + n]
            print(ladder_length(begin, end, words))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from collections import deque
        from typing import List


        def ladder_length(begin: str, end: str, words: List[str]) -> int:
            remaining = set(words)
            if end not in remaining:
                return 0
            remaining.discard(begin)
            queue = deque([(begin, 1)])
            letters = "abcdefghijklmnopqrstuvwxyz"
            while queue:
                word, steps = queue.popleft()
                chars = list(word)
                for i, original in enumerate(chars):
                    for letter in letters:
                        if letter == original:
                            continue
                        chars[i] = letter
                        candidate = "".join(chars)
                        if candidate in remaining:
                            if candidate == end:
                                return steps + 1
                            remaining.remove(candidate)
                            queue.append((candidate, steps + 1))
                    chars[i] = original
            return 0


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            begin, end = data[0], data[1]
            n = int(data[2])
            words = data[3:3 + n]
            print(ladder_length(begin, end, words))


        if __name__ == "__main__":
            main()
