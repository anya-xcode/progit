        from collections import deque
        from typing import List, Tuple

        MOD = 100000


        def minimum_multiplications(multipliers: List[int], start: int, end: int) -> Tuple[int, List[int]]:
            # Return (steps, chain of values). Use -1 and [] when end is unreachable,
            # and [] as the chain when several shortest chains exist.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            multipliers = [int(x) for x in data[1:1 + n]]
            start, end = int(data[1 + n]), int(data[2 + n])
            steps, chain = minimum_multiplications(multipliers, start, end)
            if steps < 0:
                print(-1)
            else:
                print(steps)
                print(" ".join(map(str, chain)) if chain else "MULTIPLE")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from collections import deque
        from typing import List, Tuple

        MOD = 100000


        def minimum_multiplications(multipliers: List[int], start: int, end: int) -> Tuple[int, List[int]]:
            steps = [-1] * MOD
            ways = [0] * MOD
            came = [-1] * MOD
            steps[start] = 0
            ways[start] = 1
            queue = deque([start])
            while queue:
                value = queue.popleft()
                if steps[end] != -1 and steps[value] >= steps[end]:
                    break
                reachable = set()
                for factor in multipliers:
                    reachable.add(value * factor % MOD)
                for nxt in reachable:
                    if steps[nxt] == -1:
                        steps[nxt] = steps[value] + 1
                        ways[nxt] = ways[value]
                        came[nxt] = value
                        queue.append(nxt)
                    elif steps[nxt] == steps[value] + 1:
                        ways[nxt] = min(2, ways[nxt] + ways[value])
            if steps[end] == -1:
                return -1, []
            if ways[end] != 1:
                return steps[end], []
            chain = [end]
            value = end
            while value != start:
                value = came[value]
                chain.append(value)
            chain.reverse()
            return steps[end], chain


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            multipliers = [int(x) for x in data[1:1 + n]]
            start, end = int(data[1 + n]), int(data[2 + n])
            steps, chain = minimum_multiplications(multipliers, start, end)
            if steps < 0:
                print(-1)
            else:
                print(steps)
                print(" ".join(map(str, chain)) if chain else "MULTIPLE")


        if __name__ == "__main__":
            main()
