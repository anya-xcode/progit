      python: |
        import sys
        from typing import List


        def component_sizes(grid: List[List[int]]) -> List[int]:
            rows, cols = len(grid), len(grid[0]) if grid else 0
            seen = [[False] * cols for _ in range(rows)]
            sizes: List[int] = []
            for sr in range(rows):
                for sc in range(cols):
                    if grid[sr][sc] != 1 or seen[sr][sc]:
                        continue
                    seen[sr][sc] = True
                    stack = [(sr, sc)]
                    size = 0
                    while stack:
                        r, c = stack.pop()
                        size += 1
                        for dr in (-1, 0, 1):
                            for dc in (-1, 0, 1):
                                if dr == 0 and dc == 0:
                                    continue
                                nr, nc = r + dr, c + dc
                                if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 1 and not seen[nr][nc]:
                                    seen[nr][nc] = True
                                    stack.append((nr, nc))
                    sizes.append(size)
            sizes.sort(reverse=True)
            return sizes


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            rows, cols = int(data[0]), int(data[1])
            grid = [[int(x) for x in data[2 + r * cols:2 + (r + 1) * cols]] for r in range(rows)]
            sizes = component_sizes(grid)
            print(len(sizes))
            print(" ".join(map(str, sizes)))


        if __name__ == "__main__":
            main()
