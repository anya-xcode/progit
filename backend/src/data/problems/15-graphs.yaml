    slug: word-ladder-ii
    title: "Word ladder II"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "BFS/DFS"
    tags: [graph, bfs, string, backtracking]
    sourceUrl: "https://leetcode.com/problems/word-ladder-ii/"
    statement: |
      You are given two different words `begin` and `end` of the same length, and a
      dictionary of `count` distinct words of that same length. All words use
      lowercase English letters only.

      A **ladder** is a sequence of words that

      - starts with `begin` and ends with `end`,
      - changes **exactly one letter** between consecutive words, and
      - has every word after the first one present in the dictionary (`begin` itself
        does not have to be in the dictionary).

      Report **all the shortest** ladders — every ladder that uses the minimum
      possible number of words.
    inputFormat: |
      - Line 1: the two words `begin` and `end` (`begin != end`).
      - Line 2: an integer `count`, the size of the dictionary.
      - Line 3: `count` space-separated distinct words.
    outputFormat: |
      If no ladder exists, print `-1`.

      Otherwise print one ladder per line, its words separated by single spaces, and
      order the lines **lexicographically**: compare two ladders word by word and put
      first the one whose first differing word is smaller.
    constraints:
      - "1 <= count <= 500"
      - "1 <= word length <= 8, all words have the same length"
      - "Words contain lowercase English letters only; the dictionary has no duplicates."
      - "The total number of shortest ladders is at most 200."
    examples:
      - input: |
          hit cog
          6
          hot dot dog lot log cog
        output: |
          hit hot dot dog cog
          hit hot lot log cog
        explanation: "The shortest ladders use five words. Two of them exist: hit-hot-dot-dog-cog and hit-hot-lot-log-cog. They agree on the first two words and differ at the third, where dot comes before lot."
      - input: |
          hit cog
          5
          hot dot dog lot log
        output: |
          -1
        explanation: "cog is missing from the dictionary, so the last step can never be taken and no ladder exists."
    hints:
      - "Shortest means BFS. Explore the dictionary one whole level at a time so every word gets its true distance from begin."
      - "A word may be reachable from several words of the previous level - keep a list of predecessors for it, not just one."
      - "Once end is reached, stop expanding further levels and walk backwards through the predecessor lists to build every ladder; then sort the ladders."
    explanation: |
      **Why plain BFS is not enough.** Ordinary BFS keeps one parent per node and so
      recovers one shortest path. Here every shortest path is wanted, so the search
      has to keep the whole *shortest-path DAG*.

      **Brute force — exponential.** Enumerate all sequences of words with a DFS and
      keep the shortest ones. Even a small dictionary explodes, because a word of
      length `L` has `25L` possible one-letter neighbours at every step.

      **Level-by-level BFS + backtracking — O(count . L . 26 . L) time for the
      search.** Process the queue one level at a time and keep `depth[word]`:

      - a neighbour seen for the first time gets `depth = current + 1` and starts a
        predecessor list holding the word we came from;
      - a neighbour already recorded **at this same level** gets the current word
        appended to its predecessor list;
      - a neighbour from an earlier level is ignored — it can only lengthen a ladder.

      Stop as soon as `end` appears in a level; anything deeper cannot be shortest.
      Generating the neighbours of a word costs `O(L . 26)` string builds of length
      `L`, and each dictionary word is expanded once.

      **Rebuilding the ladders.** Walk backwards from `end` through the predecessor
      lists with an explicit stack, carrying the partial ladder; every time you reach
      `begin` you have a complete ladder, which you reverse. The work is proportional
      to the total length of the output, which is why the statement caps the number
      of ladders.

      **Alternatives.** Bidirectional BFS (alternately expanding from `begin` and
      from `end`, always the smaller frontier) cuts the explored set dramatically for
      long ladders, at the price of trickier bookkeeping for the predecessor lists.
      Pre-building buckets like `h*t` gives another way to find neighbours, which
      pays off when the alphabet is large relative to the dictionary.

      **Sorting** the finished list costs `O(K . L)` per comparison for `K` ladders
      and is what makes the answer unique.
