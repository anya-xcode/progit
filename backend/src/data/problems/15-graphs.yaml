    title: "Cycle Detection in Undirected Graph (bfs)"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "BFS/DFS"
    tags: [graph, bfs, cycle]
    sourceUrl: ""
    statement: |
      You are given an **undirected** graph with `n` nodes numbered `0` to `n - 1`
      and `m` edges. The graph may be disconnected, the same pair of nodes may be
      joined by several edges, and an edge may join a node to itself.

      A connected component is called **cyclic** when you can start at one of its
      nodes, walk along edges without ever using the same edge twice, and come back
      to where you started. In particular:

      - a self-loop `u u` is a cycle on its own, and
      - two parallel edges between `u` and `v` form a cycle of length two.

      Count the cyclic components.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Next `m` lines: two integers `u v`, an undirected edge between `u` and `v`.
    outputFormat: |
      Print one integer: the number of connected components that contain at least
      one cycle.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= m <= 2 * 10^5"
      - "0 <= u, v < n"
      - "Self-loops and repeated edges may appear."
    examples:
      - input: |
          8 7
          0 1
          1 2
          2 0
          3 4
          4 5
          6 7
          7 6
        output: |
          2
        explanation: "Component {0,1,2} is a triangle, component {3,4,5} is a path with no cycle, and component {6,7} is joined by two parallel edges, which already forms a cycle. Two components are cyclic."
      - input: |
          5 3
          0 1
          1 2
          3 4
        output: |
          0
        explanation: "Both components are simple paths (a tree each), so no component contains a cycle."
    hints:
      - "BFS every component. Along with each queued node, remember which edge you arrived by."
      - "Meeting an already visited node through an edge you did not arrive by means that node has two different routes from the start - a cycle."
      - "Remembering the parent *node* instead of the parent *edge* misclassifies parallel edges and self-loops; the edge index does not."
    explanation: |
      **The idea.** Run a BFS on each component. The BFS tree records one route from
      the start node to every node. If while scanning a node's edges you find a
      neighbour that is already visited, that neighbour is reachable by a second,
      different route, so the component contains a cycle.

      **Getting the "do not go back" rule right — O(n + m) time, O(n) space.** The
      textbook version stores the *parent node* and skips it. That breaks on the two
      irregular inputs this problem allows:

      - a self-loop `u u` makes `u` its own neighbour, and `u` is never its own
        parent, so it must be, and is, reported as a cycle;
      - two parallel edges `u v` look like "go to the parent", so the parent-node
        rule silently skips a real cycle.

      Storing the **edge index** you arrived by fixes both: skip only that exact
      edge, and any other edge leading to a visited node is genuine evidence of a
      cycle. Queue entries become `(node, edge_id)`.

      Do not stop the BFS at the first cycle you see — finish the component so that
      every node of it is marked, then move on to the next unvisited start node and
      count how many components raised the flag.

      **Counting check — O(n + m).** A component with `k` nodes and `e` edges (all
      copies counted) is a tree exactly when `e = k - 1`; it contains a cycle exactly
      when `e >= k`. Computing the node and edge totals per component with the same
      BFS gives an independent way to verify the answer.

      **Disjoint Set Union — O(n + m . alpha(n)).** Union the endpoints of every
      edge; an edge whose endpoints already share a root closes a cycle, so mark that
      root's component. At the end count the distinct marked roots. Same result, no
      traversal.
