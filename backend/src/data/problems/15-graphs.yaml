        import sys
        from typing import List


        def largest_island(grid: List[List[int]]) -> int:
            n = len(grid)
            parent = list(range(n * n))
            size = [1] * (n * n)

            def find(x: int) -> int:
                root = x
                while parent[root] != root:
                    root = parent[root]
                while parent[x] != root:
                    parent[x], x = root, parent[x]
                return root

            def union(a: int, b: int) -> None:
                ra, rb = find(a), find(b)
                if ra == rb:
                    return
                if size[ra] < size[rb]:
                    ra, rb = rb, ra
                parent[rb] = ra
                size[ra] += size[rb]

            for r in range(n):
                for c in range(n):
                    if grid[r][c] != 1:
                        continue
                    for dr, dc in ((1, 0), (0, 1)):
                        nr, nc = r + dr, c + dc
                        if nr < n and nc < n and grid[nr][nc] == 1:
                            union(r * n + c, nr * n + nc)

            best = 0
            for r in range(n):
                for c in range(n):
                    if grid[r][c] == 1:
                        best = max(best, size[find(r * n + c)])

            for r in range(n):
                for c in range(n):
                    if grid[r][c] != 0:
                        continue
                    roots = set()
                    for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                        nr, nc = r + dr, c + dc
                        if 0 <= nr < n and 0 <= nc < n and grid[nr][nc] == 1:
                            roots.add(find(nr * n + nc))
                    best = max(best, 1 + sum(size[root] for root in roots))
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            grid = [[int(x) for x in data[1 + r * n:1 + (r + 1) * n]] for r in range(n)]
            print(largest_island(grid))


        if __name__ == "__main__":
            main()
