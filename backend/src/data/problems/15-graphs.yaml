    slug: making-a-large-island
    title: "Making a large island"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "MST/Disjoint Set"
    tags: [graph, dsu, union-find, matrix]
    sourceUrl: "https://leetcode.com/problems/making-a-large-island/"
    statement: |
      You are given an `n x n` binary grid where `1` is land and `0` is water. An
      **island** is a maximal group of land cells joined horizontally or vertically
      (diagonals do not count), and its size is the number of cells in it.

      You may change **at most one** `0` into a `1`. Report the size of the largest
      island you can end up with.
    inputFormat: |
      - Line 1: an integer `n`.
      - Next `n` lines: `n` values (`0` or `1`), the grid rows.
    outputFormat: |
      Print one integer: the largest possible island size.
    constraints:
      - "1 <= n <= 100"
      - "grid[r][c] is 0 or 1"
    examples:
      - input: |
          3
          1 0 1
          0 0 0
          1 0 1
        output: |
          3
        explanation: "The four corners are islands of size 1. Filling the centre (1,1) touches none of them - it only has water neighbours - but filling, say, (0,1) joins the two top corners into an island of size 3."
      - input: |
          2
          1 1
          1 0
        output: |
          4
        explanation: "Filling the single 0 joins everything into one island covering all four cells."
    hints:
      - "Flooding the grid again for every candidate 0 costs O(n^4); label the islands once instead."
      - "Give every island an id and remember its size; then a candidate 0 is worth 1 plus the sizes of the distinct islands around it."
      - "Two of the four neighbours can belong to the same island - put the ids in a set before adding the sizes, or you will double count."
    explanation: |
      **Brute force — O(n^4).** Flip each `0` in turn and re-run a flood fill.
      Correct, and exactly what you want as a cross-check, but with `n = 100` that is
      10^8 cell visits.

      **Label once, then evaluate each candidate — O(n^2) time, O(n^2) space.**

      1. **Label.** Union every land cell with its land neighbours (checking only
         right and down is enough, since each pair is then seen once), keeping the
         size of each set. A plain BFS/DFS labelling with an `id` per island and a
         `size[id]` table does the same job.
      2. **Baseline.** The answer is at least the largest existing island — needed
         for the grid that has no `0` at all.
      3. **Evaluate.** For each water cell, collect the **distinct** island
         representatives among its four neighbours and add up their sizes, plus `1`
         for the cell itself. Putting the representatives in a set is essential: a
         single `0` can have two or three neighbours belonging to the same island,
         and adding that island's size twice inflates the answer.

      Both phases touch every cell a constant number of times, and DSU operations
      cost `O(alpha)` each, so the total is linear in the number of cells.

      **Edge cases worth testing.** A grid of all `1`s (no `0` to flip — the answer
      is `n^2`, which is why the baseline step exists), a grid of all `0`s (the
      answer is `1`), and `n = 1`.
    starterCode:
      python: |
        import sys
        from typing import List


        def largest_island(grid: List[List[int]]) -> int:
            # Turning at most one 0 into a 1, return the size of the largest island
            # of 1s connected up/down/left/right.
            pass


