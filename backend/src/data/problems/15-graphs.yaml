      python: |
        import heapq
        import sys
        from typing import List, Tuple

        MOD = 10 ** 9 + 7


        def count_shortest_paths(n: int, adj: List[List[Tuple[int, int]]]) -> int:
            inf = float("inf")
            dist = [inf] * n
            ways = [0] * n
            dist[0] = 0
            ways[0] = 1
            heap = [(0, 0)]
            while heap:
                d, node = heapq.heappop(heap)
                if d > dist[node]:
                    continue
                for nxt, weight in adj[node]:
                    candidate = d + weight
                    if candidate < dist[nxt]:
                        dist[nxt] = candidate
                        ways[nxt] = ways[node]
                        heapq.heappush(heap, (candidate, nxt))
                    elif candidate == dist[nxt]:
                        ways[nxt] = (ways[nxt] + ways[node]) % MOD
            return ways[n - 1] % MOD


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            adj: List[List[Tuple[int, int]]] = [[] for _ in range(n)]
            for i in range(m):
                u = int(data[2 + 3 * i])
                v = int(data[3 + 3 * i])
                w = int(data[4 + 3 * i])
                adj[u].append((v, w))
                adj[v].append((u, w))
            print(count_shortest_paths(n, adj))


        if __name__ == "__main__":
            main()
