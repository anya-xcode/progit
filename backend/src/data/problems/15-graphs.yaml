      python: |
        import sys
        from collections import deque
        from typing import List, Tuple


        def shortest_maze_path(grid: List[List[int]], source: Tuple[int, int], target: Tuple[int, int]) -> int:
            rows, cols = len(grid), len(grid[0])
            sr, sc = source
            tr, tc = target
            if grid[sr][sc] == 0 or grid[tr][tc] == 0:
                return -1
            if source == target:
                return 1
            cells = [[-1] * cols for _ in range(rows)]
            cells[sr][sc] = 1
            queue = deque([(sr, sc)])
            while queue:
                r, c = queue.popleft()
                for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                    nr, nc = r + dr, c + dc
                    if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 1 and cells[nr][nc] == -1:
                        cells[nr][nc] = cells[r][c] + 1
                        if (nr, nc) == (tr, tc):
                            return cells[nr][nc]
                        queue.append((nr, nc))
            return -1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            rows, cols = int(data[0]), int(data[1])
            grid = [[int(x) for x in data[2 + r * cols:2 + (r + 1) * cols]] for r in range(rows)]
            base = 2 + rows * cols
            source = (int(data[base]), int(data[base + 1]))
            target = (int(data[base + 2]), int(data[base + 3]))
            print(shortest_maze_path(grid, source, target))


        if __name__ == "__main__":
            main()
