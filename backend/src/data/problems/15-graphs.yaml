      python: |
        import sys
        from typing import List


        def find_ladders(begin: str, end: str, words: List[str]) -> List[List[str]]:
            pool = set(words)
            if end not in pool:
                return []
            letters = "abcdefghijklmnopqrstuvwxyz"
            depth = {begin: 0}
            parents = {}
            level = [begin]
            step = 0
            reached = False
            while level and not reached:
                step += 1
                nxt_level = []
                for word in level:
                    for i in range(len(word)):
                        kept_left, kept_right = word[:i], word[i + 1:]
                        for ch in letters:
                            if ch == word[i]:
                                continue
                            cand = kept_left + ch + kept_right
                            if cand not in pool:
                                continue
                            if cand not in depth:
                                depth[cand] = step
                                parents[cand] = [word]
                                nxt_level.append(cand)
                                if cand == end:
                                    reached = True
                            elif depth[cand] == step:
                                parents[cand].append(word)
                level = nxt_level
            if end not in depth:
                return []
            ladders: List[List[str]] = []
            stack = [(end, [end])]
            while stack:
                word, tail = stack.pop()
                if word == begin:
                    ladders.append(tail[::-1])
                    continue
                for previous in parents.get(word, ()):
                    stack.append((previous, tail + [previous]))
            ladders.sort()
            return ladders


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            begin, end = data[0], data[1]
            count = int(data[2])
            words = data[3:3 + count]
            ladders = find_ladders(begin, end, words)
            if not ladders:
                print(-1)
                return
            out = []
            for ladder in ladders:
                out.append(" ".join(ladder))
            print("\n".join(out))


        if __name__ == "__main__":
            main()
