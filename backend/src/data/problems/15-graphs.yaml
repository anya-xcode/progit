  - slug: flood-fill
    title: "Flood Fill"
    difficulty: Easy
    topic: "Graphs"
    subtopic: "BFS/DFS"
    tags: [graph, dfs, bfs, matrix]
    sourceUrl: "https://leetcode.com/problems/flood-fill/"
    statement: |
      An image is a grid of integer pixel colours. Starting from the pixel at row
      `sr`, column `sc`, perform a **flood fill** with colour `color`:

      - Let `original` be the colour of the starting pixel.
      - Recolour the starting pixel and every pixel reachable from it by moving
        **up, down, left or right** through pixels whose colour is `original`.

      Pixels of other colours, and pixels of colour `original` that are not
      reachable this way, stay unchanged. Output the resulting image.
    inputFormat: |
      - Line 1: two integers `rows` and `cols`.
      - Next `rows` lines: `cols` space-separated integers, the image.
      - Last line: three integers `sr`, `sc` and `color`.
    outputFormat: |
      Print the image after the fill: `rows` lines of `cols` space-separated integers.
    constraints:
      - "1 <= rows, cols <= 50"
      - "0 <= pixel, color <= 65535"
      - "0 <= sr < rows, 0 <= sc < cols"
    examples:
      - input: |
          3 4
          5 5 0 3
          0 5 5 3
          5 0 5 5
          0 1 7
        output: |
          7 7 0 3
          0 7 7 3
          5 0 7 7
        explanation: "The 5s connected to (0, 1) snake down to the bottom-right and become 7. The 5 at (2, 0) touches that region only diagonally, so it stays."
      - input: |
          2 2
          4 4
          4 4
          0 0 4
        output: |
          4 4
          4 4
        explanation: "The new colour equals the original colour, so nothing changes."
    hints:
      - "This is a connected-component traversal on a grid, restricted to cells of the starting colour."
      - "If color equals the original colour, return immediately — otherwise a naive DFS may revisit cells forever."
    explanation: |
      **DFS / BFS — O(R·C) time, O(R·C) space.** Record `original`. If it already
      equals `color`, the image is unchanged. Otherwise push the start cell, and
      whenever you pop a cell with colour `original`, repaint it and push its four
      neighbours that are inside the grid and still have colour `original`.
      Repainting doubles as the visited marker, so no extra array is needed; the
      early exit for `original == color` is what makes that safe.

      Recursive DFS is the shortest to write but may overflow the call stack on
      large images; an explicit stack or queue has the same complexity.
