                adj[u].append(v)
                adj[v].append(u)
            for row in adj:
                row.sort()
            bfs_order, dfs_order = traversals(n, adj)
            print(" ".join(map(str, bfs_order)))
            print(" ".join(map(str, dfs_order)))


        if __name__ == "__main__":
