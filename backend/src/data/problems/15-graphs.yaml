    referenceSolution:
      python: |
        import sys
        from typing import List


        def find_circle_num(connected: List[List[int]]) -> int:
            n = len(connected)
            visited = [False] * n
            provinces = 0
            for start in range(n):
                if visited[start]:
                    continue
                provinces += 1
                visited[start] = True
                stack = [start]
                while stack:
                    city = stack.pop()
                    for other in range(n):
                        if connected[city][other] == 1 and not visited[other]:
                            visited[other] = True
                            stack.append(other)
            return provinces


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            values = [int(x) for x in data[1:1 + n * n]]
            connected = [values[i * n:(i + 1) * n] for i in range(n)]
            print(find_circle_num(connected))


        if __name__ == "__main__":
            main()
