    title: "Course Schedule"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "Topo Sort"
    tags: [graph, topological-sort, bfs, dfs]
    sourceUrl: "https://leetcode.com/problems/course-schedule/"
    statement: |
      You must take `n` courses numbered `0` to `n - 1`. Some courses have
      prerequisites: a pair `a b` means course `b` has to be completed before you
      can start course `a`.

      Determine whether it is possible to complete **all** courses.
    inputFormat: |
      - Line 1: two integers `n` and `m`, the number of courses and prerequisite pairs.
      - Next `m` lines: two integers `a b`, meaning `b` must be taken before `a`.
    outputFormat: |
      Print `true` if all courses can be finished, otherwise `false`.
    constraints:
      - "1 <= n <= 2000"
      - "0 <= m <= 5000"
      - "0 <= a, b < n"
      - "Pairs are distinct"
    examples:
      - input: |
          4 3
          1 0
          2 1
          3 2
        output: |
          true
        explanation: "Take the courses in the order 0, 1, 2, 3."
      - input: |
          3 3
          0 1
          1 2
          2 0
        output: |
          false
        explanation: "Course 0 needs 1, which needs 2, which needs 0 — none of them can ever be started."
    hints:
      - "Model courses as nodes and add an edge b → a for every pair a b."
      - "All courses can be completed exactly when this directed graph has no cycle."
      - "Kahn's algorithm: repeatedly take courses with no remaining prerequisites and count how many you manage to take."
    explanation: |
      **Repeated scanning — O(n · m) time.** Repeatedly look for a course whose
      prerequisites are all done and mark it done; stop when no progress is made.

      **Kahn's algorithm — O(n + m) time, O(n + m) space.** Build the graph with edges
      `b → a` and in-degrees. Queue all courses with in-degree 0; each time one is
      taken, decrement the in-degree of the courses depending on it and queue those
      that reach 0. The answer is `true` exactly when all `n` courses are taken.

      **DFS cycle detection — O(n + m) time, O(n + m) space.** Use the three-colour
      DFS: finding an edge into a node on the current path means a cyclic
      dependency, so the answer is `false`. A self-prerequisite (`a a`) is such a
      cycle.
