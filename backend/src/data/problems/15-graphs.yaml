      python: |
        import heapq
        import sys
        from typing import List, Tuple


        def find_order(n: int, pairs: List[Tuple[int, int]]) -> List[int]:
            unlocks: List[List[int]] = [[] for _ in range(n)]
            waiting = [0] * n
            for after, before in pairs:
                unlocks[before].append(after)
                waiting[after] += 1
            ready = [course for course in range(n) if waiting[course] == 0]
            heapq.heapify(ready)
            order: List[int] = []
            while ready:
                course = heapq.heappop(ready)
                order.append(course)
                for nxt in unlocks[course]:
                    waiting[nxt] -= 1
                    if waiting[nxt] == 0:
                        heapq.heappush(ready, nxt)
            return order if len(order) == n else []


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            pairs = []
            for i in range(m):
                a, b = int(data[2 + 2 * i]), int(data[3 + 2 * i])
                pairs.append((a, b))
            order = find_order(n, pairs)
            print(" ".join(map(str, order)) if order else -1)


        if __name__ == "__main__":
            main()
