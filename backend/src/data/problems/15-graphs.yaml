    referenceSolution:
      python: |
        import heapq
        import sys
        from typing import List


        def smallest_topological_order(n: int, adj: List[List[int]], indegree: List[int]) -> List[int]:
            remaining = indegree[:]
            ready = [node for node in range(n) if remaining[node] == 0]
            heapq.heapify(ready)
            order: List[int] = []
            while ready:
                node = heapq.heappop(ready)
                order.append(node)
                for nxt in adj[node]:
                    remaining[nxt] -= 1
                    if remaining[nxt] == 0:
                        heapq.heappush(ready, nxt)
            return order if len(order) == n else []


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            adj: List[List[int]] = [[] for _ in range(n)]
            indegree = [0] * n
            for i in range(m):
                u, v = int(data[2 + 2 * i]), int(data[3 + 2 * i])
                adj[u].append(v)
                indegree[v] += 1
            order = smallest_topological_order(n, adj, indegree)
            print(" ".join(map(str, order)) if order else -1)


        if __name__ == "__main__":
            main()
