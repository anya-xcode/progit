  - sheetId: prob-15-1-1-introduction-to-graph
    type: reference
    slug: introduction-to-graph
    title: "Introduction to Graph"
    difficulty: Easy
    topic: "Graphs"
    subtopic: "Learning"
    tags: [graph, theory]
    sourceUrl: ""
    statement: |
      A **graph** is nothing more than a set of **nodes** (also called vertices) plus
      a set of **edges**, where each edge joins two nodes. Almost anything that has
      "things" and "relations between things" is a graph: cities and roads, people
      and friendships, tasks and their prerequisites, web pages and links.

      Throughout this step nodes are numbered `0, 1, ..., n - 1`, and an edge is
      written as the pair of nodes it joins.

      ## The vocabulary you actually need

      - **Undirected edge** `u v` — you may walk from `u` to `v` and from `v` to `u`.
      - **Directed edge** `u -> v` — one-way only. A graph whose edges are all
        directed is a **digraph**.
      - **Weighted edge** `u v w` — the edge carries a number `w` (a distance, a
        price, a capacity). Without weights every edge implicitly costs `1`.
      - **Degree** of a node — how many edge ends touch it. In a digraph you count
        **in-degree** and **out-degree** separately. For an undirected graph the sum
        of all degrees is exactly `2m`, because every edge contributes two ends.
      - **Path** — a sequence of nodes where consecutive nodes are joined by an edge
        and no node repeats. A **walk** is the same thing without the "no repeats"
        rule.
      - **Cycle** — a path that returns to its starting node.
      - **Connected** — an undirected graph in which some path joins every pair of
        nodes. If not, it splits into **connected components**.
      - **Self-loop** — an edge from a node to itself. **Parallel edges** — two or
        more edges joining the same pair. A graph with neither is called *simple*;
        real input data often is not simple, so your code should survive both.

      ## Families worth recognising

      | Family | What makes it special |
      | --- | --- |
      | Tree | Connected, undirected, `n - 1` edges, no cycle. Exactly one path between any two nodes. |
      | Forest | A collection of trees, i.e. an acyclic undirected graph. |
      | DAG | Directed and acyclic. Can be laid out left to right (topological order). |
      | Bipartite | Nodes split into two sides with every edge crossing sides. Equivalent to "no odd-length cycle". |
      | Complete | Every pair of nodes is joined; `n(n-1)/2` undirected edges. |
      | Grid / implicit | Cells of a matrix with moves between neighbours. The graph is never built explicitly. |

      ## Dense vs sparse

      With `n` nodes an undirected simple graph has at most `n(n - 1) / 2` edges.
      When `m` is close to that bound the graph is **dense**; when `m` is closer to
      `n` it is **sparse**. Almost every choice you make later — adjacency matrix or
      adjacency list, Dijkstra with a heap or with a linear scan — comes down to that
      one question, so ask it before you write any code.

      ## Why the grid problems belong here

      A lot of "matrix" questions (islands, flood fill, rotting oranges, shortest
      path in a maze) are graph questions in disguise: each cell is a node and each
      legal move is an edge. Recognising that lets you reuse one traversal instead of
      inventing a new trick per problem.
    explanation: |
      **Things to remember**

      1. Decide three properties before anything else: directed or not, weighted or
         not, and whether self-loops / parallel edges can appear. Every later
         decision depends on those answers.
      2. `n` is the number of nodes, `m` the number of edges. Traversal costs
         `O(n + m)` with an adjacency list — that is the number you should expect to
         write in almost every complexity analysis of this step.
      3. A graph may be disconnected, so an algorithm that must touch every node
         loops over all starting nodes instead of starting once.
      4. A tree is just a special graph: `n - 1` edges, connected, no cycle. Any two
         of those three properties imply the third.
      5. In this library, input is always `n m` on the first line followed by `m`
         lines of `u v` (or `u v w`), and nodes are **0-indexed**.
  - sheetId: prob-15-1-2-graph-representation-c
    type: reference
    slug: graph-representation-c
    title: "Graph Representation | C++"
    difficulty: Easy
    topic: "Graphs"
    subtopic: "Learning"
    tags: [graph, theory, cpp]
    sourceUrl: ""
    statement: |
      Before you can run a single traversal you have to decide **how the graph lives
      in memory**. There are only two answers worth knowing, and the C++ containers
      that implement them.

      ## 1. Adjacency matrix

      A square `n x n` table where `adj[u][v]` records whether the edge `u v` exists
      (or its weight).

      ```cpp
      vector<vector<int>> adj(n, vector<int>(n, 0));
      for (int i = 0; i < m; ++i) {
          int u, v; cin >> u >> v;
          adj[u][v] = 1;
          adj[v][u] = 1;          // drop this line for a directed graph
      }
      ```

      - Memory: `O(n^2)` — 10^4 nodes already means 10^8 cells, far too much.
      - "Is `u v` an edge?" is `O(1)`.
      - Listing the neighbours of `u` is `O(n)` even if `u` has one neighbour.
      - For weights store `w` instead of `1` and use a sentinel (`0`, `-1` or
        `INT_MAX`) for "no edge". Parallel edges cannot be represented; you normally
        keep the smallest weight.

      Use it when `n` is small (a few hundred) or the graph is dense — Floyd-Warshall
      is the classic example.

      ## 2. Adjacency list

      For each node, the list of nodes it points to.

      ```cpp
      vector<vector<int>> adj(n);                 // unweighted
      for (int i = 0; i < m; ++i) {
          int u, v; cin >> u >> v;
          adj[u].push_back(v);
          adj[v].push_back(u);                    // undirected
      }

      vector<vector<pair<int,int>>> wadj(n);      // weighted: (neighbour, weight)
      wadj[u].push_back({v, w});
      ```

      - Memory: `O(n + 2m)` for an undirected graph — the standard choice.
      - Iterating the neighbours of `u` costs `O(deg(u))`, so a whole traversal is
        `O(n + m)`.
      - "Is `u v` an edge?" costs `O(deg(u))`, which is why edge-lookup-heavy
        problems prefer a matrix or a hash set.
      - Self-loops and parallel edges are stored exactly as given, which is usually
        what you want.

      ## 3. Edge list

      Just `vector<array<int,3>> edges` of `{u, v, w}`. Useless for traversal, but it
      is precisely what Kruskal's MST and Bellman-Ford want, because both simply loop
      over all edges.
    explanation: |
      **Choosing, and the C++ details that bite**

      - Reading input: `ios::sync_with_stdio(false); cin.tie(nullptr);` at the top of
        `main` turns slow I/O into fast I/O. It matters once `m` reaches 10^5.
      - Prefer `vector<vector<int>>` over raw arrays or `list<int>`; contiguous
        memory makes traversals noticeably faster.
      - Iterate with `for (int v : adj[u])` — and use `const auto&` when the elements
        are pairs or structs so nothing is copied.
      - A 1-indexed problem statement is the most common source of bugs. Either size
        the containers `n + 1` and ignore index `0`, or subtract one while reading.
        In this library every graph is **0-indexed**.
      - Rule of thumb: `m` close to `n^2` (dense, `n <= 500`) means matrix; anything
        else means adjacency list. If the algorithm only loops over edges, keep a
        plain edge list.
      - Memory arithmetic: `int` is 4 bytes, so an `n = 10^4` matrix needs about
        400 MB — that is why the matrix is reserved for small `n`.
  - sheetId: prob-15-1-3-graph-representation-java
    type: reference
    slug: graph-representation-java
    title: "Graph Representation | Java"
    difficulty: Easy
    topic: "Graphs"
    subtopic: "Learning"
    tags: [graph, theory, java]
    sourceUrl: ""
    statement: |
      The two representations are the same as anywhere else — adjacency matrix and
      adjacency list — but Java's object model adds a few decisions of its own.

      ## Adjacency matrix

      ```java
      int[][] adj = new int[n][n];
      for (int i = 0; i < m; i++) {
          int u = sc.nextInt(), v = sc.nextInt();
          adj[u][v] = 1;
          adj[v][u] = 1;                 // undirected only
      }
      ```

      `int[][]` is a real 2-D array of primitives, so it is compact and fast.
      Memory is `O(n^2)`; keep it for `n` up to a few hundred.

      ## Adjacency list

      The idiomatic version uses a list of lists:

      ```java
      List<List<Integer>> adj = new ArrayList<>();
      for (int i = 0; i < n; i++) adj.add(new ArrayList<>());
      for (int i = 0; i < m; i++) {
          int u = sc.nextInt(), v = sc.nextInt();
          adj.get(u).add(v);
          adj.get(v).add(u);
      }
      ```

      Two things to be aware of:

      1. `List<Integer>` stores **boxed** objects. Every neighbour is an `Integer`
         on the heap, which costs memory and cache misses. For large `m` an
         `int[] head` + `int[] next` "forward star", or a flat `int[]` built from
         degree prefix sums, is dramatically faster.
      2. You must create the `n` inner lists yourself — forgetting the loop gives a
         `NullPointerException` (or an `IndexOutOfBoundsException`) on the first
         `adj.get(u)`.

      For weights, either a small record or a pair of parallel lists:

      ```java
      record Edge(int to, int weight) {}
      List<List<Edge>> adj = ...;
      adj.get(u).add(new Edge(v, w));
      ```

      ## Edge list

      ```java
      int[][] edges = new int[m][3];     // {u, v, w}
      ```

      Sort it with `Arrays.sort(edges, Comparator.comparingInt(e -> e[2]))` and you
      have the input Kruskal's algorithm expects.
    explanation: |
      **Java specifics that decide whether your solution passes**

      - `Scanner` is far too slow beyond ~10^5 tokens. Use a
        `BufferedReader` with a `StreamTokenizer`, or read the whole stream and split
        it yourself. Print through a `StringBuilder` + one `System.out.print`, not a
        `println` per line.
      - The default JVM stack overflows on recursive DFS at a depth of roughly
        10^4-10^5. Either write the traversal iteratively with an
        `ArrayDeque<Integer>`, or run the work inside
        `new Thread(null, task, "dfs", 1 << 26)`.
      - Use `ArrayDeque` for both stacks and queues; `Stack` and `LinkedList` are
        legacy and slower.
      - `boolean[] visited = new boolean[n]` beats `HashSet<Integer>` for dense node
        numbering — it is one byte per node with no hashing.
      - Same rule of thumb as everywhere: dense and small means matrix, sparse means
        adjacency list, edge-only algorithms mean edge list.
  - sheetId: prob-15-1-4-connected-components
    type: reference
    slug: connected-components
    title: "Connected Components"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "Learning"
    tags: [graph, theory, dfs, bfs]
    sourceUrl: ""
    statement: |
      A graph is not guaranteed to be one connected piece. A **connected component**
      of an undirected graph is a maximal set of nodes in which every node can reach
      every other node. "Maximal" is the important word: you cannot add one more node
      to the set and keep that property.

      Three consequences that beginners trip over:

      1. A single isolated node is a component of size `1`.
      2. The components partition the nodes — every node is in exactly one.
      3. A traversal started at one node **only visits its own component**. That is
         why almost every graph routine in this step is wrapped in a loop over all
         nodes.

      ## The one pattern you will reuse forever

      ```
      visited = [False] * n
      for start in range(n):
          if not visited[start]:
              components += 1
              explore(start)          # BFS or DFS, marks the whole component
      ```

      `explore` may be BFS or DFS — they visit exactly the same set of nodes, only in
      a different order. Every node is pushed once and every edge is inspected twice
      (once from each end), so the whole loop is `O(n + m)` with an adjacency list.

      ## What the pattern is good for

      - Counting components, or finding the size of the largest one.
      - Labelling: store `comp[node]` instead of just a boolean, so later queries
        like "are `a` and `b` connected?" become `comp[a] == comp[b]`.
      - Grid problems: islands, regions of equal colour, enclaves. The node set is
        the cells, the edges are the legal moves, and nothing is built explicitly.
      - A quick check for "is this graph a tree?": one component **and** exactly
        `n - 1` edges.

      ## Directed graphs are different

      In a digraph, "u reaches v" no longer implies "v reaches u". The corresponding
      notions are **weakly connected components** (components of the graph with edge
      directions ignored) and **strongly connected components** (every node of the
      set reaches every other, following directions), which need Kosaraju's or
      Tarjan's algorithm rather than a plain traversal.
    explanation: |
      **Two ways to compute components**

      | Approach | Time | When it wins |
      | --- | --- | --- |
      | BFS / DFS over all nodes | `O(n + m)` | Edges are known up front; you also want sizes or a labelling. |
      | Disjoint Set Union | `O(n + m . alpha(n))` | Edges arrive one at a time (online), or you also need to merge sets later. |

      With DSU the count starts at `n` and drops by one on every **successful**
      union, so no extra pass is needed:

      ```
      count = n
      for (u, v) in edges:
          if union(u, v): count -= 1
      ```

      **Practical notes**

      - Prefer an iterative BFS/DFS (an explicit stack or `collections.deque`) — a
        path graph with 10^5 nodes overflows the recursion limit.
      - Mark a node visited **when you push it**, not when you pop it, otherwise a
        node can enter the queue many times.
      - Self-loops and parallel edges never change the components; your code should
        simply ignore them.
      - Sanity check on any answer: the component sizes must sum to `n`, and the
        number of components is `n` minus the number of successful unions.
