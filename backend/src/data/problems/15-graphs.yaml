  - slug: distance-of-nearest-cell-having-1
    title: "Distance of Nearest Cell Having 1"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "BFS/DFS"
    tags: [graph, bfs, matrix, multi-source-bfs]
    sourceUrl: ""
    statement: |
      You are given a grid of `0`s and `1`s containing at least one `1`. For every
      cell, compute the minimum number of steps needed to reach a cell containing
      `1`, where one step moves to a horizontally or vertically adjacent cell.
      Cells that already contain `1` have distance `0`.
    inputFormat: |
      - Line 1: two integers `rows` and `cols`.
      - Next `rows` lines: `cols` space-separated values, each `0` or `1`.
    outputFormat: |
      Print `rows` lines of `cols` space-separated integers: the distance for each cell.
    constraints:
      - "1 <= rows, cols <= 50"
      - "rows * cols <= 1200"
      - "At least one cell contains 1"
    examples:
      - input: |
          3 3
          0 0 0
          0 1 0
          0 0 0
        output: |
          2 1 2
          1 0 1
          2 1 2
        explanation: "The only 1 is in the centre; edge-adjacent cells are 1 step away and corners are 2 steps away."
      - input: |
          2 4
          1 0 0 0
          0 0 0 1
        output: |
          0 1 2 1
          1 2 1 0
        explanation: "Cell (0, 2) is 2 steps from either 1; cell (0, 3) is directly above the 1 at (1, 3)."
    hints:
      - "Running a separate BFS from every 0 cell repeats a lot of work."
      - "Reverse the direction: start from all 1 cells simultaneously."
      - "In a multi-source BFS, the first time a cell is reached gives its distance to the nearest source."
    explanation: |
      **BFS from every cell — O((R·C)²) time.** For each cell, search outward until a
      `1` is found.

      **Multi-source BFS — O(R·C) time, O(R·C) space.** Set the distance of every `1`
      cell to 0 and push all of them into the queue; mark the others as unvisited.
      Pop cells in order and assign `dist + 1` to each unvisited neighbour before
      pushing it. BFS processes cells in non-decreasing distance, so each cell's
      first assignment is optimal.

      **Two-pass DP — O(R·C) time, O(1) extra space.** Because there are no obstacles,
      a top-left to bottom-right pass (using up/left neighbours) followed by a
      bottom-right to top-left pass (using down/right neighbours) also yields the
      distances.
