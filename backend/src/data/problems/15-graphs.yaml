    slug: swim-in-rising-water
    title: "Swim in Rising Water"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "MST/Disjoint Set"
    tags: [graph, dsu, union-find, binary-search]
    sourceUrl: "https://leetcode.com/problems/swim-in-rising-water/"
    statement: |
      An `n x n` grid gives the height of the platform in each cell. The `n^2` values
      are exactly the numbers `0, 1, ..., n^2 - 1`, each appearing once.

      Rain falls: at time `t` the water level is `t`, and a cell is **swimmable**
      exactly when its height is at most `t`. You start on cell `(0, 0)` and want to
      reach `(n - 1, n - 1)`, moving between cells that share a side. Swimming itself
      takes no time, so within one instant you may move as far as you like — you just
      cannot enter a cell whose height is above the current water level.

      Report the earliest time at which you can be standing on `(n - 1, n - 1)`.
    inputFormat: |
      - Line 1: an integer `n`.
      - Next `n` lines: `n` integers, the grid rows.
    outputFormat: |
      Print one integer: the earliest time at which the bottom-right cell can be
      reached.
    constraints:
      - "1 <= n <= 60"
      - "The n^2 values are a permutation of 0, 1, ..., n^2 - 1."
    examples:
      - input: |
          2
          0 2
          1 3
        output: |
          3
        explanation: "At time 2 the cells with heights 0, 1 and 2 are swimmable, but 0 and 2 sit in the top row while the target holds 3. At time 3 every cell is swimmable and the target is reached, so the answer is 3."
      - input: |
          5
          0 1 2 3 4
          24 23 22 21 5
          12 13 14 15 16
          11 17 18 19 20
          10 9 8 7 6
        output: |
          16
        explanation: "The answer is 16: the route down the first row, along the right-hand column and then leftwards never needs a cell higher than 16, and no earlier time connects the two corners."
    hints:
      - "The answer is the smallest t for which the two corners are connected using only cells of height at most t - a monotone property."
      - "Activate the cells in increasing order of height and merge each with its already active neighbours; the moment the corners share a set is the answer."
      - "Two other routes to the same number: binary search t with a flood fill, or Dijkstra where the cost of a route is the largest height on it."
    explanation: |
      **Restating it.** Let `reachable(t)` mean "(0,0) and (n-1,n-1) are connected
      using only cells of height at most `t`". Raising `t` only adds cells, so
      `reachable` is monotone — the task is to find the smallest `t` where it flips
      from false to true. That single observation gives three different algorithms.

      **Disjoint Set Union, activating cells in height order — O(n^2 . alpha) time,
      O(n^2) space.** Because the heights are a permutation of `0 .. n^2 - 1`, "the
      cell of height `t`" is a direct lookup. Walk `t` from `0` upwards, mark that
      cell active, union it with each active side neighbour, and stop the moment
      `find(top-left) == find(bottom-right)` (with both cells active). Each cell is
      activated once and performs at most four unions, so the whole run is
      effectively linear in the number of cells. This is also Kruskal's algorithm in
      disguise: it finds the minimum *bottleneck* route.

      **Binary search + BFS — O(n^2 log n).** Guess `t`, flood from `(0,0)` through
      cells of height at most `t`, and check whether the target is reached. Halve the
      range on the result. Simple and a good independent check.

      **Dijkstra on the bottleneck — O(n^2 log n).** Keep `best[cell]` = the smallest
      possible value of "the highest cell on a route to it", and relax with
      `max(best[cell], height[next])` instead of a sum. The answer is
      `best[bottom-right]`. Same trick as *Path with minimum effort*.

      **Edge cases.** `n = 1` answers `grid[0][0]`, which is `0` because the values
      are a permutation. The answer is never smaller than
      `max(grid[0][0], grid[n-1][n-1])`, since both corners must be swimmable — a
      handy sanity check.
