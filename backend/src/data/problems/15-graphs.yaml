      python: |
        import heapq
        import sys
        from typing import List, Tuple


        def prim_mst(n: int, adj: List[List[Tuple[int, int]]]) -> Tuple[int, List[Tuple[int, int, int]]]:
            in_tree = [False] * n
            heap: List[Tuple[int, int, int]] = [(0, 0, -1)]
            total = 0
            chosen: List[Tuple[int, int, int]] = []
            while heap:
                weight, node, parent = heapq.heappop(heap)
                if in_tree[node]:
                    continue
                in_tree[node] = True
                if parent != -1:
                    total += weight
                    chosen.append((min(node, parent), max(node, parent), weight))
                for nxt, nxt_weight in adj[node]:
                    if not in_tree[nxt]:
                        heapq.heappush(heap, (nxt_weight, nxt, node))
            if len(chosen) != n - 1:
                return -1, []
            chosen.sort()
            return total, chosen


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            adj: List[List[Tuple[int, int]]] = [[] for _ in range(n)]
            for i in range(m):
                u = int(data[2 + 3 * i])
                v = int(data[3 + 3 * i])
                w = int(data[4 + 3 * i])
                adj[u].append((v, w))
                adj[v].append((u, w))
            total, edges = prim_mst(n, adj)
            if total < 0:
                print(-1)
                return
            out = [str(total)]
            for u, v, w in edges:
                out.append("%d %d %d" % (u, v, w))
            print("\n".join(out))


        if __name__ == "__main__":
            main()
