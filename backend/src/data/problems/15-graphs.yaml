    referenceSolution:
      python: |
        import sys
        from typing import List, Tuple


        def islands_after_each(rows: int, cols: int, operations: List[Tuple[int, int]]) -> List[int]:
            parent = [-1] * (rows * cols)
            size = [0] * (rows * cols)
            islands = 0
            answer: List[int] = []

            def find(x: int) -> int:
                root = x
                while parent[root] != root:
                    root = parent[root]
                while parent[x] != root:
                    parent[x], x = root, parent[x]
                return root

            for r, c in operations:
                cell = r * cols + c
                if parent[cell] == -1:
                    parent[cell] = cell
                    size[cell] = 1
                    islands += 1
                    for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                        nr, nc = r + dr, c + dc
                        if not (0 <= nr < rows and 0 <= nc < cols):
                            continue
                        other = nr * cols + nc
                        if parent[other] == -1:
                            continue
                        ra, rb = find(cell), find(other)
                        if ra == rb:
                            continue
                        if size[ra] < size[rb]:
                            ra, rb = rb, ra
                        parent[rb] = ra
                        size[ra] += size[rb]
                        islands -= 1
                answer.append(islands)
            return answer


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            rows, cols, q = int(data[0]), int(data[1]), int(data[2])
            operations: List[Tuple[int, int]] = []
            for i in range(q):
                r, c = int(data[3 + 2 * i]), int(data[4 + 2 * i])
                operations.append((r, c))
            print(" ".join(map(str, islands_after_each(rows, cols, operations))))


        if __name__ == "__main__":
            main()
