    referenceSolution:
      python: |
        import sys
        from typing import List


        def spanning_tree_weight(n: int, edges: List[List[int]]) -> int:
            parent = list(range(n))
            size = [1] * n

            def find(x: int) -> int:
                while parent[x] != x:
                    parent[x] = parent[parent[x]]
                    x = parent[x]
                return x

            total = 0
            used = 0
            for u, v, w in sorted(edges, key=lambda e: e[2]):
                ru, rv = find(u), find(v)
                if ru == rv:
                    continue
                if size[ru] < size[rv]:
                    ru, rv = rv, ru
                parent[rv] = ru
                size[ru] += size[rv]
                total += w
                used += 1
                if used == n - 1:
                    break
            return total


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            edges = [[int(data[2 + 3 * i]), int(data[3 + 3 * i]), int(data[4 + 3 * i])] for i in range(m)]
            print(spanning_tree_weight(n, edges))


        if __name__ == "__main__":
            main()
