    referenceSolution:
      python: |
        import sys
        from typing import List, Tuple


        def max_stones_removed(stones: List[Tuple[int, int]]) -> int:
            parent = {}
            size = {}

            def find(x):
                if x not in parent:
                    parent[x] = x
                    size[x] = 1
                    return x
                root = x
                while parent[root] != root:
                    root = parent[root]
                while parent[x] != root:
                    parent[x], x = root, parent[x]
                return root

            def union(a, b):
                ra, rb = find(a), find(b)
                if ra == rb:
                    return False
                if size[ra] < size[rb]:
                    ra, rb = rb, ra
                parent[rb] = ra
                size[ra] += size[rb]
                return True

            groups = 0
            for r, c in stones:
                row_key = ("r", r)
                col_key = ("c", c)
                for key in (row_key, col_key):
                    if key not in parent:
                        find(key)
                        groups += 1
                if union(row_key, col_key):
                    groups -= 1
            return len(stones) - groups


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            stones: List[Tuple[int, int]] = []
            for i in range(n):
                r, c = int(data[1 + 2 * i]), int(data[2 + 2 * i])
                stones.append((r, c))
            print(max_stones_removed(stones))


        if __name__ == "__main__":
            main()
