      python: |
        import sys
        from collections import deque
        from typing import List, Tuple


        def shortest_path_info(n: int, adj: List[List[int]], src: int, dst: int) -> Tuple[int, List[int]]:
            dist = [-1] * n
            ways = [0] * n
            dist[src] = 0
            ways[src] = 1
            queue = deque([src])
            while queue:
                node = queue.popleft()
                for nxt in adj[node]:
                    if dist[nxt] == -1:
                        dist[nxt] = dist[node] + 1
                        ways[nxt] = ways[node]
                        queue.append(nxt)
                    elif dist[nxt] == dist[node] + 1:
                        ways[nxt] = min(2, ways[nxt] + ways[node])
            if dist[dst] == -1:
                return -1, []
            if ways[dst] != 1:
                return dist[dst], []
            path = [dst]
            node = dst
            while node != src:
                for previous in adj[node]:
                    if dist[previous] == dist[node] - 1:
                        node = previous
                        break
                path.append(node)
            path.reverse()
            return dist[dst], path


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m, src, dst = int(data[0]), int(data[1]), int(data[2]), int(data[3])
            neighbours: List[set] = [set() for _ in range(n)]
            for i in range(m):
                u, v = int(data[4 + 2 * i]), int(data[5 + 2 * i])
                neighbours[u].add(v)
                neighbours[v].add(u)
            adj = [sorted(s) for s in neighbours]
            length, path = shortest_path_info(n, adj, src, dst)
            if length < 0:
                print(-1)
            else:
                print(length)
                print(" ".join(map(str, path)) if path else "MULTIPLE")


        if __name__ == "__main__":
            main()
