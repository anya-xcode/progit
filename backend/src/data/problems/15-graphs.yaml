  - slug: kosaraju-strongly-connected-components
    title: "Kosaraju's Algorithm (Strongly Connected Components)"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "Hard Problems"
    tags: [graph, dfs, scc, kosaraju]
    sourceUrl: ""
    statement: |
      In a **directed** graph, two nodes belong to the same **strongly connected
      component** (SCC) if each can reach the other by following edge directions.
      Every node belongs to exactly one SCC (possibly just itself).

      Count the strongly connected components of the given graph.
    inputFormat: |
      - Line 1: two integers `n` and `m`, the number of nodes (labelled `0` to `n - 1`) and edges.
      - Next `m` lines: two integers `u v` describing an edge.
      Each edge `u v` goes from `u` to `v`. Self-loops and repeated edges may appear.
    outputFormat: |
      Print the number of strongly connected components.
    constraints:
      - "1 <= n <= 10^4"
      - "0 <= m <= 2 * 10^4"
      - "0 <= u, v < n"
    examples:
      - input: |
          6 7
          0 1
          1 2
          2 0
          2 3
          3 4
          4 5
          5 3
        output: |
          2
        explanation: "Nodes 0, 1, 2 form one cycle and 3, 4, 5 another. The edge 2 → 3 goes only one way, so they stay separate components."
      - input: |
          4 3
          0 1
          1 2
          2 3
        output: |
          4
        explanation: "Along a simple chain no node can get back to an earlier one, so every node is its own component."
    hints:
      - "Checking mutual reachability for every pair of nodes is O(n · (n + m)). Can DFS finishing times help?"
      - "In the first DFS pass, record nodes in the order they finish. The last node to finish lies in a 'source' component."
      - "Reverse all edges, then run DFS in decreasing finish order; each new DFS tree in the reversed graph is exactly one SCC."
    explanation: |
      **Pairwise reachability — O(n · (n + m)) time, O(n²) space.** Run a BFS from every
      node to build the reachability relation, then group nodes that reach each
      other.

      **Kosaraju's algorithm — O(n + m) time, O(n + m) space.**
      1. DFS over the whole graph and push each node onto a stack when it
         finishes.
      2. Build the transpose graph (every edge reversed).
      3. Pop nodes from the stack; for each unvisited node run a DFS in the
         transpose graph, marking everything it reaches. Each such DFS discovers
         exactly one SCC, so count them.

      Reversing edges keeps SCCs intact but stops the second DFS from leaking into
      components that come later in the condensation order. Use iterative DFS to
      avoid recursion limits on long paths. **Tarjan's algorithm** finds the same
      components in a single DFS using low-link values, also in `O(n + m)`.
