  - slug: topological-sort
    title: "Topological Sort"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "Topo Sort"
    tags: [graph, topological-sort, heap, bfs]
    sourceUrl: ""
    statement: |
      A **topological order** of a directed acyclic graph (DAG) lists every node
      exactly once such that for each edge `u → v`, `u` appears before `v`.

      A DAG can have many topological orders. Output the **lexicographically
      smallest** one: compare two orders by their first position where they
      differ, and prefer the one with the smaller node number there.
    inputFormat: |
      - Line 1: two integers `n` and `m`, the number of nodes (labelled `0` to `n - 1`) and edges.
      - Next `m` lines: two integers `u v` describing an edge.
      Each edge `u v` goes from `u` to `v`. The graph is guaranteed to be acyclic and has no repeated edges.
    outputFormat: |
      Print the lexicographically smallest topological order as `n` space-separated node numbers.
    constraints:
      - "1 <= n <= 10^4"
      - "0 <= m <= 10^4"
      - "0 <= u, v < n, u != v"
      - "The graph is a DAG"
    examples:
      - input: |
          6 6
          3 1
          3 0
          5 0
          5 2
          1 4
          4 2
        output: |
          3 1 4 5 0 2
        explanation: "Initially only 3 and 5 have no incoming edges, so 3 goes first. That frees 1, the smallest available node; then 4; only then 5, which unlocks 0 and 2."
      - input: |
          3 0
        output: |
          0 1 2
        explanation: "Without edges any order is valid, and the smallest is ascending order."
    hints:
      - "In Kahn's algorithm, any node with in-degree 0 may be output next."
      - "To make the order lexicographically smallest, always output the smallest such node."
      - "A min-heap keeps the available nodes ordered efficiently."
    explanation: |
      **DFS finishing order — O(n + m) time.** Reversing the DFS post-order gives *a*
      valid topological order, but not necessarily the smallest one, so it does
      not solve this variant.

      **Kahn's algorithm with repeated scans — O(n² + m) time.** Keep in-degrees.
      At each step scan all nodes for the smallest unused node of in-degree 0,
      output it and decrement its neighbours' in-degrees.

      **Kahn's algorithm with a min-heap — O((n + m) log n) time, O(n) space.** Push
      all in-degree-0 nodes into a min-heap. Repeatedly pop the smallest node,
      append it to the answer, and push any neighbour whose in-degree drops to 0.
      Greedily taking the smallest available node at each position is optimal:
      every choice made later remains available, and an earlier position always
      dominates the comparison.
    starterCode:
      python: |
        import sys
        from typing import List


        def topo_sort(n: int, adj: List[List[int]]) -> List[int]:
            # Return the lexicographically smallest topological order.
