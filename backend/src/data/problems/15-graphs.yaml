    title: "Shortest path in DAG"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "Shortest Path"
    tags: [graph, topological-sort, shortest-path, dag]
    sourceUrl: ""
    statement: |
      You are given a **directed acyclic graph** (DAG) with `n` nodes numbered `0` to
      `n - 1` and `m` weighted edges, plus a source node `src`. Edge weights may be
      **negative**; because the graph has no cycle there is no risk of a negative
      loop.

      For every node, report the smallest possible total weight of a directed path
      from `src` to it. The distance from `src` to itself is `0`, and a node that
      cannot be reached gets `-1`.
    inputFormat: |
      - Line 1: three integers `n`, `m` and `src`.
      - Next `m` lines: three integers `u v w` — a directed edge from `u` to `v` of
        weight `w`.
    outputFormat: |
      Print `n` space-separated integers: the shortest distance from `src` to nodes
      `0, 1, ..., n - 1`, using `-1` for nodes that cannot be reached.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= m <= 2 * 10^5"
      - "0 <= u, v, src < n"
      - "-10^4 <= w <= 10^4"
      - "The graph is acyclic. Repeated edges may appear."
    examples:
      - input: |
          6 7 0
          0 1 2
          0 4 1
          4 5 4
          4 2 2
          1 2 3
          2 3 6
          5 3 1
        output: |
          0 2 3 6 1 5
        explanation: "Node 4 costs 1 and node 2 is cheapest through it (1 + 2 = 3). Node 3 can be reached as 0-4-5-3 for 1 + 4 + 1 = 6 or as 0-4-2-3 for 3 + 6 = 9, so 6 wins."
      - input: |
          5 3 2
          0 1 5
          2 3 7
          3 4 -2
        output: |
          -1 -1 0 7 5
        explanation: "Starting at 2, only 3 and 4 are reachable: 7, and 7 + (-2) = 5. Nodes 0 and 1 have no incoming route from 2, so they print -1. The negative weight is harmless in a DAG."
    hints:
      - "In a DAG you can order the nodes so that every edge points forward; then one left-to-right sweep is enough."
      - "Relax a node's outgoing edges only after its own distance is final - topological order guarantees exactly that."
      - "Nodes that come before src in the order, or are simply unreachable, keep an infinite distance; do not relax from those."
    explanation: |
      **Why Dijkstra is the wrong tool.** Dijkstra assumes non-negative weights: it
      freezes a node's distance as soon as the node is popped, which a later negative
      edge could still improve. The DAG structure gives something stronger and
      cheaper.

      **Topological order + one relaxation sweep — O(n + m) time, O(n) space.**
      Compute any topological order (Kahn's algorithm: repeatedly emit a node of
      in-degree zero). Process the nodes in that order; when `u` is processed, every
      edge that could reach `u` has already been relaxed, so `dist[u]` is final.
      Relax `u`'s outgoing edges once and move on. Each edge is relaxed exactly once,
      which is what makes the whole thing linear — faster than Dijkstra's
      `O((n + m) log n)` *and* able to handle negative weights.

      Skip a node whose distance is still infinite; adding a weight to infinity would
      propagate garbage to its successors.

      **Alternatives.** Bellman-Ford solves the same problem in `O(n . m)` and is the
      natural cross-check for small inputs. A DFS-based topological order (push each
      node when its call finishes, then reverse) works just as well as Kahn's — write
      it iteratively so a 10^5-long chain does not exhaust the stack.

      **Longest path for free.** The same sweep with `>` instead of `<` gives the
      *longest* path in a DAG, a problem that is NP-hard on general graphs. That is
      the clearest sign that topological order, not the weights, is doing the work
      here.
