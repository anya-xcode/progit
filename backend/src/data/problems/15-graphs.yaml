    tags: [graph, topological-sort, bfs, heap]
    sourceUrl: "https://leetcode.com/problems/course-schedule-ii/"
    statement: |
      You have to take `n` courses numbered `0` to `n - 1`, one course at a time. You
      are given `m` prerequisite pairs; a pair `a b` means course `b` must be
      finished **before** course `a` is started.

      Produce an order in which all `n` courses can be taken. If that is impossible,
      say so.

      Many orders are usually valid, so print the **lexicographically smallest** one:
      of two valid orders, prefer the one that has the smaller course number at the
      first position where they differ. Duplicate pairs may appear, and a pair may
      name the same course twice.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Next `m` lines: two integers `a b`, meaning `b` must be taken before `a`.
    outputFormat: |
      Print `-1` if the courses cannot all be taken. Otherwise print the `n` course
      numbers in the lexicographically smallest valid order, space-separated on one
      line.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= m <= 2 * 10^5"
      - "0 <= a, b < n"
      - "Duplicate pairs and pairs with a == b may appear."
    examples:
      - input: |
          4 4
          1 0
          2 0
          3 1
          3 2
        output: |
          0 1 2 3
        explanation: "Only course 0 is free at the start. Taking it releases 1 and 2; the smaller one, 1, comes next, then 2, and 3 becomes available only once both are done."
      - input: |
          3 3
          1 0
          2 1
          0 2
        output: |
          -1
        explanation: "Course 0 needs 2, which needs 1, which needs 0. The three requirements form a loop, so no course can ever be taken first."
    hints:
      - "Turn every pair a b into the edge b -> a, so an edge points from a prerequisite to the course it unlocks."
      - "A course can be taken once its number of unfinished prerequisites hits zero; keep those courses in a min-heap so the smallest is always taken next."
      - "If the loop ends before all n courses are emitted, the leftover courses depend on each other in a loop - print -1."
    explanation: |
      **Model it as a graph.** Each course is a node. A pair `a b` becomes the
      directed edge `b -> a` ("finishing `b` unlocks `a`"). A valid schedule is
      exactly a topological order of that graph, and it exists exactly when the graph
      has no directed cycle. Getting the edge direction backwards is the single most
      common mistake here — the pair reads "a *after* b".

      **Kahn's algorithm — O(n + m) time, O(n) space.** `waiting[c]` counts how many
      prerequisites of `c` are still unfinished. Start with every course whose count
      is `0`, repeatedly take one, append it to the schedule, and decrement the
      counter of each course it unlocks; a counter reaching `0` makes that course
      available. Every edge is processed once.

      **Smallest order — O((n + m) log n).** Taking the available course with the
      smallest number at every step is optimal: any other choice puts a bigger number
      at that position, and taking the smallest never makes a later course
      unreachable, because the rest of the graph stays acyclic. A binary heap
      supplies the minimum in `O(log n)`, so the total cost is
      `O((n + m) log n)`. With a FIFO queue you would get a valid schedule, but not
      the smallest one.

      **Detecting the impossible case.** Courses inside a cycle never lose their last
      prerequisite, so the loop ends early. Comparing the number of emitted courses
      with `n` is the whole test — a self-pair `a a` is caught by it too, since `a`
      would have to be taken before itself. Duplicate pairs raise a counter twice and
      lower it twice, so they are harmless.

      **DFS alternative — O(n + m).** Push each node onto a list as its DFS call
      finishes and reverse the list; a three-colour DFS reports the cycle. It is the
      shorter program, but it cannot deliver the lexicographically smallest order.
