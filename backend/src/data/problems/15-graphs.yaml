    referenceSolution:
      python: |
        import sys
        from typing import List


        def floyd_warshall(n: int, edges: List[List[int]]) -> List[List[int]]:
            inf = float("inf")
            dist = [[0 if i == j else inf for j in range(n)] for i in range(n)]
            for u, v, w in edges:
                if w < dist[u][v]:
                    dist[u][v] = w
            for k in range(n):
                row_k = dist[k]
                for i in range(n):
                    row_i = dist[i]
                    through = row_i[k]
                    if through == inf:
                        continue
                    for j in range(n):
                        if through + row_k[j] < row_i[j]:
                            row_i[j] = through + row_k[j]
            return [[int(d) if d != inf else -1 for d in row] for row in dist]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            edges = [[int(data[2 + 3 * i]), int(data[3 + 3 * i]), int(data[4 + 3 * i])] for i in range(m)]
            result = floyd_warshall(n, edges)
            for row in result:
                print(" ".join(map(str, row)))


        if __name__ == "__main__":
            main()
