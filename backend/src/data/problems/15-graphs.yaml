    slug: find-the-city-with-the-smallest-number-of-neighbors
    title: "Find the city with the smallest number of neighbors"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "Shortest Path"
    tags: [graph, floyd-warshall, shortest-path, all-pairs]
    sourceUrl: "https://leetcode.com/problems/find-the-city-with-the-smallest-number-of-neighbors-at-a-threshold-distance/"
    statement: |
      There are `n` cities numbered `0` to `n - 1` joined by `m` two-way roads; a
      road `u v w` can be driven in either direction and is `w` long.

      City `b` is a **neighbour** of city `a` when the shortest driving distance from
      `a` to `b` is at most `threshold`. A city is never its own neighbour.

      Find the city with the **fewest** neighbours. If several cities tie, answer with
      the **largest** city number among them. Parallel roads and self-loops may
      appear in the list.
    inputFormat: |
      - Line 1: three integers `n`, `m` and `threshold`.
      - Next `m` lines: three integers `u v w` — a two-way road between `u` and `v`
        of length `w`.
    outputFormat: |
      Print one integer: the number of the city with the fewest neighbours, choosing
      the largest such city number when there is a tie.
    constraints:
      - "1 <= n <= 200"
      - "0 <= m <= 4000"
      - "0 <= u, v < n"
      - "1 <= w <= 10^4"
      - "0 <= threshold <= 10^9"
      - "Parallel roads and self-loops may appear."
    examples:
      - input: |
          4 4 4
          0 1 3
          1 2 1
          1 3 4
          2 3 1
        output: |
          3
        explanation: "Within distance 4: city 0 reaches 1 (3) and 2 (4); city 1 reaches 0, 2 and 3; city 2 reaches 0, 1 and 3; city 3 reaches 1 and 2. Cities 0 and 3 tie on two neighbours, so the larger number 3 wins."
      - input: |
          5 6 2
          0 1 2
          0 4 8
          1 2 3
          1 4 2
          2 3 1
          3 4 1
        output: |
          0
        explanation: "Within distance 2: city 0 reaches only 1 (distance 2); every other city reaches at least two. So city 0 has the fewest neighbours."
    hints:
      - "Every city needs its distances to every other city, so this is an all-pairs shortest path problem, not a single-source one."
      - "With n up to 200, an n x n table and three nested loops are plenty - and much shorter to write than n separate searches."
      - "The tie rule is 'largest number wins', so scanning cities in increasing order and accepting a count that merely ties the best gives the right answer."
    explanation: |
      **Floyd-Warshall — O(n^3) time, O(n^2) space.** Fill an `n x n` table with the
      road lengths (`0` on the diagonal, infinity where there is no road), keeping the
      *cheapest* road when several join the same pair. Then, for every intermediate
      city `k`, try to improve every pair:

      ```
      dist[i][j] = min(dist[i][j], dist[i][k] + dist[k][j])
      ```

      The loop order matters: `k` must be the **outermost** loop, so that when `k` is
      considered, all routes through cities `0 .. k - 1` are already accounted for.
      With `n = 200` that is 8 million updates — trivial.

      Once the table is complete, count for each city how many other cities are
      within `threshold`, and keep the minimum. Scanning cities in increasing order
      and replacing the best whenever the new count is **less than or equal to** the
      current best automatically implements "largest number wins".

      **Dijkstra from every city — O(n . (n + m) log n).** Faster on a sparse graph
      and the natural cross-check, but `n` separate runs mean `n` heaps and `n`
      distance arrays, so the code is longer. On a dense graph Floyd-Warshall wins
      outright.

      **Details.** Self-loops never improve anything (`dist[u][u]` is already `0`)
      and parallel roads are handled by keeping the smallest weight while reading the
      input. A city with no road at all has zero neighbours, which makes it a strong
      candidate for the answer — a good test case.
