      python: |
        import heapq
        import sys
        from typing import List, Tuple


        def network_delay_time(n: int, adj: List[List[Tuple[int, int]]], src: int) -> int:
            inf = float("inf")
            dist = [inf] * n
            dist[src] = 0
            heap = [(0, src)]
            while heap:
                d, node = heapq.heappop(heap)
                if d > dist[node]:
                    continue
                for nxt, weight in adj[node]:
                    candidate = d + weight
                    if candidate < dist[nxt]:
                        dist[nxt] = candidate
                        heapq.heappush(heap, (candidate, nxt))
            slowest = max(dist)
            return -1 if slowest == inf else int(slowest)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m, src = int(data[0]), int(data[1]), int(data[2])
            adj: List[List[Tuple[int, int]]] = [[] for _ in range(n)]
            for i in range(m):
                u = int(data[3 + 3 * i])
                v = int(data[4 + 3 * i])
                w = int(data[5 + 3 * i])
                adj[u].append((v, w))
            print(network_delay_time(n, adj, src))


        if __name__ == "__main__":
            main()
