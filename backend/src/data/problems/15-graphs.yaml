    slug: shortest-path-in-undirected-graph-with-unit-weights
    title: "Shortest path in undirected graph with unit weights"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "Shortest Path"
    tags: [graph, bfs, shortest-path]
    sourceUrl: ""
    statement: |
      You are given an **undirected** graph with `n` nodes numbered `0` to `n - 1`
      and `m` edges. Every edge costs the same, so the length of a path is simply the
      number of edges on it. The graph may be disconnected, and the edge list may
      contain self-loops and repeated edges (neither of which can shorten a path).

      For the two given nodes `src` and `dst`, report the length of a shortest path
      between them — and the path itself, but only when it is the **only** shortest
      path. When several different shortest paths exist there is no single right
      answer to print, so the length alone is reported.
    inputFormat: |
      - Line 1: four integers `n`, `m`, `src` and `dst`.
      - Next `m` lines: two integers `u v`, an undirected edge between `u` and `v`.
    outputFormat: |
      If `dst` cannot be reached from `src`, print `-1` on a single line and nothing
      else.

      Otherwise:

      - Line 1: the number of edges on a shortest path (`0` when `src == dst`).
      - Line 2: if exactly one shortest path exists, its nodes from `src` to `dst`
        separated by spaces; otherwise the word `MULTIPLE`.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= m <= 2 * 10^5"
      - "0 <= u, v, src, dst < n"
      - "Self-loops and repeated edges may appear."
    examples:
      - input: |
          6 6 0 4
          0 1
          1 2
          2 3
          3 4
          1 5
          5 4
        output: |
          3
          0 1 5 4
        explanation: "Going 0-1-5-4 uses three edges; the other route 0-1-2-3-4 uses four. Three is the minimum and only one route achieves it, so the route is printed."
      - input: |
          4 4 0 3
          0 1
          0 2
          1 3
          2 3
        output: |
          2
          MULTIPLE
        explanation: "Both 0-1-3 and 0-2-3 use two edges, so the length is 2 but no single path can be named."
    hints:
      - "All edges cost the same, so plain BFS already gives shortest distances - no priority queue is needed."
      - "Alongside dist[v], keep ways[v] = how many shortest paths reach v; a node discovered later at the same level adds its predecessor's count."
      - "You never need the exact number of shortest paths, only whether it is one or more, so cap the counter at 2 and keep the arithmetic small."
    explanation: |
      **Why BFS and not Dijkstra.** With every edge worth `1`, the BFS layer a node
      falls into *is* its distance: nodes are dequeued in non-decreasing distance
      order, so the first time a node is reached is via a shortest path. That costs
      `O(n + m)` instead of Dijkstra's `O((n + m) log n)`.

      **Counting shortest paths in the same pass — O(n + m).** Because BFS finishes
      every node of level `d` before touching level `d + 1`, the rule is simple. When
      `u` is dequeued and edge `u - v` is examined:

      - `v` unseen: `dist[v] = dist[u] + 1` and `ways[v] = ways[u]`;
      - `dist[v] == dist[u] + 1`: `v` is on the next level and `u` is another way in,
        so `ways[v] += ways[u]`;
      - anything else: `v` is on the same or an earlier level, so the edge cannot
        shorten anything — ignore it.

      Cap `ways` at `2`: the question is only "one or many", and capping keeps the
      counter from growing exponentially.

      **Rebuilding the path — O(n).** If `ways[dst] == 1`, every node on the way back
      has exactly one neighbour one level closer to `src` (a second such neighbour
      would mean a second shortest path). So start at `dst` and repeatedly step to
      any neighbour `p` with `dist[p] == dist[node] - 1`; reverse the list at the
      end.

      **Cross-check.** Let `L` be the distance and let `ds[v]` and `dd[v]` be the
      distances from `src` and from `dst` (two BFS runs). A node lies on some
      shortest path exactly when `ds[v] + dd[v] == L`. The path is unique exactly
      when there are `L + 1` such nodes — one per level — which is an independent way
      to confirm the `MULTIPLE` verdict.

      **Details.** Deduplicating the adjacency lists makes parallel edges count once,
      so two parallel edges do not masquerade as two different paths. Self-loops are
      skipped automatically, since `dist[u] == dist[u] + 1` is never true.
