      python: |
        import heapq
        import sys
        from collections import deque
        from typing import List, Tuple

        STEPS = ((1, 0), (-1, 0), (0, 1), (0, -1))


        def minimum_effort_route(grid: List[List[int]]) -> Tuple[int, List[int]]:
            rows, cols = len(grid), len(grid[0])
            last = (rows - 1) * cols + (cols - 1)
            if grid[0][0] < 0 or grid[rows - 1][cols - 1] < 0:
                return -1, []

            inf = float("inf")
            effort = [inf] * (rows * cols)
            effort[0] = 0
            heap = [(0, 0)]
            while heap:
                value, cell = heapq.heappop(heap)
                if value > effort[cell]:
                    continue
                r, c = divmod(cell, cols)
                for dr, dc in STEPS:
                    nr, nc = r + dr, c + dc
                    if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] >= 0:
                        nxt = nr * cols + nc
                        candidate = max(value, abs(grid[nr][nc] - grid[r][c]))
                        if candidate < effort[nxt]:
                            effort[nxt] = candidate
                            heapq.heappush(heap, (candidate, nxt))
            if effort[last] == inf:
                return -1, []
            limit = int(effort[last])

            dist = [-1] * (rows * cols)
            ways = [0] * (rows * cols)
            dist[0] = 0
            ways[0] = 1
            queue = deque([0])
            while queue:
                cell = queue.popleft()
                r, c = divmod(cell, cols)
                for dr, dc in STEPS:
                    nr, nc = r + dr, c + dc
                    if not (0 <= nr < rows and 0 <= nc < cols) or grid[nr][nc] < 0:
                        continue
                    if abs(grid[nr][nc] - grid[r][c]) > limit:
                        continue
                    nxt = nr * cols + nc
                    if dist[nxt] == -1:
                        dist[nxt] = dist[cell] + 1
                        ways[nxt] = ways[cell]
                        queue.append(nxt)
                    elif dist[nxt] == dist[cell] + 1:
                        ways[nxt] = min(2, ways[nxt] + ways[cell])
            if ways[last] != 1:
                return limit, []

            route = [last]
            cell = last
            while cell != 0:
                r, c = divmod(cell, cols)
                for dr, dc in STEPS:
                    nr, nc = r + dr, c + dc
                    if not (0 <= nr < rows and 0 <= nc < cols) or grid[nr][nc] < 0:
                        continue
                    previous = nr * cols + nc
                    if dist[previous] == dist[cell] - 1 and abs(grid[nr][nc] - grid[r][c]) <= limit:
                        cell = previous
                        break
                route.append(cell)
            route.reverse()
            return limit, route


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            rows, cols = int(data[0]), int(data[1])
            grid = [[int(x) for x in data[2 + r * cols:2 + (r + 1) * cols]] for r in range(rows)]
            effort, route = minimum_effort_route(grid)
            if effort < 0:
                print(-1)
            else:
                print(effort)
                print(" ".join(map(str, route)) if route else "MULTIPLE")


        if __name__ == "__main__":
            main()
