  - slug: floyd-warshall-algorithm
    title: "Floyd-Warshall Algorithm"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "Shortest Path"
    tags: [graph, shortest-path, floyd-warshall, dynamic-programming]
    sourceUrl: ""
    statement: |
      You are given a weighted **directed** graph with `n` nodes and `m` edges with
      non-negative weights. Compute the shortest distance between **every ordered
      pair** of nodes `(i, j)`.

      The distance from a node to itself is `0`. If `j` cannot be reached from `i`,
      the distance is `-1`. The edge list may contain several edges between the
      same pair of nodes and self-loops.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Next `m` lines: three integers `u v w` — a directed edge from `u` to `v` with weight `w`.
    outputFormat: |
      Print `n` lines; line `i` contains `n` space-separated integers, the shortest distance from `i` to `0, ..., n - 1` (`-1` if unreachable).
    constraints:
      - "1 <= n <= 100"
      - "0 <= m <= 1000"
      - "0 <= u, v < n"
      - "0 <= w <= 1000"
    examples:
      - input: |
          3 4
          0 1 2
          1 2 3
          0 2 9
          2 0 1
        output: |
          0 2 5
          4 0 3
          1 3 0
        explanation: "From 0, reaching 2 through 1 costs 5 instead of 9. From 1, node 0 is reached via 2 with cost 3 + 1 = 4."
      - input: |
          3 1
          0 1 7
        output: |
          0 7 -1
          -1 0 -1
          -1 -1 0
        explanation: "Only the edge 0 → 1 exists, so every other pair of distinct nodes is unreachable."
    hints:
      - "Running a single-source algorithm from every node works. Is there a simpler DP?"
      - "Let the allowed intermediate nodes grow one at a time: after step k, paths may pass through nodes 0..k."
      - "dist[i][j] = min(dist[i][j], dist[i][k] + dist[k][j]) — the loop over k must be the outermost one."
    explanation: |
      **Dijkstra from every node — O(n · (n + m) log n) time, O(n² + m) space.**
      Valid because weights are non-negative; often best for sparse graphs.

      **Bellman-Ford from every node — O(n² · m) time.** Also works with negative
      weights but is slow.

      **Floyd-Warshall — O(n³) time, O(n²) space.** Initialise `dist[i][i] = 0`,
      `dist[u][v] = min` weight over parallel edges, and infinity elsewhere. For
      each intermediate node `k` (outer loop) and every pair `(i, j)`, set
      `dist[i][j] = min(dist[i][j], dist[i][k] + dist[k][j])`. After processing `k`,
      `dist[i][j]` is the best path using only intermediates `0..k`. Convert
      remaining infinities to `-1` when printing. (A negative value on the diagonal
      would indicate a negative cycle if negative weights were allowed.)
