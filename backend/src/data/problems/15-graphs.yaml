    statement: |
      You are given a **directed** graph with `n` nodes numbered `0` to `n - 1` and
      `m` edges. A node with no outgoing edge is called **terminal**.

      Start a walk at some node and repeatedly follow any outgoing edge. A node is
      **safe** when *every* walk that starts there is guaranteed to stop at a
      terminal node after a finite number of steps — in other words, no matter which
      edges you pick, you can never keep walking forever.

      List all the safe nodes. The set of safe nodes is uniquely determined; print it
      in increasing order.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Next `m` lines: two integers `u v`, a directed edge from `u` to `v`.
    outputFormat: |
      Print the safe nodes in increasing order, space-separated on one line. If there
      is no safe node, print `-1`.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= m <= 2 * 10^5"
      - "0 <= u, v < n"
      - "Self-loops (u == v) and repeated edges may appear."
    examples:
      - input: |
          7 7
          0 1
          0 2
          1 2
          2 3
          2 4
          3 5
          4 5
        output: |
          0 1 2 3 4 5 6
        explanation: "Node 5 is terminal, hence safe. Nodes 3 and 4 only lead to 5, node 2 only to 3 and 4, node 1 only to 2, and node 0 to 1 and 2 - every walk from any of them ends at 5. The whole graph is acyclic, so all seven nodes are safe."
      - input: |
          3 3
          0 1
          1 2
          2 0
        output: |
          -1
        explanation: "Every node sits on the cycle 0 -> 1 -> 2 -> 0, so a walk from any of them can go round forever and no node is safe."
    hints:
      - "A node is unsafe exactly when it can reach a cycle; a node is safe exactly when all of its out-neighbours are safe."
      - "Terminal nodes are safe by definition - they are the seeds. Which nodes become safe once a seed is known?"
      - "Reverse every edge and run Kahn's algorithm on the out-degrees: a node becomes safe when its out-degree drops to zero."
    explanation: |
      **Restating the condition.** Walks that never stop exist exactly when the walk
      can enter a cycle. So a node is unsafe if and only if it can reach a node that
      lies on a directed cycle, and safe otherwise. Equivalently, safety is the
      fixpoint of: *terminal nodes are safe, and a node is safe once all of its
      out-neighbours are safe*.

      **DFS with three colours — O(n + m) time, O(n) space.** Colour a node grey on
      entry and black when finished. Meeting a grey node means a cycle, so the whole
      current path is unsafe; if every recursive call returns "safe", the node is
      safe. Memoise the result per node so each node is expanded once. Needs an
      explicit stack in Python, since the recursion can be `n` deep.

      **Reverse graph + Kahn — O(n + m) time, O(n) space (the version implemented
      here).** Reverse every edge and treat `outdegree[u]` (in the original graph) as
      a counter. Every node with `outdegree = 0` is terminal, hence safe; push them.
      Popping a safe node `v`, walk the **reversed** edges to each predecessor `u`
      and decrement `outdegree[u]`; when it reaches `0`, all of `u`'s original
      out-neighbours have been proved safe, so `u` is safe too. This is exactly
      Kahn's algorithm run on the reversed graph, and it never touches a node of a
      cycle, because such a node keeps an out-edge to an unproven node forever.

      **Brute force — O(n . (n + m)).** For each node run a separate search for a
      reachable cycle. Correct but quadratic; the two linear methods above do the
      same work once for all nodes.

      **Details.** A self-loop `u -> u` gives `u` an out-edge that is never resolved,
      so `u` is unsafe — as it should be. Repeated edges raise the out-degree several
      times and are decremented as often, so they do no harm. Scanning
      `range(n)` at the end is what produces the increasing order the output asks
      for.
