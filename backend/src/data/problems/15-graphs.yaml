    slug: why-priority-queue-is-used-in-djisktra-s-algorithm
    title: "Why priority Queue is used in Djisktra's Algorithm"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "Shortest Path"
    tags: [graph, dijkstra, heap, shortest-path]
    sourceUrl: ""
    statement: |
      Dijkstra's algorithm works by **settling** nodes one at a time: at every step
      it picks the unsettled node whose current tentative distance is smallest,
      declares that distance final, and relaxes the edges leaving it. The priority
      queue exists purely to answer "which unsettled node has the smallest tentative
      distance?" quickly. This task makes that sequence visible.

      You are given a weighted **undirected** graph with `n` nodes numbered `0` to
      `n - 1`, `m` edges with non-negative weights, and a source `src`. Report

      1. the order in which the nodes are settled, and
      2. the final shortest distance to every node.

      Only nodes reachable from `src` are ever settled. When two unsettled nodes tie
      on tentative distance, the one with the **smaller node number** is settled
      first — that rule makes the order unique. Self-loops and parallel edges may
      appear.
    inputFormat: |
      - Line 1: three integers `n`, `m` and `src`.
      - Next `m` lines: three integers `u v w` — an undirected edge between `u` and
        `v` of weight `w`.
    outputFormat: |
      - Line 1: the settled nodes in the order they are settled, space-separated
        (this line lists only the nodes reachable from `src`; it always starts with
        `src`).
      - Line 2: `n` space-separated integers, the shortest distance from `src` to
        each node, `-1` for unreachable nodes.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= m <= 2 * 10^5"
      - "0 <= u, v, src < n"
      - "0 <= w <= 10^4"
      - "Self-loops and parallel edges may appear."
    examples:
      - input: |
          5 6 0
          0 1 4
          0 2 1
          2 1 2
          1 3 1
          2 3 5
          3 4 3
        output: |
          0 2 1 3 4
          0 3 1 4 7
        explanation: "Tentative distances after settling 0 are 4 for node 1 and 1 for node 2, so 2 is settled next and improves node 1 to 3. Then 1 (distance 3), then 3 (4), then 4 (7) - each settled node is the cheapest one still open."
      - input: |
          5 3 0
          0 1 2
          0 2 2
          3 4 7
        output: |
          0 1 2
          0 2 2 -1 -1
        explanation: "Nodes 1 and 2 both end up at distance 2, so the tie is broken by node number and 1 is settled before 2. Nodes 3 and 4 are in another component: they are never settled and print -1."
    hints:
      - "A plain queue settles nodes in insertion order; here you must always take the smallest tentative distance instead."
      - "Push (distance, node) pairs into a min-heap - comparing tuples breaks distance ties by the smaller node number for free."
      - "Improving a node's distance pushes a new entry rather than editing the old one, so skip any popped entry whose node is already settled."
    explanation: |
      **What the priority queue is for.** Dijkstra's correctness rests on one fact:
      if all weights are non-negative, the unsettled node with the smallest tentative
      distance can no longer be improved, because any other route to it would have to
      leave through a node that is at least as far away and then add non-negative
      weight. So the algorithm needs, over and over, the minimum of a changing set.
      That is exactly what a priority queue provides.

      **Linear scan — O(n^2 + m) time, O(n) space.** Each of the `n` rounds scans all
      nodes for the smallest unsettled tentative distance. Simple, no extra
      structure, and actually the best choice on dense graphs where `m` is close to
      `n^2`.

      **Binary heap (the lazy version) — O((n + m) log n) time, O(n + m) space.**
      Push `(0, src)`. Pop the smallest pair; if its node is already settled the entry
      is a leftover from an earlier, worse estimate, so drop it. Otherwise settle the
      node, append it to the order, and for each edge `(v, w)` check
      `d + w < dist[v]`; if so, record the better distance and push `(dist[v], v)`.
      At most one entry per successful relaxation is ever pushed, so the heap holds
      `O(m)` entries and every push or pop costs `O(log m) = O(log n)`.

      Tuples compare element by element, so `(3, 1)` sorts before `(3, 4)`: equal
      distances are settled in increasing node order, which is what makes this
      problem's output unique.

      **What a plain FIFO queue would do.** It would settle nodes in discovery
      order, freeze distances too early, and need to re-expand nodes whenever a
      better distance appears later — that is the SPFA/Bellman-Ford behaviour, up to
      `O(n . m)` in the worst case.

      **Details.** A self-loop relaxes `dist[u] + w < dist[u]`, which is never true
      for `w >= 0`, so it is ignored. Parallel edges are relaxed independently and
      only the cheapest one can ever improve anything. Nodes in other components are
      never pushed, so they never appear in the settle order.
