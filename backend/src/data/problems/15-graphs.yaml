      python: |
        import sys
        from typing import List, Tuple


        def dijkstra(n: int, adj: List[List[Tuple[int, int]]], src: int) -> List[int]:
            # adj[u] holds (v, w) pairs. Return shortest distances from src, -1 if unreachable.
            pass


        # --- Input/output handling ---
