    referenceSolution:
      python: |
        import heapq
        import sys
        from typing import List, Tuple


        def dijkstra_settle_order(n: int, adj: List[List[Tuple[int, int]]], src: int):
            inf = float("inf")
            dist = [inf] * n
            settled = [False] * n
            dist[src] = 0
            heap = [(0, src)]
            order: List[int] = []
            while heap:
                d, node = heapq.heappop(heap)
                if settled[node]:
                    continue
                settled[node] = True
                order.append(node)
                for nxt, weight in adj[node]:
                    candidate = d + weight
                    if candidate < dist[nxt]:
                        dist[nxt] = candidate
                        heapq.heappush(heap, (candidate, nxt))
            return order, [int(d) if d != inf else -1 for d in dist]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m, src = int(data[0]), int(data[1]), int(data[2])
            adj: List[List[Tuple[int, int]]] = [[] for _ in range(n)]
            for i in range(m):
                u = int(data[3 + 3 * i])
                v = int(data[4 + 3 * i])
                w = int(data[5 + 3 * i])
                adj[u].append((v, w))
                adj[v].append((u, w))
            order, dist = dijkstra_settle_order(n, adj, src)
            print(" ".join(map(str, order)))
            print(" ".join(map(str, dist)))


        if __name__ == "__main__":
            main()
