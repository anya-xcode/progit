      - "Whatever order you remove them in, exactly one stone of each linked group is left - so the answer is n minus the number of groups."
      - "Instead of joining stones to stones (up to n^2 pairs), join each stone's row to its column and count the groups of rows and columns."
    explanation: |
      **Why the answer is `n - groups`.** Build a graph where two stones are joined
      when they share a row or a column, and look at one connected group of `k`
      stones. You can always remove `k - 1` of them: take any spanning tree of the
      group and peel off leaves, since a leaf always has its neighbour still on the
      board. You can never remove all `k`, because the last stone removed would have
      had no partner left. So each group leaves exactly one stone behind, and the
      answer is `n` minus the number of groups.

      **Brute force — O(n^2 . alpha) time.** Compare every pair of stones and union
      those sharing a row or a column. Simple, correct, and quadratic — 10^10
      operations at the limit.

      **Union rows with columns — O(n . alpha(n)) time, O(n) space.** The trick is to
      use *rows and columns* as the elements instead of stones. For each stone,
      union the element "row `r`" with the element "column `c`". Two stones end up in
      the same set exactly when they are linked, directly or through others, so the
      number of connected groups of the used row/column elements equals the number of
      stone groups. Keep the row and column keys apart — for instance as tagged pairs
      `("r", r)` and `("c", c)` — so row `3` is never confused with column `3`.

      Use a dictionary-backed DSU so the huge coordinate range (up to 10^9) costs
      nothing: only the rows and columns that actually carry a stone are ever
      created. Keep a running group counter: `+1` whenever a new row or column key is
      created, `-1` on every successful union.

      **BFS / DFS on the same bipartite row-column graph** works too, with the same
      linear cost; DSU is shorter and handles stones arriving one at a time.
