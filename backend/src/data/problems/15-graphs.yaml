      python: |
        import sys
        from collections import deque
        from typing import List, Tuple


        def count_cyclic_components(n: int, adj: List[List[Tuple[int, int]]]) -> int:
            visited = [False] * n
            cyclic = 0
            for start in range(n):
                if visited[start]:
                    continue
                visited[start] = True
                queue = deque([(start, -1)])
                found = False
                while queue:
                    node, came_by = queue.popleft()
                    for nxt, edge_id in adj[node]:
                        if edge_id == came_by:
                            continue
                        if visited[nxt]:
                            found = True
                        else:
                            visited[nxt] = True
                            queue.append((nxt, edge_id))
                if found:
                    cyclic += 1
            return cyclic


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            adj: List[List[Tuple[int, int]]] = [[] for _ in range(n)]
            for i in range(m):
                u, v = int(data[2 + 2 * i]), int(data[3 + 2 * i])
                adj[u].append((v, i))
                adj[v].append((u, i))
            print(count_cyclic_components(n, adj))


        if __name__ == "__main__":
            main()
