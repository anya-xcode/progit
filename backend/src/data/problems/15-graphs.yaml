    title: "Detect Cycle in a Directed Graph"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "Topo Sort"
    tags: [graph, dfs, topological-sort]
    sourceUrl: ""
    statement: |
      Given a **directed** graph with `n` nodes and `m` edges, decide whether it
      contains a directed cycle: a sequence of edges that follows the edge
      directions and returns to its starting node. A self-loop `u → u` counts as a
      cycle. The graph may be disconnected.
    inputFormat: |
      - Line 1: two integers `n` and `m`, the number of nodes (labelled `0` to `n - 1`) and edges.
      - Next `m` lines: two integers `u v` describing an edge.
      Each edge `u v` goes from `u` to `v`.
    outputFormat: |
      Print `true` if the graph has a directed cycle, otherwise `false`.
    constraints:
      - "1 <= n <= 10^4"
      - "0 <= m <= 10^4"
      - "0 <= u, v < n"
    examples:
      - input: |
          4 4
          0 1
          1 2
          2 3
          3 1
        output: |
          true
        explanation: "Following 1 → 2 → 3 → 1 returns to node 1."
      - input: |
          4 4
          0 1
          0 2
          1 3
          2 3
        output: |
          false
        explanation: "Node 3 is reachable along two different routes, but no route leads back to an earlier node."
    hints:
      - "A plain 'visited' flag is not enough: example 2 revisits node 3 without any cycle."
      - "Track which nodes are on the current DFS path. An edge to a node on the path closes a cycle."
      - "Alternatively, Kahn's algorithm removes nodes with in-degree 0; if some nodes are never removed, a cycle exists."
    explanation: |
      **Reachability from each node — O(n · (n + m)) time.** For each node `u`, check
      whether `u` can be reached again from its out-neighbours.

      **DFS with three states — O(n + m) time, O(n) space.** Mark nodes as unvisited,
      *in progress* (on the recursion stack) or *done*. When DFS from `u` meets a
      neighbour that is in progress, that edge points back into the current path
      and forms a cycle. Mark `u` done after all its neighbours are processed.
      Run DFS from every unvisited node.

      **Kahn's algorithm — O(n + m) time, O(n) space.** Compute in-degrees and
      repeatedly remove nodes of in-degree 0, decrementing their neighbours. Nodes
      on a cycle never reach in-degree 0, so the graph is acyclic exactly when all
      `n` nodes get removed.
