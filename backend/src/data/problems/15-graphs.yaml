    referenceSolution:
      python: |
        import sys
        from typing import List


        def swim_in_water(grid: List[List[int]]) -> int:
            n = len(grid)
            if n == 1:
                return grid[0][0]
            position = [0] * (n * n)
            for r in range(n):
                for c in range(n):
                    position[grid[r][c]] = r * n + c

            parent = list(range(n * n))
            size = [1] * (n * n)
            active = [False] * (n * n)

            def find(x: int) -> int:
                root = x
                while parent[root] != root:
                    root = parent[root]
                while parent[x] != root:
                    parent[x], x = root, parent[x]
                return root

            def union(a: int, b: int) -> None:
                ra, rb = find(a), find(b)
                if ra == rb:
                    return
                if size[ra] < size[rb]:
                    ra, rb = rb, ra
                parent[rb] = ra
                size[ra] += size[rb]

            last = n * n - 1
            for time in range(n * n):
                cell = position[time]
                active[cell] = True
                r, c = divmod(cell, n)
                for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                    nr, nc = r + dr, c + dc
                    if 0 <= nr < n and 0 <= nc < n and active[nr * n + nc]:
                        union(cell, nr * n + nc)
                if active[0] and active[last] and find(0) == find(last):
                    return time
            return -1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            grid = [[int(x) for x in data[1 + r * n:1 + (r + 1) * n]] for r in range(n)]
            print(swim_in_water(grid))


        if __name__ == "__main__":
            main()
