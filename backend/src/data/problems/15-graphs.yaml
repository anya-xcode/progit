    referenceSolution:
      python: |
        import sys
        from typing import List


        def count_scc(n: int, adj: List[List[int]]) -> int:
            visited = [False] * n
            finish_order: List[int] = []
            for start in range(n):
                if visited[start]:
                    continue
                visited[start] = True
                stack = [(start, 0)]
                while stack:
                    node, index = stack[-1]
                    if index < len(adj[node]):
                        stack[-1] = (node, index + 1)
                        nxt = adj[node][index]
                        if not visited[nxt]:
                            visited[nxt] = True
                            stack.append((nxt, 0))
                    else:
                        finish_order.append(node)
                        stack.pop()

            reverse: List[List[int]] = [[] for _ in range(n)]
            for node in range(n):
                for nxt in adj[node]:
                    reverse[nxt].append(node)

            assigned = [False] * n
            components = 0
            for start in reversed(finish_order):
                if assigned[start]:
                    continue
                components += 1
                assigned[start] = True
                todo = [start]
                while todo:
                    node = todo.pop()
                    for prev in reverse[node]:
                        if not assigned[prev]:
                            assigned[prev] = True
                            todo.append(prev)
            return components


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            adj: List[List[int]] = [[] for _ in range(n)]
            for i in range(m):
                u, v = int(data[2 + 2 * i]), int(data[3 + 2 * i])
                adj[u].append(v)
            print(count_scc(n, adj))


        if __name__ == "__main__":
            main()
