    slug: number-of-ways-to-arrive-at-destination
    title: "Number of ways to arrive at destination"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "Shortest Path"
    tags: [graph, dijkstra, counting, shortest-path]
    sourceUrl: "https://leetcode.com/problems/number-of-ways-to-arrive-at-destination/"
    statement: |
      A city has `n` intersections numbered `0` to `n - 1` joined by `m` two-way
      roads; a road `u v w` takes `w` minutes to drive in either direction. There is
      at most one road between any pair of intersections and no road joins an
      intersection to itself.

      You start at intersection `0` and want to reach intersection `n - 1` in the
      shortest possible time. Count **how many different routes** take exactly that
      minimum time. Two routes are different when their sequences of intersections
      differ.

      The answer can be huge, so print it modulo `10^9 + 7`. If intersection `n - 1`
      cannot be reached at all, the answer is `0`.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Next `m` lines: three integers `u v w` — a two-way road between `u` and `v`
        taking `w` minutes.
    outputFormat: |
      Print one integer: the number of shortest routes from `0` to `n - 1`, modulo
      `10^9 + 7`.
    constraints:
      - "1 <= n <= 200"
      - "0 <= m <= n * (n - 1) / 2"
      - "0 <= u, v < n and u != v"
      - "1 <= w <= 10^9"
      - "At most one road joins any pair of intersections."
    examples:
      - input: |
          7 10
          0 6 7
          0 1 2
          1 2 3
          1 3 3
          6 3 3
          3 5 1
          6 5 1
          2 5 1
          0 4 5
          4 6 2
        output: |
          4
        explanation: "The fastest trip takes 7 minutes and four routes achieve it: 0-6, 0-4-6, 0-1-2-5-6 and 0-1-3-5-6."
      - input: |
          4 4
          0 1 1
          0 2 1
          1 3 1
          2 3 1
        output: |
          2
        explanation: "Both 0-1-3 and 0-2-3 take 2 minutes, so the count is 2."
    hints:
      - "Run Dijkstra, but carry a second array: ways[v] = how many shortest routes reach v."
      - "When a relaxation strictly improves dist[v], the old count is worthless - overwrite it. When it merely ties, add to it."
      - "Because all times are positive, a route never revisits an intersection, so the 'shortest-path graph' is acyclic and the counts can never chase their own tail."
    explanation: |
      **Brute force — exponential.** Enumerating routes and keeping the fastest ones
      is hopeless even for `n = 20`.

      **Dijkstra + counting — O((n + m) log n) time, O(n) space.** Keep `dist[v]` and
      `ways[v]` side by side, starting from `dist[0] = 0`, `ways[0] = 1`. When the
      edge `u - v` of weight `w` is relaxed from a settled `u`:

      - `dist[u] + w < dist[v]`: a strictly faster route was found. Overwrite
        `dist[v]`, set `ways[v] = ways[u]` (every route to `u` extends to exactly one
        route to `v`) and push the new distance.
      - `dist[u] + w == dist[v]`: another equally fast way in, so
        `ways[v] += ways[u]`; the distance is unchanged, so nothing is pushed.

      The counts are correct because Dijkstra settles nodes in non-decreasing
      distance order: when `u` is popped, `ways[u]` is already final, and since every
      weight is at least `1` all predecessors of `v` on shortest routes are strictly
      closer and therefore settled before `v`.

      **Keep the numbers small.** Reduce `ways[v]` modulo `10^9 + 7` at every
      addition. Never take the *distances* modulo anything — comparisons would break.

      **Why no road repeats and no self-loop.** Two parallel roads of the same length
      would be two routes through the same sequence of intersections, and the problem
      counts sequences of intersections; ruling them out keeps the statement exact.

      **Cross-check — O(n^3).** Run Floyd-Warshall for all-pairs distances, sort the
      intersections by distance from `0`, then set
      `ways[v] = sum of ways[u]` over roads `u - v` with `dist[u] + w == dist[v]`,
      taking the intersections in that order. A completely different route to the
      same number, and practical whenever `n` is a few hundred.
