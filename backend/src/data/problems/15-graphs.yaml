    slug: dfs
    title: "DFS"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "Learning"
    tags: [graph, dfs, traversal]
    sourceUrl: ""
    statement: |
      Run a depth-first search over an **undirected** graph with `n` nodes numbered
      `0` to `n - 1` and `m` edges, and report the two timestamps DFS produces for
      every node.

      - The **entry order** (preorder) lists nodes in the order the search first
        arrives at them.
      - The **exit order** (postorder) lists nodes in the order the search *leaves*
        them — a node is left only after every node reachable through its unused
        edges has been dealt with.

      To make the answer unique the search obeys two rules:

      1. It restarts from the smallest-numbered unvisited node whenever the current
         piece of the graph is exhausted, so every node is reported.
      2. At each node the neighbours are tried in **increasing** order of node
         number.

      The graph may be disconnected, and the edge list may contain self-loops and
      repeated edges.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Next `m` lines: two integers `u v`, an undirected edge between `u` and `v`.
    outputFormat: |
      - Line 1: the `n` nodes in DFS entry order, space-separated.
      - Line 2: the `n` nodes in DFS exit order, space-separated.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= m <= 2 * 10^5"
      - "0 <= u, v < n"
      - "Self-loops (u == v) and repeated edges may appear."
    examples:
      - input: |
          7 6
          0 1
          0 2
          1 3
          1 4
          2 5
          2 6
        output: |
          0 1 3 4 2 5 6
          3 4 1 5 6 2 0
        explanation: "The search goes 0, 1, 3; node 3 is a dead end so it is left first, then 4 is entered and left, then 1 is left, and the same happens down the branch 2, 5, 6. A node's exit always comes after the exits of everything below it."
      - input: |
          4 4
          0 1
          1 2
          2 0
          0 3
        output: |
          0 1 2 3
          2 1 3 0
        explanation: "From 0 the search enters 1, then 2; from 2 the only unused neighbour is 0, which is already visited, so 2 is left, then 1. Back at 0 the neighbour 3 is entered and left, and finally 0 is left last."
    hints:
      - "Sort every adjacency list first; the traversal then just walks each list from left to right."
      - "A node's exit time is recorded when its adjacency list is exhausted — that is the moment the recursive call would return."
      - "With an explicit stack, store a pair (node, index-of-next-neighbour) so you can resume where you stopped instead of restarting the list."
    explanation: |
      **Recursive picture.** `dfs(u)` records `u` in the entry list, loops over
      `adj[u]` and recurses into unvisited neighbours, then records `u` in the exit
      list. Each node is entered once and each edge is looked at twice (once from
      each endpoint), so the cost is `O(n + m)` time and `O(n)` space.

      **Why the exit order is worth computing.** It is the raw material of several
      later algorithms: reversing it gives a topological order of a DAG, and it is
      the first pass of Kosaraju's algorithm for strongly connected components. It
      is also the only place where "post-order" on a general graph is defined, so it
      is worth being able to produce it on demand.

      **Iterative version — the part people get wrong.** A naive stack of nodes
      cannot produce exit times, because when you pop a node you do not know whether
      its children have finished. The fix is to keep a *frame* on the stack: the node
      plus the index of the next neighbour to examine.

      - If the index is still inside `adj[node]`, advance it by one and, if that
        neighbour is unvisited, mark it, append it to the entry list and push a new
        frame.
      - Otherwise the node is finished: pop it and append it to the exit list.

      This reproduces the recursive order exactly — including the entry order — while
      using heap memory instead of the interpreter stack, which matters because
      Python's default recursion limit is about 1000 and a path graph is `n` deep.

      **Do not sort inside the traversal.** Sorting once costs `O(m log m)` in total;
      sorting `adj[node]` each time a node is popped would multiply that by the
      number of pops.
