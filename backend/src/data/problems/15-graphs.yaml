      python: |
        import sys
        from collections import deque
        from typing import List


        def number_of_enclaves(grid: List[List[int]]) -> int:
            rows, cols = len(grid), len(grid[0])
            escaped = [[False] * cols for _ in range(rows)]
            queue: deque = deque()
            for r in range(rows):
                for c in range(cols):
                    on_border = r == 0 or c == 0 or r == rows - 1 or c == cols - 1
                    if on_border and grid[r][c] == 1:
                        escaped[r][c] = True
                        queue.append((r, c))
            while queue:
                r, c = queue.popleft()
                for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                    nr, nc = r + dr, c + dc
                    if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 1 and not escaped[nr][nc]:
                        escaped[nr][nc] = True
                        queue.append((nr, nc))
            return sum(1 for r in range(rows) for c in range(cols) if grid[r][c] == 1 and not escaped[r][c])


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            rows, cols = int(data[0]), int(data[1])
            grid = [[int(x) for x in data[2 + r * cols:2 + (r + 1) * cols]] for r in range(rows)]
            print(number_of_enclaves(grid))


        if __name__ == "__main__":
            main()
