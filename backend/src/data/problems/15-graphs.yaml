    difficulty: Easy
    topic: "Graphs"
    subtopic: "MST/Disjoint Set"
    tags: [graph, theory, mst]
    sourceUrl: ""
    statement: |
      Take a **connected, undirected, weighted** graph with `n` nodes. A **spanning
      tree** is a subset of its edges that

      - keeps every node connected, and
      - contains no cycle.

      Any such subset has exactly `n - 1` edges — that is forced, not a coincidence:
      fewer edges cannot connect `n` nodes, more edges must close a cycle.

      A **minimum spanning tree (MST)** is a spanning tree whose total edge weight is
      as small as possible. It is the cheapest way to wire up every node: the classic
      picture is laying cable so that all `n` houses are on one network for the least
      money.

      ## Facts that make the algorithms work

      - **Cut property.** Split the nodes into any two non-empty groups. The
        cheapest edge crossing that split belongs to some MST. (If its weight is
        strictly smaller than every other crossing edge, it belongs to *every* MST.)
        Both Prim and Kruskal are just this property applied repeatedly.
      - **Cycle property.** For any cycle, an edge that is strictly heavier than all
        other edges of that cycle is in no MST.
      - **Uniqueness.** If all edge weights are distinct, the MST is unique. With
        ties there may be several MSTs — but they all have the same total weight.
      - A disconnected graph has no spanning tree at all. Running an MST algorithm on
        it produces a **minimum spanning forest**, one tree per component.
      - The MST minimises the *total* weight. It does **not** give shortest paths —
        the path between two nodes inside the MST can be much longer than their true
        shortest path. What the MST does guarantee is the *bottleneck*: the path
        between `a` and `b` inside the MST minimises the largest edge on the route.

      ## The two algorithms

      **Prim — grow one tree.** Keep a set `S` that starts with a single node.
      Repeatedly add the cheapest edge leaving `S` (the cut property says it is
      safe), which pulls one new node in. With a binary heap of candidate edges the
      cost is `O(m log n)`; with a plain array scan it is `O(n^2)`, which is better
      on dense graphs.

      **Kruskal — merge a forest.** Sort all edges by weight and scan them in
      order, keeping an edge only when its two endpoints are still in different
      components. A Disjoint Set Union answers "different components?" in almost
      constant time, so the cost is `O(m log m)` — dominated by the sort.

      Both are greedy and both are provably optimal.
    explanation: |
      **Choosing between them**

      | | Prim (heap) | Kruskal |
      | --- | --- | --- |
      | Time | `O(m log n)` | `O(m log m)` (sorting) |
      | Needs | adjacency list + priority queue | edge list + DSU |
      | Dense graph (`m ~ n^2`) | `O(n^2)` array version wins | sorting `n^2` edges is slower |
      | Edges given as a list, `n` large | needs building the adjacency list | natural fit |
      | Detects a disconnected graph | tree stops growing before `n` nodes | fewer than `n - 1` edges are kept |

      **Traps**

      - Parallel edges and self-loops are harmless: a self-loop never joins two
        components, and only the cheapest parallel edge can ever be picked.
      - In Prim, push *edges* into the heap, not nodes-with-stale-keys, and skip a
        popped entry whose endpoint is already in the tree. Without that skip the
        algorithm silently adds a cycle.
      - Check connectivity before you trust the answer: if Prim ends with fewer than
        `n` nodes in the tree, or Kruskal accepts fewer than `n - 1` edges, there is
        no spanning tree.
      - Negative weights are fine for MST (unlike Dijkstra) — the greedy argument
        never assumes non-negativity.
      - "Maximum spanning tree" is the same code with the comparison flipped, or with
        the weights negated.
