  - sheetId: prob-15-3-2-topological-sort-or-kahns
    slug: topological-sort-or-kahn-s-algorithm
    title: "Topological sort or Kahn's algorithm"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "Topo Sort"
    tags: [graph, topological-sort, bfs, heap]
    sourceUrl: ""
    statement: |
      You are given a **directed** graph with `n` nodes numbered `0` to `n - 1` and
      `m` edges. Unlike the guaranteed-acyclic version of this task, **the graph may
      contain a cycle**, and repeated edges and self-loops may appear.

      A **topological order** lists all `n` nodes so that for every edge `u -> v` the
      node `u` appears somewhere before `v`. Such an order exists exactly when the
      graph has no directed cycle.

      If no topological order exists, say so. Otherwise, because a graph usually has
      many of them, print the **lexicographically smallest** one: among all valid
      orders, take the one whose first position where two orders differ holds the
      smaller node number.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Next `m` lines: two integers `u v`, a directed edge from `u` to `v`.
    outputFormat: |
      Print `-1` if the graph has no topological order. Otherwise print the `n` node
      numbers of the lexicographically smallest topological order, space-separated on
      one line.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= m <= 2 * 10^5"
      - "0 <= u, v < n"
      - "Self-loops (u == v) and repeated edges may appear."
    examples:
      - input: |
          6 6
          5 2
          5 0
          4 0
          4 1
          2 3
          3 1
        output: |
          4 5 0 2 3 1
        explanation: "Nodes 4 and 5 have no prerequisites; the smaller one, 4, goes first. That frees nothing on its own (0 still waits for 5, 1 still waits for 3), so 5 follows, then 0, then 2, 3 and finally 1."
      - input: |
          3 3
          0 1
          1 2
          2 0
        output: |
          -1
        explanation: "The three edges form the cycle 0 -> 1 -> 2 -> 0, so no node can ever come first and no topological order exists."
    hints:
      - "A node may be printed only once every edge entering it has been printed - count those edges as its in-degree."
      - "Keep every node whose in-degree has dropped to zero in a container and always take the smallest one from it: that is a min-heap, not a queue."
      - "If the loop stops with fewer than n nodes emitted, the nodes left behind all have an incoming edge - they form a cycle."
    explanation: |
      **Kahn's algorithm — O(n + m) time, O(n) space (plain queue version).** Count
      `indegree[v]` for every node. Put all nodes of in-degree `0` into a container.
      Repeatedly take one out, append it to the order and decrease the in-degree of
      each of its out-neighbours; a neighbour that reaches `0` joins the container.
      Every edge is relaxed once, every node enters the container once.

      **Making the answer unique — O(n log n + m log n).** A plain FIFO queue gives
      *some* topological order. Replacing it with a **min-heap** always emits the
      smallest currently available node, which is exactly the greedy rule for the
      lexicographically smallest order: at every position, choosing any larger node
      would give a lexicographically larger result, and choosing the smallest
      available node never blocks the rest (the remaining graph stays acyclic).
      Each push and pop costs `O(log n)`.

      **Cycle detection comes for free.** If the graph has a cycle, no node of that
      cycle ever reaches in-degree `0`, so the loop ends with fewer than `n` emitted
      nodes — that is the `-1` case. A self-loop `u -> u` gives `u` an in-degree it
      can never lose, so it is handled by the same test. Repeated edges simply add to
      the in-degree and are decremented the same number of times, so they are safe
      too.

      **DFS alternative — O(n + m).** Run a DFS and push each node onto a list when
      it is finished; reversing that list is a topological order. It is elegant, but
      it does **not** produce the lexicographically smallest order (that would need
      the reverse-graph trick with a max-heap), and it needs a separate three-colour
      check for cycles. Kahn's version is the natural fit when the output has to be
      the smallest one.
    starterCode:
