    referenceSolution:
      python: |
        import sys
        from typing import List

        WHITE, GREY, BLACK = 0, 1, 2


        def count_back_edges(n: int, adj: List[List[int]]) -> int:
            colour = [WHITE] * n
            back = 0
            for start in range(n):
                if colour[start] != WHITE:
                    continue
                colour[start] = GREY
                stack = [[start, 0]]
                while stack:
                    frame = stack[-1]
                    node, index = frame[0], frame[1]
                    if index < len(adj[node]):
                        frame[1] = index + 1
                        nxt = adj[node][index]
                        if colour[nxt] == GREY:
                            back += 1
                        elif colour[nxt] == WHITE:
                            colour[nxt] = GREY
                            stack.append([nxt, 0])
                    else:
                        colour[node] = BLACK
                        stack.pop()
            return back


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            adj: List[List[int]] = [[] for _ in range(n)]
            for i in range(m):
                u, v = int(data[2 + 2 * i]), int(data[3 + 2 * i])
                adj[u].append(v)
            for row in adj:
                row.sort()
            back_edges = count_back_edges(n, adj)
            print("true" if back_edges > 0 else "false")
            print(back_edges)


        if __name__ == "__main__":
            main()
