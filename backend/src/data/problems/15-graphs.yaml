  - sheetId: prob-15-4-10-minimum-multiplications-t
    slug: minimum-multiplications-to-reach-end
    title: "Minimum multiplications to reach end"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "Shortest Path"
    tags: [graph, bfs, modular-arithmetic, shortest-path]
    sourceUrl: ""
    statement: |
      You hold a number `start` and are given `n` multipliers. One **step** is:
      pick any multiplier `a` and replace your current number `x` by
      `(x * a) mod 100000`. The same multiplier may be used any number of times.

      Find the smallest number of steps needed to turn `start` into `end`.

      Since several different chains of values may be equally short, report the chain
      of values only when there is exactly one shortest chain; otherwise report the
      number of steps alone. Two chains are the same when they list the same values
      in the same order, even if different multipliers produced them.
    inputFormat: |
      - Line 1: an integer `n`, the number of multipliers.
      - Line 2: `n` space-separated integers, the multipliers.
      - Line 3: two integers `start` and `end`.
    outputFormat: |
      If `end` cannot be reached, print `-1` on a single line and nothing else.

      Otherwise:

      - Line 1: the minimum number of steps (`0` when `start == end`).
      - Line 2: if exactly one shortest chain exists, its values from `start` to
        `end` separated by spaces; otherwise the word `MULTIPLE`.
    constraints:
      - "1 <= n <= 20"
      - "0 <= multiplier < 100000"
      - "0 <= start, end < 100000"
    examples:
      - input: |
          2
          3 5
          2 90
        output: |
          3
          MULTIPLE
        explanation: "Three steps are needed, for instance 2 -> 6 -> 18 -> 90 or 2 -> 10 -> 30 -> 90. Because the factors can be applied in different orders, more than one shortest chain exists."
      - input: |
          1
          2
          1 1024
        output: |
          10
          1 2 4 8 16 32 64 128 256 512 1024
        explanation: "Only the multiplier 2 is available, so the chain is forced: ten doublings turn 1 into 1024, and no other chain of length ten exists."
    hints:
      - "The numbers 0 .. 99999 are the nodes and every multiplier gives one outgoing edge per node; every edge costs one step, so this is a shortest-path question on an unweighted graph."
      - "The graph is never built - generate a node's successors on the fly inside the BFS loop."
      - "Two multipliers can send the same value to the same successor; collapse them into a set before counting chains, otherwise one chain looks like two."
    explanation: |
      **The hidden graph.** Think of every residue `0 .. 99999` as a node. From node
      `x` there is an edge to `(x * a) mod 100000` for each multiplier `a`. Every step
      costs the same, so the fewest steps is a shortest path in an unweighted graph —
      BFS territory.

      **BFS — O(100000 . n) time, O(100000) space.** Start from `start` at distance
      `0` and expand level by level. Because the state space is a fixed 100000
      entries, plain arrays are faster than dictionaries here. Stop as soon as a node
      at or beyond `end`'s level is popped: nothing deeper can improve anything.

      Do **not** try to search backwards from `end` naively — dividing modulo
      `100000` is not always possible, since multipliers sharing a factor with
      `100000` are not invertible.

      **Counting shortest chains.** Carry `ways[v]`, capped at `2`; a node discovered
      at the next level inherits its predecessor's count, and another predecessor on
      the same level adds to it. Deduplicating a node's successors with a `set`
      matters: if two multipliers map `x` to the same value, the chain of *values* is
      the same one, and counting it twice would wrongly print `MULTIPLE`.

      **Rebuilding.** Store `came[v]`, the node from which `v` was first discovered.
      When `ways[end] == 1` that predecessor is the only one, so following `came`
      back to `start` and reversing gives the chain.

      **Why `MULTIPLE` is the normal answer.** Multiplication is commutative, so a
      chain that uses factors `a` then `b` usually has a twin that uses `b` then `a`,
      with a different middle value. Unique chains show up when only one multiplier
      can be used, or when the answer is a single step.

      **Cross-check.** Compute the distance from `start` (forward BFS) and the
      distance to `end` (BFS on the reversed edges, built only for the states that
      `start` can reach). A state lies on some shortest chain exactly when the two
      distances add up to the answer `L`, and the chain is unique exactly when there
      are `L + 1` such states.
    starterCode:
