  - slug: bellman-ford-algorithm
    title: "Bellman-Ford Algorithm"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "Shortest Path"
    tags: [graph, shortest-path, bellman-ford]
    sourceUrl: ""
    statement: |
      You are given a weighted **directed** graph with `n` nodes and `m` edges and a
      source node `src`. Edge weights may be **negative**.

      - If a cycle with negative total weight can be **reached from `src`**, then
        shortest distances are not well defined: print just `-1`.
      - Otherwise print the shortest distance from `src` to every node, writing
        `INF` for nodes that cannot be reached.

      A negative cycle that `src` cannot reach does not matter.
    inputFormat: |
      - Line 1: three integers `n`, `m` and `src`.
      - Next `m` lines: three integers `u v w` — a directed edge from `u` to `v` with weight `w`.
    outputFormat: |
      Print `-1` if a negative cycle is reachable from `src`. Otherwise print `n` space-separated values: the distance to nodes `0, ..., n - 1`, or `INF` when unreachable.
    constraints:
      - "1 <= n <= 500"
      - "0 <= m <= 2000"
      - "0 <= u, v, src < n"
      - "-1000 <= w <= 1000"
    examples:
      - input: |
          4 5 0
          0 1 4
          0 2 5
          1 2 -3
          2 3 2
          1 3 6
        output: |
          0 4 1 3
        explanation: "The negative edge makes 0 → 1 → 2 cost 1, cheaper than the direct edge of 5, and 3 is then reached with 1 + 2 = 3."
      - input: |
          3 3 0
          0 1 1
          1 2 -1
          2 1 -1
        output: |
          -1
        explanation: "The cycle 1 → 2 → 1 has total weight -2 and is reachable from 0, so distances can decrease forever."
    hints:
      - "Dijkstra's greedy choice breaks with negative edges. What if you simply relaxed every edge many times?"
      - "A shortest path without cycles uses at most n - 1 edges, so n - 1 rounds of relaxing all edges are enough."
      - "If some edge can still be relaxed in an n-th round, a reachable negative cycle exists. Only relax edges whose start node has a finite distance."
    explanation: |
      **Bellman-Ford — O(n · m) time, O(n) space.** Initialise `dist[src] = 0` and all
      other distances to infinity. Repeat `n - 1` times: for every edge `u → v` with
      finite `dist[u]`, set `dist[v] = min(dist[v], dist[u] + w)`. Any shortest
      simple path has at most `n - 1` edges, so all distances are final after these
      rounds — unless a negative cycle is reachable. Run one more round: if any
      edge still improves a distance, report `-1`.

      **Early exit.** Stop as soon as a whole round changes nothing; this is often
      much faster in practice but keeps the same worst case.

      **SPFA (queue-based Bellman-Ford).** Only re-relax edges out of nodes whose
      distance changed. Average performance is good, worst case is still
      `O(n · m)`, and negative cycles are detected by counting how many times a
      node is enqueued.
    starterCode:
      python: |
        import sys
        from typing import List, Optional


        def bellman_ford(n: int, edges: List[List[int]], src: int) -> Optional[List[Optional[int]]]:
            # Return None if a negative cycle is reachable; otherwise distances with None for unreachable nodes.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m, src = int(data[0]), int(data[1]), int(data[2])
            edges = [[int(data[3 + 3 * i]), int(data[4 + 3 * i]), int(data[5 + 3 * i])] for i in range(m)]
            result = bellman_ford(n, edges, src)
            if result is None:
                print(-1)
            else:
                print(" ".join("INF" if d is None else str(d) for d in result))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List, Optional


        def bellman_ford(n: int, edges: List[List[int]], src: int) -> Optional[List[Optional[int]]]:
            dist: List[Optional[int]] = [None] * n
            dist[src] = 0
            for _ in range(n - 1):
                changed = False
                for u, v, w in edges:
                    if dist[u] is not None and (dist[v] is None or dist[u] + w < dist[v]):
                        dist[v] = dist[u] + w
                        changed = True
                if not changed:
                    break
            for u, v, w in edges:
                if dist[u] is not None and (dist[v] is None or dist[u] + w < dist[v]):
                    return None
            return dist


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m, src = int(data[0]), int(data[1]), int(data[2])
            edges = [[int(data[3 + 3 * i]), int(data[4 + 3 * i]), int(data[5 + 3 * i])] for i in range(m)]
            result = bellman_ford(n, edges, src)
            if result is None:
                print(-1)
            else:
                print(" ".join("INF" if d is None else str(d) for d in result))


        if __name__ == "__main__":
            main()
