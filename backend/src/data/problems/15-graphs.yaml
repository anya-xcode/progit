    slug: network-delay-time
    title: "Network Delay Time"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "Shortest Path"
    tags: [graph, dijkstra, shortest-path, heap]
    sourceUrl: "https://leetcode.com/problems/network-delay-time/"
    statement: |
      A network has `n` nodes numbered `0` to `n - 1` joined by `m` **directed**
      links. A link `u v w` means a signal sent from `u` arrives at `v` exactly `w`
      time units later.

      At time `0` node `src` sends a signal. A node forwards the signal along all of
      its outgoing links the instant it first receives it, so a node receives the
      signal at the earliest total delay of any directed route from `src` to it.

      Report the moment the **last** node receives the signal. If at least one node
      never receives it, report `-1`. Self-loops and parallel links may appear.
    inputFormat: |
      - Line 1: three integers `n`, `m` and `src`.
      - Next `m` lines: three integers `u v w` — a directed link from `u` to `v` with
        delay `w`.
    outputFormat: |
      Print one integer: the time at which every node has received the signal, or
      `-1` if some node never does.
    constraints:
      - "1 <= n <= 10^4"
      - "0 <= m <= 5 * 10^4"
      - "0 <= u, v, src < n"
      - "0 <= w <= 10^4"
      - "Self-loops and parallel links may appear."
    examples:
      - input: |
          4 4 2
          2 1 1
          2 3 1
          3 0 1
          1 3 3
        output: |
          2
        explanation: "Node 2 gets the signal at time 0, nodes 1 and 3 at time 1, and node 0 at time 2 (via 3). The route 2-1-3 would take 4, but 3 has already been reached at time 1. The last arrival is at time 2."
      - input: |
          3 2 0
          0 1 5
          0 1 2
        output: |
          -1
        explanation: "Node 1 is reached at time 2 through the cheaper of the two parallel links, but node 2 has no incoming link at all, so the signal never gets everywhere."
    hints:
      - "'When does the last node hear it?' is just the largest of the shortest distances from src."
      - "Delays are never negative, so Dijkstra applies; a min-heap keeps each step cheap."
      - "Do the 'did everyone hear it?' check at the end by looking for an infinite distance - do not special-case it during the search."
    explanation: |
      **Restating the task.** The time a node receives the signal is the shortest
      distance from `src` to it, where the weight of a link is its delay. The answer
      is therefore `max` over all nodes of that distance, and `-1` when any distance
      is infinite.

      **Dijkstra with a binary heap — O((n + m) log n) time, O(n + m) space.** Push
      `(0, src)`. Pop the smallest pair; if its recorded distance is already better,
      the entry is stale — skip it. Otherwise relax every outgoing link: if
      `d + w < dist[v]`, store the better value and push it. Non-negative delays
      guarantee a popped node's distance is final.

      **Alternatives.**

      - *Dijkstra with a linear scan* — `O(n^2 + m)`. Better on a dense network, and
        a one-line change.
      - *Bellman-Ford* — `O(n . m)`. Relax every link `n - 1` times. Slower, but it
        handles negative weights and is the easiest independent check for small
        inputs.
      - *Floyd-Warshall* — `O(n^3)`. Computes all pairs when only one row is needed;
        fine for a cross-check on tiny graphs, far too slow otherwise.
      - *BFS* — only correct when every delay is the same.

      **Details.** A self-loop is never a useful relaxation (`d + w < d` fails for
      `w >= 0`). Parallel links are relaxed independently, so the cheapest one wins
      automatically; there is no need to deduplicate. `max(dist)` already covers
      `src` itself, whose distance is `0`.
