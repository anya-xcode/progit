      python: |
        import sys
        from typing import List, Tuple


        def city_with_fewest_neighbours(n: int, edges: List[Tuple[int, int, int]], threshold: int) -> int:
            inf = float("inf")
            dist = [[inf] * n for _ in range(n)]
            for city in range(n):
                dist[city][city] = 0
            for u, v, w in edges:
                if w < dist[u][v]:
                    dist[u][v] = w
                    dist[v][u] = w
            for via in range(n):
                row_via = dist[via]
                for i in range(n):
                    step = dist[i][via]
                    if step == inf:
                        continue
                    row_i = dist[i]
                    for j in range(n):
                        if step + row_via[j] < row_i[j]:
                            row_i[j] = step + row_via[j]
            best_city = -1
            best_count = n + 1
            for city in range(n):
                reachable = sum(1 for other in range(n) if other != city and dist[city][other] <= threshold)
                if reachable <= best_count:
                    best_count = reachable
                    best_city = city
            return best_city


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m, threshold = int(data[0]), int(data[1]), int(data[2])
            edges: List[Tuple[int, int, int]] = []
            for i in range(m):
                u = int(data[3 + 3 * i])
                v = int(data[4 + 3 * i])
                w = int(data[5 + 3 * i])
                edges.append((u, v, w))
            print(city_with_fewest_neighbours(n, edges, threshold))


        if __name__ == "__main__":
            main()
