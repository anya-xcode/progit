  - slug: surrounded-regions
    title: "Surrounded Regions"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "BFS/DFS"
    tags: [graph, dfs, bfs, matrix]
    sourceUrl: "https://leetcode.com/problems/surrounded-regions/"
    statement: |
      A board contains the characters `X` and `O`. A **region** is a maximal group
      of `O` cells connected horizontally or vertically. A region is
      **surrounded** if none of its cells lies on the outer border of the board —
      such a region is completely enclosed by `X` cells.

      Replace every `O` in every surrounded region with `X`. Regions that touch the
      border stay as they are.
    inputFormat: |
      - Line 1: two integers `rows` and `cols`.
      - Next `rows` lines: a string of exactly `cols` characters, each `X` or `O` (no spaces).
    outputFormat: |
      Print the resulting board: `rows` lines, each a string of `cols` characters.
    constraints:
      - "1 <= rows, cols <= 50"
      - "rows * cols <= 1000"
      - "Each character is X or O"
    examples:
      - input: |
          4 5
          XXXXX
          XOXOX
          XOXOO
          XXXXX
        output: |
          XXXXX
          XXXOX
          XXXOO
          XXXXX
        explanation: "The O region in column 1 is enclosed and gets captured. The region in columns 3–4 reaches the right border at (2, 4), so it survives."
      - input: |
          3 3
          OOO
          OXO
          OOO
        output: |
          OOO
          OXO
          OOO
        explanation: "Every O is on the border, so nothing is captured."
    hints:
      - "Deciding for each region whether it is enclosed is awkward. Which O cells are definitely safe?"
      - "Any O connected to a border O is safe. Start a traversal from every border O and mark what you reach."
      - "Afterwards, every unmarked O is surrounded."
    explanation: |
      **Check every region — O(R·C) time, O(R·C) space.** Find each region with BFS,
      remember whether any of its cells is on the border, and flip the whole region
      if not. Correct, but needs care to avoid re-exploring regions.

      **Mark from the border — O(R·C) time, O(R·C) space.** Launch BFS/DFS from every
      `O` on the four borders and mark all `O` cells reachable from them (for
      example with a temporary character). Then scan the board: unmarked `O`
      becomes `X`, and marked cells are restored to `O`. Each cell is visited a
      constant number of times.
