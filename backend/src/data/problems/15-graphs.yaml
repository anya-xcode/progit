            n, m = int(data[0]), int(data[1])
            adj: List[List[int]] = [[] for _ in range(n)]
            for i in range(m):
                u, v = int(data[2 + 2 * i]), int(data[3 + 2 * i])
                adj[u].append(v)
            print(" ".join(map(str, topo_sort(n, adj))))


