    slug: cycle-detection-in-directed-graph-dfs
    title: "Cycle Detection in Directed Graph (DFS)"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "BFS/DFS"
    tags: [graph, dfs, cycle, directed]
    sourceUrl: ""
    statement: |
      You are given a **directed** graph with `n` nodes numbered `0` to `n - 1` and
      `m` edges. Self-loops and repeated edges may appear, and the graph may be
      disconnected.

      Depth-first search classifies every edge it walks over. An edge `u -> v` is a
      **back edge** when, at the moment it is examined, `v` is still *on the current
      recursion stack* — the search entered `v` earlier and has not left it yet.
      A back edge always closes a directed cycle, and a directed graph has a cycle
      if and only if some DFS over it finds a back edge.

      How many back edges there are depends on the order DFS walks the graph, so the
      order is fixed here:

      1. Outer loop: try `0, 1, ..., n - 1` as starting nodes, and start a new
         search from a node only if it has not been visited yet.
      2. At a node, examine its outgoing edges in **increasing order of the target**
         node number; repeated edges are examined once each.

      Report whether the graph has a directed cycle, and how many back edges this
      exact DFS examines.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Next `m` lines: two integers `u v`, a directed edge from `u` to `v`.
    outputFormat: |
      - Line 1: `true` if the graph contains a directed cycle, otherwise `false`.
      - Line 2: the number of back edges the DFS described above examines.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= m <= 2 * 10^5"
      - "0 <= u, v < n"
      - "Self-loops (u == v) and repeated edges may appear."
    examples:
      - input: |
          5 6
          0 1
          1 2
          2 0
          1 3
          3 4
          4 1
        output: |
          true
          2
        explanation: "The DFS goes 0, 1, 2 and the edge 2 -> 0 points at 0, which is still open: one back edge. Back at 1 it enters 3 and 4, and 4 -> 1 points at the still open 1: a second back edge. Two cycles, two back edges."
      - input: |
          4 4
          0 1
          0 2
          1 3
          2 3
        output: |
          false
          0
        explanation: "This is a diamond. When the DFS examines 2 -> 3 the node 3 has already been finished, so that edge is a forward/cross edge, not a back edge. No back edge means no directed cycle."
    hints:
      - "Three states per node, not two: unvisited, on the stack (open), finished. A visited node is only dangerous while it is still open."
      - "A self-loop u -> u is examined while u is open, so it counts as a back edge - which is right, it is a cycle of length one."
      - "An edge to an already finished node is harmless; counting it would wrongly report a cycle in a diamond-shaped DAG."
    explanation: |
      **The three colours — O(n + m) time, O(n) space.** Give every node a colour:
      white (not seen), grey (entered, not yet left) and black (left). DFS paints a
      node grey on entry and black when its adjacency list is exhausted. While
      scanning `u -> v`:

      - `v` white: a tree edge, recurse into it;
      - `v` grey: a **back edge** — `v` is an ancestor of `u` in the current search,
        so `v -> ... -> u -> v` is a directed cycle;
      - `v` black: `v` is finished, so it cannot reach `u`; the edge closes no cycle.

      Using only a two-state `visited` array is the classic bug: in the diamond
      `0->1, 0->2, 1->3, 2->3` the edge `2 -> 3` meets a visited node and would be
      reported as a cycle.

      **Doing it without recursion.** A chain of 10^5 nodes overflows Python's
      stack, so keep frames `[node, next_neighbour_index]` on an explicit list. Push
      a frame when you paint a node grey, advance the index every time you examine
      one edge, and pop the frame (painting the node black) when the index reaches
      the end of the list. That reproduces the recursive order exactly, which matters
      because the required count is defined by that order.

      **Why the count is well defined.** Sorting each adjacency list and scanning
      start nodes in increasing order pins one specific DFS forest. Different orders
      can produce different numbers of back edges — for example `0->1, 0->2, 1->2`
      plus `2->1` — but whether *any* back edge exists never changes.

      **Cross-check with Kahn's algorithm — O(n + m).** Repeatedly remove nodes of
      in-degree zero; if fewer than `n` nodes come out, the graph has a cycle. It
      gives no back-edge count, but it is an independent way to confirm the first
      line of the answer.
