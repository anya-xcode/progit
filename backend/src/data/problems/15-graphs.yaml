  - slug: is-graph-bipartite
    title: "Is Graph Bipartite"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "BFS/DFS"
    tags: [graph, bfs, dfs, graph-coloring]
    sourceUrl: "https://leetcode.com/problems/is-graph-bipartite/"
    statement: |
      An undirected graph is **bipartite** if its nodes can be split into two groups
      so that every edge connects a node from one group with a node from the other
      group — equivalently, the nodes can be coloured with two colours so that no
      edge joins two nodes of the same colour.

      The graph has no self-loops or repeated edges and may be **disconnected**.
      Decide whether it is bipartite.
    inputFormat: |
      - Line 1: two integers `n` and `m`, the number of nodes (labelled `0` to `n - 1`) and edges.
      - Next `m` lines: two integers `u v` describing an edge.
      Each edge `u v` connects `u` and `v` in both directions.
    outputFormat: |
      Print `true` if the graph is bipartite, otherwise `false`.
    constraints:
      - "1 <= n <= 10^4"
      - "0 <= m <= 10^4"
      - "0 <= u, v < n, u != v"
      - "No edge appears twice"
    examples:
      - input: |
          4 4
          0 1
          1 2
          2 3
          3 0
        output: |
          true
        explanation: "Colour nodes 0 and 2 with one colour and 1 and 3 with the other."
      - input: |
          3 3
          0 1
          1 2
          2 0
        output: |
          false
        explanation: "In a triangle, two of the three nodes must share a colour while being adjacent."
    hints:
      - "Pick a colour for one node — the colours of all nodes in its component are then forced."
      - "Traverse with BFS or DFS and give each neighbour the opposite colour; a neighbour that already has the same colour is a contradiction."
      - "A graph is bipartite exactly when it has no odd-length cycle. Do not forget the other components."
    explanation: |
      **Brute force — O(2ⁿ · (n + m)) time.** Try all two-colourings. Only feasible
      for tiny graphs.

      **BFS / DFS colouring — O(n + m) time, O(n) space.** Keep `color[v] = -1` for
      uncoloured nodes. For each uncoloured node, colour it 0 and traverse its
      component; every uncoloured neighbour receives `1 - color[u]`, and a coloured
      neighbour with `color[v] == color[u]` proves the graph is not bipartite.

      **Union-Find — O((n + m) · α(n)) time.** For each node `u`, all its neighbours
      must be in the same group: union them together, and fail if any neighbour is
      already in `u`'s set.
