    slug: bridges-in-graph
    title: "Bridges in graph"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "Other Algorithms"
    tags: [graph, dfs, tarjan, bridges]
    sourceUrl: "https://leetcode.com/problems/critical-connections-in-a-network/"
    statement: |
      You are given an **undirected** graph with `n` nodes numbered `0` to `n - 1`
      and `m` edges. The graph may be disconnected, and the edge list may contain
      self-loops and parallel edges (two or more edges joining the same pair).

      An edge is a **bridge** when removing that single edge increases the number of
      connected components — in other words, it is the only link between two parts of
      the graph.

      List all the bridges.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Next `m` lines: two integers `u v`, an undirected edge between `u` and `v`.
    outputFormat: |
      - Line 1: the number of bridges `k`.
      - Next `k` lines: one bridge each, written `u v` with `u < v`, sorted in
        increasing order of `u` and then of `v`.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= m <= 2 * 10^5"
      - "0 <= u, v < n"
      - "Self-loops and parallel edges may appear."
    examples:
      - input: |
          5 5
          0 1
          1 2
          2 0
          1 3
          3 4
        output: |
          2
          1 3
          3 4
        explanation: "The triangle 0-1-2 has no bridge: removing any of its edges still leaves the other two. The edges 1-3 and 3-4 are each the only route to what lies beyond them, so both are bridges."
      - input: |
          4 4
          0 1
          1 2
          2 3
          3 0
        output: |
          0
        explanation: "Every edge of a cycle has an alternative route the other way round, so the graph has no bridge at all."
    hints:
      - "Run a DFS and record for each node the time it was discovered; an edge that leads back to an earlier node makes everything on the loop safe."
      - "Keep low[node] = the earliest discovery time reachable from the subtree of node using at most one non-tree edge. The tree edge parent-node is a bridge exactly when low[node] > discovery[parent]."
      - "Skip the edge you arrived by using its index, not the parent's number - with parallel edges the parent's number would hide a genuine second route."
    explanation: |
      **Brute force — O(m . (n + m)).** Remove one edge at a time and count the
      connected components; if the count grows, that edge was a bridge. Perfectly
      correct and the ideal cross-check, but far too slow at the limits.

      **Tarjan's algorithm — O(n + m) time, O(n) space.** Run a DFS and give each
      node a `discovery` time. Define

      ```
      low[node] = the smallest discovery time reachable from node's DFS subtree
                  using tree edges plus at most one back edge
      ```

      Compute it as the minimum of `discovery[node]`, the `low` of every child, and
      `discovery[v]` for every non-tree edge `node - v`. Then a tree edge
      `parent - node` is a bridge exactly when

      ```
      low[node] > discovery[parent]
      ```

      which says: nothing in `node`'s subtree can reach `parent` or anything above it
      without that edge. A back edge is never a bridge, because it always lies on a
      cycle with the tree path.

      **The parallel-edge trap.** The usual "skip the parent" rule is wrong when two
      edges join the same pair: the second copy is a genuine alternative route, but
      it looks like the parent and gets skipped, so the edge is wrongly reported as a
      bridge. Skipping the **edge index** used to arrive fixes it — that exact edge is
      ignored, every other edge, including its twin, is not. Self-loops are handled
      automatically: they lead to an already discovered node (the node itself) and
      change nothing.

      **Doing it without recursion.** Keep frames `[node, incoming_edge_id,
      next_index]` on an explicit stack. On entry give the node its discovery and
      `low` values; on exit pop it and fold its `low` into its parent's, checking the
      bridge condition at that moment. This mirrors the recursive version exactly and
      survives a 10^5-node chain, which plain recursion would not.

      **Disconnected graphs** are handled by starting a DFS from every undiscovered
      node; bridges in different components are found independently. Sorting the
      result at the end is what makes the output unique.
