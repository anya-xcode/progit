problems:
  - slug: number-of-provinces
    title: "Number of Provinces"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "BFS/DFS"
    tags: [graph, dfs, bfs, union-find]
    sourceUrl: "https://leetcode.com/problems/number-of-provinces/"
    statement: |
      There are `n` cities numbered `0` to `n - 1`. You are given an `n × n`
      matrix `connected` where `connected[i][j] = 1` means cities `i` and `j` have
      a direct road between them, and `0` means they do not. Roads work in both
      directions, so the matrix is symmetric, and `connected[i][i] = 1`.

      A **province** is a maximal group of cities in which every city can reach
      every other city, directly or through other cities of the group. Count the
      provinces.
    inputFormat: |
      - Line 1: an integer `n`.
      - Next `n` lines: `n` space-separated values (`0` or `1`), the matrix rows.
    outputFormat: |
      Print the number of provinces.
    constraints:
      - "1 <= n <= 45"
      - "connected[i][j] is 0 or 1"
      - "connected[i][i] = 1 and connected[i][j] = connected[j][i]"
    examples:
      - input: |
          4
          1 1 0 0
          1 1 0 0
          0 0 1 1
          0 0 1 1
        output: |
          2
        explanation: "Cities 0 and 1 form one province and cities 2 and 3 form another."
      - input: |
          3
          1 0 0
          0 1 0
          0 0 1
        output: |
          3
        explanation: "No roads exist, so every city is its own province."
    hints:
      - "Think of the matrix as an undirected graph; a province is a connected component."
      - "Start a DFS/BFS from every city that has not been visited yet and count how many times you start one."
    explanation: |
      **DFS / BFS over components — O(n²) time, O(n) space.** Keep a `visited`
      array. For each city not yet visited, increase the counter and flood through
      everything reachable from it, scanning its matrix row for neighbours. Every
      city is expanded once and each expansion scans `n` entries.

      **Union-Find — O(n² · α(n)) time, O(n) space.** Start with `n` separate sets.
      For every pair with `connected[i][j] = 1` union the two sets; each
      successful union reduces the number of sets by one. The final number of sets
      is the answer. Path compression and union by size keep operations nearly
      constant.
