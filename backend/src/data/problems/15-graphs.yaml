    referenceSolution:
      python: |
        import sys
        from typing import List


        def accounts_merge(accounts: List[List[str]]) -> List[str]:
            n = len(accounts)
            parent = list(range(n))
            size = [1] * n

            def find(x: int) -> int:
                root = x
                while parent[root] != root:
                    root = parent[root]
                while parent[x] != root:
                    parent[x], x = root, parent[x]
                return root

            def union(a: int, b: int) -> None:
                ra, rb = find(a), find(b)
                if ra == rb:
                    return
                if size[ra] < size[rb]:
                    ra, rb = rb, ra
                parent[rb] = ra
                size[ra] += size[rb]

            owner = {}
            for index, account in enumerate(accounts):
                for email in account[1:]:
                    if email in owner:
                        union(index, owner[email])
                    else:
                        owner[email] = index

            groups = {}
            for email, index in owner.items():
                groups.setdefault(find(index), []).append(email)

            merged = []
            for root, emails in groups.items():
                merged.append(" ".join([accounts[root][0]] + sorted(emails)))
            merged.sort()
            return merged


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            n = int(lines[0].split()[0])
            accounts = [lines[i + 1].split() for i in range(n)]
            print("\n".join(accounts_merge(accounts)))


        if __name__ == "__main__":
            main()
