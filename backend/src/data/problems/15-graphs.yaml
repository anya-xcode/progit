    referenceSolution:
      python: |
        import sys
        from collections import deque
        from typing import List


        def traversals(n: int, adj: List[List[int]]) -> List[List[int]]:
            bfs_order: List[int] = []
            seen_bfs = [False] * n
            for start in range(n):
                if seen_bfs[start]:
                    continue
                seen_bfs[start] = True
                queue = deque([start])
                while queue:
                    node = queue.popleft()
                    bfs_order.append(node)
                    for nxt in adj[node]:
                        if not seen_bfs[nxt]:
                            seen_bfs[nxt] = True
                            queue.append(nxt)

            dfs_order: List[int] = []
            seen_dfs = [False] * n
            for start in range(n):
                if seen_dfs[start]:
                    continue
                stack = [start]
                while stack:
                    node = stack.pop()
                    if seen_dfs[node]:
                        continue
                    seen_dfs[node] = True
                    dfs_order.append(node)
                    for nxt in reversed(adj[node]):
                        if not seen_dfs[nxt]:
                            stack.append(nxt)
            return [bfs_order, dfs_order]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            adj: List[List[int]] = [[] for _ in range(n)]
            for i in range(m):
                u, v = int(data[2 + 2 * i]), int(data[3 + 2 * i])
                adj[u].append(v)
                adj[v].append(u)
            for row in adj:
                row.sort()
            bfs_order, dfs_order = traversals(n, adj)
            print(" ".join(map(str, bfs_order)))
            print(" ".join(map(str, dfs_order)))


        if __name__ == "__main__":
            main()
