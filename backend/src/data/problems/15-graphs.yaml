    slug: path-with-minimum-effort
    title: "Path with minimum effort"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "Shortest Path"
    tags: [graph, dijkstra, binary-search, matrix]
    sourceUrl: "https://leetcode.com/problems/path-with-minimum-effort/"
    statement: |
      A `rows x cols` grid gives the height of every cell. A cell holding `-1` is
      **blocked** and may not be entered; all other cells hold a height of `0` or
      more.

      You start on the top-left cell `(0, 0)` and want to reach the bottom-right cell
      `(rows - 1, cols - 1)`, moving each step to a neighbouring cell above, below,
      left or right that is not blocked.

      The **effort** of a route is the largest absolute height difference between any
      two consecutive cells on it. A route consisting of a single cell has effort
      `0`. Find the smallest possible effort.

      Many routes may share that smallest effort. Among those, look only at the ones
      using the **fewest cells**; report such a route when there is exactly one, and
      say `MULTIPLE` otherwise. Cells are named by the number `r * cols + c`.
    inputFormat: |
      - Line 1: two integers `rows` and `cols`.
      - Next `rows` lines: `cols` integers, the heights (`-1` marks a blocked cell).
    outputFormat: |
      If `(0, 0)` or `(rows - 1, cols - 1)` is blocked, or the destination cannot be
      reached, print `-1` on a single line and nothing else.

      Otherwise:

      - Line 1: the minimum effort.
      - Line 2: if exactly one minimum-effort route uses the fewest cells, its cell
        numbers `r * cols + c` in order from start to destination; otherwise the word
        `MULTIPLE`.
    constraints:
      - "1 <= rows, cols <= 100"
      - "grid[r][c] = -1 (blocked) or 0 <= grid[r][c] <= 10^6"
    examples:
      - input: |
          3 3
          1 2 2
          3 8 2
          5 3 5
        output: |
          2
          0 3 6 7 8
        explanation: "Going down the left column and then right - heights 1, 3, 5, 3, 5 - never jumps by more than 2, while the route along the top row has to jump from 2 to 5. Only that one route achieves effort 2, so its cells 0, 3, 6, 7, 8 are printed."
      - input: |
          2 3
          1 -1 2
          1 -1 3
        output: |
          -1
        explanation: "The whole middle column is blocked, so the right half of the grid is cut off."
    hints:
      - "The cost of a route is a maximum, not a sum, so replace 'distance + weight' with 'max(distance, weight)' and Dijkstra still works."
      - "Another angle: for a fixed value E, 'is there a route of effort at most E?' is a plain reachability question - binary search E over the possible differences."
      - "Once the minimum effort E is known, throw away every step bigger than E; the second line is then an ordinary shortest-path-counting question on what is left."
    explanation: |
      **Brute force — exponential.** Enumerating routes is hopeless: even a 10 x 10
      grid has astronomically many of them.

      **Dijkstra on the bottleneck — O(rows . cols . log(rows . cols)) time.** Keep
      `effort[cell]` = the smallest effort of any route from the start to that cell,
      and relax with

      ```
      candidate = max(effort[cell], abs(height[next] - height[cell]))
      ```

      instead of the usual sum. The greedy argument survives unchanged: `max` is
      monotone and never decreases, so the unsettled cell with the smallest value can
      no longer be improved. Blocked cells are simply never relaxed.

      **Binary search + BFS — O(rows . cols . log(max height)).** For a fixed `E`,
      keep only the steps whose height difference is at most `E` and ask whether the
      destination is reachable — a plain BFS. Reachability is monotone in `E`, so
      binary search over the candidate values finds the smallest feasible one. Same
      answer, no priority queue, and it is the natural cross-check for the Dijkstra
      version. A Disjoint Set Union variant adds the steps in increasing difference
      and stops when start and destination land in the same set.

      **Second line — O(rows . cols).** With `E` known, drop every step heavier than
      `E`. All remaining routes have effort exactly `E` (they cannot be cheaper,
      since `E` is the minimum). So "minimum effort with the fewest cells" is just a
      BFS on that reduced grid. Carry a counter `ways[cell]`, capped at `2`, updated
      by the usual rule — a cell discovered one level deeper inherits its
      predecessor's count, and another predecessor on the same level adds to it. If
      `ways[destination] == 1`, walk back from the destination, at each step to the
      unique neighbour one level closer, and reverse.

      **Edge cases.** A 1 x 1 grid answers `0` with the single cell `0`. A grid whose
      cells all have the same height gives effort `0` and almost always `MULTIPLE`,
      since every monotone staircase is a shortest route.
