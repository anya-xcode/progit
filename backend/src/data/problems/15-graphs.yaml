            n, m, src = int(data[0]), int(data[1]), int(data[2])
            adj: List[List[Tuple[int, int]]] = [[] for _ in range(n)]
            for i in range(m):
                u, v, w = int(data[3 + 3 * i]), int(data[4 + 3 * i]), int(data[5 + 3 * i])
                adj[u].append((v, w))
                adj[v].append((u, w))
            print(" ".join(map(str, dijkstra(n, adj, src))))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import heapq
        import sys
        from typing import List, Tuple


        def dijkstra(n: int, adj: List[List[Tuple[int, int]]], src: int) -> List[int]:
            inf = float("inf")
            dist = [inf] * n
            dist[src] = 0
            heap = [(0, src)]
            while heap:
                d, node = heapq.heappop(heap)
                if d > dist[node]:
                    continue
                for nxt, weight in adj[node]:
                    candidate = d + weight
                    if candidate < dist[nxt]:
                        dist[nxt] = candidate
                        heapq.heappush(heap, (candidate, nxt))
            return [int(d) if d != inf else -1 for d in dist]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m, src = int(data[0]), int(data[1]), int(data[2])
            adj: List[List[Tuple[int, int]]] = [[] for _ in range(n)]
            for i in range(m):
                u, v, w = int(data[3 + 3 * i]), int(data[4 + 3 * i]), int(data[5 + 3 * i])
                adj[u].append((v, w))
