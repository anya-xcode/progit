    referenceSolution:
      python: |
        import heapq
        import sys
        from typing import List


        def alien_order(k: int, words: List[str]) -> str:
            follows: List[set] = [set() for _ in range(k)]
            indegree = [0] * k
            for i in range(len(words) - 1):
                first, second = words[i], words[i + 1]
                limit = min(len(first), len(second))
                pos = 0
                while pos < limit and first[pos] == second[pos]:
                    pos += 1
                if pos == limit:
                    if len(first) > len(second):
                        return ""
                    continue
                earlier = ord(first[pos]) - 97
                later = ord(second[pos]) - 97
                if later not in follows[earlier]:
                    follows[earlier].add(later)
                    indegree[later] += 1
            ready = [letter for letter in range(k) if indegree[letter] == 0]
            heapq.heapify(ready)
            order: List[int] = []
            while ready:
                letter = heapq.heappop(ready)
                order.append(letter)
                for nxt in sorted(follows[letter]):
                    indegree[nxt] -= 1
                    if indegree[nxt] == 0:
                        heapq.heappush(ready, nxt)
            if len(order) != k:
                return ""
            return "".join(chr(97 + letter) for letter in order)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            words = data[2:2 + n]
            answer = alien_order(k, words)
            print(answer if answer else -1)


        if __name__ == "__main__":
            main()
