  - slug: detect-cycle-in-an-undirected-graph
    title: "Detect Cycle in an Undirected Graph"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "BFS/DFS"
    tags: [graph, dfs, bfs, union-find]
    sourceUrl: ""
    statement: |
      Given an undirected graph with `n` nodes and `m` edges, decide whether it
      contains a **cycle**: a path that starts and ends at the same node, uses at
      least three distinct nodes and never repeats an edge.

      The graph has no self-loops and no repeated edges, and it may be
      **disconnected**.
    inputFormat: |
      - Line 1: two integers `n` and `m`, the number of nodes (labelled `0` to `n - 1`) and edges.
      - Next `m` lines: two integers `u v` describing an edge.
      Each edge `u v` connects `u` and `v` in both directions.
    outputFormat: |
      Print `true` if the graph contains a cycle, otherwise `false`.
    constraints:
      - "1 <= n <= 10^4"
      - "0 <= m <= 10^4"
      - "0 <= u, v < n, u != v"
      - "No edge appears twice"
    examples:
      - input: |
          5 4
          0 1
          1 2
          2 0
          3 4
        output: |
          true
        explanation: "Nodes 0, 1 and 2 form a triangle."
      - input: |
          6 4
          0 1
          1 2
          3 4
          4 5
        output: |
          false
        explanation: "The graph is two separate paths, which contain no cycle."
    hints:
      - "During a traversal, reaching an already visited node is only suspicious if it is not the node you just came from."
      - "Remember to start a traversal from every unvisited node, because the graph may be disconnected."
      - "Alternatively, with union-find an edge whose endpoints are already in the same set closes a cycle."
    explanation: |
      **Edge counting per component — O(n + m) time.** A connected component with
      `k` nodes is acyclic exactly when it has `k - 1` edges. Count nodes and edges
      in every component.

      **BFS/DFS with parent — O(n + m) time, O(n) space.** Traverse each component,
      storing the parent from which each node was discovered. If a neighbour of
      `u` is already visited and is not `u`'s parent, a second route to it exists,
      so there is a cycle. (This relies on there being no repeated edges.)

      **Union-Find — O(m · α(n)) time, O(n) space.** Process edges one at a time; if
      both endpoints already share a root, the edge closes a cycle; otherwise union
      them.
    starterCode:
      python: |
        import sys
        from typing import List


        def has_cycle_undirected(n: int, adj: List[List[int]]) -> bool:
            # Return True if the undirected graph contains a cycle.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            adj: List[List[int]] = [[] for _ in range(n)]
            for i in range(m):
                u, v = int(data[2 + 2 * i]), int(data[3 + 2 * i])
                adj[u].append(v)
                adj[v].append(u)
            print("true" if has_cycle_undirected(n, adj) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from collections import deque
        from typing import List


        def has_cycle_undirected(n: int, adj: List[List[int]]) -> bool:
            parent = [-2] * n  # -2 means unvisited
            for start in range(n):
                if parent[start] != -2:
                    continue
                parent[start] = -1
                queue = deque([start])
                while queue:
                    node = queue.popleft()
                    for nxt in adj[node]:
                        if parent[nxt] == -2:
                            parent[nxt] = node
                            queue.append(nxt)
                        elif nxt != parent[node]:
                            return True
            return False


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            adj: List[List[int]] = [[] for _ in range(n)]
            for i in range(m):
                u, v = int(data[2 + 2 * i]), int(data[3 + 2 * i])
                adj[u].append(v)
                adj[v].append(u)
            print("true" if has_cycle_undirected(n, adj) else "false")


        if __name__ == "__main__":
            main()
