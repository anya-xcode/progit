    referenceSolution:
      python: |
        import heapq
        import sys
        from typing import List


        def topo_sort(n: int, adj: List[List[int]]) -> List[int]:
            indegree = [0] * n
            for node in range(n):
                for nxt in adj[node]:
                    indegree[nxt] += 1
            heap = [node for node in range(n) if indegree[node] == 0]
            heapq.heapify(heap)
            order: List[int] = []
            while heap:
                node = heapq.heappop(heap)
                order.append(node)
                for nxt in adj[node]:
                    indegree[nxt] -= 1
                    if indegree[nxt] == 0:
                        heapq.heappush(heap, nxt)
            return order


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
