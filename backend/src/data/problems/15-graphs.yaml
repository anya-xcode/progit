  - slug: dijkstras-shortest-path
    title: "Dijkstra's Shortest Path"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "Shortest Path"
    tags: [graph, shortest-path, dijkstra, heap]
    sourceUrl: ""
    statement: |
      You are given a weighted **undirected** graph with `n` nodes and `m` edges,
      all with non-negative weights, and a source node `src`.

      For every node, find the length of the shortest path from `src` to it (the
      minimum possible sum of edge weights). The distance from `src` to itself is
      `0`. If a node cannot be reached, its distance is `-1`. Multiple edges
      between the same pair of nodes and self-loops may appear.
    inputFormat: |
      - Line 1: three integers `n`, `m` and `src`.
      - Next `m` lines: three integers `u v w` — an undirected edge between `u` and `v` with weight `w`.
    outputFormat: |
      Print `n` space-separated integers: the shortest distance from `src` to nodes `0, 1, ..., n - 1` (`-1` for unreachable nodes).
    constraints:
      - "1 <= n <= 10^4"
      - "0 <= m <= 2 * 10^4"
      - "0 <= u, v, src < n"
      - "0 <= w <= 10^4"
    examples:
      - input: |
          5 6 0
          0 1 4
          0 2 1
          2 1 2
          1 3 1
          2 3 5
          3 4 3
        output: |
          0 3 1 4 7
        explanation: "Going 0 → 2 → 1 costs 3, cheaper than the direct edge of 4. Node 3 is best reached via 1 (3 + 1 = 4) and node 4 via 3."
      - input: |
          4 2 1
          0 1 5
          2 3 1
        output: |
          5 0 -1 -1
        explanation: "Nodes 2 and 3 are in a different component from the source."
    hints:
      - "With equal weights BFS would work. What goes wrong when weights differ?"
      - "Always expand the unfinished node with the smallest tentative distance — its distance can no longer improve."
      - "A min-heap of (distance, node) pairs finds that node quickly; skip entries that are outdated."
    explanation: |
      **Bellman-Ford — O(n · m) time, O(n) space.** Relax every edge `n - 1` times.
      Works, but ignores the fact that weights are non-negative.

      **Dijkstra with an array — O(n² + m) time, O(n) space.** Keep tentative
      distances; `n` times pick the unvisited node with the smallest distance by a
      linear scan, mark it final and relax its edges. Good for dense graphs.

      **Dijkstra with a binary heap — O((n + m) log n) time, O(n + m) space.** Push
      `(0, src)`. Pop the smallest entry; if its distance is larger than the
      recorded one it is stale, so skip it. Otherwise relax each edge `(v, w)`: if
      `dist[u] + w < dist[v]`, update and push `(dist[v], v)`. Non-negative
      weights guarantee that a popped node's distance is final. Finally replace
      infinity with `-1`.
