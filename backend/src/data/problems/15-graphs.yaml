  - sheetId: prob-15-5-3-disjoint-set
    type: reference
    slug: disjoint-set
    title: "Disjoint Set"
    difficulty: Hard
    topic: "Graphs"
    subtopic: "MST/Disjoint Set"
    tags: [graph, theory, dsu, union-find]
    sourceUrl: ""
    statement: |
      A **Disjoint Set Union** (DSU, also called Union-Find) keeps a partition of
      `0 .. n - 1` into groups and supports two operations:

      - `find(x)` — the identity (the *representative*) of the group holding `x`.
      - `union(a, b)` — merge the group of `a` with the group of `b`.

      "Are `a` and `b` in the same group?" is then `find(a) == find(b)`.

      Why bother when BFS/DFS already finds components? Because DSU works
      **online**: edges may arrive one at a time and each answer is needed
      immediately. Re-running a traversal after every edge would cost `O(q(n + m))`;
      DSU answers each query in almost constant time.

      ## The structure

      Each group is a tree stored in a parent array; the root is its own parent.

      ```
      parent = list(range(n))

      def find(x):
          while parent[x] != x:
              x = parent[x]
          return x
      ```

      Used naively the trees degenerate into chains and `find` becomes `O(n)`. Two
      independent optimisations fix that.

      ## Optimisation 1 — union by rank or by size

      Always attach the **smaller** tree under the larger one, so depth grows as
      slowly as possible.

      - **Union by size**: keep `size[root]` = number of nodes; attach the smaller
        size under the larger. Handy because the size of a component is then free.
      - **Union by rank**: keep `rank[root]` = an upper bound on the tree's height;
        attach the smaller rank under the larger, and increase the rank by one only
        when the two ranks are equal.

      Either one alone already guarantees `O(log n)` per operation. **Never compare
      `rank[a]` with `rank[b]` without calling `find` first** — ranks and sizes are
      only meaningful at roots.

      ## Optimisation 2 — path compression

      While walking up to the root, re-point every node you pass directly at the
      root, so the next `find` on any of them is one step.

      ```
      def find(x):
          root = x
          while parent[root] != root:
              root = parent[root]
          while parent[x] != root:       # second pass: flatten
              parent[x], x = root, parent[x]
          return root
      ```

      ## Together

      With both optimisations, `m` operations on `n` elements cost
      `O(m . alpha(n))`, where `alpha` is the inverse Ackermann function — below `5`
      for any input that fits in this universe. Treat it as constant time.
    explanation: |
      **A complete implementation (union by size + path compression)**

      ```
      parent = list(range(n))
      size = [1] * n
      components = n

      def find(x):
          root = x
          while parent[root] != root:
              root = parent[root]
          while parent[x] != root:
              parent[x], x = root, parent[x]
          return root

      def union(a, b):
          ra, rb = find(a), find(b)
          if ra == rb:
              return False              # already together: this edge closes a cycle
          if size[ra] < size[rb]:
              ra, rb = rb, ra
          parent[rb] = ra
          size[ra] += size[rb]
          return True
      ```

      **What the return value of `union` buys you**

      - `False` means the edge joins two nodes that are already connected — an
        undirected cycle. That single line is Kruskal's MST filter and the standard
        cycle test.
      - Counting `True` results gives the number of components: `n - unions`.

      **Where it shows up in this step**

      Kruskal's MST, number of provinces, number of operations to make a network
      connected, accounts merge, number of islands II, making a large island, most
      stones removed, swim in rising water. The recurring trick is **mapping
      non-integer items to indices**: cell `(r, c)` becomes `r * cols + c`, an email
      string becomes its position in a dictionary, a stone's row `r` becomes `r` and
      its column `c` becomes `rows + c`.

      **Traps**

      - Path compression destroys the tree shape, so plain DSU cannot undo a union.
        If you need rollback, use union by rank **without** path compression.
      - `rank` is not the real height once path compression runs; it stays a valid
        upper bound, which is all the proof needs.
      - Do the recursive `find` iteratively — a chain built before any compression
        can be 10^5 deep.
