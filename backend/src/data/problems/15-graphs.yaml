      **Flood fill — O(R·C) time, O(R·C) space.** Scan the grid. On an unvisited `1`,
      increment the answer and run BFS/DFS from it, marking every reachable land
      cell (4 directions) as visited. Each cell is processed a constant number of
      times. An explicit queue or stack avoids recursion depth problems on large
      islands.

      **Union-Find — O(R·C · α) time, O(R·C) space.** Give each land cell its own set,
      union it with land neighbours to the right and below, and count the distinct
      roots among land cells. Useful when land is added incrementally.
