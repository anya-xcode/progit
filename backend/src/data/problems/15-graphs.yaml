  - slug: minimum-spanning-tree-weight
    title: "Minimum Spanning Tree Weight"
    difficulty: Medium
    topic: "Graphs"
    subtopic: "MST/Disjoint Set"
    tags: [graph, mst, kruskal, prim, union-find]
    sourceUrl: ""
    statement: |
      You are given a **connected**, weighted, undirected graph with `n` nodes and
      `m` edges. A **spanning tree** is a subset of `n - 1` edges that connects all
      nodes without forming a cycle. Its weight is the sum of its edge weights.

      Print the minimum possible weight of a spanning tree. (Different minimum
      spanning trees may exist, but they all have the same weight.) The edge list
      may contain parallel edges and self-loops.
    inputFormat: |
      - Line 1: two integers `n` and `m`.
      - Next `m` lines: three integers `u v w` — an undirected edge between `u` and `v` with weight `w`.
    outputFormat: |
      Print the total weight of a minimum spanning tree.
    constraints:
      - "1 <= n <= 10^4"
      - "0 <= m <= 2 * 10^4"
      - "0 <= u, v < n"
      - "0 <= w <= 10^4"
      - "The graph is connected"
    examples:
      - input: |
          4 5
          0 1 1
          1 2 3
          2 3 4
          3 0 2
          0 2 5
        output: |
          6
        explanation: "Pick edges 0–1 (1), 3–0 (2) and 1–2 (3). Every other choice of three connecting edges weighs more."
      - input: |
          3 3
          0 1 5
          1 2 5
          0 2 5
        output: |
          10
        explanation: "All edges weigh 5 and any two of them form a spanning tree."
    hints:
      - "The cheapest edge that does not create a cycle is always safe to take."
      - "Kruskal: sort edges by weight and add each one that joins two different components — a disjoint set union tells you quickly."
      - "Prim: grow a tree from one node, always attaching the cheapest edge leaving it (use a min-heap)."
    explanation: |
      **Brute force — exponential.** Enumerate subsets of `n - 1` edges and keep the
      lightest one that forms a tree. Only usable for tiny graphs.

      **Prim's algorithm — O(m log n) time, O(n + m) space.** Start from node 0 with a
      min-heap of `(weight, node)`. Pop the lightest entry; if the node is already
      in the tree skip it, otherwise add its weight and push all its edges to
      nodes outside the tree. (With an adjacency matrix and linear scans, Prim runs
      in `O(n²)`, which suits dense graphs.)

      **Kruskal's algorithm — O(m log m) time, O(n) space.** Sort edges by weight and
      walk through them with a disjoint set union (path compression + union by
      size). Add an edge whenever its endpoints are in different sets; stop after
      `n - 1` edges. The cut property guarantees each added edge belongs to some
      minimum spanning tree.
