            for row in adj:
                row.sort()
            entry, exit_order = dfs_orders(n, adj)
            print(" ".join(map(str, entry)))
            print(" ".join(map(str, exit_order)))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def dfs_orders(n: int, adj: List[List[int]]) -> List[List[int]]:
            entry: List[int] = []
            exit_order: List[int] = []
            visited = [False] * n
            for start in range(n):
                if visited[start]:
                    continue
                visited[start] = True
                entry.append(start)
                stack = [[start, 0]]
                while stack:
                    frame = stack[-1]
                    node, index = frame[0], frame[1]
                    if index < len(adj[node]):
                        frame[1] = index + 1
                        nxt = adj[node][index]
                        if not visited[nxt]:
                            visited[nxt] = True
                            entry.append(nxt)
                            stack.append([nxt, 0])
                    else:
                        stack.pop()
                        exit_order.append(node)
            return [entry, exit_order]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, m = int(data[0]), int(data[1])
            adj: List[List[int]] = [[] for _ in range(n)]
            for i in range(m):
                u, v = int(data[2 + 2 * i]), int(data[3 + 2 * i])
                adj[u].append(v)
                adj[v].append(u)
            for row in adj:
                row.sort()
            entry, exit_order = dfs_orders(n, adj)
            print(" ".join(map(str, entry)))
            print(" ".join(map(str, exit_order)))


        if __name__ == "__main__":
            main()
