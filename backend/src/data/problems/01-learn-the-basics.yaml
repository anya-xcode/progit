  - sheetId: prob-1-6-3-print-1-to-n-using-recurs
    slug: print-1-to-n-using-recursion
    title: Print 1 to N using Recursion
    difficulty: Easy
    topic: Recursion
    subtopic: Learn Basic Recursion
    tags: [recursion, basics]
    sourceUrl: ""
    statement: |
      Given an integer `n`, produce the numbers `1, 2, 3, ..., n` in increasing
      order.

      Solve it recursively. The interesting part is that the recursion naturally
      counts *down* (each call hands a smaller problem to the next one), so you have
      to arrange the calls in a way that still yields an increasing sequence.
    inputFormat: |
      - Line 1: a single integer `n`.
    outputFormat: |
      Print the `n` numbers on one line, separated by single spaces, in increasing
      order.
    constraints:
      - "1 <= n <= 2000"
    examples:
      - input: |
          5
        output: |
          1 2 3 4 5
        explanation: "The numbers 1 through 5 in increasing order."
      - input: |
          1
        output: |
          1
        explanation: "Only the number 1 is produced."
    hints:
      - "One way: a function f(k) that records k and then calls f(k + 1), stopping once k exceeds n. The counter grows, so the order is already correct."
      - "Another way: keep counting down with f(n), but call f(n - 1) *before* recording n. The deepest call finishes first, so the smallest number is recorded first."
      - "Collect the numbers in a list and join them once at the end instead of concatenating strings inside the recursion."
    explanation: |
      **Loop - O(n) time, O(1) extra space.** Walk `k` from `1` to `n`. Correct, but
      it does not exercise recursion.

      **Forward recursion - O(n) time, O(n) space.** Define `f(k)`: if `k > n`
      return, otherwise record `k` and call `f(k + 1)`. The call chain is
      `f(1) -> f(2) -> ... -> f(n)`, and because each value is recorded *before* the
      deeper call, they come out in increasing order. Here `k` grows while the
      distance to the base case `n - k` shrinks.

      **Backward recursion - O(n) time, O(n) space.** Define `g(k)`: if `k == 0`
      return, otherwise call `g(k - 1)` first and record `k` afterwards. Now nothing
      is recorded on the way down; the work happens while the stack unwinds, so `1`
      is recorded first and `n` last. This trick - doing the work *after* the
      recursive call instead of before it - reverses the order of a recursion for
      free, and it is the same idea used to print a linked list backwards.

      Both recursive versions use `n` stack frames, so the space is O(n) against the
      loop's O(1). Building the answer in a list and joining once keeps the output
      cost linear; repeated string `+` would be quadratic.
    starterCode:
      python: |
        import sys
        from typing import List


        def numbers_one_to_n(n: int) -> List[int]:
            # Return [1, 2, ..., n], built recursively.
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            n = int(sys.stdin.readline())
            print(" ".join(str(v) for v in numbers_one_to_n(n)))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def numbers_one_to_n(n: int) -> List[int]:
            values: List[int] = []

            def go(k: int) -> None:
                if k > n:
                    return
                values.append(k)
                go(k + 1)

            go(1)
            return values


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            n = int(sys.stdin.readline())
            print(" ".join(str(v) for v in numbers_one_to_n(n)))


        if __name__ == "__main__":
            main()
