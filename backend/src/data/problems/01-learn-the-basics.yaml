    referenceSolution:
      python: |
        import sys
        from typing import Dict, List, Tuple


        def highest_occurring(arr: List[int]) -> Tuple[int, int]:
            counts: Dict[int, int] = {}
            for value in arr:
                counts[value] = counts.get(value, 0) + 1

            best_value = arr[0]
            best_count = 0
            for value, count in counts.items():
                if count > best_count or (count == best_count and value < best_value):
                    best_value = value
                    best_count = count
            return best_value, best_count


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            value, count = highest_occurring(arr)
            print(value, count)


        if __name__ == "__main__":
            main()
