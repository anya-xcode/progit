    referenceSolution:
      python: |
        import sys
        from typing import List


        def frequency_queries(arr: List[int], queries: List[int]) -> List[int]:
            counts = {}
            for value in arr:
                counts[value] = counts.get(value, 0) + 1
            return [counts.get(x, 0) for x in queries]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            q = int(data[1 + n])
            queries = [int(x) for x in data[2 + n:2 + n + q]]
            print(" ".join(map(str, frequency_queries(arr, queries))))


        if __name__ == "__main__":
            main()
