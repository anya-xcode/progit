  - sheetId: prob-1-6-2-print-name-n-times-using-
    slug: print-name-n-times-using-recursion
    title: Print name N times using recursion
    difficulty: Easy
    topic: Recursion
    subtopic: Learn Basic Recursion
    tags: [recursion, basics, string]
    sourceUrl: ""
    statement: |
      You are given a `name` and a count `n`. Print the name on `n` separate lines.

      Solve it recursively. Compared to printing a fixed word, the only new idea is
      that the recursive function now carries a second piece of information - the
      name - that does **not** change from one call to the next, while `n` shrinks
      towards the base case.
    inputFormat: |
      - Line 1: the string `name` (no spaces).
      - Line 2: a single integer `n`.
    outputFormat: |
      Print `n` lines, each containing `name`.
    constraints:
      - "1 <= |name| <= 20"
      - "`name` consists of English letters and digits only."
      - "1 <= n <= 1000"
    examples:
      - input: |
          Rohit
          3
        output: |
          Rohit
          Rohit
          Rohit
        explanation: "The name is printed once and the function then repeats the job for n = 2 and n = 1."
      - input: |
          dsa
          1
        output: |
          dsa
        explanation: "One line is printed; the next call receives n = 0 and stops."
    hints:
      - "Pass both the name and the remaining count to the recursive function."
      - "Only the count changes between calls: print the name once, then call yourself with n - 1."
      - "The base case is n == 0, where the function returns without printing anything."
    explanation: |
      **Recursion - O(n) time, O(n) space.** The function takes two parameters,
      `name` and `n`. If `n <= 0` it returns at once; otherwise it prints `name` and
      calls itself with `n - 1`. There are `n + 1` calls in total, each doing O(1)
      work besides the printing, so the time is O(n) (plus the cost of writing the
      output). The recursion depth reaches `n`, so O(n) stack space is used.

      Note that `name` is carried unchanged through every call. That is very common:
      a recursive function usually has *state* that shrinks (here `n`, and it drives
      the base case) and *context* that stays the same (here `name`).

      **Loop - O(n) time, O(1) space.** Iteration solves the same task without the
      stack, and for a job this simple it is what you would actually write. Recursion
      is practised here because the same shape - do one step, recurse on the rest -
      is what later powers subsequences, trees and backtracking.
    starterCode:
      python: |
        import sys


        def print_name(name: str, n: int) -> None:
            # Print name on n separate lines, recursively.
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            data = sys.stdin.read().split()
            name = data[0]
            n = int(data[1])
            print_name(name, n)


        if __name__ == "__main__":
            main()
    referenceSolution:
