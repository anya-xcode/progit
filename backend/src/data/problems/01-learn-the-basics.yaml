    slug: reverse-an-array
    title: Reverse an array
    difficulty: Easy
    topic: Recursion
    subtopic: Learn Basic Recursion
    tags: [recursion, array, two pointers]
    sourceUrl: ""
    statement: |
      You are given an integer array `arr` of length `n`. Print its elements in
      reverse order: the last element first and the first element last.

      Solve it recursively, and do it by **swapping** elements rather than by
      building a new array: keep two positions, one at each end, swap them, and hand
      the shorter middle part to the next call.
    inputFormat: |
      - Line 1: a single integer `n`.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print the `n` elements of the reversed array on one line, separated by single
      spaces.
    constraints:
      - "1 <= n <= 1000"
      - "-10^9 <= arr[i] <= 10^9"
    examples:
      - input: |
          5
          3 8 1 4 9
        output: |
          9 4 1 8 3
        explanation: "Reading 3 8 1 4 9 from the right gives 9 4 1 8 3. As swaps: 3 and 9 are exchanged, then 8 and 4, and the middle element 1 stays where it is."
      - input: |
          4
          -7 -7 2 0
        output: |
          0 2 -7 -7
        explanation: "The two halves are exchanged pairwise: -7 with 0 and -7 with 2."
    hints:
      - "Give the recursive function the two positions it should work on, for example left = 0 and right = n - 1."
      - "Swap arr[left] and arr[right], then recurse on left + 1 and right - 1."
      - "Stop when left >= right: the part that remains is empty or is a single middle element that does not move. That makes the recursion depth about n / 2."
    explanation: |
      **Extra array - O(n) time, O(n) space.** Copy the elements into a new array
      back to front. Simple, but it allocates a second array.

      **Two pointers, iterative - O(n) time, O(1) extra space.** Swap `arr[0]` with
      `arr[n-1]`, `arr[1]` with `arr[n-2]`, and so on, stopping in the middle.

      **Two pointers, recursive - O(n) time, O(n) stack space.** Exactly the same
      swaps, expressed as a recursion:

      - base case: `left >= right`, nothing left to do;
      - recursive case: swap `arr[left]` and `arr[right]`, then solve the smaller
        problem `(left + 1, right - 1)`.

      Each call fixes two positions, so there are about `n / 2` calls and every
      element is moved exactly once. Correctness follows by induction: after the
      swap, the two outermost elements are in their final places, and the recursive
      call reverses everything strictly between them.

      A common variant passes only one index `i` and swaps `arr[i]` with
      `arr[n - 1 - i]`, stopping at `i >= n / 2`. Take care not to run the loop all
      the way to `n - 1` in either version - that would swap every pair twice and
      return the original array.
    starterCode:
      python: |
        import sys
        from typing import List


        def reverse_array(arr: List[int]) -> List[int]:
            # Reverse arr in place by swapping from both ends, recursively, and return it.
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(v) for v in reverse_array(arr)))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def reverse_array(arr: List[int]) -> List[int]:
            def swap(left: int, right: int) -> None:
                if left >= right:
                    return
                arr[left], arr[right] = arr[right], arr[left]
                swap(left + 1, right - 1)

            swap(0, len(arr) - 1)
            return arr


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(v) for v in reverse_array(arr)))


        if __name__ == "__main__":
            main()
