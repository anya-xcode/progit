    slug: check-if-string-is-palindrome-or-not
    title: Check if String is Palindrome or Not
    difficulty: Easy
    topic: Recursion
    subtopic: Learn Basic Recursion
    tags: [recursion, string, two pointers]
    sourceUrl: "https://leetcode.com/problems/valid-palindrome/"
    statement: |
      A string is a **palindrome** if it reads the same from left to right and from
      right to left, for example `madam` or `1221`.

      Given a string `s`, decide whether it is a palindrome.

      Solve it recursively: compare the two outermost characters and let the next
      call deal with everything in between.
    inputFormat: |
      - Line 1: the string `s`.
    outputFormat: |
      Print `true` if `s` is a palindrome and `false` otherwise.
    constraints:
      - "1 <= |s| <= 2000"
      - "`s` consists of lowercase English letters and digits only (no spaces)."
    examples:
      - input: |
          madam
        output: |
          true
        explanation: "The first and last characters match (m and m), then a and a, and the middle d is left alone, so the string reads the same both ways."
      - input: |
          recursion
        output: |
          false
        explanation: "The very first comparison fails: the string starts with r but ends with n."
    hints:
      - "Give the recursive function the two positions being compared, for example left = 0 and right = |s| - 1."
      - "If s[left] != s[right] the answer is false immediately - there is no need to look any further."
      - "If they match, the answer is whatever the call on (left + 1, right - 1) says. The base case left >= right means the remaining part is empty or one character, which is always a palindrome, so return true."
    explanation: |
      **Reverse and compare - O(n) time, O(n) space.** Build the reversed string and
      test it for equality with the original. Easy to write and a good way to check
      your answer, but it allocates a second string.

      **Two pointers, iterative - O(n) time, O(1) space.** Move `left` forward and
      `right` backward while the characters match; the string is a palindrome exactly
      when the pointers meet without a mismatch.

      **Two pointers, recursive - O(n) time, O(n) stack space.** Define
      `check(left, right)`:

      - if `left >= right`, return `true` (an empty or single-character stretch is a
        palindrome);
      - if `s[left] != s[right]`, return `false`;
      - otherwise return `check(left + 1, right - 1)`.

      Each call inspects one pair, so at most `n / 2` calls are made and the work per
      call is O(1). Because the result of the deeper call is returned unchanged, the
      recursion short-circuits on the first mismatch - it does not keep scanning.

      Avoid the tempting `is_palindrome(s[1:-1])` formulation: it is just as
      recursive, but every call slices a fresh string and that turns the solution
      into O(n^2) time and space.
    starterCode:
      python: |
        import sys


        def is_palindrome(s: str) -> bool:
            # Return True if s reads the same forwards and backwards. Solve recursively.
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            s = sys.stdin.readline().strip()
            print("true" if is_palindrome(s) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def is_palindrome(s: str) -> bool:
            def check(left: int, right: int) -> bool:
                if left >= right:
                    return True
                if s[left] != s[right]:
                    return False
                return check(left + 1, right - 1)

            return check(0, len(s) - 1)


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            s = sys.stdin.readline().strip()
            print("true" if is_palindrome(s) else "false")


        if __name__ == "__main__":
            main()
