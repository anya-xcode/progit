  - sheetId: prob-1-6-1-understand-recursion-by-p
    slug: understand-recursion-by-print-something-n-times
    title: Understand recursion by print something N times
    difficulty: Easy
    topic: Recursion
    subtopic: Learn Basic Recursion
    tags: [recursion, basics]
    sourceUrl: ""
    statement: |
      A function that calls itself is a **recursive** function. Every recursive
      function needs two things: a *base case* that stops the chain of calls, and a
      *recursive case* that does a little work and then calls itself on a smaller
      version of the same task.

      Your task is the smallest possible exercise of that idea: given an integer
      `n`, print the word `Recursion` on `n` separate lines.

      Solve it recursively - no loop is allowed in your function. Think of the job
      "print the word n times" as "print it once, then print it n - 1 times".
    inputFormat: |
      - Line 1: a single integer `n`.
    outputFormat: |
      Print `n` lines, each containing exactly the word `Recursion`.
    constraints:
      - "1 <= n <= 1000"
    examples:
      - input: |
          3
        output: |
          Recursion
          Recursion
          Recursion
        explanation: "The word is printed once, and then the same job is repeated for n = 2 and n = 1. When n reaches 0 the calls stop."
      - input: |
          1
        output: |
          Recursion
        explanation: "A single call prints the word once and then asks for n = 0, which is the base case and prints nothing."
    hints:
      - "Write the function so that it prints one line and then calls itself with n - 1."
      - "Decide what the function should do when n is 0: that is the base case, and it must print nothing and return immediately."
      - "Without a base case the function would call itself forever and Python would raise a RecursionError, so always write the stopping condition first."
    explanation: |
      **Loop - O(n) time, O(1) space.** A `for` loop that prints the word `n` times
      is the obvious solution, but it does not practise recursion.

      **Recursion - O(n) time, O(n) space.** Define `f(n)`:

      - if `n <= 0`, return immediately (base case);
      - otherwise print the word once and call `f(n - 1)` (recursive case).

      `f(n)` triggers exactly `n + 1` calls, so the time is O(n). The space is O(n)
      as well, because the calls stack up: `f(n)` is still alive while `f(n - 1)`
      runs, and only the base case lets the whole stack unwind. This is the one real
      cost of recursion over a loop, and it is why deep recursion can overflow the
      call stack.

      Printing before the recursive call prints the lines while going *down* the
      stack; printing after it would produce the same output here, because every line
      is identical.
    starterCode:
      python: |
        import sys


        def print_message(n: int) -> None:
            # Print the word "Recursion" on n separate lines, recursively.
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            n = int(sys.stdin.readline())
            print_message(n)


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def print_message(n: int) -> None:
            if n <= 0:
                return
            print("Recursion")
            print_message(n - 1)


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            n = int(sys.stdin.readline())
            print_message(n)


        if __name__ == "__main__":
            main()
