    title: Frequency Queries
    difficulty: Easy
    topic: Hashing
    subtopic: Basic Hashing
    tags: [hashing, array, counting]
    sourceUrl: ""
    statement: |
      You are given an integer array `arr` of length `n` and a list of `q`
      query values.

      For every query value `x`, report how many times `x` occurs in `arr`. A
      value that never occurs has frequency 0.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `arr`.
      - Line 3: an integer `q`.
      - Line 4: `q` space-separated integers, the query values.
    outputFormat: |
      Print `q` integers on one line, space-separated: the frequency of each
      query value, in the order the queries are given.
    constraints:
      - "1 <= n <= 10^5"
      - "1 <= q <= 10^5"
      - "-10^9 <= arr[i], query values <= 10^9"
    examples:
      - input: |
          7
          4 1 4 9 1 4 6
          4
          4 1 5 6
        output: |
          3 2 0 1
        explanation: 4 appears three times, 1 appears twice, 5 never appears and 6 appears once.
      - input: |
          3
          -2 -2 -2
          2
          2 -2
        output: |
          0 3
        explanation: Only -2 is present, three times. The positive value 2 does not occur.
    hints:
      - Scanning the whole array for every query costs O(n * q). How can you avoid repeating that work?
      - Values can be as large as 10^9 or negative, so a plain counting array indexed by value would be huge.
      - Count every value once in a hash map, then answer each query with a single lookup.
    explanation: |
      **Brute force - O(n * q) time, O(1) extra space.** For each query walk
      the whole array and count matches. Up to 10^10 operations at the limits.

      **Sort + binary search - O((n + q) log n) time, O(1) extra space (besides
      the sort).** Sort the array; the frequency of `x` is the distance between
      the first position `>= x` and the first position `> x`, both found by
      binary search.

      **Hash map precomputation - O(n + q) expected time, O(k) space** for `k`
      distinct values. One pass builds a map `value -> count`. Every query is then
      a single lookup that defaults to 0. A plain array indexed by value (a
      "counting array") works the same way when values are small and
      non-negative, but not for this range of values.
