  - sheetId: prob-1-6-4-print-n-to-1-using-recurs
    slug: print-n-to-1-using-recursion
    title: Print N to 1 using Recursion
    difficulty: Easy
    topic: Recursion
    subtopic: Learn Basic Recursion
    tags: [recursion, basics]
    sourceUrl: ""
    statement: |
      Given an integer `n`, produce the numbers `n, n - 1, ..., 2, 1` in decreasing
      order.

      Solve it recursively. This is the mirror image of printing `1` to `n`: compare
      the two solutions and notice that the only difference is *when* each call does
      its own bit of work - before or after it recurses.
    inputFormat: |
      - Line 1: a single integer `n`.
    outputFormat: |
      Print the `n` numbers on one line, separated by single spaces, in decreasing
      order.
    constraints:
      - "1 <= n <= 2000"
    examples:
      - input: |
          5
        output: |
          5 4 3 2 1
        explanation: "The numbers 5 down to 1."
      - input: |
          1
        output: |
          1
        explanation: "Only the number 1 is produced."
    hints:
      - "A function f(k) that records k and then calls f(k - 1) already produces a decreasing sequence."
      - "The base case is k == 0 (or k < 1): return without recording anything."
      - "If instead you count upwards with f(k) -> f(k + 1), record k *after* the recursive call and the sequence comes out reversed."
    explanation: |
      **Backward recursion - O(n) time, O(n) space.** Define `f(k)`: if `k < 1`
      return, otherwise record `k` and call `f(k - 1)`. Each value is recorded on the
      way *down*, so they appear as `n, n - 1, ..., 1`. There are `n + 1` calls and
      the stack grows to depth `n`.

      **Forward recursion - O(n) time, O(n) space.** Define `g(k)`: if `k > n`
      return, otherwise call `g(k + 1)` first and record `k` afterwards. Nothing is
      recorded until the deepest call returns, so `n` is recorded first and `1` last.

      Putting this problem next to "print 1 to N" is the point of the exercise: the
      same call chain gives either order depending on whether the work is placed
      before the recursive call (pre-order) or after it (post-order). That single
      choice is what later distinguishes pre-order from post-order traversals of a
      tree.

      **Loop - O(n) time, O(1) extra space.** Iterating `k` from `n` down to `1`
      costs no stack at all, which is the practical trade-off recursion makes.
    starterCode:
      python: |
        import sys
        from typing import List


        def numbers_n_to_one(n: int) -> List[int]:
            # Return [n, n - 1, ..., 1], built recursively.
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            n = int(sys.stdin.readline())
            print(" ".join(str(v) for v in numbers_n_to_one(n)))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def numbers_n_to_one(n: int) -> List[int]:
            values: List[int] = []

            def go(k: int) -> None:
                if k < 1:
                    return
                values.append(k)
                go(k - 1)

            go(n)
            return values


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            n = int(sys.stdin.readline())
            print(" ".join(str(v) for v in numbers_n_to_one(n)))


        if __name__ == "__main__":
            main()
