problems:
  - slug: count-digits
    title: Count Digits
    difficulty: Easy
    topic: Math
    subtopic: Basic Maths
    tags: [math, digits]
    sourceUrl: ""
    statement: |
      Given a non-negative integer `n`, determine how many digits it has when
      written in ordinary decimal notation (without leading zeros).

      The number `0` is written as a single digit, so it has exactly one digit.
    inputFormat: |
      - Line 1: a single integer `n`.
    outputFormat: |
      Print one integer: the number of decimal digits in `n`.
    constraints:
      - "0 <= n <= 10^18"
    examples:
      - input: |
          40721
        output: |
          5
        explanation: The digits are 4, 0, 7, 2 and 1, so there are five of them.
      - input: |
          0
        output: |
          1
        explanation: Zero is written as the single digit "0".
    hints:
      - The last digit of `n` is `n % 10`. What happens to `n` after `n // 10`?
      - Keep stripping the last digit until nothing is left, counting each step. Be careful with `n = 0`.
      - "A logarithm gives the answer directly: `floor(log10(n)) + 1` for `n > 0`, but floating-point error can bite for huge values."
    explanation: |
      **Convert to a string - O(d) time, O(d) space.** Turn the number into its
      decimal text and return the length. Simple, but uses extra memory for the
      string (`d` is the number of digits).

      **Repeated division - O(d) time, O(1) space.** While `n > 0`, divide it by
      10 and increase a counter. Handle `n = 0` separately (answer 1), since the
      loop would never run.

      **Logarithm - O(1) time, O(1) space.** For `n > 0` the digit count is
      `floor(log10(n)) + 1`. It is constant time, but floating-point rounding can
      be wrong near powers of ten for very large inputs, so the division loop is
      the safest general approach.
    starterCode:
      python: |
        import sys


        def count_digits(n: int) -> int:
            # Return the number of decimal digits of n (0 has one digit).
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            print(count_digits(n))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def count_digits(n: int) -> int:
            if n == 0:
                return 1
            count = 0
            while n > 0:
                n //= 10
                count += 1
            return count


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            print(count_digits(n))


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          40721
        expectedOutput: |
          5
        hidden: false
      - input: |
          0
        expectedOutput: |
          1
        hidden: false
      - input: |
          7
        expectedOutput: |
          1
        hidden: true
      - input: |
          10
        expectedOutput: |
          2
        hidden: true
      - input: |
          1000000
        expectedOutput: |
          7
        hidden: true
      - input: |
          999999999999999999
        expectedOutput: |
          18
        hidden: true
      - input: |
          1000000000000000000
        expectedOutput: |
          19
        hidden: true

  - slug: reverse-a-number
    title: Reverse a Number
    difficulty: Easy
    topic: Math
    subtopic: Basic Maths
    tags: [math, digits]
    sourceUrl: ""
    statement: |
      Given an integer `n`, write its digits in the opposite order and print the
      resulting integer.

      - Leading zeros that appear after reversing are dropped (reversing `3400`
        gives `43`).
      - The sign is kept: reversing `-81` gives `-18`.
    inputFormat: |
      - Line 1: a single integer `n`.
    outputFormat: |
      Print the reversed integer.
    constraints:
      - "-10^9 <= n <= 10^9"
    examples:
      - input: |
          2759
        output: |
          9572
        explanation: Reading the digits 2, 7, 5, 9 backwards gives 9572.
      - input: |
          -3400
        output: |
          -43
        explanation: The digits of 3400 reversed are 0043, which is 43 without leading zeros. The minus sign is kept.
    hints:
      - Work with the absolute value and remember the sign separately.
      - "Build the answer digit by digit: `rev = rev * 10 + n % 10`, then `n //= 10`."
    explanation: |
      **String reversal - O(d) time, O(d) space.** Convert `|n|` to a string,
      reverse it, convert back to an integer (which drops leading zeros) and
      re-apply the sign.

      **Arithmetic - O(d) time, O(1) space.** Take `m = |n|`. Repeatedly peel off
      the last digit with `m % 10` and append it to the result with
      `rev = rev * 10 + digit`, then drop that digit with `m //= 10`. Leading
      zeros vanish automatically because multiplying 0 by 10 is still 0. Finally
      negate the result if `n` was negative. `d` is the number of digits.
    starterCode:
      python: |
        import sys


        def reverse_number(n: int) -> int:
            # Return n with its digits reversed, keeping the sign.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            print(reverse_number(n))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def reverse_number(n: int) -> int:
            sign = -1 if n < 0 else 1
            m = abs(n)
            rev = 0
            while m > 0:
                rev = rev * 10 + m % 10
                m //= 10
            return sign * rev


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            print(reverse_number(n))


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          2759
        expectedOutput: |
          9572
        hidden: false
      - input: |
          -3400
        expectedOutput: |
          -43
        hidden: false
      - input: |
          0
        expectedOutput: |
          0
        hidden: true
      - input: |
          8
        expectedOutput: |
          8
        hidden: true
      - input: |
          -1
        expectedOutput: |
          -1
        hidden: true
      - input: |
          1000000000
        expectedOutput: |
          1
        hidden: true
      - input: |
          123456789
        expectedOutput: |
          987654321
        hidden: true
      - input: |
          -1000000000
        expectedOutput: |
          -1
        hidden: true

  - slug: palindrome-number
    title: Palindrome Number
    difficulty: Easy
    topic: Math
    subtopic: Basic Maths
    tags: [math, digits]
    sourceUrl: https://leetcode.com/problems/palindrome-number/
    statement: |
      An integer is a **palindrome** if its decimal representation reads the same
      from left to right and from right to left.

      Given an integer `n`, decide whether it is a palindrome. Negative numbers
      are never palindromes, because the minus sign only appears at the front.
    inputFormat: |
      - Line 1: a single integer `n`.
    outputFormat: |
      Print `true` if `n` is a palindrome, otherwise `false`.
    constraints:
      - "-2^31 <= n <= 2^31 - 1"
    examples:
      - input: |
          4884
        output: |
          true
        explanation: 4884 read backwards is still 4884.
      - input: |
          -505
        output: |
          false
        explanation: Backwards the text is "505-", which differs from "-505".
    hints:
      - Negative numbers can be rejected immediately.
      - Reverse the digits of `n` arithmetically and compare with the original.
      - "Optimization: you only need to reverse the second half of the digits and compare it with the first half."
    explanation: |
      **String check - O(d) time, O(d) space.** Convert `n` to a string and
      compare it with its reverse.

      **Full reversal - O(d) time, O(1) space.** If `n < 0` answer `false`.
      Otherwise build the reversed number digit by digit (as in *Reverse a
      Number*) and compare it with `n`.

      **Half reversal - O(d) time, O(1) space.** Numbers ending in 0 (other than 0
      itself) are not palindromes. Otherwise move digits from the end of `n` into
      `rev` while `n > rev`. When the loop stops, the number is a palindrome if
      `n == rev` (even length) or `n == rev // 10` (odd length, the middle digit
      is ignored). This avoids building a number larger than the input.
    starterCode:
      python: |
        import sys


        def is_palindrome(n: int) -> bool:
            # Return True if n reads the same forwards and backwards.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            print("true" if is_palindrome(n) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def is_palindrome(n: int) -> bool:
            if n < 0 or (n % 10 == 0 and n != 0):
                return False
            rev = 0
            while n > rev:
                rev = rev * 10 + n % 10
                n //= 10
            return n == rev or n == rev // 10


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            print("true" if is_palindrome(n) else "false")


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          4884
        expectedOutput: |
          true
        hidden: false
      - input: |
          -505
        expectedOutput: |
          false
        hidden: false
      - input: |
          0
        expectedOutput: |
          true
        hidden: true
      - input: |
          10
        expectedOutput: |
          false
        hidden: true
      - input: |
          1234321
        expectedOutput: |
          true
        hidden: true
      - input: |
          1000021
        expectedOutput: |
          false
        hidden: true
      - input: |
          2147483647
        expectedOutput: |
          false
        hidden: true
      - input: |
          1111111111
        expectedOutput: |
          true
        hidden: true
      - input: |
          -2147483648
        expectedOutput: |
          false
        hidden: true

  - slug: gcd-of-two-numbers
    title: GCD of Two Numbers
    difficulty: Easy
    topic: Math
    subtopic: Basic Maths
    tags: [math, gcd, euclid]
    sourceUrl: ""
    statement: |
      The **greatest common divisor** (GCD) of two non-negative integers `a` and
      `b` is the largest integer that divides both of them without a remainder.

      Given `a` and `b` (not both zero), compute their GCD. By convention
      `gcd(x, 0) = x`.
    inputFormat: |
      - Line 1: two integers `a` and `b` separated by a space.
    outputFormat: |
      Print one integer: `gcd(a, b)`.
    constraints:
      - "0 <= a, b <= 10^12"
      - "a and b are not both zero."
    examples:
      - input: |
          84 60
        output: |
          12
        explanation: The common divisors of 84 and 60 are 1, 2, 3, 4, 6 and 12. The largest is 12.
      - input: |
          25 14
        output: |
          1
        explanation: 25 = 5 * 5 and 14 = 2 * 7 share no prime factor, so only 1 divides both.
    hints:
      - "A brute force tries every candidate from `min(a, b)` down to 1. That is too slow for values near 10^12."
      - Any number dividing both `a` and `b` also divides `a - b`, and therefore `a % b`.
      - "Repeatedly replace `(a, b)` with `(b, a % b)` until `b` becomes 0."
    explanation: |
      **Brute force - O(min(a, b)) time, O(1) space.** Try every `d` from
      `min(a, b)` down to 1 and return the first that divides both. Too slow for
      the upper constraint.

      **Subtraction (original Euclid) - O(max(a, b)) worst case, O(1) space.**
      `gcd(a, b) = gcd(a - b, b)` when `a >= b`. Repeatedly subtract the smaller
      from the larger. Correct, but numbers like `(10^12, 1)` need a huge number
      of steps.

      **Euclidean algorithm with remainders - O(log(min(a, b))) time, O(1)
      space.** Since `a % b` is what remains after subtracting `b` as many times
      as possible, `gcd(a, b) = gcd(b, a % b)`. Loop until `b == 0`; the answer
      is then `a`. The values shrink at least by half every two steps, which gives
      the logarithmic bound.
    starterCode:
      python: |
        import sys


        def gcd(a: int, b: int) -> int:
            # Return the greatest common divisor of a and b.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            a, b = int(data[0]), int(data[1])
            print(gcd(a, b))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def gcd(a: int, b: int) -> int:
            while b:
                a, b = b, a % b
            return a


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            a, b = int(data[0]), int(data[1])
            print(gcd(a, b))


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          84 60
        expectedOutput: |
          12
        hidden: false
      - input: |
          25 14
        expectedOutput: |
          1
        hidden: false
      - input: |
          0 9
        expectedOutput: |
          9
        hidden: true
      - input: |
          13 0
        expectedOutput: |
          13
        hidden: true
      - input: |
          7 7
        expectedOutput: |
          7
        hidden: true
      - input: |
          1000000000000 250000000000
        expectedOutput: |
          250000000000
        hidden: true
      - input: |
          600851475143 6857
        expectedOutput: |
          6857
        hidden: true
      - input: |
          123456789012 987654321098
        expectedOutput: |
          2
        hidden: true
      - input: |
          1000000000000 1
        expectedOutput: |
          1
        hidden: true

  - slug: armstrong-number
    title: Armstrong Number
    difficulty: Easy
    topic: Math
    subtopic: Basic Maths
    tags: [math, digits]
    sourceUrl: ""
    statement: |
      Let `k` be the number of digits of a non-negative integer `n`. The number
      is called an **Armstrong number** if the sum of each of its digits raised
      to the power `k` equals `n` itself.

      For example, `370` has 3 digits and `3^3 + 7^3 + 0^3 = 27 + 343 + 0 = 370`,
      so it is an Armstrong number.

      Given `n`, decide whether it is an Armstrong number.
    inputFormat: |
      - Line 1: a single integer `n`.
    outputFormat: |
      Print `true` if `n` is an Armstrong number, otherwise `false`.
    constraints:
      - "0 <= n <= 10^9"
    examples:
      - input: |
          370
        output: |
          true
        explanation: 3^3 + 7^3 + 0^3 = 27 + 343 + 0 = 370.
      - input: |
          250
        output: |
          false
        explanation: 2^3 + 5^3 + 0^3 = 8 + 125 + 0 = 133, which is not 250.
    hints:
      - First count the digits of `n` to know the exponent `k`.
      - Then walk through the digits again with `% 10` and `// 10`, adding `digit ** k`.
    explanation: |
      **String based - O(d) time, O(d) space.** Convert `n` to a string, let
      `k` be its length and sum `int(c) ** k` over its characters. Compare the
      sum with `n`.

      **Arithmetic - O(d) time, O(1) space.** Count the digits with a division
      loop (0 has one digit). Then, on a copy of `n`, repeatedly take the last
      digit, add `digit ** k` to a running total and remove the digit. The number
      is an Armstrong number exactly when the total equals `n`. Here `d` is the
      number of digits (at most 10), so both approaches are effectively constant
      time; computing each power is O(log k) with fast exponentiation.
    starterCode:
      python: |
        import sys


        def is_armstrong(n: int) -> bool:
            # Return True if the sum of digit**(number of digits) equals n.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            print("true" if is_armstrong(n) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def is_armstrong(n: int) -> bool:
            k = 0
            m = n
            while True:
                k += 1
                m //= 10
                if m == 0:
                    break
            total = 0
            m = n
            while m > 0:
                total += (m % 10) ** k
                m //= 10
            return total == n


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            print("true" if is_armstrong(n) else "false")


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          370
        expectedOutput: |
          true
        hidden: false
      - input: |
          250
        expectedOutput: |
          false
        hidden: false
      - input: |
          0
        expectedOutput: |
          true
        hidden: true
      - input: |
          9
        expectedOutput: |
          true
        hidden: true
      - input: |
          10
        expectedOutput: |
          false
        hidden: true
      - input: |
          9474
        expectedOutput: |
          true
        hidden: true
      - input: |
          9475
        expectedOutput: |
          false
        hidden: true
      - input: |
          548834
        expectedOutput: |
          true
        hidden: true
      - input: |
          1000000000
        expectedOutput: |
          false
        hidden: true

  - slug: print-all-divisors
    title: Print All Divisors
    difficulty: Easy
    topic: Math
    subtopic: Basic Maths
    tags: [math, divisors]
    sourceUrl: ""
    statement: |
      A positive integer `d` is a **divisor** of `n` when dividing `n` by `d`
      leaves no remainder. Every `n` has at least two divisors: `1` and `n`
      itself (for `n = 1` those coincide, so there is only one).

      Given a positive integer `n`, list every divisor of `n` in **increasing
      order**.
    inputFormat: |
      - Line 1: a single integer `n`.
    outputFormat: |
      Print all divisors of `n` on one line, space-separated, in ascending order.
    constraints:
      - "1 <= n <= 10^10"
    examples:
      - input: |
          20
        output: |
          1 2 4 5 10 20
        explanation: Each of these numbers divides 20 with remainder 0, and no other positive integer does.
      - input: |
          17
        output: |
          1 17
        explanation: 17 is prime, so its only divisors are 1 and itself.
    hints:
      - Checking every number from 1 to `n` works but is far too slow for `n = 10^10`.
      - "Divisors come in pairs `(i, n // i)`. One element of each pair is at most `sqrt(n)`."
      - Collect the small partners in increasing order and the large partners in decreasing order, then join them. Watch out for perfect squares.
    explanation: |
      **Brute force - O(n) time, O(number of divisors) space.** Test every
      `i` from 1 to `n`. Already sorted, but 10^10 iterations is far too many.

      **Square-root pairing - O(sqrt(n)) time, O(number of divisors) space.**
      Loop `i` from 1 while `i * i <= n`. Whenever `i` divides `n`, record `i` in
      a `small` list and, if `n // i != i`, record `n // i` in a `large` list.
      `small` is increasing and `large` is decreasing, so the sorted answer is
      `small` followed by `large` reversed. The `i != n // i` check prevents
      printing the square root of a perfect square twice. Collecting all divisors
      and calling a sort also works, adding an `O(k log k)` term for `k`
      divisors.
    starterCode:
      python: |
        import sys
        from typing import List


        def all_divisors(n: int) -> List[int]:
            # Return every divisor of n in increasing order.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            print(" ".join(map(str, all_divisors(n))))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def all_divisors(n: int) -> List[int]:
            small: List[int] = []
            large: List[int] = []
            i = 1
            while i * i <= n:
                if n % i == 0:
                    small.append(i)
                    if i != n // i:
                        large.append(n // i)
                i += 1
            return small + large[::-1]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            print(" ".join(map(str, all_divisors(n))))


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          20
        expectedOutput: |
          1 2 4 5 10 20
        hidden: false
      - input: |
          17
        expectedOutput: |
          1 17
        hidden: false
      - input: |
          1
        expectedOutput: |
          1
        hidden: true
      - input: |
          36
        expectedOutput: |
          1 2 3 4 6 9 12 18 36
        hidden: true
      - input: |
          9699690
        expectedOutput: |
          1 2 3 5 6 7 10 11 13 14 15 17 19 21 22 26 30 33 34 35 38 39 42 51 55 57 65 66 70 77 78 85 91 95 102 105 110 114 119 130 133 143 154 165 170 182 187 190 195 209 210 221 231 238 247 255 266 273 285 286 323 330 357 374 385 390 399 418 429 442 455 462 494 510 546 561 570 595 627 646 663 665 714 715 741 770 798 858 910 935 969 1001 1045 1105 1122 1155 1190 1235 1254 1309 1326 1330 1365 1430 1463 1482 1547 1615 1729 1785 1870 1938 1995 2002 2090 2145 2210 2261 2310 2431 2470 2618 2717 2730 2805 2926 3003 3094 3135 3230 3315 3458 3553 3570 3705 3927 3990 4199 4290 4389 4522 4641 4845 4862 5005 5187 5434 5610 6006 6270 6545 6630 6783 7106 7293 7315 7410 7735 7854 8151 8398 8645 8778 9282 9690 10010 10374 10659 11305 12155 12597 13090 13566 13585 14586 14630 15015 15470 16302 17017 17290 17765 19019 19635 20995 21318 21945 22610 23205 24310 24871 25194 25935 27170 29393 30030 33915 34034 35530 36465 38038 39270 40755 41990 43890 46189 46410 49742 51051 51870 53295 57057 58786 62985 67830 72930 74613 81510 85085 88179 92378 95095 102102 106590 114114 124355 125970 138567 146965 149226 170170 176358 190190 230945 248710 255255 277134 285285 293930 323323 373065 440895 461890 510510 570570 646646 692835 746130 881790 969969 1385670 1616615 1939938 3233230 4849845 9699690
