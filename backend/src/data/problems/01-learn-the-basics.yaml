  - sheetId: prob-1-7-3-highest-occurring-element
    slug: highest-occurring-element-in-an-array
    title: Highest Occurring Element in an Array
    difficulty: Easy
    topic: Hashing
    subtopic: Learn Basic Hashing
    tags: [hashing, array, counting]
    sourceUrl: ""
    statement: |
      You are given an integer array `arr` of length `n`.

      Find the value that occurs most often in `arr`. If several values are tied for
      the highest number of occurrences, report the **smallest** of them, so that the
      answer is always unique.

      Print that value together with how many times it occurs.
    inputFormat: |
      - Line 1: a single integer `n`.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print two integers on one line, separated by a space: the most frequent value
      and its number of occurrences.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= arr[i] <= 10^9"
    examples:
      - input: |
          8
          4 1 4 7 4 1 9 1
        output: |
          1 3
        explanation: "Both 4 and 1 occur three times and every other value occurs once. The tie is broken in favour of the smaller value, 1."
      - input: |
          5
          -2 5 -2 -2 8
        output: |
          -2 3
        explanation: "-2 occurs three times, which beats 5 and 8 with one occurrence each."
    hints:
      - "Count the occurrences of every distinct value first, then pick the best entry from those counts."
      - "The values can be as large as 10^9, so a plain array indexed by value is impossible - use a dictionary keyed by the value."
      - "When comparing two candidates, take the one with the larger count, and on equal counts the one with the smaller value."
    explanation: |
      **Brute force - O(n^2) time, O(1) space.** For every position, count how many
      elements equal `arr[i]` and keep the best pair seen. With `n = 10^5` that is
      `10^10` comparisons.

      **Sorting - O(n log n) time, O(1) extra space.** After sorting, equal values sit
      next to each other, so one pass measures the length of every run. Because the
      array is sorted ascending and we only replace the best candidate on a *strictly*
      larger count, the first run of the maximum length is kept - which is exactly the
      smallest value among the tied ones.

      **Hashing - O(n) time, O(k) space** where `k` is the number of distinct values.
      Walk the array once and increment `counts[value]` in a dictionary. Then walk the
      dictionary once and keep the entry with the largest count, breaking ties by the
      smaller value:

      ```
      better = count > best_count or (count == best_count and value < best_value)
      ```

      A dictionary is necessary here rather than a fixed-size array because the values
      range over `+/- 10^9` while there are at most `10^5` of them - hashing spends
      space proportional to how many distinct values actually appear, not to how large
      they can be. The tie-break has to be written explicitly; iterating a dictionary
      happens to visit keys in insertion order in CPython, which is not the order the
      statement asks for.
