  - sheetId: prob-1-6-6-factorial-of-a-given-numb
    slug: factorial-of-a-given-number
    title: Factorial of a given number
    difficulty: Easy
    topic: Recursion
    subtopic: Learn Basic Recursion
    tags: [recursion, math, basics]
    sourceUrl: ""
    statement: |
      The factorial of a non-negative integer `n`, written `n!`, is the product of
      all integers from `1` to `n`:

      ```
      n! = 1 x 2 x 3 x ... x n
      ```

      By definition `0! = 1` (an empty product).

      Given `n`, print `n!` exactly - the value can be far larger than a 64-bit
      integer, and Python integers grow as needed.

      Solve it recursively.
    inputFormat: |
      - Line 1: a single integer `n`.
    outputFormat: |
      Print one integer: the exact value of `n!`.
    constraints:
      - "0 <= n <= 300"
    examples:
      - input: |
          5
        output: |
          120
        explanation: "5! = 1 x 2 x 3 x 4 x 5 = 120."
      - input: |
          0
        output: |
          1
        explanation: "The factorial of 0 is defined as 1."
    hints:
      - "n! is just n multiplied by (n - 1)!."
      - "Stop at n == 0 and return 1 - that base case is what makes 1! come out as 1."
      - "Do not use floating point: the answer must be exact, so keep everything in integers."
    explanation: |
      **Recursion - O(n) multiplications, O(n) space.** Write the definition
      directly:

      - base case: `fact(0) = 1`;
      - recursive case: `fact(n) = n * fact(n - 1)`.

      There are `n + 1` calls and `n` multiplications, and the stack reaches depth
      `n`. (Counting *big-integer* multiplications as O(1) is a simplification: `n!`
      has about `n log n` digits, so the real cost of the multiplications grows a
      little faster than linearly. That is true of the loop as well.)

      **Loop - O(n) time, O(1) space.** A running product from `1` to `n`; identical
      arithmetic, no stack frames.

      Two things to be careful about. First, the base case must be `1`, not `0` -
      returning `0` would make every answer `0`. Second, in languages with fixed-width
      integers `n!` overflows at `n = 21` for 64-bit types, which is why such problems
      usually ask for the answer modulo a prime; Python's arbitrary-precision integers
      let us print the exact value instead.
    starterCode:
      python: |
        import sys


        def factorial(n: int) -> int:
            # Return n! (with 0! = 1), computed recursively.
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            n = int(sys.stdin.readline())
            print(factorial(n))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def factorial(n: int) -> int:
            if n <= 1:
                return 1
            return n * factorial(n - 1)


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            n = int(sys.stdin.readline())
            print(factorial(n))


        if __name__ == "__main__":
            main()
