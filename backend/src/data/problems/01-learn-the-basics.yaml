  - slug: check-prime
    title: Check Prime
    difficulty: Easy
    topic: Math
    subtopic: Basic Maths
    tags: [math, primes]
    sourceUrl: ""
    statement: |
      A **prime** is an integer greater than 1 whose only positive divisors are 1
      and the number itself.

      Given a positive integer `n`, decide whether it is prime.
    inputFormat: |
      - Line 1: a single integer `n`.
    outputFormat: |
      Print `true` if `n` is prime, otherwise `false`.
    constraints:
      - "1 <= n <= 10^12"
    examples:
      - input: |
          29
        output: |
          true
        explanation: No integer between 2 and 28 divides 29.
      - input: |
          91
        output: |
          false
        explanation: 91 = 7 * 13, so it has divisors other than 1 and 91.
    hints:
      - Remember that 1 is not prime.
      - "If `n` has a divisor `d` with `1 < d < n`, then it also has one that is at most `sqrt(n)`."
      - "After handling 2 and 3, every prime has the form `6k - 1` or `6k + 1`, so you can skip most candidates."
    explanation: |
      **Brute force - O(n) time, O(1) space.** Count divisors from 1 to `n`;
      `n` is prime when the count is exactly 2. Impossible for `n = 10^12`.

      **Trial division up to sqrt(n) - O(sqrt(n)) time, O(1) space.** If `n` is
      composite, `n = a * b` with `a <= b`, so `a <= sqrt(n)`. Test divisors
      `i = 2, 3, ...` while `i * i <= n`; if none divides `n` (and `n > 1`), it
      is prime. That is at most 10^6 checks.

      **6k +/- 1 optimization - O(sqrt(n)) time with a ~3x smaller constant, O(1)
      space.** Handle `n < 4`, and divisibility by 2 and 3, directly. Every other
      candidate divisor can be taken from `5, 7, 11, 13, 17, 19, ...` (pairs
      `i` and `i + 2`, stepping `i` by 6), because all remaining integers are
      multiples of 2 or 3.
    starterCode:
      python: |
        import sys


        def is_prime(n: int) -> bool:
            # Return True if n is a prime number.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            print("true" if is_prime(n) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def is_prime(n: int) -> bool:
            if n < 2:
                return False
            if n < 4:
                return True
            if n % 2 == 0 or n % 3 == 0:
                return False
            i = 5
            while i * i <= n:
                if n % i == 0 or n % (i + 2) == 0:
                    return False
                i += 6
            return True


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            print("true" if is_prime(n) else "false")


        if __name__ == "__main__":
            main()
