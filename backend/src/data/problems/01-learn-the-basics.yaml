  - sheetId: prob-1-6-5-sum-of-first-n-numbers
    slug: sum-of-first-n-numbers
    title: Sum of First N Numbers
    difficulty: Easy
    topic: Recursion
    subtopic: Learn Basic Recursion
    tags: [recursion, math, basics]
    sourceUrl: ""
    statement: |
      Given an integer `n`, compute `1 + 2 + 3 + ... + n`.

      Solve it recursively. Unlike the previous exercises the function now has to
      *return* a value, so each call has to combine its own contribution with the
      answer that the deeper call gives back.
    inputFormat: |
      - Line 1: a single integer `n`.
    outputFormat: |
      Print one integer: the sum of the first `n` positive integers.
    constraints:
      - "1 <= n <= 5000"
    examples:
      - input: |
          5
        output: |
          15
        explanation: "1 + 2 + 3 + 4 + 5 = 15."
      - input: |
          1
        output: |
          1
        explanation: "The sum of the first 1 positive integers is 1 itself."
    hints:
      - "Express the answer for n in terms of the answer for n - 1."
      - "sum(n) = n + sum(n - 1), and sum(0) = 0 is the base case."
      - "The deeper call returns a number; add n to it and return the total - do not print anything inside the recursion."
    explanation: |
      **Recursion - O(n) time, O(n) space.** Let `sum(n)` be the answer. Every
      recursive definition needs the same two lines:

      - base case: `sum(0) = 0`;
      - recursive case: `sum(n) = n + sum(n - 1)`.

      The chain `sum(n) -> sum(n - 1) -> ... -> sum(0)` makes `n + 1` calls, each
      doing one addition, so the time is O(n). The additions happen while the stack
      unwinds: the deepest call returns `0`, then `1`, then `1 + 2`, and so on. The
      stack holds `n` frames, hence O(n) space - the reason the constraint on `n`
      here is modest.

      **Loop - O(n) time, O(1) space.** Add the numbers one by one in a running
      total. Same time, no stack.

      **Closed form - O(1) time, O(1) space.** `1 + 2 + ... + n = n(n + 1)/2`.
      Pair the first number with the last, the second with the second-to-last, and
      so on: every pair sums to `n + 1` and there are `n/2` pairs. Use this to check
      your recursive answer - it is exact in Python because the product of two
      consecutive integers is always even.
    starterCode:
      python: |
        import sys


        def sum_first_n(n: int) -> int:
            # Return 1 + 2 + ... + n, computed recursively.
            pass


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            n = int(sys.stdin.readline())
            print(sum_first_n(n))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def sum_first_n(n: int) -> int:
            if n <= 0:
                return 0
            return n + sum_first_n(n - 1)


        # --- Input/output handling ---
        def main():
            sys.setrecursionlimit(10 ** 6)
            n = int(sys.stdin.readline())
            print(sum_first_n(n))


        if __name__ == "__main__":
            main()
