    referenceSolution:
      python: |
        import sys
        from typing import List


        def min_cost_to_cut_stick(length: int, cuts: List[int]) -> int:
            points = [0] + sorted(cuts) + [length]
            size = len(points)
            cost = [[0] * size for _ in range(size)]
            for span in range(2, size):
                for i in range(size - span):
                    j = i + span
                    row = cost[i]
                    best = -1
                    for k in range(i + 1, j):
                        candidate = row[k] + cost[k][j]
                        if best < 0 or candidate < best:
                            best = candidate
                    row[j] = best + points[j] - points[i]
            return cost[0][size - 1]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            length, m = int(data[0]), int(data[1])
            cuts = [int(x) for x in data[2:2 + m]]
            print(min_cost_to_cut_stick(length, cuts))


        if __name__ == "__main__":
            main()
