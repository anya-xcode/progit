  - sheetId: prob-16-7-2-print-longest-increasing-
    slug: print-longest-increasing-subsequence
    title: "Print Longest Increasing Subsequence"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "DP on LIS"
    tags: [dynamic-programming, array, reconstruction]
    sourceUrl: ""
    statement: |
      Given an integer array `nums`, print an actual **longest strictly increasing
      subsequence** - not just its length. A subsequence keeps the original order of
      the chosen elements but need not be contiguous, and *strictly increasing* means
      every chosen value is greater than the one before it.

      Many different subsequences can share the maximum length. To make the answer
      unique, print the **lexicographically smallest** one: compare two candidates
      position by position and prefer the one whose first differing value is smaller.
    inputFormat: |
      - Line 1: an integer `n`, the number of elements.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the values of the chosen subsequence on one line, separated by single
      spaces.
    constraints:
      - "1 <= n <= 1000"
      - "-1000000000 <= nums[i] <= 1000000000"
    examples:
      - input: |
          7
          4 10 4 3 8 9 12
        output: |
          3 8 9 12
        explanation: "The longest increasing subsequences have length 4: (4, 8, 9, 12) and (3, 8, 9, 12). The second is smaller because 3 < 4."
      - input: |
          4
          5 5 5 5
        output: |
          5
        explanation: "Equal values are not strictly increasing, so the best length is 1 and every single element is a candidate; the smallest value is 5."
    hints:
      - "Work with suffixes: let len[i] be the length of the longest increasing subsequence that STARTS at index i."
      - "len[i] = 1 + max(len[j]) over j > i with nums[j] > nums[i], or 1 if no such j exists. The answer's length is max(len)."
      - "Build the output greedily: repeatedly take the smallest value whose len equals the number of elements still needed and which is larger than the value already taken."
    explanation: |
      **Recursion - O(2^n) time.** `f(i)` = length of the longest strictly increasing
      subsequence starting at index `i`:
      `f(i) = 1 + max(f(j) for j > i with nums[j] > nums[i])`, or `1` when no such `j`
      exists. The overall length is `max(f(i))`.

      **Memoization - O(n^2) time, O(n) space.** There are `n` states and each one scans
      `O(n)` successors.

      **Tabulation - O(n^2) time, O(n) space.** Fill `len[i]` for `i` from `n-1` down to
      `0` with the same formula - no recursion, no stack.

      **Space optimization - not applicable.** The `len` array is already `O(n)` and the
      reconstruction reads all of it. (The `O(n log n)` patience-sorting method gives the
      *length* faster, but recovering an actual subsequence from it needs a parent
      array anyway.)

      **Reconstruction with a lexicographic tie-break - O(n^2) worst case.** Set
      `need = max(len)` and `start = 0`. Repeatedly look at every index `i >= start`
      with `len[i] == need` whose value is greater than the value picked last, and take
      the one with the **smallest value**; on a tie in value take the smallest index.
      Append it, set `start = i + 1`, decrease `need`, repeat until `need` hits `0`.

      Why that is correct: every candidate has the same length, so the smallest possible
      first value wins the comparison outright, and any index with `len[i] == need`
      really can be extended to `need` elements. Among equal values the earlier index is
      never worse, because it leaves a longer suffix to choose from.
    starterCode:
      python: |
        import sys
        from typing import List


        def print_longest_increasing_subsequence(nums: List[int]) -> List[int]:
            # Return the lexicographically smallest longest strictly increasing subsequence.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(x) for x in print_longest_increasing_subsequence(nums)))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def print_longest_increasing_subsequence(nums: List[int]) -> List[int]:
            n = len(nums)
            length = [1] * n
            for i in range(n - 2, -1, -1):
                value = nums[i]
                best = 0
                for j in range(i + 1, n):
                    if nums[j] > value and length[j] > best:
                        best = length[j]
                length[i] = best + 1

            need = max(length)
            result = []
            start = 0
            previous = 0
            has_previous = False
            while need > 0:
                chosen = -1
                for i in range(start, n):
                    if length[i] != need:
                        continue
                    if has_previous and nums[i] <= previous:
                        continue
                    if chosen == -1 or nums[i] < nums[chosen]:
                        chosen = i
                result.append(nums[chosen])
                previous = nums[chosen]
                has_previous = True
                start = chosen + 1
                need -= 1
            return result


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(x) for x in print_longest_increasing_subsequence(nums)))


        if __name__ == "__main__":
            main()
