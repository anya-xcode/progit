        from typing import List


        def unbounded_knapsack(weights: List[int], values: List[int], capacity: int) -> int:
            # Every kind may be used any number of times; maximize value within capacity.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, capacity = int(data[0]), int(data[1])
            weights = [int(x) for x in data[2:2 + n]]
            values = [int(x) for x in data[2 + n:2 + 2 * n]]
            print(unbounded_knapsack(weights, values, capacity))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def unbounded_knapsack(weights: List[int], values: List[int], capacity: int) -> int:
            dp = [0] * (capacity + 1)
            items = list(zip(weights, values))
            for cap in range(1, capacity + 1):
                best = 0
                for weight, value in items:
                    if weight <= cap:
                        candidate = value + dp[cap - weight]
                        if candidate > best:
                            best = candidate
                dp[cap] = best
            return dp[capacity]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, capacity = int(data[0]), int(data[1])
            weights = [int(x) for x in data[2:2 + n]]
            values = [int(x) for x in data[2 + n:2 + 2 * n]]
            print(unbounded_knapsack(weights, values, capacity))


        if __name__ == "__main__":
            main()
