    tags: [dynamic-programming, array, counting]
    sourceUrl: "https://leetcode.com/problems/number-of-longest-increasing-subsequence/"
    statement: |
      Given an integer array `nums`, first work out `L`, the length of its longest
      **strictly increasing subsequence**. Then count how many different subsequences of
      length `L` are strictly increasing.

      Subsequences are counted by the **positions** they use, so two of them are
      different when their index sets differ, even if the values happen to be identical.

      The count can be astronomically large, so print it **modulo `10^9 + 7`**.
    inputFormat: |
      - Line 1: an integer `n`, the number of elements.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the number of longest strictly increasing subsequences, taken modulo
      `10^9 + 7`.
    constraints:
      - "1 <= n <= 1000"
      - "-1000000000 <= nums[i] <= 1000000000"
    examples:
      - input: |
          5
          1 3 5 4 7
        output: |
          2
        explanation: "The longest length is 4, reached by (1, 3, 5, 7) and (1, 3, 4, 7): 2 subsequences."
      - input: |
          4
          2 2 2 2
        output: |
          4
        explanation: "The longest length is 1, and each of the four positions is a separate subsequence of that length."
    hints:
      - "Carry two arrays: len[i] = length of the best increasing subsequence ending at i, and ways[i] = how many of them there are."
      - "When a better predecessor j is found, len[i] grows and ways[i] is REPLACED by ways[j]; when j ties the current best, ways[i] += ways[j]."
      - "The answer sums ways[i] over every i where len[i] equals the overall maximum - not just the first one you find."
    explanation: |
      **Recursion - O(2^n) time.** Define `len(i)` = length of the longest strictly
      increasing subsequence ending at index `i` and `ways(i)` = how many such
      subsequences there are. Both look at every earlier index `j` with
      `nums[j] < nums[i]`.

      **Memoization - O(n^2) time, O(n) space.** Cache the pair `(len, ways)` per index.

      **Tabulation - O(n^2) time, O(n) space.** Initialize `len[i] = 1` and
      `ways[i] = 1` for every `i` (the subsequence consisting of `nums[i]` alone), then
      for `i` ascending scan every `j < i` with `nums[j] < nums[i]`:
      - if `len[j] + 1 > len[i]`: set `len[i] = len[j] + 1` and `ways[i] = ways[j]` -
        the old count belonged to a shorter length and is now obsolete;
      - else if `len[j] + 1 == len[i]`: `ways[i] = (ways[i] + ways[j]) % MOD` - another
        way to reach the same length.

      The answer is `sum(ways[i] for i with len[i] == max(len))` modulo `10^9 + 7`.

      **Space optimization - not applicable.** The final sum reads both arrays, so `O(n)`
      is the floor. (An `O(n log n)` version exists using a Fenwick tree keyed by value
      that stores, for each length, the best count - useful when `n` is much larger.)

      **The classic bug.** Overwriting instead of accumulating on ties, or accumulating
      instead of overwriting on improvements, silently gives a wrong count while the
      length stays right. Test with an array like `1 2 4 3 5 4 7 2`, which has several
      ties.
