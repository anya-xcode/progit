    referenceSolution:
      python: |
        import sys
        from typing import List


        def matrix_chain_cost(dims: List[int]) -> int:
            n = len(dims)
            # cost[i][j] = minimum cost for matrices i..j (1-based), 1 <= i <= j <= n - 1
            cost = [[0] * n for _ in range(n)]
            for i in range(n - 1, 0, -1):
                for j in range(i + 1, n):
                    outer = dims[i - 1] * dims[j]
                    best = None
                    for k in range(i, j):
                        candidate = cost[i][k] + cost[k + 1][j] + outer * dims[k]
                        if best is None or candidate < best:
                            best = candidate
                    cost[i][j] = best
            return cost[1][n - 1] if n > 1 else 0


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            dims = [int(x) for x in data[1:1 + n]]
            print(matrix_chain_cost(dims))


        if __name__ == "__main__":
            main()
