  - slug: matrix-chain-multiplication
    title: "Matrix Chain Multiplication"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "MCM DP / Partition DP"
    tags: [dynamic-programming, partition-dp]
    sourceUrl: ""
    statement: |
      You need to compute the product of a chain of `n - 1` matrices
      `M1 x M2 x ... x M(n-1)`. Matrix `Mi` has `dims[i-1]` rows and `dims[i]`
      columns, so every adjacent pair is compatible.

      Multiplying a `p x q` matrix by a `q x r` matrix costs `p * q * r` scalar
      multiplications. Matrix multiplication is associative, so you may choose any
      parenthesization; different choices can have very different total costs.

      Print the **minimum total cost** to multiply the whole chain. A chain with a
      single matrix costs `0`.
    inputFormat: |
      - Line 1: an integer `n`, the length of `dims`.
      - Line 2: `n` space-separated integers, the array `dims`.
    outputFormat: |
      Print the minimum number of scalar multiplications.
    constraints:
      - "2 <= n <= 100"
      - "1 <= dims[i] <= 100"
    examples:
      - input: |
          4
          10 20 30 40
        output: |
          18000
        explanation: "Matrices are 10x20, 20x30, 30x40. (M1 M2) M3 costs 10*20*30 + 10*30*40 = 18000, while M1 (M2 M3) costs 20*30*40 + 10*20*40 = 32000."
      - input: |
          3
          5 2 7
        output: |
          70
        explanation: "There are two matrices, 5x2 and 2x7, so the only product costs 5 * 2 * 7 = 70."
    hints:
      - "Pick the position of the last multiplication: it splits the chain into a left part and a right part."
      - "cost(i, j) = min over k of cost(i, k) + cost(k + 1, j) + dims[i - 1] * dims[k] * dims[j]."
      - "Fill the table by increasing chain length so shorter chains are ready before longer ones."
    explanation: |
      **Recursion - exponential (Catalan number of splits).** Let `f(i, j)` be the
      minimum cost to multiply matrices `Mi..Mj` (1-based). If `i == j` the cost is 0.
      Otherwise choose where the final multiplication happens:
      `f(i, j) = min over i <= k < j of f(i, k) + f(k+1, j) + dims[i-1] * dims[k] * dims[j]`.
      The answer is `f(1, n-1)`.

      **Memoization - O(n^3) time, O(n^2) space.** There are O(n^2) intervals, each
      trying O(n) split points.

      **Tabulation - O(n^3) time, O(n^2) space.** Since `f(i, j)` depends on shorter
      intervals, loop `i` from `n-1` down to `1` and `j` from `i+1` up to `n-1` (or loop
      by increasing interval length).

      **Space optimization.** Not practical for this partition DP: every interval may
      need every sub-interval, so O(n^2) space is the standard bound.
