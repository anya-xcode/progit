  - sheetId: prob-16-4-10-unbounded-knapsack
    slug: unbounded-knapsack
    title: "Unbounded Knapsack"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "DP on Subsequences"
    tags: [dynamic-programming, knapsack]
    sourceUrl: ""
    statement: |
      A workshop has `n` kinds of part. A part of kind `i` weighs `weight[i]` and sells
      for `value[i]`. The shop has an **unlimited** supply of every kind, so the same
      kind may be loaded any number of times (including zero).

      Your van carries a total weight of at most `W`. Print the maximum total value you
      can load.
    inputFormat: |
      - Line 1: two integers `n` and `W`.
      - Line 2: `n` space-separated integers, the array `weight`.
      - Line 3: `n` space-separated integers, the array `value`.
    outputFormat: |
      Print the maximum total value that fits in capacity `W`.
    constraints:
      - "1 <= n <= 100"
      - "1 <= W <= 1000"
      - "1 <= weight[i], value[i] <= 1000"
    examples:
      - input: |
          2 5
          2 3
          5 8
        output: |
          13
        explanation: "One part of each kind weighs 2 + 3 = 5 and is worth 5 + 8 = 13. Two parts of the first kind weigh 4 and are worth only 10."
      - input: |
          1 7
          3
          4
        output: |
          8
        explanation: "Two copies weigh 6 and are worth 8; a third copy would weigh 9, which does not fit."
    hints:
      - "Unlike 0/1 knapsack, taking an item does not move you past it - you may take the same kind again."
      - "best(i, cap) = max(best(i - 1, cap), value[i] + best(i, cap - weight[i])) - note the i, not i - 1, in the take branch."
      - "With one array and cap running upward, dp[cap - weight[i]] already accounts for earlier copies of item i, which is exactly what you want."
    explanation: |
      **Recursion - exponential.** `f(i, cap)` = best value using kinds `0..i` within
      capacity `cap`. Skipping kind `i` gives `f(i-1, cap)`; taking one copy gives
      `value[i] + f(i, cap - weight[i])` - the index stays at `i` because the supply is
      unlimited. At `i = 0` the answer is `(cap // weight[0]) * value[0]`.

      **Memoization - O(n * W) time, O(n * W) space.** The state is `(kind, capacity)`,
      so there are `n * (W + 1)` distinct calls even though the tree is exponential.

      **Tabulation - O(n * W) time, O(n * W) space.** Fill `dp[i][cap]` for increasing
      `i` and increasing `cap`; the take branch reads `dp[i][cap - weight[i]]`, which is
      in the same row and already computed.

      **Space optimization - O(n * W) time, O(W) space.** Because the take branch reads
      the *current* row, a single array works when `cap` runs upward - the opposite of
      0/1 knapsack, where `cap` must run downward to stop an item being reused.

      An equivalent one-array formulation processes capacities in the outer loop:
      `dp[cap] = max over kinds i with weight[i] <= cap of value[i] + dp[cap - weight[i]]`,
      also `O(n * W)`.
    starterCode:
