  - slug: ninjas-training
    title: "Ninja's Training"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "2D/3D DP and DP on Grids"
    tags: [dynamic-programming, matrix]
    sourceUrl: ""
    statement: |
      A ninja follows an `n`-day training plan. Every day they perform exactly one of
      three activities: **running (0)**, **fighting practice (1)** or **learning new
      moves (2)**. Doing activity `a` on day `i` earns `points[i][a]` merit points.

      The ninja gets bored easily, so they **never perform the same activity on two
      consecutive days**.

      Print the maximum total merit points the ninja can earn over all `n` days.
    inputFormat: |
      - Line 1: an integer `n`, the number of days.
      - Next `n` lines: three space-separated integers `points[i][0] points[i][1] points[i][2]`.
    outputFormat: |
      Print the maximum total points.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= points[i][a] <= 100"
    examples:
      - input: |
          3
          10 40 70
          20 50 80
          30 60 90
        output: |
          210
        explanation: "Choose activity 2 on day 0 (70), activity 1 on day 1 (50) and activity 2 on day 2 (90): 70 + 50 + 90 = 210."
      - input: |
          2
          1 2 5
          3 1 1
        output: |
          8
        explanation: "Choose activity 2 on day 0 (5) and activity 0 on day 1 (3)."
    hints:
      - "A greedy choice of the best activity each day can fail because it blocks tomorrow's best option."
      - "The state needs the day and the activity done on the previous day."
      - "dp[day][last] = max over activity != last of points[day][activity] + dp[day - 1][activity]."
    explanation: |
      **Recursion - O(3^n) time.** Let `f(day, last)` be the best total for days
      `0..day` when activity `last` is forbidden on `day` (use `last = 3` for "nothing
      forbidden"). Try each activity `a != last`:
      `f(day, last) = max(points[day][a] + f(day - 1, a))`. At `day = 0` just take the
      best allowed value.

      **Memoization - O(n * 4 * 3) time, O(n * 4) space.** There are only `4n` states;
      cache them.

      **Tabulation - O(n) time, O(n * 4) space.** Fill `dp[day][last]` from day 0
      upward.

      **Space optimization - O(n) time, O(1) space.** Row `day` depends only on row
      `day - 1`, so keep one array of size 3 (best total ending with each activity)
      and rebuild it every day.
    starterCode:
      python: |
        import sys
        from typing import List


        def ninja_training(points: List[List[int]]) -> int:
            # points[i][a] = merit for activity a on day i; no activity on two consecutive days.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            points = [[int(data[1 + 3 * i + a]) for a in range(3)] for i in range(n)]
            print(ninja_training(points))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def ninja_training(points: List[List[int]]) -> int:
            # prev[a] = best total so far when the last day used activity a
            prev = [0, 0, 0]
            for row in points:
                prev = [
                    row[0] + max(prev[1], prev[2]),
                    row[1] + max(prev[0], prev[2]),
                    row[2] + max(prev[0], prev[1]),
                ]
            return max(prev)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            points = [[int(data[1 + 3 * i + a]) for a in range(3)] for i in range(n)]
            print(ninja_training(points))


        if __name__ == "__main__":
            main()
