  - sheetId: prob-16-7-4-largest-divisible-subset
    slug: largest-divisible-subset
    title: "Largest Divisible Subset"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "DP on LIS"
    tags: [dynamic-programming, array, reconstruction]
    sourceUrl: "https://leetcode.com/problems/largest-divisible-subset/"
    statement: |
      You are given `n` **distinct** positive integers. Choose as many of them as
      possible so that for every pair `x`, `y` in your choice either `x` divides `y` or
      `y` divides `x`.

      Print the chosen numbers in **increasing order**. If several different choices
      reach the maximum size, print the **lexicographically smallest** one when each
      candidate is written in increasing order (compare position by position and prefer
      the smaller value at the first difference).
    inputFormat: |
      - Line 1: an integer `n`, the count of numbers.
      - Line 2: `n` space-separated distinct positive integers.
    outputFormat: |
      Print the chosen numbers in increasing order on one line, separated by single
      spaces.
    constraints:
      - "1 <= n <= 1000"
      - "1 <= nums[i] <= 1000000000"
      - "All values are distinct."
    examples:
      - input: |
          3
          1 2 3
        output: |
          1 2
        explanation: "Size 3 is impossible because 2 and 3 do not divide each other. Both {1, 2} and {1, 3} have size 2, and \"1 2\" is smaller."
      - input: |
          4
          1 2 4 8
        output: |
          1 2 4 8
        explanation: "Every pair in the whole set divides, so all four numbers can be taken."
    hints:
      - "Sort the values first. Then divisibility only has to be checked between a value and the ones after it."
      - "Divisibility is transitive, so a chain in which every element divides the next is automatically valid for every pair."
      - "Let chain[i] be the longest such chain starting at sorted index i - this is exactly the LIS pattern with 'is greater' replaced by 'is divisible by'."
    explanation: |
      **The key structure.** Sort the values ascending. Any valid subset, written in
      increasing order, has the property that each element divides the next; and
      conversely, because divisibility is transitive, any such chain is valid for *all*
      pairs. So the task is "longest chain under divisibility", which is the LIS
      recurrence with a different comparison.

      **Recursion - O(2^n) time.** `f(i)` = length of the longest divisible chain
      starting at sorted index `i`:
      `f(i) = 1 + max(f(j) for j > i with values[j] % values[i] == 0)`, or `1` if none.

      **Memoization - O(n^2) time, O(n) space.** `n` states, each scanning `O(n)`
      successors.

      **Tabulation - O(n^2) time, O(n) space.** Fill `chain[i]` for `i` from `n-1` down
      to `0`; the answer's size is `max(chain)`.

      **Space optimization - not applicable.** `chain` is already `O(n)` and printing the
      subset needs all of it.

      **Reconstruction with the lexicographic tie-break - O(n^2) worst case.** Set
      `need = max(chain)`, `start = 0` and `previous = 0`. Repeatedly scan forward from
      `start` for the **first** index `i` (values are sorted, so the first is the
      smallest) with `chain[i] == need` and `values[i] % previous == 0` (skip that test
      for the first pick). Take it, set `previous = values[i]`, `start = i + 1`,
      decrease `need`, and repeat.

      Every candidate subset has the same size, so the smallest possible first value
      wins the comparison, and such an index always exists because `chain[i] == need`
      guarantees a successor with `chain == need - 1`.

      Note that `O(n log n)` tricks do not transfer here: divisibility is not a total
      order, so the binary-search LIS method does not apply.
    starterCode:
      python: |
        import sys
        from typing import List


        def largest_divisible_subset(nums: List[int]) -> List[int]:
            # Return the largest pairwise-divisible subset, increasing, lexicographically smallest.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(x) for x in largest_divisible_subset(nums)))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def largest_divisible_subset(nums: List[int]) -> List[int]:
            values = sorted(nums)
            n = len(values)
            chain = [1] * n
            for i in range(n - 2, -1, -1):
                value = values[i]
                best = 0
                for j in range(i + 1, n):
                    if values[j] % value == 0 and chain[j] > best:
                        best = chain[j]
                chain[i] = best + 1

            need = max(chain)
            result = []
            start = 0
            previous = 0
            while need > 0:
                for i in range(start, n):
                    if chain[i] == need and (previous == 0 or values[i] % previous == 0):
                        result.append(values[i])
                        previous = values[i]
                        start = i + 1
                        need -= 1
                        break
            return result


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(x) for x in largest_divisible_subset(nums)))


        if __name__ == "__main__":
            main()
