    referenceSolution:
      python: |
        import sys
        from typing import List


        def maximal_rectangle(matrix: List[List[int]]) -> int:
            cols = len(matrix[0])
            heights = [0] * cols
            best = 0
            for cells in matrix:
                for j in range(cols):
                    heights[j] = heights[j] + 1 if cells[j] == 1 else 0
                stack: List[int] = []
                for j in range(cols + 1):
                    current = heights[j] if j < cols else 0
                    while stack and heights[stack[-1]] >= current:
                        height = heights[stack.pop()]
                        width = j if not stack else j - stack[-1] - 1
                        if height * width > best:
                            best = height * width
                    stack.append(j)
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            r, c = int(data[0]), int(data[1])
            values = [int(x) for x in data[2:2 + r * c]]
            matrix = [values[i * c:(i + 1) * c] for i in range(r)]
            print(maximal_rectangle(matrix))


        if __name__ == "__main__":
            main()
