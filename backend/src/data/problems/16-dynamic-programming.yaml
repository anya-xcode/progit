    statement: |
      You have an unlimited supply of coins of `n` distinct denominations. Find the
      **fewest number of coins** whose values add up to exactly `amount`.

      If the amount cannot be formed with the given coins, print `-1`. Forming an
      amount of `0` needs `0` coins.
    inputFormat: |
      - Line 1: two integers `n` and `amount`.
      - Line 2: `n` distinct space-separated integers, the coin denominations.
    outputFormat: |
      Print the minimum number of coins, or `-1` if it is impossible.
    constraints:
      - "1 <= n <= 12"
      - "1 <= coins[i] <= 10^4"
      - "0 <= amount <= 10^4"
    examples:
      - input: |
          3 13
          1 4 6
        output: |
          3
        explanation: "13 = 6 + 6 + 1 uses 3 coins, and no two coins from {1, 4, 6} add up to 13."
      - input: |
          1 7
          2
        output: |
          -1
        explanation: "Only coins of value 2 exist, so an odd amount can never be formed."
    hints:
      - "Greedy (always take the largest coin) fails, e.g. coins {1, 3, 4} and amount 6."
      - "Because coins are unlimited, after taking coin i you may take coin i again: stay on the same index."
      - "minCoins[s] = 1 + min(minCoins[s - c]) over all coins c <= s."
    explanation: |
      **Recursion - exponential.** `f(i, t)` = fewest coins using denominations
      `0..i` to make `t`. Not taking coin `i`: `f(i-1, t)`. Taking it:
      `1 + f(i, t - coins[i])` (stay at `i`, since supply is unlimited). At `i = 0`,
      the answer is `t / coins[0]` if divisible, else infinity.

      **Memoization - O(n * amount) time, O(n * amount) space.**

      **Tabulation - O(n * amount) time, O(n * amount) space.**

      **Space optimization - O(n * amount) time, O(amount) space.** Use one array
      `dp[0..amount]` with `dp[0] = 0` and the rest infinity. For each coin, loop `s`
      **upward** from the coin value: `dp[s] = min(dp[s], dp[s - coin] + 1)`. The
      upward order lets a coin be reused. Print `-1` if `dp[amount]` is still infinity.
