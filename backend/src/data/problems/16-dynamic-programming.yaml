        import sys
        from typing import List


        def max_coins(nums: List[int]) -> int:
            a = [1] + nums + [1]
            size = len(a)
            best = [[0] * size for _ in range(size)]
            for left in range(size - 3, -1, -1):
                for right in range(left + 2, size):
                    edge = a[left] * a[right]
                    top = 0
                    for k in range(left + 1, right):
                        candidate = best[left][k] + best[k][right] + edge * a[k]
                        if candidate > top:
                            top = candidate
                    best[left][right] = top
            return best[0][size - 1]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(max_coins(nums))


        if __name__ == "__main__":
            main()
