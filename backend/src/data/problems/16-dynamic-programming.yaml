        from typing import List


        def rob(nums: List[int]) -> int:
            # Return the maximum sum of values with no two adjacent houses chosen.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(rob(nums))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def rob(nums: List[int]) -> int:
            prev2, prev1 = 0, 0
            for value in nums:
                prev2, prev1 = prev1, max(prev1, prev2 + value)
            return prev1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(rob(nums))


        if __name__ == "__main__":
            main()
