    referenceSolution:
      python: |
        import sys
        from typing import List

        MOD = 1_000_000_007


        def count_longest_increasing_subsequences(nums: List[int]) -> int:
            n = len(nums)
            length = [1] * n
            ways = [1] * n
            for i in range(1, n):
                value = nums[i]
                for j in range(i):
                    if nums[j] < value:
                        candidate = length[j] + 1
                        if candidate > length[i]:
                            length[i] = candidate
                            ways[i] = ways[j]
                        elif candidate == length[i]:
                            ways[i] = (ways[i] + ways[j]) % MOD
            best = max(length)
            total = 0
            for i in range(n):
                if length[i] == best:
                    total = (total + ways[i]) % MOD
            return total


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(count_longest_increasing_subsequences(nums))


        if __name__ == "__main__":
            main()
