  - slug: climbing-stairs
    title: "Climbing Stairs"
    difficulty: Easy
    topic: Dynamic Programming
    subtopic: "1D DP"
    tags: [dynamic-programming, math, memoization]
    sourceUrl: "https://leetcode.com/problems/climbing-stairs/"
    statement: |
      A staircase has `n` steps and you start on the ground (step 0). In a single
      move you may climb either **1 step** or **2 steps**.

      Count how many different sequences of moves take you from the ground to
      exactly step `n`. Two sequences are different if they differ in at least
      one move.
    inputFormat: |
      - Line 1: a single integer `n`.
    outputFormat: |
      Print the number of distinct ways to reach step `n`.
    constraints:
      - "1 <= n <= 45"
      - "The answer fits in a 32-bit signed integer."
    examples:
      - input: |
          2
        output: |
          2
        explanation: "Either take two single steps (1 + 1) or one double step (2)."
      - input: |
          3
        output: |
          3
        explanation: "The valid sequences are 1+1+1, 1+2 and 2+1."
    hints:
      - "Think about the very last move you make to land on step n. Where could you have been standing just before it?"
      - "ways(n) = ways(n - 1) + ways(n - 2). What are the base cases?"
      - "You only ever need the previous two values, so two variables are enough."
    explanation: |
      **Recursion - O(2^n) time, O(n) stack.** Let `f(i)` be the number of ways to
      reach step `i`. The last move is a 1-step (from `i-1`) or a 2-step (from
      `i-2`), so `f(i) = f(i-1) + f(i-2)` with `f(0) = 1` and `f(1) = 1`. Calling this
      directly recomputes the same subproblems exponentially many times.

      **Memoization - O(n) time, O(n) space.** Store `f(i)` in an array the first
      time it is computed and return the stored value on later calls.

      **Tabulation - O(n) time, O(n) space.** Fill `dp[0..n]` from the base cases
      upward using the same recurrence.

      **Space optimization - O(n) time, O(1) space.** `dp[i]` depends only on the
      two previous entries, so keep just `prev2` and `prev1` and slide them forward.
    starterCode:
      python: |
        import sys


        def climb_stairs(n: int) -> int:
            # Return the number of ways to reach step n using moves of 1 or 2 steps.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            print(climb_stairs(n))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def climb_stairs(n: int) -> int:
            prev2, prev1 = 1, 1  # ways to reach step 0 and step 1
            for _ in range(2, n + 1):
                prev2, prev1 = prev1, prev1 + prev2
            return prev1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            print(climb_stairs(n))


        if __name__ == "__main__":
            main()
