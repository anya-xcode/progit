    title: "0/1 Knapsack"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "DP on Subsequences"
    tags: [dynamic-programming, knapsack]
    sourceUrl: ""
    statement: |
      A thief has a bag that can carry a total weight of at most `W`. There are `n`
      items; item `i` weighs `weight[i]` and is worth `value[i]`. Each item can be
      taken **at most once** and cannot be broken into pieces.

      Print the maximum total value of items whose total weight does not exceed `W`.
    inputFormat: |
      - Line 1: two integers `n` and `W`.
      - Line 2: `n` space-separated integers, the weights.
      - Line 3: `n` space-separated integers, the values.
    outputFormat: |
      Print the maximum achievable total value.
    constraints:
      - "1 <= n <= 100"
      - "1 <= W <= 1000"
      - "1 <= weight[i], value[i] <= 1000"
    examples:
      - input: |
          3 5
          1 2 4
          10 15 40
        output: |
          50
        explanation: "Take the items of weight 1 and 4 (values 10 + 40). Their total weight is exactly 5."
      - input: |
          2 3
          4 5
          10 20
        output: |
          0
        explanation: "Every item is heavier than the capacity 3, so nothing can be taken."
    hints:
      - "Each item is a pick / not-pick decision, and picking reduces the remaining capacity."
      - "best(i, cap) = max(best(i - 1, cap), value[i] + best(i - 1, cap - weight[i])) when weight[i] <= cap."
      - "Iterating capacity from high to low lets you keep a single 1D array."
    explanation: |
      **Recursion - O(2^n) time.** `f(i, cap)` = best value using items `0..i` with
      capacity `cap`. Skip item `i`: `f(i-1, cap)`. Take it (if it fits):
      `value[i] + f(i-1, cap - weight[i])`. At `i = 0` take the item if it fits.

      **Memoization - O(n * W) time, O(n * W) space.**

      **Tabulation - O(n * W) time, O(n * W) space.** `dp[i][cap]` filled row by row.

      **Space optimization - O(n * W) time, O(W) space.** Row `i` only reads row `i-1`.
      With one array, loop `cap` from `W` down to `weight[i]` so `dp[cap - weight[i]]`
      still refers to the previous row (each item is used at most once).
