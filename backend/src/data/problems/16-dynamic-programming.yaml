    referenceSolution:
      python: |
        import sys
        from typing import List


        def min_subset_sum_difference(arr: List[int]) -> int:
            total = sum(arr)
            reachable = 1  # bit s is set when some subset sums to s
            for value in arr:
                reachable |= reachable << value
            best = total
            for s in range(total // 2 + 1):
                if (reachable >> s) & 1:
                    difference = total - 2 * s
                    if difference < best:
                        best = difference
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            arr = [int(x) for x in data[1:1 + n]]
            print(min_subset_sum_difference(arr))


        if __name__ == "__main__":
            main()
