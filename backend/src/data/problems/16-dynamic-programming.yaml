        import sys

        MOD = 1_000_000_007


        def count_distinct_subsequences(s: str, t: str) -> int:
            # Count position sets of s that spell t, modulo MOD.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s, t = data[0], data[1]
            print(count_distinct_subsequences(s, t))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys

        MOD = 1_000_000_007


        def count_distinct_subsequences(s: str, t: str) -> int:
            m = len(t)
            dp = [0] * (m + 1)
            dp[0] = 1  # the empty prefix of t is matched by picking nothing
            for ch in s:
                for j in range(m, 0, -1):
                    if t[j - 1] == ch:
                        dp[j] = (dp[j] + dp[j - 1]) % MOD
            return dp[m] % MOD


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s, t = data[0], data[1]
            print(count_distinct_subsequences(s, t))


        if __name__ == "__main__":
            main()
