    title: "Palindrome Partitioning II"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "MCM DP / Partition DP"
    tags: [dynamic-programming, string, partition-dp]
    sourceUrl: "https://leetcode.com/problems/palindrome-partitioning-ii/"
    statement: |
      You are given a string `s`. Cut it into consecutive non-empty pieces so that
      **every piece is a palindrome** (reads the same forwards and backwards).

      Print the **minimum number of cuts** needed. A string that is already a
      palindrome needs `0` cuts.
    inputFormat: |
      - Line 1: the string `s`.
    outputFormat: |
      Print the minimum number of cuts.
    constraints:
      - "1 <= |s| <= 500"
      - "s contains only lowercase English letters."
    examples:
      - input: |
          aabcb
        output: |
          1
        explanation: "One cut gives \"aa\" | \"bcb\", and both pieces are palindromes."
      - input: |
          abc
        output: |
          2
        explanation: "No two characters match, so every character must be its own piece: \"a\" | \"b\" | \"c\"."
    hints:
      - "Scan from the left: choose the first piece s[i..j] (it must be a palindrome), then solve the rest from j + 1."
      - "Precompute isPal[i][j] for all substrings in O(n^2) so each check is O(1)."
      - "minCuts = (minimum number of palindromic pieces) - 1."
    explanation: |
      This is "front partition" DP: decide the first piece and recurse on the rest.

      **Recursion - exponential.** `f(i)` = minimum number of palindromic pieces for
      the suffix `s[i..n-1]`, with `f(n) = 0`. Then
      `f(i) = min over j >= i with s[i..j] a palindrome of 1 + f(j+1)`. The answer is
      `f(0) - 1`.

      **Memoization - O(n^2) time with O(1) palindrome checks, O(n) space.** Checking
      palindromes naively adds another factor of `n`; precomputing a table
      `isPal[i][j] = s[i] == s[j] and (j - i < 2 or isPal[i+1][j-1])` costs O(n^2) time
      and space.

      **Tabulation - O(n^2) time, O(n^2) space (for isPal) + O(n).** Fill `dp[i]` from
      `i = n-1` down to `0` using the same formula.

      **Space note.** `dp` itself is already 1D. The palindrome table can be replaced by
      expanding around every centre and relaxing cuts, which keeps O(n^2) time with
      O(n) space.
    starterCode:
      python: |
        import sys


        def min_palindrome_cuts(s: str) -> int:
            # Return the fewest cuts so that every piece of s is a palindrome.
            pass


        # --- Input/output handling ---
