  - sheetId: prob-16-8-7-partition-array-for-maxim
    slug: partition-array-for-maximum-sum
    title: "Partition Array for Maximum Sum"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "MCM DP / Partition DP"
    tags: [dynamic-programming, partition-dp, array]
    sourceUrl: "https://leetcode.com/problems/partition-array-for-maximum-sum/"
    statement: |
      You are given an array `arr` of `n` non-negative integers and an integer `k`.

      Cut the array into **contiguous** blocks, each containing at most `k` elements,
      so that every element belongs to exactly one block. Then every element in a block
      is replaced by that block's largest value.

      Print the maximum possible sum of the array after this transformation.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print a single integer: the largest achievable sum.
    constraints:
      - "1 <= n <= 1000"
      - "1 <= k <= 100"
      - "0 <= arr[i] <= 1000000000"
      - "`k` may be larger than `n`, in which case the whole array can be one block."
    examples:
      - input: |
          7 3
          1 15 7 9 2 5 10
        output: |
          84
        explanation: "Blocks [1,15,7], [9], [2,5,10] become 15+15+15, 9, 10+10+10 = 45 + 9 + 30 = 84."
      - input: |
          4 1
          4 2 9 1
        output: |
          16
        explanation: "With k = 1 every block holds one element, so nothing changes and the sum is 4 + 2 + 9 + 1 = 16."
    hints:
      - "This is a FRONT partition: decide only where the first block ends, then solve the rest independently."
      - "best(i) = max over block lengths L = 1..k (not running past the end) of max(arr[i..i+L-1]) * L + best(i + L)."
      - "Extend the block one element at a time so the running maximum is free - no inner max() scan is needed."
    explanation: |
      **Front partition DP.** The only decision at position `i` is the length of the
      block that starts there. Once that is fixed, the block contributes
      `(its maximum) * (its length)` and the rest of the array is the same problem
      starting at `i + length`.

      **Recursion - O(k^n) in the worst case.** `f(i)` = best sum for `arr[i:]`, with
      `f(n) = 0` and
      `f(i) = max over L = 1..min(k, n-i) of max(arr[i..i+L-1]) * L + f(i + L)`.

      **Memoization - O(n * k) time, O(n) space.** There are only `n` states, each
      trying `k` block lengths; keep the running maximum while extending `L` so each
      state costs `O(k)` rather than `O(k^2)`.

      **Tabulation - O(n * k) time, O(n) space.** It is convenient to go the other way:
      let `dp[i]` be the best sum for the **first** `i` elements, `dp[0] = 0`, and

      ```
      for i = 1 .. n:
          running_max = 0
          for L = 1 .. min(k, i):
              running_max = max(running_max, arr[i - L])
              dp[i] = max(dp[i], dp[i - L] + running_max * L)
      ```

      The answer is `dp[n]`.

      **Space optimization - O(n * k) time, O(k) space.** `dp[i]` only reads the last `k`
      entries, so a circular buffer of size `k` would do - though with `O(n)` already
      being small, the full array is usually kept for clarity and for reconstructing the
      blocks.

      Greedy does not work here: always cutting at the local maximum can strand a large
      value in a block of length 1 where extending it would have paid more.
    starterCode:
