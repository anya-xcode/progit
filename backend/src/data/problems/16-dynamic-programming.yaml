    referenceSolution:
      python: |
        import sys
        from typing import List


        def max_profit_with_fee(prices: List[int], fee: int) -> int:
            free = 0            # best profit from here on while holding nothing
            holding = -10 ** 9  # best profit from here on while holding a share
            for price in reversed(prices):
                new_free = free if free > holding - price else holding - price
                new_holding = holding if holding > free + price - fee else free + price - fee
                free, holding = new_free, new_holding
            return free


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, fee = int(data[0]), int(data[1])
            prices = [int(x) for x in data[2:2 + n]]
            print(max_profit_with_fee(prices, fee))


        if __name__ == "__main__":
            main()
