      python: |
        import sys
        from typing import List


        def longest_bitonic_subsequence(nums: List[int]) -> int:
            n = len(nums)
            up = [1] * n
            for i in range(1, n):
                value = nums[i]
                best = 0
                for j in range(i):
                    if nums[j] < value and up[j] > best:
                        best = up[j]
                up[i] = best + 1

            down = [1] * n
            for i in range(n - 2, -1, -1):
                value = nums[i]
                best = 0
                for j in range(i + 1, n):
                    if nums[j] < value and down[j] > best:
                        best = down[j]
                down[i] = best + 1

            return max(up[i] + down[i] - 1 for i in range(n))


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(longest_bitonic_subsequence(nums))


        if __name__ == "__main__":
            main()
