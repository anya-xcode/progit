    referenceSolution:
      python: |
        import sys
        from typing import List


        def count_squares(matrix: List[List[int]]) -> int:
            cols = len(matrix[0])
            prev = [0] * cols
            total = 0
            for cells in matrix:
                cur = [0] * cols
                for j in range(cols):
                    if cells[j] == 1:
                        if j == 0:
                            cur[j] = 1
                        else:
                            cur[j] = 1 + min(prev[j], cur[j - 1], prev[j - 1])
                        total += cur[j]
                prev = cur
            return total


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            r, c = int(data[0]), int(data[1])
            values = [int(x) for x in data[2:2 + r * c]]
            matrix = [values[i * c:(i + 1) * c] for i in range(r)]
            print(count_squares(matrix))


        if __name__ == "__main__":
            main()
