  - slug: house-robber
    title: "House Robber"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "1D DP"
    tags: [dynamic-programming, array]
    sourceUrl: "https://leetcode.com/problems/house-robber/"
    statement: |
      A street has `n` houses in a line, and house `i` holds `nums[i]` coins. You want
      to collect as many coins as possible, but an alarm links every pair of
      **adjacent** houses: if you take coins from two neighbouring houses, you get
      caught.

      Choose a set of houses with no two adjacent ones and print the **maximum
      total** number of coins you can collect.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the maximum number of coins that can be collected.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= nums[i] <= 10^4"
    examples:
      - input: |
          4
          1 2 3 1
        output: |
          4
        explanation: "Take houses 0 and 2: 1 + 3 = 4."
      - input: |
          5
          2 7 9 3 1
        output: |
          12
        explanation: "Take houses 0, 2 and 4: 2 + 9 + 1 = 12."
    hints:
      - "For each house you either take it or skip it. What does taking it forbid?"
      - "best(i) = max(nums[i] + best(i - 2), best(i - 1))."
      - "Only the two previous answers are needed at any moment."
    explanation: |
      **Recursion - O(2^n) time.** Let `f(i)` be the best total using houses `0..i`.
      Either pick house `i` (then house `i-1` is unavailable) giving
      `nums[i] + f(i-2)`, or skip it giving `f(i-1)`. Base cases: `f(-1) = 0`,
      `f(0) = nums[0]`. This is the classic "maximum sum of non-adjacent elements".

      **Memoization - O(n) time, O(n) space.** Cache `f(i)`.

      **Tabulation - O(n) time, O(n) space.** Build `dp[i] = max(nums[i] + dp[i-2], dp[i-1])`
      from left to right.

      **Space optimization - O(n) time, O(1) space.** Keep only `prev1 = dp[i-1]` and
      `prev2 = dp[i-2]`.
    starterCode:
      python: |
