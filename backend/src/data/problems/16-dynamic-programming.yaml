    title: "Best Time to Buy and Sell Stock with Cooldown"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "DP on Stocks"
    tags: [dynamic-programming, array, state-machine]
    sourceUrl: "https://leetcode.com/problems/best-time-to-buy-and-sell-stock-with-cooldown/"
    statement: |
      `prices[i]` is the price of a stock on day `i`. You may complete as many
      transactions (buy one share, later sell it) as you like, subject to two rules:

      - You can hold **at most one share** at a time, so you must sell before buying again.
      - After you sell, you must wait a **cooldown** of one day: you cannot buy on the
        day right after a sale.

      Buying and selling happen at that day's price. Print the maximum total profit.
      Doing nothing (profit `0`) is always allowed.
    inputFormat: |
      - Line 1: an integer `n`, the number of days.
      - Line 2: `n` space-separated integers, the array `prices`.
    outputFormat: |
      Print the maximum profit.
    constraints:
      - "1 <= n <= 5000"
      - "0 <= prices[i] <= 1000"
    examples:
      - input: |
          6
          2 5 1 3 7 4
        output: |
          7
        explanation: "Buy on day 0 (2), sell on day 1 (5), cool down on day 2, buy on day 3 (3) and sell on day 4 (7): 3 + 4 = 7."
      - input: |
          3
          5 4 3
        output: |
          0
        explanation: "Prices only fall, so making no transaction is best."
    hints:
      - "On each day your situation is described by whether you are allowed to buy (not holding) or holding a share."
      - "Selling on day i means the next decision you can make is on day i + 2."
      - "f(i, canBuy): if canBuy, max(-prices[i] + f(i + 1, false), f(i + 1, true)); else max(prices[i] + f(i + 2, true), f(i + 1, false))."
    explanation: |
      **Recursion - O(2^n) time.** `f(i, buy)` = best profit from day `i` onward, where
      `buy = 1` means you are free to buy. Days past the end give 0.
      - `buy = 1`: `max(-prices[i] + f(i+1, 0), f(i+1, 1))`.
      - `buy = 0`: `max(prices[i] + f(i+2, 1), f(i+1, 0))` - selling jumps over the
        cooldown day.
      The answer is `f(0, 1)`.

      **Memoization - O(n) time, O(n) space.** There are `2n` states.

      **Tabulation - O(n) time, O(n) space.** Allocate `dp[n+2][2]` of zeros and fill
      `i` from `n-1` down to `0`.

      **Space optimization - O(n) time, O(1) space.** Row `i` reads rows `i+1` and
      `i+2` only, so keep `ahead1`, `ahead2` (two pairs) and slide them.
