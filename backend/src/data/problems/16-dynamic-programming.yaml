  - slug: frog-jump
    title: "Frog Jump"
    difficulty: Easy
    topic: Dynamic Programming
    subtopic: "1D DP"
    tags: [dynamic-programming, array]
    sourceUrl: ""
    statement: |
      A frog sits on stone `0` of a row of `n` stones. Stone `i` has height
      `heights[i]`. From stone `i` the frog can jump to stone `i + 1` or to stone
      `i + 2`. A jump from stone `i` to stone `j` costs `|heights[i] - heights[j]|`
      units of energy.

      Find the **minimum total energy** the frog needs to reach the last stone
      (`n - 1`).
    inputFormat: |
      - Line 1: an integer `n`, the number of stones.
      - Line 2: `n` space-separated integers, the array `heights`.
    outputFormat: |
      Print the minimum total energy needed to reach stone `n - 1`.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= heights[i] <= 10^4"
    examples:
      - input: |
          4
          10 20 30 10
        output: |
          20
        explanation: "Jump 0 -> 1 (cost |20 - 10| = 10), then 1 -> 3 (cost |10 - 20| = 10). Total 20."
      - input: |
          6
          30 10 60 10 60 50
        output: |
          40
        explanation: "Jump 0 -> 2 (cost 30), 2 -> 4 (cost 0), 4 -> 5 (cost 10). Total 40."
    hints:
      - "To land on stone i, the frog's previous stone was either i - 1 or i - 2."
      - "Let dp[i] be the minimum energy to reach stone i. Write dp[i] using dp[i - 1] and dp[i - 2]."
      - "dp[i] only looks two positions back, so the whole array is not needed."
    explanation: |
      **Recursion - O(2^n) time.** Define `f(i)` as the minimum energy to reach stone
      `i`. Then `f(0) = 0` and
      `f(i) = min(f(i-1) + |h[i] - h[i-1]|, f(i-2) + |h[i] - h[i-2]|)` (the second
      option only when `i >= 2`). Plain recursion explores overlapping branches
      repeatedly.

      **Memoization - O(n) time, O(n) space.** Cache each `f(i)` so every stone is
      solved once (plus O(n) recursion stack).

      **Tabulation - O(n) time, O(n) space.** Compute `dp[0], dp[1], ..., dp[n-1]` in
      order with the same formula, removing the recursion stack.

      **Space optimization - O(n) time, O(1) space.** Only `dp[i-1]` and `dp[i-2]` are
      read, so keep two variables instead of the array.
    starterCode:
      python: |
        import sys
        from typing import List


        def frog_jump(heights: List[int]) -> int:
            # Return the minimum energy to go from stone 0 to the last stone.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            heights = [int(x) for x in data[1:1 + n]]
            print(frog_jump(heights))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def frog_jump(heights: List[int]) -> int:
            prev2, prev1 = 0, 0  # best cost for stones i - 2 and i - 1
            for i in range(1, len(heights)):
                current = prev1 + abs(heights[i] - heights[i - 1])
                if i > 1:
                    current = min(current, prev2 + abs(heights[i] - heights[i - 2]))
                prev2, prev1 = prev1, current
            return prev1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            heights = [int(x) for x in data[1:1 + n]]
            print(frog_jump(heights))


        if __name__ == "__main__":
            main()
