    title: "Edit Distance"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "DP on Strings"
    tags: [dynamic-programming, string]
    sourceUrl: "https://leetcode.com/problems/edit-distance/"
    statement: |
      You are given two strings `a` and `b`. You want to transform `a` into `b` using
      the following operations, each costing 1:

      - **Insert** one character anywhere in the string.
      - **Delete** one character.
      - **Replace** one character with a different character.

      Print the minimum number of operations needed. Either string may be empty.
    inputFormat: |
      - Line 1: the string `a` (may be an empty line).
      - Line 2: the string `b` (may be an empty line or missing, meaning an empty string).
    outputFormat: |
      Print the minimum number of operations.
    constraints:
      - "0 <= |a|, |b| <= 500"
      - "Both strings contain only lowercase English letters."
    examples:
      - input: |
          flame
          frame
        output: |
          1
        explanation: "Replace 'l' with 'r'."
      - input: |
          abc
          yabd
        output: |
          2
        explanation: "Insert 'y' at the front (\"yabc\"), then replace 'c' with 'd' (\"yabd\")."
    hints:
      - "Look at the last characters of the current prefixes. If they are equal, no operation is needed for them."
      - "Otherwise try all three operations: each one shrinks one or both prefixes by one character."
      - "Converting a prefix of length i into an empty string takes exactly i deletions - that is your base row/column."
    explanation: |
      **Recursion - O(3^(n+m)) time.** `f(i, j)` = cost to turn `a[0..i-1]` into
      `b[0..j-1]`. `f(0, j) = j` (insert everything), `f(i, 0) = i` (delete
      everything). If `a[i-1] == b[j-1]`: `f(i, j) = f(i-1, j-1)`. Otherwise
      `f(i, j) = 1 + min(f(i, j-1)` (insert), `f(i-1, j)` (delete), `f(i-1, j-1)`
      (replace)`)`.

      **Memoization - O(n * m) time, O(n * m) space.**

      **Tabulation - O(n * m) time, O(n * m) space.** A `(n+1) x (m+1)` table with the
      base row and column filled first.

      **Space optimization - O(n * m) time, O(m) space.** Keep the previous row and the
      current row; remember that `cur[0] = i` for every row.
