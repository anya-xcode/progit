  - sheetId: prob-16-1-1-introduction-to-dp
    type: reference
    slug: introduction-to-dp
    title: "Introduction to DP"
    difficulty: Easy
    topic: Dynamic Programming
    subtopic: "Introduction to DP"
    tags: [dynamic-programming, theory]
    sourceUrl: ""
    statement: |
      **Dynamic programming (DP)** is what you get when a recursive solution keeps
      solving the *same* smaller problem over and over and you decide to stop paying
      for it twice.

      A problem is a DP problem when both of these hold:

      - **Optimal substructure.** The answer for the whole input can be built from the
        answers of strictly smaller inputs. "Best way to climb `n` stairs" is built
        from "best way to climb `n - 1`" and "best way to climb `n - 2`".
      - **Overlapping subproblems.** Those smaller inputs repeat. If you draw the
        recursion tree of `fib(6)` you will find `fib(3)` in four different places.
        (Merge sort also has optimal substructure, but its two halves never repeat -
        that is divide and conquer, not DP.)

      ### How to spot the overlap

      Write the brute-force recursion first and look at its **parameters**. If the
      function is `f(index, remaining_capacity)` and both arguments are small integers,
      then the number of *distinct* calls is at most
      `len(index_range) * len(capacity_range)` - but the recursion tree has `2^n`
      nodes. Whenever "number of distinct parameter tuples" is far smaller than
      "number of calls", every repeat is wasted work and DP applies.

      That set of distinct parameter tuples is called the **state**. Getting the state
      right is 90% of a DP problem; the recurrence usually falls out of the question
      "what choices do I have at this state?".

      ### The four steps you will repeat all through this section

      **1. Recursion.** Express the answer as a choice: "either I take this element or
      I skip it", "either the last move was a 1-step or a 2-step". Write `f(state)` in
      terms of smaller states, plus base cases. This is correct but exponential.

      **2. Memoization (top-down).** Keep a table indexed by the state. On entry,
      return the stored value if it is there; otherwise compute it and store it before
      returning. Time becomes `O(number of states * work per state)`. Space is the
      table **plus the recursion stack**, which is why deep recursion in Python needs
      `sys.setrecursionlimit` - or the next step.

      **3. Tabulation (bottom-up).** Throw the recursion away. Allocate the same table,
      fill the base cases by hand, and loop over the states in an order where every
      state's dependencies are already computed (usually the reverse of the direction
      the recursion moved in). Same time complexity, no stack.

      **4. Space optimization.** Look at which entries the recurrence actually reads.
      If `dp[i]` only reads `dp[i-1]` and `dp[i-2]`, two variables replace the array.
      If `dp[i][j]` only reads row `i-1`, two rows replace the 2D table. This never
      changes the time complexity - it only shrinks memory, and it destroys the
      information you would need to *reconstruct* the answer, so keep the full table
      when the problem asks you to print the actual subsequence or partition.
    explanation: |
      ### Memoization vs tabulation - which to write

      | | Memoization | Tabulation |
      | --- | --- | --- |
      | Written from | the recursion, almost mechanically | a filling order you must design |
      | Computes | only the states actually reachable | every state in the table |
      | Extra space | table + `O(depth)` stack | table only |
      | Risk | stack overflow / recursion limit | an off-by-one in the loop bounds |
      | Space optimization | not possible | natural |

      A good habit: derive the recurrence on paper, write memoization to confirm it is
      correct on the examples, then convert to tabulation by reversing the loop
      direction, and only then optimize the space.

      ### Converting a recursion to a table

      The mechanical recipe used everywhere below:

      1. Every recursion parameter becomes a table dimension. Shift negative or
         "none" values by `+1` so they fit in an array.
      2. Every base case of the recursion becomes an initialized cell.
      3. The recursion body becomes the loop body, with `f(...)` replaced by `dp[...]`.
      4. If the recursion moved from `i` down to `0`, the loop goes from `0` up to `n`,
         and vice versa.
      5. The answer is the cell that corresponds to the original top-level call.

      ### Complexity in one line

      `time = (number of states) x (choices per state)` and
      `space = (size of the table)`, plus the recursion stack if you are top-down.
      Nearly every complexity claim in this section is that formula applied: `O(n)`
      states with `O(1)` choices for 1D DP, `O(n*m)` states with `O(1)` choices for grid
      and string DP, and `O(n^2)` states with `O(n)` choices for partition DP, giving
      `O(n^3)`.

      ### Common traps

      - **Counting problems overflow fast.** The number of paths, subsets or partitions
        grows exponentially, so such problems are almost always asked *modulo*
        `10^9 + 7`. Take the modulus at every addition, not only at the end.
      - **The state must capture everything the future depends on.** If your answer
        differs depending on something not in the parameter list (whether you are
        holding a stock, how many transactions are left), the memo table will return a
        wrong cached value.
      - **Space optimization is a one-way door.** Do it last, and never when you must
        reconstruct the answer itself.
  - sheetId: prob-16-4-3-partition-a-set-into-two-
    slug: partition-a-set-into-two-subsets-with-minimum-absolute-sum-difference
    title: "Partition a Set into Two Subsets with Minimum Absolute Sum Difference"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "DP on Subsequences"
    tags: [dynamic-programming, subset-sum, knapsack]
    sourceUrl: "https://leetcode.com/problems/partition-array-into-two-arrays-to-minimize-sum-difference/"
    statement: |
      You are given an array `arr` of `n` non-negative integers. Put **every** element
      into one of two groups `A` and `B` - each element goes to exactly one group, and
      a group is allowed to stay empty.

      Print the smallest possible value of `|sum(A) - sum(B)|`.
    inputFormat: |
      - Line 1: an integer `n`, the number of elements.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print a single integer: the minimum absolute difference between the two group sums.
    constraints:
      - "1 <= n <= 200"
      - "0 <= arr[i] <= 200"
      - "The total sum of arr is at most 40000."
    examples:
      - input: |
          5
          3 1 4 2 2
        output: |
          0
        explanation: "The total is 12. Group A = {3, 1, 2} and group B = {4, 2} both sum to 6, so the difference is 0."
      - input: |
          3
          1 6 11
        output: |
          4
        explanation: "The total is 18. The best split is {1, 6} and {11}: |7 - 11| = 4. No split does better."
    hints:
      - "If one group sums to s, the other necessarily sums to total - s, so the difference is |total - 2s|."
      - "So the only question is: which sums s are reachable by some subset? That is plain subset-sum reachability."
      - "Build a boolean table reachable[s] over 0 <= s <= total, then scan s from 0 to total / 2 and take the best |total - 2s|."
    explanation: |
      **Recursion - O(2^n) time.** `f(i, s)` = "can the elements `arr[i..n-1]` add some
      subset to make the running sum reach `s`?" Every element is a take / skip choice,
      so the tree has `2^n` leaves. Collect every reachable subset sum and pick the one
      closest to `total / 2`.

      **Memoization - O(n * total) time and space.** The state is `(index, sum so far)`,
      and there are only `n * (total + 1)` of those, so caching collapses the
      exponential tree.

      **Tabulation - O(n * total) time, O(n * total) space.** `dp[i][s]` is true when
      some subset of the first `i` elements sums to `s`. Row 0 has only `dp[0][0] = true`;
      then `dp[i][s] = dp[i-1][s] or dp[i-1][s - arr[i-1]]`.

      **Space optimization - O(n * total) time, O(total) space.** Row `i` reads only row
      `i-1`, so a single boolean array suffices if you iterate `s` downward (so each
      element is used at most once). In Python the whole array fits in one big integer
      used as a bit set: `reachable |= reachable << arr[i]` does an entire row at once.

      Finally, every reachable `s <= total / 2` gives a candidate answer `total - 2s`;
      the smallest of those is the result. Answering the question needs only half the
      table because `s` and `total - s` describe the same split.
