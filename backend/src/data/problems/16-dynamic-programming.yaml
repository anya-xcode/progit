    topic: Dynamic Programming
    subtopic: "DP on Strings"
    tags: [dynamic-programming, string]
    sourceUrl: "https://leetcode.com/problems/longest-palindromic-subsequence/"
    statement: |
      Given a string `s`, find the length of its longest **subsequence** that reads the
      same forwards and backwards.

      A subsequence keeps the original order of characters but may skip any of
      them; it does not have to be contiguous.
    inputFormat: |
      - Line 1: the string `s`.
    outputFormat: |
      Print the length of the longest palindromic subsequence.
    constraints:
      - "1 <= |s| <= 500"
      - "s contains only lowercase English letters."
    examples:
      - input: |
          character
        output: |
          5
        explanation: "\"carac\" (positions 0, 2, 3, 4, 5 of \"character\") is a palindrome of length 5."
      - input: |
          abcd
        output: |
          1
        explanation: "All characters are different, so any single character is the best palindrome."
    hints:
      - "A palindrome read backwards is itself. How does s relate to reversed(s)?"
      - "The longest palindromic subsequence of s equals the LCS of s and its reverse."
    explanation: |
      A palindromic subsequence of `s` is also a subsequence of `reverse(s)`, and a
      longest common subsequence of `s` and `reverse(s)` can always be chosen to be a
      palindrome, so the answer is `LCS(s, reverse(s))`.

      **Recursion - exponential.** Directly: `f(i, j)` for substring `s[i..j]` is 1 when
      `i == j`, `2 + f(i+1, j-1)` when `s[i] == s[j]`, otherwise
      `max(f(i+1, j), f(i, j-1))`. (Or use the LCS recurrence on `s` and its reverse.)

      **Memoization - O(n^2) time, O(n^2) space.**

      **Tabulation - O(n^2) time, O(n^2) space.** Fill the LCS table of `s` and
      `reverse(s)`.

      **Space optimization - O(n^2) time, O(n) space.** Keep two rows of the LCS table.
    starterCode:
