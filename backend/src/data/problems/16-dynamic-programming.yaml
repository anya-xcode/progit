    slug: count-subsets-with-sum-k
    title: "Count Subsets with Sum K"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "DP on Subsequences"
    tags: [dynamic-programming, counting, knapsack]
    sourceUrl: ""
    statement: |
      You are given an array `arr` of `n` non-negative integers and an integer `k`.

      Count the subsets of `arr` whose elements add up to exactly `k`. A subset is
      chosen by **positions**, so two subsets are different when their sets of indices
      differ - even if the values they hold are identical. The empty subset is a valid
      subset and its sum is `0`.

      The count can be astronomically large, so print it **modulo `10^9 + 7`**.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print the number of subsets with sum exactly `k`, taken modulo `10^9 + 7`.
    constraints:
      - "1 <= n <= 100"
      - "0 <= arr[i] <= 100"
      - "0 <= k <= 10000"
    examples:
      - input: |
          5 5
          1 2 2 3 5
        output: |
          4
        explanation: "The subsets are {5}, {2,3} using the first 2, {2,3} using the second 2, and {1,2,2}. That is 4 subsets."
      - input: |
          4 0
          0 0 1 2
        output: |
          4
        explanation: "A subset sums to 0 exactly when it contains no positive element, so it is any of the 4 subsets of the two zeros (including the empty one)."
    hints:
      - "Walk the array one element at a time and ask: do I put arr[i] in the subset or not?"
      - "count(i, target) = count(i - 1, target) + count(i - 1, target - arr[i]) when arr[i] <= target."
      - "Zeros are not special: arr[i] = 0 makes both branches identical, which correctly doubles the count."
    explanation: |
      **Recursion - O(2^n) time.** Let `f(i, t)` be the number of subsets of the first
      `i` elements summing to `t`. Base case `f(0, 0) = 1` and `f(0, t > 0) = 0`. Each
      element is taken or skipped:
      `f(i, t) = f(i-1, t) + f(i-1, t - arr[i-1])`, the second term only when
      `arr[i-1] <= t`. This explores every one of the `2^n` subsets.

      **Memoization - O(n * k) time, O(n * k) space.** The state `(i, t)` has only
      `(n + 1) * (k + 1)` values, so the same sums are never recounted.

      **Tabulation - O(n * k) time, O(n * k) space.** Allocate `dp[n+1][k+1]`, set
      `dp[0][0] = 1`, and fill row by row with the same recurrence, reducing every
      addition modulo `10^9 + 7`.

      **Space optimization - O(n * k) time, O(k) space.** Row `i` depends only on row
      `i-1`, so keep one array. Either build a fresh array from the previous one, or
      update a single array with `t` running downward from `k` to `arr[i]` so that
      `dp[t - arr[i]]` still holds the previous row's value.

      Note on zeros: an element equal to `0` turns the recurrence into
      `dp[t] = dp[t] + dp[t]`, which doubles every count - exactly right, because each
      zero can be in or out of any subset independently.
