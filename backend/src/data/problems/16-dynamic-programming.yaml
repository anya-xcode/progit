      python: |
        import sys
        from typing import List


        MOD = 10**9 + 7


        def count_coin_combinations(coins: List[int], amount: int) -> int:
            ways = [0] * (amount + 1)
            ways[0] = 1
            for coin in coins:
                for total in range(coin, amount + 1):
                    ways[total] = (ways[total] + ways[total - coin]) % MOD
            return ways[amount]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, amount = int(data[0]), int(data[1])
            coins = [int(x) for x in data[2:2 + n]]
            print(count_coin_combinations(coins, amount))


        if __name__ == "__main__":
            main()
