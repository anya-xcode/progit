  - sheetId: prob-16-7-6-longest-bitonic-subsequen
    slug: longest-bitonic-subsequence
    title: "Longest Bitonic Subsequence"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "DP on LIS"
    tags: [dynamic-programming, array]
    sourceUrl: ""
    statement: |
      A sequence is **bitonic** when it strictly increases up to some position and then
      strictly decreases. Either half is allowed to be empty, so a sequence that only
      increases, only decreases, or has a single element is also bitonic.

      Given an integer array `nums`, print the length of its longest bitonic
      subsequence. A subsequence keeps the original order but need not be contiguous.
    inputFormat: |
      - Line 1: an integer `n`, the number of elements.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print a single integer: the length of the longest bitonic subsequence.
    constraints:
      - "1 <= n <= 1000"
      - "-1000000000 <= nums[i] <= 1000000000"
    examples:
      - input: |
          8
          1 11 2 10 4 5 2 1
        output: |
          6
        explanation: "Take 1, 2, 4, 5 going up and 2, 1 coming down: the subsequence (1, 2, 4, 5, 2, 1) has length 6."
      - input: |
          5
          1 2 3 4 5
        output: |
          5
        explanation: "The whole array increases, and an empty decreasing half is allowed, so all 5 elements count."
    hints:
      - "Every bitonic subsequence has a highest element - the peak. Fix it and the two halves become independent."
      - "up[i] = length of the longest strictly increasing subsequence ENDING at i; down[i] = length of the longest strictly decreasing subsequence STARTING at i."
      - "The answer is max over i of up[i] + down[i] - 1, subtracting one because the peak is counted twice."
    explanation: |
      **Splitting at the peak.** Choose the index `i` that holds the peak. The part
      before it must be a strictly increasing subsequence ending at `i`, and the part
      after it must be a strictly decreasing subsequence starting at `i`. The two halves
      never interact, so the best bitonic subsequence with peak `i` has length
      `up[i] + down[i] - 1`.

      **Recursion - O(2^n) time.** `up(i)` = `1 + max(up(j) for j < i with nums[j] < nums[i])`
      and `down(i)` = `1 + max(down(j) for j > i with nums[j] < nums[i])`, each `1` when
      no such `j` exists. Evaluated directly, both explode.

      **Memoization - O(n^2) time, O(n) space.** `n` states each scanning `O(n)`
      neighbours, for each of the two arrays.

      **Tabulation - O(n^2) time, O(n) space.** Fill `up` left to right and `down` right
      to left with the same two formulas, then take `max(up[i] + down[i] - 1)`.

      **Space optimization - not applicable.** Both arrays are read at the end, so `O(n)`
      is the floor. Using the `O(n log n)` binary-search LIS twice brings the running
      time down to `O(n log n)`, but the two arrays still have to be stored.

      Because both halves are allowed to be empty, a purely increasing array gives
      `up[n-1] + 1 - 1 = n`, and an array of equal values gives `1`.
