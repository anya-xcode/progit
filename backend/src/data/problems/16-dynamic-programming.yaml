      **Space optimization - O(r * c) time, O(c) space.** Use one row array. For each
      cell: if blocked set `row[j] = 0`, else if `j > 0` set
      `row[j] = row[j] + row[j-1]`. Initializing `row[0] = 1` before the first row
      handles the start cell (it becomes 0 if the start is blocked).
