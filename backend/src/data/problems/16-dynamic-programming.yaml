  - sheetId: prob-16-8-5-different-ways-to-evaluat
    slug: different-ways-to-evaluate-a-boolean-expression
    title: "Different Ways to Evaluate a Boolean Expression"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "MCM DP / Partition DP"
    tags: [dynamic-programming, partition-dp, counting]
    sourceUrl: ""
    statement: |
      You are given a boolean expression written without any brackets, for example
      `T|T&F^T`. It alternates operands and operators:

      - an operand is `T` (true) or `F` (false);
      - an operator is `&` (and), `|` (or) or `^` (exclusive or).

      Count the ways to fully bracket the expression so that it evaluates to **true**.
      Two bracketings are different when the trees of operations differ, even if the
      final value is the same - so `(T|T)&F` and `T|(T&F)` are two different bracketings.

      The count can be astronomically large, so print it **modulo `10^9 + 7`**.
    inputFormat: |
      - Line 1: the expression, with no spaces.
    outputFormat: |
      Print the number of bracketings that evaluate to true, taken modulo `10^9 + 7`.
    constraints:
      - "The expression has odd length between 1 and 199."
      - "Characters at even positions are `T` or `F`; characters at odd positions are `&`, `|` or `^`."
    examples:
      - input: |
          T|T&F^T
        output: |
          4
        explanation: "Of the 5 bracketings of 4 operands, 4 evaluate to true; only one arrangement ends up false."
      - input: |
          F&T
        output: |
          0
        explanation: "There is a single bracketing and false AND true is false, so no bracketing gives true."
    hints:
      - "Number the operands 0, 1, 2, ... and let the state be a RANGE of operands, exactly as in matrix chain multiplication."
      - "You need two counts per range, not one: how many bracketings make it true and how many make it false."
      - "Split the range at each operator k and combine: for '&' the true count adds trueLeft * trueRight, for '|' the false count adds falseLeft * falseRight, for '^' the true count adds trueLeft * falseRight + falseLeft * trueRight."
    explanation: |
      **The state.** Write the operands as `v[0..n-1]` and the operators as
      `op[0..n-2]`, where `op[k]` sits between `v[k]` and `v[k+1]`. For the range of
      operands `i..j` keep two numbers: `T[i][j]`, the number of bracketings evaluating
      to true, and `F[i][j]`, the number evaluating to false. Keeping only the true
      count is not enough, because an `&` needs to know how its operands can be false.

      **Recursion - exponential (a Catalan number of bracketings).** The outermost
      operator of the range is some `op[k]` with `i <= k < j`, splitting it into `i..k`
      and `k+1..j`. Every pair (left bracketing, right bracketing) is a distinct whole,
      so the counts multiply. Writing `lt, lf` for the left counts and `rt, rf` for the
      right ones:

      - `&`: true from `lt*rt`; false from `lt*rf + lf*rt + lf*rf`
      - `|`: true from `lt*rt + lt*rf + lf*rt`; false from `lf*rf`
      - `^`: true from `lt*rf + lf*rt`; false from `lt*rt + lf*rf`

      Base cases: `T[i][i] = 1, F[i][i] = 0` when `v[i]` is `T`, and the other way round
      when it is `F`.

      **Memoization - O(n^3) time, O(n^2) space.** `O(n^2)` ranges, each summing over
      `O(n)` split points; the two counts are cached together.

      **Tabulation - O(n^3) time, O(n^2) space.** Fill the single-operand cells, then
      loop over range length from `2` to `n`, and inside over the left end `i` and the
      split `k`. Every value read belongs to a strictly shorter range, so it is already
      final. Reduce modulo `10^9 + 7` while accumulating - never subtract "total minus
      something", since a subtraction under a modulus can go negative.

      **Space optimization - not available.** Any sub-range may be needed by a longer
      one, so both `O(n^2)` tables stay.
    starterCode:
      python: |
        import sys

        MOD = 1_000_000_007


        def count_true_bracketings(expression: str) -> int:
            # Count bracketings of the expression that evaluate to true, modulo MOD.
            pass


        # --- Input/output handling ---
        def main():
            expression = sys.stdin.read().strip()
            print(count_true_bracketings(expression))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys

        MOD = 1_000_000_007


        def count_true_bracketings(expression: str) -> int:
            values = expression[0::2]
            operators = expression[1::2]
            n = len(values)
            true_ways = [[0] * n for _ in range(n)]
            false_ways = [[0] * n for _ in range(n)]
            for i in range(n):
                true_ways[i][i] = 1 if values[i] == "T" else 0
                false_ways[i][i] = 1 if values[i] == "F" else 0

            for length in range(2, n + 1):
                for i in range(n - length + 1):
                    j = i + length - 1
                    total_true = 0
                    total_false = 0
                    for k in range(i, j):
                        left_true = true_ways[i][k]
                        left_false = false_ways[i][k]
                        right_true = true_ways[k + 1][j]
                        right_false = false_ways[k + 1][j]
                        operator = operators[k]
                        if operator == "&":
                            total_true += left_true * right_true
                            total_false += (
                                left_true * right_false
                                + left_false * right_true
                                + left_false * right_false
                            )
                        elif operator == "|":
                            total_true += (
                                left_true * right_true
                                + left_true * right_false
                                + left_false * right_true
                            )
                            total_false += left_false * right_false
                        else:
                            total_true += left_true * right_false + left_false * right_true
                            total_false += left_true * right_true + left_false * right_false
                    true_ways[i][j] = total_true % MOD
                    false_ways[i][j] = total_false % MOD
            return true_ways[0][n - 1]


        # --- Input/output handling ---
        def main():
            expression = sys.stdin.read().strip()
            print(count_true_bracketings(expression))


        if __name__ == "__main__":
            main()
