    explanation: |
      **Recursion - O(2^n) time.** `f(i, can_buy, left)` = best profit from day `i`
      onward, `can_buy` says whether you hold a share, `left` counts the transactions
      still allowed. Past the last day, or with `left = 0`, the value is `0`. When
      `can_buy = 1`: `max(-prices[i] + f(i+1, 0, left), f(i+1, 1, left))`. When
      `can_buy = 0`: `max(prices[i] + f(i+1, 1, left-1), f(i+1, 0, left))`.

