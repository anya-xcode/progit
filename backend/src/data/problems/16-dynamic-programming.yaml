    tags: [dynamic-programming, array, state-machine]
    sourceUrl: "https://leetcode.com/problems/best-time-to-buy-and-sell-stock-with-transaction-fee/"
    statement: |
      `prices[i]` is the price of one share on day `i`. You may buy and sell as many
      times as you like while holding at most one share at a time, but the broker
      charges a flat `fee` for every completed transaction (a buy together with its
      later sell).

      Print the maximum total profit after fees. Making no trade at all (profit `0`) is
      always allowed.
    inputFormat: |
      - Line 1: two integers `n` and `fee`.
      - Line 2: `n` space-separated integers, the array `prices`.
    outputFormat: |
      Print a single integer: the maximum profit after paying all fees.
    constraints:
      - "1 <= n <= 100000"
      - "0 <= prices[i] <= 10000"
      - "0 <= fee <= 10000"
    examples:
      - input: |
          6 2
          1 3 2 8 4 9
        output: |
          8
        explanation: "Buy at 1, sell at 8 (profit 7 - 2 = 5), buy at 4, sell at 9 (profit 5 - 2 = 3). Total 8."
      - input: |
          4 5
          1 2 3 4
        output: |
          0
        explanation: "The only sensible trade earns 4 - 1 = 3, which does not cover the fee of 5, so the best is to trade nothing."
      - input: |
          6 3
          1 3 7 5 10 3
        output: |
          6
        explanation: "One transaction is best: buy at 1 and sell at 10, giving 9 - 3 = 6. Splitting it into two trades would pay the fee twice."
    hints:
      - "Same two states as the unlimited-transactions problem: holding a share or not."
      - "Charge the fee once per transaction - subtract it either when you buy or when you sell, but never both."
      - "f(i, can_buy) = max(wait, act). Only day i + 1 is ever read, so two variables suffice."
    explanation: |
      **Recursion - O(2^n) time.** `f(i, can_buy)` = best profit from day `i` onward.
      With `can_buy = 1`: buy for `-prices[i] + f(i+1, 0)` or wait. With `can_buy = 0`:
      sell for `prices[i] - fee + f(i+1, 1)` or wait. The fee is attached to the sell,
      so it is paid exactly once per completed transaction. Past the last day the value
      is `0`.

      **Memoization - O(n) time, O(n) space.** `2n` states.

      **Tabulation - O(n) time, O(n) space.** `dp[n][*] = 0`, then `i` descending.

      **Space optimization - O(n) time, O(1) space.** Two running values, `free` and
      `holding`, updated once per day.

      **Why the greedy of problem II breaks.** Without a fee you may collect every
      positive daily difference, because splitting a trade costs nothing. With a fee,
      splitting one trade into two costs an extra `fee`, so short profitable wiggles are
      worth ignoring. The DP handles that automatically: a sell only happens when the
      gain beats the fee plus whatever the future is worth.
