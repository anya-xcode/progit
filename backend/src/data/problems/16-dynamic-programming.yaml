      subsequence** of the two - not just its length.

      Several different strings can all be longest common subsequences (for example
      `"ba"` and `"ab"` both work for `a = "bab"` and `b = "aba"`). To make the answer
      unique, print the **lexicographically smallest** string among all common
      subsequences of maximum length.
    inputFormat: |
      - Line 1: the string `a`.
      - Line 2: the string `b`.
    outputFormat: |
      Print the lexicographically smallest longest common subsequence.
      If the two strings have no common character, the answer is the empty string:
      print an empty line.
    constraints:
      - "1 <= |a|, |b| <= 300"
      - "Both strings contain only lowercase English letters."
    examples:
      - input: |
          abcbdab
          bdcaba
        output: |
          bcab
        explanation: "The longest common subsequences have length 4: \"bcab\", \"bcba\" and \"bdab\". The smallest of those in dictionary order is \"bcab\"."
      - input: |
          ba
          ab
        output: |
          a
        explanation: "Both \"a\" and \"b\" are common subsequences of length 1, and \"a\" comes first in dictionary order."
    hints:
      - "First compute the classic table: lcs[i][j] = length of the LCS of the suffixes a[i:] and b[j:]."
      - "Now build the answer greedily from the front. For each letter c from 'a' to 'z', find its first occurrence at or after i in a and at or after j in b."
      - "If those two positions ia, jb satisfy lcs[ia][jb] == the length still to produce, then c can start the answer - and the earliest occurrences are always the best choice, because they leave the longest suffixes."
    explanation: |
      **Recursion - O(2^(n+m)) time.** `f(i, j)` = length of the LCS of `a[i:]` and
      `b[j:]`. If either suffix is empty it is `0`; if `a[i] == b[j]` it is
      `1 + f(i+1, j+1)`; otherwise `max(f(i+1, j), f(i, j+1))`.

      **Memoization - O(n * m) time and space.** There are only `(n+1) * (m+1)` states.

      **Tabulation - O(n * m) time, O(n * m) space.** Fill `lcs[i][j]` for `i` from `n`
      down to `0` and `j` from `m` down to `0`. Keeping this full table is the whole
      point here: printing the answer needs it.

      **Space optimization - not usable.** Two rolling rows give the *length* in `O(m)`
      space, but reconstruction needs the whole table, so `O(n * m)` space is the price
      of printing an answer.

      **Reconstruction with a lexicographic tie-break - O(n * m + 26 * (n + m)) time.**
      A plain walk through the table produces *some* LCS, but not necessarily the
      smallest one, so build the answer character by character instead. Precompute
      `next_a[i][c]` = the first index `>= i` where `a` holds letter `c` (and likewise
      `next_b`); both tables are filled in one backward pass. Starting from
      `i = j = 0` and `need = lcs[0][0]`, try letters `c` in alphabetical order: if
      `ia = next_a[i][c]` and `jb = next_b[j][c]` both exist and `lcs[ia][jb] == need`,
      then `c` can be the next character of a maximum-length answer. Append it, move to
      `ia + 1`, `jb + 1`, decrease `need` and repeat.

      Two details make this correct. Picking the alphabetically first feasible letter is
      optimal because all candidate answers have the same length, so the first
      character decides the comparison. Picking the *earliest* occurrence of that letter
      is optimal because later occurrences leave shorter suffixes, and `lcs` never
      increases as `i` or `j` grows.
