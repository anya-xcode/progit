  - sheetId: prob-16-7-5-longest-string-chain
    slug: longest-string-chain
    title: "Longest String Chain"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "DP on LIS"
    tags: [dynamic-programming, string, hashing]
    sourceUrl: "https://leetcode.com/problems/longest-string-chain/"
    statement: |
      Word `x` is a **predecessor** of word `y` when inserting exactly one letter
      somewhere inside `x` (front, back or between two letters) turns it into `y`
      without reordering anything else. For example `"bat"` is a predecessor of
      `"bath"` and of `"beat"`, but not of `"bad"`.

      A **word chain** is a sequence `w1, w2, ..., wk` taken from the given list in
      which each word is a predecessor of the next one. A single word is a chain of
      length `1`.

      Print the length of the longest word chain that can be built from the list.
    inputFormat: |
      - Line 1: an integer `n`, the number of words.
      - Line 2: `n` space-separated distinct lowercase words.
    outputFormat: |
      Print a single integer: the length of the longest word chain.
    constraints:
      - "1 <= n <= 500"
      - "1 <= length of each word <= 16"
      - "All words are distinct and contain only lowercase English letters."
    examples:
      - input: |
          6
          a b ba bca bda bdca
        output: |
          4
        explanation: "\"a\" -> \"ba\" -> \"bda\" -> \"bdca\" is a chain of 4 words, each one letter longer than the previous."
      - input: |
          5
          xbc pcxbcf xb cxbc pcxbc
        output: |
          5
        explanation: "\"xb\" -> \"xbc\" -> \"cxbc\" -> \"pcxbc\" -> \"pcxbcf\" uses all five words."
    hints:
      - "A predecessor is always exactly one letter shorter, so a chain's words have strictly increasing lengths."
      - "Process the words sorted by length; then when you reach a word, every possible predecessor has already been solved."
      - "Instead of comparing pairs of words, delete one letter from the current word in every possible way and look the result up in a dictionary."
    explanation: |
      **Recursion - exponential.** `f(word)` = longest chain that ends at `word`. It is
      `1 + max(f(p))` over every word `p` in the list obtained by deleting one letter
      from `word`, or `1` when no such word is present. The answer is `max f(word)`.

      **Memoization - O(n * L^2) time, O(n * L) space.** Cache `f` in a dictionary keyed
      by the word. Each call builds `L` shortened strings of length `L - 1`, so the work
      per word is `O(L^2)` including the hashing.

      **Tabulation - O(n * L^2) time, O(n * L) space.** Sort the words by increasing
      length and process them in that order. For a word `w`, try all `L` ways to drop
      one character; if the result is a known word, `best[w] = max(best[w], best[cut] + 1)`.
      Because predecessors are strictly shorter, they are always finished first, so no
      recursion is needed. Keep a running maximum of `best[w]`.

      **Space optimization - not applicable.** The dictionary of best chain lengths is
      the whole state; nothing can be dropped, since any earlier word may be a
      predecessor.

      **Why deleting beats comparing.** Checking every ordered pair of words costs
      `O(n^2 * L)`. Deleting one letter and hashing costs `O(n * L^2)`, which with
      `L <= 16` is far smaller. It is the same trick as replacing "find a smaller
      earlier element" with a direct lookup.
    starterCode:
      python: |
        import sys
        from typing import List


        def longest_string_chain(words: List[str]) -> int:
            # Return the length of the longest chain w1 -> w2 -> ... under one-letter insertions.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            words = data[1:1 + n]
            print(longest_string_chain(words))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def longest_string_chain(words: List[str]) -> int:
            best = {}
            longest = 0
            for word in sorted(words, key=len):
                current = 1
                for k in range(len(word)):
                    shorter = word[:k] + word[k + 1:]
                    found = best.get(shorter)
                    if found is not None and found + 1 > current:
                        current = found + 1
                best[word] = current
                if current > longest:
                    longest = current
            return longest


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            words = data[1:1 + n]
            print(longest_string_chain(words))


        if __name__ == "__main__":
            main()
