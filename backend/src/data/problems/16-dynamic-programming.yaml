    referenceSolution:
      python: |
        import sys


        def min_palindrome_cuts(s: str) -> int:
            n = len(s)
            is_pal = [[False] * n for _ in range(n)]
            for i in range(n - 1, -1, -1):
                row, below = is_pal[i], is_pal[i + 1] if i + 1 < n else None
                for j in range(i, n):
                    if s[i] == s[j] and (j - i < 2 or below[j - 1]):
                        row[j] = True
            pieces = [0] * (n + 1)  # pieces[i] = fewest palindromic pieces for s[i:]
            for i in range(n - 1, -1, -1):
                best = n
                row = is_pal[i]
                for j in range(i, n):
                    if row[j] and 1 + pieces[j + 1] < best:
                        best = 1 + pieces[j + 1]
                pieces[i] = best
            return pieces[0] - 1


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s = data[0]
            print(min_palindrome_cuts(s))


        if __name__ == "__main__":
            main()
