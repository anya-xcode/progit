    title: "Count Square Submatrices with All Ones"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "DP on Squares"
    tags: [dynamic-programming, matrix]
    sourceUrl: "https://leetcode.com/problems/count-square-submatrices-with-all-ones/"
    statement: |
      You are given a binary matrix with `r` rows and `c` columns. Count how many
      **square** submatrices (of any size `k x k`, `k >= 1`) consist entirely of ones.

      Squares of different sizes or at different positions are counted separately,
      even if they overlap.
    inputFormat: |
      - Line 1: two integers `r` and `c`.
      - Next `r` lines: `c` space-separated values, each `0` or `1`.
    outputFormat: |
      Print the number of all-ones square submatrices.
    constraints:
      - "1 <= r, c <= 300"
      - "matrix[i][j] is 0 or 1"
    examples:
      - input: |
          3 3
          1 1 0
          1 1 1
          0 1 1
        output: |
          9
        explanation: "There are 7 squares of size 1x1 and 2 squares of size 2x2 (top-left and bottom-right). No 3x3 square is all ones."
      - input: |
          2 2
          0 0
          0 0
        output: |
          0
        explanation: "The matrix has no ones at all."
    hints:
      - "For each cell, compute the side of the largest all-ones square whose bottom-right corner is that cell."
      - "If that side is s, the cell is the bottom-right corner of exactly s squares (sizes 1..s)."
      - "side(i, j) = 1 + min(side(i - 1, j), side(i, j - 1), side(i - 1, j - 1)) when the cell is 1."
    explanation: |
      **Brute force - O(r * c * min(r, c)^3).** Try every top-left corner and size and
      verify all cells.

      **DP recurrence.** Let `f(i, j)` be the side of the largest all-ones square with
      bottom-right corner `(i, j)`. If `matrix[i][j] == 0` it is 0; on the first row or
      column it equals the cell value; otherwise
      `f(i, j) = 1 + min(f(i-1, j), f(i, j-1), f(i-1, j-1))`, because the square is
      limited by the smallest of the three neighbouring squares. The answer is the sum
      of all `f(i, j)`.

      **Memoization / Tabulation - O(r * c) time, O(r * c) space.** Fill the table in
      reading order and add each value to the total.

      **Space optimization - O(r * c) time, O(c) space.** Keep only the previous row
      (and the diagonal value), or overwrite the input matrix in place.
