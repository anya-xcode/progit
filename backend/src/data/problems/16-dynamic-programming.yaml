  - slug: wildcard-matching
    title: "Wildcard Matching"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "DP on Strings"
    tags: [dynamic-programming, string]
    sourceUrl: "https://leetcode.com/problems/wildcard-matching/"
    statement: |
      You are given a text `s` and a pattern `p`. The pattern may contain lowercase
      letters and two wildcard characters:

      - `?` matches **exactly one** arbitrary character.
      - `*` matches **any sequence** of characters, including the empty sequence.

      A letter in the pattern matches only that same letter. The pattern must match
      the **entire** text, not just a part of it.

      Print `true` if `p` matches `s`, otherwise `false`.
    inputFormat: |
      - Line 1: the text `s` (may be an empty line).
      - Line 2: the pattern `p` (may be an empty line or missing, meaning an empty pattern).
    outputFormat: |
      Print `true` or `false`.
    constraints:
      - "0 <= |s|, |p| <= 500"
      - "s contains only lowercase English letters."
      - "p contains only lowercase English letters, '?' and '*'."
    examples:
      - input: |
          abcde
          a*d?
        output: |
          true
        explanation: "'a' matches 'a', '*' absorbs \"bc\", 'd' matches 'd' and '?' matches 'e'."
      - input: |
          abc
          a?
        output: |
          false
        explanation: "\"a?\" matches strings of length exactly 2, but the text has length 3."
    hints:
      - "Compare the pattern and text from their ends (or starts), one character at a time."
      - "A '*' has two choices: match nothing (drop the star) or swallow one more text character (keep the star)."
      - "An empty pattern matches only an empty text; an empty text is matched only by a pattern made entirely of '*'."
    explanation: |
      **Recursion - exponential.** `f(i, j)` = does `p[0..j-1]` match `s[0..i-1]`?
      - `f(0, 0) = true`; `f(i, 0) = false` for `i > 0`;
        `f(0, j)` is true only if `p[0..j-1]` is all `*`.
      - If `p[j-1]` is a letter equal to `s[i-1]` or is `?`: `f(i, j) = f(i-1, j-1)`.
      - If `p[j-1] == '*'`: `f(i, j) = f(i, j-1)` (star matches empty) or
        `f(i-1, j)` (star eats `s[i-1]` and stays available).
      - Otherwise false.

      **Memoization - O(n * m) time, O(n * m) space.**

      **Tabulation - O(n * m) time, O(n * m) space.** Fill the base row (empty text)
      and base column (empty pattern), then the rest row by row.

      **Space optimization - O(n * m) time, O(m) space.** Keep `prev` (text length
      `i-1`) and `cur` (text length `i`) boolean rows.
    starterCode:
      python: |
        import sys


        def is_match(s: str, p: str) -> bool:
            # '?' matches one character, '*' matches any sequence (possibly empty).
            pass


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().replace("\r", "").split("\n")
            s = lines[0].strip() if len(lines) > 0 else ""
            p = lines[1].strip() if len(lines) > 1 else ""
            print("true" if is_match(s, p) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def is_match(s: str, p: str) -> bool:
            m = len(p)
            prev = [False] * (m + 1)
            prev[0] = True
            for j in range(1, m + 1):
                prev[j] = prev[j - 1] and p[j - 1] == "*"
            for ch in s:
                cur = [False] * (m + 1)
                for j in range(1, m + 1):
                    pc = p[j - 1]
                    if pc == "*":
                        cur[j] = cur[j - 1] or prev[j]
                    elif pc == "?" or pc == ch:
                        cur[j] = prev[j - 1]
                prev = cur
            return prev[m]


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().replace("\r", "").split("\n")
            s = lines[0].strip() if len(lines) > 0 else ""
            p = lines[1].strip() if len(lines) > 1 else ""
            print("true" if is_match(s, p) else "false")


        if __name__ == "__main__":
            main()
