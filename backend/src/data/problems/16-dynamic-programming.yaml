        import sys
        from typing import List


        MOD = 10**9 + 7


        def unique_paths_with_obstacles(grid: List[List[int]]) -> int:
            cols = len(grid[0])
            row = [0] * cols
            row[0] = 1
            for cells in grid:
                for j in range(cols):
                    if cells[j] == 1:
                        row[j] = 0
                    elif j > 0:
                        row[j] = (row[j] + row[j - 1]) % MOD
            return row[cols - 1]


