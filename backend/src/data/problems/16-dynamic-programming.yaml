        def cut_rod(prices: List[int]) -> int:
            # prices[i - 1] is the price of a piece of length i; the rod length is len(prices).
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            prices = [int(x) for x in data[1:1 + n]]
            print(cut_rod(prices))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def cut_rod(prices: List[int]) -> int:
            n = len(prices)
            best = [0] * (n + 1)
            for piece in range(1, n + 1):
                price = prices[piece - 1]
                for length in range(piece, n + 1):
                    candidate = price + best[length - piece]
                    if candidate > best[length]:
                        best[length] = candidate
            return best[n]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            prices = [int(x) for x in data[1:1 + n]]
            print(cut_rod(prices))


        if __name__ == "__main__":
            main()
