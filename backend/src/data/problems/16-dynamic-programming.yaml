  - slug: unique-paths
    title: "Unique Paths"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "2D/3D DP and DP on Grids"
    tags: [dynamic-programming, matrix, combinatorics]
    sourceUrl: "https://leetcode.com/problems/unique-paths/"
    statement: |
      A robot stands on the top-left cell of an `m x n` grid (`m` rows, `n` columns).
      In each step it can move **one cell down** or **one cell right**.

      Count the number of different paths that bring the robot to the bottom-right
      cell. Since the count can be very large, print it **modulo 10^9 + 7**.
    inputFormat: |
      - Line 1: two integers `m` and `n`.
    outputFormat: |
      Print the number of distinct paths modulo `10^9 + 7`.
    constraints:
      - "1 <= m, n <= 100"
    examples:
      - input: |
          3 7
        output: |
          28
        explanation: "The robot makes 2 down moves and 6 right moves in some order: C(8, 2) = 28 paths."
      - input: |
          3 2
        output: |
          3
        explanation: "The paths are Right-Down-Down, Down-Right-Down and Down-Down-Right."
    hints:
      - "The last move into cell (i, j) comes either from the cell above or the cell to the left."
      - "paths(i, j) = paths(i - 1, j) + paths(i, j - 1); cells in the first row or column have exactly one path."
      - "Process the grid row by row and keep only one row of values."
    explanation: |
      **Recursion - O(2^(m+n)) time.** `f(i, j)` = number of paths from `(0, 0)` to
      `(i, j)`. `f(0, 0) = 1`, out-of-grid cells give 0, and
      `f(i, j) = f(i-1, j) + f(i, j-1)`.

      **Memoization - O(m * n) time, O(m * n) space** (plus recursion stack).

      **Tabulation - O(m * n) time, O(m * n) space.** Fill `dp` row by row, top to
      bottom and left to right, taking every sum modulo `10^9 + 7`.

      **Space optimization - O(m * n) time, O(n) space.** Keep a single row: before the
