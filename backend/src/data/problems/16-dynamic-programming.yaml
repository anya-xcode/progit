    slug: matrix-chain-multiplication-bottom-up-dp-49
    title: "Matrix Chain Multiplication (Bottom-Up)"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "MCM DP / Partition DP"
    tags: [dynamic-programming, partition-dp, interval-dp]
    sourceUrl: "https://www.geeksforgeeks.org/problems/matrix-chain-multiplication0303/1"
    statement: |
      You are given the shapes of `n` matrices `M1, M2, ..., Mn` that are to be
      multiplied together in that order. Matrix `Mi` has `rows[i]` rows and `cols[i]`
      columns, and consecutive shapes always fit (`cols[i] == rows[i+1]`).

      Multiplying a `p x q` matrix by a `q x r` matrix costs `p * q * r` scalar
      multiplications. Matrix multiplication is associative, so any parenthesization
      produces the same result but may cost a very different amount.

      Print the **minimum** number of scalar multiplications needed for the whole
      chain. A chain of a single matrix costs `0`.

      Write the solution **bottom-up**: solve every short sub-chain first and build the
      longer ones from them, with no recursion at all.
    inputFormat: |
      - Line 1: an integer `n`, the number of matrices.
      - Next `n` lines: two integers `rows[i]` and `cols[i]`, the shape of matrix `Mi`.
    outputFormat: |
      Print a single integer: the minimum number of scalar multiplications.
    constraints:
      - "1 <= n <= 120"
      - "1 <= rows[i], cols[i] <= 100"
      - "cols[i] == rows[i + 1] for every i, so the chain is multipliable."
    examples:
      - input: |
          3
          10 20
          20 30
          30 40
        output: |
          18000
        explanation: "(M1 M2) M3 costs 10*20*30 + 10*30*40 = 6000 + 12000 = 18000, while M1 (M2 M3) costs 20*30*40 + 10*20*40 = 32000."
      - input: |
          1
          5 7
        output: |
          0
        explanation: "There is nothing to multiply, so the cost is 0."
    hints:
      - "Describe a sub-chain by the range of matrices it covers: cost[i][j] for Mi..Mj."
      - "Every parenthesization of Mi..Mj performs one final multiplication, which splits the range at some k: cost[i][k] + cost[k+1][j] + rows[i] * cols[k] * cols[j]."
      - "Bottom-up means looping over the chain LENGTH from 2 upwards, so both halves are already known before you need them."
    explanation: |
      **Setting up the state.** Let `cost[i][j]` be the minimum number of scalar
      multiplications for the sub-chain `Mi..Mj`. The product `Mi..Mj` has `rows[i]`
      rows and `cols[j]` columns whatever order you use, which is what makes the
      subproblems independent.

      **Recursion - exponential (a Catalan number of parenthesizations).** The last
      multiplication combines `Mi..Mk` with `M(k+1)..Mj` for some `i <= k < j`, costing
      `rows[i] * cols[k] * cols[j]` on top of the two halves:
      `f(i, j) = min over k of f(i, k) + f(k+1, j) + rows[i] * cols[k] * cols[j]`, with
      `f(i, i) = 0`.

      **Memoization - O(n^3) time, O(n^2) space.** `O(n^2)` ranges, each trying `O(n)`
      split points.

      **Tabulation (what this problem asks for) - O(n^3) time, O(n^2) space.** A range
      only ever depends on strictly shorter ranges, so order the loops by length:

      ```
      for length = 2 .. n:
          for i = 0 .. n - length:
              j = i + length - 1
              cost[i][j] = min over k in [i, j-1] of
                           cost[i][k] + cost[k+1][j] + rows[i]*cols[k]*cols[j]
      ```

      All the single-matrix cells start at `0`, and the answer ends up in
      `cost[0][n-1]`. An equivalent order is `i` descending and `j` ascending from
      `i + 1` - both guarantee that `cost[i][k]` and `cost[k+1][j]` are already filled.

      **Space optimization - not available.** Unlike a linear DP, a long range can need
      any of its sub-ranges, so the whole `O(n^2)` table has to stay in memory.
