  - slug: burst-balloons
    title: "Burst Balloons"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "MCM DP / Partition DP"
    tags: [dynamic-programming, partition-dp]
    sourceUrl: "https://leetcode.com/problems/burst-balloons/"
    statement: |
      There are `n` balloons in a row, and balloon `i` is labelled with the number
      `nums[i]`. You burst the balloons one at a time, in any order you like, until
      none remain.

      When you burst a balloon with label `x`, you earn `left * x * right` coins, where
      `left` and `right` are the labels of its **current** nearest remaining neighbours
      on each side. If there is no remaining balloon on a side, treat that neighbour's
      label as `1`. After bursting, the balloons on both sides become adjacent.

      Print the maximum number of coins you can earn.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the maximum total coins.
    constraints:
      - "1 <= n <= 100"
      - "0 <= nums[i] <= 100"
    examples:
      - input: |
          3
          2 4 3
        output: |
          33
        explanation: "Burst 4 first (2*4*3 = 24), then 2 (1*2*3 = 6), then 3 (1*3*1 = 3). Total 33."
      - input: |
          1
          7
        output: |
          7
        explanation: "The single balloon has virtual neighbours 1 and 1: 1*7*1 = 7."
    hints:
      - "Choosing which balloon to burst first makes the two sides depend on each other. Think about which balloon is burst last instead."
      - "Pad the array with 1 on both ends. If balloon k is the last one burst between boundaries i and j, it earns a[i] * a[k] * a[j]."
      - "best(i, j) = max over k strictly between i and j of best(i, k) + best(k, j) + a[i] * a[k] * a[j]."
    explanation: |
      Pad `nums` with `1` at both ends to get array `a` of length `n + 2`.

      **Recursion - exponential.** Let `f(i, j)` be the best score for bursting every
      balloon strictly between positions `i` and `j`, where `a[i]` and `a[j]` are still
      present. If balloon `k` is the **last** one burst in that range, its neighbours
      at that moment are exactly `a[i]` and `a[j]`, and the ranges `(i, k)` and
      `(k, j)` are independent:
      `f(i, j) = max over i < k < j of f(i, k) + f(k, j) + a[i] * a[k] * a[j]`,
      with `f(i, j) = 0` when `j = i + 1`. The answer is `f(0, n+1)`.

      **Memoization - O(n^3) time, O(n^2) space.**

      **Tabulation - O(n^3) time, O(n^2) space.** Fill intervals in order of increasing
      length (or `i` decreasing, `j` increasing).

      **Space optimization.** As with other partition DPs, each interval uses many
      smaller intervals, so O(n^2) space remains.
