    title: "Minimum Insertions or Deletions to Convert String A to B"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "DP on Strings"
    tags: [dynamic-programming, string]
    sourceUrl: "https://leetcode.com/problems/delete-operation-for-two-strings/"
    statement: |
      Starting from the string `a`, you may repeatedly apply either operation:

      - **delete** one character from the current string, or
      - **insert** one character anywhere in the current string.

      Replacing a character is *not* allowed. Print the minimum number of operations
      needed to turn `a` into `b`.
    inputFormat: |
      - Line 1: the string `a`.
      - Line 2: the string `b`.
    outputFormat: |
      Print a single integer: the minimum number of insertions plus deletions.
    constraints:
      - "1 <= |a|, |b| <= 500"
      - "Both strings contain only lowercase English letters."
    examples:
      - input: |
          heap
          pea
        output: |
          3
        explanation: "Keep \"ea\", which is a subsequence of both. Delete 'h' and 'p' from \"heap\" to reach \"ea\", then insert 'p' at the front: 3 operations."
      - input: |
          abc
          abc
        output: |
          0
        explanation: "The strings are already equal."
    hints:
      - "The characters you never touch must appear, in order, in both strings."
      - "So the surviving core is a common subsequence, and you want it as long as possible."
      - "answer = (|a| - L) deletions + (|b| - L) insertions, where L is the LCS length."
    explanation: |
      **Reducing to LCS.** A character of `a` is either deleted or kept. The kept
      characters stay in their original order and must also appear, in order, inside
      `b` - so they form a common subsequence of `a` and `b`. Every character of `b`
      that is not part of that core has to be inserted. If the core has length `L`, the
      cost is `(|a| - L) + (|b| - L)`, which is minimized by taking the **longest**
      common subsequence. So `answer = |a| + |b| - 2 * LCS(a, b)`.

      **Recursion - O(2^(n+m)) time.** `f(i, j)` = LCS of `a[i:]` and `b[j:]`:
      `1 + f(i+1, j+1)` on a match, otherwise `max(f(i+1, j), f(i, j+1))`.

      **Memoization - O(n * m) time and space.** `(n+1) * (m+1)` states.

      **Tabulation - O(n * m) time, O(n * m) space.** Standard LCS table with row 0 and
      column 0 set to zero.

      **Space optimization - O(n * m) time, O(m) space.** Two rolling rows.

      This is the edit distance problem with the replace operation removed - which is
      why the answer is `n + m - 2L` here instead of the usual edit-distance
      recurrence.
