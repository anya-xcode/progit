      **Space optimization - O(n) time, O(1) space.** Only day `i+1` is read, so six
      numbers suffice. The classic four-variable forward version tracks, for each day:
      `buy1` = best balance after the first buy, `sell1` = best profit after the first
      sell, `buy2` = best balance after the second buy, `sell2` = best profit after the
      second sell, updated in that order as
      `buy1 = max(buy1, -p)`, `sell1 = max(sell1, buy1 + p)`,
      `buy2 = max(buy2, sell1 - p)`, `sell2 = max(sell2, buy2 + p)`.
      Updating them in this order lets a buy and a sell happen on the same day, which
      never creates profit but keeps the code branch-free.
