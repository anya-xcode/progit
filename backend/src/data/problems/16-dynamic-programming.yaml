      - "Let scs[i][j] be the length of the shortest common supersequence of the suffixes a[i:] and b[j:]. What are the base cases when one suffix is empty?"
      - "On a match you must consume both characters; on a mismatch you take one character from a or one from b, whichever leads to the smaller total."
      - "To break ties, walk the table from the front: among the moves that keep the total minimal, emit the alphabetically smaller character."
    explanation: |
      **Length first.** Let `scs(i, j)` be the shortest common supersequence length of
      `a[i:]` and `b[j:]`. Base cases: `scs(n, j) = m - j` and `scs(i, m) = n - i`. If
      `a[i] == b[j]` then emitting that character once serves both strings:
      `scs(i, j) = 1 + scs(i+1, j+1)`. Otherwise you must emit either `a[i]` or `b[j]`:
      `scs(i, j) = 1 + min(scs(i+1, j), scs(i, j+1))`. Equivalently
      `scs(0, 0) = n + m - LCS(a, b)`.

      **Recursion - O(2^(n+m)) time.** The formula above, evaluated directly.

      **Memoization - O(n * m) time and space.**

      **Tabulation - O(n * m) time, O(n * m) space.** Fill `i` from `n` down to `0`,
      `j` from `m` down to `0`. Keep the full table: the reconstruction reads it.

      **Space optimization - not usable here.** Two rows give the length only; printing
      the string needs the whole table.

      **Reconstruction with the lexicographic tie-break - O(n + m) time.** Walk from
      `(0, 0)`:
      - If `a[i] == b[j]`, always emit that character and advance both. Consuming the
        match is never worse: any common supersequence of `(a[i+1:], b[j:])` is also
        one of `(a[i+1:], b[j+1:])`, so the match move's candidate set contains the
        others, and its smallest member is therefore no larger.
      - Otherwise the two moves emit *different* characters, so simply take the move
        that is still optimal (`1 + scs` equals `scs(i, j)`) and emits the smaller
        letter. When only one move is optimal, take that one.
      - When one string runs out, append the rest of the other.

      Choosing the smaller first character always wins because every candidate has the
      same length.
