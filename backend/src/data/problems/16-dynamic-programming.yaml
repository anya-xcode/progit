    title: "Best Time to Buy and Sell Stock"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "DP on Stocks"
    tags: [dynamic-programming, array, greedy]
    sourceUrl: "https://leetcode.com/problems/best-time-to-buy-and-sell-stock/"
    statement: |
      `prices[i]` is the price of one share on day `i`. You may buy a share on one day
      and sell it on a **later** day - at most once in total.

      Print the maximum profit you can make. If every possible trade loses money, do
      nothing and print `0`.
    inputFormat: |
      - Line 1: an integer `n`, the number of days.
      - Line 2: `n` space-separated integers, the array `prices`.
    outputFormat: |
      Print a single integer: the maximum profit.
    constraints:
      - "1 <= n <= 100000"
      - "0 <= prices[i] <= 10000"
    examples:
      - input: |
          6
          7 1 5 3 6 4
        output: |
          5
        explanation: "Buy on day 1 at price 1 and sell on day 4 at price 6: profit 5. No pair does better."
      - input: |
          5
          7 6 4 3 1
        output: |
          0
        explanation: "Prices only fall, so every trade would lose money and the best choice is to make none."
    hints:
      - "For a fixed selling day, which buying day do you want? The cheapest one before it."
      - "Sweep left to right keeping the smallest price seen so far, and try selling at every day."
      - "In DP language the state is (day, are you holding a share) with one transaction allowed - it collapses to two running values."
    explanation: |
      **Recursion - O(2^n) time.** `f(i, can_buy)` = best profit from day `i` onward,
      where `can_buy = 1` means you hold nothing and this single transaction is still
      available. With `can_buy = 1` you either buy (`-prices[i] + f(i+1, 0)`) or wait
      (`f(i+1, 1)`); with `can_buy = 0` you either sell (`prices[i]`, and the
      transaction is over) or wait (`f(i+1, 0)`). Days past the end give `0`.

      **Memoization - O(n) time, O(n) space.** Only `2n` states exist.

      **Tabulation - O(n) time, O(n) space.** Allocate `dp[n+1][2]` of zeros and fill `i`
      from `n-1` down to `0` with the same two rules.

      **Space optimization - O(n) time, O(1) space.** Row `i` reads only row `i+1`, so
      two variables are enough.

      **The forward one-pass view.** The same answer comes from scanning left to right
      and keeping `cheapest`, the minimum price seen so far: at every day the best
      profit ending there is `prices[i] - cheapest`, so the answer is the maximum of
      those, clamped at `0`. This is exactly the space-optimized DP written the other
      way round - `cheapest` is the negative of the "holding a share" state.
    starterCode:
      python: |
        import sys
        from typing import List


        def max_profit(prices: List[int]) -> int:
            # One buy and one later sell at most; return the best profit (0 if none helps).
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            prices = [int(x) for x in data[1:1 + n]]
            print(max_profit(prices))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def max_profit(prices: List[int]) -> int:
            best = 0
            cheapest = prices[0]
            for price in prices:
                if price < cheapest:
                    cheapest = price
                elif price - cheapest > best:
                    best = price - cheapest
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            prices = [int(x) for x in data[1:1 + n]]
            print(max_profit(prices))


        if __name__ == "__main__":
            main()
