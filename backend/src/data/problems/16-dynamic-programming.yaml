    referenceSolution:
      python: |
        import sys
        from typing import List


        def max_sum_after_partitioning(arr: List[int], k: int) -> int:
            n = len(arr)
            dp = [0] * (n + 1)
            for i in range(1, n + 1):
                running_max = 0
                best = 0
                limit = k if k < i else i
                for length in range(1, limit + 1):
                    value = arr[i - length]
                    if value > running_max:
                        running_max = value
                    candidate = dp[i - length] + running_max * length
                    if candidate > best:
                        best = candidate
                dp[i] = best
            return dp[n]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            arr = [int(x) for x in data[2:2 + n]]
            print(max_sum_after_partitioning(arr, k))


        if __name__ == "__main__":
            main()
