  - slug: house-robber-ii
    title: "House Robber II"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "1D DP"
    tags: [dynamic-programming, array]
    sourceUrl: "https://leetcode.com/problems/house-robber-ii/"
    statement: |
      This time the `n` houses are built around a **circle**, so the first house and
      the last house are neighbours. House `i` holds `nums[i]` coins.

      You may not take coins from two adjacent houses (including the pair formed by
      house `0` and house `n - 1`). Print the maximum total you can collect.

      If there is only one house, it has no neighbours and can be taken.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the maximum number of coins that can be collected.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= nums[i] <= 10^4"
    examples:
      - input: |
          3
          2 3 2
        output: |
          3
        explanation: "Houses 0 and 2 are adjacent on the circle, so the best is taking a single house with 3 coins."
      - input: |
          4
          1 2 3 1
        output: |
          4
        explanation: "Take houses 0 and 2: 1 + 3 = 4. Houses 0 and 3 cannot be taken together."
    hints:
      - "The circle only adds one restriction: house 0 and house n - 1 cannot both be taken."
      - "So at least one of them is excluded. Solve the straight-line problem twice: without the first house, and without the last house."
    explanation: |
      In any valid choice, house `0` or house `n-1` (or both) is skipped. Therefore
      the answer is `max(line(nums[1:]), line(nums[:-1]))`, where `line` is the
      non-circular House Robber, with the special case `n = 1`.

      **Recursion - O(2^n).** `f(i) = max(nums[i] + f(i-2), f(i-1))` on each of the two
      linear arrays.

      **Memoization / Tabulation - O(n) time, O(n) space.** Cache or fill `dp` for each
      array; two passes.

      **Space optimization - O(n) time, O(1) extra space.** Each pass keeps only two
      rolling variables. (Slicing copies the array; iterate over index ranges to
      avoid even that.)
    starterCode:
      python: |
        import sys
        from typing import List


        def rob_circular(nums: List[int]) -> int:
            # Houses form a circle: the first and last houses are adjacent.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(rob_circular(nums))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def rob_circular(nums: List[int]) -> int:
            n = len(nums)
            if n == 1:
                return nums[0]

            def best_in_range(lo: int, hi: int) -> int:
                prev2, prev1 = 0, 0
                for i in range(lo, hi):
                    prev2, prev1 = prev1, max(prev1, prev2 + nums[i])
                return prev1

            return max(best_in_range(0, n - 1), best_in_range(1, n))


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(rob_circular(nums))


        if __name__ == "__main__":
            main()
