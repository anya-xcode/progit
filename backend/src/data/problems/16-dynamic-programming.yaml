  - slug: maximal-rectangle
    title: "Maximal Rectangle"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "DP on Squares"
    tags: [dynamic-programming, matrix, stack]
    sourceUrl: "https://leetcode.com/problems/maximal-rectangle/"
    statement: |
      You are given a binary matrix with `r` rows and `c` columns. Find the largest
      axis-aligned **rectangle** (made of contiguous rows and contiguous columns)
      that contains only ones, and print its area (number of cells).

      Print `0` if the matrix contains no ones.
    inputFormat: |
      - Line 1: two integers `r` and `c`.
      - Next `r` lines: `c` space-separated values, each `0` or `1`.
    outputFormat: |
      Print the area of the largest all-ones rectangle.
    constraints:
      - "1 <= r, c <= 200"
      - "matrix[i][j] is 0 or 1"
    examples:
      - input: |
          3 4
          1 0 1 1
          1 1 1 1
          0 1 1 1
        output: |
          6
        explanation: "Rows 1-2 and columns 1-3 form a 2x3 block of ones (area 6). The 2x3 block at rows 0-2, columns 2-3 has the same area."
      - input: |
          1 1
          0
        output: |
          0
        explanation: "There are no ones."
    hints:
      - "Treat each row as the floor of a histogram: height[j] = number of consecutive ones ending at this row in column j."
      - "height[j] is built from the previous row: it grows by 1 on a one and resets to 0 on a zero."
      - "For every row, compute the largest rectangle in that histogram with a monotonic stack in O(c)."
    explanation: |
      **Brute force - O(r^3 * c^3) or O(r^2 * c^2) with prefix sums.** Try every pair of
      top/bottom rows and left/right columns.

      **DP on heights.** Define `h[i][j]` = number of consecutive ones in column `j`
      ending at row `i`: `h[i][j] = h[i-1][j] + 1` if the cell is 1, else 0. This is a
      tabulated DP whose row `i` only depends on row `i-1`, so a single array of size
      `c` is enough (space optimization).

      Every all-ones rectangle has some bottom row `i`; with that row as the floor, it
      is a rectangle inside the histogram `h[i]`. So the answer is the maximum over
      rows of **Largest Rectangle in Histogram**.

      **Largest rectangle in a histogram - O(c) per row.** Scan the bars with a stack of
      indices whose heights are increasing. When a bar lower than the stack top
      arrives (or at the end, with a sentinel height 0), pop the top: its rectangle
      extends from just after the new stack top to just before the current index.

      **Total - O(r * c) time, O(c) space.**
