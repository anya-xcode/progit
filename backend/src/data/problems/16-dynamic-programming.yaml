    slug: distinct-subsequences
    title: "Distinct Subsequences"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "DP on Strings"
    tags: [dynamic-programming, string, counting]
    sourceUrl: "https://leetcode.com/problems/distinct-subsequences/"
    statement: |
      You are given two lowercase strings `s` and `t`.

      Count the ways to pick a set of positions from `s` (keeping their order) so that
      the picked characters spell exactly `t`. Two ways are different when the sets of
      positions differ, even if the resulting characters are the same.

      For example, `s = "aaa"` and `t = "aa"` has `3` ways: positions `{0,1}`, `{0,2}`
      and `{1,2}`.

      The count can be astronomically large, so print it **modulo `10^9 + 7`**.
    inputFormat: |
      - Line 1: the string `s`.
      - Line 2: the string `t`.
    outputFormat: |
      Print the number of ways, taken modulo `10^9 + 7`.
    constraints:
      - "1 <= |s|, |t| <= 500"
      - "Both strings contain only lowercase English letters."
    examples:
      - input: |
          babgbag
          bag
        output: |
          5
        explanation: "The positions spelling \"bag\" are {0,1,6}, {0,4,6}, {0,4,5}, {2,4,6} and {2,4,5}: 5 ways."
      - input: |
          abc
          abcd
        output: |
          0
        explanation: "`t` is longer than `s`, so no set of positions can spell it."
    hints:
      - "Look at the last character of s. Either you use it to match the last character of t, or you ignore it."
      - "count(i, j) = count(i - 1, j) + (count(i - 1, j - 1) if s[i - 1] == t[j - 1] else 0)."
      - "An empty t can be matched in exactly one way (pick nothing), which is the base case dp[i][0] = 1."
    explanation: |
      **Recursion - O(2^n) time.** Let `f(i, j)` be the number of ways the first `i`
      characters of `s` can spell the first `j` characters of `t`. Ignoring `s[i-1]`
      gives `f(i-1, j)`; using it to match `t[j-1]` (only possible when the characters
      are equal) gives `f(i-1, j-1)`. Base cases: `f(i, 0) = 1` for every `i` (pick
      nothing) and `f(0, j > 0) = 0`.

      **Memoization - O(n * m) time and space.** Only `(n+1) * (m+1)` states exist.

      **Tabulation - O(n * m) time, O(n * m) space.** Initialize column `0` to `1` and
      row `0` (beyond the first cell) to `0`, then fill row by row with
      `dp[i][j] = dp[i-1][j] + (dp[i-1][j-1] if s[i-1] == t[j-1] else 0)`, reducing
      modulo `10^9 + 7` after every addition.

      **Space optimization - O(n * m) time, O(m) space.** Row `i` only reads row `i-1`,
      so keep one array and iterate `j` **downward** from `m` to `1`; then `dp[j-1]`
      still holds the previous row's value when `dp[j]` is updated. Iterating upward
      would reuse the same character of `s` twice and overcount.
