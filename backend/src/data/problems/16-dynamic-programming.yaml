    referenceSolution:
      python: |
        import sys
        from typing import List


        def minimum_total(triangle: List[List[int]]) -> int:
            dp = list(triangle[-1])
            for i in range(len(triangle) - 2, -1, -1):
                row = triangle[i]
                for j in range(i + 1):
                    dp[j] = row[j] + min(dp[j], dp[j + 1])
            return dp[0]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            triangle = []
            pos = 1
            for i in range(n):
                triangle.append([int(x) for x in data[pos:pos + i + 1]])
                pos += i + 1
            print(minimum_total(triangle))


        if __name__ == "__main__":
            main()
