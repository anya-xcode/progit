  - slug: cherry-pickup-ii
    title: "Cherry Pickup II"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "2D/3D DP and DP on Grids"
    tags: [dynamic-programming, matrix]
    sourceUrl: "https://leetcode.com/problems/cherry-pickup-ii/"
    statement: |
      A field is described by a grid with `r` rows and `c` columns; cell `(i, j)`
      holds `grid[i][j]` cherries. Two robots start on the top row: **robot A** at
      `(0, 0)` and **robot B** at `(0, c - 1)`.

      The robots move together, one row per step. From `(i, j)` a robot moves to
      `(i + 1, j - 1)`, `(i + 1, j)` or `(i + 1, j + 1)`, and it must stay inside the
      grid. Both robots stop after reaching the bottom row.

      Every cell a robot stands on (including the starting cells) is harvested. If
      both robots stand on the same cell, its cherries are collected **only once**.

      Print the maximum number of cherries the two robots can collect together.
    inputFormat: |
      - Line 1: two integers `r` and `c`.
      - Next `r` lines: `c` space-separated integers.
    outputFormat: |
      Print the maximum total number of cherries.
    constraints:
      - "1 <= r, c <= 30"
      - "0 <= grid[i][j] <= 100"
    examples:
      - input: |
