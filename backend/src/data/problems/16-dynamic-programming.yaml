    tags: [dynamic-programming, unbounded-knapsack]
    sourceUrl: ""
    statement: |
      A rod of length `n` can be cut into pieces of integer lengths. A piece of length
      `i` sells for `price[i]` (for `1 <= i <= n`). You may make any number of cuts,
      including none, and pieces of the same length may appear several times.

      Print the maximum revenue obtainable by cutting the rod and selling all pieces.
    inputFormat: |
      - Line 1: an integer `n`, the rod length.
      - Line 2: `n` space-separated integers; the `i`-th of them is the price of a piece of length `i`.
    outputFormat: |
      Print the maximum total revenue.
    constraints:
      - "1 <= n <= 500"
      - "1 <= price[i] <= 10^4"
    examples:
      - input: |
          4
          1 5 8 9
        output: |
          10
        explanation: "Cut the rod into two pieces of length 2: 5 + 5 = 10, better than selling it whole for 9."
      - input: |
          3
          3 5 6
        output: |
          9
        explanation: "Three pieces of length 1 earn 3 + 3 + 3 = 9."
    hints:
      - "This is an unbounded knapsack: piece lengths are items, the rod length is the capacity, and every length may be reused."
      - "best[len] = max over the first cut c (1..len) of price[c] + best[len - c]."
    explanation: |
      **Recursion - O(2^n) time.** `f(i, len)` = best revenue for a rod of length `len`
      using piece lengths `1..i`. Skip length `i`: `f(i-1, len)`. Use one piece of
      length `i` (if `i <= len`): `price[i] + f(i, len - i)`, staying at `i` because
      lengths may repeat. With only length 1 available, `f(1, len) = len * price[1]`.

      **Memoization - O(n^2) time, O(n^2) space.**

      **Tabulation - O(n^2) time, O(n^2) space.** Fill `dp[i][len]`.

      **Space optimization - O(n^2) time, O(n) space.** A single array suffices:
      `best[len] = max(best[len], price[i] + best[len - i])` with `len` increasing.
      Equivalently, `best[len] = max(price[c] + best[len - c])` over all first cuts `c`.
