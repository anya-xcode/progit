    slug: longest-common-substring
    title: "Longest Common Substring"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "DP on Strings"
    tags: [dynamic-programming, string]
    sourceUrl: ""
    statement: |
      A **substring** is a block of consecutive characters, unlike a subsequence, which
      may skip characters.

      Given two lowercase strings `a` and `b`, print the length of the longest string
      that appears as a substring in both of them. Print `0` when they share no
      character at all.
    inputFormat: |
      - Line 1: the string `a`.
      - Line 2: the string `b`.
    outputFormat: |
      Print a single integer: the length of the longest common substring.
    constraints:
      - "1 <= |a|, |b| <= 500"
      - "Both strings contain only lowercase English letters."
    examples:
      - input: |
          subsequence
          subsetsequent
        output: |
          6
        explanation: "\"sequen\" occurs in both (a = \"sub|sequen|ce\", b = \"subset|sequen|t\") and nothing longer does."
      - input: |
          abc
          def
        output: |
          0
        explanation: "The strings have no character in common, so the longest common substring is empty."
    hints:
      - "Define dp[i][j] as the length of the longest common substring that ENDS exactly at a[i - 1] and b[j - 1]."
      - "If the two characters differ, that value is 0 - a substring cannot have a gap. If they match, it is dp[i - 1][j - 1] + 1."
      - "The answer is the maximum entry anywhere in the table, not dp[n][m]."
    explanation: |
      **Why the LCS recurrence does not work.** For subsequences you are allowed to skip
      a character and continue. For substrings a mismatch ends the run, so the state has
      to be anchored: `dp[i][j]` is the length of the common substring that *ends* at
      `a[i-1]` and `b[j-1]`.

      **Recursion - O(2^(n+m)) time.** `f(i, j)` = length of the common run ending at
      those two positions: `0` if the characters differ, otherwise `1 + f(i-1, j-1)`.
      Since the answer may end anywhere, the result is `max over all (i, j)` of
      `f(i, j)` - the brute-force version of which is comparing every pair of
      substrings.

      **Memoization - O(n * m) time and space.** The chain `f(i, j) -> f(i-1, j-1)` is
      only ever walked once per cell.

      **Tabulation - O(n * m) time, O(n * m) space.** Allocate `(n+1) x (m+1)` zeros and
      fill row by row: `dp[i][j] = dp[i-1][j-1] + 1` when `a[i-1] == b[j-1]`, else `0`.
      Track the running maximum while filling.

      **Space optimization - O(n * m) time, O(m) space.** Row `i` only reads row `i-1`,
      so two arrays of length `m + 1` are enough. (Recording the index where the maximum
      occurred also lets you print the substring itself.)
    starterCode:
      python: |
        import sys


        def longest_common_substring(a: str, b: str) -> int:
            # Return the length of the longest block of consecutive characters common to a and b.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            a, b = data[0], data[1]
            print(longest_common_substring(a, b))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def longest_common_substring(a: str, b: str) -> int:
            m = len(b)
            prev = [0] * (m + 1)
            best = 0
            for ch in a:
                cur = [0] * (m + 1)
                for j in range(1, m + 1):
                    if ch == b[j - 1]:
                        run = prev[j - 1] + 1
                        cur[j] = run
                        if run > best:
                            best = run
                prev = cur
            return best


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            a, b = data[0], data[1]
            print(longest_common_substring(a, b))


        if __name__ == "__main__":
            main()
