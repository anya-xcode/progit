  - slug: frog-jump-with-k-distances
    title: "Frog Jump with K Distances"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "1D DP"
    tags: [dynamic-programming, array]
    sourceUrl: ""
    statement: |
      There are `n` stones in a row; stone `i` has height `heights[i]`. A frog starts
      on stone `0` and wants to reach stone `n - 1`.

      From stone `i` the frog may jump forward to any stone `i + 1, i + 2, ..., i + k`
      (as long as it exists). Jumping from stone `i` to stone `j` costs
      `|heights[i] - heights[j]|` energy.

      Return the **minimum total energy** required to reach the last stone.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `heights`.
    outputFormat: |
      Print the minimum total energy needed to reach stone `n - 1`.
    constraints:
      - "1 <= n <= 2000"
      - "1 <= k <= 100"
      - "0 <= heights[i] <= 10^4"
    examples:
      - input: |
          5 3
          10 30 40 50 20
        output: |
          30
        explanation: "Jump 0 -> 1 (cost 20) and then 1 -> 4 (cost |30 - 20| = 10). Total 30."
      - input: |
          3 1
          10 20 10
        output: |
          20
        explanation: "With k = 1 the frog must visit every stone: |20 - 10| + |10 - 20| = 20."
    hints:
      - "This generalizes Frog Jump: the previous stone can be any of the k stones before i."
      - "dp[i] = min over j in [max(0, i - k), i - 1] of dp[j] + |heights[i] - heights[j]|."
    explanation: |
      **Recursion - O(k^n) time.** Let `f(i)` be the minimum energy to reach stone `i`,
      with `f(0) = 0`. For `i > 0`, try every jump length `s` from 1 to `k`:
      `f(i) = min(f(i - s) + |h[i] - h[i - s]|)` over valid `s`.

      **Memoization - O(n * k) time, O(n) space.** Each `f(i)` is computed once and
      scans at most `k` predecessors.

      **Tabulation - O(n * k) time, O(n) space.** Fill `dp` from left to right; when
      computing `dp[i]` all of `dp[i-k..i-1]` are already known.

      **Space optimization.** Only the last `k` values are needed, so a circular
      buffer of size `k` gives O(k) extra space. The time stays O(n * k).
    starterCode:
      python: |
        import sys
        from typing import List


        def frog_jump_k(heights: List[int], k: int) -> int:
            # Return the minimum energy to reach the last stone with jumps of length 1..k.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            heights = [int(x) for x in data[2:2 + n]]
            print(frog_jump_k(heights, k))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def frog_jump_k(heights: List[int], k: int) -> int:
            n = len(heights)
            dp = [0] * n
            for i in range(1, n):
                best = None
                for j in range(max(0, i - k), i):
                    cost = dp[j] + abs(heights[i] - heights[j])
                    if best is None or cost < best:
                        best = cost
                dp[i] = best
            return dp[n - 1]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            heights = [int(x) for x in data[2:2 + n]]
            print(frog_jump_k(heights, k))


        if __name__ == "__main__":
            main()
