      python: |
        import sys
        from typing import List


        def cherry_pickup(grid: List[List[int]]) -> int:
            rows, cols = len(grid), len(grid[0])
            # ahead[a][b] = best total from the row below when robots are at columns a and b
            ahead = [[0] * cols for _ in range(cols)]
            for i in range(rows - 1, -1, -1):
                cells = grid[i]
                current = [[0] * cols for _ in range(cols)]
                for a in range(cols):
                    for b in range(cols):
                        gain = cells[a] if a == b else cells[a] + cells[b]
                        best = 0
                        if i < rows - 1:
                            for na in (a - 1, a, a + 1):
                                if 0 <= na < cols:
                                    ahead_row = ahead[na]
                                    for nb in (b - 1, b, b + 1):
                                        if 0 <= nb < cols and ahead_row[nb] > best:
                                            best = ahead_row[nb]
                        current[a][b] = gain + best
                ahead = current
            return ahead[0][cols - 1]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            r, c = int(data[0]), int(data[1])
            values = [int(x) for x in data[2:2 + r * c]]
            grid = [values[i * c:(i + 1) * c] for i in range(r)]
            print(cherry_pickup(grid))


        if __name__ == "__main__":
            main()
