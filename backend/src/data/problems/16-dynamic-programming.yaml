        import sys
        from typing import List


        def max_profit_k_transactions(prices: List[int], k: int) -> int:
            if k == 0:
                return 0
            buy = [-10 ** 9] * (k + 1)
            sell = [0] * (k + 1)
            for price in prices:
                for t in range(1, k + 1):
                    if sell[t - 1] - price > buy[t]:
                        buy[t] = sell[t - 1] - price
                    if buy[t] + price > sell[t]:
                        sell[t] = buy[t] + price
            return sell[k]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, k = int(data[0]), int(data[1])
            prices = [int(x) for x in data[2:2 + n]]
            print(max_profit_k_transactions(prices, k))


        if __name__ == "__main__":
