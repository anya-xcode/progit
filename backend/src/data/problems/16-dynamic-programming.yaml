    referenceSolution:
      python: |
        import sys


        def print_longest_common_subsequence(a: str, b: str) -> str:
            n, m = len(a), len(b)
            lcs = [[0] * (m + 1) for _ in range(n + 1)]
            for i in range(n - 1, -1, -1):
                row, below, ch = lcs[i], lcs[i + 1], a[i]
                for j in range(m - 1, -1, -1):
                    if ch == b[j]:
                        row[j] = below[j + 1] + 1
                    else:
                        row[j] = below[j] if below[j] >= row[j + 1] else row[j + 1]

            next_a = [[n] * 26 for _ in range(n + 1)]
            for i in range(n - 1, -1, -1):
                next_a[i] = next_a[i + 1][:]
                next_a[i][ord(a[i]) - 97] = i
            next_b = [[m] * 26 for _ in range(m + 1)]
            for j in range(m - 1, -1, -1):
                next_b[j] = next_b[j + 1][:]
                next_b[j][ord(b[j]) - 97] = j

            result = []
            i = j = 0
            need = lcs[0][0]
            while need > 0:
                for c in range(26):
                    ia, jb = next_a[i][c], next_b[j][c]
                    if ia < n and jb < m and lcs[ia][jb] == need:
                        result.append(chr(97 + c))
                        i, j = ia + 1, jb + 1
                        need -= 1
                        break
            return "".join(result)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            a, b = data[0], data[1]
            print(print_longest_common_subsequence(a, b))


        if __name__ == "__main__":
            main()
