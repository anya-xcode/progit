    title: "Subset Sum Equal to Target"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "DP on Subsequences"
    tags: [dynamic-programming, knapsack, array]
    sourceUrl: ""
    statement: |
      Given an array `arr` of `n` positive integers and a target `k`, decide whether
      some **subset** of the array (a selection of elements at distinct positions,
      in any order) has a sum of exactly `k`.

      Print `true` if such a subset exists, otherwise print `false`.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print `true` or `false`.
    constraints:
      - "1 <= n <= 100"
      - "1 <= arr[i] <= 1000"
      - "1 <= k <= 1000"
    examples:
      - input: |
          4 6
          1 7 2 3
        output: |
          true
        explanation: "The subset {1, 2, 3} sums to 6."
      - input: |
          3 10
          2 4 3
        output: |
          false
        explanation: "The whole array only sums to 9, so 10 is unreachable."
    hints:
      - "For each element decide: take it or not take it. What changes in the remaining target?"
      - "State: (index, remaining target). can(i, t) = can(i - 1, t) or can(i - 1, t - arr[i])."
      - "Only the previous row of the table is needed; iterate targets downward to reuse one array."
    explanation: |
      **Recursion - O(2^n) time.** `f(i, t)` = can a subset of `arr[0..i]` reach sum
      `t`? Base cases: `t == 0` is true; at `i == 0` the answer is `arr[0] == t`.
      Otherwise `f(i, t) = f(i-1, t) or (arr[i] <= t and f(i-1, t - arr[i]))`.

      **Memoization - O(n * k) time, O(n * k) space.** Cache the `n * (k + 1)` states.

      **Tabulation - O(n * k) time, O(n * k) space.** `dp[i][t]` built row by row with
      `dp[i][0] = true` and the first row from `arr[0]`.

      **Space optimization - O(n * k) time, O(k) space.** Keep one boolean array and,
      for each element `x`, update `t` from `k` down to `x`:
      `dp[t] = dp[t] or dp[t - x]`. Going downward guarantees each element is used
      at most once.
