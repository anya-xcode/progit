    referenceSolution:
      python: |
        import sys
        from typing import List


        def max_profit_with_cooldown(prices: List[int]) -> int:
            # ahead1[b] = best from day i + 1, ahead2[b] = best from day i + 2 (b = 1: free to buy)
            ahead1 = [0, 0]
            ahead2 = [0, 0]
            for i in range(len(prices) - 1, -1, -1):
                price = prices[i]
                current = [
                    max(price + ahead2[1], ahead1[0]),   # holding a share
                    max(-price + ahead1[0], ahead1[1]),  # free to buy
                ]
                ahead2, ahead1 = ahead1, current
            return ahead1[1]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            prices = [int(x) for x in data[1:1 + n]]
            print(max_profit_with_cooldown(prices))


        if __name__ == "__main__":
            main()
