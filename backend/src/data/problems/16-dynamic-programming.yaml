    title: "Longest Common Subsequence"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "DP on Strings"
    tags: [dynamic-programming, string]
    sourceUrl: "https://leetcode.com/problems/longest-common-subsequence/"
    statement: |
      A **subsequence** of a string is obtained by deleting zero or more characters
      without changing the order of the remaining ones. For example, `"rce"` is a
      subsequence of `"force"`, but `"ecr"` is not.

      Given two strings `a` and `b`, print the length of their **longest common
      subsequence** (the longest string that is a subsequence of both). Print `0` if
      they share no characters.
    inputFormat: |
      - Line 1: the string `a`.
      - Line 2: the string `b`.
    outputFormat: |
      Print the length of the longest common subsequence.
    constraints:
      - "1 <= |a|, |b| <= 500"
      - "Both strings contain only lowercase English letters."
    examples:
      - input: |
          stone
          longest
        output: |
          3
        explanation: "\"one\" is a subsequence of both \"stone\" and \"longest\", and no common subsequence of length 4 exists."
      - input: |
          abc
          xyz
        output: |
          0
        explanation: "The strings have no character in common."
    hints:
      - "Compare the last characters of the two prefixes you are looking at."
      - "If they match, both can be part of the LCS; otherwise drop the last character of one string or the other."
      - "Use 1-based indices so an empty prefix is represented by index 0."
    explanation: |
      **Recursion - O(2^(n+m)) time.** `f(i, j)` = LCS length of prefixes `a[0..i-1]`
      and `b[0..j-1]`. If either prefix is empty, it is 0. If `a[i-1] == b[j-1]`, then
      `f(i, j) = 1 + f(i-1, j-1)`; otherwise `f(i, j) = max(f(i-1, j), f(i, j-1))`.

      **Memoization - O(n * m) time, O(n * m) space.**

      **Tabulation - O(n * m) time, O(n * m) space.** A `(n+1) x (m+1)` table with row 0
      and column 0 equal to 0, filled row by row. (Walking back through this table
      also recovers an actual LCS string.)

      **Space optimization - O(n * m) time, O(m) space.** Row `i` only uses row `i-1`,
      so keep `prev` and `cur` arrays of length `m + 1`.
