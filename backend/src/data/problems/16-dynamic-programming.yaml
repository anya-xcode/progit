  - slug: triangle
    title: "Triangle"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "2D/3D DP and DP on Grids"
    tags: [dynamic-programming, array]
    sourceUrl: "https://leetcode.com/problems/triangle/"
    statement: |
      A triangle of integers has `n` rows; row `i` (0-indexed) contains `i + 1`
      numbers. You start at the single number in row 0 and walk down to the last
      row. From position `j` in row `i` you may step to position `j` or position
      `j + 1` in row `i + 1`.

      Print the **minimum possible sum** of the numbers along such a walk.
    inputFormat: |
      - Line 1: an integer `n`, the number of rows.
      - Next `n` lines: line `i` contains `i + 1` space-separated integers.
    outputFormat: |
      Print the minimum path sum from the top to the bottom row.
    constraints:
      - "1 <= n <= 200"
      - "-10^4 <= value <= 10^4"
    examples:
      - input: |
          4
          2
          3 4
          6 5 7
          4 1 8 3
        output: |
          11
        explanation: "Walk 2 -> 3 -> 5 -> 1 for a total of 11."
      - input: |
          1
          -10
        output: |
          -10
        explanation: "The triangle has only one number."
    hints:
      - "Unlike a grid, the path can end at any cell of the last row but always starts at the top."
      - "Work from the bottom row upward: best(i, j) = value(i, j) + min(best(i + 1, j), best(i + 1, j + 1))."
    explanation: |
      **Recursion - O(2^n) time.** Let `f(i, j)` be the cheapest sum from `(i, j)` down
      to the last row. On the last row `f(n-1, j) = tri[n-1][j]`; otherwise
      `f(i, j) = tri[i][j] + min(f(i+1, j), f(i+1, j+1))`. The answer is `f(0, 0)`.
      Starting at the fixed top avoids having to try every ending cell.

      **Memoization - O(n^2) time, O(n^2) space.** There are about `n^2 / 2` states.

      **Tabulation - O(n^2) time, O(n^2) space.** Copy the last row into `dp` and fill
      rows `n-2` down to `0`.

      **Space optimization - O(n^2) time, O(n) space.** Keep one array initialised with
      the last row; updating `dp[j]` left to right is safe because `dp[j]` and
      `dp[j+1]` still hold the row below when read.
    starterCode:
      python: |
