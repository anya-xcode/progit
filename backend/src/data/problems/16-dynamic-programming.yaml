      python: |
        import sys
        from typing import List


        def coin_change(coins: List[int], amount: int) -> int:
            impossible = amount + 1
            fewest = [0] + [impossible] * amount
            for coin in coins:
                for s in range(coin, amount + 1):
                    candidate = fewest[s - coin] + 1
                    if candidate < fewest[s]:
                        fewest[s] = candidate
            return -1 if fewest[amount] == impossible else fewest[amount]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n, amount = int(data[0]), int(data[1])
            coins = [int(x) for x in data[2:2 + n]]
            print(coin_change(coins, amount))


        if __name__ == "__main__":
            main()
