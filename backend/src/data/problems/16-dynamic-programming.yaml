  - slug: longest-increasing-subsequence
    title: "Longest Increasing Subsequence"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "DP on LIS"
    tags: [dynamic-programming, binary-search, array]
    sourceUrl: "https://leetcode.com/problems/longest-increasing-subsequence/"
    statement: |
      Given an integer array `nums`, find the length of its longest **strictly
      increasing subsequence**.

      A subsequence keeps the relative order of the chosen elements but does not need
      to be contiguous. Strictly increasing means every chosen element is greater
      than the one before it (equal values do not count).
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print the length of the longest strictly increasing subsequence.
    constraints:
      - "1 <= n <= 2500"
      - "-10^4 <= nums[i] <= 10^4"
    examples:
      - input: |
          7
          4 10 4 3 8 9 12
        output: |
          4
        explanation: "One longest choice is 4, 8, 9, 12 (another is 3, 8, 9, 12)."
      - input: |
          4
          5 5 5 5
        output: |
          1
        explanation: "All values are equal, so a strictly increasing subsequence has only one element."
    hints:
      - "Define dp[i] as the length of the longest increasing subsequence that ends exactly at index i."
      - "dp[i] = 1 + max(dp[j]) over j < i with nums[j] < nums[i]. This is O(n^2)."
      - "For O(n log n), keep tails[L] = smallest possible tail of an increasing subsequence of length L + 1, and binary search it."
    explanation: |
      **Recursion - O(2^n) time.** `f(i, prev)` = longest increasing subsequence using
      elements from index `i` onward when the last chosen index is `prev` (or none).
      Skip `nums[i]`: `f(i+1, prev)`; take it if `nums[i] > nums[prev]`:
      `1 + f(i+1, i)`.

      **Memoization - O(n^2) time, O(n^2) space.** Index `prev` shifted by one so "none"
      fits in the table.

      **Tabulation - O(n^2) time, O(n) space.** The table collapses naturally to
      `dp[i]` = LIS ending at `i`: `dp[i] = 1 + max(dp[j] : j < i, nums[j] < nums[i])`.
      The answer is `max(dp)`. Storing the argmax `j` lets you print an actual
      subsequence.

      **Binary search - O(n log n) time, O(n) space.** Maintain `tails`, where
      `tails[k]` is the smallest ending value of any increasing subsequence of length
      `k + 1` seen so far (the array is sorted). For each `x`, find the first index with
      `tails[idx] >= x` and overwrite it with `x`, or append when `x` is larger than
      every tail. The length of `tails` is the answer.
