  - sheetId: prob-16-8-3-minimum-cost-to-cut-the-s
    slug: minimum-cost-to-cut-the-stick
    title: "Minimum Cost to Cut the Stick"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "MCM DP / Partition DP"
    tags: [dynamic-programming, partition-dp, interval-dp]
    sourceUrl: "https://leetcode.com/problems/minimum-cost-to-cut-a-stick/"
    statement: |
      A wooden stick runs from coordinate `0` to coordinate `length`. You must make a
      cut at each of the `m` given positions `cuts[0..m-1]`, in any order you like.

      Cutting a piece costs the **current length of that piece**, no matter where
      inside it the cut falls. After a cut the piece becomes two shorter pieces, so
      later cuts on them are cheaper - which means the order of the cuts changes the
      total cost.

      Print the minimum total cost of performing all `m` cuts.
    inputFormat: |
      - Line 1: two integers `length` and `m`.
      - Line 2: `m` space-separated integers, the cut positions.
    outputFormat: |
      Print a single integer: the minimum total cost.
    constraints:
      - "2 <= length <= 1000000"
      - "1 <= m <= 100"
      - "0 < cuts[i] < length, and all cut positions are distinct."
      - "The cut positions are not necessarily given in sorted order."
    examples:
      - input: |
          7 4
          1 3 4 5
        output: |
          16
        explanation: "Cutting in the order 3, 5, 1, 4 costs 7 + 4 + 3 + 2 = 16, and no order does better. (Left to right it would cost 7 + 6 + 4 + 3 = 20.)"
      - input: |
          9 5
          5 6 1 4 2
        output: |
          22
        explanation: "Cutting at 5 first splits the stick into 0-5 and 5-9; continuing well from there gives a total of 22."
    hints:
      - "Sort the cuts and add the two stick ends, 0 and length, as sentinels. Every piece that ever exists is a range between two of these points."
      - "Which cut do you make FIRST inside a piece? That choice splits the piece into two independent pieces."
      - "cost(i, j) = (points[j] - points[i]) + min over i < k < j of cost(i, k) + cost(k, j). Fill it by increasing distance j - i."
    explanation: |
      **The right state.** Sort the cut positions and surround them with the sentinels
      `0` and `length`, giving `points[0..m+1]`. Every piece of wood that can ever exist
      is exactly the span between two of these points, so let `cost(i, j)` be the
      minimum cost of applying all the cuts that lie strictly between `points[i]` and
      `points[j]` to that single piece. The answer is `cost(0, m+1)`.

      **Recursion - exponential.** Decide which cut inside the piece is made **first**.
      That cut costs `points[j] - points[i]` (the whole piece is still in one part), and
      afterwards the two sides never interact again:
      `cost(i, j) = (points[j] - points[i]) + min over i < k < j of cost(i, k) + cost(k, j)`,
      with `cost(i, i+1) = 0` (no cut inside). Trying every order gives `m!` sequences.

      **Memoization - O(m^3) time, O(m^2) space.** There are `O(m^2)` ranges, each with
      `O(m)` choices of first cut. Sorting the cuts is what makes the state a *range* at
      all; without it the pieces cannot be described by two indices.

      **Tabulation - O(m^3) time, O(m^2) space.** A range depends only on shorter ranges,
      so loop over `j - i` increasing from `2` to `m + 1`, and inside that over `i`:

      ```
      for span = 2 .. m+1:
          for i = 0 .. m+1-span:
              j = i + span
              cost[i][j] = (points[j] - points[i])
                         + min over k in (i, j) of cost[i][k] + cost[k][j]
      ```

      **Space optimization - not available.** As with every partition DP, a long range
      may need any of its sub-ranges, so the `O(m^2)` table stays.

      Note the cost term does not depend on `k` at all: the first cut always costs the
      full piece. What the choice of `k` decides is how the remaining work splits.
    starterCode:
      python: |
        import sys
        from typing import List


        def min_cost_to_cut_stick(length: int, cuts: List[int]) -> int:
            # Minimum total cost of making every cut, where a cut costs the piece's length.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            length, m = int(data[0]), int(data[1])
            cuts = [int(x) for x in data[2:2 + m]]
            print(min_cost_to_cut_stick(length, cuts))


