    title: "Minimum Path Sum"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "2D/3D DP and DP on Grids"
    tags: [dynamic-programming, matrix]
    sourceUrl: "https://leetcode.com/problems/minimum-path-sum/"
    statement: |
      A grid with `r` rows and `c` columns contains a non-negative cost in every cell.
      Starting at the top-left cell, you move one cell **down** or **right** at a
      time until you reach the bottom-right cell.

      The cost of a path is the sum of all cells it visits, including the first and
      the last cell. Print the **minimum possible path cost**.
    inputFormat: |
      - Line 1: two integers `r` and `c`.
      - Next `r` lines: `c` space-separated integers.
    outputFormat: |
      Print the minimum path sum.
    constraints:
      - "1 <= r, c <= 200"
      - "0 <= grid[i][j] <= 100"
    examples:
      - input: |
          3 3
          1 3 1
          1 5 1
          4 2 1
        output: |
          7
        explanation: "Path 1 -> 3 -> 1 -> 1 -> 1 (right, right, down, down) costs 7."
      - input: |
          2 3
          1 2 3
          4 5 6
        output: |
          12
        explanation: "Path 1 -> 2 -> 3 -> 6 (right, right, down) costs 12, which beats every path through 4 or 5."
    hints:
      - "The best path into (i, j) extends the cheaper of the best paths into (i - 1, j) and (i, j - 1)."
      - "Cells in the first row can only be reached from the left, cells in the first column only from above."
    explanation: |
      **Recursion - exponential.** `f(i, j)` = cheapest cost to reach `(i, j)`.
      `f(0, 0) = grid[0][0]`; out-of-grid positions are +infinity; otherwise
      `f(i, j) = grid[i][j] + min(f(i-1, j), f(i, j-1))`.

      **Memoization - O(r * c) time, O(r * c) space.**

      **Tabulation - O(r * c) time, O(r * c) space.** Fill the table in reading order,
      handling the first row and first column separately.

      **Space optimization - O(r * c) time, O(c) space.** Keep one row: `row[j]` holds
      the value from above before it is overwritten, and `row[j-1]` is the freshly
      computed value to the left.
    starterCode:
      python: |
        import sys
