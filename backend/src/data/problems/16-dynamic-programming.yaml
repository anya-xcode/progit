    referenceSolution:
      python: |
        import sys
        from typing import List


        def matrix_chain_cost(rows: List[int], cols: List[int]) -> int:
            n = len(rows)
            if n < 2:
                return 0
            cost = [[0] * n for _ in range(n)]
            for length in range(2, n + 1):
                for i in range(n - length + 1):
                    j = i + length - 1
                    row_i, col_j = rows[i], cols[j]
                    row = cost[i]
                    best = -1
                    for k in range(i, j):
                        candidate = row[k] + cost[k + 1][j] + row_i * cols[k] * col_j
                        if best < 0 or candidate < best:
                            best = candidate
                    row[j] = best
            return cost[0][n - 1]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            rows = [int(data[1 + 2 * i]) for i in range(n)]
            cols = [int(data[2 + 2 * i]) for i in range(n)]
            print(matrix_chain_cost(rows, cols))


        if __name__ == "__main__":
            main()
