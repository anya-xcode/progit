    slug: minimum-insertions-to-make-string-palindrome-dp-29
    title: "Minimum Insertions to Make String Palindrome"
    difficulty: Hard
    topic: Dynamic Programming
    subtopic: "DP on Strings"
    tags: [dynamic-programming, string, palindrome]
    sourceUrl: "https://leetcode.com/problems/minimum-insertion-steps-to-make-a-string-palindrome/"
    statement: |
      You may insert a character anywhere in the string `s` - at the front, at the back
      or between any two characters - and you may do it as many times as you like.

      Print the **minimum number of insertions** needed to turn `s` into a palindrome
      (a string that reads the same forwards and backwards).
    inputFormat: |
      - Line 1: the string `s`.
    outputFormat: |
      Print a single integer: the minimum number of insertions.
    constraints:
      - "1 <= |s| <= 500"
      - "`s` contains only lowercase English letters."
    examples:
      - input: |
          abcaa
        output: |
          2
        explanation: "Insert 'a' and 'c' to get \"aacbcaa\", which is a palindrome. One insertion is never enough."
      - input: |
          racecar
        output: |
          0
        explanation: "The string is already a palindrome, so nothing has to be inserted."
    hints:
      - "Insertions never delete anything, so the original string always survives as a subsequence of the final palindrome."
      - "The characters you never have to duplicate are exactly the ones that already form a palindromic subsequence. Which one should you keep?"
      - "answer = |s| - (length of the longest palindromic subsequence of s), and that length is the LCS of s with its reverse."
    explanation: |
      **The key observation.** Every character of `s` stays in the final palindrome, so
      if the answer is `k`, the palindrome has length `|s| + k`. Take the longest
      palindromic subsequence `P` of `s`: the characters outside `P` each need one
      mirror copy inserted, and the characters inside `P` need none. So
      `answer = |s| - LPS(s)`, and no scheme can do better, because any palindrome
      containing `s` as a subsequence induces a palindromic subsequence of `s` of
      length at least `|s| - k`.

      **Computing LPS.** A palindromic subsequence of `s` is exactly a common
      subsequence of `s` and `reverse(s)`, so `LPS(s) = LCS(s, reverse(s))`.

      **Recursion - O(2^n) time.** `f(i, j)` = LCS length of `s[i:]` and
      `reverse(s)[j:]`: `1 + f(i+1, j+1)` when the characters match, else
      `max(f(i+1, j), f(i, j+1))`.

      **Memoization - O(n^2) time and space.** Only `(n+1)^2` distinct states.

      **Tabulation - O(n^2) time, O(n^2) space.** Fill the `(n+1) x (n+1)` table from the
      empty-suffix base cases.

      **Space optimization - O(n^2) time, O(n) space.** Each row reads only the previous
      one, so two arrays of length `n + 1` suffice.

      An equivalent interval formulation avoids reversing: `g(i, j)` = LPS of
      `s[i..j]`, with `g(i, i) = 1`, `g(i, j) = 2 + g(i+1, j-1)` when
      `s[i] == s[j]`, and `max(g(i+1, j), g(i, j-1))` otherwise.
    starterCode:
      python: |
        import sys


        def min_insertions_for_palindrome(s: str) -> int:
            # Return the fewest insertions that make s a palindrome.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s = data[0]
            print(min_insertions_for_palindrome(s))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def min_insertions_for_palindrome(s: str) -> int:
            n = len(s)
            reversed_s = s[::-1]
            prev = [0] * (n + 1)
            for ch in s:
                cur = [0] * (n + 1)
                for j in range(1, n + 1):
                    if ch == reversed_s[j - 1]:
                        cur[j] = prev[j - 1] + 1
                    else:
                        cur[j] = prev[j] if prev[j] > cur[j - 1] else cur[j - 1]
                prev = cur
            return n - prev[n]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s = data[0]
            print(min_insertions_for_palindrome(s))


        if __name__ == "__main__":
            main()
