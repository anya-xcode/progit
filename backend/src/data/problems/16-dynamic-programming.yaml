    referenceSolution:
      python: |
        import sys


        def shortest_common_supersequence(a: str, b: str) -> str:
            n, m = len(a), len(b)
            scs = [[0] * (m + 1) for _ in range(n + 1)]
            for i in range(n + 1):
                scs[i][m] = n - i
            for j in range(m + 1):
                scs[n][j] = m - j
            for i in range(n - 1, -1, -1):
                row, below, ch = scs[i], scs[i + 1], a[i]
                for j in range(m - 1, -1, -1):
                    if ch == b[j]:
                        row[j] = below[j + 1] + 1
                    else:
                        row[j] = 1 + (below[j] if below[j] < row[j + 1] else row[j + 1])

            result = []
            i = j = 0
            while i < n and j < m:
                if a[i] == b[j]:
                    result.append(a[i])
                    i += 1
                    j += 1
                    continue
                take_a = scs[i + 1][j] + 1 == scs[i][j]
                take_b = scs[i][j + 1] + 1 == scs[i][j]
                if take_a and (not take_b or a[i] < b[j]):
                    result.append(a[i])
                    i += 1
                else:
                    result.append(b[j])
                    j += 1
            result.append(a[i:])
            result.append(b[j:])
            return "".join(result)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            a, b = data[0], data[1]
            print(shortest_common_supersequence(a, b))


        if __name__ == "__main__":
            main()
