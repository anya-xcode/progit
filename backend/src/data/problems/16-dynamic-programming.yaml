    referenceSolution:
      python: |
        import sys
        from typing import List


        def min_path_sum(grid: List[List[int]]) -> int:
            cols = len(grid[0])
            row = [0] * cols
            for i, cells in enumerate(grid):
                for j in range(cols):
                    if i == 0 and j == 0:
                        row[j] = cells[0]
                    elif i == 0:
                        row[j] = row[j - 1] + cells[j]
                    elif j == 0:
                        row[j] = row[j] + cells[j]
                    else:
                        row[j] = min(row[j], row[j - 1]) + cells[j]
            return row[cols - 1]


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            r, c = int(data[0]), int(data[1])
            values = [int(x) for x in data[2:2 + r * c]]
            grid = [values[i * c:(i + 1) * c] for i in range(r)]
            print(min_path_sum(grid))


        if __name__ == "__main__":
            main()
