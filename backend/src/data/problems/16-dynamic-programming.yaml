  - sheetId: prob-16-7-3-longest-increasing-subseq
    slug: longest-increasing-subsequence-dp-43
    title: "Longest Increasing Subsequence (Binary Search)"
    difficulty: Medium
    topic: Dynamic Programming
    subtopic: "DP on LIS"
    tags: [dynamic-programming, binary-search, array]
    sourceUrl: ""
    statement: |
      A shipping crane stacks containers onto a single pile. It processes the arriving
      containers in the given order and may either load a container or let it pass. A
      container can only be loaded if it is **strictly heavier** than the one loaded
      just before it.

      Given the arrival weights `w[0..n-1]`, print the largest number of containers the
      crane can load - that is, the length of the longest strictly increasing
      subsequence of `w`.

      `n` can be large enough that an `O(n^2)` scan is wasteful; aim for `O(n log n)`.
    inputFormat: |
      - Line 1: an integer `n`, the number of containers.
      - Line 2: `n` space-separated integers, the array `w`.
    outputFormat: |
      Print a single integer: the length of the longest strictly increasing subsequence.
    constraints:
      - "1 <= n <= 100000"
      - "-1000000000 <= w[i] <= 1000000000"
    examples:
      - input: |
          8
          10 9 2 5 3 7 101 18
        output: |
          4
        explanation: "Loading 2, 3, 7 and 18 (or 2, 3, 7 and 101) gives 4 containers, and no choice gives 5."
      - input: |
          5
          2 2 2 2 2
        output: |
          1
        explanation: "No container is strictly heavier than another, so only one can be loaded."
    hints:
      - "Keep an array tails, where tails[L] is the smallest weight that can end an increasing subsequence of length L + 1 seen so far."
      - "tails is automatically sorted, so you can locate where a new weight belongs with binary search instead of a linear scan."
      - "For each weight x, replace the first tail that is >= x; if there is none, append x and the answer grows by one."
    explanation: |
      **Recursion - O(2^n) time.** `f(i, prev)` = best count from container `i` onward
      when the last loaded weight is `prev`: skip it (`f(i+1, prev)`) or load it when
      `w[i] > prev` (`1 + f(i+1, w[i])`).

      **Memoization - O(n^2) time, O(n^2) space.** Index the previous choice by its
      position (shifted by one so "nothing loaded yet" fits), giving `n * (n+1)` states.

      **Tabulation - O(n^2) time, O(n) space.** The table collapses to `dp[i]` = length
      of the longest increasing subsequence **ending** at `i`, with
      `dp[i] = 1 + max(dp[j] : j < i, w[j] < w[i])`. The answer is `max(dp)`. This is the
      version to write first; it is easy to get right and easy to extend to printing the
      subsequence.

      **Binary search - O(n log n) time, O(n) space.** Maintain `tails`, where
      `tails[L]` is the smallest weight that ends any increasing subsequence of length
      `L + 1` found so far. `tails` is always sorted, because a longer subsequence
      cannot end lower than a shorter one. For each weight `x`, binary search for the
      first index with `tails[idx] >= x`: if it exists, overwrite it with `x` (a better,
      lower ending for that length); otherwise append `x`, extending the best length by
      one. The answer is `len(tails)`.

      Note that `tails` is *not* itself a valid subsequence - it only records best
      endings - so reconstructing an actual answer needs a parent pointer per element.
      For a non-decreasing variant, search for the first tail strictly greater than `x`
      instead.

      **Space optimization.** `tails` never grows beyond the answer's length, so the
      `O(n)` space is already minimal for this approach.
    starterCode:
      python: |
        import sys
        from bisect import bisect_left
        from typing import List


        def longest_increasing_subsequence(w: List[int]) -> int:
            # Return the length of the longest strictly increasing subsequence of w.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            w = [int(x) for x in data[1:1 + n]]
            print(longest_increasing_subsequence(w))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from bisect import bisect_left
        from typing import List


        def longest_increasing_subsequence(w: List[int]) -> int:
            tails: List[int] = []
            for value in w:
                position = bisect_left(tails, value)
                if position == len(tails):
                    tails.append(value)
                else:
                    tails[position] = value
            return len(tails)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            w = [int(x) for x in data[1:1 + n]]
            print(longest_increasing_subsequence(w))


        if __name__ == "__main__":
            main()
