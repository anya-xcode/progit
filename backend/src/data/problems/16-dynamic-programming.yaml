        import sys
        from typing import List


        def subset_sum_to_k(arr: List[int], k: int) -> bool:
            reachable = [False] * (k + 1)
            reachable[0] = True
            for value in arr:
                for total in range(k, value - 1, -1):
                    if reachable[total - value]:
                        reachable[total] = True
            return reachable[k]


