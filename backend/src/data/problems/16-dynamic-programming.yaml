    statement: |
      You are given an array `arr` of `n` non-negative integers and a non-negative
      integer `d`.

      Send every element to one of two labelled groups `A` and `B` (each element to
      exactly one group; either group may end up empty). Count the assignments for
      which

      ```
      sum(A) - sum(B) == d
      ```

      Because the groups are labelled, the assignment is a decision per **position**:
      two assignments are different if some index lands in a different group, even if
      the multisets of values are the same.

      The count can be astronomically large, so print it **modulo `10^9 + 7`**.
    inputFormat: |
      - Line 1: two integers `n` and `d`.
      - Line 2: `n` space-separated integers, the array `arr`.
    outputFormat: |
      Print the number of valid assignments, taken modulo `10^9 + 7`.
    constraints:
      - "1 <= n <= 100"
      - "0 <= arr[i] <= 100"
      - "0 <= d <= 10000"
    examples:
      - input: |
          4 1
          1 1 2 3
        output: |
          3
        explanation: "Total is 7, so group B must sum to (7 - 1) / 2 = 3. B can be {3}, {first 1, 2} or {second 1, 2}: 3 assignments."
      - input: |
          3 5
          1 2 3
        output: |
          0
        explanation: "Total is 6 and 6 - 5 = 1 is odd, so sum(B) would not be a whole number. No assignment works."
    hints:
      - "Write sum(A) = total - sum(B). Then sum(A) - sum(B) = d becomes total - 2 * sum(B) = d."
      - "So sum(B) must equal (total - d) / 2. If total - d is negative or odd, the answer is 0."
      - "What is left is counting subsets with a fixed target sum - the classic take / skip DP, done modulo 10^9 + 7."
    explanation: |
      **Reducing to one subset sum.** With `S = sum(arr)` and `sB = sum(B)`, the
      condition `sum(A) - sum(B) = d` is `S - 2 * sB = d`, i.e. `sB = (S - d) / 2`. If
      `S - d` is negative or odd there is no answer at all; otherwise the problem is
      exactly "how many subsets sum to `target = (S - d) / 2`", because choosing `B`
      determines `A`.

      **Recursion - O(2^n) time.** `f(i, t)` = number of subsets of the first `i`
      elements summing to `t`, with `f(0, 0) = 1`, `f(0, t > 0) = 0` and
      `f(i, t) = f(i-1, t) + f(i-1, t - arr[i-1])`.

      **Memoization - O(n * target) time and space.** Cache `(i, t)`.

      **Tabulation - O(n * target) time, O(n * target) space.** Fill `dp[i][t]` row by
      row from `dp[0][0] = 1`, reducing modulo `10^9 + 7` after every addition.

      **Space optimization - O(n * target) time, O(target) space.** Each row reads only
      the row above it, so one array is enough.

      Zeros need no special handling here either: an element `0` doubles every count,
      which is correct because a zero can go to `A` or to `B` without changing any sum.
