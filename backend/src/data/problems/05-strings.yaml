    slug: reverse-every-word-in-a-string
    title: Reverse every word in a string
    difficulty: Medium
    topic: Strings
    subtopic: Medium String Problems
    tags: [string, two pointers, parsing]
    sourceUrl: "https://leetcode.com/problems/reverse-words-in-a-string/"
    statement: |
      You are given a line of text. A **word** is a maximal run of non-space
      characters; words are separated by one or more spaces, and the line may also
      begin or end with spaces.

      Print the words in the opposite order, separated by exactly one space, with no
      space at the start or at the end. The words themselves are not altered - only
      their order is.
    inputFormat: |
      - Line 1: the string `s`. It may contain leading spaces, trailing spaces and
        several spaces between two words.
    outputFormat: |
      Print the words of `s` in reverse order, joined by single spaces.
    constraints:
      - "1 <= |s| <= 10^4"
      - "`s` consists of English letters, digits and spaces only."
      - "`s` contains at least one word."
    examples:
      - input: |
          the sky is blue
        output: |
          blue is sky the
        explanation: "The four words are read back to front. Nothing else about them changes."
      - input: |2
             a good   example  
        output: |
          example good a
        explanation: "The words are a, good and example. The leading spaces, the trailing spaces and the run of three spaces all disappear, and the output is joined with single spaces."
    hints:
      - "Splitting on a single space is not enough: consecutive spaces would produce empty pieces that must be discarded."
      - "Scan the string from right to left. When you meet a non-space character, you are at the end of a word - walk left to its start, then copy that slice to the answer."
      - "Collect the words in a list and join them once at the end; building the answer with repeated string concatenation is quadratic."
    explanation: |
      **Split, reverse, join - O(n) time, O(n) space.** Most languages have a split
      that treats any run of whitespace as one separator and drops empty pieces
      (Python's `s.split()` with no argument, for instance). Reverse the resulting
      list and join it with single spaces. This is the practical answer.

      **Right-to-left scan - O(n) time, O(n) space.** The version an interviewer
      usually wants, because it shows the parsing explicitly. Start at index `n - 1`:

      - skip spaces while moving left;
      - if the scan is finished, stop;
      - remember `end = i`, then move left while the character is not a space;
      - the word is `s[i+1 .. end]`; append it to the answer list.

      Every index is looked at once, so the pass is linear. Because the scan goes
      backwards, the words are collected in reverse order already and a single join
      finishes the job. The O(n) space is the output itself - unavoidable for
      immutable strings.

      **Reverse twice, in place - O(n) time, O(1) extra space.** In a language with a
      mutable character buffer, reverse the entire buffer, then reverse each word
      back, then squeeze the runs of spaces. This is the classic constant-space
      solution, but it is not available in Python, where strings cannot be modified.

      The edge cases are what actually break submissions here: leading spaces,
      trailing spaces, and several spaces between two words. All three must collapse
      to a single separator, and the output must have no leading or trailing space.
    starterCode:
      python: |
        import sys


        def reverse_words(s: str) -> str:
            # Return the words of s in reverse order, separated by single spaces.
            pass


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().rstrip("\n")
            print(reverse_words(s))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def reverse_words(s: str) -> str:
            words: List[str] = []
            i = len(s) - 1
            while i >= 0:
                while i >= 0 and s[i] == " ":
                    i -= 1
                if i < 0:
                    break
                end = i
                while i >= 0 and s[i] != " ":
                    i -= 1
                words.append(s[i + 1:end + 1])
            return " ".join(words)


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().rstrip("\n")
            print(reverse_words(s))


        if __name__ == "__main__":
            main()
