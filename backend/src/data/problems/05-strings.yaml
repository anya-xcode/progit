  - slug: sort-characters-by-frequency
    title: Sort Characters by Frequency
    difficulty: Easy
    topic: Strings
    subtopic: Medium Problems
    tags: [string, hashing, sorting]
    sourceUrl: ""
    statement: |
      Rearrange the characters of a string `s` so that characters occurring more
      often come first. All copies of the same character must be placed next to
      each other.

      To make the answer unique: when two different characters occur the same
      number of times, the one with the **smaller ASCII code** comes first (so
      digits come before uppercase letters, which come before lowercase letters).
    inputFormat: |
      - Line 1: the string `s`.
    outputFormat: |
      Print the rearranged string.
    constraints:
      - "1 <= |s| <= 10^5"
      - "`s` consists of English letters and digits."
    examples:
      - input: |
          banana
        output: |
          aaannb
        explanation: a occurs 3 times, n twice and b once.
      - input: |
          Aabb
        output: |
          bbAa
        explanation: b occurs twice. A and a both occur once; 'A' (code 65) is smaller than 'a' (code 97), so A comes first.
    hints:
      - Start by counting how many times each character appears.
      - "Sort the distinct characters by the key (-count, character) and write each one `count` times."
      - The number of distinct characters is at most 62, so sorting them is cheap. Bucket sort by frequency also works.
    explanation: |
      **Sort the whole string - O(n log n) time, O(n) space.** Count frequencies,
      then sort all `n` characters with key `(-freq[c], c)`. Equal characters
      share a key, so they end up adjacent.

      **Sort distinct characters - O(n + k log k) time, O(n + k) space.** Count
      with a hash map (or a 128-slot array), sort only the `k <= 62` distinct
      characters by `(-count, char)`, and build the output by repeating each one
      `count` times.

      **Bucket sort - O(n + k) time, O(n) space.** Put each character into a
      bucket indexed by its frequency, iterate the buckets from `n` down to 1 and
      emit the characters of each bucket in increasing ASCII order (sorting a
      bucket costs at most O(k log k) in total).
    starterCode:
      python: |
        import sys


        def frequency_sort(s: str) -> str:
            # Order characters by decreasing frequency; ties by smaller ASCII code first.
            pass


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(frequency_sort(s))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def frequency_sort(s: str) -> str:
            counts = {}
            for ch in s:
                counts[ch] = counts.get(ch, 0) + 1
            order = sorted(counts, key=lambda ch: (-counts[ch], ch))
            return "".join(ch * counts[ch] for ch in order)


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(frequency_sort(s))


        if __name__ == "__main__":
            main()
