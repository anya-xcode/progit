  - sheetId: prob-5-2-7-sum-of-beauty-of-all-subs
    slug: sum-of-beauty-of-all-substrings
    title: Sum of Beauty of All Substrings
    difficulty: Medium
    topic: Strings
    subtopic: Medium String Problems
    tags: [string, hashing, counting]
    sourceUrl: "https://leetcode.com/problems/sum-of-beauty-of-all-substrings/"
    statement: |
      The **beauty** of a string is the difference between the largest and the
      smallest number of times any of its characters occurs. Characters that do not
      occur in the string are ignored.

      For example the beauty of `aabcb` is `1`: the letter `a` occurs twice, `b`
      occurs twice and `c` occurs once, so the largest count is `2` and the smallest
      is `1`. The beauty of `abc` is `0`, because every letter occurs exactly once.

      Given a string `s` of lowercase English letters, compute the sum of the beauty
      of **all** of its substrings (each occurrence counted separately).
    inputFormat: |
      - Line 1: the string `s`.
    outputFormat: |
      Print one integer: the sum of the beauty over all substrings of `s`.
    constraints:
      - "1 <= |s| <= 500"
      - "`s` consists of lowercase English letters only."
    examples:
      - input: |
          aabcb
        output: |
          5
        explanation: "Five substrings have beauty 1 - aab, aabc, aabcb, abcb and bcb - and every other substring has all its letters appearing equally often, so the sum is 5."
      - input: |
          abaa
        output: |
          4
        explanation: "aba has beauty 1 (a twice, b once), baa has beauty 1, and abaa has beauty 2 (a three times, b once). The total is 4."
    hints:
      - "There are about n^2 / 2 substrings, so an answer that rebuilds a frequency table for each of them from scratch does O(n^3) work."
      - "Fix the left end of the substring and extend the right end one character at a time: the frequency table of the previous substring only needs one increment to become the table of the next one."
      - "With only 26 possible letters, the largest and smallest non-zero counts can be re-derived in 26 steps after each increment - remember to skip letters whose count is still 0 when looking for the minimum."
    explanation: |
      **Brute force - O(n^3) time, O(1) space.** Enumerate every substring, build its
      frequency table from scratch and take `max - min` over the letters present.
      Building the table dominates: about `n^2 / 2` substrings of average length `n/3`.

      **Growing window - O(n^2 x 26) time, O(1) space.** Fix the left end `i` and
      start with an empty table of 26 counters. Then extend `j` from `i` to `n - 1`,
      adding one occurrence of `s[j]` at each step - so the table for `s[i..j]` is
      built incrementally in O(1) per substring instead of O(length). After each
      increment, sweep the 26 counters once: the maximum is the largest counter, the
      minimum is the smallest counter **that is not zero** (a letter absent from the
      substring must not be treated as a count of 0). Add `max - min` to the answer.

      That is `n^2 / 2` substrings with a 26-step sweep each, which for `n = 500` is
      around 3 million elementary operations - comfortably fast. The extra space is
      one array of 26 integers, i.e. O(1).

      Two details are worth care. First, the minimum must ignore absent letters,
      otherwise every substring that does not use all 26 letters gets beauty
      `max - 0`. Second, the running total can grow large - roughly `n^3` in the worst
      case - so a 64-bit accumulator is needed outside Python.

      There is no obvious way below O(n^2): the answer sums a quantity over every
      substring, and neighbouring substrings can have unrelated beauties, so all of
      them have to be visited.
    starterCode:
      python: |
        import sys


        def sum_of_beauty(s: str) -> int:
            # Sum max(freq) - min(non-zero freq) over every substring of s.
            pass


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(sum_of_beauty(s))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def sum_of_beauty(s: str) -> int:
            n = len(s)
            total = 0
            for i in range(n):
                counts = [0] * 26
                for j in range(i, n):
                    counts[ord(s[j]) - 97] += 1
                    highest = 0
                    lowest = n + 1
                    for value in counts:
                        if value > 0:
                            if value > highest:
                                highest = value
                            if value < lowest:
                                lowest = value
                    total += highest - lowest
            return total


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(sum_of_beauty(s))


        if __name__ == "__main__":
            main()
