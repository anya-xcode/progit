      - "The brackets in `s` are correctly matched."
    examples:
      - input: |
          (4*(5+(6-2)))
        output: |
          3
        explanation: "The digits 6 and 2 are enclosed by three pairs of brackets."
      - input: |
          7+(8*9)
        output: |
          1
        explanation: 8 and 9 are inside a single pair; nothing is deeper.
    hints:
      - You do not need to know which bracket matches which - only how many are currently open.
      - "Increase a counter on `(`, decrease it on `)`, and remember the largest value it reaches."
    explanation: |
      **Stack - O(n) time, O(n) space.** Push every `(` and pop on every `)`.
      The largest stack size observed during the scan is the answer.

      **Counter - O(n) time, O(1) space.** Since the stack only contains `(`
      characters, its size is all that matters. Keep `depth`, add 1 on `(` and
      update `best = max(best, depth)`, subtract 1 on `)`, and ignore all other
      characters. The input is guaranteed to be balanced, so no validation is
      required.
    starterCode:
      python: |
        import sys


        def max_depth(s: str) -> int:
            # Return the maximum number of brackets open at the same time.
            pass


        # --- Input/output handling ---
