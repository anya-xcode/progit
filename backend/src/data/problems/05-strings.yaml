  - slug: reverse-words-in-a-string
    title: Reverse Words in a String
    difficulty: Medium
    topic: Strings
    subtopic: Easy Problems
    tags: [string, two-pointers]
    sourceUrl: https://leetcode.com/problems/reverse-words-in-a-string/
    statement: |
      A line of text contains **words** - maximal runs of non-space characters -
      separated by spaces. The line may start or end with spaces, and words may
      be separated by more than one space.

      Print the words in reverse order, separated by exactly one space, with no
      leading or trailing spaces.
    inputFormat: |
      - Line 1: the string `s` (it may contain leading, trailing and repeated spaces).
    outputFormat: |
      Print the words of `s` in reverse order, joined by single spaces.
    constraints:
      - "1 <= |s| <= 10^4"
      - "`s` consists of English letters, digits and spaces."
      - "`s` contains at least one word."
    examples:
      - input: |
          practice makes progress
        output: |
          progress makes practice
        explanation: The three words are printed last to first.
      - input: "  fast   cars drive  \n"
        output: |
          drive cars fast
        explanation: Extra spaces at the ends and between words are dropped in the output.
    hints:
      - Splitting on runs of whitespace gives you the words directly. Can you do it by hand with an index?
      - "In languages with mutable strings, a classic O(1)-extra-space trick is: reverse the whole string, then reverse each word back."
    explanation: |
      **Split and reverse - O(n) time, O(n) space.** Split the line into words
      (ignoring empty pieces caused by repeated spaces), reverse the list and
      join it with single spaces.

      **Manual scan from the right - O(n) time, O(n) space.** Walk an index from
      the end of the string: skip spaces, mark where a word ends, move left until
      a space or the start, and append `s[start:end]` to the answer. This avoids
      library splitting and produces words already in reverse order.

      **In-place double reversal - O(n) time, O(1) extra space** (for a mutable
      character array). Reverse the entire array, reverse each individual word to
      restore its spelling, then compact the array by removing extra spaces with
      a read/write pointer pair. Python strings are immutable, so in Python the
      O(n) approaches above are the natural choice.
    starterCode:
      python: |
        import sys


        def reverse_words(s: str) -> str:
            # Return the words of s in reverse order, separated by single spaces.
            pass


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().rstrip("\r\n")
            print(reverse_words(s))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def reverse_words(s: str) -> str:
            words = []
            i = len(s) - 1
            while i >= 0:
                while i >= 0 and s[i] == " ":
                    i -= 1
                if i < 0:
                    break
                end = i + 1
                while i >= 0 and s[i] != " ":
                    i -= 1
                words.append(s[i + 1:end])
            return " ".join(words)


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().rstrip("\r\n")
            print(reverse_words(s))


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          practice makes progress
        expectedOutput: |
          progress makes practice
        hidden: false
      - input: "  fast   cars drive  \n"
        expectedOutput: |
          drive cars fast
        hidden: false
      - input: |
          single
        expectedOutput: |
          single
        hidden: true
      - input: "     x     \n"
        expectedOutput: |
          x
        hidden: true
