    statement: |
      String `t` is an **anagram** of string `s` if `t` uses exactly the same
      letters as `s`, each the same number of times, possibly in a different
      order.

      Decide whether `t` is an anagram of `s`.
    inputFormat: |
      - Line 1: the string `s`.
      - Line 2: the string `t`.
    outputFormat: |
      Print `true` if `t` is an anagram of `s`, otherwise `false`.
    constraints:
      - "1 <= |s|, |t| <= 5 * 10^4"
      - "Both strings consist of lowercase English letters."
    examples:
      - input: |
          night
