      - input: |
          hello
          hollo
        output: |
          false
        explanation: '"hello" has one o and one e, while "hollo" has two o''s and no e.'
    hints:
      - If the lengths differ, the answer is immediately `false`.
      - Sorting both strings gives a simple check. Can you avoid the log factor?
      - "Only 26 letters exist: count them with an array, adding for `s` and subtracting for `t`."
    explanation: |
      **Sorting - O(n log n) time, O(n) space.** Two strings are anagrams exactly
      when their sorted character sequences are equal.

      **Hash map counting - O(n) time, O(k) space.** Count characters of `s` in a
      map, decrement for each character of `t`, and check that all counts end at
      zero.

      **Fixed-size array - O(n) time, O(1) space.** With only lowercase letters,
      an array of 26 counters indexed by `ord(c) - ord('a')` replaces the map.
      Check lengths first; then any negative count while processing `t` proves
      the strings are not anagrams.
    starterCode:
      python: |
        import sys


        def is_anagram(s: str, t: str) -> bool:
            # Return True if t is a rearrangement of the letters of s.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s, t = data[0], data[1]
            print("true" if is_anagram(s, t) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def is_anagram(s: str, t: str) -> bool:
            if len(s) != len(t):
                return False
            counts = [0] * 26
            for ch in s:
                counts[ord(ch) - 97] += 1
            for ch in t:
                index = ord(ch) - 97
                counts[index] -= 1
                if counts[index] < 0:
                    return False
            return True


