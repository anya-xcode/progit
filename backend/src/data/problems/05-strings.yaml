  - slug: string-to-integer-atoi
    title: String to Integer (atoi)
    difficulty: Medium
    topic: Strings
    subtopic: Medium Problems
    tags: [string, parsing]
    sourceUrl: https://leetcode.com/problems/string-to-integer-atoi/
    statement: |
      Implement a function that reads a 32-bit signed integer from the start of a
      line of text, following these steps in order:

      1. **Skip spaces.** Ignore any leading space characters.
      2. **Sign.** If the next character is `+` or `-`, consume it; it decides
         the sign. At most one sign character is read. Without a sign the number
         is positive.
      3. **Digits.** Read consecutive digits until a non-digit character or the
         end of the line. Leading zeros are allowed. Everything after the digits
         is ignored. If no digit was read, the result is `0`.
      4. **Clamp.** If the value lies outside `[-2^31, 2^31 - 1]`, replace it by
         the nearest bound: `-2147483648` or `2147483647`.
    inputFormat: |
      - Line 1: the text `s` (it may be empty and may contain spaces).
    outputFormat: |
      Print the parsed integer.
    constraints:
      - "0 <= |s| <= 200"
      - "`s` consists of English letters, digits, spaces, `+`, `-` and `.`."
    examples:
      - input: "   -0032abc\n"
        output: |
          -32
        explanation: "Spaces are skipped, '-' makes the number negative, the digits 0032 give 32, and parsing stops at 'a'."
      - input: |
          words 987
        output: |
          0
        explanation: The first non-space character 'w' is neither a sign nor a digit, so no digits are read.
    hints:
      - Use an index that moves forward through the string, handling each step of the rules in turn.
      - "Build the value with `value = value * 10 + digit`."
      - In languages with fixed-width integers you must detect overflow before it happens; you can stop reading as soon as the value exceeds the limit.
    explanation: |
      **Direct simulation - O(n) time, O(1) space.** Keep an index `i`.
      Advance it past spaces. If `s[i]` is `+` or `-`, record the sign and
      advance once. Then, while `s[i]` is a digit, update
      `value = value * 10 + digit`. Finally apply the sign and clamp to the
      32-bit range.

      **Early overflow check.** In languages with 32-bit or 64-bit integers,
      accumulating a 200-digit number overflows. Before each update check whether
      `value > (LIMIT - digit) // 10`; if so, return the clamped bound
      immediately. Stopping as soon as the value passes `2^31` also keeps the
      Python version fast and bounded.

      A regular expression such as `^\s*([+-]?\d+)` can express steps 1-3, but
      the manual scan is clearer about the edge cases (`+-12`, an empty line, a
      lone sign).
    starterCode:
      python: |
        import sys


        def my_atoi(s: str) -> int:
            # Parse a clamped 32-bit signed integer from the start of s.
            pass


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().rstrip("\r\n")
            print(my_atoi(s))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def my_atoi(s: str) -> int:
            int_max = 2**31 - 1
            int_min = -(2**31)
            i, n = 0, len(s)
            while i < n and s[i] == " ":
                i += 1
            sign = 1
            if i < n and s[i] in "+-":
                if s[i] == "-":
                    sign = -1
                i += 1
            value = 0
            while i < n and "0" <= s[i] <= "9":
                value = value * 10 + (ord(s[i]) - 48)
                if value > int_max:
                    return int_max if sign == 1 else int_min
                i += 1
            return sign * value


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().rstrip("\r\n")
            print(my_atoi(s))


        if __name__ == "__main__":
            main()
    testCases:
      - input: "   -0032abc\n"
        expectedOutput: |
          -32
        hidden: false
      - input: |
          words 987
        expectedOutput: |
          0
        hidden: false
      - input: |
          +1
        expectedOutput: |
          1
        hidden: true
      - input: |
          +-12
        expectedOutput: |
          0
        hidden: true
      - input: |
          2147483648
        expectedOutput: |
          2147483647
        hidden: true
