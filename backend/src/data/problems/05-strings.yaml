  - slug: remove-outermost-parentheses
    title: Remove Outermost Parentheses
    difficulty: Medium
    topic: Strings
    subtopic: Easy Problems
    tags: [string, stack, parentheses]
    sourceUrl: https://leetcode.com/problems/remove-outermost-parentheses/
    statement: |
      A string made of `(` and `)` is **balanced** if every opening bracket is
      closed later and no prefix has more `)` than `(`.

      Any non-empty balanced string can be cut uniquely into consecutive
      **blocks**: balanced pieces that cannot themselves be split into two
      non-empty balanced parts. For example `(())()(()())` has the blocks
      `(())`, `()` and `(()())`.

      Given a balanced string `s`, delete the first and the last character of
      every block and print what remains.
    inputFormat: |
      - Line 1: the string `s`.
    outputFormat: |
      Print the resulting string. If nothing remains, print an empty line.
    constraints:
      - "2 <= |s| <= 10^5"
      - "`s` contains only `(` and `)` and is balanced."
    examples:
      - input: |
          (()())()
        output: |
          ()()
        explanation: "The blocks are (()()) and (). Stripping their outer brackets leaves ()() and an empty string."
      - input: |
          (())()((()))
        output: |
          ()(())
        explanation: "Blocks (()), () and ((())) become (), nothing and (()). Concatenated: ()(())."
    hints:
      - Track the current nesting depth while scanning left to right.
      - "An opening bracket seen at depth 0 starts a block; a closing bracket that brings the depth back to 0 ends it."
      - Keep a character only if it is not one of those two boundary brackets.
    explanation: |
      **Explicit decomposition - O(n) time, O(n) space.** Scan with a counter,
      record the start index of each block when the counter leaves 0 and the end
      index when it returns to 0, then append `s[start+1:end]` for every block.

      **Stack - O(n) time, O(n) space.** Push on `(` and pop on `)`. A `(` pushed
      onto an empty stack, or a `)` that empties the stack, is an outer bracket
      and is skipped; every other character is copied to the answer.

      **Depth counter - O(n) time, O(n) space for the output (O(1) extra).** The
      stack only ever holds `(`, so its size is all we need. For `(`: append it if
      `depth > 0`, then increment. For `)`: decrement first, then append it if
      `depth > 0`. Build the answer in a list and join once to avoid quadratic
      string concatenation.
    starterCode:
      python: |
        import sys


        def remove_outer_parentheses(s: str) -> str:
            # Remove the outermost pair of brackets of every block in s.
            pass


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(remove_outer_parentheses(s))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def remove_outer_parentheses(s: str) -> str:
            result = []
            depth = 0
            for ch in s:
                if ch == "(":
                    if depth > 0:
                        result.append(ch)
                    depth += 1
                else:
                    depth -= 1
                    if depth > 0:
                        result.append(ch)
            return "".join(result)


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(remove_outer_parentheses(s))


        if __name__ == "__main__":
            main()
    testCases:
