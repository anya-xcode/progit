        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def rotate_string(s: str, goal: str) -> bool:
            if len(s) != len(goal):
                return False
            text = s + s
            pattern = goal
            # KMP failure function
            fail = [0] * len(pattern)
            k = 0
            for i in range(1, len(pattern)):
                while k > 0 and pattern[i] != pattern[k]:
                    k = fail[k - 1]
                if pattern[i] == pattern[k]:
                    k += 1
                fail[i] = k
            k = 0
            for ch in text:
                while k > 0 and ch != pattern[k]:
                    k = fail[k - 1]
                if ch == pattern[k]:
                    k += 1
                if k == len(pattern):
                    return True
            return False


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s, goal = data[0], data[1]
            print("true" if rotate_string(s, goal) else "false")


        if __name__ == "__main__":
            main()
