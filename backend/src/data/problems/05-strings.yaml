        expectedOutput: |
          Alice Loves Bob
        hidden: true
      - input: |
          Hello World HELLO world
        expectedOutput: |
          world HELLO World Hello
        hidden: true

  - slug: largest-odd-number-in-string
    title: Largest Odd Number in String
    difficulty: Easy
    topic: Strings
    subtopic: Easy Problems
    tags: [string, greedy]
    sourceUrl: https://leetcode.com/problems/largest-odd-number-in-string/
    statement: |
      You are given a string `num` of decimal digits representing a large
      non-negative integer (it has no leading zeros).

      Among all non-empty **contiguous substrings** of `num` whose value is an
      odd integer, find the one with the largest value and print it exactly as
      it appears in `num`. If no substring is odd, print an empty line.
    inputFormat: |
      - Line 1: the digit string `num`.
    outputFormat: |
      Print the largest odd-valued substring, or an empty line if none exists.
    constraints:
      - "1 <= |num| <= 10^5"
      - "`num` contains only digits and has no leading zeros."
    examples:
      - input: |
          6178
        output: |
          617
        explanation: "The odd-valued substrings are 1, 7, 17, 61 and 617 (anything ending in 8 or 6 is even). The largest is 617."
      - input: |
          4206
        output: ""
        explanation: Every digit is even, so every substring ends in an even digit and no odd value exists.
    hints:
      - A number is odd exactly when its last digit is odd.
      - Among substrings without leading zeros, a longer one always has a larger value. Which odd substring is the longest?
      - Find the rightmost odd digit; the answer is the prefix ending there.
    explanation: |
      **Brute force - O(n^3) time.** Enumerate every substring, check its last
      digit and compare values (comparing big numbers as strings costs O(n)).
      Far too slow.

      **Better - O(n^2) time.** Only substrings ending at an odd digit matter,
      and for a fixed end the longest one (starting at index 0) is the largest,
      because `num` has no leading zeros. That leaves at most `n` candidates to
      compare.

      **Optimal - O(n) time, O(1) extra space.** The candidate prefixes are
      nested, so the longest one wins: scan from the right for the last odd digit
      at index `i` and output `num[0..i]`. If there is no odd digit, output an
      empty string.
    starterCode:
      python: |
        import sys


        def largest_odd_number(num: str) -> str:
            # Return the largest odd-valued substring of num, or "" if none exists.
            pass


        # --- Input/output handling ---
        def main():
            num = sys.stdin.readline().strip()
            print(largest_odd_number(num))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def largest_odd_number(num: str) -> str:
            for i in range(len(num) - 1, -1, -1):
                if (ord(num[i]) - ord("0")) % 2 == 1:
                    return num[:i + 1]
            return ""


        # --- Input/output handling ---
        def main():
            num = sys.stdin.readline().strip()
            print(largest_odd_number(num))


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          6178
        expectedOutput: |
          617
        hidden: false
      - input: |
          4206
        expectedOutput: ""
        hidden: false
      - input: |
          7
        expectedOutput: |
          7
        hidden: true
      - input: |
          0
        expectedOutput: ""
        hidden: true
      - input: |
          35427
        expectedOutput: |
          35427
        hidden: true
      - input: |
          10
        expectedOutput: |
          1
        hidden: true
      - input: |
          8000000003000
        expectedOutput: |
          8000000003
        hidden: true
      - input: |
          24682468246824682468
        expectedOutput: ""
        hidden: true

  - slug: longest-common-prefix
    title: Longest Common Prefix
    difficulty: Easy
    topic: Strings
    subtopic: Easy Problems
    tags: [string, sorting]
    sourceUrl: https://leetcode.com/problems/longest-common-prefix/
    statement: |
      Given `n` lowercase words, find the longest string that is a prefix of
      **every** word. If the words do not share even their first letter, the
      answer is the empty string.
    inputFormat: |
      - Line 1: an integer `n`.
      - Next `n` lines: one word per line.
    outputFormat: |
      Print the longest common prefix, or an empty line if it is empty.
    constraints:
      - "1 <= n <= 200"
      - "1 <= length of each word <= 200"
      - "Words contain only lowercase English letters."
    examples:
      - input: |
          3
          planet
          plane
          plan
        output: |
          plan
        explanation: '"plan" starts all three words, but "plane" is not a prefix of "plan".'
      - input: |
          3
          sun
          moon
          star
        output: ""
        explanation: The first letters s, m and s already differ, so nothing is shared.
    hints:
      - Compare the words column by column, starting from the first character.
      - Stop at the first column where some word ends or has a different character.
      - "Alternative: after sorting, only the first and last words need to be compared."
    explanation: |
      **Horizontal scanning - O(S) time, O(1) extra space**, where `S` is the
      total number of characters. Start with the first word as the prefix and
      shorten it until it is a prefix of the second word, then the third, and so
      on.

      **Vertical scanning - O(S) time, O(1) extra space.** For column
      `i = 0, 1, ...`, check that every word has length greater than `i` and the
      same character as the first word at `i`. The first failure gives the answer
      `words[0][:i]`. This stops early as soon as a mismatch appears.

      **Sort - O(S log n) time.** After lexicographic sorting, the common prefix
      of all words equals the common prefix of the first and last words, since
      every word in between is sandwiched between them.
    starterCode:
      python: |
        import sys
        from typing import List


        def longest_common_prefix(words: List[str]) -> str:
            # Return the longest prefix shared by every word.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            words = data[1:1 + n]
            print(longest_common_prefix(words))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def longest_common_prefix(words: List[str]) -> str:
            first = words[0]
            for i, ch in enumerate(first):
                for word in words[1:]:
                    if i >= len(word) or word[i] != ch:
                        return first[:i]
            return first


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            words = data[1:1 + n]
            print(longest_common_prefix(words))


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          3
          planet
          plane
          plan
        expectedOutput: |
          plan
        hidden: false
      - input: |
          3
          sun
          moon
          star
        expectedOutput: ""
        hidden: false
      - input: |
          1
          alone
        expectedOutput: |
          alone
        hidden: true
      - input: |
          3
          abc
          abc
          abc
        expectedOutput: |
          abc
        hidden: true
      - input: |
          2
          ab
          a
        expectedOutput: |
          a
        hidden: true
      - input: |
          4
          interview
          internet
          interval
          internal
        expectedOutput: |
          inter
        hidden: true
      - input: |
          2
          zebra
          zoo
        expectedOutput: |
          z
        hidden: true
      - input: |
          3
          abc
          abd
          xbc
        expectedOutput: ""
        hidden: true

  - slug: isomorphic-strings
    title: Isomorphic Strings
    difficulty: Easy
    topic: Strings
    subtopic: Easy Problems
    tags: [string, hashing]
    sourceUrl: https://leetcode.com/problems/isomorphic-strings/
    statement: |
      Two strings `s` and `t` of equal length are **isomorphic** if you can
      rename the characters of `s` to obtain `t`, where:

      - every occurrence of a character is renamed to the same character,
      - two different characters are never renamed to the same character,
      - a character may be renamed to itself.

      Decide whether `s` and `t` are isomorphic.
    inputFormat: |
      - Line 1: the string `s`.
      - Line 2: the string `t`.
    outputFormat: |
      Print `true` if the strings are isomorphic, otherwise `false`.
    constraints:
      - "1 <= |s| = |t| <= 5 * 10^4"
      - "Both strings consist of printable ASCII characters without spaces."
    examples:
      - input: |
          letter
          bottom
        output: |
          true
        explanation: "Rename l->b, e->o, t->t, r->m. Every character has one image and no two share an image."
      - input: |
          moon
          noon
        output: |
          false
        explanation: "m must become n and n must also become n, but two different characters cannot map to the same one."
    hints:
      - "One map from characters of `s` to characters of `t` is not enough: `ab` -> `aa` would pass."
      - Maintain the mapping in both directions and check both on every position.
      - "Equivalently, the strings are isomorphic exactly when, at each index, the position where `s[i]` first appeared equals the position where `t[i]` first appeared."
    explanation: |
      **Brute force - O(n^2) time, O(1) space.** For every pair of indices
      `(i, j)`, require `s[i] == s[j]` exactly when `t[i] == t[j]`.

      **Two hash maps - O(n) time, O(k) space** (`k` = alphabet size). Scan
      once, keeping `s_to_t` and `t_to_s`. At index `i`, if `s[i]` is already
      mapped to something other than `t[i]`, or `t[i]` is already mapped from
      something other than `s[i]`, answer `false`; otherwise record both
      directions.

      **First-occurrence signature - O(n) time, O(k) space.** Replace every
      character by the index of its first occurrence in its own string. The two
      strings are isomorphic if and only if these signatures are identical.
    starterCode:
      python: |
        import sys


        def is_isomorphic(s: str, t: str) -> bool:
            # Return True if s can be turned into t by a one-to-one character renaming.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s, t = data[0], data[1]
            print("true" if is_isomorphic(s, t) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def is_isomorphic(s: str, t: str) -> bool:
            if len(s) != len(t):
                return False
            s_to_t = {}
            t_to_s = {}
            for a, b in zip(s, t):
                if s_to_t.get(a, b) != b or t_to_s.get(b, a) != a:
                    return False
                s_to_t[a] = b
                t_to_s[b] = a
            return True


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s, t = data[0], data[1]
            print("true" if is_isomorphic(s, t) else "false")


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          letter
          bottom
        expectedOutput: |
          true
        hidden: false
      - input: |
          moon
          noon
        expectedOutput: |
          false
        hidden: false
      - input: |
          a
          b
        expectedOutput: |
          true
        hidden: true
      - input: |
          ab
          aa
        expectedOutput: |
          false
        hidden: true
      - input: |
          aa
          ab
        expectedOutput: |
          false
        hidden: true
      - input: |
          abcdefghij
          jihgfedcba
        expectedOutput: |
          true
        hidden: true
      - input: |
          badc
          baba
        expectedOutput: |
          false
        hidden: true
      - input: |
          13!3
          4#?#
        expectedOutput: |
          true
        hidden: true

  - slug: rotate-string
    title: Rotate String
    difficulty: Easy
    topic: Strings
    subtopic: Easy Problems
    tags: [string, string-matching]
    sourceUrl: https://leetcode.com/problems/rotate-string/
    statement: |
      A **shift** takes the first character of a string and moves it to the end
      (one shift turns `abcd` into `bcda`).

      Given strings `s` and `goal`, decide whether `s` can become `goal` after
      some number of shifts (zero shifts are allowed).
    inputFormat: |
      - Line 1: the string `s`.
      - Line 2: the string `goal`.
    outputFormat: |
      Print `true` if `goal` is a rotation of `s`, otherwise `false`.
    constraints:
      - "1 <= |s|, |goal| <= 2000"
      - "Both strings consist of lowercase English letters."
    examples:
      - input: |
          coding
          ingcod
        output: |
          true
        explanation: "Three shifts: coding -> odingc -> dingco -> ingcod."
      - input: |
          coding
          codgni
        output: |
          false
        explanation: No number of shifts changes the cyclic order of the letters, and "codgni" has g before n.
    hints:
      - Strings of different lengths can never match.
      - "Brute force: try every possible shift amount `k` and compare `s[k:] + s[:k]` with `goal`."
      - Every rotation of `s` appears as a substring of `s + s`.
    explanation: |
      **Try every rotation - O(n^2) time, O(n) space.** For each `k` in
      `0..n-1`, build `s[k:] + s[:k]` and compare it with `goal`.

      **Doubling - O(n) to O(n^2) time depending on the search, O(n) space.** If
      the lengths match, `goal` is a rotation of `s` exactly when `goal` occurs
      inside `s + s`, because `s + s` contains every rotation as a length-`n`
      window. The cost depends on the substring search used.

      **Doubling + linear matching - O(n) time, O(n) space.** Search for `goal`
      in `s + s` with KMP (or the Z-algorithm) to get a guaranteed linear bound.
    starterCode:
      python: |
        import sys


        def rotate_string(s: str, goal: str) -> bool:
            # Return True if some number of left shifts turns s into goal.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
