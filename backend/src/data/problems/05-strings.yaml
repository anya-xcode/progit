        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def max_depth(s: str) -> int:
            depth = 0
            best = 0
            for ch in s:
                if ch == "(":
                    depth += 1
                    best = max(best, depth)
                elif ch == ")":
                    depth -= 1
            return best


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(max_depth(s))


        if __name__ == "__main__":
            main()
