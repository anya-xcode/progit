    slug: count-number-of-substrings
    title: Count Number of Substrings
    difficulty: Easy
    topic: Strings
    subtopic: Medium String Problems
    tags: [string, sliding window, hashing]
    sourceUrl: ""
    statement: |
      A **substring** is a contiguous stretch of a string. The string `abc` has six
      non-empty substrings: `a`, `b`, `c`, `ab`, `bc` and `abc`. Two substrings that
      happen to be equal but start at different positions are counted separately.

      You are given a string `s` of lowercase English letters and an integer `k`.
      Count the substrings of `s` that contain **exactly `k` distinct** characters.

      A string of length `n` has `n(n+1)/2` substrings, which is far too many to
      inspect one by one for the given limit, so the counting has to be done with a
      sliding window.
    inputFormat: |
      - Line 1: the string `s`.
      - Line 2: a single integer `k`.
    outputFormat: |
      Print one integer: the number of substrings of `s` with exactly `k` distinct
      characters.
    constraints:
      - "1 <= |s| <= 10^4"
      - "1 <= k <= 26"
      - "`s` consists of lowercase English letters only."
    examples:
      - input: |
          aabc
          2
        output: |
          3
        explanation: "Three substrings use exactly two distinct letters: aab (positions 1-3), ab (positions 2-3) and bc (positions 3-4). The substrings a, aa, b and c use one letter, and abc and aabc use three."
      - input: |
          aaaa
          1
        output: |
          10
        explanation: "Every one of the 4 x 5 / 2 = 10 substrings consists only of the letter a, so all of them have exactly one distinct character."
    hints:
      - "Counting substrings with *at most* k distinct characters is much easier than counting those with exactly k: a window can always be shrunk from the left until the condition holds again."
      - "exactly(k) = atMost(k) - atMost(k - 1), because every substring with at most k distinct characters either has exactly k or has at most k - 1."
      - "For atMost(limit): extend the right end one character at a time, shrink from the left while the window holds more than `limit` distinct characters, and add (right - left + 1) - the number of windows that end at `right` - to the answer."
    explanation: |
      **Brute force - O(n^2) time (O(n^2 x 26) if written carelessly), O(1) space.**
      Fix the left end and extend the right end, maintaining a 26-slot frequency table
      and a running count of distinct letters; add one to the answer whenever that
      count equals `k`, and stop early once it exceeds `k`. Correct, but quadratic.

      **Sliding window - O(n) time, O(1) space.** The trick is to solve an easier
      problem twice. Define `atMost(limit)` as the number of substrings that contain
      **at most** `limit` distinct characters, and observe:

      ```
      exactly(k) = atMost(k) - atMost(k - 1)
      ```

      `atMost` is easy with a window because the property is *monotone*: if a window
      has at most `limit` distinct characters, so does every window inside it. Move
      `right` forward one step at a time, adding `s[right]` to the frequency table;
      while the window holds more than `limit` distinct characters, drop `s[left]` and
      move `left` forward. After the shrinking, `[left..right]` is the longest valid
      window ending at `right`, and every one of its suffixes
      (`[left..right]`, `[left+1..right]`, ..., `[right..right]`) is valid too, so add
      `right - left + 1` to the total.

      Each index enters and leaves the window at most once, so every call to `atMost`
      is O(n) and the whole answer is O(n) with an O(26) = O(1) table. Use 64-bit
      arithmetic in languages that need it: for `n = 10^4` the count can reach about
      `5 x 10^7`, and for larger limits it easily exceeds a 32-bit integer.
    starterCode:
      python: |
        import sys


        def count_substrings_with_k_distinct(s: str, k: int) -> int:
            # Count the substrings of s that hold exactly k distinct characters.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s = data[0]
            k = int(data[1])
            print(count_substrings_with_k_distinct(s, k))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def count_substrings_with_k_distinct(s: str, k: int) -> int:
            def at_most(limit: int) -> int:
                if limit <= 0:
                    return 0
                counts = [0] * 26
                distinct = 0
                left = 0
                total = 0
                for right in range(len(s)):
                    index = ord(s[right]) - 97
                    if counts[index] == 0:
                        distinct += 1
                    counts[index] += 1
                    while distinct > limit:
                        out = ord(s[left]) - 97
                        counts[out] -= 1
                        if counts[out] == 0:
                            distinct -= 1
                        left += 1
                    total += right - left + 1
                return total

            return at_most(k) - at_most(k - 1)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s = data[0]
            k = int(data[1])
            print(count_substrings_with_k_distinct(s, k))


        if __name__ == "__main__":
            main()
