          (()())()
        expectedOutput: |
          ()()
        hidden: false
      - input: |
          (())()((()))
        expectedOutput: |
          ()(())
        hidden: false
      - input: |
          ()
        expectedOutput: ""
        hidden: true
      - input: |
          ()()()()
        expectedOutput: ""
        hidden: true
      - input: |
          ((()))
