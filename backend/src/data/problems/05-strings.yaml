  - slug: roman-to-integer
    title: Roman to Integer
    difficulty: Medium
    topic: Strings
    subtopic: Medium Problems
    tags: [string, hashing, math]
    sourceUrl: https://leetcode.com/problems/roman-to-integer/
    statement: |
      Roman numerals use seven symbols:

      | Symbol | I | V | X | L | C | D | M |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | Value | 1 | 5 | 10 | 50 | 100 | 500 | 1000 |

      Symbols are normally written from largest to smallest and their values are
      added (`XVI = 10 + 5 + 1 = 16`). Six special pairs place a smaller symbol
      before a larger one to mean subtraction: `IV = 4`, `IX = 9`, `XL = 40`,
      `XC = 90`, `CD = 400`, `CM = 900`.

      Given a valid Roman numeral, print its integer value.
    inputFormat: |
      - Line 1: the Roman numeral `s`.
    outputFormat: |
      Print the integer value of `s`.
    constraints:
      - "1 <= |s| <= 15"
      - "`s` is a valid Roman numeral for a value between 1 and 3999."
    examples:
      - input: |
          XLII
        output: |
          42
        explanation: XL = 40 (X before L means subtract), then I + I = 2. Total 42.
      - input: |
          MCDLXXVI
        output: |
          1476
        explanation: M = 1000, CD = 400, L = 50, XX = 20, VI = 6. Total 1476.
    hints:
      - Map each symbol to its value.
      - A symbol is subtracted exactly when the symbol right after it has a larger value.
    explanation: |
      **Match the two-letter pairs first - O(n) time, O(1) space.** Walk through
      the string; if the next two characters form one of the six special pairs,
      add that pair's value and skip two positions, otherwise add the single
      symbol's value.

      **Compare with the next symbol - O(n) time, O(1) space.** For each index
      `i`, if `value(s[i]) < value(s[i+1])` subtract `value(s[i])`, otherwise add
      it. This handles all six pairs with one rule and no special cases. Scanning
      right to left and subtracting whenever the current value is smaller than
      the previous one is an equivalent formulation.
    starterCode:
      python: |
        import sys


        def roman_to_int(s: str) -> int:
            # Return the integer value of the Roman numeral s.
            pass


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(roman_to_int(s))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def roman_to_int(s: str) -> int:
            values = {"I": 1, "V": 5, "X": 10, "L": 50, "C": 100, "D": 500, "M": 1000}
            total = 0
            for i, ch in enumerate(s):
                value = values[ch]
                if i + 1 < len(s) and value < values[s[i + 1]]:
                    total -= value
                else:
                    total += value
            return total


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print(roman_to_int(s))


        if __name__ == "__main__":
            main()
