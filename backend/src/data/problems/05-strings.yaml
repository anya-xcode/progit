    sourceUrl: ""
    statement: |
      A **palindrome** reads the same forwards and backwards. Given a string `s`,
      find its longest contiguous substring that is a palindrome.

      If several palindromic substrings share the maximum length, print the
      **leftmost** one (the one with the smallest starting index).
    inputFormat: |
      - Line 1: the string `s`.
    outputFormat: |
      Print the longest palindromic substring (leftmost on ties).
    constraints:
      - "1 <= |s| <= 1000"
      - "`s` consists of lowercase English letters and digits."
    examples:
      - input: |
          banana
        output: |
          anana
        explanation: '"anana" (indices 1..5) is a palindrome of length 5, and "banana" itself is not a palindrome.'
      - input: |
          abcd
        output: |
          a
        explanation: No two adjacent or mirrored letters match, so the longest palindromes have length 1. The leftmost is "a".
    hints:
      - "Brute force: check every substring - O(n^3). Where is the repeated work?"
      - Every palindrome has a center, either a character (odd length) or a gap between two characters (even length).
      - "Expand outward from each of the `2n - 1` centers while the characters match. Only replace the best answer when you find something strictly longer, scanning centers left to right."
    explanation: |
      **Brute force - O(n^3) time, O(1) space.** Enumerate all O(n^2) substrings
      and test each for being a palindrome in O(n). Keep the first one of maximum
      length.

      **Dynamic programming - O(n^2) time, O(n^2) space.** `pal[i][j]` is true
      when `s[i] == s[j]` and either `j - i < 2` or `pal[i+1][j-1]` is true. Fill
      the table by increasing length and track the longest range, preferring the
      smaller start on ties.

      **Expand around centers - O(n^2) time, O(1) space.** For each center
      (character `i`, then gap `i, i+1`), expand while the ends match to get the
      longest palindrome at that center. Centers are visited from left to right,
      and a leftmost maximum-length palindrome has an earlier center than any
      other of the same length, so updating only on a strictly longer result
      yields the leftmost answer.

      **Manacher's algorithm - O(n) time, O(n) space** reuses mirror information
      between centers; it is optional for these limits.
