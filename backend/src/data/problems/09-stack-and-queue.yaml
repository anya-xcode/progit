    referenceSolution:
      python: |
        import sys
        from typing import List


        def find_celebrity(knows: List[List[int]]) -> int:
            n = len(knows)
            top, bottom = 0, n - 1
            while top < bottom:
                if knows[top][bottom] == 1:
                    top += 1
                else:
                    bottom -= 1
            candidate = top
            for j in range(n):
                if j == candidate:
                    continue
                if knows[candidate][j] == 1 or knows[j][candidate] == 0:
                    return -1
            return candidate


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            n = int(data[0])
            values = [int(x) for x in data[1:1 + n * n]]
            knows = [values[r * n:(r + 1) * n] for r in range(n)]
            print(find_celebrity(knows))


        if __name__ == "__main__":
            main()
