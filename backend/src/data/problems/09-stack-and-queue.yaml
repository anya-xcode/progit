  - slug: largest-rectangle-in-histogram
    title: "Largest Rectangle in Histogram"
    difficulty: Hard
    topic: "Stack and Queue"
    subtopic: "Monotonic Stack"
    tags: ["stack", "monotonic-stack", "array"]
    sourceUrl: "https://leetcode.com/problems/largest-rectangle-in-histogram/"
    statement: |
      A histogram consists of `n` adjacent bars of width 1 with heights
      `heights[0..n-1]`. Find the area of the largest axis-aligned rectangle that fits
      entirely inside the histogram.

      A rectangle covering the consecutive bars `i..j` can be at most as tall as the
      shortest bar in that range, so its best area is
      `min(heights[i..j]) * (j - i + 1)`.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the bar heights.
    outputFormat: |
      Print a single integer: the maximum rectangle area.
    constraints:
      - "1 <= n <= 10^4"
      - "0 <= heights[i] <= 10^4"
    examples:
      - input: |
          6
          2 4 5 1 3 3
