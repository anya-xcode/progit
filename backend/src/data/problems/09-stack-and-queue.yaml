    referenceSolution:
      python: |
        import sys
        from typing import List


        class ArrayStack:
            def __init__(self) -> None:
                self.data: List[int] = []
                self.top_index = -1

            def push(self, x: int) -> None:
                self.top_index += 1
                if self.top_index == len(self.data):
                    self.data.append(x)
                else:
                    self.data[self.top_index] = x

            def pop(self) -> int:
                if self.top_index < 0:
                    return -1
                value = self.data[self.top_index]
                self.top_index -= 1
                return value

            def top(self) -> int:
                if self.top_index < 0:
                    return -1
                return self.data[self.top_index]

            def size(self) -> int:
                return self.top_index + 1

            def is_empty(self) -> bool:
                return self.top_index < 0


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            q = int(lines[0].split()[0])
            stack = ArrayStack()
            out = []
            for line in lines[1:1 + q]:
                parts = line.split()
                if not parts:
                    continue
                if parts[0] == "push":
                    stack.push(int(parts[1]))
                elif parts[0] == "pop":
