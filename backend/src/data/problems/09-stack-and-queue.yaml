section: stack-and-queue
problems:
  - slug: valid-parentheses
    title: "Valid Parentheses"
    difficulty: Easy
    topic: "Stack and Queue"
    subtopic: "Learning"
    tags: ["stack", "strings"]
    sourceUrl: "https://leetcode.com/problems/valid-parentheses/"
    statement: |
      You are given a string `s` made only of the bracket characters `(`, `)`, `[`,
      `]`, `{` and `}`. Decide whether the brackets are **properly matched**:

      - every opening bracket is closed by a bracket of the **same type**,
      - brackets are closed in the reverse order in which they were opened (so
        `([)]` is not valid), and
      - every closing bracket has a matching opening bracket before it.
    inputFormat: |
      - Line 1: the string `s`.
    outputFormat: |
      Print `true` if `s` is properly matched, otherwise `false`.
    constraints:
      - "1 <= length of s <= 10^4"
      - "`s` contains only the characters `()[]{}`."
    examples:
      - input: |
          {[()()]}
        output: |
          true
        explanation: "The innermost pairs () () close first, then [ ], then { }."
      - input: |
          ([)]
        output: |
          false
        explanation: "The ( is still open when ] arrives, so the closing order is wrong."
    hints:
      - "Repeatedly deleting adjacent matching pairs like `()` works but can take quadratic time."
      - "The most recently opened bracket must be the first one to close. Which data structure gives you the most recent item?"
      - "Push opening brackets on a stack. For a closing bracket, the top of the stack must be its partner. At the end the stack must be empty."
    explanation: |
      **Remove pairs repeatedly - O(n^2) time, O(n) space.** While the string contains
      `()`, `[]` or `{}`, delete those substrings. The string was valid iff it becomes
      empty.

      **Stack - O(n) time, O(n) space.** Scan left to right. Push each opening bracket.
      On a closing bracket, the stack must be non-empty and its top must be the
      matching opener; pop it, otherwise answer `false`. After the scan the stack must
      be empty (no unclosed openers). A quick early exit: an odd-length string can
      never be valid.
    starterCode:
      python: |
        import sys


        def is_valid(s: str) -> bool:
            # Return True if every bracket is closed by the same type in the right order.
            pass


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print("true" if is_valid(s) else "false")


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def is_valid(s: str) -> bool:
            partner = {")": "(", "]": "[", "}": "{"}
            stack = []
            for ch in s:
                if ch in partner:
                    if not stack or stack[-1] != partner[ch]:
                        return False
                    stack.pop()
                else:
                    stack.append(ch)
            return not stack


        # --- Input/output handling ---
        def main():
            s = sys.stdin.readline().strip()
            print("true" if is_valid(s) else "false")


        if __name__ == "__main__":
            main()
