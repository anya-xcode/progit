  - slug: sliding-window-maximum
    title: "Sliding Window Maximum"
    difficulty: Hard
    topic: "Stack and Queue"
    subtopic: "Implementation"
    tags: ["queue", "monotonic-queue", "sliding-window"]
    sourceUrl: "https://leetcode.com/problems/sliding-window-maximum/"
    statement: |
      You are given an integer array `nums` and a window size `k`. A window of `k`
      consecutive elements starts at index `0` and slides one position to the right at
      a time until its right edge reaches the last element, giving `n - k + 1` windows.

      Report the maximum value inside each window, in order.
    inputFormat: |
      - Line 1: two integers `n` and `k`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print `n - k + 1` integers separated by spaces: the maximum of each window from
      left to right.
    constraints:
      - "1 <= k <= n <= 2 * 10^4"
      - "-10^4 <= nums[i] <= 10^4"
    examples:
      - input: |
          8 3
          1 3 -1 -3 5 3 6 7
        output: |
          3 3 5 5 6 7
        explanation: "The windows are [1 3 -1], [3 -1 -3], [-1 -3 5], [-3 5 3], [5 3 6], [3 6 7]."
      - input: |
          4 1
          9 -2 4 4
        output: |
          9 -2 4 4
        explanation: "With k = 1 every window holds a single element."
    hints:
      - "Taking max() of every window costs O(k) per window, so O(n * k) overall."
      - "If a newer element is at least as large as an older element in the window, the older one can never be a maximum again."
      - "Keep a deque of indices whose values are decreasing. Pop smaller values from the back before adding, and drop the front index once it falls out of the window. The front is always the maximum."
    explanation: |
      **Brute force - O(n * k) time, O(1) extra space.** Compute the maximum of every
      window from scratch.

      **Heap - O(n log n) time, O(n) space.** Push `(value, index)` pairs into a max-heap
      and, before reading the top for a window, discard entries whose index is outside
      the window.

      **Monotonic deque - O(n) time, O(k) space.** Maintain a deque of indices whose
      values strictly decrease from front to back. For each index `i`: pop from the
      back while `nums[back] <= nums[i]` (those elements are dominated by a newer, not
      smaller value); append `i`; pop from the front if it equals `i - k` (it left the
      window). Once `i >= k - 1`, `nums[front]` is the window maximum. Each index enters
      and leaves the deque once.
