  - sheetId: prob-9-1-5-implement-stack-using-lin
    slug: implement-stack-using-linkedlist
    title: "Implement stack using Linkedlist"
    difficulty: Easy
    topic: "Stack and Queue"
    subtopic: "Learning"
    tags: ["stack", "linked-list", "design"]
    sourceUrl: "https://www.geeksforgeeks.org/problems/implement-stack-using-linked-list/1"
    statement: |
      Build a **stack** out of singly linked nodes instead of an array. A node stores one value
      and a pointer to the node below it; the stack itself is just a pointer to the topmost
      node. Nothing has to be resized or copied when the stack grows.

      Implement the class `LinkedStack`:

      - `push(x)` - put `x` on top.
      - `pop()` - remove the top element and return it; return `-1` if the stack is empty.
      - `peek()` - return the top element without removing it; return `-1` if the stack is empty.
      - `size()` - return how many elements the stack holds.
      - `to_list()` - return the elements **from top to bottom** as a list.

      `push`, `pop`, `peek` and `size` must run in **O(1)**; `to_list` walks the chain in O(n).
      Because every stored value is non-negative, the sentinel `-1` can never be confused with
      a real element.
    inputFormat: |
      - Line 1: an integer `q`, the number of operations.
      - Next `q` lines: one operation each, written as one of

        - `push x`
        - `pop`
        - `peek`
        - `size`
        - `print`
    outputFormat: |
      Print one line for every operation that returns a value, in the order the operations are
      performed:

      - `pop` and `peek` print the returned element, or `-1` when the stack is empty.
      - `size` prints an integer.
      - `print` prints the elements from top to bottom separated by single spaces, or the word
        `empty` when the stack holds nothing.

      `push` prints nothing.
    constraints:
      - "1 <= q <= 2000"
      - "0 <= x <= 10^9"
      - "Every operation name is exactly one of the names listed above."
    examples:
      - input: |
          7
          push 3
          push 5
          push 9
          print
          pop
          print
          peek
        output: |
          9 5 3
          9
          5 3
          5
        explanation: "The nodes are linked 9 -> 5 -> 3 from the top, so print lists 9 5 3. Removing the top detaches 9, leaving 5 3 with 5 on top."
      - input: |
          6
          print
          pop
          push 0
          size
          print
          peek
        output: |
          empty
          -1
          1
          0
          0
        explanation: "An empty stack prints the word empty and pop reports -1. After pushing the value 0 the stack holds one element, so print shows 0 and peek returns that stored 0."
    hints:
      - "Which end of a singly linked list can you insert into and delete from in O(1) without walking the list?"
      - "Keep a `head` pointer to the top node. `push` creates a node whose `next` is the old head and makes it the new head; `pop` returns the head's value and moves the head to `head.next`."
      - "Maintaining a separate counter lets `size` stay O(1) instead of walking the chain each time."
    explanation: |
      **Insert at the tail - O(n) per operation.** If the head of the list is the bottom of the
      stack, both `push` and `pop` have to reach the last node, and without a tail pointer that
      means walking the whole chain every time - O(n) per operation. Even with a tail pointer,
      `pop` still has to find the *previous* node, which a singly linked list cannot do in O(1).

      **Head as the top - O(1) per operation, O(n) space.** Let `head` point at the top node.

      - `push(x)`: allocate `node = Node(x)`, set `node.next = head`, set `head = node`,
        increment the counter.
      - `pop()`: if `head is None` return `-1`; otherwise remember `head.value`, set
        `head = head.next`, decrement the counter and return the value. The detached node is
        garbage.
      - `peek()`: return `head.value` (or `-1` when `head is None`).
      - `size()`: return the counter kept up to date by `push` and `pop`.
      - `to_list()`: follow `next` from `head` collecting values - this visits the nodes in
        top-to-bottom order, so no reversal is needed.

      Everything except the traversal is O(1) worst case, so a sequence of `q` operations costs
      O(q) plus the total length of the printed lists. Memory is exactly one node per stored
      element: unlike the array version there is no spare capacity, at the price of one pointer
      per element and a separate allocation for each node.
