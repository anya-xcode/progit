  - sheetId: prob-9-1-1-implement-stack-using-arr
    slug: implement-stack-using-arrays
    title: "Implement Stack using Arrays"
    difficulty: Easy
    topic: "Stack and Queue"
    subtopic: "Learning"
    tags: ["stack", "array", "design"]
    sourceUrl: "https://www.geeksforgeeks.org/problems/implement-stack-using-array/1"
    statement: |
      A **stack** is a last-in-first-out container: the element you inserted most recently is
      the first one to leave. Build one on top of a plain array, without using any ready-made
      stack type - keep the elements in consecutive array slots and remember the index of the
      slot that currently holds the top.

      Implement the class `ArrayStack` with these operations, each of which must run in
      **O(1)** time:

      - `push(x)` - place `x` on top of the stack.
      - `pop()` - remove the top element and return it; return `-1` if the stack is empty.
      - `top()` - return the top element without removing it; return `-1` if the stack is empty.
      - `size()` - return how many elements the stack currently holds.
      - `is_empty()` - return whether the stack holds no elements.

      Because every stored value is non-negative, the sentinel `-1` can never be confused with
      a real element.
    inputFormat: |
      - Line 1: an integer `q`, the number of operations.
      - Next `q` lines: one operation each, written as one of

        - `push x`
        - `pop`
        - `top`
        - `size`
        - `isEmpty`
    outputFormat: |
      Print one line for every operation that returns a value, in the order the operations are
      performed:

      - `pop` and `top` print the returned element, or `-1` when the stack is empty.
      - `size` prints an integer.
      - `isEmpty` prints `true` or `false`.

      `push` prints nothing.
    constraints:
      - "1 <= q <= 2000"
      - "0 <= x <= 10^9"
      - "Every operation name is exactly one of the names listed above."
    examples:
      - input: |
          7
          push 4
          push 9
          top
          size
          pop
          pop
          pop
        output: |
          9
          2
          9
          4
          -1
        explanation: "4 goes in first and 9 on top of it, so top reports 9 and the stack holds 2 elements. The two pops return 9 then 4; the third pop finds the stack empty and reports -1."
      - input: |
          6
          isEmpty
          push 0
          isEmpty
          size
          top
          pop
        output: |
          true
          false
          1
          0
          0
        explanation: "The stack starts empty, so the first isEmpty prints true. After pushing the value 0 it is no longer empty, holds one element, and both top and pop see that 0 - note that the stored 0 is printed as 0, never as -1."
    hints:
      - "Keep an index that always points at the slot holding the top element; an empty stack can be represented by the index -1."
      - "`push` writes at index `top + 1` and then increases `top`; `pop` reads at index `top` and then decreases it. Nothing else has to move."
      - "Never shift elements: shifting would make an operation cost O(n), and every operation here is supposed to be O(1)."
    explanation: |
      **Front-of-array stack - O(n) per operation.** If you decide that index `0` holds the top,
      every `push` has to shift the whole array one slot to the right and every `pop` has to
      shift it back. Correct, but each operation costs O(n) and a sequence of `q` operations
      costs O(q * n).

      **Top-of-array stack - O(1) per operation, O(n) space.** Store the bottom element at
      index `0` and grow towards higher indices, keeping a single integer `top` that holds the
      index of the newest element (`-1` while the stack is empty).

      - `push(x)`: increase `top`, then write `x` into that slot.
      - `pop()`: if `top < 0` return `-1`, otherwise read the slot at `top`, decrease `top` and
        return the value. The old value can simply be left behind - it is no longer reachable.
      - `top()`: read the slot at `top` (or `-1` when the stack is empty) without changing
        anything.
      - `size()`: `top + 1`.
      - `is_empty()`: `top < 0`.

      Every operation touches one slot and one counter, so all of them are O(1) and the whole
      sequence runs in O(q) time with O(n) memory, where `n` is the largest number of elements
      held at once. If the backing array is fixed-size, `push` must additionally refuse to write
      past the last slot (overflow); a growable array doubles its capacity instead, which stays
      O(1) amortized.
