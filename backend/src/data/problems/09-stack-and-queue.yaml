      python: |
        import sys
        from typing import List


        def next_greater_circular(nums: List[int]) -> List[int]:
            n = len(nums)
            answer = [-1] * n
            stack: List[int] = []
            for i in range(2 * n - 1, -1, -1):
                value = nums[i % n]
                while stack and stack[-1] <= value:
                    stack.pop()
                if i < n:
                    answer[i] = stack[-1] if stack else -1
                stack.append(value)
            return answer


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(" ".join(str(value) for value in next_greater_circular(nums)))


        if __name__ == "__main__":
            main()
