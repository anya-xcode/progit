      python: |
        import sys
        from typing import List

        MOD = 1000000007


        def sum_subarray_minimums(nums: List[int]) -> int:
            n = len(nums)
            previous_smaller = [-1] * n
            next_smaller_or_equal = [n] * n

            stack: List[int] = []
            for i in range(n):
                while stack and nums[stack[-1]] >= nums[i]:
                    stack.pop()
                previous_smaller[i] = stack[-1] if stack else -1
                stack.append(i)

            stack.clear()
            for i in range(n - 1, -1, -1):
                while stack and nums[stack[-1]] > nums[i]:
                    stack.pop()
                next_smaller_or_equal[i] = stack[-1] if stack else n
                stack.append(i)

            total = 0
            for i in range(n):
                left = i - previous_smaller[i]
                right = next_smaller_or_equal[i] - i
                total = (total + nums[i] * left * right) % MOD
            return total


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(sum_subarray_minimums(nums))


        if __name__ == "__main__":
            main()
