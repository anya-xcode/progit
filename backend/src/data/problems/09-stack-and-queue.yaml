    referenceSolution:
      python: |
        import sys
        from typing import List


        class ArrayQueue:
            def __init__(self) -> None:
                self.data: List[int] = []
                self.head = 0

            def push(self, x: int) -> None:
                self.data.append(x)

            def pop(self) -> int:
                if self.head == len(self.data):
                    return -1
                value = self.data[self.head]
                self.head += 1
                if self.head >= 64 and 2 * self.head >= len(self.data):
                    del self.data[:self.head]
                    self.head = 0
                return value

            def front(self) -> int:
                if self.head == len(self.data):
                    return -1
                return self.data[self.head]

            def size(self) -> int:
                return len(self.data) - self.head

            def is_empty(self) -> bool:
                return self.head == len(self.data)


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            q = int(lines[0].split()[0])
            queue = ArrayQueue()
            out = []
            for line in lines[1:1 + q]:
                parts = line.split()
                if not parts:
                    continue
                if parts[0] == "push":
                    queue.push(int(parts[1]))
                elif parts[0] == "pop":
                    out.append(str(queue.pop()))
                elif parts[0] == "front":
                    out.append(str(queue.front()))
                elif parts[0] == "size":
                    out.append(str(queue.size()))
                elif parts[0] == "isEmpty":
                    out.append("true" if queue.is_empty() else "false")
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
