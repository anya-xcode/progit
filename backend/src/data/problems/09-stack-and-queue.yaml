  - slug: stock-span
    title: "Stock Span"
    difficulty: Hard
    topic: "Stack and Queue"
    subtopic: "Monotonic Stack"
    tags: ["stack", "monotonic-stack", "array"]
    sourceUrl: "https://leetcode.com/problems/online-stock-span/"
    statement: |
      You are given the daily prices of a stock, `prices[0..n-1]`. The **span** of day
      `i` is the number of consecutive days ending at day `i` (and including it) on
      which the price was **less than or equal to** `prices[i]`.

      In other words, start at day `i` and walk backwards while the price is at most
      `prices[i]`; the span is how many days you covered. The span is always at least 1.

      Compute the span for every day.
    inputFormat: |
      - Line 1: an integer `n`, the number of days.
      - Line 2: `n` space-separated integers, the prices.
    outputFormat: |
      Print `n` integers separated by spaces: the span of each day in order.
    constraints:
      - "1 <= n <= 10^4"
      - "1 <= prices[i] <= 10^5"
    examples:
      - input: |
          7
          90 70 50 60 60 85 40
        output: |
          1 1 1 2 3 5 1
        explanation: "Day 5 (price 85) looks back over 60, 60, 50, 70 - all at most 85 - and stops at 90, giving a span of 5."
      - input: |
          3
          10 20 30
        output: |
          1 2 3
        explanation: "Prices keep rising, so each day covers every day before it."
    hints:
      - "Walking backwards from every day works but is O(n^2) for a rising price series."
      - "The span of day i ends right after the previous day whose price is strictly greater than prices[i]."
      - "Keep a stack of indices with strictly decreasing prices. Pop indices whose price is <= today's; the index left on top is the previous greater day."
    explanation: |
      **Walk backwards - O(n^2) time, O(1) extra space.** For each day, step left while
      the price does not exceed today's and count the steps.

      **Monotonic stack of indices - O(n) time, O(n) space.** The span of day `i` equals
      `i - j`, where `j` is the nearest earlier day with a price **strictly greater**
      than `prices[i]` (or `-1` if none). Keep a stack of indices whose prices strictly
      decrease from bottom to top. For day `i`, pop every index whose price is
      `<= prices[i]` - such days can never be the "previous greater" for any later day,
      because day `i` is at least as large and closer. The top is then `j`. Push `i`.
      Every index is pushed and popped at most once.
