  - sheetId: prob-9-3-4-number-of-greater-element
    slug: number-of-greater-elements-to-the-right
    title: "Number of Greater Elements to the Right"
    difficulty: Easy
    topic: "Stack and Queue"
    subtopic: "Monotonic Stack"
    tags: ["array", "fenwick-tree", "counting"]
    sourceUrl: "https://www.naukri.com/code360/problems/number-of-greater-elements-to-the-right"
    statement: |
      You are given an array `nums` of `n` integers and `q` queries. Each query is an index `i`
      (0-indexed), and its answer is **how many positions `j > i` satisfy `nums[j] > nums[i]`** -
      that is, the number of elements strictly greater than `nums[i]` that lie to its right.

      Note that this asks for a *count*, not for the nearest such element, so a single monotonic
      stack is not enough: every greater element to the right has to be counted, not only the
      first one. Queries are independent and may repeat.
    inputFormat: |
      - Line 1: two integers `n` and `q`.
      - Line 2: `n` space-separated integers, the array `nums`.
      - Line 3: `q` space-separated integers, the queried indices.
    outputFormat: |
      Print `q` lines: the answer to each query, in the order the queries are given.
    constraints:
      - "1 <= n <= 10^5"
      - "1 <= q <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
      - "0 <= queried index <= n - 1"
    examples:
      - input: |
          5 3
          2 5 1 7 3
          0 2 4
        output: |
          3
          2
          0
        explanation: "Right of index 0 (value 2) the values 5, 7 and 3 are greater, so 3. Right of index 2 (value 1) the values 7 and 3 are greater, so 2. Index 4 is the last position, so 0."
      - input: |
          4 3
          4 4 4 4
          0 3 1
        output: |
          0
          0
          0
        explanation: "All values are equal and the comparison is strict, so nothing to the right ever counts and every answer is 0."
    hints:
      - "Answering each query by scanning to the right costs O(n) per query - too slow when both n and q are large."
      - "Compute the answer for every index once, then queries become lookups. Sweep from right to left and ask 'how many already-seen values are greater than the current one?'."
      - "A Fenwick tree (binary indexed tree) over the compressed values answers that in O(log n): insert each value as you pass it, and query the count in the range above the current value."
    explanation: |
      **Brute force - O(n * q) time.** For each query scan the suffix and count. With
      `n = q = 10^5` that is 10^10 comparisons in the worst case.

      **Precompute all answers, then look them up - O(n log n + q) time, O(n) space.** The
      answer only depends on the index, so compute `count[i]` for every `i` once.

      Sweep `i` from `n - 1` down to `0` while maintaining a multiset of the values already
      passed (those are exactly the values at positions `> i`). `count[i]` is the number of
      elements in that multiset that are strictly greater than `nums[i]`; then insert `nums[i]`.

      To make both the query and the insert fast:

      1. **Compress** the values: sort the distinct values and map each value to its rank
         `1..m`. Comparisons are preserved.
      2. Keep a **Fenwick tree** of size `m` holding how many passed values have each rank.
         Inserting is a point update in O(log m); "how many are strictly greater" is
         `total_inserted - prefix_sum(rank(nums[i]))`, also O(log m).

      That gives O(n log n) for the sweep (the sort dominates) and O(1) per query afterwards.

      **Other routes.** A merge-sort style count (the classic inversion count with the
      comparison flipped) or an order-statistics balanced tree give the same O(n log n). If the
      values were small integers, a plain counting array with suffix sums would even do it in
      O(n + V).
