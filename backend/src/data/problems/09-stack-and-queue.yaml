    slug: next-smaller-element
    title: "Next Smaller Element"
    difficulty: Medium
    topic: "Stack and Queue"
    subtopic: "Monotonic Stack"
    tags: ["array", "stack", "monotonic-stack"]
    sourceUrl: "https://www.naukri.com/code360/problems/next-smaller-element"
    statement: |
      Given an array `nums` of `n` integers, find for every position `i` its *next smaller
      element*: the value of the **nearest position to the right** of `i` that holds a value
      **strictly smaller** than `nums[i]`.

      Formally, the answer for `i` is `nums[j]` for the smallest `j > i` with
      `nums[j] < nums[i]`. If no such position exists, the answer for `i` is `-1`.

      The array is a straight line, not a circle: nothing wraps around from the end back to the
      beginning. All array values are non-negative, so the marker `-1` can never be confused
      with a real element.
    inputFormat: |
      - Line 1: an integer `n`, the length of the array.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print `n` space-separated integers on a single line: the next smaller element of position
      `0`, `1`, ..., `n - 1`, using `-1` where there is none.
    constraints:
      - "1 <= n <= 10^5"
      - "0 <= nums[i] <= 10^9"
    examples:
      - input: |
          5
          4 8 5 2 25
        output: |
          2 5 2 -1 -1
        explanation: "Right of 4 the first smaller value is 2. Right of 8 it is 5. Right of 5 it is 2. Nothing to the right of 2 is smaller than 2, and 25 is the last position, so both answer -1."
      - input: |
          3
          3 3 3
        output: |
          -1 -1 -1
        explanation: "The comparison is strict, so an equal value does not count and every position answers -1."
    hints:
      - "Scanning right from every index is O(n^2). Which earlier indices become irrelevant once you have seen a small value?"
      - "Sweep from right to left with a stack that stays increasing from top to bottom, popping every element that is `>= nums[i]`."
      - "A popped element can never be an answer again: anything further left that could reach it must pass `nums[i]` first, and `nums[i]` is at least as small."
    explanation: |
      **Brute force - O(n^2) time, O(1) extra space.** For each `i`, scan `j = i + 1, i + 2, ...`
      until `nums[j] < nums[i]`. Fine for small arrays, far too slow for `n = 10^5` in the worst
      case (a sorted-increasing array makes every scan run to the end).

      **Monotonic stack - O(n) time, O(n) space.** Process the array from right to left keeping
      a stack of values that are still candidate answers. Before answering for `i`:

      1. While the stack is non-empty and its top is `>= nums[i]`, pop it. Such a top is not
         strictly smaller than `nums[i]`, and it sits further right than `i`, so any position to
         the left of `i` would meet `nums[i]` first - the popped value is useless from now on.
      2. The answer for `i` is the current top, or `-1` when the stack is empty.
      3. Push `nums[i]`, which is now the nearest candidate for everything to its left.

      The stack stays strictly increasing from top to bottom. Every element is pushed exactly
      once and popped at most once, so despite the inner `while` the total work is O(n), with
      O(n) memory for the stack and the answer array.

      The same sweep run left to right with the comparison flipped gives the *previous* smaller
      element, and swapping `<` for `>` gives the next/previous greater variants - the four
      classic questions share one template.
