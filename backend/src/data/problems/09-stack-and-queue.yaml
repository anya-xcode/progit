  - sheetId: prob-9-4-5-lfu-cache
    slug: lfu-cache
    title: "LFU Cache"
    difficulty: Hard
    topic: "Stack and Queue"
    subtopic: "Implementation"
    tags: ["design", "hashing", "linked-list", "cache"]
    sourceUrl: "https://leetcode.com/problems/lfu-cache/"
    statement: |
      Design a key-value cache of fixed `capacity` that evicts the **least frequently used**
      entry when a new key has to be stored and the cache is full.

      Implement the class `LFUCache`:

      - `LFUCache(capacity)` - create an empty cache holding at most `capacity` entries.
      - `get(key)` - if `key` is stored, return its value; otherwise return `-1`.
      - `put(key, value)` - if `key` is stored, overwrite its value; otherwise insert the pair,
        evicting one entry first if the cache is already full.

      Every entry keeps a **use counter**, which starts at `1` when the entry is inserted and
      increases by one on every successful `get` and on every `put` that targets an existing key.
      A `get` for a key that is not stored changes nothing at all.

      When an eviction is needed, remove the entry with the **smallest use counter**; if several
      entries tie, remove the one among them that was used **least recently** (its last use being
      its insertion, a successful `get`, or a `put` that overwrote it).

      Both operations should run in **O(1)** average time.
    inputFormat: |
      - Line 1: two integers `capacity` and `q`, the number of operations.
      - Next `q` lines: one operation each, either `get key` or `put key value`.
    outputFormat: |
      Print one line for every `get` operation, in operation order: the stored value, or `-1`
      when the key is not in the cache.
    constraints:
      - "1 <= capacity <= 1000"
      - "1 <= q <= 2000"
      - "0 <= key <= 10^4"
      - "0 <= value <= 10^5"
    examples:
      - input: |
          2 8
          put 1 100
          put 2 200
          get 1
          put 3 300
          get 2
          get 3
          get 1
          get 4
        output: |
          100
          -1
          300
          100
          -1
        explanation: "After the two puts both keys have counter 1; get 1 raises key 1 to 2. Inserting key 3 must evict the smallest counter, which is key 2, so get 2 returns -1 while keys 1 and 3 are still there. Key 4 was never stored."
      - input: |
          2 7
          put 1 10
          put 2 20
          put 3 30
          get 1
          get 2
          get 3
          put 2 25
        output: |
          -1
          20
          30
        explanation: "Keys 1 and 2 both have counter 1, so the tie is broken by recency and the older key 1 is evicted when key 3 arrives. get 1 therefore returns -1 while keys 2 and 3 answer 20 and 30."
    hints:
      - "Scanning all entries to find the minimum counter costs O(capacity) per eviction. Group the keys by counter instead."
      - "Keep a map from counter value to the list of keys with that counter, ordered from least to most recently used, plus a map from key to its value and counter."
      - "Track the current minimum counter. It can only grow by one when the minimum bucket empties after a use, and it resets to 1 on every insertion - so it is maintainable in O(1)."
    explanation: |
      **Linear scan - O(capacity) per eviction.** Store `(value, counter, last_used)` per key and
      scan everything to find the victim. Simple, but the required bound is O(1).

      **Frequency buckets - O(1) average per operation, O(capacity) space.** Keep three things:

      1. `value_of[key]` - the stored value.
      2. `counter_of[key]` - the key's use counter.
      3. `bucket[c]` - an ordered collection of the keys whose counter equals `c`, kept in
         least-recently-used-first order (a doubly linked list, or an ordered dictionary).

      Plus one integer `min_counter`, the smallest counter currently present.

      **Touching a key** (successful `get`, or `put` on an existing key): let `c` be its counter.
      Remove the key from `bucket[c]`, set its counter to `c + 1` and append it at the
      most-recent end of `bucket[c + 1]`. If `bucket[c]` became empty and `c == min_counter`,
      increase `min_counter` by one - the only counter that can now be smallest.

      **Inserting a new key**: if the cache is full, take the first (least recently used) key of
      `bucket[min_counter]` and delete it from every structure. Then store the new key with
      counter `1`, append it to `bucket[1]` and set `min_counter = 1`.

      Every step is a constant number of hash-map and list-end operations, so both `get` and
      `put` are O(1) on average and memory is O(capacity).

      **Why `min_counter` stays correct.** It is set to `1` whenever an entry is inserted, which
      is the smallest possible counter. Otherwise counters only move from `c` to `c + 1`, so the
      minimum can only rise, and only when the bucket it names becomes empty - exactly the case
      handled above.
