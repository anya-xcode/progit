  - sheetId: prob-9-3-9-remove-k-digits
    slug: remove-k-digits
    title: "Remove K Digits"
    difficulty: Medium
    topic: "Stack and Queue"
    subtopic: "Monotonic Stack"
    tags: ["string", "stack", "greedy", "monotonic-stack"]
    sourceUrl: "https://leetcode.com/problems/remove-k-digits/"
    statement: |
      You are given a non-negative integer written as a string `s` of digits, and an integer `k`.

      Delete exactly `k` digits from `s`. The digits that survive keep their original relative
      order and form a new number. Among all the ways of deleting `k` digits, print the number
      whose **value is smallest**.

      Print the answer without leading zeros. If every digit is deleted (`k` equals the length
      of `s`), print `0`.
    inputFormat: |
      - Line 1: the string `s`, made only of the characters `0`-`9`.
      - Line 2: an integer `k`.
    outputFormat: |
      Print the smallest number obtainable, as a string with no leading zeros; print `0` if
      nothing is left.
    constraints:
      - "1 <= |s| <= 10^5"
      - "0 <= k <= |s|"
      - "`s` contains only digits; it has no leading zeros unless it is exactly \"0\"."
    examples:
      - input: |
          1432219
          3
        output: |
          1219
        explanation: "Deleting the 4, the 3 and one 2 leaves 1219, which is the smallest of all the ways to drop three digits."
      - input: |
          10200
          1
        output: |
          200
        explanation: "Deleting the 1 leaves 0200, and after stripping the leading zero the value printed is 200."
    hints:
      - "Reading left to right, a digit hurts the value most when the digit right after it is smaller - removing it shortens the most significant part of the number."
      - "Build the answer in a stack: before pushing the current digit, pop the top while it is greater than the current digit and you still have deletions left."
      - "After the scan you may still have deletions left (the digits were non-decreasing) - drop them from the end. Only then strip leading zeros."
    explanation: |
      **Brute force - exponential.** Trying every choice of `k` positions to delete means
      `C(|s|, k)` candidates, hopeless beyond tiny inputs.

      **Repeated single deletions - O(|s| * k) time.** Deleting one digit optimally means
      deleting the first digit that is greater than the digit after it (or the last digit if the
      string is non-decreasing). Repeat `k` times. Correct and easy to argue, but quadratic.

      **Monotonic stack, one pass - O(|s|) time, O(|s|) space.** The key observation: among the
      kept digits, the leftmost one dominates the value, so a larger digit sitting in front of a
      smaller one should always go first.

      Scan the digits left to right, keeping the answer so far in a stack:

      1. While the stack is non-empty, its top is greater than the current digit, and deletions
         remain, pop the top and spend one deletion.
      2. Push the current digit.

      After the scan, if deletions remain the stack is non-decreasing, and the cheapest way to
      spend them is to drop digits from the **end** (the least significant positions), so pop `k`
      more times.

      Finally strip leading zeros; if nothing is left print `0`.

      Each digit is pushed once and popped at most once, so the whole algorithm is O(|s|) time
      and O(|s|) space. Greedy exchange argument for correctness: if the first "descent" pair
      `s[i] > s[i+1]` is not broken by deleting `s[i]`, then some other deletion leaves `s[i]` in
      a more significant position than necessary, producing a value that is at least as large.
    starterCode:
      python: |
        import sys


        def remove_k_digits(s: str, k: int) -> str:
            # Smallest number left after deleting exactly k digits.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s = data[0]
            k = int(data[1])
            print(remove_k_digits(s, k))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def remove_k_digits(s: str, k: int) -> str:
            stack: List[str] = []
            remaining = k
            for digit in s:
                while stack and remaining > 0 and stack[-1] > digit:
                    stack.pop()
                    remaining -= 1
                stack.append(digit)
            if remaining > 0:
                del stack[len(stack) - remaining:]
            answer = "".join(stack).lstrip("0")
            return answer if answer else "0"


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            s = data[0]
            k = int(data[1])
            print(remove_k_digits(s, k))


        if __name__ == "__main__":
            main()
