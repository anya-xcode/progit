  - sheetId: prob-9-3-2-next-greater-element-2
    slug: next-greater-element-2
    title: "Next Greater Element - 2"
    difficulty: Medium
    topic: "Stack and Queue"
    subtopic: "Monotonic Stack"
    tags: ["array", "stack", "monotonic-stack"]
    sourceUrl: "https://leetcode.com/problems/next-greater-element-ii/"
    statement: |
      You are given an array `nums` of `n` integers arranged in a **circle**: the element after
      `nums[n - 1]` is `nums[0]` again.

      For every position `i`, its *next greater element* is the first value you meet that is
      **strictly greater** than `nums[i]` when you walk forward from `i` around the circle,
      visiting `i + 1`, `i + 2`, ... and wrapping past the end. You stop after inspecting all
      `n - 1` other positions; if none of them is strictly greater, the answer for `i` is `-1`.

      Report the next greater element of every position.
    inputFormat: |
      - Line 1: an integer `n`, the length of the array.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print `n` space-separated integers on a single line: the next greater element of position
      `0`, `1`, ..., `n - 1`, using `-1` where there is none.
    constraints:
      - "1 <= n <= 10^5"
      - "-10^9 <= nums[i] <= 10^9"
    examples:
      - input: |
          5
          3 8 4 1 5
        output: |
          8 -1 5 5 8
        explanation: "From position 0 (value 3) the first larger value going right is 8. From position 1 (value 8) nothing in the circle is larger, so -1. From position 2 (value 4) we skip 1 and find 5. From position 3 (value 1) the next value 5 is already larger. From position 4 (value 5) we wrap around past 3 and 4 and find 8."
      - input: |
          3
          6 6 6
        output: |
          -1 -1 -1
        explanation: "Every value equals the others and the comparison is strict, so no position has a strictly greater neighbour anywhere in the circle."
    hints:
      - "Walking forward from every index separately costs O(n^2). Notice that many indices are waiting for the *same* future value."
      - "Sweep the array from right to left keeping a stack of candidate answers, and pop everything that is not strictly greater than the current value - those elements can never be anybody's answer again."
      - "To handle the wrap-around, run the same sweep over the array twice (indices 2n - 1 down to 0, using `i % n`); after the first pass the stack already holds the elements that come 'after' the end."
    explanation: |
      **Brute force - O(n^2) time, O(1) extra space.** For each `i`, step through
      `i + 1, i + 2, ...` modulo `n` until a strictly greater value shows up or all `n - 1`
      other positions were inspected. Correct, but quadratic.

      **Monotonic stack, right to left - O(n) time, O(n) space.** Keep a stack of values that
      are still possible answers, decreasing from bottom to top. Process `i` from `n - 1` down
      to `0`:

      1. Pop while the stack is non-empty and its top is `<= nums[i]`. A popped value is not
         strictly greater than `nums[i]`, and anything further left that reaches it would meet
         `nums[i]` first, so it can never be an answer again.
      2. The answer for `i` is the new top of the stack, or `-1` if the stack is empty.
      3. Push `nums[i]`.

      Each element is pushed and popped at most once, so the sweep is O(n).

      **Adding the circle.** Run the loop from `i = 2n - 1` down to `0` and use `nums[i % n]`
      everywhere, recording an answer only while `i < n`. The first (throw-away) half fills the
      stack with exactly the elements that follow position `n - 1` in the circle, which is all
      the wrap-around information the second half needs. Total work is still O(n) time and O(n)
      space.
