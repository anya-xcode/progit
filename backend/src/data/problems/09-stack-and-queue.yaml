    referenceSolution:
      python: |
        import sys
        from typing import List, Optional


        class Node:
            def __init__(self, value: int) -> None:
                self.value = value
                self.next: "Optional[Node]" = None


        class LinkedQueue:
            def __init__(self) -> None:
                self.head: Optional[Node] = None
                self.tail: Optional[Node] = None
                self.count = 0

            def push(self, x: int) -> None:
                node = Node(x)
                if self.tail is None:
                    self.head = node
                    self.tail = node
                else:
                    self.tail.next = node
                    self.tail = node
                self.count += 1

            def pop(self) -> int:
                if self.head is None:
                    return -1
                value = self.head.value
                self.head = self.head.next
                if self.head is None:
                    self.tail = None
                self.count -= 1
                return value

            def front(self) -> int:
                if self.head is None:
                    return -1
                return self.head.value

            def size(self) -> int:
                return self.count

            def to_list(self) -> List[int]:
                values: List[int] = []
                node = self.head
                while node is not None:
                    values.append(node.value)
                    node = node.next
                return values


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            q = int(lines[0].split()[0])
            queue = LinkedQueue()
            out = []
            for line in lines[1:1 + q]:
                parts = line.split()
                if not parts:
                    continue
                if parts[0] == "push":
                    queue.push(int(parts[1]))
                elif parts[0] == "pop":
                    out.append(str(queue.pop()))
                elif parts[0] == "front":
                    out.append(str(queue.front()))
                elif parts[0] == "size":
                    out.append(str(queue.size()))
                elif parts[0] == "print":
                    values = queue.to_list()
                    out.append(" ".join(str(v) for v in values) if values else "empty")
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
