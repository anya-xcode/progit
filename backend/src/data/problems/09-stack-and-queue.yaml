  - sheetId: prob-9-1-3-implement-stack-using-que
    slug: implement-stack-using-queue
    title: "Implement Stack using Queue"
    difficulty: Easy
    topic: "Stack and Queue"
    subtopic: "Learning"
    tags: ["stack", "queue", "design"]
    sourceUrl: "https://leetcode.com/problems/implement-stack-using-queues/"
    statement: |
      Build a last-in-first-out **stack** whose only storage is a **queue**. The queue may be
      used in a queue-like way only: add to the back, remove from the front, look at the front,
      and ask for its length. You may not index into it, reverse it, or pop from its back.

      Implement the class `QueueStack`:

      - `push(x)` - place `x` on top of the stack.
      - `pop()` - remove the top element and return it; return `-1` if the stack is empty.
      - `top()` - return the top element without removing it; return `-1` if the stack is empty.
      - `size()` - return how many elements the stack holds.
      - `is_empty()` - return whether the stack holds no elements.

      Because every stored value is non-negative, the sentinel `-1` can never be confused with
      a real element.
    inputFormat: |
      - Line 1: an integer `q`, the number of operations.
      - Next `q` lines: one operation each, written as one of

        - `push x`
        - `pop`
        - `top`
        - `size`
        - `isEmpty`
    outputFormat: |
      Print one line for every operation that returns a value, in the order the operations are
      performed:

      - `pop` and `top` print the returned element, or `-1` when the stack is empty.
      - `size` prints an integer.
      - `isEmpty` prints `true` or `false`.

      `push` prints nothing.
    constraints:
      - "1 <= q <= 1000"
      - "0 <= x <= 10^9"
      - "Every operation name is exactly one of the names listed above."
    examples:
      - input: |
          7
          push 2
          push 6
          top
          pop
          top
          pop
          pop
        output: |
          6
          6
          2
          2
          -1
        explanation: "A queue would hand back 2 first, but a stack must hand back the newest element, so top reports 6 and the pops return 6 then 2. The last pop sees an empty stack and reports -1."
      - input: |
          6
          push 8
          size
          push 1
          top
          isEmpty
          pop
        output: |
          1
          1
          false
          1
        explanation: "After the second push the newest element is 1, so top reports 1 and the following pop removes it. The stack is never empty here, so isEmpty prints false."
    hints:
      - "A queue hands back its oldest element. What would have to be true of the queue's order for its front to already be the stack's top?"
      - "After inserting a new element at the back, rotate the queue: move the other elements from the front to the back one by one. The new element ends up at the front."
      - "That makes `push` cost O(n) while `pop` and `top` become O(1). Two queues give the same bounds; shifting the work into `pop` instead is also possible."
    explanation: |
      The difficulty is that a queue releases its **oldest** element while a stack must release
      its **newest** one, so somewhere you have to pay for reversing the order. The only choice
      is which operation pays.

      **Costly pop with two queues - O(1) push, O(n) pop/top.** Push onto queue `A`. To pop,
      move all but the last element of `A` into queue `B`, take the remaining element as the
      answer, then swap the roles of `A` and `B`. `top` is the same but the last element is
      pushed back.

      **Costly push with a single queue - O(n) push, O(1) pop/top, O(n) space.** Keep the queue
      ordered so that its front is always the top of the stack.

      - `push(x)`: append `x` at the back, then rotate the queue `len(queue) - 1` times, each
        rotation removing the front element and appending it at the back. The elements that were
        already there keep their relative order and end up behind `x`, so `x` is now at the
        front.
      - `pop()`: if the queue is empty return `-1`, otherwise remove and return its front.
      - `top()`: return the front without removing it.
      - `size()` / `is_empty()`: read the queue's length.

      `push` does O(n) queue operations, every other operation does O(1), so a sequence of `q`
      operations costs O(q * n) in the worst case and O(n) memory. No ordering is possible that
      makes both `push` and `pop` O(1) with a single queue, which is exactly why two stacks are
      the preferred way round to build a queue - there the cost can be amortized away.
