  - slug: implement-queue-using-stacks
    title: "Implement Queue Using Stacks"
    difficulty: Easy
    topic: "Stack and Queue"
    subtopic: "Learning"
    tags: ["stack", "queue", "design"]
    sourceUrl: "https://leetcode.com/problems/implement-queue-using-stacks/"
    statement: |
      Build a first-in-first-out (FIFO) queue using only **stacks** as storage. You may
      use at most two Python lists, and only in a stack-like way: append to the end,
      pop from the end, look at the last element, and check the length.

      Implement the class `MyQueue`:

      - `push(x)` - add `x` to the back of the queue.
      - `pop()` - remove the element at the front of the queue and return it.
      - `peek()` - return the element at the front without removing it.
      - `empty()` - return whether the queue has no elements.

      `pop` and `peek` are only called on a non-empty queue. Aim for **amortized O(1)**
      time per operation.
    inputFormat: |
      - Line 1: an integer `q`, the number of operations.
      - Next `q` lines: one operation each, one of `push x`, `pop`, `peek` or `empty`.
    outputFormat: |
      For every `pop` and `peek` print the returned value, and for every `empty` print
      `true` or `false`, each on its own line in operation order.
    constraints:
      - "1 <= q <= 2000"
      - "-10^9 <= x <= 10^9"
      - "`pop` and `peek` are never called on an empty queue."
    examples:
      - input: |
          6
          push 3
          push 8
          peek
          pop
          empty
          pop
        output: |
          3
          3
          false
          8
        explanation: "3 entered first, so it is at the front. After it is removed, 8 is still waiting, so the queue is not empty."
      - input: |
          4
          empty
          push 11
          pop
          empty
        output: |
          true
          11
          true
        explanation: "The queue starts empty, receives 11, and is empty again after 11 leaves."
    hints:
      - "A stack reverses order. What happens if you reverse something twice?"
      - "Keep an `in` stack for pushes and an `out` stack for pops and peeks."
      - "Only move elements from `in` to `out` when `out` is empty. Each element is then moved at most once in its lifetime."
    explanation: |
      **Costly push - O(n) push, O(1) pop/peek.** Keep the elements in one stack with
      the front on top. To push, move everything to a helper stack, push the new item,
      and move everything back.

      **Two stacks with lazy transfer - amortized O(1) per operation, O(n) space.** Push
      onto `in_stack`. For `pop` or `peek`, if `out_stack` is empty, pop every element
      of `in_stack` onto `out_stack` - this reverses them so the oldest is on top - and
      then use the top of `out_stack`. Every element is pushed and popped at most twice
      overall (once per stack), so any sequence of `q` operations costs O(q) total.
      The queue is empty when both stacks are empty.
