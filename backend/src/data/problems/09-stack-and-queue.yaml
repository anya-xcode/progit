            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def asteroid_collision(asteroids: List[int]) -> List[int]:
            stack = []
            for rock in asteroids:
                alive = True
                while alive and rock < 0 and stack and stack[-1] > 0:
                    if stack[-1] < -rock:
                        stack.pop()
                    elif stack[-1] == -rock:
                        stack.pop()
                        alive = False
                    else:
                        alive = False
                if alive:
                    stack.append(rock)
            return stack


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            asteroids = [int(x) for x in data[1:1 + n]]
            print(" ".join(map(str, asteroid_collision(asteroids))))


        if __name__ == "__main__":
            main()
