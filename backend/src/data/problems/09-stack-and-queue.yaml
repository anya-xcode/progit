  - sheetId: prob-9-4-3-celebrity-problem
    slug: celebrity-problem
    title: "Celebrity Problem"
    difficulty: Hard
    topic: "Stack and Queue"
    subtopic: "Implementation"
    tags: ["matrix", "stack", "two-pointers", "greedy"]
    sourceUrl: "https://www.naukri.com/code360/problems/celebrity-problem"
    statement: |
      There are `n` people at a party, numbered `0` to `n - 1`. Who knows whom is given by an
      `n x n` matrix `knows`, where `knows[i][j] = 1` means person `i` knows person `j`, and `0`
      means they do not. Nobody knows themselves, so `knows[i][i] = 0`.

      A **celebrity** is a person who

      - is known by **every** other person, and
      - knows **nobody** else.

      At most one such person can exist. Report the celebrity's number, or `-1` if the party has
      none.
    inputFormat: |
      - Line 1: an integer `n`, the number of people.
      - Next `n` lines: `n` space-separated values, each `0` or `1`, giving the matrix `knows`.
    outputFormat: |
      Print a single integer: the celebrity's index, or `-1` when there is no celebrity.
    constraints:
      - "1 <= n <= 200"
      - "knows[i][j] is 0 or 1"
      - "knows[i][i] = 0 for every i"
    examples:
      - input: |
          3
          0 1 0
          0 0 0
          0 1 0
        output: |
          1
        explanation: "Person 1 knows nobody, and both 0 and 2 know person 1, so person 1 is the celebrity."
      - input: |
          3
          0 1 0
          1 0 0
          0 0 0
        output: |
          -1
        explanation: "Person 2 knows nobody but is unknown to 0 and 1, and persons 0 and 1 each know somebody. No one satisfies both conditions."
    hints:
      - "Checking every person against everybody else costs O(n^2) matrix reads - but how many people can you rule out with a single read?"
      - "If knows[a][b] = 1 then a cannot be the celebrity (a knows someone); if knows[a][b] = 0 then b cannot be (b is not known by a). Either way one read eliminates one person."
      - "After n - 1 such eliminations one candidate is left. It is only a *possible* celebrity - verify its whole row and column before answering."
    explanation: |
      **Brute force - O(n^2) reads, O(1) space.** For every person check that their row is all
      zeros and their column is all ones (ignoring the diagonal). This already costs only O(n^2)
      overall, which is fine for `n = 200`, but it examines the matrix repeatedly and does not
      generalize to the setting where each `knows` lookup is an expensive query.

      **Elimination with a stack (or two pointers) - O(n) queries + O(n) verification.** Put all
      `n` people on a stack. Repeatedly pop two candidates `a` and `b` and read `knows[a][b]`:

      - if `knows[a][b] = 1`, `a` knows someone, so `a` is out - push `b` back;
      - if `knows[a][b] = 0`, `b` is not known by `a`, so `b` is out - push `a` back.

      Exactly one person is eliminated per comparison, so after `n - 1` comparisons one candidate
      remains. Using two indices `top = 0` and `bottom = n - 1` and moving them towards each
      other implements the same elimination with O(1) extra memory.

      **Verification is mandatory.** The elimination only proves that everybody *else* fails; the
      survivor may fail too (the party may simply have no celebrity). So check the survivor `c`
      explicitly: `knows[c][j] = 0` and `knows[j][c] = 1` for every `j != c`. If any check fails,
      print `-1`.

      That is `n - 1` reads for the elimination plus `2(n - 1)` for the verification, i.e. O(n)
      matrix reads and O(1) extra space with the two-pointer variant (O(n) with the stack).
      Uniqueness follows from the definition: if `c1` and `c2` were both celebrities, `c1` would
      have to know `c2` and simultaneously know nobody.
