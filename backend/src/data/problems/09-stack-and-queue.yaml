      python: |
        import sys
        from typing import List, Optional


        class Node:
            def __init__(self, value: int, nxt: "Optional[Node]" = None) -> None:
                self.value = value
                self.next = nxt


        class LinkedStack:
            def __init__(self) -> None:
                self.head: Optional[Node] = None
                self.count = 0

            def push(self, x: int) -> None:
                self.head = Node(x, self.head)
                self.count += 1

            def pop(self) -> int:
                if self.head is None:
                    return -1
                value = self.head.value
                self.head = self.head.next
                self.count -= 1
                return value

            def peek(self) -> int:
                if self.head is None:
                    return -1
                return self.head.value

            def size(self) -> int:
                return self.count

            def to_list(self) -> List[int]:
                values: List[int] = []
                node = self.head
                while node is not None:
                    values.append(node.value)
                    node = node.next
                return values


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            q = int(lines[0].split()[0])
            stack = LinkedStack()
            out = []
            for line in lines[1:1 + q]:
                parts = line.split()
                if not parts:
                    continue
                if parts[0] == "push":
                    stack.push(int(parts[1]))
                elif parts[0] == "pop":
                    out.append(str(stack.pop()))
                elif parts[0] == "peek":
                    out.append(str(stack.peek()))
                elif parts[0] == "size":
                    out.append(str(stack.size()))
                elif parts[0] == "print":
                    values = stack.to_list()
                    out.append(" ".join(str(v) for v in values) if values else "empty")
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
