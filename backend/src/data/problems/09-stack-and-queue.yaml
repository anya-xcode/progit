    slug: sum-of-subarray-ranges
    title: "Sum of Subarray Ranges"
    difficulty: Medium
    topic: "Stack and Queue"
    subtopic: "Monotonic Stack"
    tags: ["array", "stack", "monotonic-stack", "math"]
    sourceUrl: "https://leetcode.com/problems/sum-of-subarray-ranges/"
    statement: |
      The **range** of an array is its largest value minus its smallest value. A single element
      therefore has range `0`.

      Given an array `nums` of `n` integers, add up the ranges of all `n * (n + 1) / 2` non-empty
      contiguous subarrays and print that total. The answer always fits in a signed 64-bit
      integer, so print it exactly - no modulo.
    inputFormat: |
      - Line 1: an integer `n`, the length of the array.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print a single integer: the sum of `max - min` over every contiguous subarray.
    constraints:
      - "1 <= n <= 1000"
      - "-10^9 <= nums[i] <= 10^9"
    examples:
      - input: |
          3
          1 3 2
        output: |
          5
        explanation: "The subarrays are [1]->0, [3]->0, [2]->0, [1,3]->2, [3,2]->1 and [1,3,2]->2. The total is 5."
      - input: |
          4
          4 4 4 4
        output: |
          0
        explanation: "Every subarray consists of equal values, so every range is 0."
    hints:
      - "sum of (max - min) = (sum of all subarray maxima) - (sum of all subarray minima). Solve the two halves independently."
      - "For the minima half, count for each index how many subarrays it is the minimum of, using previous-smaller and next-smaller boundaries; the maxima half is the mirror image."
      - "Ties need one strict and one non-strict comparison so that each subarray is charged to exactly one index."
    explanation: |
      **Brute force - O(n^2) time, O(1) space.** Fix the left end, extend the right end and keep
      a running minimum and maximum, adding `max - min` each step. At `n = 1000` that is about
      half a million steps, so it already passes here - but it does not scale.

      **Split the sum - O(n) time, O(n) space.** Since every subarray contributes
      `max - min`,

      ```
      answer = (sum of maxima over all subarrays) - (sum of minima over all subarrays)
      ```

      and each half is the classic "count each element's contribution" problem.

      For the minima: for index `i` let `left[i]` be the index of the previous **strictly
      smaller** element (`-1` if none) and `right[i]` the index of the next **smaller-or-equal**
      element (`n` if none). Every subarray starting in `(left[i], i]` and ending in
      `[i, right[i])` has `nums[i]` as its minimum, so `nums[i]` contributes

      ```
      nums[i] * (i - left[i]) * (right[i] - i)
      ```

      The maxima half is identical with the comparisons flipped: previous strictly greater and
      next greater-or-equal.

      **Why one side must be non-strict.** In a run of equal values, symmetric comparisons would
      either double-count or skip the subarrays lying inside the run. Making exactly one side
      non-strict charges each subarray to a single index (the leftmost extreme), so the counts
      partition all subarrays exactly.

      All four boundary arrays come from monotonic-stack sweeps in which every index is pushed
      and popped once, so the whole computation is O(n) time and O(n) space. The magnitudes stay
      below about `10^9 * n^2 / 2`, which is comfortably inside 64-bit range for `n <= 1000`.
