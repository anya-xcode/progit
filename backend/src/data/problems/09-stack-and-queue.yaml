  - sheetId: prob-9-1-6-implement-queue-using-lin
    slug: implement-queue-using-linkedlist
    title: "Implement queue using Linkedlist"
    difficulty: Easy
    topic: "Stack and Queue"
    subtopic: "Learning"
    tags: ["queue", "linked-list", "design"]
    sourceUrl: "https://www.geeksforgeeks.org/problems/implement-queue-using-linked-list/1"
    statement: |
      Build a **queue** out of singly linked nodes. Elements leave in the order they arrived, so
      you insert at one end of the chain and remove at the other - and both have to stay O(1),
      which is only possible if you keep pointers to **both** ends.

      Implement the class `LinkedQueue`:

      - `push(x)` - add `x` at the back.
      - `pop()` - remove the front element and return it; return `-1` if the queue is empty.
      - `front()` - return the front element without removing it; return `-1` if the queue is
        empty.
      - `size()` - return how many elements the queue holds.
      - `to_list()` - return the elements **from front to back** as a list.

      `push`, `pop`, `front` and `size` must run in **O(1)**; `to_list` walks the chain in O(n).
      Because every stored value is non-negative, the sentinel `-1` can never be confused with
      a real element.
    inputFormat: |
      - Line 1: an integer `q`, the number of operations.
      - Next `q` lines: one operation each, written as one of

        - `push x`
        - `pop`
        - `front`
        - `size`
        - `print`
    outputFormat: |
      Print one line for every operation that returns a value, in the order the operations are
      performed:

      - `pop` and `front` print the returned element, or `-1` when the queue is empty.
      - `size` prints an integer.
      - `print` prints the elements from front to back separated by single spaces, or the word
        `empty` when the queue holds nothing.

      `push` prints nothing.
    constraints:
      - "1 <= q <= 2000"
      - "0 <= x <= 10^9"
      - "Every operation name is exactly one of the names listed above."
    examples:
      - input: |
          7
          push 3
          push 5
          push 9
          print
          pop
          print
          front
        output: |
          3 5 9
          3
          5 9
          5
        explanation: "The nodes are linked 3 -> 5 -> 9 from the front, so print lists 3 5 9. Removing the front detaches 3 and the front becomes 5."
      - input: |
          7
          pop
          push 0
          push 7
          print
          pop
          print
          size
        output: |
          -1
          0 7
          0
          7
          1
        explanation: "pop on an empty queue reports -1. The stored 0 arrived first, so it is printed at the front and is the first to leave; afterwards only 7 remains."
    hints:
      - "Removing from the back of a singly linked list is impossible in O(1) - you cannot reach the node before the last one. So which end should be the front?"
      - "Keep `head` for the front and `tail` for the back: `push` links a new node after `tail`, `pop` unlinks `head`."
      - "Handle the two boundary cases carefully: pushing into an empty queue sets both pointers, and popping the last element must reset `tail` to `None` as well."
    explanation: |
      **One pointer only - O(n) per operation.** With just a `head` pointer, `push` has to walk
      to the end of the chain, so `q` operations cost O(q * n).

      **Head and tail pointers - O(1) per operation, O(n) space.** Let `head` be the front of
      the queue and `tail` the back.

      - `push(x)`: build `node = Node(x)`. If the queue is empty set `head = tail = node`,
        otherwise set `tail.next = node` and then `tail = node`. Increment the counter.
      - `pop()`: if `head is None` return `-1`; otherwise remember `head.value`, set
        `head = head.next`, and if `head` became `None` also set `tail = None` (the queue is now
        empty and a stale `tail` would corrupt the next `push`). Decrement the counter and
        return the value.
      - `front()`: return `head.value`, or `-1` when `head is None`.
      - `size()`: return the counter.
      - `to_list()`: follow `next` from `head`, which already yields front-to-back order.

      The direction matters: removal must happen at `head`, because a singly linked list gives no
      way to reach the node before `tail` in O(1). If you also need removal at the back you have
      to upgrade to a doubly linked list.

      Every operation except the traversal is O(1) worst case, so a sequence of `q` operations
      costs O(q) plus the total length of the printed lists, with exactly one node of memory per
      stored element.
