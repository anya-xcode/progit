  - slug: lru-cache
    title: "LRU Cache"
    difficulty: Medium
    topic: "Stack and Queue"
    subtopic: "Implementation"
    tags: ["design", "hashing", "linked-list"]
    sourceUrl: "https://leetcode.com/problems/lru-cache/"
    statement: |
      Design a key-value cache with a fixed `capacity` that evicts the **least recently
      used** entry when it runs out of room.

      Implement the class `LRUCache`:

      - `LRUCache(capacity)` - create an empty cache that holds at most `capacity`
        entries.
      - `get(key)` - if `key` is present, return its value and mark the entry as the
        most recently used; otherwise return `-1`.
      - `put(key, value)` - if `key` is present, overwrite its value; otherwise insert it.
        Either way the entry becomes the most recently used. If inserting a new key makes
        the cache exceed `capacity`, first remove the entry that was used least recently.

      Both a successful `get` and any `put` count as a "use". A `get` for a missing key
      changes nothing. Both operations must run in **O(1)** average time.
    inputFormat: |
      - Line 1: two integers `capacity` and `q`, the number of operations.
      - Next `q` lines: one operation each, either `get key` or `put key value`.
    outputFormat: |
      For every `get` operation print the returned value on its own line, in operation
      order.
    constraints:
      - "1 <= capacity <= 1000"
      - "1 <= q <= 2000"
      - "0 <= key <= 10^4"
      - "0 <= value <= 10^5"
    examples:
      - input: |
          2 7
          put 1 10
          put 2 20
          get 1
          put 3 30
          get 2
          get 3
          get 1
        output: |
          10
          -1
          30
          10
        explanation: "get 1 makes key 1 more recent than key 2, so inserting key 3 evicts key 2. Keys 1 and 3 remain."
      - input: |
          1 5
          put 7 1
          put 7 2
          get 7
          put 8 3
          get 7
        output: |
          2
          -1
        explanation: "Updating key 7 does not add an entry. Inserting key 8 into a cache of capacity 1 evicts key 7."
    hints:
      - "A hash map gives O(1) lookup, but it does not tell you which key was used least recently."
      - "You need an ordering that supports: move an entry to the most-recent end, and remove from the least-recent end - both in O(1)."
      - "Combine a hash map from key to node with a doubly linked list ordered by recency. Sentinel head and tail nodes remove edge cases."
    explanation: |
      **List of keys with timestamps - O(capacity) per operation.** Store entries with a
      "last used" counter and scan for the smallest counter when evicting, or keep keys
      in a Python list and use `remove`/`append` to reorder. Simple, but linear time.

      **Hash map + doubly linked list - O(1) per operation, O(capacity) space.** Keep the
      nodes in a doubly linked list ordered from least recently used (just after the
      `head` sentinel) to most recently used (just before the `tail` sentinel), and a map
      `key -> node`.

      - `get`: look the node up; if found, unlink it and re-insert it before `tail`, then
        return its value.
      - `put`: if the key exists, update the value and move the node to the end.
        Otherwise, if the cache is full, remove the node right after `head` and delete its
        key from the map; then create a node, insert it before `tail` and store it in the
        map.

      Unlinking and inserting a node only touch its neighbours, so everything is O(1).
      (Python's `OrderedDict` with `move_to_end` and `popitem(last=False)` implements the
      same idea.)
