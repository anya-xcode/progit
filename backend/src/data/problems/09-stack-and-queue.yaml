  - slug: asteroid-collision
    title: "Asteroid Collision"
    difficulty: Medium
    topic: "Stack and Queue"
    subtopic: "Monotonic Stack"
    tags: ["stack", "array", "simulation"]
    sourceUrl: "https://leetcode.com/problems/asteroid-collision/"
    statement: |
      A row of asteroids is described by the non-zero integers `asteroids[0..n-1]`,
      listed from left to right. The absolute value is the asteroid's size; the sign is
      its direction: positive moves **right**, negative moves **left**. All asteroids
      move at the same speed.

      Two asteroids collide only when a right-moving asteroid is somewhere to the left
      of a left-moving one and nothing is left between them. In a collision the smaller
      asteroid is destroyed; if both have the same size, both are destroyed. Asteroids
      moving in the same direction never meet.

      Report the asteroids that remain after all possible collisions, in left-to-right
      order.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated non-zero integers.
    outputFormat: |
      Print the surviving asteroids separated by spaces, left to right. Print an empty
      line if none survive.
    constraints:
      - "1 <= n <= 10^4"
      - "-1000 <= asteroids[i] <= 1000"
      - "asteroids[i] != 0"
    examples:
      - input: |
          5
          4 9 -6 2 -2
        output: |
          4 9
        explanation: "9 destroys -6. Then 2 and -2 have equal size and destroy each other. 4 and 9 both move right and never meet."
      - input: |
          4
          -3 5 -8 6
        output: |
          -3 -8 6
        explanation: "-3 moves left with nothing ahead of it. 5 meets -8 and is destroyed. 6 moves right with nothing to its right."
    hints:
      - "A collision can only happen between a right-mover and a left-mover that comes after it."
      - "Process asteroids left to right, keeping the survivors so far on a stack."
      - "When a left-mover arrives, keep destroying smaller right-movers on top of the stack. Stop when the stack top is a larger right-mover, an equal one (both die), or not a right-mover at all."
    explanation: |
      **Repeated simulation - O(n^2) time, O(n) space.** Find any adjacent pair
      `(positive, negative)`, resolve it, and repeat until no such pair remains.

      **Stack of survivors - O(n) time, O(n) space.** Scan left to right. A right-moving
      asteroid is simply pushed. For a left-moving asteroid `a`:

      - while the stack top is positive and smaller than `|a|`, pop it (it is destroyed);
      - if the top is positive and equal to `|a|`, pop it and discard `a`;
      - if the top is positive and larger, discard `a`;
      - otherwise (empty stack or negative top) push `a` - it flies away safely.

      The stack is exactly the list of survivors in order. Each asteroid is pushed and
      popped at most once.
