    referenceSolution:
      python: |
        import sys
        from collections import deque


        class QueueStack:
            def __init__(self) -> None:
                self.queue = deque()

            def push(self, x: int) -> None:
                self.queue.append(x)
                for _ in range(len(self.queue) - 1):
                    self.queue.append(self.queue.popleft())

            def pop(self) -> int:
                if not self.queue:
                    return -1
                return self.queue.popleft()

            def top(self) -> int:
                if not self.queue:
                    return -1
                return self.queue[0]

            def size(self) -> int:
                return len(self.queue)

            def is_empty(self) -> bool:
                return len(self.queue) == 0


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            q = int(lines[0].split()[0])
            stack = QueueStack()
            out = []
            for line in lines[1:1 + q]:
                parts = line.split()
                if not parts:
                    continue
                if parts[0] == "push":
                    stack.push(int(parts[1]))
                elif parts[0] == "pop":
                    out.append(str(stack.pop()))
                elif parts[0] == "top":
                    out.append(str(stack.top()))
                elif parts[0] == "size":
                    out.append(str(stack.size()))
                elif parts[0] == "isEmpty":
                    out.append("true" if stack.is_empty() else "false")
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
