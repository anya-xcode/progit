    referenceSolution:
      python: |
        import sys
        from collections import OrderedDict, defaultdict


        class LFUCache:
            def __init__(self, capacity: int) -> None:
                self.capacity = capacity
                self.values = {}
                self.counters = {}
                self.buckets = defaultdict(OrderedDict)
                self.min_counter = 0

            def _touch(self, key: int) -> None:
                count = self.counters[key]
                del self.buckets[count][key]
                if not self.buckets[count]:
                    del self.buckets[count]
                    if self.min_counter == count:
                        self.min_counter = count + 1
                self.counters[key] = count + 1
                self.buckets[count + 1][key] = None

            def get(self, key: int) -> int:
                if key not in self.values:
                    return -1
                self._touch(key)
                return self.values[key]

            def put(self, key: int, value: int) -> None:
                if self.capacity <= 0:
                    return
                if key in self.values:
                    self.values[key] = value
                    self._touch(key)
                    return
                if len(self.values) >= self.capacity:
                    victim, _ = self.buckets[self.min_counter].popitem(last=False)
                    if not self.buckets[self.min_counter]:
                        del self.buckets[self.min_counter]
                    del self.values[victim]
                    del self.counters[victim]
                self.values[key] = value
                self.counters[key] = 1
                self.buckets[1][key] = None
                self.min_counter = 1


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            capacity, q = (int(x) for x in lines[0].split())
            cache = LFUCache(capacity)
            out = []
            for line in lines[1:1 + q]:
                parts = line.split()
                if not parts:
                    continue
                if parts[0] == "get":
                    out.append(str(cache.get(int(parts[1]))))
                elif parts[0] == "put":
                    cache.put(int(parts[1]), int(parts[2]))
            sys.stdout.write("\n".join(out) + "\n")


        if __name__ == "__main__":
            main()
