      python: |
        import sys
        from typing import List


        def _sum_of_extremes(nums: List[int], take_minimum: bool) -> int:
            n = len(nums)
            previous = [-1] * n
            following = [n] * n
            stack: List[int] = []
            for i in range(n):
                while stack and (nums[stack[-1]] >= nums[i] if take_minimum else nums[stack[-1]] <= nums[i]):
                    stack.pop()
                previous[i] = stack[-1] if stack else -1
                stack.append(i)
            stack.clear()
            for i in range(n - 1, -1, -1):
                while stack and (nums[stack[-1]] > nums[i] if take_minimum else nums[stack[-1]] < nums[i]):
                    stack.pop()
                following[i] = stack[-1] if stack else n
                stack.append(i)
            total = 0
            for i in range(n):
                total += nums[i] * (i - previous[i]) * (following[i] - i)
            return total


        def sum_subarray_ranges(nums: List[int]) -> int:
            return _sum_of_extremes(nums, False) - _sum_of_extremes(nums, True)


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            n = int(data[0])
            nums = [int(x) for x in data[1:1 + n]]
            print(sum_subarray_ranges(nums))


        if __name__ == "__main__":
            main()
