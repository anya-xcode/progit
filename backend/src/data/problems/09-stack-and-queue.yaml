    referenceSolution:
      python: |
        import sys


        class MyQueue:
            def __init__(self):
                self.in_stack = []
                self.out_stack = []

            def _shift(self) -> None:
                if not self.out_stack:
                    while self.in_stack:
                        self.out_stack.append(self.in_stack.pop())

            def push(self, x: int) -> None:
                self.in_stack.append(x)

            def pop(self) -> int:
                self._shift()
                return self.out_stack.pop()

            def peek(self) -> int:
                self._shift()
                return self.out_stack[-1]

            def empty(self) -> bool:
                return not self.in_stack and not self.out_stack


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            q = int(lines[0])
            queue = MyQueue()
            out = []
            for line in lines[1:1 + q]:
                parts = line.split()
                if parts[0] == "push":
                    queue.push(int(parts[1]))
                elif parts[0] == "pop":
                    out.append(str(queue.pop()))
                elif parts[0] == "peek":
                    out.append(str(queue.peek()))
                elif parts[0] == "empty":
                    out.append("true" if queue.empty() else "false")
            print("\n".join(out))


        if __name__ == "__main__":
            main()
