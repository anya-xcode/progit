  - sheetId: prob-9-1-2-implement-queue-using-arr
    slug: implement-queue-using-arrays
    title: "Implement Queue using Arrays"
    difficulty: Easy
    topic: "Stack and Queue"
    subtopic: "Learning"
    tags: ["queue", "array", "design"]
    sourceUrl: "https://www.geeksforgeeks.org/problems/implement-queue-using-array/1"
    statement: |
      A **queue** is a first-in-first-out container: elements leave in the same order in which
      they arrived. Build one on top of a plain array, without using any ready-made queue type.

      Implement the class `ArrayQueue` with these operations, each of which must run in
      **O(1)** amortized time:

      - `push(x)` - add `x` at the back of the queue.
      - `pop()` - remove the element at the front and return it; return `-1` if the queue is
        empty.
      - `front()` - return the element at the front without removing it; return `-1` if the
        queue is empty.
      - `size()` - return how many elements the queue currently holds.
      - `is_empty()` - return whether the queue holds no elements.

      Because every stored value is non-negative, the sentinel `-1` can never be confused with
      a real element.
    inputFormat: |
      - Line 1: an integer `q`, the number of operations.
      - Next `q` lines: one operation each, written as one of

        - `push x`
        - `pop`
        - `front`
        - `size`
        - `isEmpty`
    outputFormat: |
      Print one line for every operation that returns a value, in the order the operations are
      performed:

      - `pop` and `front` print the returned element, or `-1` when the queue is empty.
      - `size` prints an integer.
      - `isEmpty` prints `true` or `false`.

      `push` prints nothing.
    constraints:
      - "1 <= q <= 2000"
      - "0 <= x <= 10^9"
      - "Every operation name is exactly one of the names listed above."
    examples:
      - input: |
          7
          push 5
          push 12
          front
          pop
          front
          pop
          pop
        output: |
          5
          5
          12
          12
          -1
        explanation: "5 arrives first, so it sits at the front and is the first to leave. After it is removed, 12 becomes the front. The third pop finds an empty queue and reports -1."
      - input: |
          8
          isEmpty
          push 3
          push 3
          size
          pop
          size
          isEmpty
          front
        output: |
          true
          2
          3
          1
          false
          3
        explanation: "Two equal values are two separate elements, so size reports 2, and after one pop the queue still holds one 3 - it is not empty and its front is 3."
    hints:
      - "Removing the front element with a left shift costs O(n). Can you leave the elements where they are and move a pointer instead?"
      - "Keep two indices, `head` (the slot of the front element) and `tail` (the first free slot). `push` writes at `tail`, `pop` reads at `head`; the size is `tail - head`."
      - "Over many operations `head` keeps growing. Either wrap both indices around a fixed-size array (a circular buffer) or occasionally discard the consumed prefix - both keep the cost O(1) amortized."
    explanation: |
      **Shift on removal - O(n) per pop.** Keep the front at index `0`. `push` appends, `pop`
      returns index `0` and shifts everything else one slot left. Simple, but `q` operations
      cost up to O(q * n).

      **Two indices - O(1) amortized per operation.** Keep `head`, the index of the front
      element, and `tail`, the index just past the last element.

      - `push(x)`: write `x` at `tail` and increase `tail`.
      - `pop()`: if `head == tail` the queue is empty, return `-1`; otherwise read the slot at
        `head`, increase `head` and return the value.
      - `front()`: read the slot at `head` without moving anything.
      - `size()`: `tail - head`; `is_empty()`: `head == tail`.

      Each operation touches one slot and one counter, so all of them are O(1).

      **Reusing the space.** With plain growing indices the array keeps expanding even if the
      queue stays short. Two standard fixes:

      - *Circular buffer*: allocate a fixed capacity `C`, advance the indices modulo `C` and
        track the element count separately (so a full queue and an empty queue are
        distinguishable). Memory is exactly O(C).
      - *Prefix compaction*: once the consumed prefix is at least half of the array, drop it and
        reset `head` to `0`. Each element is copied at most O(1) times on average, so the cost
        stays O(1) amortized.

      Either way the whole sequence runs in O(q) time and O(n) memory, where `n` is the largest
      number of elements held at once.
