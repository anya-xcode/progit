    explanation: |
      **All ranges - O(n^2) time, O(1) space.** Fix the left end `i`, extend `j` to the
      right while tracking the running minimum, and update the best area.

      **Previous/next smaller arrays - O(n) time, O(n) space.** With two monotonic stack
      passes compute, for every bar, the index of the nearest strictly smaller bar on
      the left (`ps[i]`, or `-1`) and on the right (`ns[i]`, or `n`). The widest
      rectangle using `heights[i]` as its height has area
      `heights[i] * (ns[i] - ps[i] - 1)`; take the maximum.

      **Single-pass stack - O(n) time, O(n) space.** Keep indices with non-decreasing
      heights. When bar `i` is shorter than the top, pop `top`: its right limit is `i`
      and its left limit is the new stack top (or `-1`), so its area is
      `heights[top] * (i - left - 1)`. Appending a sentinel bar of height 0 at the end
      flushes the stack. Every index is pushed and popped once.
