  - slug: trapping-rain-water
    title: "Trapping Rain Water"
    difficulty: Hard
    topic: "Stack and Queue"
    subtopic: "Monotonic Stack"
    tags: ["stack", "two-pointers", "array"]
    sourceUrl: "https://leetcode.com/problems/trapping-rain-water/"
    statement: |
      An elevation map is given as `n` non-negative integers `height[0..n-1]`: bar `i`
      is a column of width 1 and height `height[i]`, and the bars stand next to each
      other.

      After heavy rain, water settles wherever it is enclosed by taller bars on both
      sides; anything past the first or last bar drains away. Compute the total number
      of unit squares of water that stay trapped.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the bar heights.
    outputFormat: |
      Print a single integer: the total units of trapped water.
    constraints:
      - "1 <= n <= 2 * 10^4"
      - "0 <= height[i] <= 10^5"
    examples:
      - input: |
          6
          3 0 2 0 4 1
        output: |
          7
        explanation: "Above bar 1 the water level is 3 (3 units), above bar 2 it is 3 (1 unit), above bar 3 it is 3 (3 units). Total 7."
      - input: |
          4
          1 2 3 4
        output: |
          0
        explanation: "The bars only rise, so there is no wall on the right to hold any water."
    hints:
      - "Water above bar i rises to min(tallest bar on its left, tallest bar on its right), including bar i itself."
      - "Precomputing prefix maximums and suffix maximums gives O(n) time with O(n) memory."
      - "Two pointers from both ends: the side with the smaller running maximum is the limiting wall, so you can settle that side and move inward. A stack of decreasing bars also works, filling water layer by layer."
    explanation: |
      **Per-bar scan - O(n^2) time, O(1) space.** For each bar find the tallest bar on
      each side by scanning, and add `min(left_max, right_max) - height[i]`.

      **Prefix and suffix maxima - O(n) time, O(n) space.** Precompute
      `left_max[i] = max(height[0..i])` and `right_max[i] = max(height[i..n-1])`, then sum
      `min(left_max[i], right_max[i]) - height[i]`.

      **Monotonic stack - O(n) time, O(n) space.** Keep indices of bars with decreasing
      heights. When a taller bar `i` arrives, pop the top `mid`; if a bar `left` remains
      below it, the water above `mid` bounded by `left` and `i` is
      `(min(height[left], height[i]) - height[mid]) * (i - left - 1)`. This fills water
      in horizontal layers.

      **Two pointers - O(n) time, O(1) space.** Keep `l`, `r`, and running maxima
      `left_max`, `right_max`. If `height[l] < height[r]`, the right side is guaranteed
      to have a wall at least as tall as `height[l]`, so the water at `l` is decided by
      `left_max`: update it, add `left_max - height[l]`, and move `l` right. Otherwise
      do the symmetric step on the right.
    starterCode:
      python: |
        import sys
        from typing import List


        def trap(height: List[int]) -> int:
            # Return the total units of water trapped between the bars.
            pass


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            height = [int(x) for x in data[1:1 + n]]
            print(trap(height))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys
        from typing import List


        def trap(height: List[int]) -> int:
            left, right = 0, len(height) - 1
            left_max = right_max = 0
            water = 0
            while left < right:
                if height[left] < height[right]:
                    left_max = max(left_max, height[left])
                    water += left_max - height[left]
                    left += 1
                else:
                    right_max = max(right_max, height[right])
                    water += right_max - height[right]
                    right -= 1
            return water


        # --- Input/output handling ---
        def main():
            data = sys.stdin.read().split()
            n = int(data[0])
            height = [int(x) for x in data[1:1 + n]]
            print(trap(height))


        if __name__ == "__main__":
            main()
