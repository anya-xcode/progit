    statement: |
      For an array `nums` of `n` positive integers, consider every one of its `n * (n + 1) / 2`
      non-empty contiguous subarrays and take the **minimum** of each one. Add all of those
      minima together.

      The total can be enormous, so print it **modulo 1000000007**.
    inputFormat: |
      - Line 1: an integer `n`, the length of the array.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print a single integer: the sum of the minima of all contiguous subarrays, taken modulo
      `1000000007`.
    constraints:
      - "1 <= n <= 3 * 10^4"
      - "1 <= nums[i] <= 10^9"
    examples:
      - input: |
          4
          3 1 2 4
        output: |
          17
        explanation: "The ten subarrays have minima 3, 1, 1, 1, 1, 1, 1, 2, 2 and 4: [3]=3, [3,1]=1, [3,1,2]=1, [3,1,2,4]=1, [1]=1, [1,2]=1, [1,2,4]=1, [2]=2, [2,4]=2, [4]=4. They add up to 17."
      - input: |
          2
          5 5
        output: |
          15
        explanation: "The subarrays are [5], [5] and [5,5], whose minima are 5, 5 and 5, giving 15."
    hints:
      - "Enumerating subarrays is O(n^2). Turn the question around: instead of asking 'what is the minimum of this subarray?', ask 'for how many subarrays is nums[i] the minimum?'."
      - "If nums[i] is the minimum of a subarray, the subarray may extend left until it would include a smaller element, and right until the same happens. Count left * right such subarrays."
      - "Equal values would be counted twice. Break the tie by making one side use a strict comparison and the other a non-strict one - for example previous strictly smaller and next smaller-or-equal."
    explanation: |
      **Brute force - O(n^2) time.** Fix the left end and extend the right end while keeping a
      running minimum; add it each step. About 4.5 * 10^8 additions at `n = 3 * 10^4`, far too
      slow.

      **Contribution counting with a monotonic stack - O(n) time, O(n) space.** Every subarray
      has exactly one "responsible" element, so instead of summing over subarrays, sum over
      elements:

      ```
      answer = sum over i of nums[i] * (number of subarrays whose minimum is nums[i])
      ```

      For index `i`, let

      - `left[i]` = index of the **previous strictly smaller** element (or `-1`),
      - `right[i]` = index of the **next smaller-or-equal** element (or `n`).

      Then any subarray that starts in `(left[i], i]` and ends in `[i, right[i])` has `nums[i]`
      as its minimum, and there are `(i - left[i]) * (right[i] - i)` of them. So

      ```
      answer = sum over i of nums[i] * (i - left[i]) * (right[i] - i)   (mod 1000000007)
      ```

      **Why the asymmetric comparisons.** With a block of equal values such as `[2, 2]`, using
      "strictly smaller" on both sides would let both copies claim the subarray `[2, 2]`, and
      using "smaller or equal" on both sides would let neither claim it. Making exactly one side
      non-strict assigns each subarray to precisely one index - the leftmost minimum if the
      right side is the non-strict one.

      Both boundary arrays come from one sweep each with a monotonic stack (pop while the top is
      not smaller than the current value), so every element is pushed and popped once: O(n) time
      and O(n) space. Reduce modulo `1000000007` as you accumulate; the per-term product fits in
      64-bit before the reduction.
