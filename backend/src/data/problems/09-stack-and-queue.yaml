    referenceSolution:
      python: |
        import sys
        from typing import List


        def greater_to_the_right(nums: List[int]) -> List[int]:
            n = len(nums)
            order = sorted(set(nums))
            rank = {value: i + 1 for i, value in enumerate(order)}
            m = len(order)
            tree = [0] * (m + 1)

            def add(position: int) -> None:
                while position <= m:
                    tree[position] += 1
                    position += position & -position

            def prefix(position: int) -> int:
                total = 0
                while position > 0:
                    total += tree[position]
                    position -= position & -position
                return total

            counts = [0] * n
            seen = 0
            for i in range(n - 1, -1, -1):
                r = rank[nums[i]]
                counts[i] = seen - prefix(r)
                add(r)
                seen += 1
            return counts


        # --- Input/output handling ---
        def main():
            data = sys.stdin.buffer.read().split()
            n, q = int(data[0]), int(data[1])
            nums = [int(x) for x in data[2:2 + n]]
            queries = [int(x) for x in data[2 + n:2 + n + q]]
            counts = greater_to_the_right(nums)
            sys.stdout.write("\n".join(str(counts[i]) for i in queries) + "\n")


        if __name__ == "__main__":
            main()
