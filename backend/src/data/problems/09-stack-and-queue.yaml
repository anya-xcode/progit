  - slug: next-greater-element
    title: "Next Greater Element"
    difficulty: Medium
    topic: "Stack and Queue"
    subtopic: "Monotonic Stack"
    tags: ["stack", "monotonic-stack", "array"]
    sourceUrl: ""
    statement: |
      For every position `i` of the array `nums`, find the **next greater element**:
      the first value to the **right** of position `i` that is **strictly greater**
      than `nums[i]`. If no such value exists, the answer for that position is `-1`.

      The array is not circular - elements to the left of `i` are never considered.
    inputFormat: |
      - Line 1: an integer `n`.
      - Line 2: `n` space-separated integers, the array `nums`.
    outputFormat: |
      Print `n` integers separated by spaces: the next greater element for each
      position, in order.
    constraints:
      - "1 <= n <= 10^4"
      - "0 <= nums[i] <= 10^9"
    examples:
      - input: |
          5
          6 2 5 9 1
        output: |
          9 5 9 -1 -1
        explanation: "For 6 the first larger value to its right is 9; for 2 it is 5; for 5 it is 9; nothing to the right of 9 or 1 is larger."
      - input: |
          4
          3 3 3 4
        output: |
          4 4 4 -1
        explanation: "Equal values do not count as greater, so each 3 must look all the way to 4."
    hints:
      - "Two nested loops answer each position in O(n), giving O(n^2) overall."
      - "Scan from right to left and keep a stack of candidates. Which candidates can never be an answer again once you see a bigger value?"
      - "Before answering for nums[i], pop every stack value <= nums[i]. The remaining top (if any) is the answer; then push nums[i]."
    explanation: |
      **Brute force - O(n^2) time, O(1) extra space.** For each `i`, scan `j = i + 1 ...`
      until a larger value appears.

      **Monotonic stack, right to left - O(n) time, O(n) space.** Process indices from
      the end. Maintain a stack whose values strictly decrease from bottom to top. For
      `nums[i]`, pop while the top is `<= nums[i]`: those values are hidden behind
      `nums[i]` for everything further left, so they can never be answers again. The
      top afterwards (or `-1` if empty) is the answer, then push `nums[i]`. Each element
      is pushed and popped at most once.

      An equivalent left-to-right version keeps indices still waiting for an answer and
      resolves them whenever a larger value arrives.
