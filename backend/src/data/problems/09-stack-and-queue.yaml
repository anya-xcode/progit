  - slug: min-stack
    title: "Min Stack"
    difficulty: Hard
    topic: "Stack and Queue"
    subtopic: "Implementation"
    tags: ["stack", "design"]
    sourceUrl: "https://leetcode.com/problems/min-stack/"
    statement: |
      Design a stack that, in addition to the usual operations, can report the
      smallest element it currently holds. Every operation must run in **O(1)** time.

      Implement the class `MinStack`:

      - `push(val)` - place `val` on top of the stack.
      - `pop()` - remove the top element.
      - `top()` - return the top element.
      - `get_min()` - return the minimum element in the stack.

      `pop`, `top` and `get_min` are only called when the stack is non-empty.
    inputFormat: |
      - Line 1: an integer `q`, the number of operations.
      - Next `q` lines: one operation each, one of `push x`, `pop`, `top` or `getMin`.
    outputFormat: |
      For every `top` and `getMin` operation, print the returned value on its own line,
      in the order the operations appear.
    constraints:
      - "1 <= q <= 2000"
      - "-2^31 <= x <= 2^31 - 1"
      - "`pop`, `top` and `getMin` are never called on an empty stack."
    examples:
      - input: |
          7
          push 4
          push 2
          push 7
          getMin
          pop
          pop
          getMin
        output: |
          2
          4
        explanation: "After pushing 4, 2, 7 the minimum is 2. Popping 7 and then 2 leaves only 4, so the minimum becomes 4."
      - input: |
          5
          push -1
          push -1
          top
          pop
          getMin
        output: |
          -1
          -1
        explanation: "Duplicates matter: after one -1 is popped the other -1 is still the minimum."
    hints:
      - "Scanning the whole stack for `getMin` is O(n). What could you store at push time to avoid that?"
      - "The minimum of the stack only depends on the element being pushed and the minimum just before it."
      - "Store pairs (value, minimum so far) on a single stack - or keep a second stack of running minimums."
    explanation: |
      **Scan on demand - O(1) push/pop/top, O(n) getMin.** Keep a plain list and compute
      the minimum by scanning when asked.

      **Pairs of (value, current minimum) - O(1) for every operation, O(n) space.** When
      pushing `val`, also store `min(val, previous minimum)`. The top pair always holds
      the minimum of the whole stack, and popping restores the previous minimum
      automatically because it is stored in the pair below.

      **Encoded values - O(1) per operation, O(1) extra space besides the stack.** Keep a
      single `min` variable. When pushing a value smaller than `min`, push
      `2 * val - min` (a marker smaller than `val`) and set `min = val`. When popping a
      marker (a value smaller than `min`), recover the old minimum as
      `2 * min - marker`. This avoids storing a second number per element, at the cost
      of trickier code and possible overflow in fixed-width languages.
    starterCode:
      python: |
        import sys


        class MinStack:
            def __init__(self):
                # Initialise your data structure here.
                pass

            def push(self, val: int) -> None:
                pass

            def pop(self) -> None:
                pass

            def top(self) -> int:
                pass

            def get_min(self) -> int:
                pass


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            q = int(lines[0])
            stack = MinStack()
            out = []
            for line in lines[1:1 + q]:
                parts = line.split()
                if parts[0] == "push":
                    stack.push(int(parts[1]))
                elif parts[0] == "pop":
                    stack.pop()
                elif parts[0] == "top":
                    out.append(str(stack.top()))
                elif parts[0] == "getMin":
                    out.append(str(stack.get_min()))
            print("\n".join(out))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        class MinStack:
            def __init__(self):
                self.items = []

            def push(self, val: int) -> None:
                current_min = val if not self.items else min(val, self.items[-1][1])
                self.items.append((val, current_min))

            def pop(self) -> None:
                self.items.pop()

            def top(self) -> int:
                return self.items[-1][0]

            def get_min(self) -> int:
                return self.items[-1][1]


        # --- Input/output handling ---
        def main():
            lines = sys.stdin.read().split("\n")
            q = int(lines[0])
            stack = MinStack()
            out = []
            for line in lines[1:1 + q]:
                parts = line.split()
                if parts[0] == "push":
                    stack.push(int(parts[1]))
                elif parts[0] == "pop":
                    stack.pop()
                elif parts[0] == "top":
                    out.append(str(stack.top()))
                elif parts[0] == "getMin":
                    out.append(str(stack.get_min()))
            print("\n".join(out))


        if __name__ == "__main__":
            main()
