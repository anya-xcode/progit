      - input: |
          x
        expectedOutput: |
          x
        hidden: true
      - input: |
          ---abcd
        expectedOutput: |
          ab-c-d-
        hidden: true
      - input: |
          +a*bc
        expectedOutput: |
          abc*+
        hidden: true
      - input: |
          +1*23
        expectedOutput: |
          123*+
        hidden: true
