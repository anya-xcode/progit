  - sheetId: prob-9-2-5-postfix-to-infix-conversi
    slug: postfix-to-infix-conversion
    title: "Postfix to Infix Conversion"
    difficulty: Easy
    topic: "Stack"
    subtopic: "Prefix, Infix, PostFix Conversion Problems"
    tags: ["stack", "strings", "expression"]
    sourceUrl: ""
    statement: |
      In **postfix** (reverse Polish) notation an operator is written *after*
      its two operands (`ab+`), which is why the form needs no brackets. Rewrite
      a postfix expression in ordinary **infix** notation.

      **Notation used everywhere in this sub-step**

      - Every **operand is a single character**: `a`-`z`, `A`-`Z` or `0`-`9`.
      - The **operators** are `+`, `-`, `*`, `/` and `^`, and every operator is
        binary.
      - **Precedence**, highest first: `^`, then `*` and `/`, then `+` and `-`;
        `^` is **right-associative** and the other four are left-associative.
        (These rules describe what an infix expression means; you do not need
        them to read postfix.)
      - There are **no spaces** in the input or the output.

      **How the infix answer must be bracketed.** So that exactly one answer is
      accepted, put a pair of brackets around **every single operator
      application**, including the outermost one: joining a left part `L` and a
      right part `R` with operator `op` is written `(L op R)`, even when
      precedence would make the brackets unnecessary. A lone operand is printed
      as itself with no brackets. For instance `abc*+` is printed as
      `(a+(b*c))`, not as `a+b*c`.
    inputFormat: |
      - A single line: the postfix expression (no spaces).
    outputFormat: |
      Print one line: the expression in infix notation, fully bracketed as
      described above, with no spaces.
    constraints:
      - "1 <= number of operands <= 2000"
      - "1 <= length of the input line <= 10000"
      - "Operands are single characters from a-z, A-Z, 0-9"
      - "Operators are + - * / ^"
      - "The input is a syntactically valid postfix expression"
    examples:
      - input: |
          ab+cd-*
        output: |
          ((a+b)*(c-d))
        explanation: >-
          `ab+` becomes `(a+b)` and `cd-` becomes `(c-d)`. The final `*` joins
          the two, adding the outermost pair of brackets.
      - input: |
          abc*+
        output: |
          (a+(b*c))
        explanation: >-
          `bc*` is completed first and becomes `(b*c)`; the trailing `+` then
          combines `a` with it, and that application is bracketed too.
    hints:
      - Postfix is what a stack machine consumes. Run the same machine, but push partly built strings instead of numbers.
      - Push each operand as a one-character string. An operator consumes the two most recent entries.
      - "The top of the stack was finished last, so it is the *right* operand. Push `\"(\" + left + op + right + \")\"` and never skip the brackets."
    explanation: |
      **Brute force — repeated rewriting, O(n²) time.** Scan for the first
      operator preceded by two plain operands, replace `x y op` by the single
      token `(x op y)`, and repeat. Each pass is O(n) and there are O(n)
      operators.

      **Stack, left to right — O(n) time, O(n) space.** Postfix is already in
      evaluation order, so one pass with a stack of strings is enough:

      - an operand is pushed as-is;
      - an operator pops two entries — the top is the **right** operand because
        it was completed most recently, the next pop is the **left** operand —
        and pushes `"(" + left + op + right + ")"`.

      A valid postfix expression ends with exactly one entry on the stack, which
      is the answer. Every character does O(1) stack work.

      **Why the brackets are required.** Dropping them would need precedence and
      associativity analysis (`ab+c*` is `(a+b)*c`, and the brackets there are
      genuinely needed), and different sensible rules give different strings.
      Bracketing every application makes the output a unique, unambiguous
      rendering of the expression tree. The string concatenations are O(n²)
      characters in the worst case; pushing fragment lists and joining once
      makes the whole conversion linear.
    starterCode:
      python: |
        import sys


        def postfix_to_infix(expression: str) -> str:
            # Return the fully bracketed infix form of the postfix expression.
            pass


        # --- Input/output handling ---
        def main():
            expression = sys.stdin.readline().strip()
            print(postfix_to_infix(expression))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def postfix_to_infix(expression: str) -> str:
            stack = []
            for ch in expression:
                if ch.isalnum():
                    stack.append(ch)
                else:
                    right = stack.pop()
                    left = stack.pop()
                    stack.append("(" + left + ch + right + ")")
            return stack.pop()


        # --- Input/output handling ---
        def main():
            expression = sys.stdin.readline().strip()
            print(postfix_to_infix(expression))


        if __name__ == "__main__":
            main()
