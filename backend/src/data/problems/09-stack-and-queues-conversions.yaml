        expectedOutput: |
          CfI-+Z/zcMu1m^/-+H+Fa*-Q^^-f^usKX+^*g2R+a//^yT/Om^X/-*^R/vWpdD+-/*GAP-/y^An/-*^
        hidden: true

  - sheetId: prob-9-2-4-postfix-to-prefix-convers
    slug: postfix-to-prefix-conversion
    title: "Postfix to Prefix Conversion"
    difficulty: Medium
    topic: "Stack"
    subtopic: "Prefix, Infix, PostFix Conversion Problems"
    tags: ["stack", "strings", "expression"]
    sourceUrl: ""
    statement: |
      **Postfix** notation writes an operator *after* its two operands (`ab+`)
      and **prefix** notation writes it *before* them (`+ab`). Rewrite a postfix
      expression in prefix notation.

      **Notation used everywhere in this sub-step**

      - Every **operand is a single character**: `a`-`z`, `A`-`Z` or `0`-`9`.
      - The **operators** are `+`, `-`, `*`, `/` and `^`, and every operator is
        binary.
      - **Precedence**, highest first: `^`, then `*` and `/`, then `+` and `-`;
        `^` is **right-associative**, the other four are left-associative. These
        rules are what the infix form of the expression would mean; in postfix
        and prefix the grouping is already determined by the token order, so no
        brackets appear.
      - There are **no spaces** and **no brackets** in the input or the output.

      Both notations describe the same expression tree, so the answer is unique.
    inputFormat: |
      - A single line: the postfix expression (no spaces).
    outputFormat: |
      Print one line: the same expression in prefix notation, with no spaces.
    constraints:
      - "1 <= number of operands <= 2000"
      - "1 <= length of the input line <= 10000"
      - "Operands are single characters from a-z, A-Z, 0-9"
      - "Operators are + - * / ^"
      - "The input is a syntactically valid postfix expression"
    examples:
      - input: |
          ab+cd-*
        output: |
          *+ab-cd
        explanation: >-
          Reading left to right, `ab+` completes the sum and `cd-` the
          difference; the final `*` combines them. Moving each operator in front
          of its two operands gives `*` `+ab` `-cd`.
      - input: |
          abc*+
        output: |
          +a*bc
        explanation: >-
          `bc*` is finished first and becomes `*bc`. The trailing `+` then
          applies to `a` and that product, so it moves to the front.
    hints:
      - Scan left to right. Every time you meet an operator, its two operands are the two most recently completed sub-expressions.
      - Keep a stack of finished prefix strings; push operands unchanged.
      - "Pop order matters: the first pop is the *right* operand (it was completed last) and the second is the *left* one. Push `op + left + right`."
    explanation: |
      **Brute force — repeated scanning, O(n²) time.** Find the leftmost
      operator whose two immediate predecessors are plain operands, replace that
      triple `x y op` by the single token `op x y`, and repeat until one token
      remains. Every pass is O(n) and there are O(n) operators.

      **Stack, left to right — O(n) time, O(n) space.** Postfix is exactly the
      order in which a stack machine evaluates the expression, so run that
      machine but push *strings* instead of numbers:

      - an operand is pushed as a one-character string;
      - an operator pops two entries. The top of the stack was completed most
        recently, so it is the **right** operand and the next pop is the
        **left** one. Push `op + left + right`.

      A valid postfix expression leaves exactly one string on the stack — the
      prefix answer. Each character causes O(1) stack work, so the pass is
      linear.

      **Care with the pop order.** Swapping the two pops produces
      `op + right + left`, which is wrong for `-`, `/` and `^` but accidentally
      right for `+` and `*`, so tests built only from commutative operators will
      not catch the bug. Concatenating strings costs O(n²) characters in the
      worst case; pushing fragment lists and joining once keeps it linear.
    starterCode:
      python: |
        import sys


        def postfix_to_prefix(expression: str) -> str:
            # Return the prefix form of the given postfix expression.
            pass


        # --- Input/output handling ---
        def main():
            expression = sys.stdin.readline().strip()
            print(postfix_to_prefix(expression))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys


        def postfix_to_prefix(expression: str) -> str:
            stack = []
            for ch in expression:
                if ch.isalnum():
                    stack.append(ch)
                else:
                    right = stack.pop()
                    left = stack.pop()
                    stack.append(ch + left + right)
            return stack.pop()


        # --- Input/output handling ---
        def main():
            expression = sys.stdin.readline().strip()
            print(postfix_to_prefix(expression))


        if __name__ == "__main__":
            main()
    testCases:
      - input: |
          ab+cd-*
        expectedOutput: |
          *+ab-cd
        hidden: false
      - input: |
          abc*+
        expectedOutput: |
          +a*bc
        hidden: false
      - input: |
          x
        expectedOutput: |
          x
        hidden: true
      - input: |
          abc^^
        expectedOutput: |
          ^a^bc
        hidden: true
      - input: |
          ab-c-d-
        expectedOutput: |
          ---abcd
        hidden: true
      - input: |
          123*+
        expectedOutput: |
          +1*23
        hidden: true
      - input: |
          pqr+^s*
        expectedOutput: |
          *^p+qrs
        hidden: true
      - input: |
          ab^cd^*e+
