  - sheetId: prob-9-2-6-infix-to-prefix-conversio
    slug: infix-to-prefix-conversion
    title: "Infix to Prefix Conversion"
    difficulty: Medium
    topic: "Stack"
    subtopic: "Prefix, Infix, PostFix Conversion Problems"
    tags: ["stack", "strings", "expression"]
    sourceUrl: ""
    statement: |
      In **infix** notation an operator sits between its two operands (`a+b`) and
      brackets and precedence decide the grouping. In **prefix** (Polish)
      notation the operator comes *before* its two operands (`+ab`), so no
      brackets are ever needed. Rewrite an infix expression in prefix notation.

      **Notation used everywhere in this sub-step**

      - Every **operand is a single character**: `a`-`z`, `A`-`Z` or `0`-`9`.
      - The **operators** are `+`, `-`, `*`, `/` and `^`, and every operator is
        binary.
      - **Precedence**, highest first: `^`, then `*` and `/`, then `+` and `-`.
      - `^` is **right-associative** (`a^b^c` means `a^(b^c)`); `+`, `-`, `*`
        and `/` are **left-associative** (`a-b-c` means `(a-b)-c`).
      - The infix input contains **no spaces** and is parenthesised **only where
        the brackets are needed**, so `a+b*c` never appears as `a+(b*c)`.

      The prefix form of a valid expression is unique. Print it with no spaces
      and no brackets.
    inputFormat: |
      - A single line: the infix expression (no spaces).
    outputFormat: |
      Print one line: the same expression in prefix notation, with no spaces and
      no brackets.
    constraints:
      - "1 <= number of operands <= 2000"
      - "1 <= length of the input line <= 10000"
      - "Operands are single characters from a-z, A-Z, 0-9"
      - "Operators are + - * / ^ ; brackets are ( and )"
      - "The input is a syntactically valid infix expression"
    examples:
      - input: |
          a+b*c
        output: |
          +a*bc
        explanation: >-
          `*` binds tighter, so the expression is `a+(b*c)`. The product becomes
          `*bc` and the top-level `+` moves in front of `a` and that product.
      - input: |
          (a+b)*(c-d)
        output: |
          *+ab-cd
        explanation: >-
          The brackets make `a+b` and `c-d` the two operands of `*`, so the
          answer is `*` followed by `+ab` and `-cd`.
    hints:
      - You already know how to turn infix into postfix with one operator stack. Can a mirrored version of the expression reuse that machinery?
      - Reverse the input and swap every `(` with `)`. Converting the reversed string to postfix and then reversing the result gives the prefix form.
      - "Reversing flips associativity: in the reversed pass `+ - * /` must behave as right-associative (do not pop an equal-precedence operator) while `^` must behave as left-associative (do pop one). Get this backwards and only chained same-precedence operators will be wrong."
    explanation: |
      **Brute force — repeatedly bracket the tightest operator, O(n²) time.**
      Find the operator that is applied first (highest precedence at the
      shallowest bracket depth, broken by associativity), replace `x op y` with
      the token `op x y`, and repeat until one token is left.

      **Two-pass conversion through postfix — O(n) time, O(n) space.** Parse the
      infix once into an expression tree (or into postfix with the shunting-yard
      algorithm), then emit the tree in prefix order. Concretely: run
      infix → postfix, then postfix → prefix with a stack of strings. Two linear
      passes, easy to trust because both halves are already familiar.

      **Mirrored shunting-yard — one pass, O(n) time, O(n) space.** Prefix read
      backwards looks like postfix of the mirrored expression, which gives the
      classic trick:

      1. Reverse the input string and swap `(` with `)`.
      2. Run the shunting-yard algorithm on that reversed string.
      3. Reverse the output.

      The one subtlety is associativity. Reversing turns a left-associative
      chain into a right-associative one and vice versa, so in step 2 the
      popping rule must be flipped: when the operator on top of the stack has
      the **same** precedence as the incoming one, pop it only if the incoming
      operator is `^`, and leave it for `+ - * /`. Higher-precedence operators
      are always popped, and `(` still acts as a barrier.

      Both linear approaches touch each character O(1) times. The brute force is
      only worth knowing as a sanity check on small inputs.
    starterCode:
      python: |
        import sys


        def infix_to_prefix(expression: str) -> str:
            # Return the prefix form of the given infix expression.
            pass


        # --- Input/output handling ---
        def main():
            expression = sys.stdin.readline().strip()
            print(infix_to_prefix(expression))


        if __name__ == "__main__":
            main()
    referenceSolution:
      python: |
        import sys

        PRECEDENCE = {"+": 1, "-": 1, "*": 2, "/": 2, "^": 3}


        def infix_to_prefix(expression: str) -> str:
            mirrored = [")" if ch == "(" else "(" if ch == ")" else ch for ch in reversed(expression)]
            output = []
            stack = []
            for ch in mirrored:
                if ch.isalnum():
                    output.append(ch)
                elif ch == "(":
                    stack.append(ch)
                elif ch == ")":
                    while stack and stack[-1] != "(":
                        output.append(stack.pop())
                    stack.pop()
                else:
                    while stack and stack[-1] != "(" and (
                        PRECEDENCE[stack[-1]] > PRECEDENCE[ch]
                        or (PRECEDENCE[stack[-1]] == PRECEDENCE[ch] and ch == "^")
                    ):
                        output.append(stack.pop())
                    stack.append(ch)
            while stack:
                output.append(stack.pop())
            return "".join(reversed(output))


        # --- Input/output handling ---
        def main():
            expression = sys.stdin.readline().strip()
            print(infix_to_prefix(expression))


        if __name__ == "__main__":
            main()
