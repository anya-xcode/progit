<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DSAForge — Practice DSA. Build Your GitHub." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>DSAForge</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem("dsaforge:settings") || "{}");
        if (saved.theme === "light") document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
