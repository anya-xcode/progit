# Render blueprint for the DSAForge API (free instance type).
# Render → New → Blueprint → pick this repository.
#
# The secrets are marked sync:false, so Render asks for them once in the UI
# instead of keeping them in git.
services:
  - type: web
    name: dsaforge-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI # your Atlas string, ending in /dsaforge
        sync: false
      - key: APP_ACCESS_KEY # the password the app asks for
        sync: false
      - key: GITHUB_TOKEN # fine-grained token with Contents: read and write
        sync: false
      - key: CLIENT_URL # https://your-app.vercel.app  (for CORS)
        sync: false
      - key: EXECUTION_PROVIDER
        value: namespace
      - key: SKIP_LIBRARY_SYNC
        value: "true"
      - key: EXECUTION_MAX_CONCURRENT
        value: "1"
